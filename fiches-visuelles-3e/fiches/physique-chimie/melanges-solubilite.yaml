notion: melanges-solubilite
titre: "Mélanges, dissolution et solubilité"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020) — BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027) — éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - id: formule
    type: formule
    expression: "[solubilité] = [m] / [V]"
    termes:
      "solubilité": {couleur: rouge, legende: "en g/L : ce qu'on peut dissoudre **au maximum** dans 1 L de solvant, à une **température donnée**"}
      m: {couleur: bleu, legende: "en g : la **masse maximale** de soluté dissoute juste avant que la solution soit **saturée**"}
      V: {couleur: vert, legende: "en L : le **volume de solvant** ; convertir d'abord les mL (1 L = 1 000 mL)"}
    jules: "La solubilité dépend du soluté, du solvant et de la **température**. Pourquoi faut-il toujours préciser la température ?"

  - id: carte
    type: carte
    noeuds:
      - {id: melange, titre: "Mélange", sous_titre: "plusieurs espèces chimiques", principal: true}
      - {id: homogene, titre: "Homogène", sous_titre: "un seul aspect à l'œil nu"}
      - {id: heterogene, titre: "Hétérogène", sous_titre: "constituants visibles"}
      - {id: dissolution, titre: "Dissolution", sous_titre: "soluté + solvant = solution"}
      - {id: air, titre: "L'air", sous_titre: "78 % N₂, 21 % O₂, 1 % autres"}
    liens:
      - {de: melange, vers: homogene}
      - {de: melange, vers: heterogene}
      - {de: melange, vers: dissolution}
      - {de: melange, vers: air}
    jules: "L'eau sucrée et l'air sont tous deux des **mélanges homogènes**. Qu'est-ce qui permet de le dire en les regardant ?"

  - id: schema
    type: schema
    titre: "Dissoudre jusqu'à saturation, et mélanger deux liquides"
    svg: "melanges-solubilite.svg"
    jules: "Dans le bécher du milieu, on ne voit plus le sel. A-t-il disparu, ou est-il seulement dispersé dans l'eau ?"

  - id: methode
    type: methode
    etapes:
      - "Observer le mélange : distingue-t-on plusieurs constituants ? Oui : **hétérogène**. Non : **homogène**."
      - "Pour deux liquides : une seule phase, ils sont **miscibles** ; deux couches, ils ne le sont pas (le liquide de plus faible **masse volumique** est au-dessus)."
      - "Pour une dissolution : repérer le **soluté** (ce qui est dissous) et le **solvant** (ce qui dissout)."
      - "Pour estimer une solubilité : ajouter le soluté par petites quantités pesées dans un volume d'eau connu, en agitant, jusqu'à ce qu'il **ne se dissolve plus**."
      - "Puis diviser la **masse dissoute** par le **volume de solvant** en litres, pour obtenir des g/L."
    jules: "À l'étape 5, un petit volume d'eau donne une petite masse dissoute : c'est en **ramenant à un litre** qu'on peut comparer."

  - id: piege
    type: piege
    mauvaise_idee: "Le sel **disparaît** quand il se dissout dans l'eau, donc sa masse ne compte plus."
    pourquoi_faux: "Le sel est toujours là (l'eau est salée) : il est seulement **dispersé** dans l'eau en particules invisibles."
    bonne_idee: "La **masse se conserve** lors d'une dissolution : masse de la solution = masse du solvant + masse du soluté dissous."
    jules: "Goûter l'eau salée (en cuisine, pas au labo) prouve que le sel est encore là. Que dirait une balance ?"

  - id: exemple
    type: exemple
    situation: "À 20 °C, on arrive à dissoudre au maximum 40 g de sucre dans 20 mL d'eau. Quelle est la solubilité du sucre dans l'eau à cette température ?"
    calcul: "20 mL = 0,020 L. Solubilité = 40 g / 0,020 L = **2 000 g/L**."
    conclusion: "À 20 °C, on peut dissoudre environ **2 000 g** de sucre dans un litre d'eau."
    jules: "Vérifie autrement : dans 1 L, il y a 50 fois 20 mL. Combien de fois plus de sucre peut-on alors dissoudre ?"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à distinguer soluté, solvant et solution : trois mots proches pour trois rôles différents."
