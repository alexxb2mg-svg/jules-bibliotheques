<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<title>Trajet de la lumière de la lampe à l'œil</title>
<desc>Une lampe éclaire un livre ; le livre diffuse la lumière dans toutes les directions ; un des rayons diffusés entre dans l'œil.</desc>
<defs>
<marker id="fl-lum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#BA7517"/></marker>
</defs>
<g class="c-amber"><circle cx="80" cy="150" r="26" stroke-width="2"/>
<text class="th" x="80" y="150" text-anchor="middle" dominant-baseline="central">lampe</text>
<text class="th" x="80" y="205" text-anchor="middle">Source primaire</text>
<text class="ts" x="80" y="223" text-anchor="middle">produit sa lumière</text></g>
<line x1="108" y1="140" x2="306" y2="130" stroke="#BA7517" stroke-width="2" marker-end="url(#fl-lum)"/>
<line x1="108" y1="160" x2="306" y2="170" stroke="#BA7517" stroke-width="2" marker-end="url(#fl-lum)"/>
<text class="ts" x="205" y="118" text-anchor="middle">rayons lumineux</text>
<g class="c-gray"><rect x="310" y="110" width="60" height="80" rx="4" stroke-width="1.5"/>
<text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">livre</text>
<text class="th" x="340" y="215" text-anchor="middle">Objet diffusant</text>
<text class="ts" x="340" y="233" text-anchor="middle">renvoie la lumière reçue</text></g>
<line x1="372" y1="135" x2="448" y2="62" stroke="#BA7517" stroke-width="2" marker-end="url(#fl-lum)"/>
<line x1="372" y1="145" x2="480" y2="110" stroke="#BA7517" stroke-width="2" marker-end="url(#fl-lum)"/>
<line x1="372" y1="155" x2="566" y2="158" stroke="#BA7517" stroke-width="2" marker-end="url(#fl-lum)"/>
<line x1="372" y1="172" x2="468" y2="228" stroke="#BA7517" stroke-width="2" marker-end="url(#fl-lum)"/>
<text class="ts" x="462" y="54">diffusion dans</text>
<text class="ts" x="462" y="70">toutes les directions</text>
<path d="M570,158 Q603,130 636,158 Q603,186 570,158 Z" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/>
<circle cx="606" cy="158" r="9" fill="#1a1a18"/>
<text class="th" x="603" y="215" text-anchor="middle">Œil</text>
<text class="ts" x="603" y="233" text-anchor="middle">reçoit la lumière</text>
<g class="c-gray"><rect x="40" y="262" width="600" height="42" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="283" text-anchor="middle" dominant-baseline="central">Rayon lumineux : une droite fléchée, de la source vers l'œil, jamais l'inverse</text></g>
</svg>
