<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<text class="ts" x="340" y="24" text-anchor="middle">Même objet (même masse m), trois vitesses : hauteur de la barre = énergie cinétique</text>
<line x1="60" y1="290" x2="620" y2="290" stroke="#5F5E5A" stroke-width="1"/>
<g class="c-coral"><rect x="120" y="265" width="80" height="25" rx="3" stroke-width="0.5"/>
<text class="th" x="160" y="255" text-anchor="middle">Ec</text></g>
<g class="c-coral"><rect x="300" y="190" width="80" height="100" rx="3" stroke-width="0.5"/>
<text class="th" x="340" y="180" text-anchor="middle">4 × Ec</text></g>
<g class="c-coral"><rect x="480" y="65" width="80" height="225" rx="3" stroke-width="0.5"/>
<text class="th" x="520" y="55" text-anchor="middle">9 × Ec</text></g>
<text class="t" x="160" y="312" text-anchor="middle" fill="#185FA5">vitesse v</text>
<text class="t" x="340" y="312" text-anchor="middle" fill="#185FA5">vitesse 2 × v</text>
<text class="t" x="520" y="312" text-anchor="middle" fill="#185FA5">vitesse 3 × v</text>
<g class="c-gray"><rect x="40" y="328" width="600" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="348" text-anchor="middle" dominant-baseline="central">Vitesse × 2 → Ec × 4 ; vitesse × 3 → Ec × 9 ; masse × 2 → Ec × 2 seulement.</text></g>
</svg>
