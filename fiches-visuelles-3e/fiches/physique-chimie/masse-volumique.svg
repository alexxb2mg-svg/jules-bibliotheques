<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mesure de la masse et du volume d'un solide par déplacement d'eau">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<polygon points="96,236 101,214 119,204 141,210 146,236" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
<rect x="60" y="236" width="120" height="8" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<rect x="116" y="244" width="8" height="10" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<rect x="50" y="254" width="140" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="80" y="266" width="80" height="26" rx="3" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="120" y="279" text-anchor="middle" dominant-baseline="central">m</text>
<text class="th" x="120" y="330" text-anchor="middle" dominant-baseline="central">1. Peser l'objet</text>
<text class="ts" x="120" y="348" text-anchor="middle" dominant-baseline="central">la balance donne m</text>

<rect x="311" y="180" width="58" height="120" fill="#B5D4F4"/>
<path d="M310 50 L310 300 L370 300 L370 50" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="290" y="300" width="100" height="10" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<g stroke="#5F5E5A" stroke-width="1"><line x1="310" y1="80" x2="320" y2="80"/><line x1="310" y1="100" x2="316" y2="100"/><line x1="310" y1="120" x2="320" y2="120"/><line x1="310" y1="140" x2="316" y2="140"/><line x1="310" y1="160" x2="320" y2="160"/><line x1="310" y1="200" x2="320" y2="200"/><line x1="310" y1="220" x2="316" y2="220"/><line x1="310" y1="240" x2="320" y2="240"/><line x1="310" y1="260" x2="316" y2="260"/><line x1="310" y1="280" x2="320" y2="280"/></g>
<line x1="311" y1="180" x2="369" y2="180" stroke="#185FA5" stroke-width="2"/>
<g class="c-blue"><text class="th" x="380" y="180" text-anchor="start" dominant-baseline="central">V₁</text></g>
<text class="th" x="340" y="330" text-anchor="middle" dominant-baseline="central">2. Lire le niveau V₁</text>
<text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">eau seule</text>

<rect x="511" y="150" width="58" height="150" fill="#B5D4F4"/>
<polygon points="526,298 522,276 540,264 558,271 555,298" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1"/>
<path d="M510 50 L510 300 L570 300 L570 50" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="490" y="300" width="100" height="10" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>
<g stroke="#5F5E5A" stroke-width="1"><line x1="560" y1="80" x2="570" y2="80"/><line x1="564" y1="100" x2="570" y2="100"/><line x1="560" y1="120" x2="570" y2="120"/><line x1="564" y1="140" x2="570" y2="140"/><line x1="560" y1="160" x2="570" y2="160"/><line x1="564" y1="180" x2="570" y2="180"/><line x1="560" y1="200" x2="570" y2="200"/><line x1="564" y1="220" x2="570" y2="220"/><line x1="560" y1="240" x2="570" y2="240"/><line x1="564" y1="260" x2="570" y2="260"/><line x1="560" y1="280" x2="570" y2="280"/></g>
<line x1="511" y1="150" x2="569" y2="150" stroke="#185FA5" stroke-width="2"/>
<g class="c-blue"><text class="th" x="580" y="150" text-anchor="start" dominant-baseline="central">V₂</text></g>
<text class="th" x="540" y="330" text-anchor="middle" dominant-baseline="central">3. Plonger l'objet</text>
<text class="ts" x="540" y="348" text-anchor="middle" dominant-baseline="central">lire le nouveau niveau V₂</text>

<line x1="402" y1="180" x2="508" y2="180" class="leader"/>
<line x1="496" y1="152" x2="496" y2="178" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="488" y="158" text-anchor="end" dominant-baseline="central">volume de l'objet</text>
<text class="th" x="488" y="140" text-anchor="end" dominant-baseline="central">V₂ − V₁</text></g>

<g class="c-coral"><rect x="150" y="364" width="380" height="32" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="380" text-anchor="middle" dominant-baseline="central">ρ = m ÷ (V₂ − V₁)     avec 1 mL = 1 cm³</text></g>
</svg>
