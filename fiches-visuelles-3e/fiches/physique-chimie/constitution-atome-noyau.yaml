notion: constitution-atome-noyau
titre: "L'atome et son noyau"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020) — BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027) — éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - id: formule
    type: formule
    expression: "nombre de [neutrons] = nombre de [nucléons] − nombre de [protons]"
    termes:
      nucléons: {couleur: violet, legende: "toutes les particules du noyau : protons et neutrons ensemble"}
      protons: {couleur: rouge, legende: "particules du noyau chargées positivement ; leur nombre Z (numéro atomique) caractérise l'élément"}
      neutrons: {couleur: gris, legende: "particules du noyau sans charge électrique"}
      électrons: {couleur: bleu, legende: "particules chargées négativement, autour du noyau ; dans un atome, autant d'électrons que de protons"}
    jules: "Les nucléons comprennent déjà les protons. Que faut-il donc faire pour isoler les neutrons ?"

  - id: carte
    type: carte
    noeuds:
      - {id: atome, titre: "Atome", sous_titre: "électriquement neutre", principal: true}
      - {id: noyau, titre: "Noyau (+)", sous_titre: "au centre, presque toute la masse"}
      - {id: nucleons, titre: "Protons (+) et neutrons", sous_titre: "les nucléons"}
      - {id: electrons, titre: "Électrons (−)", sous_titre: "autour du noyau"}
    liens:
      - {de: atome, vers: noyau, libelle: "contient"}
      - {de: noyau, vers: nucleons, libelle: "formé de"}
      - {de: atome, vers: electrons, libelle: "contient"}
    jules: "Si l'atome est neutre alors que le noyau est positif, que peux-tu dire du nombre d'électrons ?"

  - id: schema
    type: schema
    titre: "Un atome (lithium) et le zoom sur son noyau"
    svg: "constitution-atome-noyau.svg"
    jules: "Compte les particules du zoom et celles autour du noyau. Quel lien vois-tu entre le nombre de protons et le nombre d'électrons ?"

  - id: methode
    type: methode
    etapes:
      - "Repérer ce que l'on connaît : nombre de protons (Z), nombre de nucléons, nombre d'électrons."
      - "Pour un atome : nombre d'électrons = nombre de protons (il est neutre)."
      - "Nombre de neutrons = nombre de nucléons − nombre de protons."
      - "Pour une question de charge : protons +, électrons −, neutrons sans charge."
    jules: "Commence toujours par le nombre de protons : c'est lui qui dit de quel élément il s'agit."

  - id: piege
    type: piege
    mauvaise_idee: "Pour trouver les neutrons, j'additionne les protons et les nucléons."
    pourquoi_faux: "Les nucléons, ce sont tous les protons ET tous les neutrons du noyau : les protons y sont déjà comptés."
    bonne_idee: "On retire les protons du total : nombre de neutrons = nombre de nucléons − nombre de protons."
    jules: "Vérifie ton résultat : le nombre de neutrons doit être plus petit que le nombre de nucléons."

  - id: exemple
    type: exemple
    situation: "Le noyau d'un atome d'aluminium contient 13 protons et 27 nucléons. Combien a-t-il de neutrons et d'électrons ?"
    calcul: "Neutrons : 27 − 13 = 14. L'atome est neutre, il a autant d'électrons que de protons : 13 électrons."
    conclusion: "L'atome d'aluminium a 13 protons et 14 neutrons dans son noyau, et 13 électrons autour."
    jules: "Contrôle : 13 protons + 14 neutrons, retrouves-tu bien le nombre de nucléons de l'énoncé ?"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à dire, pour chaque particule, où elle se trouve et quelle est sa charge."
