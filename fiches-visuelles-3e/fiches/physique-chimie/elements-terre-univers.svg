<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="t" x="340" y="24" text-anchor="middle">L'histoire des atomes</text>
<g class="c-purple"><rect x="14" y="40" width="120" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="74" y="60" text-anchor="middle" dominant-baseline="central">Big Bang</text>
<text class="ts" x="74" y="80" text-anchor="middle" dominant-baseline="central">il y a environ 13,8</text>
<text class="ts" x="74" y="96" text-anchor="middle" dominant-baseline="central">milliards d'années</text></g>
<g class="c-purple"><rect x="147" y="40" width="120" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="207" y="60" text-anchor="middle" dominant-baseline="central">H et He</text>
<text class="ts" x="207" y="80" text-anchor="middle" dominant-baseline="central">premiers noyaux :</text>
<text class="ts" x="207" y="96" text-anchor="middle" dominant-baseline="central">éléments légers</text></g>
<g class="c-amber"><rect x="280" y="40" width="120" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">Étoiles</text>
<text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">fusion : C, O, Si,</text>
<text class="ts" x="340" y="96" text-anchor="middle" dominant-baseline="central">Fe… (lourds)</text></g>
<g class="c-amber"><rect x="413" y="40" width="120" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="473" y="60" text-anchor="middle" dominant-baseline="central">Fin des étoiles</text>
<text class="ts" x="473" y="80" text-anchor="middle" dominant-baseline="central">éléments dispersés</text>
<text class="ts" x="473" y="96" text-anchor="middle" dominant-baseline="central">dans l'espace</text></g>
<g class="c-teal"><rect x="546" y="40" width="120" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="606" y="60" text-anchor="middle" dominant-baseline="central">Soleil, Terre</text>
<text class="ts" x="606" y="80" text-anchor="middle" dominant-baseline="central">nés d'un nuage</text>
<text class="ts" x="606" y="96" text-anchor="middle" dominant-baseline="central">enrichi</text></g>
<line x1="135" y1="76" x2="146" y2="76" class="arr" marker-end="url(#arrow)"/>
<line x1="268" y1="76" x2="279" y2="76" class="arr" marker-end="url(#arrow)"/>
<line x1="401" y1="76" x2="412" y2="76" class="arr" marker-end="url(#arrow)"/>
<line x1="534" y1="76" x2="545" y2="76" class="arr" marker-end="url(#arrow)"/>
<line x1="14" y1="140" x2="666" y2="140" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="660" y="158" text-anchor="end">temps</text>
<text class="t" x="340" y="200" text-anchor="middle">Abondance en masse : les mêmes éléments, pas dans les mêmes proportions</text>
<text class="th" x="20" y="252" dominant-baseline="central">Dans l'Univers</text>
<g class="c-purple"><rect x="190" y="234" width="333" height="36" stroke-width="1"/>
<text class="th" x="356" y="252" text-anchor="middle" dominant-baseline="central">hydrogène ≈ 74 %</text>
<rect x="523" y="234" width="108" height="36" stroke-width="1"/>
<text class="ts" x="577" y="252" text-anchor="middle" dominant-baseline="central">hélium ≈ 24 %</text></g>
<g class="c-amber"><rect x="631" y="234" width="9" height="36" stroke-width="1"/></g>
<line class="leader" x1="636" y1="272" x2="636" y2="290"/>
<text class="ts" x="640" y="304" text-anchor="end">tous les autres éléments</text>
<text class="th" x="20" y="352" dominant-baseline="central">Croûte terrestre</text>
<g class="c-amber"><rect x="190" y="334" width="207" height="36" stroke-width="1"/>
<text class="th" x="293" y="352" text-anchor="middle" dominant-baseline="central">oxygène ≈ 46 %</text>
<rect x="397" y="334" width="126" height="36" stroke-width="1"/>
<text class="ts" x="460" y="352" text-anchor="middle" dominant-baseline="central">silicium ≈ 28 %</text>
<rect x="523" y="334" width="117" height="36" stroke-width="1"/>
<text class="ts" x="581" y="352" text-anchor="middle" dominant-baseline="central">Al, Fe, autres…</text></g>
<g class="c-purple"><rect x="190" y="402" width="14" height="14" stroke-width="1"/></g>
<text class="ts" x="212" y="409" dominant-baseline="central">formés juste après le Big Bang</text>
<g class="c-amber"><rect x="420" y="402" width="14" height="14" stroke-width="1"/></g>
<text class="ts" x="442" y="409" dominant-baseline="central">fabriqués dans les étoiles</text>
</svg>
