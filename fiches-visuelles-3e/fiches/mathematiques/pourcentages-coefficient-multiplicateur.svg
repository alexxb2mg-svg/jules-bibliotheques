<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Évolution de t %</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">hausse ou baisse</text></g>
<line x1="340" y1="76" x2="180" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="76" x2="500" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="40" y="120" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="139" text-anchor="middle" dominant-baseline="central">CM = 1 + t ÷ 100</text>
<text class="ts" x="180" y="157" text-anchor="middle" dominant-baseline="central">hausse : CM &gt; 1</text></g>
<g class="node c-coral"><rect x="360" y="120" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="139" text-anchor="middle" dominant-baseline="central">CM = 1 − t ÷ 100</text>
<text class="ts" x="500" y="157" text-anchor="middle" dominant-baseline="central">baisse : 0 &lt; CM &lt; 1</text></g>
<line x1="180" y1="176" x2="340" y2="220" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="176" x2="340" y2="220" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="190" y="220" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="239" text-anchor="middle" dominant-baseline="central">VA = VD × CM</text>
<text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">valeur d'arrivée</text></g>
<line x1="340" y1="276" x2="340" y2="315" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="140" y="320" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="339" text-anchor="middle" dominant-baseline="central">Plusieurs évolutions</text>
<text class="ts" x="340" y="357" text-anchor="middle" dominant-baseline="central">on multiplie les CM entre eux</text></g>
</svg>
