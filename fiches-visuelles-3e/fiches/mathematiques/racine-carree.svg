<text class="ts" x="200" y="263" text-anchor="middle" dominant-baseline="central">carré parfait connu</text></g>
<g class="node c-amber"><rect x="370" y="226" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="245" text-anchor="middle" dominant-baseline="central">√2</text>
<text class="ts" x="480" y="263" text-anchor="middle" dominant-baseline="central">reste sous la racine</text></g>
