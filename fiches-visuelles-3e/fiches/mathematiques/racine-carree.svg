<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="220" y="20" width="240" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="45" text-anchor="middle" dominant-baseline="central">√72</text></g>
<line x1="340" y1="70" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="140" y="120" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="139" text-anchor="middle" dominant-baseline="central">72 = 36 × 2</text>
<text class="ts" x="340" y="157" text-anchor="middle" dominant-baseline="central">36 : le plus grand carré parfait qui divise 72</text></g>
<line x1="240" y1="176" x2="200" y2="216" class="arr" marker-end="url(#arrow)"/>
<line x1="440" y1="176" x2="480" y2="216" class="arr" marker-end="url(#arrow)"/>
