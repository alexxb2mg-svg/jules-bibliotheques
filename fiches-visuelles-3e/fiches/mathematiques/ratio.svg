<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Partager 35 € selon 3 : 4</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">entre Adam et Inès</text></g>
<line x1="340" y1="76" x2="340" y2="115" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="190" y="120" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="139" text-anchor="middle" dominant-baseline="central">3 + 4 = 7 parts</text>
<text class="ts" x="340" y="157" text-anchor="middle" dominant-baseline="central">nombre total de parts</text></g>
<line x1="340" y1="176" x2="340" y2="215" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="190" y="220" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="239" text-anchor="middle" dominant-baseline="central">1 part = 35 ÷ 7 = 5 €</text>
<text class="ts" x="340" y="257" text-anchor="middle" dominant-baseline="central">valeur d'une part</text></g>
<line x1="280" y1="276" x2="150" y2="310" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="276" x2="530" y2="310" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="20" y="315" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="334" text-anchor="middle" dominant-baseline="central">Adam : 3 × 5 = 15 €</text>
<text class="ts" x="150" y="352" text-anchor="middle" dominant-baseline="central">3 parts</text></g>
<g class="node c-green"><rect x="400" y="315" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="334" text-anchor="middle" dominant-baseline="central">Inès : 4 × 5 = 20 €</text>
<text class="ts" x="530" y="352" text-anchor="middle" dominant-baseline="central">4 parts</text></g>
</svg>
