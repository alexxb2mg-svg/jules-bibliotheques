<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-blue"><rect x="40" y="40" width="260" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="62" text-anchor="middle" dominant-baseline="central">Vitesse en km/h</text>
<text class="ts" x="170" y="84" text-anchor="middle" dominant-baseline="central">ex. : 54 km/h</text></g>
<g class="node c-teal"><rect x="380" y="40" width="260" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="62" text-anchor="middle" dominant-baseline="central">Vitesse en m/s</text>
<text class="ts" x="510" y="84" text-anchor="middle" dominant-baseline="central">ex. : 15 m/s</text></g>
<line x1="300" y1="60" x2="380" y2="60" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="90" x2="300" y2="90" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="52" text-anchor="middle">÷ 3,6</text>
<text class="ts" x="340" y="102" text-anchor="middle">× 3,6</text>
<g class="node c-gray"><rect x="40" y="150" width="600" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="180" text-anchor="middle" dominant-baseline="central">1 m/s = 3 600 m/h = 3,6 km/h (car 1 h = 3 600 s et 1 km = 1 000 m)</text></g>
<g class="node c-amber"><rect x="40" y="230" width="600" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="252" text-anchor="middle" dominant-baseline="central">Durées : jamais décimales directement</text>
<text class="ts" x="340" y="274" text-anchor="middle" dominant-baseline="central">2 h 15 min = 2 + 15 ÷ 60 = 2,25 h (pas 2,15 h)</text>
<text class="ts" x="340" y="296" text-anchor="middle" dominant-baseline="central">45 min = 45 ÷ 60 = 0,75 h</text></g>
<g class="node c-purple"><rect x="40" y="330" width="600" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="350" text-anchor="middle" dominant-baseline="central">Toujours vérifier l'unité du résultat : distance ÷ durée = vitesse</text></g>
</svg>
