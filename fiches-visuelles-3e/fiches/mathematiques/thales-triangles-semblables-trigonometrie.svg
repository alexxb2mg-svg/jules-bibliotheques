<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="175" y="20" text-anchor="middle">Triangles emboîtés</text>
<text class="th" x="505" y="20" text-anchor="middle">Papillon</text>
<text class="ts" x="340" y="44" text-anchor="middle" fill="#666">(MN) et (BC) parallèles</text>

<polygon points="170,60 50,330 300,330" fill="none" stroke="#7c3aed" stroke-width="2"/>
<polygon points="170,60 130,150 213.3,150" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<line x1="130" y1="150" x2="213.3" y2="150" stroke="#0d9488" stroke-width="3"/>
<text class="t" x="170" y="52" text-anchor="middle">A</text>
<text class="t" x="120" y="154" text-anchor="end">M</text>
<text class="t" x="222" y="154" text-anchor="start">N</text>
<text class="t" x="42" y="344" text-anchor="end">B</text>
<text class="t" x="308" y="344" text-anchor="start">C</text>
<text class="ts" x="140" y="100" text-anchor="end" fill="#0f766e">AM = 3</text>
<text class="ts" x="80" y="244" text-anchor="end" fill="#6d28d9">AB = 9</text>
<text class="ts" x="172" y="172" text-anchor="middle" fill="#0f766e">MN = ?</text>
<text class="ts" x="175" y="350" text-anchor="middle" fill="#6d28d9">BC = 12</text>

<line x1="565" y1="100" x2="415" y2="325" stroke="#444" stroke-width="1.5"/>
<line x1="445" y1="100" x2="595" y2="325" stroke="#444" stroke-width="1.5"/>
<line x1="445" y1="100" x2="565" y2="100" stroke="#0d9488" stroke-width="3"/>
<line x1="415" y1="325" x2="595" y2="325" stroke="#7c3aed" stroke-width="3"/>
<text class="t" x="522" y="194" text-anchor="start">A</text>
<text class="t" x="575" y="96" text-anchor="start">M</text>
<text class="t" x="435" y="96" text-anchor="end">N</text>
<text class="t" x="405" y="340" text-anchor="end">B</text>
<text class="t" x="605" y="340" text-anchor="start">C</text>
<text class="ts" x="548" y="150" text-anchor="start" fill="#0f766e">AM = 4</text>
<text class="ts" x="448" y="262" text-anchor="end" fill="#6d28d9">AB = 6</text>
<text class="ts" x="505" y="88" text-anchor="middle" fill="#0f766e">MN = ?</text>
<text class="ts" x="505" y="345" text-anchor="middle" fill="#6d28d9">BC = 9</text>

<g class="node c-teal"><rect x="20" y="368" width="310" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="175" y="387" text-anchor="middle" dominant-baseline="central">MN ÷ BC = AM ÷ AB</text>
<text class="ts" x="175" y="409" text-anchor="middle" dominant-baseline="central">MN ÷ 12 = 3 ÷ 9, donc MN = 12 × 3 ÷ 9 = 4</text></g>
<g class="node c-teal"><rect x="350" y="368" width="310" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="505" y="387" text-anchor="middle" dominant-baseline="central">MN ÷ BC = AM ÷ AB</text>
<text class="ts" x="505" y="409" text-anchor="middle" dominant-baseline="central">MN ÷ 9 = 4 ÷ 6, donc MN = 9 × 4 ÷ 6 = 6</text></g>
</svg>
