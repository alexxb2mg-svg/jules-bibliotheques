<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="140" y="20" width="400" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="45" text-anchor="middle" dominant-baseline="central">A = 2/3 + 5/6 × 4/5</text></g>
<line x1="340" y1="70" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>
<g class="node c-coral"><rect x="140" y="120" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="139" text-anchor="middle" dominant-baseline="central">1. Multiplication d'abord</text>
<text class="ts" x="340" y="157" text-anchor="middle" dominant-baseline="central">5/6 × 4/5 = 20/30 = 2/3</text></g>
<line x1="340" y1="176" x2="340" y2="216" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="140" y="226" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="245" text-anchor="middle" dominant-baseline="central">2. Addition ensuite</text>
<text class="ts" x="340" y="263" text-anchor="middle" dominant-baseline="central">A = 2/3 + 2/3</text></g>
<line x1="340" y1="282" x2="340" y2="292" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="220" y="296" width="240" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="316" text-anchor="middle" dominant-baseline="central">A = 4/3</text></g>
</svg>
