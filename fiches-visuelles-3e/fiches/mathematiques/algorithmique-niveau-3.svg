<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="170" y="28" text-anchor="middle">Boucles imbriquées</text>
<rect x="40" y="45" width="260" height="34" rx="8" class="c-amber" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text class="t" x="170" y="62" text-anchor="middle" dominant-baseline="central">quand ⚑ cliqué</text>

<rect x="30" y="90" width="280" height="230" rx="10" fill="none" stroke="#6b7280" stroke-width="2"/>
<text class="ts" x="170" y="108" text-anchor="middle">boucle externe : répéter 6 fois</text>

<rect x="50" y="120" width="240" height="150" rx="10" fill="none" stroke="#7c3aed" stroke-width="2"/>
<text class="ts" x="170" y="138" text-anchor="middle" fill="#7c3aed">bloc « carré (50) »</text>
<rect x="58" y="148" width="224" height="34" rx="8" class="c-blue" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="170" y="165" text-anchor="middle" dominant-baseline="central">répéter 4 fois : avancer, tourner 90°</text>

<rect x="60" y="195" width="220" height="34" rx="8" class="c-teal" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text class="t" x="170" y="212" text-anchor="middle" dominant-baseline="central">tourner de 60°</text>
<text class="ts" x="170" y="248" text-anchor="middle" fill="#6b7280">(entre chaque motif)</text>

<text class="th" x="500" y="28" text-anchor="middle">Résultat : une rosace</text>
<circle cx="500" cy="180" r="12" fill="#c94b4b"/>
<g stroke="#2563eb" stroke-width="1.8" fill="none">
<polygon points="500,180 546,180 546,134 500,134"/>
<polygon points="500,180 523,219.8 476.2,242.8 452.8,203"/>
<polygon points="500,180 476.2,242.8 429.4,242.8 429.4,196"/>
<polygon points="500,180 429.4,196 429.4,150 476.2,117.2"/>
<polygon points="500,180 476.2,117.2 523,117.2 546,157"/>
<polygon points="500,180 546,157 570,196 546,226"/>
</g>
<text class="ts" x="500" y="290" text-anchor="middle">6 carrés tournés de 60°</text>

<g class="c-gray"><rect x="40" y="340" width="600" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="365" text-anchor="middle" dominant-baseline="central">6 (boucle externe) × 4 (boucle interne) = 24 répétitions d'« avancer »</text>
<text class="ts" x="340" y="385" text-anchor="middle" dominant-baseline="central">Schéma des blocs, sans capture d'écran du logiciel.</text></g>
</svg>
