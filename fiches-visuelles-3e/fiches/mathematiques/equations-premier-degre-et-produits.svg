<svg width="100%" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="20" text-anchor="middle">Même opération sur les deux membres</text>
<text class="ts" x="250" y="44" text-anchor="middle" fill="#2b6cb0">membre de gauche</text>
<text class="ts" x="430" y="44" text-anchor="middle" fill="#0f766e">membre de droite</text>

<g class="node c-blue"><rect x="180" y="55" width="140" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="250" y="75" text-anchor="middle" dominant-baseline="central">5x + 2</text></g>
<text class="th" x="340" y="75" text-anchor="middle" dominant-baseline="central">=</text>
<g class="node c-teal"><rect x="360" y="55" width="140" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="430" y="75" text-anchor="middle" dominant-baseline="central">2x + 17</text></g>

<line x1="250" y1="97" x2="250" y2="133" class="arr" marker-end="url(#arrow)"/>
<line x1="430" y1="97" x2="430" y2="133" class="arr" marker-end="url(#arrow)"/>
<text class="t" x="235" y="117" text-anchor="end" fill="#c2410c">− 2x</text>
<text class="t" x="445" y="117" text-anchor="start" fill="#c2410c">− 2x</text>
<text class="ts" x="520" y="117" text-anchor="start" fill="#666">les x à gauche</text>

<g class="node c-blue"><rect x="180" y="135" width="140" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="250" y="155" text-anchor="middle" dominant-baseline="central">3x + 2</text></g>
<text class="th" x="340" y="155" text-anchor="middle" dominant-baseline="central">=</text>
<g class="node c-teal"><rect x="360" y="135" width="140" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="430" y="155" text-anchor="middle" dominant-baseline="central">17</text></g>

<line x1="250" y1="177" x2="250" y2="213" class="arr" marker-end="url(#arrow)"/>
<line x1="430" y1="177" x2="430" y2="213" class="arr" marker-end="url(#arrow)"/>
<text class="t" x="235" y="197" text-anchor="end" fill="#c2410c">− 2</text>
<text class="t" x="445" y="197" text-anchor="start" fill="#c2410c">− 2</text>
<text class="ts" x="520" y="197" text-anchor="start" fill="#666">les nombres à droite</text>

<g class="node c-blue"><rect x="180" y="215" width="140" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="250" y="235" text-anchor="middle" dominant-baseline="central">3x</text></g>
<text class="th" x="340" y="235" text-anchor="middle" dominant-baseline="central">=</text>
<g class="node c-teal"><rect x="360" y="215" width="140" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="430" y="235" text-anchor="middle" dominant-baseline="central">15</text></g>

<line x1="250" y1="257" x2="250" y2="293" class="arr" marker-end="url(#arrow)"/>
<line x1="430" y1="257" x2="430" y2="293" class="arr" marker-end="url(#arrow)"/>
<text class="t" x="235" y="277" text-anchor="end" fill="#c2410c">÷ 3</text>
<text class="t" x="445" y="277" text-anchor="start" fill="#c2410c">÷ 3</text>
<text class="ts" x="520" y="277" text-anchor="start" fill="#666">diviser par 3, pas − 3</text>

<g class="node c-green"><rect x="180" y="295" width="320" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="317" text-anchor="middle" dominant-baseline="central">x = 5</text></g>

<g class="node c-gray"><rect x="80" y="355" width="520" height="44" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="370" text-anchor="middle" dominant-baseline="central">Vérification avec x = 5 :</text>
<text class="ts" x="340" y="388" text-anchor="middle" dominant-baseline="central">5 × 5 + 2 = 27 et 2 × 5 + 17 = 27, les deux membres sont égaux</text></g>
</svg>
