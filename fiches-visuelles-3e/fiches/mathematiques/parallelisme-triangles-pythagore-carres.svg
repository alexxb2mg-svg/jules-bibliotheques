<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="150" y="24" text-anchor="middle">Triangle ABC rectangle en C</text>
<polygon points="110,160 200,160 200,250 110,250" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<polygon points="200,250 320,250 320,370 200,370" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<polygon points="200,160 320,250 410,130 290,40" fill="#ffe4d6" stroke="#c2410c" stroke-width="1.5"/>
<polygon points="200,160 200,250 320,250" fill="#ffffff" stroke="#222" stroke-width="2.5"/>
<path d="M200 238 L212 238 L212 250" fill="none" stroke="#222" stroke-width="1.5"/>
<text class="t" x="155" y="205" text-anchor="middle" dominant-baseline="central" fill="#1d4ed8">AC² = 9</text>
<text class="t" x="260" y="310" text-anchor="middle" dominant-baseline="central" fill="#0f766e">BC² = 16</text>
<text class="t" x="305" y="145" text-anchor="middle" dominant-baseline="central" fill="#c2410c">AB² = 25</text>
<text class="ts" x="208" y="200" text-anchor="start">3</text>
<text class="ts" x="262" y="243" text-anchor="middle">4</text>
<text class="ts" x="250" y="216" text-anchor="middle">5</text>
<text class="t" x="190" y="266" text-anchor="end">C</text>
<text class="t" x="194" y="152" text-anchor="end">B</text>
<text class="t" x="328" y="266" text-anchor="start">A</text>

<g class="node c-coral"><rect x="440" y="50" width="225" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="552" y="71" text-anchor="middle" dominant-baseline="central">Hypoténuse [AB]</text>
<text class="ts" x="552" y="91" text-anchor="middle" dominant-baseline="central">en face de l'angle droit,</text>
<text class="ts" x="552" y="107" text-anchor="middle" dominant-baseline="central">c'est le plus long côté</text></g>
<g class="node c-green"><rect x="440" y="140" width="225" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="552" y="161" text-anchor="middle" dominant-baseline="central">AB² = AC² + BC²</text>
<text class="ts" x="552" y="183" text-anchor="middle" dominant-baseline="central">25 = 9 + 16, donc AB = √25 = 5</text></g>
<g class="node c-gray"><rect x="440" y="230" width="225" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="552" y="251" text-anchor="middle" dominant-baseline="central">Côté de l'angle droit ?</text>
<text class="ts" x="552" y="271" text-anchor="middle" dominant-baseline="central">on soustrait : BC² = AB² − AC²</text>
<text class="ts" x="552" y="287" text-anchor="middle" dominant-baseline="central">BC² = 25 − 9 = 16, BC = 4</text></g>
<text class="ts" x="552" y="330" text-anchor="middle" fill="#666">Le grand carré a la même aire</text>
<text class="ts" x="552" y="347" text-anchor="middle" fill="#666">que les deux petits réunis.</text>
<text class="ts" x="552" y="372" text-anchor="middle" fill="#666">Longueurs en cm, figure réduite.</text>
</svg>
