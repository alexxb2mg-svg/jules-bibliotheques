<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="170" y="28" text-anchor="middle">Bloc « mettre »</text>
<rect x="50" y="50" width="240" height="34" rx="8" class="c-amber" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text class="t" x="170" y="67" text-anchor="middle" dominant-baseline="central">quand ⚑ cliqué</text>
<rect x="50" y="95" width="240" height="34" rx="8" class="c-blue" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text class="t" x="170" y="112" text-anchor="middle" dominant-baseline="central">mettre score à 10</text>
<line x1="170" y1="140" x2="170" y2="175" class="arr" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="80" y="185" width="180" height="46" rx="8" fill="none" stroke="#c94b4b" stroke-width="2"/>
<text class="t" x="170" y="208" text-anchor="middle" dominant-baseline="central" fill="#c94b4b">score = 10</text>
<text class="ts" x="170" y="255" text-anchor="middle">remplace la valeur</text>

<text class="th" x="510" y="28" text-anchor="middle">Bloc « ajouter »</text>
<rect x="390" y="50" width="240" height="34" rx="8" class="c-amber" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text class="t" x="510" y="67" text-anchor="middle" dominant-baseline="central">quand ⚑ cliqué</text>
<rect x="390" y="95" width="240" height="34" rx="8" class="c-teal" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text class="t" x="510" y="112" text-anchor="middle" dominant-baseline="central">ajouter 10 à score</text>
<line x1="510" y1="140" x2="510" y2="175" class="arr" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="420" y="185" width="180" height="46" rx="8" fill="none" stroke="#c94b4b" stroke-width="2"/>
<text class="t" x="510" y="208" text-anchor="middle" dominant-baseline="central" fill="#c94b4b">score = 5 + 10 = 15</text>
<text class="ts" x="510" y="255" text-anchor="middle">augmente la valeur (ici, score valait 5 avant)</text>

<g class="c-gray"><rect x="40" y="300" width="600" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="325" text-anchor="middle" dominant-baseline="central">Deux blocs différents : « mettre » remplace, « ajouter » augmente.</text>
<text class="ts" x="340" y="345" text-anchor="middle" dominant-baseline="central">Schéma des blocs, sans capture d'écran du logiciel.</text></g>
</svg>
