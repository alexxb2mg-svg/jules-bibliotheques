<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="180" y="20" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Location de vélo</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">deux tarifs à comparer</text></g>
<line x1="300" y1="76" x2="180" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="76" x2="500" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="40" y="130" width="280" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="153" text-anchor="middle" dominant-baseline="central">Tarif A : A(x) = 2x + 10</text>
<text class="ts" x="180" y="174" text-anchor="middle" dominant-baseline="central">10 € d'adhésion + 2 € par heure</text>
<text class="ts" x="180" y="191" text-anchor="middle" dominant-baseline="central">fonction affine</text></g>
<g class="node c-teal"><rect x="360" y="130" width="280" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="153" text-anchor="middle" dominant-baseline="central">Tarif B : B(x) = 4x</text>
<text class="ts" x="500" y="174" text-anchor="middle" dominant-baseline="central">4 € par heure, pas d'adhésion</text>
<text class="ts" x="500" y="191" text-anchor="middle" dominant-baseline="central">fonction linéaire</text></g>
<line x1="180" y1="200" x2="330" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="200" x2="350" y2="240" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="180" y="250" width="320" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="273" text-anchor="middle" dominant-baseline="central">A(x) = B(x)</text>
<text class="ts" x="340" y="293" text-anchor="middle" dominant-baseline="central">2x + 10 = 4x → x = 5</text></g>
<line x1="340" y1="310" x2="340" y2="340" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="345" width="600" height="45" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="367" text-anchor="middle" dominant-baseline="central">Avant 5 h : B moins cher — après 5 h : A moins cher</text>
</g>
</svg>
