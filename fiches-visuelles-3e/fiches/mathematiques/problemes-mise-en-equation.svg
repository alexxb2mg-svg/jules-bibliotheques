<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-blue"><rect x="20" y="30" width="150" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="52" text-anchor="middle" dominant-baseline="central">1. Choisir x</text>
<text class="ts" x="95" y="72" text-anchor="middle" dominant-baseline="central">dire ce qu'il représente</text></g>
<line x1="170" y1="60" x2="220" y2="60" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="220" y="30" width="150" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="295" y="52" text-anchor="middle" dominant-baseline="central">2. Traduire</text>
<text class="ts" x="295" y="72" text-anchor="middle" dominant-baseline="central">écrire l'équation</text></g>
<line x1="370" y1="60" x2="420" y2="60" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="420" y="30" width="150" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="52" text-anchor="middle" dominant-baseline="central">3. Résoudre</text>
<text class="ts" x="495" y="72" text-anchor="middle" dominant-baseline="central">calculer x</text></g>
<line x1="495" y1="90" x2="495" y2="140" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="345" y="150" width="300" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="172" text-anchor="middle" dominant-baseline="central">4. Vérifier puis répondre</text>
<text class="ts" x="495" y="192" text-anchor="middle" dominant-baseline="central">avec les nombres de l'énoncé,</text>
<text class="ts" x="495" y="208" text-anchor="middle" dominant-baseline="central">par une phrase</text></g>
<g class="c-gray"><rect x="20" y="240" width="640" height="50" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="265" text-anchor="middle" dominant-baseline="central">La réponse n'est pas toujours x : relis la question posée.</text></g>
</svg>
