<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="24" text-anchor="middle">Compter les billes, pas les couleurs</text>
<circle cx="115" cy="80" r="20" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
<circle cx="165" cy="80" r="20" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
<circle cx="215" cy="80" r="20" fill="#22c55e" stroke="#166534" stroke-width="1"/>
<circle cx="265" cy="80" r="20" fill="#22c55e" stroke="#166534" stroke-width="1"/>
<circle cx="315" cy="80" r="20" fill="#22c55e" stroke="#166534" stroke-width="1"/>
<circle cx="365" cy="80" r="20" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<circle cx="415" cy="80" r="20" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<circle cx="465" cy="80" r="20" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<circle cx="515" cy="80" r="20" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<circle cx="565" cy="80" r="20" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<path d="M95 108 L95 116 L185 116 L185 108" fill="none" stroke="#b91c1c" stroke-width="1.5"/>
<path d="M195 108 L195 116 L335 116 L335 108" fill="none" stroke="#15803d" stroke-width="1.5"/>
<path d="M345 108 L345 116 L585 116 L585 108" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
<text class="t" x="140" y="138" text-anchor="middle" fill="#b91c1c">2 ÷ 10 = 0,2</text>
<text class="t" x="265" y="138" text-anchor="middle" fill="#15803d">3 ÷ 10 = 0,3</text>
<text class="t" x="465" y="138" text-anchor="middle" fill="#1d4ed8">5 ÷ 10 = 0,5</text>

<g class="node c-red"><rect x="40" y="170" width="290" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="190" text-anchor="middle" dominant-baseline="central">Faux : « 3 couleurs »</text>
<text class="ts" x="185" y="212" text-anchor="middle" dominant-baseline="central">donc 1 ÷ 3 pour chaque couleur</text></g>
<g class="node c-green"><rect x="350" y="170" width="290" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="190" text-anchor="middle" dominant-baseline="central">Juste : 10 billes équiprobables</text>
<text class="ts" x="495" y="212" text-anchor="middle" dominant-baseline="central">rouge 0,2 ; verte 0,3 ; bleue 0,5</text></g>
<text class="ts" x="340" y="268" text-anchor="middle">Ce sont les billes qui ont la même chance d'être tirées, pas les couleurs.</text>
<text class="ts" x="340" y="288" text-anchor="middle" fill="#666">Contrôle : 0,2 + 0,3 + 0,5 = 1</text>
</svg>
