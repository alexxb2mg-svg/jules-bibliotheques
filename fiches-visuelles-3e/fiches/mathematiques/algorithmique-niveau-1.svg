<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="150" y="28" text-anchor="middle">Script (blocs)</text>
<rect x="60" y="45" width="180" height="34" rx="8" class="c-amber" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text class="t" x="150" y="62" text-anchor="middle" dominant-baseline="central">quand ⚑ cliqué</text>

<rect x="60" y="95" width="180" height="34" rx="8" class="c-purple" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
<text class="t" x="150" y="112" text-anchor="middle" dominant-baseline="central">stylo : baisser</text>

<rect x="50" y="140" width="200" height="130" rx="10" fill="none" stroke="#6b7280" stroke-width="2"/>
<text class="ts" x="150" y="158" text-anchor="middle">répéter 4 fois</text>
<rect x="70" y="172" width="160" height="34" rx="8" class="c-blue" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text class="t" x="150" y="189" text-anchor="middle" dominant-baseline="central">avancer de 50</text>
<rect x="70" y="215" width="160" height="34" rx="8" class="c-teal" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text class="t" x="150" y="232" text-anchor="middle" dominant-baseline="central">tourner de 90°</text>

<text class="th" x="500" y="28" text-anchor="middle">Résultat : un carré</text>
<polygon points="440,80 560,80 560,200 440,200" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="440" cy="200" r="5" fill="#c94b4b"/>
<text class="ts" x="440" y="222" text-anchor="middle" fill="#c94b4b">départ = arrivée</text>
<text class="ts" x="500" y="240" text-anchor="middle">côté 50, angle 90°</text>

<g class="c-gray"><rect x="40" y="320" width="600" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="345" text-anchor="middle" dominant-baseline="central">Angle de rotation = 360° ÷ n (ici n = 4, donc 90°)</text>
<text class="ts" x="340" y="365" text-anchor="middle" dominant-baseline="central">Schéma des blocs, sans capture d'écran du logiciel.</text></g>
</svg>
