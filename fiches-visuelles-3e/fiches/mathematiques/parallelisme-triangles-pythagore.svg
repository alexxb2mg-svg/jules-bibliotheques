<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="200" y="20" text-anchor="middle">Deux parallèles coupées par une sécante</text>
<line x1="40" y1="120" x2="400" y2="120" stroke="#444" stroke-width="2"/>
<line x1="40" y1="240" x2="400" y2="240" stroke="#444" stroke-width="2"/>
<line x1="140" y1="330" x2="307.4" y2="40" stroke="#444" stroke-width="2"/>
<text class="t" x="50" y="110">(d)</text>
<text class="t" x="50" y="230">(d')</text>
<text class="t" x="316" y="58">(s)</text>

<path d="M191.9 240 L217.9 240 A26 26 0 0 0 204.9 217.5 Z" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<path d="M261.1 120 L235.1 120 A26 26 0 0 0 248.1 142.5 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>
<path d="M261.1 120 L287.1 120 A26 26 0 0 0 274.1 97.5 Z" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text class="t" x="232" y="214" text-anchor="middle" fill="#b45309">60°</text>
<text class="t" x="216" y="150" text-anchor="middle" fill="#1d4ed8">60°</text>
<text class="t" x="304" y="104" text-anchor="middle" fill="#7c3aed">60°</text>

<g class="node c-blue"><rect x="420" y="40" width="245" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="542" y="60" text-anchor="middle" dominant-baseline="central">Alternes-internes</text>
<text class="ts" x="542" y="80" text-anchor="middle" dominant-baseline="central">bleu et orange : de part et d'autre</text>
<text class="ts" x="542" y="98" text-anchor="middle" dominant-baseline="central">de (s), entre les deux droites</text></g>
<g class="node c-purple"><rect x="420" y="130" width="245" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="542" y="150" text-anchor="middle" dominant-baseline="central">Correspondants</text>
<text class="ts" x="542" y="170" text-anchor="middle" dominant-baseline="central">violet et orange : du même côté</text>
<text class="ts" x="542" y="188" text-anchor="middle" dominant-baseline="central">de (s), placés de la même façon</text></g>
<g class="node c-green"><rect x="420" y="220" width="245" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="542" y="240" text-anchor="middle" dominant-baseline="central">Parallèles ⇔ angles égaux</text>
<text class="ts" x="542" y="260" text-anchor="middle" dominant-baseline="central">60° = 60° : (d) et (d') sont parallèles</text>
<text class="ts" x="542" y="278" text-anchor="middle" dominant-baseline="central">73° et 75° : elles ne le sont pas</text></g>
<text class="ts" x="340" y="345" text-anchor="middle" fill="#666">Les trois angles colorés mesurent 60° parce que (d) et (d') sont parallèles.</text>
</svg>
