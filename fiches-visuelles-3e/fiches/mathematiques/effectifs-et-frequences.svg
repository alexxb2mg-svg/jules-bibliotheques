<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="60" y="20" width="200" height="150" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="42" text-anchor="middle" dominant-baseline="central">Tableau d'effectifs</text>
<text class="ts" x="160" y="70" text-anchor="middle" dominant-baseline="central">Note 8 : effectif 1</text>
<text class="ts" x="160" y="90" text-anchor="middle" dominant-baseline="central">Note 9 : effectif 2</text>
<text class="ts" x="160" y="110" text-anchor="middle" dominant-baseline="central">Note 10 : effectif 4</text>
<text class="ts" x="160" y="130" text-anchor="middle" dominant-baseline="central">Note 11 : effectif 3</text>
<text class="ts" x="160" y="150" text-anchor="middle" dominant-baseline="central">... total n = 16</text></g>
<line x1="260" y1="95" x2="330" y2="95" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="340" y="30" width="280" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="52" text-anchor="middle" dominant-baseline="central">Effectif total n</text>
<text class="ts" x="480" y="74" text-anchor="middle" dominant-baseline="central">somme de tous les effectifs</text>
<text class="ts" x="480" y="94" text-anchor="middle" dominant-baseline="central">ici n = 16</text></g>
<line x1="480" y1="110" x2="480" y2="150" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="340" y="160" width="280" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="480" y="182" text-anchor="middle" dominant-baseline="central">Fréquence de la note 10</text>
<text class="ts" x="480" y="204" text-anchor="middle" dominant-baseline="central">4 ÷ 16 = 0,25</text>
<text class="ts" x="480" y="224" text-anchor="middle" dominant-baseline="central">soit 25 %</text></g>
<g class="c-gray"><rect x="60" y="260" width="560" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="282" text-anchor="middle" dominant-baseline="central">La somme de toutes les fréquences vaut toujours 1 (100 %)</text>
<text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">Pas à l'échelle</text></g>
</svg>
