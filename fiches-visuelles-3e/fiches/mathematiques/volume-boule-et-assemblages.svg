<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-blue"><rect x="30" y="40" width="190" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="125" y="62" text-anchor="middle" dominant-baseline="central">Cylindre</text>
<circle cx="70" cy="90" r="18" fill="none" stroke="#2b6cb0" stroke-width="2"/>
<text class="ts" x="125" y="120" text-anchor="middle" dominant-baseline="central">V = π × r² × h</text></g>
<g class="node c-teal"><rect x="245" y="40" width="190" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Demi-boule</text>
<path d="M300 95 A 40 40 0 0 1 380 95 Z" fill="none" stroke="#2c7a7b" stroke-width="2"/>
<text class="ts" x="340" y="115" text-anchor="middle" dominant-baseline="central">V = (2/3) × π × r³</text></g>
<g class="node c-purple"><rect x="460" y="40" width="190" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="62" text-anchor="middle" dominant-baseline="central">Boule complète</text>
<circle cx="555" cy="95" r="22" fill="none" stroke="#6b46c1" stroke-width="2"/>
<text class="ts" x="555" y="118" text-anchor="middle" dominant-baseline="central">V = (4/3) × π × r³</text></g>
<line x1="220" y1="85" x2="245" y2="85" class="arr" marker-end="url(#arrow)"/>
<line x1="435" y1="85" x2="460" y2="85" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="232" y="75" text-anchor="middle">+</text>
<text class="ts" x="448" y="75" text-anchor="middle">×2</text>
<g class="node c-gray"><rect x="60" y="170" width="560" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="190" text-anchor="middle" dominant-baseline="central">Silo = cylindre + demi-boule (même rayon r)</text>
<text class="ts" x="340" y="212" text-anchor="middle" dominant-baseline="central">V total = π × r² × h + (2/3) × π × r³</text></g>
<g class="node c-amber"><rect x="60" y="260" width="560" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="282" text-anchor="middle" dominant-baseline="central">Exemple : rayon 4 m, hauteur du cylindre 10 m</text>
<text class="ts" x="340" y="304" text-anchor="middle" dominant-baseline="central">Cylindre : π × 16 × 10 = 160π m³</text>
<text class="ts" x="340" y="324" text-anchor="middle" dominant-baseline="central">Demi-boule : (2/3) × π × 64 ≈ 42,7π m³ → total ≈ 637 m³</text></g>
<text class="ts" x="340" y="380" text-anchor="middle" fill="#666">Schéma non à l'échelle</text>
</svg>
