<text class="th" x="340" y="33" text-anchor="middle" dominant-baseline="central">(x − 2)(x + 5) = 0</text>
<text class="ts" x="340" y="53" text-anchor="middle" dominant-baseline="central">un produit nul : un facteur au moins est nul</text></g>

<line x1="300" y1="72" x2="200" y2="106" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="72" x2="480" y2="106" class="arr" marker-end="url(#arrow)"/>

