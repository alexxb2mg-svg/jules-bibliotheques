<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="170" y="30" text-anchor="middle">Vue de face : la latitude</text>
<circle cx="170" cy="200" r="140" class="c-gray" fill="none" stroke-width="2"/>
<text class="ts" x="170" y="52" text-anchor="middle">N (pôle Nord)</text>
<text class="ts" x="170" y="355" text-anchor="middle">S (pôle Sud)</text>
<line x1="30" y1="200" x2="310" y2="200" stroke="#6b7280" stroke-width="2"/>
<text class="ts" x="170" y="217" text-anchor="middle">équateur (0°)</text>
<line x1="170" y1="200" x2="282.6" y2="119.6" class="arr" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M210,200 A40,40 0 0,0 203.0,177.0" fill="none" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="222" y="188" fill="#2563eb">latitude φ</text>
<text class="t" x="292" y="112" fill="#2563eb">P</text>

<text class="th" x="510" y="30" text-anchor="middle">Vue du pôle Nord : la longitude</text>
<circle cx="510" cy="200" r="140" class="c-gray" fill="none" stroke-width="2"/>
<line x1="510" y1="200" x2="510" y2="60" class="arr" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="510" y="48" text-anchor="middle">Greenwich (0°)</text>
<line x1="510" y1="200" x2="617.2" y2="110.0" class="arr" stroke="#0d9488" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M510,160 A40,40 0 0,1 540.6,174.3" fill="none" stroke="#0d9488" stroke-width="1.5"/>
<text class="ts" x="528" y="153" fill="#0d9488">longitude λ</text>
<text class="t" x="627" y="103" fill="#0d9488">méridien de P</text>

<g class="c-gray"><rect x="40" y="390" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="411" text-anchor="middle" dominant-baseline="central">Coordonnées de P : (latitude ; longitude), par exemple (35° N ; 50° E)</text>
<text class="ts" x="340" y="431" text-anchor="middle" dominant-baseline="central">Schéma de principe, pas à l'échelle.</text></g>
</svg>
