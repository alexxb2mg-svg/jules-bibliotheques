<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-blue"><rect x="30" y="130" width="150" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="160" text-anchor="middle" dominant-baseline="central">x</text>
<text class="ts" x="105" y="184" text-anchor="middle" dominant-baseline="central">la variable</text></g>
<line x1="180" y1="170" x2="255" y2="170" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="255" y="105" width="170" height="130" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">f</text>
<text class="ts" x="340" y="180" text-anchor="middle" dominant-baseline="central">la fonction</text>
<text class="ts" x="340" y="200" text-anchor="middle" dominant-baseline="central">(le procédé)</text></g>
<line x1="425" y1="170" x2="500" y2="170" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="500" y="130" width="150" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="575" y="160" text-anchor="middle" dominant-baseline="central">f(x)</text>
<text class="ts" x="575" y="184" text-anchor="middle" dominant-baseline="central">l'image de x par f</text></g>
<text class="ts" x="105" y="260" text-anchor="middle">entre dans la machine</text>
<text class="ts" x="575" y="260" text-anchor="middle">sort de la machine</text>
<g class="c-gray"><rect x="40" y="300" width="600" height="80" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="330" text-anchor="middle" dominant-baseline="central">Si f(a) = b, on écrit aussi f : a ↦ b</text>
<text class="t" x="340" y="358" text-anchor="middle" dominant-baseline="central">b est l'image de a — a est un antécédent de b</text></g>
</svg>
