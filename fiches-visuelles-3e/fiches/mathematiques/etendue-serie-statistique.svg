<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<g class="node c-gray"><rect x="40" y="20" width="600" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">Notes : 5, 8, 9, 9, 10, 10, 11, 11, 12, 14, 16</text></g>
<line x1="60" y1="130" x2="620" y2="130" stroke="#888" stroke-width="2"/>
<line x1="60" y1="120" x2="60" y2="140" stroke="#888" stroke-width="2"/>
<line x1="620" y1="120" x2="620" y2="140" stroke="#888" stroke-width="2"/>
<text class="ts" x="60" y="110" text-anchor="middle">0</text>
<text class="ts" x="620" y="110" text-anchor="middle">20</text>
<g class="node c-coral"><circle cx="200" cy="130" r="10" stroke="none"/></g>
<text class="ts" x="200" y="160" text-anchor="middle">minimum : 5</text>
<g class="node c-blue"><circle cx="480" cy="130" r="10" stroke="none"/></g>
<text class="ts" x="480" y="160" text-anchor="middle">maximum : 16</text>
<line x1="200" y1="130" x2="480" y2="130" stroke="#2a6f97" stroke-width="4"/>
<g class="node c-purple"><rect x="230" y="190" width="220" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="212" text-anchor="middle" dominant-baseline="central">Étendue</text>
<text class="ts" x="340" y="234" text-anchor="middle" dominant-baseline="central">16 − 5 = 11</text>
<text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">l'écart entre les deux points</text></g>
<g class="c-gray"><rect x="40" y="280" width="600" height="30" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="295" text-anchor="middle" dominant-baseline="central">Pas à l'échelle</text></g>
</svg>
