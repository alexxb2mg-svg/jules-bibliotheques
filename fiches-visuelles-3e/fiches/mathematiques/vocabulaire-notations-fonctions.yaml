notion: vocabulaire-notations-fonctions
titre: "Vocabulaire et notations fonctionnelles"
matiere: mathematiques
niveau: 3e
auteurs: ["hermes-lot6"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-lot6", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - titre: "Wikiversité, « Généralités sur les fonctions/Introduction »"
    url: "https://fr.wikiversity.org/w/index.php?title=G%C3%A9n%C3%A9ralit%C3%A9s_sur_les_fonctions/Introduction&oldid=968390"
    licence: CC-BY-SA-4.0
  - titre: "Vikidia, « Fonction mathématique »"
    url: "https://fr.vikidia.org/w/index.php?title=Fonction_math%C3%A9matique&oldid=2494404"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
variables:
  a: "un nombre de départ (une variable) auquel on applique la fonction"
  b: "le nombre obtenu, l'image de a par la fonction"
  x: "la variable, le nombre que l'on fait varier dans f(x)"
blocs:
  - id: formule
    type: formule
    expression: "f(a) = b"
    termes:
      a: {couleur: bleu, legende: "l'antécédent : le nombre de départ, la variable"}
      b: {couleur: teal, legende: "l'image de a par f : le nombre qui sort"}
    jules: "f(a) = b se lit « f de a égale b » : jamais « f fois a », il n'y a pas de multiplication."

  - id: carte
    type: carte
    noeuds:
      - {id: fonction, titre: "Une fonction f", sous_titre: "un procédé de calcul", principal: true}
      - {id: variable, titre: "Variable", sous_titre: "le nombre de départ"}
      - {id: image, titre: "Image", sous_titre: "ce qui sort, f(x)"}
      - {id: antecedent, titre: "Antécédent", sous_titre: "ce qui entre"}
    liens:
      - {de: fonction, vers: variable, libelle: "reçoit x"}
      - {de: fonction, vers: image, libelle: "renvoie f(x)"}
      - {de: image, vers: antecedent, libelle: "vue depuis l'arrivée"}
    jules: "Image et antécédent regardent la même flèche dans deux sens : l'un part de x, l'autre part de f(x)."

  - id: schema
    type: schema
    titre: "La fonction vue comme une machine"
    svg: "vocabulaire-notations-fonctions.svg"
    jules: "x entre dans la machine f, f(x) en sort : c'est l'image de x, et x est un antécédent de f(x)."

  - id: methode
    type: methode
    etapes:
      - "Pour une image : remplacer x par le nombre dans l'expression (avec des parenthèses si le nombre est négatif), puis calculer."
      - "Pour un antécédent : chercher le ou les x tels que f(x) soit égal au nombre donné (équation, tableau ou graphique)."
      - "Traduire une phrase : « l'image de 2 est 1 » s'écrit f(2) = 1 ; « 4 est un antécédent de 7 » s'écrit f(4) = 7."
    jules: "Le sens de la flèche donne le sens de la phrase : image = ce qui sort, antécédent = ce qui entre."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre image et antécédent : dire que 1 est un antécédent de 2 quand f(2) = 1."
    pourquoi_faux: "f(2) = 1 signifie que 2 entre dans la fonction et que 1 en sort : c'est donc l'inverse."
    bonne_idee: "Si f(2) = 1, alors 1 est l'**image** de 2, et 2 est un **antécédent** de 1."
    jules: "Relis toujours la formule f(a) = b comme « a entre, b sort » pour ne pas inverser les rôles."

  - id: exemple
    type: exemple
    situation: "f est la fonction x ↦ 3x − 5. Calculer l'image de 2, puis f(−1)."
    calcul: "f(2) = 3 × 2 − 5 = 6 − 5 = 1. f(−1) = 3 × (−1) − 5 = −3 − 5 = −8."
    conclusion: "L'image de 2 par f est 1 ; f(−1) = −8."
    jules: "Avec un nombre négatif, entoure-le de parenthèses avant de multiplier : 3 × (−1), jamais 3 × −1."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à traduire des phrases en égalités f(a) = b : c'est la compétence la plus testée."
