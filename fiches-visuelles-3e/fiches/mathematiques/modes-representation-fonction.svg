<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-amber"><rect x="30" y="30" width="180" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="55" text-anchor="middle" dominant-baseline="central">Programme de calcul</text>
<text class="ts" x="120" y="78" text-anchor="middle" dominant-baseline="central">« multiplier par 2, ajouter 3 »</text></g>
<line x1="210" y1="65" x2="270" y2="65" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="270" y="30" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="345" y="55" text-anchor="middle" dominant-baseline="central">Expression</text>
<text class="ts" x="345" y="78" text-anchor="middle" dominant-baseline="central">f(x) = 2x + 3</text></g>
<line x1="420" y1="65" x2="480" y2="65" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="480" y="30" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="55" text-anchor="middle" dominant-baseline="central">Tableau de valeurs</text>
<text class="ts" x="565" y="78" text-anchor="middle" dominant-baseline="central">x et f(x) associés</text></g>
<line x1="565" y1="100" x2="565" y2="150" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="255" y="160" width="220" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="365" y="185" text-anchor="middle" dominant-baseline="central">Représentation graphique</text>
<text class="ts" x="365" y="208" text-anchor="middle" dominant-baseline="central">points M(x ; f(x))</text></g>
<line x1="255" y1="200" x2="150" y2="200" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="192" text-anchor="middle">on relie les points</text>
<g class="c-gray"><rect x="40" y="270" width="290" height="70" rx="8" stroke-width="0.5"/>
<text class="ts" x="185" y="292" text-anchor="middle" dominant-baseline="central">x = −1 ; 0 ; 1 ; 2</text>
<text class="ts" x="185" y="312" text-anchor="middle" dominant-baseline="central">f(x) = 1 ; 3 ; 5 ; 7</text></g>
<g class="node c-green"><rect x="350" y="270" width="290" height="140" rx="8" stroke-width="0.5"/>
<line x1="390" y1="380" x2="620" y2="380" stroke="#333" stroke-width="1"/>
<line x1="390" y1="290" x2="390" y2="400" stroke="#333" stroke-width="1"/>
<circle cx="430" cy="360" r="4" fill="#1a7f5a"/>
<circle cx="470" cy="340" r="4" fill="#1a7f5a"/>
<circle cx="510" cy="320" r="4" fill="#1a7f5a"/>
<circle cx="550" cy="300" r="4" fill="#1a7f5a"/>
<line x1="430" y1="360" x2="550" y2="300" stroke="#1a7f5a" stroke-width="2"/>
<text class="ts" x="495" y="415" text-anchor="middle">points alignés : droite</text></g>
</svg>
