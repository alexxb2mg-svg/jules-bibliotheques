<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="22" text-anchor="middle">Triangle KLM rectangle en K, vu depuis l'angle en L</text>
<line x1="80" y1="320" x2="325" y2="114" stroke="#c2410c" stroke-width="3.5"/>
<line x1="80" y1="320" x2="325" y2="320" stroke="#2563eb" stroke-width="3.5"/>
<line x1="325" y1="320" x2="325" y2="114" stroke="#0d9488" stroke-width="3.5"/>
<path d="M313 320 L313 308 L325 308" fill="none" stroke="#222" stroke-width="1.5"/>
<path d="M80 320 L120 320 A40 40 0 0 0 110.6 294.3 Z" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
<text class="ts" x="136" y="308" text-anchor="start" fill="#b45309">40°</text>
<text class="t" x="70" y="330" text-anchor="end">L</text>
<text class="t" x="333" y="338" text-anchor="start">K</text>
<text class="t" x="333" y="110" text-anchor="start">M</text>
<text class="ts" x="186" y="196" text-anchor="end" fill="#c2410c">hypoténuse LM = 8 cm</text>
<text class="ts" x="202" y="342" text-anchor="middle" fill="#1d4ed8">côté adjacent KL</text>
<text class="ts" x="335" y="222" text-anchor="start" fill="#0f766e">côté</text>
<text class="ts" x="335" y="238" text-anchor="start" fill="#0f766e">opposé KM</text>

<g class="node c-blue"><rect x="410" y="50" width="255" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="537" y="70" text-anchor="middle" dominant-baseline="central">cos = adjacent ÷ hypoténuse</text>
<text class="ts" x="537" y="92" text-anchor="middle" dominant-baseline="central">KL = 8 × cos 40° ≈ 6,1 cm</text></g>
<g class="node c-teal"><rect x="410" y="128" width="255" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="537" y="148" text-anchor="middle" dominant-baseline="central">sin = opposé ÷ hypoténuse</text>
<text class="ts" x="537" y="170" text-anchor="middle" dominant-baseline="central">KM = 8 × sin 40° ≈ 5,1 cm</text></g>
<g class="node c-gray"><rect x="410" y="206" width="255" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="537" y="226" text-anchor="middle" dominant-baseline="central">tan = opposé ÷ adjacent</text>
<text class="ts" x="537" y="248" text-anchor="middle" dominant-baseline="central">un angle : touche tan⁻¹, mode degrés</text></g>
<text class="t" x="537" y="300" text-anchor="middle" fill="#b45309">CAH SOH TOA</text>
<text class="ts" x="537" y="320" text-anchor="middle" fill="#666">Cos Adjacent Hypoténuse,</text>
<text class="ts" x="537" y="336" text-anchor="middle" fill="#666">Sin Opposé Hypoténuse,</text>
<text class="ts" x="537" y="352" text-anchor="middle" fill="#666">Tan Opposé Adjacent</text>

</svg>
