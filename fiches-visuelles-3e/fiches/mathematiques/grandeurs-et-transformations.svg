<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="180" y="20" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Figure de départ</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">longueur L, aire A, volume V</text></g>
<line x1="270" y1="76" x2="180" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="76" x2="500" y2="130" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="30" y="140" width="270" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="165" y="162" text-anchor="middle" dominant-baseline="central">Isométrie</text>
<text class="ts" x="165" y="182" text-anchor="middle" dominant-baseline="central">symétrie, translation, rotation</text>
<text class="ts" x="165" y="202" text-anchor="middle" dominant-baseline="central">L, A, V inchangés</text></g>
<g class="node c-purple"><rect x="380" y="140" width="270" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="515" y="162" text-anchor="middle" dominant-baseline="central">Homothétie de rapport k</text>
<text class="ts" x="515" y="182" text-anchor="middle" dominant-baseline="central">longueur × |k|</text>
<text class="ts" x="515" y="202" text-anchor="middle" dominant-baseline="central">aire × k², volume × |k|³</text></g>
<g class="node c-green"><rect x="30" y="250" width="270" height="60" rx="8" stroke-width="0.5"/>
<text class="ts" x="165" y="272" text-anchor="middle" dominant-baseline="central">Exemple : côté 5 cm après rotation</text>
<text class="ts" x="165" y="292" text-anchor="middle" dominant-baseline="central">côté = 5 cm (inchangé)</text></g>
<g class="node c-amber"><rect x="380" y="250" width="270" height="80" rx="8" stroke-width="0.5"/>
<text class="ts" x="515" y="270" text-anchor="middle" dominant-baseline="central">Exemple : côté 3 cm, aire 12 cm², k = 2</text>
<text class="ts" x="515" y="290" text-anchor="middle" dominant-baseline="central">côté image = 6 cm</text>
<text class="ts" x="515" y="308" text-anchor="middle" dominant-baseline="central">aire image = 12 × 4 = 48 cm²</text></g>
<text class="ts" x="340" y="350" text-anchor="middle" fill="#666">Schéma non à l'échelle</text>
</svg>
