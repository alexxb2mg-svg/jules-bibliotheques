<svg width="100%" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="24" text-anchor="middle">La droite passe par A(1 ; 5) et B(3 ; 1) : retrouver f(x)</text>

<line x1="90" y1="370" x2="300" y2="370" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="110" y1="390" x2="110" y2="52" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="296" y="390" text-anchor="middle">x</text>
<text class="ts" x="124" y="60" text-anchor="middle">y</text>
<line x1="150" y1="366" x2="150" y2="374" stroke="#888"/>
<line x1="190" y1="366" x2="190" y2="374" stroke="#888"/>
<line x1="230" y1="366" x2="230" y2="374" stroke="#888"/>
<line x1="270" y1="366" x2="270" y2="374" stroke="#888"/>
<text class="ts" x="150" y="388" text-anchor="middle">1</text>
<text class="ts" x="190" y="388" text-anchor="middle">2</text>
<text class="ts" x="230" y="388" text-anchor="middle">3</text>
<text class="ts" x="270" y="388" text-anchor="middle">4</text>
<text class="ts" x="100" y="388" text-anchor="end">0</text>
<line x1="106" y1="330" x2="114" y2="330" stroke="#888"/>
<line x1="106" y1="290" x2="114" y2="290" stroke="#888"/>
<line x1="106" y1="250" x2="114" y2="250" stroke="#888"/>
<line x1="106" y1="210" x2="114" y2="210" stroke="#888"/>
<line x1="106" y1="170" x2="114" y2="170" stroke="#888"/>
<line x1="106" y1="130" x2="114" y2="130" stroke="#888"/>
<line x1="106" y1="90" x2="114" y2="90" stroke="#888"/>
<text class="ts" x="100" y="334" text-anchor="end">1</text>
<text class="ts" x="100" y="254" text-anchor="end">3</text>
<text class="ts" x="100" y="174" text-anchor="end">5</text>

<line x1="110" y1="90" x2="250" y2="370" stroke="#2563eb" stroke-width="3"/>
<path d="M150 170 L230 170 L230 330" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
<text class="ts" x="190" y="162" text-anchor="middle" fill="#c2410c">x : +2</text>
<text class="ts" x="238" y="254" text-anchor="start" fill="#c2410c">y : −4</text>
<circle cx="150" cy="170" r="6" fill="#2563eb" stroke="none"/>
<circle cx="230" cy="330" r="6" fill="#2563eb" stroke="none"/>
<text class="t" x="140" y="166" text-anchor="end" fill="#1d4ed8">A</text>
<text class="t" x="218" y="342" text-anchor="end" fill="#1d4ed8">B</text>
<circle cx="110" cy="90" r="6" fill="#15803d" stroke="none"/>
<text class="ts" x="122" y="86" text-anchor="start" fill="#15803d">(0 ; 7)</text>

<g class="node c-coral"><rect x="340" y="56" width="320" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="77" text-anchor="middle" dominant-baseline="central">1. a = (1 − 5) ÷ (3 − 1)</text>
<text class="t" x="500" y="99" text-anchor="middle" dominant-baseline="central">a = −4 ÷ 2 = −2</text></g>
<line x1="500" y1="122" x2="500" y2="144" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="340" y="146" width="320" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="167" text-anchor="middle" dominant-baseline="central">2. Avec A : 5 = −2 × 1 + b</text>
<text class="t" x="500" y="189" text-anchor="middle" dominant-baseline="central">donc b = 5 + 2 = 7</text></g>
<line x1="500" y1="212" x2="500" y2="234" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="340" y="236" width="320" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="257" text-anchor="middle" dominant-baseline="central">3. f(x) = −2x + 7</text>
<text class="ts" x="500" y="279" text-anchor="middle" dominant-baseline="central">a &lt; 0 : la droite descend</text></g>
<g class="node c-gray"><rect x="340" y="320" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="ts" x="500" y="339" text-anchor="middle" dominant-baseline="central">Vérification avec B :</text>
<text class="ts" x="500" y="357" text-anchor="middle" dominant-baseline="central">f(3) = −2 × 3 + 7 = 1, c'est bien l'ordonnée de B</text></g>
</svg>
