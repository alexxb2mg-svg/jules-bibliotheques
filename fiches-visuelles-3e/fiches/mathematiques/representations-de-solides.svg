<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="170" y="28" text-anchor="middle">Perspective cavalière</text>
<ellipse cx="170" cy="290" rx="90" ry="30" fill="none" stroke="#2563eb" stroke-width="2"/>
<line x1="80" y1="290" x2="80" y2="150" stroke="#2563eb" stroke-width="2"/>
<line x1="260" y1="290" x2="260" y2="150" stroke="#2563eb" stroke-width="2"/>
<path d="M80,150 A90,30 0 0,1 260,150" fill="none" stroke="#2563eb" stroke-width="2"/>
<path d="M80,150 A90,30 0 0,0 260,150" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 4"/>
<text class="ts" x="170" y="320" text-anchor="middle" fill="#2563eb">disque de base</text>
<text class="ts" x="290" y="220" text-anchor="start" fill="#0d9488">hauteur h</text>
<line x1="270" y1="150" x2="270" y2="290" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="2 3"/>

<line x1="290" y1="200" x2="340" y2="200" class="arr" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="315" y="185" text-anchor="middle">déplier</text>

<text class="th" x="510" y="28" text-anchor="middle">Patron du cylindre</text>
<circle cx="440" cy="80" r="40" fill="none" stroke="#0d9488" stroke-width="2"/>
<text class="ts" x="440" y="80" text-anchor="middle" dominant-baseline="central" fill="#0d9488">r</text>
<circle cx="440" cy="340" r="40" fill="none" stroke="#0d9488" stroke-width="2"/>
<text class="ts" x="440" y="340" text-anchor="middle" dominant-baseline="central" fill="#0d9788">r</text>
<rect x="500" y="150" width="150" height="80" fill="none" stroke="#2563eb" stroke-width="2"/>
<text class="ts" x="575" y="200" text-anchor="middle" fill="#2563eb">L = 2 × π × r</text>
<text class="ts" x="575" y="245" text-anchor="middle">hauteur h</text>

<g class="c-gray"><rect x="40" y="370" width="600" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="390" text-anchor="middle" dominant-baseline="central">Arêtes cachées en pointillés ; le rectangle du patron s'enroule autour des deux disques.</text></g>
