<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="180" y="20" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Série rangée par ordre croissant</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">toujours en premier</text></g>
<line x1="300" y1="76" x2="170" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="76" x2="430" y2="120" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="98" text-anchor="middle">n impair</text>
<text class="ts" x="480" y="98" text-anchor="middle">n pair</text>
<g class="node c-purple"><rect x="30" y="130" width="260" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="150" text-anchor="middle" dominant-baseline="central">Rang du milieu = (n + 1) ÷ 2</text>
<text class="ts" x="160" y="172" text-anchor="middle" dominant-baseline="central">Ex. n = 7 : rang 4</text>
<text class="ts" x="160" y="192" text-anchor="middle" dominant-baseline="central">7, 8, 9, [11], 12, 14, 15</text></g>
<g class="node c-teal"><rect x="390" y="130" width="260" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="520" y="150" text-anchor="middle" dominant-baseline="central">Moyenne des rangs n÷2 et n÷2+1</text>
<text class="ts" x="520" y="172" text-anchor="middle" dominant-baseline="central">Ex. n = 16 : rangs 8 et 9</text>
<text class="ts" x="520" y="192" text-anchor="middle" dominant-baseline="central">valeurs 10 et 11</text></g>
<line x1="160" y1="210" x2="160" y2="250" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="210" x2="520" y2="250" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="30" y="260" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="285" text-anchor="middle" dominant-baseline="central">Médiane = 11</text></g>
<g class="node c-green"><rect x="390" y="260" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="520" y="285" text-anchor="middle" dominant-baseline="central">Médiane = (10 + 11) ÷ 2 = 10,5</text></g>
<g class="c-gray"><rect x="40" y="330" width="600" height="50" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="350" text-anchor="middle" dominant-baseline="central">Moyenne = somme des valeurs ÷ n</text>
<text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">Pas à l'échelle</text></g>
</svg>
