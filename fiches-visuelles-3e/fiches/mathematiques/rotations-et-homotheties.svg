<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340" y="20" text-anchor="middle" dominant-baseline="central">Pas à l'échelle</text>

<text class="th" x="170" y="45" text-anchor="middle" dominant-baseline="central">Rotation de centre O</text>
<circle cx="170" cy="230" r="4" fill="#555" stroke="#555"/>
<text class="ts" x="155" y="245" text-anchor="middle" dominant-baseline="central">O</text>
<polygon points="170,140 230,190 150,220" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text class="t" x="170" y="128" text-anchor="middle" dominant-baseline="central">M</text>
<polygon points="170,320 100,290 190,270" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text class="t" x="170" y="335" text-anchor="middle" dominant-baseline="central">M'</text>
<line x1="170" y1="230" x2="170" y2="145" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="230" x2="170" y2="315" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="230" text-anchor="middle" dominant-baseline="central">α</text>
<g class="c-gray"><rect x="30" y="360" width="280" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="170" y="382" text-anchor="middle" dominant-baseline="central">OM' = OM et angle MOM' = α.</text>
<text class="t" x="170" y="402" text-anchor="middle" dominant-baseline="central">Même taille, la figure tourne.</text></g>

<text class="th" x="500" y="45" text-anchor="middle" dominant-baseline="central">Homothétie de centre O</text>
<circle cx="450" cy="230" r="4" fill="#555" stroke="#555"/>
<text class="ts" x="435" y="245" text-anchor="middle" dominant-baseline="central">O</text>
<polygon points="500,190 530,210 490,225" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text class="t" x="500" y="178" text-anchor="middle" dominant-baseline="central">M</text>
<polygon points="600,140 660,180 580,210" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text class="t" x="600" y="128" text-anchor="middle" dominant-baseline="central">M'</text>
<line x1="450" y1="230" x2="500" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="450" y1="230" x2="600" y2="150" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="370" y="360" width="280" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="510" y="382" text-anchor="middle" dominant-baseline="central">OM' = |k| × OM, sur la droite (OM).</text>
<text class="t" x="510" y="402" text-anchor="middle" dominant-baseline="central">La taille change, pas la forme.</text></g>
</svg>
