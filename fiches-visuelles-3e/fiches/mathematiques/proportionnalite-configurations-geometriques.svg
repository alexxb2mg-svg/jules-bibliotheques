<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="60" y1="300" x2="620" y2="300" stroke="#888" stroke-width="1.5"/>
<line x1="120" y1="300" x2="120" y2="200" stroke="#2b6cb0" stroke-width="4"/>
<text class="ts" x="120" y="185" text-anchor="middle">bâton : 2 m</text>
<line x1="120" y1="300" x2="200" y2="300" class="arr" stroke="#2b6cb0" marker-end="url(#arrow)"/>
<text class="ts" x="160" y="320" text-anchor="middle">ombre : 1,6 m</text>
<path d="M120 300 L120 200 L200 300 Z" fill="none" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="400" y1="300" x2="400" y2="90" stroke="#6b46c1" stroke-width="6"/>
<text class="ts" x="400" y="75" text-anchor="middle">arbre : hauteur h</text>
<line x1="400" y1="300" x2="600" y2="300" class="arr" stroke="#6b46c1" marker-end="url(#arrow)"/>
<text class="ts" x="500" y="320" text-anchor="middle">ombre : 9,6 m</text>
<path d="M400 300 L400 90 L600 300 Z" fill="none" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="4 3"/>
<g class="node c-amber"><rect x="60" y="20" width="560" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">Triangles semblables : rayons du soleil parallèles</text>
<text class="ts" x="340" y="58" text-anchor="middle" dominant-baseline="central">rapport k = 9,6 ÷ 1,6 = 6 → hauteur = 2 × 6 = 12 m</text></g>
<text class="ts" x="340" y="345" text-anchor="middle" fill="#666">Schéma non à l'échelle</text>
</svg>
