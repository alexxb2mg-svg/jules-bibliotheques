<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="24" text-anchor="middle">On tire une bille au hasard dans le sac</text>
<path d="M70 70 L70 230 Q70 250 90 250 L230 250 Q250 250 250 230 L250 70" fill="none" stroke="#444" stroke-width="2.5"/>
<circle cx="100" cy="170" r="18" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
<circle cx="140" cy="170" r="18" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<circle cx="180" cy="170" r="18" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
<circle cx="220" cy="170" r="18" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<circle cx="100" cy="212" r="18" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<circle cx="140" cy="212" r="18" fill="#ef4444" stroke="#991b1b" stroke-width="1"/>
<circle cx="180" cy="212" r="18" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<circle cx="220" cy="212" r="18" fill="#3b82f6" stroke="#1e40af" stroke-width="1"/>
<text class="ts" x="160" y="274" text-anchor="middle">3 rouges + 5 bleues = 8 billes</text>

<text class="th" x="372" y="128" text-anchor="end" dominant-baseline="central">P(rouge) =</text>
<text class="tl" x="405" y="112" text-anchor="middle" dominant-baseline="central" fill="#b91c1c">3</text>
<line x1="388" y1="128" x2="422" y2="128" stroke="#222" stroke-width="2"/>
<text class="tl" x="405" y="146" text-anchor="middle" dominant-baseline="central">8</text>
<text class="ts" x="440" y="112" text-anchor="start" dominant-baseline="central" fill="#b91c1c">3 billes rouges (favorables)</text>
<text class="ts" x="440" y="146" text-anchor="start" dominant-baseline="central">8 billes en tout (possibles)</text>

<g class="node c-blue"><rect x="290" y="190" width="370" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="475" y="209" text-anchor="middle" dominant-baseline="central">Contraire : P(non rouge) = 1 − P(rouge)</text>
<text class="ts" x="475" y="231" text-anchor="middle" dominant-baseline="central">1 − 0,375 = 0,625, soit 5 ÷ 8 : les 5 billes bleues</text></g>

<line x1="60" y1="330" x2="620" y2="330" stroke="#444" stroke-width="2"/>
<line x1="60" y1="322" x2="60" y2="338" stroke="#444" stroke-width="2"/>
<line x1="340" y1="324" x2="340" y2="336" stroke="#444" stroke-width="1.5"/>
<line x1="620" y1="322" x2="620" y2="338" stroke="#444" stroke-width="2"/>
<circle cx="270" cy="330" r="7" fill="#ef4444" stroke="none"/>
<circle cx="410" cy="330" r="7" fill="#3b82f6" stroke="none"/>
<text class="ts" x="270" y="312" text-anchor="middle" fill="#b91c1c">P(rouge) = 0,375</text>
<text class="ts" x="410" y="312" text-anchor="middle" fill="#1d4ed8">P(non rouge) = 0,625</text>
<text class="ts" x="60" y="356" text-anchor="start">0 : impossible</text>
<text class="ts" x="340" y="356" text-anchor="middle">0,5</text>
<text class="ts" x="620" y="356" text-anchor="end">1 : certain</text>
<text class="ts" x="340" y="380" text-anchor="middle" fill="#666">Une probabilité est toujours comprise entre 0 et 1.</text>
</svg>
