<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<g class="node c-gray"><rect x="190" y="16" width="300" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Diviseurs de 36, par paires</text></g>
<g class="node c-blue"><rect x="40" y="84" width="130" height="48" rx="8" stroke-width="0.5"/>
<text class="t" x="105" y="108" text-anchor="middle" dominant-baseline="central">1 × 36</text></g>
<g class="node c-blue"><rect x="180" y="84" width="130" height="48" rx="8" stroke-width="0.5"/>
<text class="t" x="245" y="108" text-anchor="middle" dominant-baseline="central">2 × 18</text></g>
<g class="node c-blue"><rect x="320" y="84" width="130" height="48" rx="8" stroke-width="0.5"/>
<text class="t" x="385" y="108" text-anchor="middle" dominant-baseline="central">3 × 12</text></g>
<g class="node c-blue"><rect x="460" y="84" width="130" height="48" rx="8" stroke-width="0.5"/>
<text class="t" x="525" y="108" text-anchor="middle" dominant-baseline="central">4 × 9</text></g>
<g class="node c-teal"><rect x="250" y="150" width="180" height="48" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="174" text-anchor="middle" dominant-baseline="central">6 × 6</text></g>
<line x1="290" y1="150" x2="150" y2="198" class="arr" marker-end="url(#arrow)"/>
<line x1="390" y1="150" x2="530" y2="198" class="arr" marker-end="url(#arrow)"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-coral"><rect x="20" y="204" width="260" height="48" rx="8" stroke-width="0.5"/>
<text class="ts" x="150" y="228" text-anchor="middle" dominant-baseline="central">Avant la croisée : 1, 2, 3, 4</text></g>
<g class="node c-coral"><rect x="400" y="204" width="260" height="48" rx="8" stroke-width="0.5"/>
<text class="ts" x="530" y="228" text-anchor="middle" dominant-baseline="central">Après la croisée : 9, 12, 18, 36</text></g>
<g class="c-gray"><rect x="40" y="262" width="600" height="34" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="279" text-anchor="middle" dominant-baseline="central">36 = 6 × 6 : dès que les paires se croisent, tous les diviseurs sont trouvés.</text></g>
</svg>
