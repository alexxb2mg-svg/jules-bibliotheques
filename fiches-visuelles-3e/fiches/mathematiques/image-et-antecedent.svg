<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="180" y="20" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Sur une courbe de f</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">chaque point est M(x ; f(x))</text></g>
<line x1="300" y1="76" x2="170" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="76" x2="430" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="40" y="130" width="220" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="153" text-anchor="middle" dominant-baseline="central">Chercher une image</text>
<text class="ts" x="150" y="174" text-anchor="middle" dominant-baseline="central">on connaît x</text>
<text class="ts" x="150" y="191" text-anchor="middle" dominant-baseline="central">on part de l'axe horizontal, on monte</text></g>
<g class="node c-teal"><rect x="360" y="130" width="270" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="153" text-anchor="middle" dominant-baseline="central">Chercher un antécédent</text>
<text class="ts" x="495" y="174" text-anchor="middle" dominant-baseline="central">on connaît f(x)</text>
<text class="ts" x="495" y="191" text-anchor="middle" dominant-baseline="central">on part de l'axe vertical, on trace l'horizontale</text></g>
<line x1="150" y1="200" x2="150" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="200" x2="495" y2="240" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="40" y="250" width="220" height="90" rx="8" stroke-width="0.5"/>
<line x1="70" y1="320" x2="240" y2="320" stroke="#333" stroke-width="1"/>
<line x1="70" y1="260" x2="70" y2="330" stroke="#333" stroke-width="1"/>
<line x1="130" y1="330" x2="130" y2="285" stroke="#8855aa" stroke-dasharray="3,3" stroke-width="1"/>
<line x1="70" y1="285" x2="130" y2="285" stroke="#8855aa" stroke-dasharray="3,3" stroke-width="1"/>
<circle cx="130" cy="285" r="4" fill="#8855aa"/>
<text class="ts" x="150" y="326" text-anchor="middle">image lue</text></g>
<g class="node c-red"><rect x="360" y="250" width="270" height="90" rx="8" stroke-width="0.5"/>
<line x1="390" y1="320" x2="620" y2="320" stroke="#333" stroke-width="1"/>
<line x1="390" y1="260" x2="390" y2="330" stroke="#333" stroke-width="1"/>
<line x1="390" y1="290" x2="620" y2="290" stroke="#cc3333" stroke-dasharray="3,3" stroke-width="1"/>
<circle cx="460" cy="290" r="4" fill="#cc3333"/>
<circle cx="560" cy="290" r="4" fill="#cc3333"/>
<text class="ts" x="500" y="326" text-anchor="middle">deux antécédents possibles</text></g>
<g class="c-gray"><rect x="40" y="360" width="600" height="50" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="385" text-anchor="middle" dominant-baseline="central">Une image est unique — un antécédent peut être zéro, un ou plusieurs</text>
</g>
</svg>
