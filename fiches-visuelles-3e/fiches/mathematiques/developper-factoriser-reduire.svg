<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central">Trois identités remarquables</text>
<g class="node c-blue"><rect x="30" y="50" width="620" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="345" y="75" text-anchor="middle" dominant-baseline="central">(a + b)² = a² + 2ab + b²</text>
<text class="ts" x="345" y="100" text-anchor="middle" dominant-baseline="central">trois termes, tous positifs</text>
<text class="ts" x="345" y="120" text-anchor="middle" dominant-baseline="central">carré du premier + double produit + carré du second</text></g>
<g class="node c-teal"><rect x="30" y="160" width="620" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="345" y="185" text-anchor="middle" dominant-baseline="central">(a − b)² = a² − 2ab + b²</text>
<text class="ts" x="345" y="210" text-anchor="middle" dominant-baseline="central">trois termes, le double produit se soustrait</text>
<text class="ts" x="345" y="230" text-anchor="middle" dominant-baseline="central">le dernier terme b² reste positif</text></g>
<g class="node c-coral"><rect x="30" y="270" width="620" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="345" y="295" text-anchor="middle" dominant-baseline="central">(a − b)(a + b) = a² − b²</text>
<text class="ts" x="345" y="320" text-anchor="middle" dominant-baseline="central">deux termes seulement</text>
<text class="ts" x="345" y="340" text-anchor="middle" dominant-baseline="central">différence de deux carrés</text></g>
<g class="c-gray"><rect x="40" y="380" width="600" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="402" text-anchor="middle" dominant-baseline="central">Pour reconnaître laquelle utiliser :</text>
<text class="t" x="340" y="422" text-anchor="middle" dominant-baseline="central">compte les termes, regarde les signes.</text></g>
</svg>
