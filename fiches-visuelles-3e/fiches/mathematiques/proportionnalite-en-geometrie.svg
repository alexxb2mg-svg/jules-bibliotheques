<text class="th" x="340" y="344" text-anchor="middle" dominant-baseline="central">k pour les longueurs</text>
<text class="ts" x="340" y="362" text-anchor="middle" dominant-baseline="central">k² pour les aires, k³ pour les volumes</text></g>
</svg>
