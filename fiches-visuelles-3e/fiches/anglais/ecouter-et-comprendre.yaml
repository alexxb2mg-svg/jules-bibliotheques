    jules: "Personne ne comprend 100 % des mots d'un document authentique, même en 3e : on reconstitue le sens en **recoupant plusieurs indices**, comme un détective."

  - id: schema
    type: schema
    titre: "Trois temps d'écoute, deux sortes d'indices"
    svg: "ecouter-et-comprendre.svg"
    jules: "Les indices **extralinguistiques** (en orange) arrivent avant les mots : dès les premières secondes, un bruit de gare ou un ton fâché te dit déjà beaucoup de choses."

  - id: schema-intonation
    type: schema
    titre: "L'intonation et les mots-outils, des indices à guetter"
    svg: "ecouter-et-comprendre-intonation.svg"
    jules: "Attention : une question qui commence par un mot en wh- (where, what, why) **descend** le plus souvent. Seules les questions fermées, auxquelles on répond par yes ou no, montent nettement."

  - id: methode
    type: methode
    etapes:
      - "Avant l'écoute : observer le titre, l'image ou la consigne pour **anticiper** le sujet et les mots probables."
      - "Première écoute : repérer la situation sans chercher à tout comprendre (qui parle ? où ? de quoi ?) grâce aux bruits, aux voix et aux mots reconnus."
      - "Deuxième écoute : se concentrer sur les **mots-clés** et les connecteurs (first, then, but, because) qui organisent le message."
      - "Face à un mot inconnu : ne pas s'arrêter, continuer à écouter et **déduire son sens** du contexte, ou l'ignorer s'il n'est pas essentiel."
      - "Écouter le ton de voix (colère, joie, surprise) et l'intonation (une question fermée monte) pour comprendre l'intention de celui qui parle."
    jules: "Note au brouillon des mots isolés pendant l'écoute (noms, chiffres, lieux) : à la fin, ils forment souvent le squelette du message."

  - id: piege
    type: piege
    mauvaise_idee: "Vouloir comprendre chaque mot, et bloquer sur le premier mot inconnu."
    pourquoi_faux: "Pendant qu'on cherche le sens d'un mot, l'enregistrement continue : on perd le fil de la suite, alors qu'on n'a souvent besoin que du **sens global**."
    bonne_idee: "Viser d'abord qui parle, où et de quoi, en s'appuyant sur les indices (bruits, ton, mots reconnus), puis affiner les détails à l'écoute suivante."
    jules: "Un autre piège : ignorer les **indices non verbaux**. Des rires, une musique ou une sirène donnent des informations gratuites sur la situation."

  - id: exemple
    type: exemple
    situation: "On entend : « Excuse me, where is the train station? » (Excusez-moi, où est la gare ?) puis « It's over there, next to the bank. » (C'est là-bas, à côté de la banque.) On ne connaît pas tous les mots."
    calcul: "Indices linguistiques : « where is » (où est) et « train station » (gare) annoncent une demande de chemin ; « over there » (là-bas) et « next to » (à côté de) indiquent un lieu. Indice de ton : « Excuse me » est une formule polie pour aborder un inconnu."
    conclusion: "Une personne demande poliment **son chemin** vers la gare à un passant, qui lui répond qu'elle est juste à côté de la banque."
    jules: "Même sans connaître « bank », tu devines un bâtiment de la rue : le mot est proche du français « banque », c'est un **mot transparent**."

  - id: exemple-aeroport
    type: exemple
    situation: "Dans une vidéo, on voit des valises et un grand panneau d'affichage ; on entend une voix au micro : « Flight 304 to London is now boarding at gate 12. » (Le vol 304 à destination de Londres embarque maintenant porte 12.)"
    calcul: "Indices extralinguistiques : valises, panneau, annonce au micro, donc un aéroport. Indices linguistiques : « flight » (vol), « to London » (vers Londres), « gate 12 » (porte 12) ; « boarding » (embarquement) se devine grâce à la situation."
    conclusion: "C'est une **annonce d'aéroport** : les passagers du vol pour Londres doivent se rendre porte 12 pour embarquer."
    jules: "Mettre en relation l'image et le son est un réflexe à prendre avec les vidéos : l'image confirme ou corrige ce que tu crois avoir entendu."

