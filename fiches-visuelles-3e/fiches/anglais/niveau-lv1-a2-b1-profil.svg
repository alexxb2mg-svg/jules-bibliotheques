<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profil d'une élève : B1 en écoute et en lecture, A2 à l'oral et à l'écrit ; tout est au moins A2">
<text class="th" x="340" y="22" text-anchor="middle" dominant-baseline="central">Exemple : le profil de Léa en fin de 3e (LV1)</text>
<rect x="240" y="56" width="100" height="264" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="290" y="44" text-anchor="middle" dominant-baseline="central">A1</text>
<rect x="340" y="56" width="100" height="264" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="390" y="44" text-anchor="middle" dominant-baseline="central">A2</text>
<rect x="440" y="56" width="100" height="264" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="490" y="44" text-anchor="middle" dominant-baseline="central">B1</text>
<rect x="540" y="56" width="100" height="264" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<text class="th" x="590" y="44" text-anchor="middle" dominant-baseline="central">B2</text>
<text class="t" x="228" y="88" text-anchor="end" dominant-baseline="central">Écouter</text>
<g class="c-green"><rect x="240" y="72" width="300" height="32" rx="6" stroke-width="0.5"/>
<text class="th" x="528" y="88" text-anchor="end" dominant-baseline="central">B1</text></g>
<text class="t" x="228" y="140" text-anchor="end" dominant-baseline="central">Lire</text>
<g class="c-green"><rect x="240" y="124" width="300" height="32" rx="6" stroke-width="0.5"/>
<text class="th" x="528" y="140" text-anchor="end" dominant-baseline="central">B1</text></g>
<text class="t" x="228" y="192" text-anchor="end" dominant-baseline="central">Parler en continu</text>
<g class="c-amber"><rect x="240" y="176" width="200" height="32" rx="6" stroke-width="0.5"/>
<text class="th" x="428" y="192" text-anchor="end" dominant-baseline="central">A2</text></g>
<text class="t" x="228" y="244" text-anchor="end" dominant-baseline="central">Écrire</text>
<g class="c-amber"><rect x="240" y="228" width="200" height="32" rx="6" stroke-width="0.5"/>
<text class="th" x="428" y="244" text-anchor="end" dominant-baseline="central">A2</text></g>
<text class="t" x="228" y="296" text-anchor="end" dominant-baseline="central">Réagir et dialoguer</text>
<g class="c-amber"><rect x="240" y="280" width="200" height="32" rx="6" stroke-width="0.5"/>
<text class="th" x="428" y="296" text-anchor="end" dominant-baseline="central">A2</text></g>
<line x1="440" y1="56" x2="440" y2="330" stroke="#854F0B" stroke-width="2" stroke-dasharray="6 4"/>
<g class="c-amber"><text class="ts" x="446" y="338" text-anchor="start" dominant-baseline="central">seuil A2 : atteint dans les 5 activités</text></g>
<text class="ts" x="40" y="366" text-anchor="start" dominant-baseline="central">Écouter et lire (réception) en B1 : on comprend souvent plus qu'on ne sait dire.</text>
<text class="ts" x="40" y="386" text-anchor="start" dominant-baseline="central">Parler, écrire, dialoguer en A2 : il faut produire et réagir soi-même. Profil normal.</text>
</svg>
