relecture: {statut: a_relire}
generation: {par: "projet-jules", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: formule
    type: formule
    expression: "[modal] + [BV]"
    termes:
      modal: {couleur: violet, legende: "can, could, must, may, might, should, will : même forme à toutes les personnes, **jamais de -s**"}
      BV: {couleur: vert, legende: "la **base verbale**, sans to : You must wear a helmet (tu dois porter un casque)."}
    jules: "Un modal ne prend jamais de -s ni de to derrière lui : « she can swim » (elle sait nager), jamais « she cans » ni « she can to swim »."

  - id: carte
    type: carte
    noeuds:
      - {id: verbe, titre: "Groupe verbal", sous_titre: "le verbe et ce qui l'accompagne", principal: true}
      - {id: temps, titre: "Temps", sous_titre: "présent, prétérit, present perfect"}
      - {id: avenir, titre: "Avenir", sous_titre: "will, be going to"}
      - {id: modaux, titre: "Modaux", sous_titre: "capacité, permission, obligation, conseil"}
      - {id: passif, titre: "Voix passive", sous_titre: "BE + participe passé"}
    liens:
      - {de: verbe, vers: temps}
      - {de: verbe, vers: avenir}
      - {de: verbe, vers: modaux}
      - {de: verbe, vers: passif}
    jules: "Le **participe passé** sert deux fois : au present perfect (HAVE + participe passé) et au passif (BE + participe passé). Pour les verbes réguliers, il se termine en -ed, comme le prétérit."

  - id: schema-frise
    type: schema
    titre: "Les temps sur la ligne du temps"
    svg: "groupe-verbal.svg"
    jules: "Le prétérit coupe l'action du présent (fini, daté) ; le **present perfect** fait un pont entre le passé et maintenant. Les mots yesterday, last year, in 2019 appellent le prétérit ; never, ever, already, just appellent souvent le present perfect."

  - id: schema-passif
    type: schema
    titre: "Passer de la voix active à la voix passive"
    svg: "groupe-verbal-passif.svg"
    jules: "Le temps se lit sur **BE** : was written (prétérit), is written (présent), has been written (present perfect). Le participe passé, lui, ne bouge pas."

  - id: graphe-temps
    type: graphe
    gabarit: frise-temps-verbaux
    curseurs:
      - {id: curseur-moment, nom: moment, min: -3, max: 3, pas: 1, depart: -2}
      - {id: curseur-lien, nom: lien, min: 0, max: 1, pas: 1, depart: 0}
    lectures:
      - {si: "moment < 0 && lien == 0", texte: "Action finie et datée, coupée de maintenant : **prétérit** (I visited London in 2019)."}
      - {si: "moment < 0 && lien == 1", texte: "Le passé touche maintenant (bilan, expérience) : **present perfect**, HAVE + participe passé (I have never visited Japan)."}
      - {si: "moment == 0", texte: "Maintenant : **présent simple** pour une habitude (she plays), BE + V-ing pour une action en cours (she is playing)."}
      - {si: "moment > 0", texte: "Avenir : **will** + BV pour une décision ou une prédiction, **BE going to** + BV pour une intention déjà prévue."}
    jules: "Place l'action dans le passé, puis bouge seulement lien : quand le pont vert relie l'action à now, c'est le present perfect ; sans pont, avec une date, c'est le prétérit. Le curseur lien ne compte que pour le passé."

  - id: methode
    type: methode
    etapes:
      - "Habitude, vérité générale → **présent simple**, avec -s à la 3e personne du singulier (she plays, elle joue). Action en cours maintenant → sujet + BE + V-ing (she is playing, elle est en train de jouer)."
      - "Action terminée, datée, sans lien avec maintenant → **prétérit** (V-ed ou verbe irrégulier). Bilan ou conséquence visible maintenant → **present perfect** (HAVE + participe passé)."
      - "Avenir : will + BV pour une prédiction ou une décision prise en parlant ; BE + going to + BV pour une intention déjà prévue ou un indice visible."
      - "Capacité, permission, obligation, conseil → un **modal** suivi de la base verbale, sans to."
      - "Pour mettre en avant ce qui subit l'action → **voix passive**, BE conjugué + participe passé, avec by seulement si l'auteur compte."
    jules: "Pour trouver un participe passé irrégulier, apprends la 3e colonne de la liste : go, went, gone ; write, wrote, written ; steal, stole, stolen."

  - id: piege
    type: piege
    mauvaise_idee: "Employer le present perfect avec une date passée, comme le passé composé français : « I have visited London in 2019 »."
    pourquoi_faux: "Une date ou un moment terminé (in 2019, yesterday, last week) coupe l'action du présent : c'est le **prétérit** qui convient, pas le present perfect."
    bonne_idee: "« I visited London in 2019. » (je suis allé à Londres en 2019) mais « I have never visited Japan. » (je ne suis jamais allé au Japon : bilan jusqu'à maintenant)."
    jules: "Le passé composé français se traduit tantôt par le prétérit, tantôt par le **present perfect** : c'est la présence d'un moment passé précis qui tranche."

  - id: exemple-futur
    type: exemple
    situation: "Choisir will ou be going to : A. « The phone is ringing. — I ___ answer it! » B. « I've bought paint. I ___ paint my room this weekend. »"
    calcul: "A. Décision prise au moment où l'on parle → will. B. Intention déjà prévue (la peinture est achetée) → BE + going to."
    conclusion: "A. « I'll answer it! » (je vais répondre !) ; B. « I'm going to paint my room this weekend. » (je vais repeindre ma chambre ce week-end)."
    jules: "I'll est la forme contractée de I will, très courante à l'oral. En français, les deux se traduisent souvent par « je vais » : c'est la situation qui fait choisir."

  - id: exemple-passif
    type: exemple
    situation: "Mettre à la voix passive : « People speak English all over the world. » (on parle anglais partout dans le monde)"
    calcul: "Le complément English devient sujet. Le verbe actif speak est au présent → BE au présent : is. Participe passé de speak : spoken. L'auteur (people, les gens) n'apporte rien → pas de by."
    conclusion: "« English **is spoken** all over the world. » (l'anglais est parlé partout dans le monde)"
    jules: "Le « on » français se traduit très souvent par un passif : « on m'a volé mon vélo » devient « my bike was stolen »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Construction des verbes à retenir : like, love, hate + V-ing (I love reading, j'adore lire) ; want + to + BV (I want to go, je veux y aller)."
