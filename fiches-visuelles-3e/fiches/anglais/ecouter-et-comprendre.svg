<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5"/></marker></defs>
<g class="node c-purple"><rect x="170" y="30" width="150" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="245" y="50" text-anchor="middle" dominant-baseline="central">Avant l'écoute</text>
<text class="ts" x="245" y="70" text-anchor="middle" dominant-baseline="central">anticiper</text></g>
<g class="node c-purple"><rect x="340" y="30" width="150" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="415" y="50" text-anchor="middle" dominant-baseline="central">1re écoute</text>
<text class="ts" x="415" y="70" text-anchor="middle" dominant-baseline="central">le sens global</text></g>
<g class="node c-purple"><rect x="510" y="30" width="150" height="54" rx="8" stroke-width="0.5"/>
<text class="th" x="585" y="50" text-anchor="middle" dominant-baseline="central">2e écoute</text>
<text class="ts" x="585" y="70" text-anchor="middle" dominant-baseline="central">affiner, préciser</text></g>
<line x1="322" y1="57" x2="336" y2="57" class="arr" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#fl)"/>
<line x1="492" y1="57" x2="506" y2="57" class="arr" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#fl)"/>

<g class="node c-amber"><rect x="20" y="100" width="135" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="87" y="130" text-anchor="middle" dominant-baseline="central">Indices</text>
<text class="ts" x="87" y="150" text-anchor="middle" dominant-baseline="central">extralinguistiques</text></g>
<g class="node c-amber"><rect x="170" y="100" width="150" height="80" rx="8" stroke-width="0.5"/>
<text class="ts" x="245" y="130" text-anchor="middle" dominant-baseline="central">titre, image,</text>
<text class="ts" x="245" y="150" text-anchor="middle" dominant-baseline="central">contexte donné</text></g>
<g class="node c-amber"><rect x="340" y="100" width="150" height="80" rx="8" stroke-width="0.5"/>
<text class="ts" x="415" y="120" text-anchor="middle" dominant-baseline="central">ton de voix,</text>
<text class="ts" x="415" y="140" text-anchor="middle" dominant-baseline="central">bruits de fond,</text>
<text class="ts" x="415" y="160" text-anchor="middle" dominant-baseline="central">images de la vidéo</text></g>
<g class="node c-amber"><rect x="510" y="100" width="150" height="80" rx="8" stroke-width="0.5"/>
<text class="ts" x="585" y="120" text-anchor="middle" dominant-baseline="central">ton de voix :</text>
<text class="ts" x="585" y="140" text-anchor="middle" dominant-baseline="central">émotion de</text>
<text class="ts" x="585" y="160" text-anchor="middle" dominant-baseline="central">celui qui parle</text></g>

<g class="node c-blue"><rect x="20" y="195" width="135" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="87" y="225" text-anchor="middle" dominant-baseline="central">Indices</text>
<text class="ts" x="87" y="245" text-anchor="middle" dominant-baseline="central">linguistiques</text></g>
<g class="node c-blue"><rect x="170" y="195" width="150" height="80" rx="8" stroke-width="0.5"/>
<text class="ts" x="245" y="225" text-anchor="middle" dominant-baseline="central">mots du titre</text>
<text class="ts" x="245" y="245" text-anchor="middle" dominant-baseline="central">et de la consigne</text></g>
<g class="node c-blue"><rect x="340" y="195" width="150" height="80" rx="8" stroke-width="0.5"/>
<text class="ts" x="415" y="215" text-anchor="middle" dominant-baseline="central">mots reconnus,</text>
<text class="ts" x="415" y="235" text-anchor="middle" dominant-baseline="central">même isolés :</text>
<text class="ts" x="415" y="255" text-anchor="middle" dominant-baseline="central">station, menu...</text></g>
<g class="node c-blue"><rect x="510" y="195" width="150" height="80" rx="8" stroke-width="0.5"/>
<text class="ts" x="585" y="215" text-anchor="middle" dominant-baseline="central">connecteurs : first,</text>
<text class="ts" x="585" y="235" text-anchor="middle" dominant-baseline="central">then, but, because ;</text>
<text class="ts" x="585" y="255" text-anchor="middle" dominant-baseline="central">intonation ↗ ou ↘</text></g>

<g class="node c-gray"><rect x="20" y="290" width="135" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="87" y="312" text-anchor="middle" dominant-baseline="central">Objectif</text></g>
<g class="node c-gray"><rect x="170" y="290" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="245" y="312" text-anchor="middle" dominant-baseline="central">deviner le sujet</text></g>
<g class="node c-gray"><rect x="340" y="290" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="415" y="312" text-anchor="middle" dominant-baseline="central">qui ? où ? quoi ?</text></g>
<g class="node c-gray"><rect x="510" y="290" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="585" y="312" text-anchor="middle" dominant-baseline="central">détails, raisons</text></g>

<text class="ts" x="340" y="362" text-anchor="middle" dominant-baseline="central">Un mot inconnu ? On continue d'écouter : le contexte en donne souvent le sens.</text>
<text class="ts" x="340" y="382" text-anchor="middle" dominant-baseline="central">Orange = ce qu'on perçoit sans les mots ; bleu = ce que disent les mots eux-mêmes.</text>
</svg>
