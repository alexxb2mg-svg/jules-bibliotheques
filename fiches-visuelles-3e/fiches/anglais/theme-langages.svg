<g class="c-coral"><rect x="520" y="168" width="140" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="590.0" y="193.0" text-anchor="middle" dominant-baseline="central">10,000</text></g>
<text class="th" x="24" y="243" text-anchor="start" dominant-baseline="central">Température</text>
<text class="ts" x="24" y="261" text-anchor="start" dominant-baseline="central">météo</text>
<g class="c-gray"><rect x="220" y="226" width="140" height="50" rx="6" stroke-width="0.5"/>
