<g class="c-coral"><rect x="520" y="110" width="140" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="590.0" y="135.0" text-anchor="middle" dominant-baseline="central">1.5</text></g>
<text class="th" x="24" y="185" text-anchor="start" dominant-baseline="central">Grand nombre</text>
<text class="ts" x="24" y="203" text-anchor="start" dominant-baseline="central">dix mille</text>
<g class="c-gray"><rect x="220" y="168" width="140" height="50" rx="6" stroke-width="0.5"/>
