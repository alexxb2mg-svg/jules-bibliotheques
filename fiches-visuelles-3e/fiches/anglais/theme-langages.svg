<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tableau comparant les codes de la France, du Royaume-Uni et des États-Unis pour les dates, les nombres, les températures et les distances">
