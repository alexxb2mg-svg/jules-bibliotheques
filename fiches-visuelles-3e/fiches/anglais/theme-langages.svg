<g class="c-coral"><rect x="520" y="52" width="140" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="590.0" y="69.0" text-anchor="middle" dominant-baseline="central">09/26/2026</text>
<text class="ts" x="590.0" y="87.0" text-anchor="middle" dominant-baseline="central">mois d'abord</text></g>
<text class="th" x="24" y="127" text-anchor="start" dominant-baseline="central">Nombre décimal</text>
<text class="ts" x="24" y="145" text-anchor="start" dominant-baseline="central">un et demi</text>
<g class="c-gray"><rect x="220" y="110" width="140" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="290.0" y="135.0" text-anchor="middle" dominant-baseline="central">1,5</text></g>
<g class="c-coral"><rect x="370" y="110" width="140" height="50" rx="6" stroke-width="0.5"/>
