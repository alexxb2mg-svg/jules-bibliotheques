<text class="th" x="590" y="30" text-anchor="middle" dominant-baseline="central">États-Unis (US)</text>
<text class="th" x="24" y="69" text-anchor="start" dominant-baseline="central">Date écrite</text>
<text class="ts" x="24" y="87" text-anchor="start" dominant-baseline="central">le 26 septembre 2026</text>
<g class="c-gray"><rect x="220" y="52" width="140" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="290.0" y="77.0" text-anchor="middle" dominant-baseline="central">26/09/2026</text></g>
<g class="c-gray"><rect x="370" y="52" width="140" height="50" rx="6" stroke-width="0.5"/>
