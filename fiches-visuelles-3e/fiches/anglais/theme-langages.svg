<g class="c-coral"><rect x="520" y="226" width="140" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="590.0" y="243.0" text-anchor="middle" dominant-baseline="central">°F</text>
<text class="ts" x="590.0" y="261.0" text-anchor="middle" dominant-baseline="central">32 °F = 0 °C</text></g>
<text class="th" x="24" y="301" text-anchor="start" dominant-baseline="central">Distance</text>
<text class="ts" x="24" y="319" text-anchor="start" dominant-baseline="central">panneaux routiers</text>
<g class="c-gray"><rect x="220" y="284" width="140" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="290.0" y="309.0" text-anchor="middle" dominant-baseline="central">km</text></g>
