<g class="c-coral"><rect x="520" y="284" width="140" height="50" rx="6" stroke-width="0.5"/>
<text class="th" x="590.0" y="309.0" text-anchor="middle" dominant-baseline="central">miles</text></g>
<g class="c-gray"><rect x="24" y="350" width="22" height="18" rx="4" stroke-width="0.5"/></g><text class="ts" x="54" y="359" text-anchor="start" dominant-baseline="central">comme en France</text>
<g class="c-coral"><rect x="220" y="350" width="22" height="18" rx="4" stroke-width="0.5"/></g><text class="ts" x="250" y="359" text-anchor="start" dominant-baseline="central">différent de la France : attention en lisant</text>
<text class="ts" x="24" y="394" text-anchor="start" dominant-baseline="central">1 mile ≈ 1,6 km. Au Royaume-Uni, la vitesse est aussi en miles par heure (mph).</text>
