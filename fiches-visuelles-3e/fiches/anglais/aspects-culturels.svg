<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<g class="node c-blue"><rect x="20" y="10" width="440" height="330" rx="12" stroke-width="1"/>
<text class="th" x="240" y="32" text-anchor="middle" dominant-baseline="central">The United Kingdom (le Royaume-Uni) : un État</text></g>
<g class="node c-teal"><rect x="40" y="52" width="400" height="168" rx="10" stroke-width="1"/>
<text class="th" x="240" y="72" text-anchor="middle" dominant-baseline="central">Great Britain (la Grande-Bretagne) : une île</text></g>
<g class="node c-gray"><rect x="55" y="90" width="120" height="116" rx="8" stroke-width="0.5"/>
<text class="th" x="115" y="112" text-anchor="middle" dominant-baseline="central">England</text>
<text class="ts" x="115" y="132" text-anchor="middle" dominant-baseline="central">(l'Angleterre)</text>
<text class="t" x="115" y="164" text-anchor="middle" dominant-baseline="central">London</text>
<text class="ts" x="115" y="184" text-anchor="middle" dominant-baseline="central">(Londres)</text></g>
<g class="node c-gray"><rect x="180" y="90" width="120" height="116" rx="8" stroke-width="0.5"/>
<text class="th" x="240" y="112" text-anchor="middle" dominant-baseline="central">Scotland</text>
<text class="ts" x="240" y="132" text-anchor="middle" dominant-baseline="central">(l'Écosse)</text>
<text class="t" x="240" y="164" text-anchor="middle" dominant-baseline="central">Edinburgh</text>
<text class="ts" x="240" y="184" text-anchor="middle" dominant-baseline="central">(Édimbourg)</text></g>
<g class="node c-gray"><rect x="305" y="90" width="120" height="116" rx="8" stroke-width="0.5"/>
<text class="th" x="365" y="112" text-anchor="middle" dominant-baseline="central">Wales</text>
<text class="ts" x="365" y="132" text-anchor="middle" dominant-baseline="central">(le pays de Galles)</text>
<text class="t" x="365" y="164" text-anchor="middle" dominant-baseline="central">Cardiff</text>
<text class="ts" x="365" y="184" text-anchor="middle" dominant-baseline="central">(Cardiff)</text></g>
<g class="node c-gray"><rect x="40" y="232" width="200" height="92" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="252" text-anchor="middle" dominant-baseline="central">Northern Ireland</text>
<text class="ts" x="140" y="272" text-anchor="middle" dominant-baseline="central">(l'Irlande du Nord)</text>
<text class="t" x="140" y="298" text-anchor="middle" dominant-baseline="central">Belfast</text></g>
<text class="ts" x="350" y="262" text-anchor="middle" dominant-baseline="central">4 nations, 1 État :</text>
<text class="ts" x="350" y="280" text-anchor="middle" dominant-baseline="central">capitale London</text>
<text class="ts" x="350" y="298" text-anchor="middle" dominant-baseline="central">habitants : the British</text>

<g class="node c-amber"><rect x="480" y="160" width="180" height="120" rx="10" stroke-width="1"/>
<text class="th" x="570" y="182" text-anchor="middle" dominant-baseline="central">Ireland</text>
<text class="ts" x="570" y="202" text-anchor="middle" dominant-baseline="central">(l'Irlande)</text>
<text class="ts" x="570" y="226" text-anchor="middle" dominant-baseline="central">un autre État,</text>
<text class="ts" x="570" y="242" text-anchor="middle" dominant-baseline="central">hors du Royaume-Uni</text>
<text class="t" x="570" y="264" text-anchor="middle" dominant-baseline="central">Dublin</text></g>
<text class="ts" x="570" y="60" text-anchor="middle" dominant-baseline="central">Bleu = l'État Royaume-Uni</text>
<text class="ts" x="570" y="80" text-anchor="middle" dominant-baseline="central">Vert = l'île</text>
<text class="ts" x="570" y="100" text-anchor="middle" dominant-baseline="central">Orange = un autre État</text>
<text class="ts" x="340" y="370" text-anchor="middle" dominant-baseline="central">Schéma d'emboîtement, pas une carte : les tailles ne sont pas à l'échelle.</text>
</svg>
