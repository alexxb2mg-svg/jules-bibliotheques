blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: sens, titre: "Comprendre un texte écrit", sous_titre: "recouper plusieurs indices", principal: true}
      - {id: extra, titre: "Indices extralinguistiques", sous_titre: "type de document, titre, images, mise en page"}
      - {id: transp, titre: "Mots transparents", sous_titre: "proches du français, attention aux faux amis"}
