      - {de: sens, vers: connect}
    jules: "Un bon lecteur ne traduit pas : il construit une idée du sens avec les indices, puis la vérifie en lisant. C'est ce qu'on appelle une **stratégie de lecteur**."

  - id: schema
    type: schema
    titre: "Deviner un mot nouveau grâce à sa construction"
    svg: "lire.svg"
    jules: "Retiens surtout **un-** (le contraire), **-less** (sans) et **-ful** (plein de) : ils reviennent très souvent et permettent de deviner des dizaines de mots."

  - id: schema-faux-amis
    type: schema
    titre: "Mots transparents et faux amis"
    svg: "lire-faux-amis.svg"
    jules: "Un faux ami ressemble à un mot français mais n'a pas le même sens. Si ta traduction rend la phrase bizarre, c'est souvent le signe d'un **faux ami**."

  - id: methode
    type: methode
    etapes:
      - "Observer le document dans son ensemble avant de lire les phrases : **type de texte** (article, lettre, publicité), titre, images, mise en page."
      - "Repérer les **mots transparents**, les mots déjà connus et les mots répétés (souvent des mots-clés) pour se faire une première idée du sujet."
      - "Deviner les mots nouveaux grâce à leur construction (un-, re-, -ful, -less) et au contexte de la phrase."
      - "Relire en suivant les **connecteurs logiques** (but, so, because, however) qui montrent comment les idées s'enchaînent."
      - "Accepter de ne pas tout comprendre : chercher dans le texte ce qui répond à la question posée."
    jules: "Lis les questions avant le texte : tu sais alors quelles informations chercher, et tu peux passer plus vite sur le reste."

  - id: piege
    type: piege
    mauvaise_idee: "Traduire le texte mot à mot, dans l'ordre, et abandonner dès le premier mot inconnu."
    pourquoi_faux: "L'anglais ne se construit pas comme le français (l'adjectif se place avant le nom : a red car, une voiture rouge) ; mot à mot, la phrase devient incompréhensible et on perd le **sens global**."
    bonne_idee: "Chercher d'abord le sens général grâce aux indices (titre, images, mots transparents), puis préciser avec la construction des mots et les connecteurs."
    jules: "Autre piège fréquent : prendre un **faux ami** pour un mot transparent. « Library » veut dire bibliothèque, pas librairie."

  - id: exemple
    type: exemple
    situation: "Dans un texte, on lit : « Last summer, Sam volunteered at an animal shelter. However, the work was harder than he expected: the dogs were noisy and restless. » Il faut dire comment Sam a vécu cette expérience."
    calcul: "« volunteered » ressemble à volontaire (il a été **bénévole**) ; « animal shelter » : un lieu pour les animaux, donc un refuge. « However » (cependant) annonce une opposition. « restless » = rest (repos) + -less (sans) : agités."
    conclusion: "L'été dernier, Sam a été bénévole dans un refuge pour animaux, mais le travail a été **plus difficile que prévu** : les chiens étaient bruyants et agités."
    jules: "Le connecteur « however » était la clé : il indique que la suite contredit l'idée d'une expérience agréable."

  - id: exemple-titre
    type: exemple
    situation: "Un article s'intitule « Why Teenagers Need More Sleep », avec la photo d'un adolescent endormi sur son bureau. Que va dire l'article, avant même de le lire ?"
    calcul: "« Why » (pourquoi) annonce des raisons ; « teenagers » (adolescents) se devine avec la photo ; « need » (avoir besoin de) ; « more sleep » (plus de sommeil), confirmé par l'image."
    conclusion: "L'article va expliquer pourquoi les adolescents ont besoin de **dormir davantage** ; il faudra y chercher des raisons (causes, conséquences)."
    jules: "Le titre et l'image, ce sont des **indices extralinguistiques** : ils ne demandent presque aucun vocabulaire et orientent toute ta lecture."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Lire régulièrement de courts textes en anglais (BD, articles pour ados, paroles de chansons) est le meilleur entraînement : le vocabulaire se fixe en **contexte**."
