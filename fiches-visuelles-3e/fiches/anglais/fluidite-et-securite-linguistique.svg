<svg width="100%" viewBox="0 0 680 386" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Objectifs de l'oral : fluidité, intelligibilité, sécurité linguistique ; l'accent natif n'est pas un objectif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-green"><text class="th" x="20" y="16" text-anchor="start" dominant-baseline="central">On vise</text></g>
<g class="c-green"><rect x="20" y="30" width="200" height="84" rx="8" stroke-width="0.5"/><text class="th" x="120" y="54" text-anchor="middle" dominant-baseline="central">Fluidité</text><text class="ts" x="120" y="72" text-anchor="middle" dominant-baseline="central">parler sans trop</text><text class="ts" x="120" y="90" text-anchor="middle" dominant-baseline="central">de blocages</text></g>
<g class="c-green"><rect x="240" y="30" width="200" height="84" rx="8" stroke-width="0.5"/><text class="th" x="340" y="54" text-anchor="middle" dominant-baseline="central">Intelligibilité</text><text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central">être compris par</text><text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">son interlocuteur</text></g>
<g class="c-green"><rect x="460" y="30" width="200" height="84" rx="8" stroke-width="0.5"/><text class="th" x="560" y="54" text-anchor="middle" dominant-baseline="central">Sécurité linguistique</text><text class="ts" x="560" y="72" text-anchor="middle" dominant-baseline="central">oser parler, même</text><text class="ts" x="560" y="90" text-anchor="middle" dominant-baseline="central">avec des erreurs</text></g>
<g class="c-red"><text class="th" x="20" y="146" text-anchor="start" dominant-baseline="central">On ne vise pas</text></g>
<g class="c-red"><rect x="20" y="160" width="200" height="64" rx="8" stroke-width="0.5"/><text class="th" x="120" y="183" text-anchor="middle" dominant-baseline="central">✗ « L'accent natif »</text><text class="ts" x="120" y="201" text-anchor="middle" dominant-baseline="central">imiter parfaitement un natif</text></g>
<g class="c-red"><rect x="240" y="160" width="420" height="64" rx="8" stroke-width="0.5"/><text class="th" x="450" y="183" text-anchor="middle" dominant-baseline="central">✗ La phrase parfaite avant de parler</text><text class="ts" x="450" y="201" text-anchor="middle" dominant-baseline="central">attendre d'être sûr de tout = ne jamais s'entraîner</text></g>
<g class="c-green"><text class="th" x="20" y="258" text-anchor="start" dominant-baseline="central">Ce qui aide vraiment à être compris</text></g>
<g class="c-green"><rect x="20" y="272" width="200" height="52" rx="8" stroke-width="0.5"/><text class="t" x="120" y="289" text-anchor="middle" dominant-baseline="central">l'accent tonique</text><text class="ts" x="120" y="307" text-anchor="middle" dominant-baseline="central">PHOtograph, pas pho-to-graph</text></g>
<g class="c-green"><rect x="240" y="272" width="200" height="52" rx="8" stroke-width="0.5"/><text class="t" x="340" y="289" text-anchor="middle" dominant-baseline="central">un débit posé</text><text class="ts" x="340" y="307" text-anchor="middle" dominant-baseline="central">des pauses entre les idées</text></g>
<g class="c-green"><rect x="460" y="272" width="200" height="52" rx="8" stroke-width="0.5"/><text class="t" x="560" y="289" text-anchor="middle" dominant-baseline="central">les mots clés articulés</text><text class="ts" x="560" y="307" text-anchor="middle" dominant-baseline="central">noms et verbes bien audibles</text></g>
<text class="ts" x="20" y="350" text-anchor="start" dominant-baseline="central">Un léger accent français ne gêne pas si les mots restent clairs : il montre simplement d'où tu viens.</text>
<text class="ts" x="20" y="372" text-anchor="start" dominant-baseline="central">Vert : ce que le programme demande. Rouge (✗) : ce qu'il ne demande pas.</text>
</svg>
