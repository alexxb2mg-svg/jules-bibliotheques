      - {de: theme, vers: imaginaire}
    jules: "Le voyage est aussi un grand sujet de la littérature anglophone : dans Alice's Adventures in Wonderland (Lewis Carroll, 1865), une fillette tombe dans un monde **fantastique**."

  - id: schema-migration
    type: schema
    titre: "Emigration ou immigration : le même déplacement, deux points de vue"
    svg: "theme-voyages-et-migrations.svg"
    jules: "Moyen de t'en souvenir : emigration commence par E comme **exit** (sortie), immigration par I comme **in** (dedans). On dit emigrate from (partir de) et immigrate to (arriver dans)."

  - id: schema-empreinte
    type: schema
    titre: "L'empreinte carbone d'un trajet selon le moyen de transport"
    svg: "theme-voyages-et-migrations-empreinte.svg"
    jules: "L'**empreinte carbone** (carbon footprint) mesure les gaz à effet de serre rejetés par une activité. Pour un même trajet, l'avion en rejette beaucoup plus par passager que le train."

  - id: methode
    type: methode
    etapes:
      - "Identifier le sujet : un **voyage** (scolaire, touristique) ou une **migration** (départ pour s'installer ailleurs, parfois un exil forcé)."
      - "Choisir le bon mot : a trip (un séjour, une sortie), a journey (un trajet), to travel (voyager, verbe) ; emigrate (partir) ou immigrate (arriver)."
      - "Pour un voyage, parler de son impact : « to reduce my carbon footprint » (pour réduire mon empreinte carbone), sustainable tourism (tourisme durable)."
      - "Pour une migration, s'appuyer sur un **exemple réel** et daté, sans généraliser une seule histoire à tous les migrants."
    jules: "« Travel » est surtout un verbe : on dit « I travel a lot » (je voyage beaucoup), mais « a nice trip » (un beau voyage), pas « a nice travel »."

  - id: piege
    type: piege
    mauvaise_idee: "Employer **emigration** et **immigration** comme des synonymes."
    pourquoi_faux: "C'est le même déplacement vu de deux côtés : **emigration** = le départ, du point de vue du pays qu'on quitte ; **immigration** = l'arrivée, du point de vue du pays d'accueil."
    bonne_idee: "Se demander de quel côté on se place : « He emigrated from Ireland. » (Il a émigré d'Irlande.) « He immigrated to the USA. » (Il a immigré aux États-Unis.)"
    jules: "Autre piège : « a voyage » existe en anglais, mais il désigne surtout un **long voyage en mer ou dans l'espace**. Pour un voyage scolaire, on dit **a school trip**."

  - id: exemple-migration
    type: exemple
    situation: "Entre 1892 et 1954, plus de 12 millions d'immigrants sont passés par Ellis Island, le centre d'accueil de New York. Le raconter en anglais."
    calcul: "« Millions of Europeans emigrated from their countries. » (Des millions d'Européens ont émigré de leur pays.) « They arrived at Ellis Island, in New York, and immigrated to the USA. » (Ils sont arrivés à Ellis Island, à New York, et ont immigré aux États-Unis.)"
    conclusion: "On emploie **emigrated from** pour le départ d'Europe et **immigrated to** pour l'arrivée aux États-Unis, au prétérit car les faits sont passés et datés."
    jules: "Ellis Island est aujourd'hui un **musée de l'immigration** : beaucoup d'Américains y retrouvent le nom d'un ancêtre arrivé d'Europe."

  - id: exemple-voyage
    type: exemple
    situation: "Ta classe part en voyage scolaire à Londres. Expliquer en anglais le choix du transport."
    calcul: "« For our school trip to London, we took the Eurostar instead of the plane. » (Pour notre voyage scolaire à Londres, nous avons pris l'Eurostar au lieu de l'avion.) « The train goes under the Channel and has a smaller carbon footprint. » (Le train passe sous la Manche et a une empreinte carbone plus petite.)"
    conclusion: "Le **comparatif** (smaller, plus petite) et instead of (au lieu de) justifient un **choix écoresponsable**."
    jules: "L'Eurostar relie Paris à Londres en un peu plus de 2 heures par le **tunnel sous la Manche**, ouvert en 1994."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À retenir : **emigrate from** (partir de), **immigrate to** (arriver dans), a school trip (un voyage scolaire), carbon footprint (empreinte carbone)."
