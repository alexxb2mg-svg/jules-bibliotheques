blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: theme, titre: "Voyages et migrations", sous_titre: "se déplacer, s'installer ailleurs", principal: true}
      - {id: voyages, titre: "Voyages", sous_titre: "a trip, a journey, to travel"}
