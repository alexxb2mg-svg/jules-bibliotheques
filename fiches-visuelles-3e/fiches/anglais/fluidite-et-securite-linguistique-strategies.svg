<svg width="100%" viewBox="0 0 680 358" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quatre stratégies quand on bloque à l'oral : gagner du temps, contourner le mot, demander de l'aide, se reprendre">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-coral"><rect x="240" y="8" width="200" height="36" rx="8" stroke-width="0.5"/><text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central">Je bloque sur un mot</text></g>
<g class="c-blue"><rect x="20" y="62" width="190" height="50" rx="8" stroke-width="0.5"/><text class="th" x="115" y="87" text-anchor="middle" dominant-baseline="central">1. Gagner du temps</text></g>
<line x1="214" y1="87" x2="244" y2="87" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="250" y="62" width="410" height="50" rx="8" stroke-width="0.5"/><text class="t" x="455" y="78" text-anchor="middle" dominant-baseline="central">Well… Let me think…</text><text class="ts" x="455" y="96" text-anchor="middle" dominant-baseline="central">(eh bien… laisse-moi réfléchir…)</text></g>
<g class="c-blue"><rect x="20" y="124" width="190" height="50" rx="8" stroke-width="0.5"/><text class="th" x="115" y="149" text-anchor="middle" dominant-baseline="central">2. Contourner le mot</text></g>
<line x1="214" y1="149" x2="244" y2="149" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="250" y="124" width="410" height="50" rx="8" stroke-width="0.5"/><text class="t" x="455" y="140" text-anchor="middle" dominant-baseline="central">It's a kind of… It's like…</text><text class="ts" x="455" y="158" text-anchor="middle" dominant-baseline="central">(c'est une sorte de… c'est comme…)</text></g>
<g class="c-blue"><rect x="20" y="186" width="190" height="50" rx="8" stroke-width="0.5"/><text class="th" x="115" y="211" text-anchor="middle" dominant-baseline="central">3. Demander de l'aide</text></g>
<line x1="214" y1="211" x2="244" y2="211" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="250" y="186" width="410" height="50" rx="8" stroke-width="0.5"/><text class="t" x="455" y="202" text-anchor="middle" dominant-baseline="central">How do you say … in English?</text><text class="ts" x="455" y="220" text-anchor="middle" dominant-baseline="central">(comment dit-on … en anglais ?)</text></g>
<g class="c-blue"><rect x="20" y="248" width="190" height="50" rx="8" stroke-width="0.5"/><text class="th" x="115" y="273" text-anchor="middle" dominant-baseline="central">4. Se reprendre</text></g>
<line x1="214" y1="273" x2="244" y2="273" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="250" y="248" width="410" height="50" rx="8" stroke-width="0.5"/><text class="t" x="455" y="264" text-anchor="middle" dominant-baseline="central">Sorry, I mean…</text><text class="ts" x="455" y="282" text-anchor="middle" dominant-baseline="central">(pardon, je veux dire…)</text></g>
<path d="M240 26 L115 26 L115 58" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="20" y="322" text-anchor="start" dominant-baseline="central">Si tu n'as pas compris : Could you repeat, please? (pouvez-vous répéter, s'il vous plaît ?)</text>
<text class="ts" x="20" y="344" text-anchor="start" dominant-baseline="central">Corail : le blocage. Bleu : la stratégie. Gris : la phrase toute prête à dire.</text>
</svg>
