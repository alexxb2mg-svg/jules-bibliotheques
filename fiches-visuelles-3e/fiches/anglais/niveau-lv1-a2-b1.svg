<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les six niveaux du CECRL de A1 à C2 ; en fin de 3e en LV1, A2 est le minimum et B1 est visé dans plusieurs activités">
<text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central">Les 6 niveaux du CECRL, du plus simple au plus avancé</text>
<g class="c-gray"><rect x="40" y="210" width="95" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="87.5" y="230" text-anchor="middle" dominant-baseline="central">A1</text>
<text class="ts" x="87.5" y="254" text-anchor="middle" dominant-baseline="central">débutant :</text>
<text class="ts" x="87.5" y="270" text-anchor="middle" dominant-baseline="central">les bases</text></g>
<g class="c-amber"><rect x="145" y="180" width="95" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="192.5" y="200" text-anchor="middle" dominant-baseline="central">A2</text>
<text class="ts" x="192.5" y="224" text-anchor="middle" dominant-baseline="central">sujets</text>
<text class="ts" x="192.5" y="240" text-anchor="middle" dominant-baseline="central">familiers</text></g>
<g class="c-green"><rect x="250" y="150" width="95" height="150" rx="8" stroke-width="0.5"/>
<text class="th" x="297.5" y="170" text-anchor="middle" dominant-baseline="central">B1</text>
<text class="ts" x="297.5" y="194" text-anchor="middle" dominant-baseline="central">se débrouille</text>
<text class="ts" x="297.5" y="210" text-anchor="middle" dominant-baseline="central">en voyage</text></g>
<g class="c-gray"><rect x="355" y="120" width="95" height="180" rx="8" stroke-width="0.5"/>
<text class="th" x="402.5" y="140" text-anchor="middle" dominant-baseline="central">B2</text>
<text class="ts" x="402.5" y="164" text-anchor="middle" dominant-baseline="central">discute</text>
<text class="ts" x="402.5" y="180" text-anchor="middle" dominant-baseline="central">avec aisance</text></g>
<g class="c-gray"><rect x="460" y="90" width="95" height="210" rx="8" stroke-width="0.5"/>
<text class="th" x="507.5" y="110" text-anchor="middle" dominant-baseline="central">C1</text>
<text class="ts" x="507.5" y="134" text-anchor="middle" dominant-baseline="central">s'exprime</text>
<text class="ts" x="507.5" y="150" text-anchor="middle" dominant-baseline="central">couramment</text></g>
<g class="c-gray"><rect x="565" y="60" width="95" height="240" rx="8" stroke-width="0.5"/>
<text class="th" x="612.5" y="80" text-anchor="middle" dominant-baseline="central">C2</text>
<text class="ts" x="612.5" y="104" text-anchor="middle" dominant-baseline="central">proche d'un</text>
<text class="ts" x="612.5" y="120" text-anchor="middle" dominant-baseline="central">natif</text></g>
<g class="c-amber"><text class="th" x="192.5" y="128" text-anchor="middle" dominant-baseline="central">minimum</text><text class="ts" x="192.5" y="146" text-anchor="middle" dominant-baseline="central">dans les 5</text><text class="ts" x="192.5" y="162" text-anchor="middle" dominant-baseline="central">activités</text></g>
<g class="c-green"><text class="th" x="297.5" y="98" text-anchor="middle" dominant-baseline="central">visé</text><text class="ts" x="297.5" y="116" text-anchor="middle" dominant-baseline="central">dans</text><text class="ts" x="297.5" y="132" text-anchor="middle" dominant-baseline="central">plusieurs</text></g>
<path d="M40 312 L40 320 L240 320 L240 312" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="140.0" y="336" text-anchor="middle" dominant-baseline="central">utilisateur élémentaire</text>
<path d="M250 312 L250 320 L450 320 L450 312" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="350.0" y="336" text-anchor="middle" dominant-baseline="central">utilisateur indépendant</text>
<path d="M460 312 L460 320 L660 320 L660 312" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="560.0" y="336" text-anchor="middle" dominant-baseline="central">utilisateur expérimenté</text>
<g class="c-amber"><rect x="40" y="362" width="620" height="44" rx="8" stroke-width="0.5"/><text class="t" x="56" y="377" text-anchor="start" dominant-baseline="central">A2 : « I can talk about my family and my hobbies. »</text><text class="ts" x="56" y="395" text-anchor="start" dominant-baseline="central">(Je peux parler de ma famille et de mes loisirs.)</text></g>
<g class="c-green"><rect x="40" y="414" width="620" height="44" rx="8" stroke-width="0.5"/><text class="t" x="56" y="429" text-anchor="start" dominant-baseline="central">B1 : « I can tell a story and give my opinion. »</text><text class="ts" x="56" y="447" text-anchor="start" dominant-baseline="central">(Je peux raconter une histoire et donner mon avis.)</text></g>
</svg>
