<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Accent tonique : PHOtograph, phoTOgraphy, PREsent nom, preSENT verbe ; rythme de la phrase I want to go to the park">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="20" y="16" text-anchor="start" dominant-baseline="central">1. Dans un mot : une syllabe forte (en corail), les autres réduites</text>
<g class="c-coral"><rect x="20" y="34" width="49" height="40" rx="8" stroke-width="0.5"/><text class="th" x="44" y="54" text-anchor="middle" dominant-baseline="central">PHO</text></g>
<g class="c-gray"><rect x="73" y="44" width="38" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="92" y="57" text-anchor="middle" dominant-baseline="central">to</text></g>
<g class="c-gray"><rect x="115" y="44" width="71" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="150" y="57" text-anchor="middle" dominant-baseline="central">graph</text></g>
<text class="t" x="250" y="54" text-anchor="start" dominant-baseline="central">photograph /ˈfəʊtəɡrɑːf/</text>
<text class="ts" x="480" y="54" text-anchor="start" dominant-baseline="central">(une photo)</text>
<g class="c-gray"><rect x="20" y="94" width="49" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="44" y="107" text-anchor="middle" dominant-baseline="central">pho</text></g>
<g class="c-coral"><rect x="73" y="84" width="38" height="40" rx="8" stroke-width="0.5"/><text class="th" x="92" y="104" text-anchor="middle" dominant-baseline="central">TO</text></g>
<g class="c-gray"><rect x="115" y="94" width="49" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="140" y="107" text-anchor="middle" dominant-baseline="central">gra</text></g>
<g class="c-gray"><rect x="168" y="94" width="49" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="192" y="107" text-anchor="middle" dominant-baseline="central">phy</text></g>
<text class="t" x="250" y="104" text-anchor="start" dominant-baseline="central">photography /fəˈtɒɡrəfi/</text>
<text class="ts" x="480" y="104" text-anchor="start" dominant-baseline="central">(la photographie)</text>
<g class="c-coral"><rect x="20" y="134" width="49" height="40" rx="8" stroke-width="0.5"/><text class="th" x="44" y="154" text-anchor="middle" dominant-baseline="central">PRE</text></g>
<g class="c-gray"><rect x="73" y="144" width="60" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="103" y="157" text-anchor="middle" dominant-baseline="central">sent</text></g>
<text class="t" x="250" y="154" text-anchor="start" dominant-baseline="central">present /ˈpreznt/</text>
<text class="ts" x="480" y="154" text-anchor="start" dominant-baseline="central">nom : un cadeau</text>
<g class="c-gray"><rect x="20" y="194" width="49" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="44" y="207" text-anchor="middle" dominant-baseline="central">pre</text></g>
<g class="c-coral"><rect x="73" y="184" width="60" height="40" rx="8" stroke-width="0.5"/><text class="th" x="103" y="204" text-anchor="middle" dominant-baseline="central">SENT</text></g>
<text class="t" x="250" y="204" text-anchor="start" dominant-baseline="central">present /prɪˈzent/</text>
<text class="ts" x="480" y="204" text-anchor="start" dominant-baseline="central">verbe : présenter</text>
<line x1="20" y1="238" x2="660" y2="238" stroke="#D3D1C7" stroke-width="1"/>
<text class="th" x="20" y="260" text-anchor="start" dominant-baseline="central">2. Dans une phrase : les mots de sens sont forts, les mots-outils glissent</text>
<g class="c-gray"><rect x="20" y="288" width="34" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="37" y="301" text-anchor="middle" dominant-baseline="central">I</text></g>
<g class="c-coral"><rect x="60" y="278" width="60" height="40" rx="8" stroke-width="0.5"/><text class="th" x="90" y="298" text-anchor="middle" dominant-baseline="central">WANT</text></g>
<g class="c-gray"><rect x="126" y="288" width="38" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="145" y="301" text-anchor="middle" dominant-baseline="central">to</text></g>
<g class="c-coral"><rect x="170" y="278" width="38" height="40" rx="8" stroke-width="0.5"/><text class="th" x="189" y="298" text-anchor="middle" dominant-baseline="central">GO</text></g>
<g class="c-gray"><rect x="214" y="288" width="38" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="233" y="301" text-anchor="middle" dominant-baseline="central">to</text></g>
<g class="c-gray"><rect x="258" y="288" width="49" height="26" rx="6" stroke-width="0.5"/><text class="ts" x="282" y="301" text-anchor="middle" dominant-baseline="central">the</text></g>
<g class="c-coral"><rect x="313" y="278" width="60" height="40" rx="8" stroke-width="0.5"/><text class="th" x="343" y="298" text-anchor="middle" dominant-baseline="central">PARK</text></g>
<text class="ts" x="389" y="298" text-anchor="start" dominant-baseline="central">(je veux aller au parc)</text>
<text class="ts" x="20" y="334" text-anchor="start" dominant-baseline="central">Mots-outils réduits : to /tə/, the /ðə/, and /ən/, of /əv/, a /ə/ — le son /ə/ est très bref.</text>
<text class="ts" x="20" y="356" text-anchor="start" dominant-baseline="central">Corail : syllabe ou mot accentué, plus fort et plus long. Gris : syllabe ou mot réduit.</text>
</svg>
