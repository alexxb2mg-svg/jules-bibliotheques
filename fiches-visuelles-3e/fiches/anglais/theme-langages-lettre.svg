<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Structure d'un e-mail formel et d'un e-mail informel en anglais, étape par étape">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-blue"><text class="th" x="270" y="22" text-anchor="middle" dominant-baseline="central">Formel (à un inconnu)</text></g>
<g class="c-green"><text class="th" x="540" y="22" text-anchor="middle" dominant-baseline="central">Informel (à un ami)</text></g>
<text class="th" x="20" y="67" text-anchor="start" dominant-baseline="central">Salutation</text>
<g class="c-blue"><rect x="140" y="42" width="260" height="50" rx="6" stroke-width="0.5"/><text class="t" x="270.0" y="59" text-anchor="middle" dominant-baseline="central">Dear Sir or Madam,</text><text class="ts" x="270.0" y="77" text-anchor="middle" dominant-baseline="central">(Madame, Monsieur,)</text></g>
<g class="c-green"><rect x="420" y="42" width="240" height="50" rx="6" stroke-width="0.5"/><text class="t" x="540.0" y="59" text-anchor="middle" dominant-baseline="central">Hi Tom,</text><text class="ts" x="540.0" y="77" text-anchor="middle" dominant-baseline="central">(Salut Tom,)</text></g>
<line x1="270" y1="94" x2="270" y2="108" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="94" x2="540" y2="108" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="20" y="137" text-anchor="start" dominant-baseline="central">Début</text>
<g class="c-blue"><rect x="140" y="112" width="260" height="50" rx="6" stroke-width="0.5"/><text class="t" x="270.0" y="129" text-anchor="middle" dominant-baseline="central">I am writing to ask about…</text><text class="ts" x="270.0" y="147" text-anchor="middle" dominant-baseline="central">(Je vous écris au sujet de…)</text></g>
<g class="c-green"><rect x="420" y="112" width="240" height="50" rx="6" stroke-width="0.5"/><text class="t" x="540.0" y="129" text-anchor="middle" dominant-baseline="central">How are you?</text><text class="ts" x="540.0" y="147" text-anchor="middle" dominant-baseline="central">(Comment vas-tu ?)</text></g>
<line x1="270" y1="164" x2="270" y2="178" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="164" x2="540" y2="178" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="20" y="207" text-anchor="start" dominant-baseline="central">Avant de finir</text>
<g class="c-blue"><rect x="140" y="182" width="260" height="50" rx="6" stroke-width="0.5"/><text class="t" x="270.0" y="199" text-anchor="middle" dominant-baseline="central">I look forward to hearing from you.</text><text class="ts" x="270.0" y="217" text-anchor="middle" dominant-baseline="central">(Dans l'attente de votre réponse.)</text></g>
<g class="c-green"><rect x="420" y="182" width="240" height="50" rx="6" stroke-width="0.5"/><text class="t" x="540.0" y="199" text-anchor="middle" dominant-baseline="central">Write back soon!</text><text class="ts" x="540.0" y="217" text-anchor="middle" dominant-baseline="central">(Réponds-moi vite !)</text></g>
<line x1="270" y1="234" x2="270" y2="248" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="234" x2="540" y2="248" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="20" y="277" text-anchor="start" dominant-baseline="central">Formule finale</text>
<g class="c-blue"><rect x="140" y="252" width="260" height="50" rx="6" stroke-width="0.5"/><text class="t" x="270.0" y="269" text-anchor="middle" dominant-baseline="central">Yours faithfully,</text><text class="ts" x="270.0" y="287" text-anchor="middle" dominant-baseline="central">(Veuillez agréer…)</text></g>
<g class="c-green"><rect x="420" y="252" width="240" height="50" rx="6" stroke-width="0.5"/><text class="t" x="540.0" y="269" text-anchor="middle" dominant-baseline="central">Best wishes,</text><text class="ts" x="540.0" y="287" text-anchor="middle" dominant-baseline="central">(Amitiés,)</text></g>
<line x1="270" y1="304" x2="270" y2="318" class="arr" marker-end="url(#arrow)"/>
<line x1="540" y1="304" x2="540" y2="318" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="20" y="347" text-anchor="start" dominant-baseline="central">Signature</text>
<g class="c-blue"><rect x="140" y="322" width="260" height="50" rx="6" stroke-width="0.5"/><text class="t" x="270.0" y="339" text-anchor="middle" dominant-baseline="central">Léa Martin</text><text class="ts" x="270.0" y="357" text-anchor="middle" dominant-baseline="central">(prénom et nom)</text></g>
<g class="c-green"><rect x="420" y="322" width="240" height="50" rx="6" stroke-width="0.5"/><text class="t" x="540.0" y="339" text-anchor="middle" dominant-baseline="central">Léa</text><text class="ts" x="540.0" y="357" text-anchor="middle" dominant-baseline="central">(prénom seul)</text></g>
</svg>
