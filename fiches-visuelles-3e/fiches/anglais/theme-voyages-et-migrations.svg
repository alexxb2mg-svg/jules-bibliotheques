<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Une personne part de France pour s'installer au Canada : emigration vue de France, immigration vue du Canada">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="140" y="16" width="400" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="31" text-anchor="middle" dominant-baseline="central">migration : le déplacement en général</text><text class="ts" x="340" y="48" text-anchor="middle" dominant-baseline="central">(partir d'un lieu pour s'installer dans un autre)</text></g>
<g class="c-coral"><rect x="40" y="96" width="190" height="70" rx="10" stroke-width="0.5"/><text class="th" x="135" y="120" text-anchor="middle" dominant-baseline="central">France</text><text class="ts" x="135" y="142" text-anchor="middle" dominant-baseline="central">pays de départ</text></g>
<g class="c-blue"><rect x="450" y="96" width="190" height="70" rx="10" stroke-width="0.5"/><text class="th" x="545" y="120" text-anchor="middle" dominant-baseline="central">Canada</text><text class="ts" x="545" y="142" text-anchor="middle" dominant-baseline="central">pays d'arrivée</text></g>
<line x1="236" y1="131" x2="444" y2="131" stroke="#5F5E5A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="116" text-anchor="middle" dominant-baseline="central">Léa part vivre au Canada</text>
<text class="ts" x="340" y="148" text-anchor="middle" dominant-baseline="central">un seul trajet</text>
<g class="c-coral"><rect x="40" y="200" width="280" height="130" rx="10" stroke-width="0.5"/><text class="th" x="180" y="224" text-anchor="middle" dominant-baseline="central">Vu de France : emigration</text><text class="t" x="180" y="258" text-anchor="middle" dominant-baseline="central">She emigrates from France.</text><text class="ts" x="180" y="278" text-anchor="middle" dominant-baseline="central">(Elle émigre de France.)</text><text class="ts" x="180" y="308" text-anchor="middle" dominant-baseline="central">an emigrant : un émigré</text></g>
<g class="c-blue"><rect x="360" y="200" width="280" height="130" rx="10" stroke-width="0.5"/><text class="th" x="500" y="224" text-anchor="middle" dominant-baseline="central">Vu du Canada : immigration</text><text class="t" x="500" y="258" text-anchor="middle" dominant-baseline="central">She immigrates to Canada.</text><text class="ts" x="500" y="278" text-anchor="middle" dominant-baseline="central">(Elle immigre au Canada.)</text><text class="ts" x="500" y="308" text-anchor="middle" dominant-baseline="central">an immigrant : un immigré</text></g>
<line x1="135" y1="170" x2="135" y2="196" class="leader"/><line x1="545" y1="170" x2="545" y2="196" class="leader"/>
<text class="ts" x="340" y="354" text-anchor="middle" dominant-baseline="central">Quelqu'un qui fuit son pays pour sa sécurité : a refugee (un réfugié) ; to go into exile (partir en exil).</text>
</svg>
