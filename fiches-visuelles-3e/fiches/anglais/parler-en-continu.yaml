    jules: "Parler en continu, c'est parler **sans être interrompu** : un exposé, la présentation d'un projet, le résumé d'une histoire. Personne ne t'aide, d'où l'importance du plan."

  - id: schema
    type: schema
    titre: "Le plan d'un exposé et ses connecteurs"
    svg: "parler-en-continu.svg"
    jules: "Les **connecteurs** servent de panneaux indicateurs : ils disent à ceux qui t'écoutent où tu en es dans ton exposé."

  - id: schema-accent
    type: schema
    titre: "L'accent tonique : une syllabe plus forte que les autres"
    svg: "parler-en-continu-accent.svg"
    jules: "En français, on accentue plutôt la fin du mot ; en anglais, chaque mot a sa syllabe forte, et elle peut **changer de place** d'un mot à l'autre de la même famille."

  - id: methode
    type: methode
    etapes:
      - "Préparer les idées à l'avance avec un **plan simple** (introduction, deux ou trois points, conclusion), en notant des mots-clés plutôt que des phrases entières."
      - "Annoncer le sujet, puis enchaîner les parties avec des connecteurs : first, then, after that, finally, in conclusion."
      - "Si un mot manque, **reformuler** au lieu de s'arrêter : décrire l'objet, utiliser un mot plus général ou un contraire (not expensive pour cheap)."
      - "Choisir un **registre** adapté : Good morning, everyone (Bonjour à tous) devant la classe, pas Hi guys (Salut les gars)."
      - "S'entraîner à voix haute : accent tonique, intonation, regard vers le public, gestes qui accompagnent le propos."
    jules: "Si tu t'aperçois d'une erreur, corrige-toi simplement avec « I mean... » (je veux dire...) et continue : **s'autocorriger** est une compétence attendue, pas une faute."

  - id: piege
    type: piege
    mauvaise_idee: "S'arrêter net quand un mot manque, ou lire un texte entièrement rédigé, mot à mot, sans lever les yeux."
    pourquoi_faux: "Le silence casse le discours et fait perdre l'attention du public ; un texte lu sans **intonation** est difficile à suivre, même s'il est juste."
    bonne_idee: "Parler à partir de mots-clés et contourner le mot manquant par une **reformulation** : l'essentiel est que le message passe."
    jules: "Le jury ou ton professeur valorise la capacité à se faire comprendre malgré un trou de vocabulaire : c'est une vraie **stratégie de communication**."

  - id: exemple
    type: exemple
    situation: "Présenter sa ville en une minute devant la classe, avec une introduction, trois points et une conclusion."
    calcul: "« Today I'm going to talk about my town. (Aujourd'hui, je vais parler de ma ville.) First, it is small but very lively. (D'abord, elle est petite mais très animée.) Then, there is a big park where I play football. (Ensuite, il y a un grand parc où je joue au foot.) Finally, I like it because my friends live there. (Enfin, je l'aime parce que mes amis y habitent.) »"
    conclusion: "« In conclusion, it is a great place for teenagers. » (Pour conclure, c'est un endroit génial pour les ados.) Le discours suit un **plan clair** et chaque partie commence par un connecteur."
    jules: "Remarque l'annonce du sujet dès la première phrase : le public sait tout de suite de quoi tu vas parler."

  - id: exemple-reformuler
    type: exemple
    situation: "Pendant son exposé sur sa ville, un élève veut parler de la mairie mais a oublié le mot « town hall »."
    calcul: "Il décrit le bâtiment : « There is a big building where the mayor works, in the centre of the town. » (Il y a un grand bâtiment où travaille le maire, au centre de la ville.)"
    conclusion: "Le public comprend qu'il s'agit de la mairie : l'élève a **contourné le mot manquant** sans interrompre son exposé."
    jules: "Deux formules passe-partout pour décrire : « It's a place where » (c'est un endroit où) et « It's a thing you use to » (c'est un objet qui sert à), suivies de la fin de ta phrase."

  - id: renfort
    type: renfort
