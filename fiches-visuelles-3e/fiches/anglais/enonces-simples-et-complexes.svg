<svg width="100%" viewBox="0 0 680 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trois façons de relier deux idées : coordination avec and, subordination avec because, relative avec who">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="20" y="18" text-anchor="start" dominant-baseline="central">1. Coordination <tspan class="ts">: deux propositions de même rang</tspan></text>
<g class="c-gray"><rect x="20" y="32" width="150" height="36" rx="8" stroke-width="0.5"/><text class="t" x="95" y="50" text-anchor="middle" dominant-baseline="central">I was tired</text></g>
<g class="c-blue"><rect x="178" y="32" width="70" height="36" rx="8" stroke-width="0.5"/><text class="t" x="213" y="50" text-anchor="middle" dominant-baseline="central">and</text></g>
<g class="c-gray"><rect x="256" y="32" width="160" height="36" rx="8" stroke-width="0.5"/><text class="t" x="336" y="50" text-anchor="middle" dominant-baseline="central">I went to bed.</text></g>
<text class="ts" x="20" y="84" text-anchor="start" dominant-baseline="central">(j'étais fatigué et je suis allé me coucher)</text>
<g class="c-blue"><text class="ts" x="20" y="104" text-anchor="start" dominant-baseline="central">and (et), but (mais), or (ou), so (donc, alors)</text></g>
<text class="th" x="20" y="132" text-anchor="start" dominant-baseline="central">2. Subordination <tspan class="ts">: une proposition dépend de l'autre</tspan></text>
<g class="c-gray"><rect x="20" y="146" width="170" height="36" rx="8" stroke-width="0.5"/><text class="t" x="105" y="164" text-anchor="middle" dominant-baseline="central">I stayed at home</text></g>
<g class="c-coral"><rect x="198" y="146" width="90" height="36" rx="8" stroke-width="0.5"/><text class="t" x="243" y="164" text-anchor="middle" dominant-baseline="central">because</text></g>
<g class="c-gray"><rect x="296" y="146" width="160" height="36" rx="8" stroke-width="0.5"/><text class="t" x="376" y="164" text-anchor="middle" dominant-baseline="central">it was raining.</text></g>
<text class="ts" x="20" y="198" text-anchor="start" dominant-baseline="central">(je suis resté à la maison parce qu'il pleuvait)</text>
<g class="c-coral"><text class="ts" x="20" y="218" text-anchor="start" dominant-baseline="central">because (parce que), although (bien que), when (quand), if (si)</text></g>
<text class="th" x="20" y="246" text-anchor="start" dominant-baseline="central">3. Relative <tspan class="ts">: elle complète un nom, comme un adjectif</tspan></text>
<g class="c-gray"><rect x="20" y="268" width="100" height="36" rx="8" stroke-width="0.5"/><text class="t" x="70" y="286" text-anchor="middle" dominant-baseline="central">The man</text></g>
<g class="c-coral"><rect x="128" y="268" width="60" height="36" rx="8" stroke-width="0.5"/><text class="t" x="158" y="286" text-anchor="middle" dominant-baseline="central">who</text></g>
<g class="c-gray"><rect x="196" y="268" width="150" height="36" rx="8" stroke-width="0.5"/><text class="t" x="271" y="286" text-anchor="middle" dominant-baseline="central">lives next door</text></g>
<g class="c-gray"><rect x="354" y="268" width="130" height="36" rx="8" stroke-width="0.5"/><text class="t" x="419" y="286" text-anchor="middle" dominant-baseline="central">is a doctor.</text></g>
<rect x="126" y="262" width="226" height="48" rx="10" fill="none" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="20" y="326" text-anchor="start" dominant-baseline="central">(l'homme qui habite à côté est médecin)</text>
<g class="c-coral"><text class="ts" x="20" y="346" text-anchor="start" dominant-baseline="central">who (personne), which (chose, animal), that (les deux)</text></g>
<text class="ts" x="20" y="376" text-anchor="start" dominant-baseline="central">Gris : propositions. Bleu : mot de coordination. Corail : mot qui introduit une subordonnée.</text>
</svg>
