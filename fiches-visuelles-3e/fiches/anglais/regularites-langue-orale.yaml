    noeuds:
      - {id: oral, titre: "Anglais oral", sous_titre: "des régularités à repérer", principal: true}
      - {id: accent, titre: "Accent tonique", sous_titre: "une syllabe plus forte par mot"}
      - {id: rythme, titre: "Rythme", sous_titre: "mots importants forts, mots-outils réduits"}
      - {id: terminaisons, titre: "Terminaisons", sous_titre: "-ed et -s : trois prononciations"}
