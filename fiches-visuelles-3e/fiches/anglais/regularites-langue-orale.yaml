    liens:
      - {de: oral, vers: accent}
      - {de: oral, vers: rythme}
      - {de: oral, vers: terminaisons}
      - {de: oral, vers: variations}
    jules: "En français, toutes les syllabes ont à peu près la même force et la dernière ressort un peu. En anglais, chaque mot a sa **syllabe forte**, et la phrase avance par temps forts : c'est ce rythme qui rend l'anglais compréhensible."

  - id: schema-accent
    type: schema
    titre: "Accent tonique des mots et rythme de la phrase"
    svg: "regularites-langue-orale.svg"
    jules: "Dans un dictionnaire, l'accent tonique est noté par une petite apostrophe en haut, placée juste **avant** la syllabe forte : /ˈfəʊtəɡrɑːf/ (PHOtograph)."

  - id: schema-ed
    type: schema
    titre: "La terminaison -ed se prononce de trois façons"
    svg: "regularites-langue-orale-ed.svg"
    jules: "On n'ajoute une syllabe /ɪd/ qu'après un son /t/ ou /d/ : « worked » se dit en une seule syllabe, pas « work-ed »."

  - id: methode
    type: methode
    etapes:
      - "Pour un mot nouveau, repérer la **syllabe accentuée** (dictionnaire, enregistrement) et l'apprendre avec le mot."
      - "Dans une phrase, appuyer sur les **mots porteurs de sens** (noms, verbes, adjectifs) et glisser vite sur les mots-outils (a, the, to, of, and)."
      - "Pour un verbe au prétérit en -ed, regarder le dernier son de la base : /t/ ou /d/ → /ɪd/ ; son sourd → /t/ ; son sonore → /d/."
      - "Écouter des documents d'origines variées (Royaume-Uni, États-Unis, Australie, Inde...) pour habituer l'oreille à plusieurs **accents**."
    jules: "La même règle vaut pour le -s du pluriel et de la 3e personne : /s/ après un son sourd (cats), /z/ après un son sonore (dogs), /ɪz/ après un son sifflant (buses, watches)."

  - id: piege
    type: piege
    mauvaise_idee: "Prononcer toutes les syllabes avec la même force, à la française : pho-to-gra-phy."
    pourquoi_faux: "L'anglais a un **accent tonique** mobile : sans syllabe forte, le mot devient difficile à reconnaître, et l'accent peut même changer le sens du mot."
    bonne_idee: "Marquer la syllabe forte et réduire les autres : PHOtograph /ˈfəʊtəɡrɑːf/, phoTOgraphy /fəˈtɒɡrəfi/, photoGRAphic /ˌfəʊtəˈɡræfɪk/."
    jules: "Les syllabes non accentuées se réduisent souvent au son /ə/, le **schwa**, la voyelle la plus fréquente de l'anglais : c'est le a de about et le deuxième o de photograph."

  - id: exemple-present
    type: exemple
    situation: "Le mot present change de sens selon la place de l'accent. Utiliser chaque forme dans une phrase."
    calcul: "Nom (un cadeau) : accent sur la 1re syllabe, PREsent /ˈpreznt/. Verbe (présenter) : accent sur la 2e syllabe, preSENT /prɪˈzent/."
    conclusion: "« I bought a PREsent for my mum. » (j'ai acheté un cadeau pour ma mère) ; « I will preSENT my project tomorrow. » (je présenterai mon projet demain)"
    jules: "Même régularité pour record, export, increase : le **nom** est accentué au début (a REcord, un disque ou un record), le **verbe** à la fin (to reCORD, enregistrer)."

  - id: exemple-variations
    type: exemple
    situation: "Un Londonien et une New-Yorkaise disent « I parked my car. » (j'ai garé ma voiture). Ils ne le prononcent pas pareil : est-ce qu'ils se comprennent ?"
    calcul: "Au Royaume-Uni, le r après une voyelle ne se prononce en général pas : car /kɑː/. Aux États-Unis, on l'entend : car /kɑːr/. Même chose pour tomato : /təˈmɑːtəʊ/ (UK) et /təˈmeɪtoʊ/ (US)."
    conclusion: "Oui : les sons changent un peu, mais le **sens** est le même et l'accent tonique reste à la même place. Ce sont des **variations** régionales, toutes correctes."
    jules: "Il n'existe pas un seul bon accent anglais : l'anglais est langue officielle dans des dizaines de pays, et même au Royaume-Uni les accents varient beaucoup d'une région à l'autre."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi en tapant dans tes mains sur les temps forts d'une phrase : I WANT to GO to the PARK (je veux aller au parc), trois temps forts, les petits mots glissent entre eux."
