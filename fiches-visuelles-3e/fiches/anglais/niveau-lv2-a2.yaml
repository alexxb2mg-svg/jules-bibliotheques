    jules: "La LV2 peut être l'anglais, mais en France c'est souvent l'espagnol ou l'allemand, l'anglais étant le plus souvent la LV1. La règle est la même quelle que soit la langue."

  - id: schema-objectifs
    type: schema
    titre: "LV1 et LV2 : deux objectifs différents en fin de 3e"
    svg: "niveau-lv2-a2.svg"
    jules: "En LV2, deux activités au niveau **A2** suffisent pour atteindre l'objectif : les autres peuvent encore être en **A1**, et c'est normal en fin de 3e."

  - id: schema-duree
    type: schema
    titre: "Pourquoi cette différence : des années d'apprentissage en moins"
    svg: "niveau-lv2-a2-duree.svg"
    jules: "Commencée en 5e, la LV2 compte 3 années de collège (5e, 4e, 3e) ; la LV1 est étudiée **dès l'école primaire**. L'objectif est adapté à ce **temps d'exposition** à la langue."

  - id: methode
    type: methode
    etapes:
      - "Repérer les activités langagières où tu es déjà le plus à l'aise en LV2 (souvent **écouter** et **lire**, les plus travaillées en classe)."
      - "Les consolider pour y atteindre sûrement le niveau A2 : comprendre des phrases et des textes courts sur des sujets familiers."
      - "Réutiliser les **stratégies de LV1** : repérer les mots transparents, les noms propres et les chiffres, reformuler avec des mots simples."
      - "Ne pas comparer ton niveau de LV2 à celui de LV1 : suivre plutôt ta propre progression d'un trimestre à l'autre."
    jules: "Les stratégies de compréhension (s'appuyer sur le contexte, deviner un mot grâce aux mots qui l'entourent) servent dans **toutes les langues** : ce que tu as appris en anglais t'aide en espagnol ou en allemand."

  - id: piege
    type: piege
    mauvaise_idee: "« En fin de 3e, on attend le même niveau en LV2 qu'en LV1. »"
    pourquoi_faux: "Le programme fixe un objectif plus modeste en LV2 parce qu'elle est étudiée depuis moins longtemps : **A2 dans au moins deux** activités langagières, contre A2 dans les **cinq** en LV1."
    bonne_idee: "LV1 : A2 minimum partout, B1 visé dans plusieurs activités. LV2 : **A2 dans au moins deux** activités."
    jules: "Autre piège : négliger la LV2 parce que l'objectif est plus modeste. Elle compte autant dans ton parcours, et chaque activité qui atteint A2 est une **vraie compétence** de communication."

  - id: exemple
    type: exemple
    situation: "Tom étudie l'anglais en LV1 depuis le CP et l'espagnol en LV2 depuis la 5e. En fin de 3e, en espagnol, il comprend des annonces et des textes courts, mais il parle encore avec des phrases très courtes."
    calcul: "Espagnol : écouter A2, lire A2, parler en continu A1, écrire A1, réagir et dialoguer A1. Il a donc **2 activités au niveau A2**."
    conclusion: "Tom **atteint l'objectif** de la LV2. Il est plus à l'aise en anglais parce qu'il l'étudie depuis bien plus longtemps : c'est normal et prévu par le programme."
    jules: "Pour la suite, Tom peut viser A2 à l'oral en espagnol en apprenant des phrases utiles, comme il l'a fait en anglais avec « Can you repeat, please? » (Pouvez-vous répéter, s'il vous plaît ?)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Moyen de t'en souvenir : en LV1, les **cinq** activités en A2 ; en LV2, **au moins deux** activités en A2."
