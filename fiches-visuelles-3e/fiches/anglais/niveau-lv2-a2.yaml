    noeuds:
      - {id: lv2, titre: "LV2", sous_titre: "2e langue vivante, commencée en 5e", principal: true}
      - {id: objectif, titre: "Objectif fin de 3e", sous_titre: "A2 dans au moins 2 activités"}
      - {id: duree, titre: "Temps d'apprentissage", sous_titre: "plus court qu'en LV1"}
      - {id: strategies, titre: "Stratégies de LV1", sous_titre: "réutilisables dans toute langue"}
    liens:
      - {de: lv2, vers: objectif}
      - {de: duree, vers: objectif, libelle: "explique"}
