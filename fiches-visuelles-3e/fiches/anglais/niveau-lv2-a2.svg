<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="En LV1, les cinq activités langagières au moins en A2 ; en LV2, au moins deux activités en A2">
<rect x="24" y="14" width="304" height="316" rx="10" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/>
<text class="th" x="176" y="38" text-anchor="middle" dominant-baseline="central">LV1 (souvent l'anglais)</text>
<text class="ts" x="176" y="58" text-anchor="middle" dominant-baseline="central">depuis l'école primaire</text>
<text class="t" x="40" y="94" text-anchor="start" dominant-baseline="central">Écouter</text>
<g class="c-green"><rect x="248" y="79" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="280" y="94" text-anchor="middle" dominant-baseline="central">B1</text></g>
<text class="t" x="40" y="138" text-anchor="start" dominant-baseline="central">Lire</text>
<g class="c-green"><rect x="248" y="123" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="280" y="138" text-anchor="middle" dominant-baseline="central">B1</text></g>
<text class="t" x="40" y="182" text-anchor="start" dominant-baseline="central">Parler en continu</text>
<g class="c-amber"><rect x="248" y="167" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="280" y="182" text-anchor="middle" dominant-baseline="central">A2</text></g>
<text class="t" x="40" y="226" text-anchor="start" dominant-baseline="central">Écrire</text>
<g class="c-amber"><rect x="248" y="211" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="280" y="226" text-anchor="middle" dominant-baseline="central">A2</text></g>
<text class="t" x="40" y="270" text-anchor="start" dominant-baseline="central">Réagir et dialoguer</text>
<g class="c-amber"><rect x="248" y="255" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="280" y="270" text-anchor="middle" dominant-baseline="central">A2</text></g>
<text class="th" x="176" y="310" text-anchor="middle" dominant-baseline="central">5 activités sur 5 en A2 ou plus</text>
<rect x="352" y="14" width="304" height="316" rx="10" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/>
<text class="th" x="504" y="38" text-anchor="middle" dominant-baseline="central">LV2 (commencée en 5e)</text>
<text class="ts" x="504" y="58" text-anchor="middle" dominant-baseline="central">3 années de collège</text>
<text class="t" x="368" y="94" text-anchor="start" dominant-baseline="central">Écouter</text>
<g class="c-amber"><rect x="576" y="79" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="608" y="94" text-anchor="middle" dominant-baseline="central">A2</text></g>
<text class="t" x="368" y="138" text-anchor="start" dominant-baseline="central">Lire</text>
<g class="c-amber"><rect x="576" y="123" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="608" y="138" text-anchor="middle" dominant-baseline="central">A2</text></g>
<text class="t" x="368" y="182" text-anchor="start" dominant-baseline="central">Parler en continu</text>
<g class="c-gray"><rect x="576" y="167" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="608" y="182" text-anchor="middle" dominant-baseline="central">A1</text></g>
<text class="t" x="368" y="226" text-anchor="start" dominant-baseline="central">Écrire</text>
<g class="c-gray"><rect x="576" y="211" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="608" y="226" text-anchor="middle" dominant-baseline="central">A1</text></g>
<text class="t" x="368" y="270" text-anchor="start" dominant-baseline="central">Réagir et dialoguer</text>
<g class="c-gray"><rect x="576" y="255" width="64" height="30" rx="6" stroke-width="0.5"/><text class="th" x="608" y="270" text-anchor="middle" dominant-baseline="central">A1</text></g>
<text class="th" x="504" y="310" text-anchor="middle" dominant-baseline="central">au moins 2 activités en A2</text>
<g class="c-green"><rect x="24" y="350" width="22" height="18" rx="4" stroke-width="0.5"/></g><text class="ts" x="54" y="359" text-anchor="start" dominant-baseline="central">B1</text>
<g class="c-amber"><rect x="144" y="350" width="22" height="18" rx="4" stroke-width="0.5"/></g><text class="ts" x="174" y="359" text-anchor="start" dominant-baseline="central">A2 atteint</text>
<g class="c-gray"><rect x="284" y="350" width="22" height="18" rx="4" stroke-width="0.5"/></g><text class="ts" x="314" y="359" text-anchor="start" dominant-baseline="central">pas encore A2 (A1)</text>
<text class="ts" x="24" y="388" text-anchor="start" dominant-baseline="central">Exemples de profils possibles : l'objectif LV2 est atteint dès que 2 activités sont en A2.</text>
</svg>
