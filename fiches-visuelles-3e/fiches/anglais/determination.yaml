blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: determinants, titre: "Déterminer un nom", sous_titre: "dire de quoi, de combien on parle", principal: true}
      - {id: articles, titre: "Articles", sous_titre: "a, an (un, une) ; the (le, la, les)"}
      - {id: denombrable, titre: "Dénombrable ou non ?", sous_titre: "book, books ou water"}
      - {id: some-any, titre: "some, any", sous_titre: "du, de la, des, quelques"}
      - {id: much-many, titre: "much, many, a lot of", sous_titre: "beaucoup de"}
    liens:
      - {de: determinants, vers: articles}
      - {de: determinants, vers: denombrable, libelle: "d'abord"}
      - {de: denombrable, vers: some-any}
      - {de: denombrable, vers: much-many}
    jules: "La première question à se poser est toujours la même : le nom se **compte**-t-il ? Un nom **dénombrable** a un pluriel (a book, two books) ; un nom **indénombrable** n'en a pas (water, information, advice)."

  - id: schema-quantifieurs
    type: schema
    titre: "Choisir le déterminant selon le nom et la phrase"
    svg: "determination.svg"
    jules: "« A lot of » marche avec les deux sortes de noms : a lot of books (beaucoup de livres), a lot of water (beaucoup d'eau). Dans une phrase affirmative, c'est souvent le plus naturel."

  - id: schema-a-an
    type: schema
    titre: "a ou an : c'est le son qui décide, pas la lettre"
    svg: "determination-a-an.svg"
    jules: "« The » change aussi de son : /ðə/ devant un son consonne (the book), souvent /ði/ devant un son voyelle (the apple). À l'écrit, il ne change jamais."

  - id: methode
    type: methode
    etapes:
      - "Regarder le nom : **dénombrable** (il a un pluriel : book, books) ou **indénombrable** (water, money, information, advice) ?"
      - "Pour « un, une » devant un dénombrable singulier, écouter le premier **son** du mot : a devant un son consonne, an devant un son voyelle."
      - "Pour « du, de la, des, quelques » : **some** dans une affirmation, une offre ou une demande polie ; **any** dans une négation ou une question ordinaire."
      - "Pour « beaucoup de » : **many** + dénombrable pluriel, **much** + indénombrable (surtout négation et question), a lot of partout."
    jules: "Attention aux faux amis indénombrables : information, advice (des conseils), furniture (des meubles), news. On dit « some advice », jamais « an advice » ni « advices »."

  - id: piege
    type: piege
    mauvaise_idee: "« Beaucoup de » se dit toujours many : « There isn't many water »."
    pourquoi_faux: "Water ne se compte pas (pas de « two waters ») : c'est un nom **indénombrable**. Many ne va qu'avec un **dénombrable pluriel**."
    bonne_idee: "« There isn't much water. » (il n'y a pas beaucoup d'eau) ; « There aren't many bottles. » (il n'y a pas beaucoup de bouteilles)."
    jules: "Moyen mnémotechnique : **many** comme « nombre » (on compte), **much** comme « masse » (on ne compte pas). Dans le doute, a lot of marche avec les deux."

  - id: exemple-much-many
    type: exemple
    situation: "Compléter : « How ___ sugar do you want? » et « How ___ eggs do we need? »"
    calcul: "Sugar (le sucre) ne se compte pas : indénombrable → much. Eggs (des œufs) est un pluriel dénombrable → many."
    conclusion: "« How **much** sugar do you want? » (combien de sucre veux-tu ?) et « How **many** eggs do we need? » (combien d'œufs nous faut-il ?)."
    jules: "Tout seul, how much sert aussi à demander un prix : « How much is it? » (combien ça coûte)."

  - id: exemple-some-any
    type: exemple
    situation: "Traduire : « Veux-tu du thé ? Il n'y a pas de lait, mais j'ai des biscuits. »"
    calcul: "Offre polie → some. Négation → any. Affirmation → some."
    conclusion: "« Would you like **some** tea? There isn't **any** milk, but I have **some** biscuits. » (biscuits en anglais britannique, cookies en anglais américain)"
    jules: "Some dans une question n'est pas une erreur : quand on propose quelque chose ou qu'on attend un « oui », la question garde some (Can I have some water, please? Je peux avoir de l'eau, s'il te plaît)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Autre piège pour un Français : une vérité générale se dit **sans the**. « I love music » (j'aime la musique), « Cats are cute » (les chats sont mignons)."
