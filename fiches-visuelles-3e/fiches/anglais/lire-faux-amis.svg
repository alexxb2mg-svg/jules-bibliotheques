<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<g class="node c-teal"><rect x="20" y="10" width="250" height="330" rx="10" stroke-width="0.5"/>
<text class="th" x="145" y="34" text-anchor="middle" dominant-baseline="central">Mots transparents</text>
<text class="ts" x="145" y="54" text-anchor="middle" dominant-baseline="central">même sens qu'en français</text>
<text class="t" x="40" y="95" dominant-baseline="central">important (important)</text>
<text class="t" x="40" y="140" dominant-baseline="central">television (télévision)</text>
<text class="t" x="40" y="185" dominant-baseline="central">information (information)</text>
<text class="t" x="40" y="230" dominant-baseline="central">to protect (protéger)</text>
<text class="t" x="40" y="275" dominant-baseline="central">a problem (un problème)</text>
<text class="ts" x="145" y="315" text-anchor="middle" dominant-baseline="central">ils aident à comprendre vite</text></g>

<g class="node c-coral"><rect x="290" y="10" width="370" height="330" rx="10" stroke-width="0.5"/>
<text class="th" x="475" y="34" text-anchor="middle" dominant-baseline="central">Faux amis</text>
<text class="ts" x="475" y="54" text-anchor="middle" dominant-baseline="central">la forme ressemble, le sens change</text>
<text class="t" x="310" y="88" dominant-baseline="central">library = bibliothèque</text>
<text class="ts" x="310" y="107" dominant-baseline="central">une librairie se dit a bookshop</text>
<text class="t" x="310" y="148" dominant-baseline="central">actually = en fait, en réalité</text>
<text class="ts" x="310" y="167" dominant-baseline="central">actuellement se dit currently, now</text>
<text class="t" x="310" y="208" dominant-baseline="central">sensible = raisonnable, sensé</text>
<text class="ts" x="310" y="227" dominant-baseline="central">sensible (émotif) se dit sensitive</text>
<text class="t" x="310" y="268" dominant-baseline="central">to attend = assister à</text>
<text class="ts" x="310" y="287" dominant-baseline="central">attendre se dit to wait</text>
<text class="ts" x="475" y="318" text-anchor="middle" dominant-baseline="central">si la phrase devient bizarre : vérifier !</text></g>
</svg>
