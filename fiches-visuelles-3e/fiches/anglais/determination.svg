<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arbre de choix des déterminants anglais : nom dénombrable ou indénombrable, puis a, an, some, any, many, much, a lot of">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="190" y="10" width="300" height="40" rx="8" stroke-width="0.5"/><text class="th" x="340" y="30" text-anchor="middle" dominant-baseline="central">Le nom se compte-t-il ?</text></g>
<line x1="260" y1="52" x2="150" y2="76" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="52" x2="530" y2="76" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="20" y="80" width="300" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="95" text-anchor="middle" dominant-baseline="central">Dénombrable</text><text class="ts" x="170" y="113" text-anchor="middle" dominant-baseline="central">book, egg, friend : un pluriel existe</text></g>
<g class="c-blue"><rect x="20" y="140" width="300" height="44" rx="8" stroke-width="0.5"/><text class="t" x="170" y="153" text-anchor="middle" dominant-baseline="central">singulier : a, an</text><text class="ts" x="170" y="171" text-anchor="middle" dominant-baseline="central">a book (un livre), an egg (un œuf)</text></g>
<g class="c-blue"><rect x="20" y="194" width="300" height="44" rx="8" stroke-width="0.5"/><text class="t" x="170" y="207" text-anchor="middle" dominant-baseline="central">pluriel : some, any</text><text class="ts" x="170" y="225" text-anchor="middle" dominant-baseline="central">some books (des livres)</text></g>
<g class="c-blue"><rect x="20" y="248" width="300" height="44" rx="8" stroke-width="0.5"/><text class="t" x="170" y="261" text-anchor="middle" dominant-baseline="central">beaucoup de : many</text><text class="ts" x="170" y="279" text-anchor="middle" dominant-baseline="central">many friends (beaucoup d'amis)</text></g>
<g class="c-coral"><rect x="360" y="80" width="300" height="48" rx="8" stroke-width="0.5"/><text class="th" x="510" y="95" text-anchor="middle" dominant-baseline="central">Indénombrable</text><text class="ts" x="510" y="113" text-anchor="middle" dominant-baseline="central">water, money, advice : pas de pluriel</text></g>
<g class="c-coral"><rect x="360" y="140" width="300" height="44" rx="8" stroke-width="0.5"/><text class="t" x="510" y="153" text-anchor="middle" dominant-baseline="central">jamais a, an</text><text class="ts" x="510" y="171" text-anchor="middle" dominant-baseline="central">water (de l'eau), pas « a water »</text></g>
<g class="c-coral"><rect x="360" y="194" width="300" height="44" rx="8" stroke-width="0.5"/><text class="t" x="510" y="207" text-anchor="middle" dominant-baseline="central">some, any</text><text class="ts" x="510" y="225" text-anchor="middle" dominant-baseline="central">some water (de l'eau)</text></g>
<g class="c-coral"><rect x="360" y="248" width="300" height="44" rx="8" stroke-width="0.5"/><text class="t" x="510" y="261" text-anchor="middle" dominant-baseline="central">beaucoup de : much</text><text class="ts" x="510" y="279" text-anchor="middle" dominant-baseline="central">not much time (pas beaucoup de temps)</text></g>
<g class="c-gray"><rect x="20" y="304" width="640" height="40" rx="8" stroke-width="0.5"/><text class="t" x="340" y="324" text-anchor="middle" dominant-baseline="central">a lot of : avec les deux (a lot of friends, a lot of time)</text></g>
<text class="th" x="20" y="368" text-anchor="start" dominant-baseline="central">some ou any ? Cela dépend de la phrase :</text>
<g class="c-gray"><rect x="20" y="384" width="310" height="56" rx="8" stroke-width="0.5"/><text class="t" x="175" y="403" text-anchor="middle" dominant-baseline="central">some : affirmation, offre polie</text><text class="ts" x="175" y="421" text-anchor="middle" dominant-baseline="central">I have some apples. (j'ai des pommes)</text></g>
<g class="c-gray"><rect x="350" y="384" width="310" height="56" rx="8" stroke-width="0.5"/><text class="t" x="505" y="403" text-anchor="middle" dominant-baseline="central">any : négation, question</text><text class="ts" x="505" y="421" text-anchor="middle" dominant-baseline="central">I don't have any money. (je n'ai pas d'argent)</text></g>
<text class="ts" x="20" y="458" text-anchor="start" dominant-baseline="central">Bleu : noms dénombrables. Corail : noms indénombrables.</text>
</svg>
