<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5"/></marker></defs>
<g class="node c-coral"><rect x="40" y="10" width="100" height="30" rx="6" stroke-width="0.5"/><text class="th" x="90" y="25" text-anchor="middle" dominant-baseline="central">préfixe</text></g>
<g class="node c-blue"><rect x="150" y="10" width="120" height="30" rx="6" stroke-width="0.5"/><text class="th" x="210" y="25" text-anchor="middle" dominant-baseline="central">mot de base</text></g>
<g class="node c-teal"><rect x="280" y="10" width="100" height="30" rx="6" stroke-width="0.5"/><text class="th" x="330" y="25" text-anchor="middle" dominant-baseline="central">suffixe</text></g>
<text class="th" x="530" y="25" text-anchor="middle" dominant-baseline="central">mot obtenu (sens)</text>

<g class="node c-coral"><rect x="40" y="60" width="100" height="40" rx="6" stroke-width="0.5"/><text class="t" x="90" y="80" text-anchor="middle" dominant-baseline="central">un-</text></g>
<g class="node c-blue"><rect x="150" y="60" width="120" height="40" rx="6" stroke-width="0.5"/><text class="t" x="210" y="80" text-anchor="middle" dominant-baseline="central">happy</text></g>
<line x1="385" y1="80" x2="415" y2="80" class="arr" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#fl)"/>
<text class="t" x="425" y="72" dominant-baseline="central">unhappy</text>
<text class="ts" x="425" y="91" dominant-baseline="central">(malheureux, triste)</text>

<g class="node c-blue"><rect x="150" y="115" width="120" height="40" rx="6" stroke-width="0.5"/><text class="t" x="210" y="135" text-anchor="middle" dominant-baseline="central">care</text></g>
<g class="node c-teal"><rect x="280" y="115" width="100" height="40" rx="6" stroke-width="0.5"/><text class="t" x="330" y="135" text-anchor="middle" dominant-baseline="central">-less</text></g>
<line x1="385" y1="135" x2="415" y2="135" class="arr" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#fl)"/>
<text class="t" x="425" y="127" dominant-baseline="central">careless</text>
<text class="ts" x="425" y="146" dominant-baseline="central">(sans soin, négligent)</text>

<g class="node c-blue"><rect x="150" y="170" width="120" height="40" rx="6" stroke-width="0.5"/><text class="t" x="210" y="190" text-anchor="middle" dominant-baseline="central">help</text></g>
<g class="node c-teal"><rect x="280" y="170" width="100" height="40" rx="6" stroke-width="0.5"/><text class="t" x="330" y="190" text-anchor="middle" dominant-baseline="central">-ful</text></g>
<line x1="385" y1="190" x2="415" y2="190" class="arr" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#fl)"/>
<text class="t" x="425" y="182" dominant-baseline="central">helpful</text>
<text class="ts" x="425" y="201" dominant-baseline="central">(serviable, utile)</text>

<g class="node c-coral"><rect x="40" y="225" width="100" height="40" rx="6" stroke-width="0.5"/><text class="t" x="90" y="245" text-anchor="middle" dominant-baseline="central">re-</text></g>
<g class="node c-blue"><rect x="150" y="225" width="120" height="40" rx="6" stroke-width="0.5"/><text class="t" x="210" y="245" text-anchor="middle" dominant-baseline="central">read</text></g>
<line x1="385" y1="245" x2="415" y2="245" class="arr" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#fl)"/>
<text class="t" x="425" y="237" dominant-baseline="central">reread</text>
<text class="ts" x="425" y="256" dominant-baseline="central">(relire)</text>

<g class="node c-coral"><rect x="40" y="280" width="100" height="40" rx="6" stroke-width="0.5"/><text class="t" x="90" y="300" text-anchor="middle" dominant-baseline="central">un-</text></g>
<g class="node c-blue"><rect x="150" y="280" width="120" height="40" rx="6" stroke-width="0.5"/><text class="t" x="210" y="300" text-anchor="middle" dominant-baseline="central">believe</text></g>
<g class="node c-teal"><rect x="280" y="280" width="100" height="40" rx="6" stroke-width="0.5"/><text class="t" x="330" y="300" text-anchor="middle" dominant-baseline="central">-able</text></g>
<line x1="385" y1="300" x2="415" y2="300" class="arr" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#fl)"/>
<text class="t" x="425" y="292" dominant-baseline="central">unbelievable</text>
<text class="ts" x="425" y="311" dominant-baseline="central">(incroyable)</text>

<g class="c-gray"><rect x="40" y="340" width="600" height="50" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="357" text-anchor="middle" dominant-baseline="central">un- = le contraire ; re- = de nouveau ; -less = sans ; -ful = plein de ; -able = qu'on peut</text>
<text class="ts" x="340" y="376" text-anchor="middle" dominant-baseline="central">(believe + -able : le e final de la base tombe devant le suffixe)</text></g>
</svg>
