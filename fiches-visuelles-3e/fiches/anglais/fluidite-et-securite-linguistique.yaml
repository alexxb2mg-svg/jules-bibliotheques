    jules: "Le programme le dit clairement : on ne vise pas « l'**accent natif** ». Un élève qui se fait comprendre avec un accent français a atteint l'objectif."

  - id: schema-objectifs
    type: schema
    titre: "Ce qu'on vise à l'oral, et ce qu'on ne vise pas"
    svg: "fluidite-et-securite-linguistique.svg"
    jules: "Les trois objectifs se nourrissent : plus tu oses parler, plus tu t'entraînes, et plus tu deviens **fluide** et compréhensible."

  - id: schema-strategies
    type: schema
    titre: "Je bloque sur un mot : quatre stratégies pour continuer"
    svg: "fluidite-et-securite-linguistique-strategies.svg"
    jules: "Ces petites phrases s'utilisent aussi entre natifs : un Anglais qui cherche ses mots dit « Well… » (eh bien) ou « Let me think » (laisse-moi réfléchir), exactement comme toi."

  - id: methode
    type: methode
    etapes:
      - "Préparer quelques **mots utiles** avant de parler : le vocabulaire du sujet et deux ou trois connecteurs (first, then, because, but : d'abord, ensuite, parce que, mais)."
      - "Parler à voix haute régulièrement, même seul (se raconter sa journée, lire un texte, s'enregistrer), pour gagner en **aisance**."
      - "Soigner ce qui gêne vraiment la compréhension : l'**accent tonique** des mots et un débit pas trop rapide, plutôt que l'accent parfait."
      - "Face à un blocage, **contourner** le mot manquant (It's a kind of…, c'est une sorte de… ; It's like…, c'est comme…) au lieu de s'arrêter."
      - "Se reprendre sans paniquer (Sorry, I mean…, pardon, je veux dire…) : une correction montre qu'on contrôle ce qu'on dit."
    jules: "S'enregistrer puis se réécouter est très efficace : on entend ses hésitations et on voit ses progrès d'une semaine à l'autre."

  - id: piege
    type: piege
    mauvaise_idee: "Se taire tant qu'on n'est pas sûr de faire une phrase parfaite, avec un accent « comme les Anglais »."
    pourquoi_faux: "On progresse à l'oral en **parlant**. Rester silencieux empêche de s'entraîner, et l'accent natif n'est pas l'objectif : l'objectif est d'**être compris**."
    bonne_idee: "Parler, même avec des erreurs et des hésitations, et viser l'**intelligibilité** : un message clair vaut mieux qu'une phrase parfaite jamais prononcée."
    jules: "Même les natifs hésitent, se reprennent et font des pauses : c'est normal à l'oral, et ce n'est pas une faute."

  - id: exemple-contourner
    type: exemple
    situation: "Pendant un oral, Léa veut parler d'un tire-bouchon, mais elle ne connaît pas le mot anglais (corkscrew)."
    calcul: "Au lieu de s'arrêter, elle gagne du temps puis décrit l'objet : « Well… it's a thing you use to open a bottle of wine. » (eh bien, c'est un objet qu'on utilise pour ouvrir une bouteille de vin)"
    conclusion: "Son interlocuteur comprend et peut même lui donner le mot : **communication réussie**, sans le mot exact."
    jules: "Décrire un mot qu'on ne connaît pas s'appelle **paraphraser**. Trois formules suffisent : it's a thing you use to… (un objet qui sert à), it's a place where… (un lieu où), it's a person who… (une personne qui)."

  - id: exemple-evaluer
    type: exemple
    situation: "Tom décrit son week-end : « Last weekend, er… I go… sorry, I went to the cinema with my friends. It was great! » Ses camarades comprennent tout. A-t-il réussi ?"
    calcul: "Il a hésité (er…) et s'est trompé de temps (I go), mais il s'est **corrigé** seul (I went), et son message a été compris."
    conclusion: "Oui : il a été **intelligible** et il a osé parler ; sa reprise montre qu'il maîtrise le prétérit. C'est exactement ce que vise le programme. (Le week-end dernier, je suis allé au cinéma avec mes amis. C'était super !)"
    jules: "Une hésitation n'est pas une erreur : ce qui compte, c'est que le message passe et que tu continues à parler."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Garde sous la main tes phrases de secours : « Could you repeat, please? » (pouvez-vous répéter), « How do you say … in English? » (comment dit-on … en anglais), « What I mean is… » (ce que je veux dire, c'est…)."
