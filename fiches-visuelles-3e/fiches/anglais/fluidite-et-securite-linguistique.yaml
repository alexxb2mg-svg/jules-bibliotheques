blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: objectif, titre: "Bien parler anglais", sous_titre: "communiquer, pas imiter un natif", principal: true}
      - {id: fluidite, titre: "Fluidité", sous_titre: "parler sans trop de blocages"}
      - {id: intelligibilite, titre: "Intelligibilité", sous_titre: "être compris"}
