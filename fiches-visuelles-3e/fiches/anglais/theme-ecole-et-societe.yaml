    jules: "Mots clés du thème : school subject (matière), school uniform (uniforme scolaire), waste (déchets), renewable energy (énergie renouvelable), a job (un métier)."

  - id: schema-systemes
    type: schema
    titre: "Comparer les systèmes scolaires : France, Angleterre, États-Unis"
    svg: "theme-ecole-et-societe.svg"
    jules: "Un élève de 3e a le même âge qu'un élève de **Year 10** en Angleterre ou de **9th grade** aux États-Unis. En Angleterre, la plupart des élèves du secondaire portent un **uniforme**."

  - id: schema-dechets
    type: schema
    titre: "Parler des déchets : l'ordre « Reduce, Reuse, Recycle »"
    svg: "theme-ecole-et-societe-dechets.svg"
    jules: "L'ordre compte : le meilleur déchet est celui qu'on ne produit pas. **Recycler** reste utile, mais c'est la dernière solution des trois, car recycler consomme aussi de l'énergie."

  - id: graphe-classes
    type: graphe
    gabarit: echelles-paralleles
    curseurs:
      - {id: curseur-echelle, nom: echelle, min: 2, max: 2, pas: 1, depart: 2}
      - {id: curseur-age, nom: age, min: 11, max: 17, pas: 1, depart: 14}
    lectures:
      - {si: "age == 11", texte: "11 ans : **6e** en France, **Year 7** en Angleterre (début de la secondary school), **6th grade** aux États-Unis."}
      - {si: "age >= 12 && age <= 13", texte: "Les numéros ne correspondent pas : la 5e est **Year 8**, la 4e est **Year 9**. Pour comparer, on part de l'**âge**."}
      - {si: "age == 14", texte: "14 ans : **3e** = **Year 10** (on prépare les GCSE) = **9th grade**, la première année de high school (freshman)."}
      - {si: "age >= 16", texte: "16-17 ans : **sixth form** en Angleterre (on prépare les A levels), **junior** puis **senior** year à la high school américaine."}
    jules: "Les trois réglettes sont alignées sur l'âge, pas sur les numéros : en France on compte à rebours (6e, 5e, 4e, 3e), en Angleterre et aux États-Unis on compte vers le haut (Year 7, Year 8...)."

  - id: methode
    type: methode
    etapes:
      - "Choisir le **vocabulaire précis** du sujet : recycling (recyclage), waste (déchets), pollution (pollution), renewable energy (énergie renouvelable)."
      - "Comparer un usage français et son équivalent anglophone avec des connecteurs : « In France… whereas in England… » (En France… alors qu'en Angleterre…)."
      - "Illustrer par un **exemple concret** tiré d'un document authentique : site d'une école, article sur le recyclage, fiche métier."
      - "Donner son avis et proposer une action : « We should… » (Nous devrions…), « I think it's important to… » (Je pense qu'il est important de…)."
    jules: "Les **connecteurs de comparaison** rendent ta production plus claire : whereas (alors que), both (tous les deux), unlike (contrairement à), like (comme)."

  - id: piege
    type: piege
    mauvaise_idee: "Décrire le système scolaire anglais comme **identique** au système français, en traduisant « collège » par « college »."
    pourquoi_faux: "Les systèmes sont différents (noms des classes, âges, uniforme, examens) et « college » est un **faux ami** : aux États-Unis, c'est l'université ; au Royaume-Uni, souvent un établissement pour les plus de 16 ans."
    bonne_idee: "Dire « secondary school » pour le collège en Angleterre, « middle school » aux États-Unis, et comparer **classe par classe** avec l'âge des élèves."
    jules: "Même prudence avec « school » : c'est l'école en général. Pour être précis, on dit **primary school** (école primaire) ou **secondary school** (enseignement secondaire)."

  - id: exemple-ecole
    type: exemple
    situation: "Présenter en anglais ta classe à un correspondant anglais du même âge."
    calcul: "« In France, I'm in 3e, the last year of collège. » (En France, je suis en 3e, la dernière année du collège.) « You are in Year 10, at secondary school. » (Tu es en Year 10, dans le secondaire.) « Unlike you, I don't wear a uniform. » (Contrairement à toi, je ne porte pas d'uniforme.)"
    conclusion: "La comparaison est juste parce qu'elle s'appuie sur **l'âge des élèves** (14-15 ans) et sur une **différence réelle** (l'uniforme), introduite par unlike."
    jules: "Garde les mots français « 3e » et « collège », puis explique-les : un nom d'institution scolaire ne se traduit pas toujours mot à mot."

  - id: exemple-metier
    type: exemple
    situation: "Décrire en anglais une action écoresponsable au collège, puis un métier lié à l'environnement."
    calcul: "« At school, we recycle paper and plastic bottles to reduce waste. » (Au collège, nous recyclons le papier et les bouteilles en plastique pour réduire les déchets.) « A water treatment technician makes water safe to drink. » (Un technicien du traitement de l'eau rend l'eau potable.)"
    conclusion: "Deux phrases simples et précises, avec le **vocabulaire du thème** (recycle, waste, water treatment) : c'est exactement ce qu'on attend au niveau A2-B1."
    jules: "Autres **métiers verts** : a wind turbine technician (technicien de maintenance d'éoliennes), a recycling worker (employé du recyclage), a renewable energy engineer (ingénieur en énergies renouvelables)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À retenir : la 3e correspond à **Year 10** et à **9th grade**, college n'est pas le collège, et **Reduce, Reuse, Recycle** dans cet ordre."
