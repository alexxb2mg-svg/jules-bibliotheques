<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="20" y="20" dominant-baseline="central">Mot</text>
<text class="th" x="330" y="20" dominant-baseline="central">Syllabes (gros point = accent tonique)</text>

<text class="t" x="20" y="65" dominant-baseline="central">photograph</text>
<text class="ts" x="20" y="84" dominant-baseline="central">(une photo)</text>
<text class="ts" x="130" y="65" dominant-baseline="central">/ˈfəʊtəɡrɑːf/</text>
<circle cx="360" cy="52" r="9" fill="#D85A30"/><circle cx="430" cy="52" r="4" fill="#185FA5"/><circle cx="500" cy="52" r="4" fill="#185FA5"/>
<text class="th" x="360" y="76" text-anchor="middle" dominant-baseline="central" fill="#D85A30">PHO</text><text class="t" x="430" y="76" text-anchor="middle" dominant-baseline="central">to</text><text class="t" x="500" y="76" text-anchor="middle" dominant-baseline="central">graph</text>

<text class="t" x="20" y="135" dominant-baseline="central">photography</text>
<text class="ts" x="20" y="154" dominant-baseline="central">(la photographie)</text>
<text class="ts" x="130" y="135" dominant-baseline="central">/fəˈtɒɡrəfi/</text>
<circle cx="360" cy="122" r="4" fill="#185FA5"/><circle cx="430" cy="122" r="9" fill="#D85A30"/><circle cx="500" cy="122" r="4" fill="#185FA5"/><circle cx="570" cy="122" r="4" fill="#185FA5"/>
<text class="t" x="360" y="146" text-anchor="middle" dominant-baseline="central">pho</text><text class="th" x="430" y="146" text-anchor="middle" dominant-baseline="central" fill="#D85A30">TOG</text><text class="t" x="500" y="146" text-anchor="middle" dominant-baseline="central">ra</text><text class="t" x="570" y="146" text-anchor="middle" dominant-baseline="central">phy</text>

<text class="t" x="20" y="205" dominant-baseline="central">photographic</text>
<text class="ts" x="20" y="224" dominant-baseline="central">(photographique)</text>
<text class="ts" x="130" y="205" dominant-baseline="central">/ˌfəʊtəˈɡræfɪk/</text>
<circle cx="360" cy="192" r="4" fill="#185FA5"/><circle cx="430" cy="192" r="4" fill="#185FA5"/><circle cx="500" cy="192" r="9" fill="#D85A30"/><circle cx="570" cy="192" r="4" fill="#185FA5"/>
<text class="t" x="360" y="216" text-anchor="middle" dominant-baseline="central">pho</text><text class="t" x="430" y="216" text-anchor="middle" dominant-baseline="central">to</text><text class="th" x="500" y="216" text-anchor="middle" dominant-baseline="central" fill="#D85A30">GRAPH</text><text class="t" x="570" y="216" text-anchor="middle" dominant-baseline="central">ic</text>

<text class="t" x="20" y="275" dominant-baseline="central">hotel</text>
<text class="ts" x="20" y="294" dominant-baseline="central">(un hôtel)</text>
<text class="ts" x="130" y="275" dominant-baseline="central">/həʊˈtel/</text>
<circle cx="360" cy="262" r="4" fill="#185FA5"/><circle cx="430" cy="262" r="9" fill="#D85A30"/>
<text class="t" x="360" y="286" text-anchor="middle" dominant-baseline="central">ho</text><text class="th" x="430" y="286" text-anchor="middle" dominant-baseline="central" fill="#D85A30">TEL</text>

<text class="ts" x="340" y="325" text-anchor="middle" dominant-baseline="central"><tspan fill="#D85A30">● orange</tspan> = syllabe accentuée, plus forte et plus longue ; <tspan fill="#185FA5">● bleu</tspan> = syllabe faible</text>
</svg>
