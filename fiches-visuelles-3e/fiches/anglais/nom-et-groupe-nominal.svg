<svg width="100%" viewBox="0 0 680 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tableau des pronoms personnels anglais : sujet, complément et réfléchi pour chaque personne">
<text class="th" x="108" y="22" text-anchor="middle" dominant-baseline="central">en français</text>
<g class="c-blue"><text class="th" x="275" y="22" text-anchor="middle" dominant-baseline="central">sujet</text><text class="ts" x="275" y="40" text-anchor="middle" dominant-baseline="central">avant le verbe</text></g>
<g class="c-coral"><text class="th" x="423" y="22" text-anchor="middle" dominant-baseline="central">complément</text><text class="ts" x="423" y="40" text-anchor="middle" dominant-baseline="central">après le verbe</text></g>
<g class="c-green"><text class="th" x="581" y="22" text-anchor="middle" dominant-baseline="central">réfléchi</text><text class="ts" x="581" y="40" text-anchor="middle" dominant-baseline="central">-self, -selves</text></g>
<text class="ts" x="190" y="71" text-anchor="end" dominant-baseline="central">je</text>
<g class="c-blue"><rect x="206" y="56" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="275" y="71" text-anchor="middle" dominant-baseline="central">I</text></g>
<g class="c-coral"><rect x="354" y="56" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="423" y="71" text-anchor="middle" dominant-baseline="central">me</text></g>
<g class="c-green"><rect x="502" y="56" width="158" height="30" rx="6" stroke-width="0.5"/><text class="t" x="581" y="71" text-anchor="middle" dominant-baseline="central">myself</text></g>
<text class="ts" x="190" y="107" text-anchor="end" dominant-baseline="central">tu</text>
<g class="c-blue"><rect x="206" y="92" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="275" y="107" text-anchor="middle" dominant-baseline="central">you</text></g>
<g class="c-coral"><rect x="354" y="92" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="423" y="107" text-anchor="middle" dominant-baseline="central">you</text></g>
<g class="c-green"><rect x="502" y="92" width="158" height="30" rx="6" stroke-width="0.5"/><text class="t" x="581" y="107" text-anchor="middle" dominant-baseline="central">yourself</text></g>
<text class="ts" x="190" y="143" text-anchor="end" dominant-baseline="central">il (personne)</text>
<g class="c-blue"><rect x="206" y="128" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="275" y="143" text-anchor="middle" dominant-baseline="central">he</text></g>
<g class="c-coral"><rect x="354" y="128" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="423" y="143" text-anchor="middle" dominant-baseline="central">him</text></g>
<g class="c-green"><rect x="502" y="128" width="158" height="30" rx="6" stroke-width="0.5"/><text class="t" x="581" y="143" text-anchor="middle" dominant-baseline="central">himself</text></g>
<text class="ts" x="190" y="179" text-anchor="end" dominant-baseline="central">elle (personne)</text>
<g class="c-blue"><rect x="206" y="164" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="275" y="179" text-anchor="middle" dominant-baseline="central">she</text></g>
<g class="c-coral"><rect x="354" y="164" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="423" y="179" text-anchor="middle" dominant-baseline="central">her</text></g>
<g class="c-green"><rect x="502" y="164" width="158" height="30" rx="6" stroke-width="0.5"/><text class="t" x="581" y="179" text-anchor="middle" dominant-baseline="central">herself</text></g>
<text class="ts" x="190" y="215" text-anchor="end" dominant-baseline="central">il, elle (chose, animal)</text>
<g class="c-blue"><rect x="206" y="200" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="275" y="215" text-anchor="middle" dominant-baseline="central">it</text></g>
<g class="c-coral"><rect x="354" y="200" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="423" y="215" text-anchor="middle" dominant-baseline="central">it</text></g>
<g class="c-green"><rect x="502" y="200" width="158" height="30" rx="6" stroke-width="0.5"/><text class="t" x="581" y="215" text-anchor="middle" dominant-baseline="central">itself</text></g>
<line x1="20" y1="238" x2="660" y2="238" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="190" y="257" text-anchor="end" dominant-baseline="central">nous</text>
<g class="c-blue"><rect x="206" y="242" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="275" y="257" text-anchor="middle" dominant-baseline="central">we</text></g>
<g class="c-coral"><rect x="354" y="242" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="423" y="257" text-anchor="middle" dominant-baseline="central">us</text></g>
<g class="c-green"><rect x="502" y="242" width="158" height="30" rx="6" stroke-width="0.5"/><text class="t" x="581" y="257" text-anchor="middle" dominant-baseline="central">ourselves</text></g>
<text class="ts" x="190" y="293" text-anchor="end" dominant-baseline="central">vous (plusieurs)</text>
<g class="c-blue"><rect x="206" y="278" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="275" y="293" text-anchor="middle" dominant-baseline="central">you</text></g>
<g class="c-coral"><rect x="354" y="278" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="423" y="293" text-anchor="middle" dominant-baseline="central">you</text></g>
<g class="c-green"><rect x="502" y="278" width="158" height="30" rx="6" stroke-width="0.5"/><text class="t" x="581" y="293" text-anchor="middle" dominant-baseline="central">yourselves</text></g>
<text class="ts" x="190" y="329" text-anchor="end" dominant-baseline="central">ils, elles</text>
<g class="c-blue"><rect x="206" y="314" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="275" y="329" text-anchor="middle" dominant-baseline="central">they</text></g>
<g class="c-coral"><rect x="354" y="314" width="138" height="30" rx="6" stroke-width="0.5"/><text class="t" x="423" y="329" text-anchor="middle" dominant-baseline="central">them</text></g>
<g class="c-green"><rect x="502" y="314" width="158" height="30" rx="6" stroke-width="0.5"/><text class="t" x="581" y="329" text-anchor="middle" dominant-baseline="central">themselves</text></g>
<text class="ts" x="20" y="354" text-anchor="start" dominant-baseline="central">singulier au-dessus du pointillé, pluriel en dessous</text>
<g class="c-gray"><rect x="20" y="376" width="640" height="52" rx="8" stroke-width="0.5"/><text class="t" x="340" y="393" text-anchor="middle" dominant-baseline="central">She looks at herself in the mirror.</text><text class="ts" x="340" y="412" text-anchor="middle" dominant-baseline="central">(elle se regarde dans le miroir : sujet et complément = la même personne)</text></g>
</svg>
