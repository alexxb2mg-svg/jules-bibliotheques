<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="200" y="20" text-anchor="middle" dominant-baseline="central">L'intonation, un indice de sens</text>
<text class="t" x="30" y="60" dominant-baseline="central">Are you ready?</text>
<text class="ts" x="30" y="80" dominant-baseline="central">(Tu es prêt ?)</text>
<text class="ts" x="30" y="100" dominant-baseline="central">question fermée (yes ou no) : la voix monte</text>
<polyline points="270,70 300,68 325,60 345,45" fill="none" stroke="#D85A30" stroke-width="3" stroke-linecap="round"/>
<polygon points="345,45 333,47 342,56" fill="#D85A30"/>
<text class="t" x="30" y="150" dominant-baseline="central">Where do you live?</text>
<text class="ts" x="30" y="170" dominant-baseline="central">(Où habites-tu ?)</text>
<text class="ts" x="30" y="190" dominant-baseline="central">question en wh- : descend le plus souvent</text>
<polyline points="270,140 300,137 325,145 345,160" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
<polygon points="345,160 333,158 341,149" fill="#185FA5"/>
<text class="t" x="30" y="240" dominant-baseline="central">I live in Leeds.</text>
<text class="ts" x="30" y="260" dominant-baseline="central">(J'habite à Leeds.)</text>
<text class="ts" x="30" y="280" dominant-baseline="central">affirmation : la voix descend</text>
<polyline points="270,230 300,227 325,235 345,250" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
<polygon points="345,250 333,248 341,239" fill="#185FA5"/>
<text class="ts" x="30" y="315" dominant-baseline="central"><tspan fill="#D85A30">orange</tspan> = la voix monte ; <tspan fill="#185FA5">bleu</tspan> = la voix descend</text>

<g class="node c-teal"><rect x="400" y="8" width="260" height="300" rx="10" stroke-width="0.5"/>
<text class="th" x="530" y="32" text-anchor="middle" dominant-baseline="central">Mots-outils à guetter</text>
<text class="t" x="420" y="70" dominant-baseline="central">first (d'abord)</text>
<text class="t" x="420" y="105" dominant-baseline="central">then (ensuite)</text>
<text class="t" x="420" y="140" dominant-baseline="central">but (mais)</text>
<text class="t" x="420" y="175" dominant-baseline="central">because (parce que)</text>
<text class="t" x="420" y="210" dominant-baseline="central">so (donc, alors)</text>
<text class="t" x="420" y="245" dominant-baseline="central">finally (enfin)</text>
<text class="ts" x="530" y="283" text-anchor="middle" dominant-baseline="central">ils annoncent la suite du message</text></g>
</svg>
