<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les trois R : réduire, réutiliser, recycler, du plus efficace au moins efficace, avec un exemple en anglais pour chacun">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-green"><rect x="20" y="30" width="200" height="150" rx="10" stroke-width="0.5"/><text class="th" x="120" y="56" text-anchor="middle" dominant-baseline="central">1. Reduce</text><text class="ts" x="120" y="78" text-anchor="middle" dominant-baseline="central">(réduire)</text><text class="t" x="120" y="120" text-anchor="middle" dominant-baseline="central">Buy less packaging.</text><text class="ts" x="120" y="142" text-anchor="middle" dominant-baseline="central">(Achète moins d'emballages.)</text></g>
<line x1="222" y1="105" x2="238" y2="105" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="240" y="30" width="200" height="150" rx="10" stroke-width="0.5"/><text class="th" x="340" y="56" text-anchor="middle" dominant-baseline="central">2. Reuse</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">(réutiliser)</text><text class="t" x="340" y="120" text-anchor="middle" dominant-baseline="central">Use a refillable bottle.</text><text class="ts" x="340" y="142" text-anchor="middle" dominant-baseline="central">(Utilise une gourde.)</text></g>
<line x1="442" y1="105" x2="458" y2="105" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="460" y="30" width="200" height="150" rx="10" stroke-width="0.5"/><text class="th" x="560" y="56" text-anchor="middle" dominant-baseline="central">3. Recycle</text><text class="ts" x="560" y="78" text-anchor="middle" dominant-baseline="central">(recycler)</text><text class="t" x="560" y="120" text-anchor="middle" dominant-baseline="central">Sort paper and plastic.</text><text class="ts" x="560" y="142" text-anchor="middle" dominant-baseline="central">(Trie le papier et le plastique.)</text></g>
<line x1="40" y1="204" x2="640" y2="204" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="40" y="222" text-anchor="start" dominant-baseline="central">le plus efficace</text><text class="ts" x="640" y="222" text-anchor="end" dominant-baseline="central">le moins efficace</text>
<text class="th" x="24" y="256" text-anchor="start" dominant-baseline="central">Mots utiles</text>
<g class="c-gray"><rect x="24" y="269" width="300" height="30" rx="6" stroke-width="0.5"/><text class="t" x="36" y="284" text-anchor="start" dominant-baseline="central">waste : déchets</text></g>
<g class="c-gray"><rect x="344" y="269" width="300" height="30" rx="6" stroke-width="0.5"/><text class="t" x="356" y="284" text-anchor="start" dominant-baseline="central">a bin : une poubelle</text></g>
<g class="c-gray"><rect x="24" y="309" width="300" height="30" rx="6" stroke-width="0.5"/><text class="t" x="36" y="324" text-anchor="start" dominant-baseline="central">rubbish (UK), trash (US) : ordures</text></g>
<g class="c-gray"><rect x="344" y="309" width="300" height="30" rx="6" stroke-width="0.5"/><text class="t" x="356" y="324" text-anchor="start" dominant-baseline="central">litter : déchets jetés par terre</text></g>
</svg>
