    url: "https://fr.wikibooks.org/w/index.php?title=Enseignement_de_l%27anglais/Pronoms&oldid=756787"
    licence: CC-BY-SA-4.0
  - titre: "Programme du cycle 4 (annexe 3) — partie « Langues vivantes (étrangères ou régionales) »"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
relecture: {statut: a_relire}
generation: {par: "projet-jules", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: formule
    type: formule
    expression: "[sujet] + verbe + [pronom complément]"
    termes:
      sujet: {couleur: bleu, legende: "le **pronom sujet**, avant le verbe : I, you, he, she, it, we, they"}
      pronom complément: {couleur: orange, legende: "toujours **après le verbe** : me, you, him, her, it, us, them. I like him (je l'aime bien)."}
    jules: "En français, le pronom complément se glisse avant le verbe (je l'aime) ; en anglais, l'ordre ne bouge jamais : sujet, verbe, puis complément."

  - id: carte
    type: carte
    noeuds:
      - {id: pronoms, titre: "Pronoms personnels", sous_titre: "remplacent un nom déjà cité", principal: true}
      - {id: genre, titre: "Genre", sous_titre: "he, she ou it selon la personne ou la chose"}
      - {id: sujets, titre: "Pronoms sujets", sous_titre: "I, you, he, she, it, we, they"}
      - {id: complements, titre: "Pronoms compléments", sous_titre: "me, him, her, us, them : après le verbe"}
      - {id: reflechis, titre: "Pronoms réfléchis", sous_titre: "myself, herself, ourselves..."}
    liens:
      - {de: pronoms, vers: genre, libelle: "choisis selon"}
      - {de: pronoms, vers: sujets}
      - {de: pronoms, vers: complements}
      - {de: pronoms, vers: reflechis}
    jules: "Les noms communs anglais n'ont **pas de genre grammatical** : « the table » (la table), « the sun » (le soleil), « the moon » (la lune) sont neutres. Le genre ne se voit que dans les pronoms (he, she, it) et les possessifs (his, her, its)."

  - id: schema-tableau
    type: schema
    titre: "Le tableau des pronoms : sujet, complément, réfléchi"
    svg: "nom-et-groupe-nominal.svg"
    jules: "Astuce : au singulier, le réfléchi finit en **-self**, au pluriel en **-selves**. « You » a donc deux réfléchis : yourself (toi-même) et yourselves (vous-mêmes, à plusieurs)."

  - id: schema-choix
    type: schema
    titre: "Choisir he, she ou it, puis placer le pronom"
    svg: "nom-et-groupe-nominal-ordre.svg"
    jules: "Un animal de compagnie dont on connaît le sexe peut devenir he ou she (« my dog Rex, he loves me », mon chien Rex, il m'adore) ; un animal quelconque reste **it**."

  - id: methode
    type: methode
    etapes:
      - "Repérer ce que le pronom remplace : une **personne** (he, she), une **chose** ou un animal quelconque (it), plusieurs personnes ou choses (they)."
      - "Repérer sa fonction : **sujet** (avant le verbe) ou **complément** (après le verbe ou après une préposition : with him, avec lui ; for them, pour eux)."
      - "Placer le pronom complément **après le verbe**, jamais devant comme en français."
      - "Employer un **pronom réfléchi** (-self, -selves) seulement si le complément désigne la même personne que le sujet."
    jules: "Beaucoup de verbes pronominaux français ne sont pas réfléchis en anglais : se lever = get up, se souvenir = remember, se dépêcher = hurry up. On ne dit pas « I get myself up »."

  - id: piege
    type: piege
    mauvaise_idee: "Copier l'ordre du français : « Je l'aime » devient « I him like »."
    pourquoi_faux: "En anglais, le **pronom complément** se place toujours **après le verbe**, comme un nom complément (I like Tom → I like him)."
    bonne_idee: "Sujet + verbe + complément : « I like him. » (je l'aime bien) ; « She called us. » (elle nous a appelés)."
    jules: "Autre erreur fréquente : dire « he » pour un objet. « My phone is broken, **it** doesn't work » (il ne marche pas) : en anglais, un téléphone n'est ni masculin ni féminin."

  - id: exemple-reflechi
    type: exemple
    situation: "Traduire : « Elle s'est coupée avec un couteau. »"
    calcul: "Sujet : she (une femme). Elle se coupe **elle-même** : sujet et complément désignent la même personne, donc pronom réfléchi herself, placé après le verbe cut (prétérit : cut)."
    conclusion: "« She cut **herself** with a knife. » (elle s'est coupée avec un couteau). Sans réfléchi, « She cut her » voudrait dire qu'elle a coupé une autre femme."
    jules: "Le réfléchi sert aussi à insister, comme « moi-même » : « I made this cake **myself** » (j'ai fait ce gâteau moi-même)."

  - id: exemple-choix
    type: exemple
    situation: "Compléter : « My grandmother has a cat. She feeds ___ every morning and the cat follows ___ everywhere. » (le chat, puis la grand-mère)"
    calcul: "1er trou : le chat, un animal dont on ne précise pas le sexe, en position complément → it. 2e trou : la grand-mère, une femme, en position complément après follows → her."
    conclusion: "« She feeds **it** every morning and the cat follows **her** everywhere. » (elle le nourrit chaque matin et le chat la suit partout)."
    jules: "« Her » a deux rôles : pronom complément (follows her, la suit) et possessif (her cat, son chat à elle). Le contexte te dit lequel."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Récite le tableau ligne par ligne : I, me, myself ; you, you, yourself ; he, him, himself ; she, her, herself. Au bout de trois fois, il est acquis."
