<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Empreinte carbone par passager pour un même trajet : faible en train ou en autocar, élevée en voiture seul, très élevée en avion">
<text class="t" x="24" y="50" text-anchor="start" dominant-baseline="central">by train</text><text class="ts" x="24" y="70" text-anchor="start" dominant-baseline="central">(en train)</text>
<g class="c-green"><rect x="170" y="40" width="100" height="40" rx="6" stroke-width="0.5"/></g>
<g class="c-green"><text class="th" x="280" y="60" text-anchor="start" dominant-baseline="central">faible</text></g>
<text class="t" x="24" y="112" text-anchor="start" dominant-baseline="central">by coach</text><text class="ts" x="24" y="132" text-anchor="start" dominant-baseline="central">(en autocar)</text>
<g class="c-green"><rect x="170" y="102" width="100" height="40" rx="6" stroke-width="0.5"/></g>
<g class="c-green"><text class="th" x="280" y="122" text-anchor="start" dominant-baseline="central">faible</text></g>
<text class="t" x="24" y="174" text-anchor="start" dominant-baseline="central">by car, alone</text><text class="ts" x="24" y="194" text-anchor="start" dominant-baseline="central">(en voiture, seul)</text>
<g class="c-coral"><rect x="170" y="164" width="290" height="40" rx="6" stroke-width="0.5"/></g>
<g class="c-coral"><text class="th" x="470" y="184" text-anchor="start" dominant-baseline="central">élevée</text></g>
<text class="t" x="24" y="236" text-anchor="start" dominant-baseline="central">by plane</text><text class="ts" x="24" y="256" text-anchor="start" dominant-baseline="central">(en avion)</text>
<g class="c-coral"><rect x="170" y="226" width="380" height="40" rx="6" stroke-width="0.5"/></g>
<g class="c-coral"><text class="th" x="560" y="246" text-anchor="start" dominant-baseline="central">très élevée</text></g>
<text class="ts" x="24" y="288" text-anchor="start" dominant-baseline="central">Pour un passager et un même trajet en Europe. Ordre de grandeur, pas à l'échelle :</text>
<text class="ts" x="24" y="308" text-anchor="start" dominant-baseline="central">les valeurs exactes dépendent du véhicule, du remplissage et de la façon dont l'électricité est produite.</text>
</svg>
