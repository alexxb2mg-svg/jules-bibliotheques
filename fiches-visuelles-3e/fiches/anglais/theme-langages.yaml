blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: langages, titre: "Langages", sous_titre: "comment une société communique", principal: true}
      - {id: codes, titre: "Codes socio-culturels", sous_titre: "politesse, dates, unités"}
      - {id: graphiques, titre: "Documents graphiques", sous_titre: "cartes, tableaux, logos"}
      - {id: medias, titre: "Médias", sous_titre: "presse, réseaux sociaux, publicité"}
