      - {de: langages, vers: arts}
    jules: "Sur les réseaux sociaux, les anglophones abrègent beaucoup : LOL (laughing out loud, mort de rire), BTW (by the way, au fait). Ce sont aussi des **codes** à connaître pour comprendre un message."

  - id: schema-codes
    type: schema
    titre: "Mêmes informations, codes différents : France, Royaume-Uni, États-Unis"
    svg: "theme-langages.svg"
    jules: "Dans un tableau ou un graphique anglophone, 1.5 veut dire **un et demi** : le point remplace notre virgule, et la virgule sépare les milliers (10,000 = dix mille)."

  - id: schema-lettre
    type: schema
    titre: "Un code socio-culturel : la structure d'un e-mail formel ou informel"
    svg: "theme-langages-lettre.svg"
    jules: "Au Royaume-Uni, on termine par **Yours faithfully** quand on ne connaît pas le nom du destinataire (Dear Sir or Madam) et par **Yours sincerely** quand on le connaît (Dear Mr Smith)."

  - id: graphe-temperatures
    type: graphe
    gabarit: echelles-paralleles
    curseurs:
      - {id: curseur-echelle, nom: echelle, min: 1, max: 1, pas: 1, depart: 1}
      - {id: curseur-celsius, nom: celsius, min: -10, max: 40, pas: 5, depart: 20}
    lectures:
      - {si: "celsius <= 0", texte: "À 0 °C ou moins, on lit **32 °F** ou moins : l'eau gèle, la météo américaine dit **freezing**."}
      - {si: "celsius >= 10 && celsius <= 20", texte: "Entre 10 et 20 °C, on lit entre **50 et 68 °F** : il fait doux, on dit **mild** ou **cool**."}
      - {si: "celsius >= 25 && celsius <= 30", texte: "De 25 à 30 °C, la graduation °F est autour de **80** : il fait chaud, **warm** ou **hot**."}
      - {si: "celsius >= 35", texte: "À partir de 35 °C, on atteint **95 °F** ou plus : c'est la canicule, **a heatwave**."}
    jules: "La ligne pointillée relie les deux graduations à la même hauteur : c'est la même température écrite dans deux codes. Deux repères à retenir : 0 °C = 32 °F (l'eau gèle) et 37 °C ≈ 99 °F (notre corps)."

  - id: methode
    type: methode
    etapes:
      - "Identifier le **type de support** : média (article, post, publicité), œuvre artistique (chanson, tableau, film) ou document graphique (carte, tableau, logo)."
      - "Repérer les **codes** propres au support et au pays : format de la date, unités, formules de politesse, hashtags, slogan."
      - "Relier le document à la culture du pays anglophone concerné : qui l'a produit, pour qui, à quelle époque."
      - "Présenter une œuvre sans la reproduire : « This song is by… » (Cette chanson est de…), « In this painting, we can see… » (Dans ce tableau, on voit…), puis donner son avis."
    jules: "Présenter une œuvre, c'est dire **qui, quand, quoi** puis donner ton avis : tu n'as pas besoin de recopier les paroles d'une chanson ou de redessiner un tableau pour en parler."

  - id: piege
    type: piege
    mauvaise_idee: "Lire un document anglophone avec les **codes français** : comprendre la date américaine 09/10/2026 comme « 9 octobre »."
    pourquoi_faux: "Aux États-Unis, on écrit d'abord le **mois**, puis le jour : 09/10/2026 veut dire « September 10, 2026 » (le 10 septembre 2026)."
    bonne_idee: "Se demander d'abord de quel pays vient le document, puis vérifier ses **codes** : date, unités, séparateur décimal, formules de politesse."
    jules: "Autre confusion fréquente : mélanger un **langage artistique** (une chanson, un tableau) et un **média d'information** (un journal, une chaîne d'information). L'un exprime une vision personnelle, l'autre informe."

  - id: exemple-code
    type: exemple
    situation: "Un site de météo américain annonce pour le 07/04/2026 : « Sunny, 86 °F » (ensoleillé, 86 °F). Quel jour, et fait-il chaud ?"
    calcul: "Date aux États-Unis : mois puis jour, donc le 4 juillet (July 4), fête nationale américaine. Température : 32 °F = 0 °C et 86 °F = 30 °C."
    conclusion: "Il s'agit du **4 juillet 2026** et il fera **chaud**, environ 30 °C : lu avec les codes français, on aurait cru au 7 avril, avec une température impossible de 86 °C."
    jules: "Pour convertir des °F en °C, on retire 32 puis on multiplie par 5 et on divise par 9 : (86 − 32) × 5 ÷ 9 = 54 × 5 ÷ 9 = **30 °C**."

  - id: exemple-oeuvre
    type: exemple
    situation: "Présenter un groupe de musique britannique à l'oral, en quelques phrases, sans reproduire ses chansons."
    calcul: "« The Beatles were a band from Liverpool, in England. » (Les Beatles étaient un groupe de Liverpool, en Angleterre.) « They became famous all over the world in the 1960s. » (Ils sont devenus célèbres dans le monde entier dans les années 1960.) « I like their songs because they are catchy. » (J'aime leurs chansons parce qu'elles sont entraînantes.)"
    conclusion: "La présentation suit l'ordre **qui, où, quand**, puis un **avis justifié** avec because (parce que)."
    jules: "Pour donner ton avis en anglais, varie les débuts : « I like… because… » (J'aime… parce que…), « In my opinion… » (À mon avis…), « What I prefer is… » (Ce que je préfère, c'est…)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À retenir : trois grandes familles de supports, les **codes socio-culturels**, les **médias** et les **langages artistiques**, à analyser chacune avec les usages du pays."
