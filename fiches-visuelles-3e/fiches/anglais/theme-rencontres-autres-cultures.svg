<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte très simplifiée des bandes de climat, du polaire au tropical, avec six pays anglophones placés approximativement">
<rect x="20" y="20" width="640" height="50" fill="#E6F1FB" stroke="none"/>
<text class="ts" x="652" y="32" text-anchor="end" dominant-baseline="central" fill="#185FA5">polaire</text>
<rect x="20" y="70" width="640" height="110" fill="#EAF3DE" stroke="none"/>
<text class="ts" x="652" y="82" text-anchor="end" dominant-baseline="central" fill="#3B6D11">tempéré</text>
<rect x="20" y="180" width="640" height="120" fill="#FAEEDA" stroke="none"/>
<text class="ts" x="652" y="192" text-anchor="end" dominant-baseline="central" fill="#854F0B">tropical</text>
<rect x="20" y="300" width="640" height="70" fill="#FAEEDA" stroke="none"/>
<text class="ts" x="652" y="312" text-anchor="end" dominant-baseline="central" fill="#854F0B">désert ou tropical</text>
<rect x="20" y="370" width="640" height="50" fill="#EAF3DE" stroke="none"/>
<text class="ts" x="652" y="382" text-anchor="end" dominant-baseline="central" fill="#3B6D11">tempéré</text>
<line x1="20" y1="300" x2="660" y2="300" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/>
<text class="ts" x="652" y="288" text-anchor="end" dominant-baseline="central">équateur</text>
<text class="ts" x="28" y="30" text-anchor="start" dominant-baseline="central">Nord</text><text class="ts" x="28" y="410" text-anchor="start" dominant-baseline="central">Sud</text>
<g class="c-gray"><rect x="50" y="40" width="190" height="70" rx="8" stroke-width="0.5"/><text class="th" x="145.0" y="56" text-anchor="middle" dominant-baseline="central">Canada</text><text class="ts" x="145.0" y="76" text-anchor="middle" dominant-baseline="central">nord polaire, sud tempéré</text><text class="ts" x="145.0" y="94" text-anchor="middle" dominant-baseline="central">polar bear (ours polaire)</text></g>
<g class="c-gray"><rect x="50" y="130" width="190" height="70" rx="8" stroke-width="0.5"/><text class="th" x="145.0" y="146" text-anchor="middle" dominant-baseline="central">États-Unis</text><text class="ts" x="145.0" y="166" text-anchor="middle" dominant-baseline="central">du froid au désert</text><text class="ts" x="145.0" y="184" text-anchor="middle" dominant-baseline="central">bison (bison)</text></g>
<g class="c-gray"><rect x="290" y="90" width="200" height="70" rx="8" stroke-width="0.5"/><text class="th" x="390.0" y="106" text-anchor="middle" dominant-baseline="central">Royaume-Uni</text><text class="ts" x="390.0" y="126" text-anchor="middle" dominant-baseline="central">océanique : doux, pluvieux</text><text class="ts" x="390.0" y="144" text-anchor="middle" dominant-baseline="central">hedgehog (hérisson)</text></g>
<g class="c-gray"><rect x="150" y="212" width="190" height="70" rx="8" stroke-width="0.5"/><text class="th" x="245.0" y="228" text-anchor="middle" dominant-baseline="central">Jamaïque</text><text class="ts" x="245.0" y="248" text-anchor="middle" dominant-baseline="central">chaud toute l'année</text><text class="ts" x="245.0" y="266" text-anchor="middle" dominant-baseline="central">hummingbird (colibri)</text></g>
<g class="c-gray"><rect x="310" y="306" width="200" height="70" rx="8" stroke-width="0.5"/><text class="th" x="410.0" y="322" text-anchor="middle" dominant-baseline="central">Australie</text><text class="ts" x="410.0" y="342" text-anchor="middle" dominant-baseline="central">nord tropical, centre désert</text><text class="ts" x="410.0" y="360" text-anchor="middle" dominant-baseline="central">kangaroo (kangourou)</text></g>
<g class="c-gray"><rect x="110" y="376" width="180" height="40" rx="8" stroke-width="0.5"/><text class="th" x="200" y="389" text-anchor="middle" dominant-baseline="central">Nouvelle-Zélande</text><text class="ts" x="200" y="406" text-anchor="middle" dominant-baseline="central">tempéré ; kiwi (kiwi)</text></g>
<text class="ts" x="340" y="434" text-anchor="middle" dominant-baseline="central">Carte très simplifiée : positions approximatives, pas à l'échelle.</text>
</svg>
