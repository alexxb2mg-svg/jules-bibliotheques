    liens:
      - {de: complexe, vers: coordination}
      - {de: complexe, vers: subordination}
      - {de: subordination, vers: relatives}
      - {de: subordination, vers: indirect}
    jules: "Une phrase **simple** a un seul verbe conjugué ; une phrase **complexe** en a plusieurs, reliés par un mot de liaison. Les **connecteurs** donnent la logique : cause (because), conséquence (so), opposition (but, although)."

  - id: schema-relier
    type: schema
    titre: "Relier deux idées : coordination, subordination, relative"
    svg: "enonces-simples-et-complexes.svg"
    jules: "However (cependant) relie deux phrases et se place souvent en tête, suivi d'une virgule : « It was cold. However, we went out. » (il faisait froid, pourtant nous sommes sortis)."

  - id: schema-indirect
    type: schema
    titre: "Au discours indirect, les temps reculent d'un cran"
    svg: "enonces-simples-et-complexes-indirect.svg"
    jules: "Pense aussi aux **pronoms** : « I » devient he ou she selon la personne qui a parlé. Les repères changent souvent : now devient then, tomorrow devient the next day."

  - id: methode
    type: methode
    etapes:
      - "Pour une relative, regarder le nom repris : une **personne** → who, une **chose** ou un animal → which, et that pour les deux (surtout à l'oral)."
      - "Pour rapporter des paroles avec un verbe introducteur au passé (said, told, asked), **reculer les temps** d'un cran : présent → prétérit, prétérit → past perfect, will → would, can → could."
      - "Adapter les **pronoms** et les repères de temps au point de vue de celui qui rapporte."
      - "Pour une question rapportée : ordre sujet + verbe (pas d'inversion, pas de do ni did), pas de point d'interrogation, et if devant une question fermée."
    jules: "Say et tell ne se construisent pas pareil : « He said that he was tired » mais « He told **me** that he was tired » (il m'a dit qu'il était fatigué) (tell est toujours suivi de la personne à qui l'on parle)."

  - id: piege
    type: piege
    mauvaise_idee: "Garder l'ordre de la question dans l'interrogation indirecte : « She asked me where did I live? »"
    pourquoi_faux: "Une question rapportée n'est plus une question : c'est une **subordonnée**. Elle reprend l'ordre sujet + verbe, sans do ni did, et perd son point d'interrogation."
    bonne_idee: "« Where do you live? » devient « She asked me where I lived. » (elle m'a demandé où j'habitais) : sujet I, verbe lived au prétérit."
    jules: "Deux autres erreurs fréquentes : dire which pour une personne (the girl **who** won, la fille qui a gagné, pas which) et oublier de reculer le temps après said."

  - id: exemple-indirect
    type: exemple
    situation: "Rapporter les paroles de Sarah : « I love London and I will come back next year. »"
    calcul: "Verbe introducteur au passé (said) → love recule au prétérit loved, will recule en would. Le pronom I devient she (Sarah), next year devient the following year."
    conclusion: "« Sarah said (that) she **loved** London and that she **would** come back the following year. » (Sarah a dit qu'elle adorait Londres et qu'elle reviendrait l'année suivante)"
    jules: "That est facultatif après said : « Sarah said she loved London » est tout aussi correct, et plus fréquent à l'oral."

  - id: exemple-relative
    type: exemple
    situation: "Relier en une phrase : « I have a friend. She lives in Dublin. » puis « This is the phone. I bought it yesterday. »"
    calcul: "« She » reprend a friend, une personne → who. « It » reprend the phone, une chose → which (ou that). Le pronom repris disparaît : on ne garde pas she ni it."
    conclusion: "« I have a friend **who** lives in Dublin. » (j'ai une amie qui habite à Dublin) ; « This is the phone **which** I bought yesterday. » (voici le téléphone que j'ai acheté hier)"
    jules: "Quand le relatif est complément, on peut même le supprimer : « This is the phone I bought yesterday » est tout à fait naturel."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Pour enrichir une production écrite, glisse un connecteur de chaque sorte : because (cause), so (conséquence), but ou although (opposition), then (la suite)."
