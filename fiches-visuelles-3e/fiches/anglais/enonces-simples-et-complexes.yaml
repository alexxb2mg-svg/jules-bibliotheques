blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: complexe, titre: "Phrase complexe", sous_titre: "plusieurs verbes conjugués reliés", principal: true}
      - {id: coordination, titre: "Coordination", sous_titre: "and, but, or, so"}
      - {id: subordination, titre: "Subordination", sous_titre: "because, although, when, if"}
      - {id: relatives, titre: "Relatives", sous_titre: "who, which, that"}
