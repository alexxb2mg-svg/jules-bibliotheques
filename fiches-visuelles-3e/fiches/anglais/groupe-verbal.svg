<circle cx="300" cy="140" r="6" fill="#993C1D"/>
<text class="t" x="210" y="162" text-anchor="start" dominant-baseline="central">I have lost my keys. <tspan class="ts">(j'ai perdu mes clés : je ne les ai toujours pas)</tspan></text>
<g class="c-coral"><rect x="20" y="194" width="176" height="50" rx="8" stroke-width="0.5"/><text class="th" x="108" y="210" text-anchor="middle" dominant-baseline="central">Présent simple</text><text class="ts" x="108" y="228" text-anchor="middle" dominant-baseline="central">BV, + -s avec he, she, it</text></g>
<line x1="210" y1="208" x2="660" y2="208" stroke="#D3D1C7" stroke-width="1"/>
<line x1="480" y1="194" x2="480" y2="220" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>
