<svg width="100%" viewBox="0 0 680 418" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frise des temps : prétérit, present perfect, présent simple, présent en BE + V-ing, futur avec will">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="210" y1="40" x2="660" y2="40" stroke="#5F5E5A" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="22" text-anchor="start" dominant-baseline="central">passé</text>
<text class="ts" x="652" y="22" text-anchor="end" dominant-baseline="central">avenir</text>
<text class="th" x="480" y="18" text-anchor="middle" dominant-baseline="central">maintenant</text>
<g class="c-blue"><rect x="20" y="58" width="176" height="50" rx="8" stroke-width="0.5"/><text class="th" x="108" y="74" text-anchor="middle" dominant-baseline="central">Prétérit</text><text class="ts" x="108" y="92" text-anchor="middle" dominant-baseline="central">V-ed ou irrégulier</text></g>
<line x1="210" y1="72" x2="660" y2="72" stroke="#D3D1C7" stroke-width="1"/>
<line x1="480" y1="58" x2="480" y2="84" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="300" cy="72" r="7" fill="#185FA5"/>
<g class="c-blue"><text class="ts" x="300" y="58" text-anchor="middle" dominant-baseline="central">2019</text></g>
<text class="t" x="210" y="94" text-anchor="start" dominant-baseline="central">I visited London in 2019. <tspan class="ts">(je suis allé à Londres en 2019)</tspan></text>
<g class="c-coral"><rect x="20" y="126" width="176" height="50" rx="8" stroke-width="0.5"/><text class="th" x="108" y="142" text-anchor="middle" dominant-baseline="central">Present perfect</text><text class="ts" x="108" y="160" text-anchor="middle" dominant-baseline="central">HAVE + participe passé</text></g>
<line x1="210" y1="140" x2="660" y2="140" stroke="#D3D1C7" stroke-width="1"/>
