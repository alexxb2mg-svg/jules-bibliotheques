<line x1="330" y1="201" x2="330" y2="215" stroke="#993C1D" stroke-width="3"/>
<line x1="370" y1="201" x2="370" y2="215" stroke="#993C1D" stroke-width="3"/>
<line x1="410" y1="201" x2="410" y2="215" stroke="#993C1D" stroke-width="3"/>
<line x1="450" y1="201" x2="450" y2="215" stroke="#993C1D" stroke-width="3"/>
<line x1="490" y1="201" x2="490" y2="215" stroke="#993C1D" stroke-width="3"/>
<line x1="530" y1="201" x2="530" y2="215" stroke="#993C1D" stroke-width="3"/>
<line x1="570" y1="201" x2="570" y2="215" stroke="#993C1D" stroke-width="3"/>
<line x1="610" y1="201" x2="610" y2="215" stroke="#993C1D" stroke-width="3"/>
<text class="t" x="210" y="230" text-anchor="start" dominant-baseline="central">She plays tennis every Sunday. <tspan class="ts">(elle joue au tennis le dimanche)</tspan></text>
<g class="c-coral"><rect x="20" y="262" width="176" height="50" rx="8" stroke-width="0.5"/><text class="th" x="108" y="278" text-anchor="middle" dominant-baseline="central">Présent en BE + V-ing</text><text class="ts" x="108" y="296" text-anchor="middle" dominant-baseline="central">action en cours</text></g>
<line x1="210" y1="276" x2="660" y2="276" stroke="#D3D1C7" stroke-width="1"/>
<line x1="480" y1="262" x2="480" y2="288" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="456" y1="276" x2="504" y2="276" stroke="#993C1D" stroke-width="8" stroke-linecap="round"/>
<text class="t" x="210" y="298" text-anchor="start" dominant-baseline="central">He is reading now. <tspan class="ts">(il est en train de lire)</tspan></text>
<g class="c-green"><rect x="20" y="330" width="176" height="50" rx="8" stroke-width="0.5"/><text class="th" x="108" y="346" text-anchor="middle" dominant-baseline="central">Futur</text><text class="ts" x="108" y="364" text-anchor="middle" dominant-baseline="central">will + BV</text></g>
<line x1="210" y1="344" x2="660" y2="344" stroke="#D3D1C7" stroke-width="1"/>
<line x1="480" y1="330" x2="480" y2="356" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="3 3"/>
<circle cx="600" cy="344" r="7" fill="#3B6D11"/>
<g class="c-green"><text class="ts" x="600" y="330" text-anchor="middle" dominant-baseline="central">demain</text></g>
<text class="t" x="210" y="366" text-anchor="start" dominant-baseline="central">It will rain tomorrow. <tspan class="ts">(il pleuvra demain)</tspan></text>
<text class="ts" x="20" y="404" text-anchor="start" dominant-baseline="central">Bleu : passé coupé de maintenant. Corail : vrai ou visible maintenant. Vert : avenir. Pas à l'échelle.</text>
