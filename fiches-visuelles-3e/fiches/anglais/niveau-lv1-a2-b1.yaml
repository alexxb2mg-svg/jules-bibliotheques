    jules: "Le CECRL sert dans toute l'Europe : un niveau A2 ou B1 veut dire la même chose en France, en Espagne ou en Allemagne, pour l'anglais comme pour les autres langues."

  - id: schema-echelle
    type: schema
    titre: "L'échelle du CECRL et l'objectif de fin de 3e en LV1"
    svg: "niveau-lv1-a2-b1.svg"
    jules: "A2 n'est pas « ne rien savoir » : c'est déjà un **utilisateur élémentaire** qui communique vraiment sur des sujets familiers. B1 est le premier niveau **utilisateur indépendant**."

  - id: schema-profil
    type: schema
    titre: "Un profil réaliste : un niveau par activité langagière"
    svg: "niveau-lv1-a2-b1-profil.svg"
    jules: "Lire et écouter (la **réception**) progressent souvent plus vite que parler ou dialoguer (la **production** et le **dialogue**) : en lisant, tu as le temps de relire ; à l'oral, il faut réagir tout de suite."

  - id: methode
    type: methode
    etapes:
      - "Évaluer son niveau **activité par activité** (écouter, lire, parler en continu, écrire, réagir et dialoguer), pas un seul niveau global."
      - "Comparer ce qu'on sait faire aux **descripteurs** du CECRL, écrits en « je peux » : « I can describe my school. » (Je peux décrire mon collège.) relève de A2."
      - "Repérer l'activité la plus faible et la travailler en priorité, sans abandonner les autres."
      - "Viser B1 là où on est déjà solide : raconter un événement, donner brièvement son avis, se débrouiller en voyage."
    jules: "Un descripteur du CECRL décrit ce qu'on **sait faire** avec la langue, pas les fautes qu'on fait : on peut être A2 avec quelques erreurs, du moment que le message passe."

  - id: piege
    type: piege
    mauvaise_idee: "« J'ai un niveau d'anglais, par exemple A2, le même dans toutes les activités langagières. »"
    pourquoi_faux: "Le programme prévoit un **profil individualisé** : on peut être B1 en lecture et A2 en dialogue spontané. Correction de la langue, aisance à l'oral et étendue du vocabulaire varient selon l'activité."
    bonne_idee: "Donner un niveau pour chacune des **5 activités langagières** : A2 au minimum partout en LV1, B1 dans plusieurs d'entre elles si possible."
    jules: "Autre confusion fréquente : mélanger les objectifs. En LV1, c'est A2 dans les **cinq** activités ; en LV2, A2 dans **au moins deux** activités seulement."

  - id: exemple
    type: exemple
    situation: "Léa comprend bien des articles simples en anglais, mais elle bloque quand on lui pose une question orale imprévue, comme « What did you do last weekend? » (Qu'as-tu fait le week-end dernier ?)."
    calcul: "Lire : elle comprend l'essentiel d'un texte sur un sujet courant, niveau B1 probable. Réagir et dialoguer : elle répond avec des phrases courtes et apprises, niveau A2 probable, comme « I went to the cinema. It was great. » (Je suis allée au cinéma. C'était génial.)"
    conclusion: "Léa a un **profil normal** : B1 en lecture, A2 en interaction orale. Elle atteint l'objectif A2 et peut viser B1 à l'oral en s'entraînant à réagir vite."
    jules: "Pour progresser en interaction, apprends des **phrases toutes prêtes** pour gagner du temps : « Let me think… » (Laisse-moi réfléchir…), « Could you repeat, please? » (Tu peux répéter, s'il te plaît ?)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À retenir : 6 niveaux (A1, A2, B1, B2, C1, C2), 5 activités langagières, et en LV1 l'objectif **A2 partout, B1 dans plusieurs activités**."
