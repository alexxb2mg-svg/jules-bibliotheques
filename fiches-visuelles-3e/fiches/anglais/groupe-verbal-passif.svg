<svg width="100%" viewBox="0 0 680 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Passage de la voix active à la voix passive : Shakespeare wrote Hamlet devient Hamlet was written by Shakespeare">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-blue"><rect x="20" y="12" width="170" height="40" rx="8" stroke-width="0.5"/><text class="t" x="105" y="32" text-anchor="middle" dominant-baseline="central">Shakespeare</text></g>
<g class="c-gray"><rect x="210" y="12" width="150" height="40" rx="8" stroke-width="0.5"/><text class="t" x="285" y="32" text-anchor="middle" dominant-baseline="central">wrote</text></g>
<g class="c-coral"><rect x="380" y="12" width="140" height="40" rx="8" stroke-width="0.5"/><text class="t" x="450" y="32" text-anchor="middle" dominant-baseline="central">Hamlet.</text></g>
<text class="th" x="20" y="68" text-anchor="start" dominant-baseline="central">Voix active <tspan class="ts">(Shakespeare a écrit Hamlet)</tspan></text>
<path d="M450 56 C450 110 105 100 105 140" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M105 82 C105 110 540 100 575 140" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="20" y="146" width="170" height="40" rx="8" stroke-width="0.5"/><text class="t" x="105" y="166" text-anchor="middle" dominant-baseline="central">Hamlet</text></g>
<g class="c-gray"><rect x="210" y="146" width="260" height="40" rx="8" stroke-width="0.5"/><text class="t" x="340" y="166" text-anchor="middle" dominant-baseline="central">was written</text></g>
<g class="c-blue"><rect x="490" y="146" width="170" height="40" rx="8" stroke-width="0.5"/><text class="t" x="575" y="166" text-anchor="middle" dominant-baseline="central">by Shakespeare.</text></g>
<text class="th" x="20" y="202" text-anchor="start" dominant-baseline="central">Voix passive <tspan class="ts">(Hamlet a été écrit par Shakespeare) : BE au prétérit + participe passé</tspan></text>
<text class="th" x="20" y="240" text-anchor="start" dominant-baseline="central">Le temps se lit sur BE, le participe passé ne change pas :</text>
<g class="c-gray"><rect x="20" y="256" width="150" height="32" rx="8" stroke-width="0.5"/><text class="t" x="95" y="272" text-anchor="middle" dominant-baseline="central">présent</text></g>
<text class="t" x="186" y="272" text-anchor="start" dominant-baseline="central">English is spoken here. <tspan class="ts">(on parle anglais ici)</tspan></text>
<g class="c-gray"><rect x="20" y="296" width="150" height="32" rx="8" stroke-width="0.5"/><text class="t" x="95" y="312" text-anchor="middle" dominant-baseline="central">prétérit</text></g>
<text class="t" x="186" y="312" text-anchor="start" dominant-baseline="central">My bike was stolen. <tspan class="ts">(on m'a volé mon vélo)</tspan></text>
<g class="c-gray"><rect x="20" y="336" width="150" height="32" rx="8" stroke-width="0.5"/><text class="t" x="95" y="352" text-anchor="middle" dominant-baseline="central">present perfect</text></g>
<text class="t" x="186" y="352" text-anchor="start" dominant-baseline="central">The window has been broken. <tspan class="ts">(la vitre a été cassée)</tspan></text>
<g class="c-gray"><rect x="20" y="376" width="150" height="32" rx="8" stroke-width="0.5"/><text class="t" x="95" y="392" text-anchor="middle" dominant-baseline="central">futur</text></g>
<text class="t" x="186" y="392" text-anchor="start" dominant-baseline="central">The results will be published. <tspan class="ts">(les résultats seront publiés)</tspan></text>
<text class="ts" x="20" y="422" text-anchor="start" dominant-baseline="central">Corail : ce qui subit l'action, sujet du passif. Bleu : l'auteur, introduit par by, souvent omis.</text>
</svg>
