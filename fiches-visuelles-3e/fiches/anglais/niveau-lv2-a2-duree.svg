<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frise des classes du CP à la 3e : la LV1 est étudiée depuis le CP, la LV2 depuis la 5e">
<text class="th" x="340" y="14" text-anchor="middle" dominant-baseline="central">Années d'apprentissage jusqu'à la fin de la 3e</text>
<text class="ts" x="140.0" y="70" text-anchor="middle" dominant-baseline="central">CP</text>
<line x1="110" y1="82" x2="110" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="200.0" y="70" text-anchor="middle" dominant-baseline="central">CE1</text>
<line x1="170" y1="82" x2="170" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="260.0" y="70" text-anchor="middle" dominant-baseline="central">CE2</text>
<line x1="230" y1="82" x2="230" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="320.0" y="70" text-anchor="middle" dominant-baseline="central">CM1</text>
<line x1="290" y1="82" x2="290" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="380.0" y="70" text-anchor="middle" dominant-baseline="central">CM2</text>
<line x1="350" y1="82" x2="350" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="440.0" y="70" text-anchor="middle" dominant-baseline="central">6e</text>
<line x1="410" y1="82" x2="410" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="500.0" y="70" text-anchor="middle" dominant-baseline="central">5e</text>
<line x1="470" y1="82" x2="470" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="560.0" y="70" text-anchor="middle" dominant-baseline="central">4e</text>
<line x1="530" y1="82" x2="530" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<text class="ts" x="620.0" y="70" text-anchor="middle" dominant-baseline="central">3e</text>
<line x1="590" y1="82" x2="590" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<line x1="650" y1="82" x2="650" y2="200" stroke="#D3D1C7" stroke-width="0.5"/>
<path d="M110 58 L110 52 L410 52 L410 58" fill="none" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="260" y="40" text-anchor="middle" dominant-baseline="central">école primaire</text>
<path d="M410 58 L410 52 L650 52 L650 58" fill="none" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="530" y="40" text-anchor="middle" dominant-baseline="central">collège</text>
<text class="th" x="100" y="110" text-anchor="end" dominant-baseline="central">LV1</text>
<g class="c-blue"><rect x="110" y="92" width="540" height="36" rx="6" stroke-width="0.5"/><text class="t" x="380.0" y="110" text-anchor="middle" dominant-baseline="central">9 années : du CP à la 3e</text></g>
<text class="th" x="100" y="166" text-anchor="end" dominant-baseline="central">LV2</text>
<g class="c-coral"><rect x="470" y="148" width="180" height="36" rx="6" stroke-width="0.5"/><text class="t" x="560.0" y="166" text-anchor="middle" dominant-baseline="central">3 années</text></g>
<g class="c-blue"><text class="t" x="40" y="232" text-anchor="start" dominant-baseline="central">LV1 : A2 minimum dans les 5 activités, B1 visé dans plusieurs.</text></g>
<g class="c-coral"><text class="t" x="40" y="258" text-anchor="start" dominant-baseline="central">LV2 : A2 dans au moins 2 activités.</text></g>
<text class="ts" x="40" y="284" text-anchor="start" dominant-baseline="central">Cas le plus courant : une LV1 commencée au CP (le début peut varier selon le parcours).</text>
</svg>
