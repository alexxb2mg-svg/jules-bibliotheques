<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Discours direct et discours indirect : recul des temps et interrogation indirecte">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-blue"><text class="th" x="145.0" y="16" text-anchor="middle" dominant-baseline="central">Discours direct : les paroles</text></g>
<g class="c-coral"><text class="th" x="485.0" y="16" text-anchor="middle" dominant-baseline="central">Discours indirect : après said, asked</text></g>
<g class="c-blue"><rect x="20" y="32" width="250" height="42" rx="8" stroke-width="0.5"/><text class="t" x="145" y="44" text-anchor="middle" dominant-baseline="central">« I am tired. »</text><text class="ts" x="145" y="62" text-anchor="middle" dominant-baseline="central">présent · je suis fatigué</text></g>
<line x1="276" y1="53" x2="304" y2="53" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="310" y="32" width="350" height="42" rx="8" stroke-width="0.5"/><text class="t" x="485" y="44" text-anchor="middle" dominant-baseline="central">He said he was tired.</text><text class="ts" x="485" y="62" text-anchor="middle" dominant-baseline="central">prétérit · il a dit qu'il était fatigué</text></g>
<g class="c-blue"><rect x="20" y="82" width="250" height="42" rx="8" stroke-width="0.5"/><text class="t" x="145" y="94" text-anchor="middle" dominant-baseline="central">« I lost my keys. »</text><text class="ts" x="145" y="112" text-anchor="middle" dominant-baseline="central">prétérit · j'ai perdu mes clés</text></g>
<line x1="276" y1="103" x2="304" y2="103" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="310" y="82" width="350" height="42" rx="8" stroke-width="0.5"/><text class="t" x="485" y="94" text-anchor="middle" dominant-baseline="central">She said she had lost her keys.</text><text class="ts" x="485" y="112" text-anchor="middle" dominant-baseline="central">past perfect · elle a dit qu'elle avait perdu ses clés</text></g>
<g class="c-blue"><rect x="20" y="132" width="250" height="42" rx="8" stroke-width="0.5"/><text class="t" x="145" y="144" text-anchor="middle" dominant-baseline="central">« I have finished. »</text><text class="ts" x="145" y="162" text-anchor="middle" dominant-baseline="central">present perfect · j'ai fini</text></g>
<line x1="276" y1="153" x2="304" y2="153" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="310" y="132" width="350" height="42" rx="8" stroke-width="0.5"/><text class="t" x="485" y="144" text-anchor="middle" dominant-baseline="central">He said he had finished.</text><text class="ts" x="485" y="162" text-anchor="middle" dominant-baseline="central">past perfect · il a dit qu'il avait fini</text></g>
<g class="c-blue"><rect x="20" y="182" width="250" height="42" rx="8" stroke-width="0.5"/><text class="t" x="145" y="194" text-anchor="middle" dominant-baseline="central">« I will call you. »</text><text class="ts" x="145" y="212" text-anchor="middle" dominant-baseline="central">will · je t'appellerai</text></g>
<line x1="276" y1="203" x2="304" y2="203" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="310" y="182" width="350" height="42" rx="8" stroke-width="0.5"/><text class="t" x="485" y="194" text-anchor="middle" dominant-baseline="central">She said she would call me.</text><text class="ts" x="485" y="212" text-anchor="middle" dominant-baseline="central">would · elle a dit qu'elle m'appellerait</text></g>
<g class="c-blue"><rect x="20" y="232" width="250" height="42" rx="8" stroke-width="0.5"/><text class="t" x="145" y="244" text-anchor="middle" dominant-baseline="central">« I can swim. »</text><text class="ts" x="145" y="262" text-anchor="middle" dominant-baseline="central">can · je sais nager</text></g>
<line x1="276" y1="253" x2="304" y2="253" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="310" y="232" width="350" height="42" rx="8" stroke-width="0.5"/><text class="t" x="485" y="244" text-anchor="middle" dominant-baseline="central">He said he could swim.</text><text class="ts" x="485" y="262" text-anchor="middle" dominant-baseline="central">could · il a dit qu'il savait nager</text></g>
<text class="th" x="20" y="290" text-anchor="start" dominant-baseline="central">Question rapportée : ordre sujet + verbe, sans do ni did, sans point d'interrogation</text>
<g class="c-blue"><rect x="20" y="306" width="250" height="42" rx="8" stroke-width="0.5"/><text class="t" x="145" y="318" text-anchor="middle" dominant-baseline="central">« Where do you live? »</text><text class="ts" x="145" y="336" text-anchor="middle" dominant-baseline="central">où habites-tu ?</text></g>
<line x1="276" y1="327" x2="304" y2="327" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="310" y="306" width="350" height="42" rx="8" stroke-width="0.5"/><text class="t" x="485" y="318" text-anchor="middle" dominant-baseline="central">She asked me where I lived.</text><text class="ts" x="485" y="336" text-anchor="middle" dominant-baseline="central">elle m'a demandé où j'habitais</text></g>
<g class="c-blue"><rect x="20" y="356" width="250" height="42" rx="8" stroke-width="0.5"/><text class="t" x="145" y="368" text-anchor="middle" dominant-baseline="central">« Are you ready? »</text><text class="ts" x="145" y="386" text-anchor="middle" dominant-baseline="central">es-tu prêt ?</text></g>
<line x1="276" y1="377" x2="304" y2="377" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="310" y="356" width="350" height="42" rx="8" stroke-width="0.5"/><text class="t" x="485" y="368" text-anchor="middle" dominant-baseline="central">He asked me if I was ready.</text><text class="ts" x="485" y="386" text-anchor="middle" dominant-baseline="central">question fermée → if · il m'a demandé si j'étais prêt</text></g>
<text class="ts" x="20" y="416" text-anchor="start" dominant-baseline="central">Bleu : paroles citées telles quelles. Corail : paroles rapportées, un temps plus loin dans le passé.</text>
</svg>
