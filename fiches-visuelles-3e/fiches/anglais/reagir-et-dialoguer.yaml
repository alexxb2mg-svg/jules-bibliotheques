    jules: "Dans un dialogue, la **spontanéité** compte plus que la perfection : une réponse simple et un peu hésitante vaut mieux qu'un long silence."

  - id: schema
    type: schema
    titre: "Un échange qui avance : répondre, réagir, relancer"
    svg: "reagir-et-dialoguer.svg"
    jules: "Remarque le « And you? » (Et toi ?) : trois mots suffisent pour **relancer** l'échange et montrer que tu t'intéresses à l'autre."

  - id: schema-expressions
    type: schema
    titre: "La boîte à expressions du dialogue"
    svg: "reagir-et-dialoguer-expressions.svg"
    jules: "Apprends ces expressions par cœur, comme des blocs : dans l'urgence d'un échange, tu les ressors sans avoir à construire la phrase."

  - id: methode
    type: methode
    etapes:
      - "Écouter attentivement la question ou la remarque jusqu'au bout, et repérer le **mot interrogatif** (what, where, when, why, how) pour savoir ce qu'on te demande."
      - "Si tu n'as pas compris, le dire avec une formule toute faite : « Sorry, can you repeat, please? » (Pardon, tu peux répéter, s'il te plaît ?)."
      - "Répondre simplement, même de façon imparfaite, puis **réagir** : donner un avis, une raison (because...), une émotion."
      - "**Relancer** en posant une question à ton tour : « And you? », « What about you? » (Et toi ?), « Why? » (Pourquoi ?)."
    jules: "Pour gagner quelques secondes de réflexion, dis « Well » (eh bien) ou « Let me think » (laisse-moi réfléchir) : c'est ce que font les anglophones eux-mêmes."

  - id: piege
    type: piege
    mauvaise_idee: "Rester silencieux par peur de se tromper, ou traduire mot à mot une phrase française compliquée."
    pourquoi_faux: "Le silence coupe l'échange, et la traduction mot à mot prend du temps et produit des phrases fausses : dans un dialogue, il faut **réagir vite**."
    bonne_idee: "Répondre avec des **structures simples et connues** (I like... because..., I think that...), quitte à se reprendre ensuite."
    jules: "Autre erreur fréquente : répondre à côté. Une question en « When » (quand) attend un moment dans la réponse, par exemple last Saturday (samedi dernier) ou at 5 o'clock (à 5 heures)."

  - id: exemple
    type: exemple
    situation: "Un camarade demande : « What did you do last weekend? » (Qu'as-tu fait le week-end dernier ?) L'élève ne se souvient plus du mot « cinema »."
    calcul: "Il contourne le mot : « I watched a film with my family. » (J'ai regardé un film avec ma famille.) Ou il demande de l'aide : « How do you say cinéma in English? » (Comment dit-on cinéma en anglais ?)"
    conclusion: "Dans les deux cas, l'échange **continue sans blocage** ; il peut ensuite relancer : « And you? » (Et toi ?)"
    jules: "Ici, le mot est en fait très proche : cinema /ˈsɪnəmə/, avec l'accent tonique sur la première syllabe. Beaucoup de mots français ont un cousin anglais."

  - id: exemple-avis
    type: exemple
    situation: "Jeu de rôle : échanger ses avis sur l'uniforme scolaire."
    calcul: "A : « I think school uniforms are a good idea. » (Je pense que l'uniforme est une bonne idée.) B : « I don't think so. In my opinion, we should choose our clothes. What about you? » (Je ne pense pas. À mon avis, nous devrions choisir nos vêtements. Et toi ?) A : « Well, you're right: they aren't comfortable. » (Eh bien, tu as raison : ce n'est pas confortable.)"
    conclusion: "Chacun donne un **avis**, exprime son accord ou son désaccord, et B relance par une question : l'échange **alimente** le message ou le contredit, comme le demande le programme."
    jules: "« I don't agree » et « I disagree » veulent tous deux dire « je ne suis pas d'accord ». Évite « I am agree », qui n'existe pas : on dit **I agree**."

  - id: renfort
    type: renfort
    liens:
