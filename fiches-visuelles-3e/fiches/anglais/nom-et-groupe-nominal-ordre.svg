<svg width="100%" viewBox="0 0 680 398" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Choisir he, she, it ou they selon ce que remplace le pronom, puis placer le pronom complément après le verbe">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="20" y="18" text-anchor="start" dominant-baseline="central">1. Que remplace le pronom ?</text>
<g class="c-gray"><rect x="20" y="36" width="250" height="34" rx="6" stroke-width="0.5"/><text class="t" x="145" y="53" text-anchor="middle" dominant-baseline="central">un homme, un garçon</text></g>
<line x1="274" y1="53" x2="310" y2="53" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="316" y="36" width="70" height="34" rx="6" stroke-width="0.5"/><text class="th" x="351" y="53" text-anchor="middle" dominant-baseline="central">he</text></g>
<text class="t" x="400" y="44" text-anchor="start" dominant-baseline="central">Tom is tall. He plays rugby.</text>
<text class="ts" x="400" y="62" text-anchor="start" dominant-baseline="central">(Tom est grand. Il joue au rugby.)</text>
<g class="c-gray"><rect x="20" y="82" width="250" height="34" rx="6" stroke-width="0.5"/><text class="t" x="145" y="99" text-anchor="middle" dominant-baseline="central">une femme, une fille</text></g>
<line x1="274" y1="99" x2="310" y2="99" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="316" y="82" width="70" height="34" rx="6" stroke-width="0.5"/><text class="th" x="351" y="99" text-anchor="middle" dominant-baseline="central">she</text></g>
<text class="t" x="400" y="90" text-anchor="start" dominant-baseline="central">Emma is here. She is ready.</text>
<text class="ts" x="400" y="108" text-anchor="start" dominant-baseline="central">(Emma est là. Elle est prête.)</text>
<g class="c-gray"><rect x="20" y="128" width="250" height="34" rx="6" stroke-width="0.5"/><text class="t" x="145" y="145" text-anchor="middle" dominant-baseline="central">une chose, une idée, un animal</text></g>
<line x1="274" y1="145" x2="310" y2="145" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="316" y="128" width="70" height="34" rx="6" stroke-width="0.5"/><text class="th" x="351" y="145" text-anchor="middle" dominant-baseline="central">it</text></g>
<text class="t" x="400" y="136" text-anchor="start" dominant-baseline="central">The car is old. It is red.</text>
<text class="ts" x="400" y="154" text-anchor="start" dominant-baseline="central">(La voiture est vieille. Elle est rouge.)</text>
<g class="c-gray"><rect x="20" y="174" width="250" height="34" rx="6" stroke-width="0.5"/><text class="t" x="145" y="191" text-anchor="middle" dominant-baseline="central">plusieurs personnes ou choses</text></g>
<line x1="274" y1="191" x2="310" y2="191" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="316" y="174" width="70" height="34" rx="6" stroke-width="0.5"/><text class="th" x="351" y="191" text-anchor="middle" dominant-baseline="central">they</text></g>
<text class="t" x="400" y="182" text-anchor="start" dominant-baseline="central">I love my shoes. They are new.</text>
<text class="ts" x="400" y="200" text-anchor="start" dominant-baseline="central">(J'aime mes chaussures. Elles sont neuves.)</text>
<text class="ts" x="20" y="224" text-anchor="start" dominant-baseline="central">Les objets n'ont pas de genre en anglais : the car, the table, the sun → it.</text>
<text class="th" x="20" y="260" text-anchor="start" dominant-baseline="central">2. Où placer le pronom complément ?</text>
<text class="ts" x="20" y="300" text-anchor="start" dominant-baseline="central">français</text>
<g class="c-blue"><rect x="130" y="282" width="80" height="36" rx="6" stroke-width="0.5"/><text class="t" x="170" y="300" text-anchor="middle" dominant-baseline="central">je</text></g>
<g class="c-coral"><rect x="220" y="282" width="80" height="36" rx="6" stroke-width="0.5"/><text class="t" x="260" y="300" text-anchor="middle" dominant-baseline="central">l'</text></g>
<g class="c-gray"><rect x="310" y="282" width="100" height="36" rx="6" stroke-width="0.5"/><text class="t" x="360" y="300" text-anchor="middle" dominant-baseline="central">aime</text></g>
<text class="ts" x="500" y="300" text-anchor="start" dominant-baseline="central">complément AVANT</text>
<text class="ts" x="20" y="348" text-anchor="start" dominant-baseline="central">anglais</text>
<g class="c-blue"><rect x="130" y="330" width="80" height="36" rx="6" stroke-width="0.5"/><text class="t" x="170" y="348" text-anchor="middle" dominant-baseline="central">I</text></g>
<g class="c-gray"><rect x="220" y="330" width="100" height="36" rx="6" stroke-width="0.5"/><text class="t" x="270" y="348" text-anchor="middle" dominant-baseline="central">like</text></g>
<g class="c-coral"><rect x="330" y="330" width="80" height="36" rx="6" stroke-width="0.5"/><text class="t" x="370" y="348" text-anchor="middle" dominant-baseline="central">him</text></g>
<text class="ts" x="500" y="348" text-anchor="start" dominant-baseline="central">complément APRÈS</text>
<text class="ts" x="20" y="382" text-anchor="start" dominant-baseline="central">Bleu : sujet. Corail : pronom complément. Gris : le verbe. Jamais « I him like ».</text>
</svg>
