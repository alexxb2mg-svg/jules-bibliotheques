<svg width="100%" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tableau : pour quatre pays anglophones, un espace naturel protégé et une énergie renouvelable très développée">
<g class="c-green"><text class="th" x="297" y="22" text-anchor="middle" dominant-baseline="central">Espace naturel protégé</text></g>
<g class="c-teal"><text class="th" x="546" y="22" text-anchor="middle" dominant-baseline="central">Énergie renouvelable phare</text></g>
<text class="th" x="20" y="70" text-anchor="start" dominant-baseline="central">États-Unis</text>
<g class="c-green"><rect x="136" y="42" width="322" height="56" rx="6" stroke-width="0.5"/><text class="th" x="297" y="60" text-anchor="middle" dominant-baseline="central">Yellowstone</text><text class="ts" x="297" y="80" text-anchor="middle" dominant-baseline="central">1872 : 1er parc national du monde</text></g>
<g class="c-teal"><rect x="468" y="42" width="192" height="56" rx="6" stroke-width="0.5"/><text class="th" x="564" y="60" text-anchor="middle" dominant-baseline="central">éolien</text><text class="ts" x="564" y="80" text-anchor="middle" dominant-baseline="central">wind : le Texas en tête</text></g>
<text class="th" x="20" y="136" text-anchor="start" dominant-baseline="central">Canada</text>
<g class="c-green"><rect x="136" y="108" width="322" height="56" rx="6" stroke-width="0.5"/><text class="th" x="297" y="126" text-anchor="middle" dominant-baseline="central">Banff</text><text class="ts" x="297" y="146" text-anchor="middle" dominant-baseline="central">1885 : 1er parc national du Canada</text></g>
<g class="c-teal"><rect x="468" y="108" width="192" height="56" rx="6" stroke-width="0.5"/><text class="th" x="564" y="126" text-anchor="middle" dominant-baseline="central">hydroélectricité</text><text class="ts" x="564" y="146" text-anchor="middle" dominant-baseline="central">hydro : grâce aux barrages</text></g>
<text class="th" x="20" y="202" text-anchor="start" dominant-baseline="central">Royaume-Uni</text>
<g class="c-green"><rect x="136" y="174" width="322" height="56" rx="6" stroke-width="0.5"/><text class="th" x="297" y="192" text-anchor="middle" dominant-baseline="central">Peak District</text><text class="ts" x="297" y="212" text-anchor="middle" dominant-baseline="central">1951 : 1er parc national britannique</text></g>
<g class="c-teal"><rect x="468" y="174" width="192" height="56" rx="6" stroke-width="0.5"/><text class="th" x="564" y="192" text-anchor="middle" dominant-baseline="central">éolien en mer</text><text class="ts" x="564" y="212" text-anchor="middle" dominant-baseline="central">offshore wind</text></g>
<text class="th" x="20" y="268" text-anchor="start" dominant-baseline="central">Australie</text>
<g class="c-green"><rect x="136" y="240" width="322" height="56" rx="6" stroke-width="0.5"/><text class="th" x="297" y="258" text-anchor="middle" dominant-baseline="central">Grande Barrière de corail</text><text class="ts" x="297" y="278" text-anchor="middle" dominant-baseline="central">patrimoine mondial UNESCO (1981)</text></g>
<g class="c-teal"><rect x="468" y="240" width="192" height="56" rx="6" stroke-width="0.5"/><text class="th" x="564" y="258" text-anchor="middle" dominant-baseline="central">solaire</text><text class="ts" x="564" y="278" text-anchor="middle" dominant-baseline="central">solar : panneaux sur les toits</text></g>
<text class="ts" x="20" y="322" text-anchor="start" dominant-baseline="central">Au Canada, les barrages produisent plus de la moitié de l'électricité. Un exemple par pays, parmi d'autres.</text>
</svg>
