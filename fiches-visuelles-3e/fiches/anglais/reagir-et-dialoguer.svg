<svg width="100%" viewBox="0 0 680 416" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="20" y="16" dominant-baseline="central">A</text>
<text class="th" x="660" y="16" text-anchor="end" dominant-baseline="central">B</text>

<g class="node c-blue"><rect x="20" y="30" width="400" height="62" rx="14" stroke-width="0.5"/>
<text class="t" x="36" y="51" dominant-baseline="central">What did you do last weekend?</text>
<text class="ts" x="36" y="73" dominant-baseline="central">(Qu'as-tu fait le week-end dernier ?)</text></g>
<text class="th" x="440" y="52" dominant-baseline="central">1. Question</text>
<text class="ts" x="440" y="72" dominant-baseline="central">mot interrogatif : what</text>

<g class="node c-teal"><rect x="260" y="108" width="400" height="96" rx="14" stroke-width="0.5"/>
<text class="t" x="276" y="128" dominant-baseline="central">I went to the cinema with my cousin.</text>
<text class="t" x="276" y="148" dominant-baseline="central">It was great! And you?</text>
<text class="ts" x="276" y="170" dominant-baseline="central">(Je suis allé au cinéma avec mon cousin.</text>
<text class="ts" x="276" y="186" dominant-baseline="central">C'était génial ! Et toi ?)</text></g>
<text class="th" x="240" y="128" text-anchor="end" dominant-baseline="central">2. Répondre,</text>
<text class="th" x="240" y="148" text-anchor="end" dominant-baseline="central">réagir, relancer</text>
<text class="ts" x="240" y="168" text-anchor="end" dominant-baseline="central">fait + émotion + question</text>

<g class="node c-blue"><rect x="20" y="220" width="400" height="62" rx="14" stroke-width="0.5"/>
<text class="t" x="36" y="241" dominant-baseline="central">I stayed at home. I was ill.</text>
<text class="ts" x="36" y="263" dominant-baseline="central">(Je suis resté chez moi. J'étais malade.)</text></g>
<text class="th" x="440" y="242" dominant-baseline="central">3. Répondre</text>
<text class="ts" x="440" y="262" dominant-baseline="central">à la question retournée</text>

<g class="node c-teal"><rect x="260" y="298" width="400" height="62" rx="14" stroke-width="0.5"/>
<text class="t" x="276" y="319" dominant-baseline="central">Oh no! Are you better now?</text>
<text class="ts" x="276" y="341" dominant-baseline="central">(Oh non ! Tu vas mieux maintenant ?)</text></g>
<text class="th" x="240" y="320" text-anchor="end" dominant-baseline="central">4. Réagir, relancer</text>
<text class="ts" x="240" y="340" text-anchor="end" dominant-baseline="central">émotion + question</text>

<text class="ts" x="340" y="394" text-anchor="middle" dominant-baseline="central">Bleu = ce que dit A ; vert = ce que dit B. B répond, réagit et relance.</text>
</svg>
