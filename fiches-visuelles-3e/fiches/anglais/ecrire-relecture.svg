<text class="ts" x="597" y="132" text-anchor="middle" dominant-baseline="central">have devient has</text>

<g class="node c-coral"><rect x="20" y="173" width="200" height="56" rx="6" stroke-width="0.5"/><text class="t" x="120" y="201" text-anchor="middle" dominant-baseline="central">He don't like tea.</text></g>
