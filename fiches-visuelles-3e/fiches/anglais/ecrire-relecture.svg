<text class="ts" x="597" y="55" text-anchor="middle" dominant-baseline="central">-s à la 3e pers.</text><text class="ts" x="597" y="71" text-anchor="middle" dominant-baseline="central">du singulier</text>

<g class="node c-coral"><rect x="20" y="104" width="200" height="56" rx="6" stroke-width="0.5"/><text class="t" x="120" y="132" text-anchor="middle" dominant-baseline="central">She have a dog.</text></g>
