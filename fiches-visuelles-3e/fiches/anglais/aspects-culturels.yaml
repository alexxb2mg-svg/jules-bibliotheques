  - id: schema
    type: schema
    titre: "Royaume-Uni, Grande-Bretagne, Angleterre : qui contient quoi ?"
    svg: "aspects-culturels.svg"
    jules: "La **Grande-Bretagne** est une île (Angleterre, Écosse, pays de Galles) ; le **Royaume-Uni** est un État qui ajoute l'Irlande du Nord. L'Irlande (capitale Dublin) est un autre État."

  - id: schema-monde
    type: schema
    titre: "Carte simplifiée : quelques pays où l'on parle anglais"
    svg: "aspects-culturels-monde.svg"
    jules: "Dans beaucoup de pays, l'anglais est une **langue officielle parmi d'autres** : en Inde, il sert souvent de langue commune entre des personnes dont les langues maternelles diffèrent."

  - id: schema-fetes
    type: schema
    titre: "Une année de fêtes dans le monde anglophone"
    svg: "aspects-culturels-fetes.svg"
    jules: "Le Canada fête aussi Thanksgiving, mais le **deuxième lundi d'octobre** et non en novembre : une même fête n'a pas forcément la même date d'un pays anglophone à l'autre."

  - id: methode
    type: methode
    etapes:
      - "Face à une affirmation sur un pays (« all the British... »), se demander si elle décrit vraiment toute la population ou seulement une **image simplifiée**."
      - "Chercher des informations vérifiées (géographie, institutions, société) plutôt que se fier aux clichés entendus."
      - "Comparer avec la France : qu'est-ce qui se ressemble, qu'est-ce qui diffère ? (Bonfire Night le 5 novembre, un peu comme nos feux d'artifice du 14 Juillet.)"
      - "Mobiliser ces **références culturelles** pour comprendre un document : une fête, un lieu ou un personnage cité sans explication."
    jules: "Méfie-toi des mots « all », « always », « never » (tous, toujours, jamais) : ils signalent souvent une **généralisation** abusive."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'un **stéréotype** décrit toute la population : « Tous les Anglais boivent du thé à 17 h », « Tous les Américains mangent des hamburgers »."
    pourquoi_faux: "Un stéréotype est une image simplifiée et généralisée d'un groupe. Le thé est très populaire au Royaume-Uni, mais les habitudes varient selon les personnes, les régions, les âges et les origines."
    bonne_idee: "Nuancer avec des mots comme many (beaucoup de), some (certains), often (souvent) : « Many British people drink tea. » (Beaucoup de Britanniques boivent du thé.)"
    jules: "Autre confusion fréquente : dire England (l'Angleterre) pour parler de tout le **United Kingdom**. Un Écossais ou un Gallois ne se dit pas English."

  - id: exemple
    type: exemple
    situation: "Présenter le Royaume-Uni en trois phrases à un correspondant, sans le confondre avec l'Angleterre."
    calcul: "« The United Kingdom is made up of four nations: England, Scotland, Wales and Northern Ireland. (Le Royaume-Uni est composé de quatre nations : l'Angleterre, l'Écosse, le pays de Galles et l'Irlande du Nord.) Its capital is London. (Sa capitale est Londres.) In Scotland, people celebrate Burns Night on 25 January. (En Écosse, on fête la Burns Night le 25 janvier.) »"
    conclusion: "La présentation est juste : « the English » ne désigne que les habitants de l'Angleterre ; pour tout le pays, on dit **the British** (les Britanniques)."
    jules: "Burns Night rend hommage au poète écossais **Robert Burns** : une référence précise vaut mieux qu'un cliché sur les kilts."

