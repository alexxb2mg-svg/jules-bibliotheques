<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tableau : les classes de la 6e à la 2de en France, et leurs équivalents par âge en Angleterre et aux États-Unis">
<g class="c-blue"><text class="th" x="215.0" y="26" text-anchor="middle" dominant-baseline="central">France</text></g>
<g class="c-coral"><text class="th" x="399.0" y="26" text-anchor="middle" dominant-baseline="central">Angleterre</text></g>
<g class="c-green"><text class="th" x="579.0" y="26" text-anchor="middle" dominant-baseline="central">États-Unis</text></g>
<text class="th" x="20" y="70" text-anchor="start" dominant-baseline="central">11-12 ans</text>
<g class="c-blue"><rect x="130" y="46" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="215.0" y="62" text-anchor="middle" dominant-baseline="central">6e</text><text class="ts" x="215.0" y="80" text-anchor="middle" dominant-baseline="central">collège</text></g>
<g class="c-coral"><rect x="314" y="46" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="399.0" y="62" text-anchor="middle" dominant-baseline="central">Year 7</text><text class="ts" x="399.0" y="80" text-anchor="middle" dominant-baseline="central">secondary school</text></g>
<g class="c-green"><rect x="498" y="46" width="162" height="48" rx="6" stroke-width="0.5"/><text class="th" x="579.0" y="62" text-anchor="middle" dominant-baseline="central">6th grade</text><text class="ts" x="579.0" y="80" text-anchor="middle" dominant-baseline="central">middle school</text></g>
<text class="th" x="20" y="126" text-anchor="start" dominant-baseline="central">12-13 ans</text>
<g class="c-blue"><rect x="130" y="102" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="215.0" y="118" text-anchor="middle" dominant-baseline="central">5e</text><text class="ts" x="215.0" y="136" text-anchor="middle" dominant-baseline="central">collège</text></g>
<g class="c-coral"><rect x="314" y="102" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="399.0" y="118" text-anchor="middle" dominant-baseline="central">Year 8</text><text class="ts" x="399.0" y="136" text-anchor="middle" dominant-baseline="central">secondary school</text></g>
<g class="c-green"><rect x="498" y="102" width="162" height="48" rx="6" stroke-width="0.5"/><text class="th" x="579.0" y="118" text-anchor="middle" dominant-baseline="central">7th grade</text><text class="ts" x="579.0" y="136" text-anchor="middle" dominant-baseline="central">middle school</text></g>
<text class="th" x="20" y="182" text-anchor="start" dominant-baseline="central">13-14 ans</text>
<g class="c-blue"><rect x="130" y="158" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="215.0" y="174" text-anchor="middle" dominant-baseline="central">4e</text><text class="ts" x="215.0" y="192" text-anchor="middle" dominant-baseline="central">collège</text></g>
<g class="c-coral"><rect x="314" y="158" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="399.0" y="174" text-anchor="middle" dominant-baseline="central">Year 9</text><text class="ts" x="399.0" y="192" text-anchor="middle" dominant-baseline="central">secondary school</text></g>
<g class="c-green"><rect x="498" y="158" width="162" height="48" rx="6" stroke-width="0.5"/><text class="th" x="579.0" y="174" text-anchor="middle" dominant-baseline="central">8th grade</text><text class="ts" x="579.0" y="192" text-anchor="middle" dominant-baseline="central">middle school</text></g>
<text class="th" x="20" y="238" text-anchor="start" dominant-baseline="central">14-15 ans</text>
<g class="c-blue"><rect x="130" y="214" width="170" height="48" rx="6" stroke-width="2"/><text class="th" x="215.0" y="230" text-anchor="middle" dominant-baseline="central">3e</text><text class="ts" x="215.0" y="248" text-anchor="middle" dominant-baseline="central">collège, brevet</text></g>
<g class="c-coral"><rect x="314" y="214" width="170" height="48" rx="6" stroke-width="2"/><text class="th" x="399.0" y="230" text-anchor="middle" dominant-baseline="central">Year 10</text><text class="ts" x="399.0" y="248" text-anchor="middle" dominant-baseline="central">secondary school</text></g>
<g class="c-green"><rect x="498" y="214" width="162" height="48" rx="6" stroke-width="2"/><text class="th" x="579.0" y="230" text-anchor="middle" dominant-baseline="central">9th grade</text><text class="ts" x="579.0" y="248" text-anchor="middle" dominant-baseline="central">high school</text></g>
<text class="th" x="20" y="294" text-anchor="start" dominant-baseline="central">15-16 ans</text>
<g class="c-blue"><rect x="130" y="270" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="215.0" y="286" text-anchor="middle" dominant-baseline="central">2de</text><text class="ts" x="215.0" y="304" text-anchor="middle" dominant-baseline="central">lycée</text></g>
<g class="c-coral"><rect x="314" y="270" width="170" height="48" rx="6" stroke-width="0.5"/><text class="th" x="399.0" y="286" text-anchor="middle" dominant-baseline="central">Year 11</text><text class="ts" x="399.0" y="304" text-anchor="middle" dominant-baseline="central">GCSE en fin d'année</text></g>
<g class="c-green"><rect x="498" y="270" width="162" height="48" rx="6" stroke-width="0.5"/><text class="th" x="579.0" y="286" text-anchor="middle" dominant-baseline="central">10th grade</text><text class="ts" x="579.0" y="304" text-anchor="middle" dominant-baseline="central">high school</text></g>
<text class="ts" x="20" y="344" text-anchor="start" dominant-baseline="central">Cadre épais : la classe de 3e et ses équivalents, au même âge.</text>
<text class="ts" x="20" y="366" text-anchor="start" dominant-baseline="central">Royaume-Uni : ce tableau vaut pour l'Angleterre ; l'Écosse a son propre système (S1 à S6).</text>
<text class="ts" x="20" y="388" text-anchor="start" dominant-baseline="central">États-Unis : l'organisation varie selon les États et les villes ; ici, le cas le plus courant.</text>
</svg>
