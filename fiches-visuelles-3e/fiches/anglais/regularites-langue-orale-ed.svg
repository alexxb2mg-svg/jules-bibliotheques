<svg width="100%" viewBox="0 0 680 386" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prononciation de la terminaison -ed : /t/ après un son sourd, /d/ après un son sonore, /ɪd/ après /t/ ou /d/">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="160" y="8" width="360" height="36" rx="8" stroke-width="0.5"/><text class="t" x="340" y="26" text-anchor="middle" dominant-baseline="central">Quel est le dernier son de la base verbale ?</text></g>
<line x1="340" y1="46" x2="120" y2="70" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="20" y="74" width="200" height="48" rx="8" stroke-width="0.5"/><text class="th" x="120" y="89" text-anchor="middle" dominant-baseline="central">/t/ ou /d/</text><text class="ts" x="120" y="107" text-anchor="middle" dominant-baseline="central">→ se dit /ɪd/</text></g>
<g class="c-coral"><rect x="20" y="134" width="200" height="44" rx="8" stroke-width="0.5"/><text class="t" x="120" y="147" text-anchor="middle" dominant-baseline="central">want → wanted</text><text class="ts" x="120" y="165" text-anchor="middle" dominant-baseline="central">/ˈwɒntɪd/ · vouloir</text></g>
<g class="c-coral"><rect x="20" y="186" width="200" height="44" rx="8" stroke-width="0.5"/><text class="t" x="120" y="199" text-anchor="middle" dominant-baseline="central">need → needed</text><text class="ts" x="120" y="217" text-anchor="middle" dominant-baseline="central">/ˈniːdɪd/ · avoir besoin</text></g>
<g class="c-coral"><rect x="20" y="238" width="200" height="44" rx="8" stroke-width="0.5"/><text class="t" x="120" y="251" text-anchor="middle" dominant-baseline="central">decide → decided</text><text class="ts" x="120" y="269" text-anchor="middle" dominant-baseline="central">/dɪˈsaɪdɪd/ · décider</text></g>
<g class="c-coral"><text class="ts" x="120" y="296" text-anchor="middle" dominant-baseline="central">une syllabe en plus</text></g>
<line x1="340" y1="46" x2="340" y2="70" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="240" y="74" width="200" height="48" rx="8" stroke-width="0.5"/><text class="th" x="340" y="89" text-anchor="middle" dominant-baseline="central">son sourd</text><text class="ts" x="340" y="107" text-anchor="middle" dominant-baseline="central">p, k, f, s, ch, sh → /t/</text></g>
<g class="c-blue"><rect x="240" y="134" width="200" height="44" rx="8" stroke-width="0.5"/><text class="t" x="340" y="147" text-anchor="middle" dominant-baseline="central">work → worked</text><text class="ts" x="340" y="165" text-anchor="middle" dominant-baseline="central">/wɜːkt/ · travailler</text></g>
<g class="c-blue"><rect x="240" y="186" width="200" height="44" rx="8" stroke-width="0.5"/><text class="t" x="340" y="199" text-anchor="middle" dominant-baseline="central">stop → stopped</text><text class="ts" x="340" y="217" text-anchor="middle" dominant-baseline="central">/stɒpt/ · arrêter</text></g>
<g class="c-blue"><rect x="240" y="238" width="200" height="44" rx="8" stroke-width="0.5"/><text class="t" x="340" y="251" text-anchor="middle" dominant-baseline="central">watch → watched</text><text class="ts" x="340" y="269" text-anchor="middle" dominant-baseline="central">/wɒtʃt/ · regarder</text></g>
<g class="c-blue"><text class="ts" x="340" y="296" text-anchor="middle" dominant-baseline="central">pas de syllabe en plus</text></g>
<line x1="340" y1="46" x2="560" y2="70" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="460" y="74" width="200" height="48" rx="8" stroke-width="0.5"/><text class="th" x="560" y="89" text-anchor="middle" dominant-baseline="central">son sonore, voyelle</text><text class="ts" x="560" y="107" text-anchor="middle" dominant-baseline="central">b, g, v, z, l, m, n… → /d/</text></g>
<g class="c-blue"><rect x="460" y="134" width="200" height="44" rx="8" stroke-width="0.5"/><text class="t" x="560" y="147" text-anchor="middle" dominant-baseline="central">play → played</text><text class="ts" x="560" y="165" text-anchor="middle" dominant-baseline="central">/pleɪd/ · jouer</text></g>
<g class="c-blue"><rect x="460" y="186" width="200" height="44" rx="8" stroke-width="0.5"/><text class="t" x="560" y="199" text-anchor="middle" dominant-baseline="central">live → lived</text><text class="ts" x="560" y="217" text-anchor="middle" dominant-baseline="central">/lɪvd/ · vivre, habiter</text></g>
<g class="c-blue"><rect x="460" y="238" width="200" height="44" rx="8" stroke-width="0.5"/><text class="t" x="560" y="251" text-anchor="middle" dominant-baseline="central">call → called</text><text class="ts" x="560" y="269" text-anchor="middle" dominant-baseline="central">/kɔːld/ · appeler</text></g>
<g class="c-blue"><text class="ts" x="560" y="296" text-anchor="middle" dominant-baseline="central">pas de syllabe en plus</text></g>
<text class="ts" x="20" y="328" text-anchor="start" dominant-baseline="central">Son sourd : la gorge ne vibre pas (pose la main sur ton cou pour le sentir). Son sonore : elle vibre.</text>
<text class="ts" x="20" y="350" text-anchor="start" dominant-baseline="central">Même logique pour le -s : cats /s/, dogs /z/, buses /ɪz/.</text>
<text class="ts" x="20" y="372" text-anchor="start" dominant-baseline="central">Corail : on ajoute une syllabe. Bleu : pas de syllabe en plus, le mot garde son nombre de syllabes.</text>
</svg>
