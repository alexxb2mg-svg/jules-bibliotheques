<text class="t" x="90" y="139" text-anchor="middle" dominant-baseline="central">house</text>
<text class="ts" x="90" y="156" text-anchor="middle" dominant-baseline="central">(maison)</text>
<g class="c-gray"><rect x="220" y="132" width="60" height="32" rx="8" stroke-width="0.5"/><text class="t" x="250" y="148" text-anchor="middle" dominant-baseline="central">h</text></g>
<g class="c-blue"><rect x="320" y="132" width="120" height="32" rx="8" stroke-width="0.5"/><text class="t" x="380" y="148" text-anchor="middle" dominant-baseline="central">/h/ consonne</text></g>
<line x1="446" y1="148" x2="486" y2="148" class="arr" marker-end="url(#arrow)"/>
