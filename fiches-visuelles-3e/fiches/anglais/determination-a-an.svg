<g class="c-coral"><rect x="320" y="224" width="120" height="32" rx="8" stroke-width="0.5"/><text class="t" x="380" y="240" text-anchor="middle" dominant-baseline="central">/ʌ/ voyelle</text></g>
<line x1="446" y1="240" x2="486" y2="240" class="arr" marker-end="url(#arrow)"/>
