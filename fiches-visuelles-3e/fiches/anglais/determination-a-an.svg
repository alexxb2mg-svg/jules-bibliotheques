<svg width="100%" viewBox="0 0 680 356" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="a ou an selon le premier son du mot : a book, an apple, an hour, a university, an umbrella, a house">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="90" y="18" text-anchor="middle" dominant-baseline="central">le mot</text>
<text class="th" x="250" y="18" text-anchor="middle" dominant-baseline="central">1re lettre</text>
