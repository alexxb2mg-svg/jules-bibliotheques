<g class="c-blue"><rect x="320" y="40" width="120" height="32" rx="8" stroke-width="0.5"/><text class="t" x="380" y="56" text-anchor="middle" dominant-baseline="central">/b/ consonne</text></g>
<line x1="446" y1="56" x2="486" y2="56" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="492" y="40" width="136" height="32" rx="8" stroke-width="0.5"/><text class="th" x="560" y="56" text-anchor="middle" dominant-baseline="central">a book</text></g>
