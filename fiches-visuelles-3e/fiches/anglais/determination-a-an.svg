<g class="c-blue"><rect x="320" y="270" width="120" height="32" rx="8" stroke-width="0.5"/><text class="t" x="380" y="286" text-anchor="middle" dominant-baseline="central">/j/ consonne</text></g>
<line x1="446" y1="286" x2="486" y2="286" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="492" y="270" width="136" height="32" rx="8" stroke-width="0.5"/><text class="th" x="560" y="286" text-anchor="middle" dominant-baseline="central">a university</text></g>
<text class="ts" x="20" y="320" text-anchor="start" dominant-baseline="central">Bleu : son consonne → a. Corail : son voyelle → an.</text>
<text class="ts" x="20" y="340" text-anchor="start" dominant-baseline="central">hour : le h est muet. university : le u se dit /juː/ comme you, et ce /j/ compte comme une consonne.</text>
