<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="177" y="16" text-anchor="middle" dominant-baseline="central">Garder le fil de l'échange</text>
<text class="th" x="503" y="16" text-anchor="middle" dominant-baseline="central">Réagir, donner son avis</text>

<g class="node c-blue"><rect x="20" y="32" width="315" height="126" rx="10" stroke-width="0.5"/>
<text class="th" x="36" y="52" dominant-baseline="central">Faire répéter</text>
<text class="t" x="36" y="78" dominant-baseline="central">Sorry, can you repeat, please?</text>
<text class="ts" x="36" y="96" dominant-baseline="central">(Pardon, tu peux répéter, s'il te plaît ?)</text>
<text class="t" x="36" y="122" dominant-baseline="central">Could you say that again?</text>
<text class="ts" x="36" y="140" dominant-baseline="central">(Pourrais-tu redire cela ?)</text></g>

<g class="node c-blue"><rect x="20" y="168" width="315" height="126" rx="10" stroke-width="0.5"/>
<text class="th" x="36" y="188" dominant-baseline="central">Faire préciser</text>
<text class="t" x="36" y="214" dominant-baseline="central">What do you mean?</text>
<text class="ts" x="36" y="232" dominant-baseline="central">(Qu'est-ce que tu veux dire ?)</text>
<text class="t" x="36" y="258" dominant-baseline="central">How do you say ... in English?</text>
<text class="ts" x="36" y="276" dominant-baseline="central">(Comment dit-on ... en anglais ?)</text></g>

<g class="node c-blue"><rect x="20" y="304" width="315" height="126" rx="10" stroke-width="0.5"/>
<text class="th" x="36" y="324" dominant-baseline="central">Gagner du temps</text>
<text class="t" x="36" y="350" dominant-baseline="central">Well, ...</text>
<text class="ts" x="36" y="368" dominant-baseline="central">(Eh bien, ...)</text>
<text class="t" x="36" y="394" dominant-baseline="central">Let me think.</text>
<text class="ts" x="36" y="412" dominant-baseline="central">(Laisse-moi réfléchir.)</text></g>

<g class="node c-teal"><rect x="345" y="32" width="315" height="126" rx="10" stroke-width="0.5"/>
<text class="th" x="361" y="52" dominant-baseline="central">Donner son avis</text>
<text class="t" x="361" y="78" dominant-baseline="central">I think that...</text>
<text class="ts" x="361" y="96" dominant-baseline="central">(Je pense que...)</text>
<text class="t" x="361" y="122" dominant-baseline="central">In my opinion, ...</text>
<text class="ts" x="361" y="140" dominant-baseline="central">(À mon avis, ...)</text></g>

<g class="node c-teal"><rect x="345" y="168" width="315" height="126" rx="10" stroke-width="0.5"/>
<text class="th" x="361" y="188" dominant-baseline="central">Être d'accord</text>
<text class="t" x="361" y="214" dominant-baseline="central">I agree (with you).</text>
<text class="ts" x="361" y="232" dominant-baseline="central">(Je suis d'accord avec toi.)</text>
<text class="t" x="361" y="258" dominant-baseline="central">You're right.</text>
<text class="ts" x="361" y="276" dominant-baseline="central">(Tu as raison.)</text></g>

<g class="node c-teal"><rect x="345" y="304" width="315" height="126" rx="10" stroke-width="0.5"/>
<text class="th" x="361" y="324" dominant-baseline="central">Ne pas être d'accord</text>
<text class="t" x="361" y="350" dominant-baseline="central">I don't think so.</text>
<text class="ts" x="361" y="368" dominant-baseline="central">(Je ne crois pas.)</text>
<text class="t" x="361" y="394" dominant-baseline="central">I disagree.</text>
<text class="ts" x="361" y="412" dominant-baseline="central">(Je ne suis pas d'accord.)</text></g>
</svg>
