    jules: "L'anglais est parlé sur tous les continents : Royaume-Uni, États-Unis, Canada, Australie, Nouvelle-Zélande, Irlande, Afrique du Sud, Inde, Jamaïque… Chaque pays a son **histoire** et ses **paysages** propres."

  - id: schema-climats
    type: schema
    titre: "Des climats très différents d'un pays anglophone à l'autre"
    svg: "theme-rencontres-autres-cultures.svg"
    jules: "Le climat dépend surtout de la **latitude** : le nord du Canada est polaire, le nord de l'Australie tropical. Deux pays qui parlent la même langue peuvent avoir des paysages et des espèces sans rien en commun."

  - id: schema-patrimoine
    type: schema
    titre: "Un espace protégé et une énergie renouvelable phare par pays"
    svg: "theme-rencontres-autres-cultures-patrimoine.svg"
    jules: "Chaque pays développe les **énergies renouvelables** que sa géographie permet : beaucoup de vent en mer autour du Royaume-Uni, de grands fleuves au Canada, beaucoup de soleil en Australie."

  - id: methode
    type: methode
    etapes:
      - "Situer le pays sur une carte : continent, latitude, voisins. C'est ce qui explique son **climat**."
      - "Relier chaque exemple à **un pays précis** : Yellowstone (États-Unis), Banff (Canada), la Grande Barrière de corail (Australie)."
      - "Utiliser le vocabulaire précis : national park (parc national), wildlife (faune sauvage), biodiversity (biodiversité), heritage (patrimoine), wind farm (parc éolien)."
      - "S'appuyer sur des **faits vérifiés** (dates, lieux) et les présenter en anglais au prétérit : « It was created in 1872. » (Il a été créé en 1872.)"
    jules: "Pour une date de création, on emploie le **passif au prétérit** : was + participe passé, comme « was created » (a été créé) ou « was founded » (a été fondé)."

  - id: piege
    type: piege
    mauvaise_idee: "Penser que tous les pays anglophones ont le **même climat** et la même nature que le Royaume-Uni : pluie et prairies."
    pourquoi_faux: "Ils sont répartis sur toute la planète : climat **polaire** au nord du Canada, désert au centre de l'Australie, climat **tropical** en Jamaïque, climat **océanique** au Royaume-Uni."
    bonne_idee: "Décrire le climat et la biodiversité **pays par pays**, et même région par région pour les grands pays (États-Unis, Canada, Australie)."
    jules: "Autre confusion : un **national park** n'est pas un parc de ville. Hyde Park, à Londres, est un **parc urbain** ; Yellowstone est un immense espace naturel protégé, avec geysers et bisons."

  - id: exemple-yellowstone
    type: exemple
    situation: "Le premier parc national du monde a été créé en 1872 aux États-Unis. Le présenter en anglais en deux phrases."
    calcul: "« Yellowstone was the first national park in the world. It was created in 1872. » (Yellowstone a été le premier parc national au monde. Il a été créé en 1872.) « National parks protect nature and wildlife. » (Les parcs nationaux protègent la nature et la faune sauvage.)"
    conclusion: "Un **fait daté** (1872), le **passif** was created, puis le rôle d'un parc national : présenter, dater, expliquer."
    jules: "Yellowstone est surtout situé dans le Wyoming, avec une petite partie dans le Montana et l'Idaho. Son geyser le plus célèbre s'appelle **Old Faithful**."

  - id: exemple-uluru
    type: exemple
    situation: "Inclusion et patrimoine : Uluru, un immense rocher au centre de l'Australie, est un lieu sacré pour les Anangu, un peuple aborigène. Le parc leur a été rendu en 1985."
    calcul: "« Uluru is a sacred site for the Anangu, an Aboriginal people. » (Uluru est un site sacré pour les Anangu, un peuple aborigène.) « Since 2019, visitors have not been allowed to climb it. » (Depuis 2019, les visiteurs n'ont plus le droit de l'escalader.)"
    conclusion: "Respecter la culture des **peuples autochtones** fait partie de la protection du **patrimoine** : Uluru est à la fois naturel et culturel."
    jules: "Avec since (depuis) et une situation qui dure encore, l'anglais emploie le **present perfect** : have + participe passé, ici « have not been allowed »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À retenir : **Yellowstone, 1872**, premier parc national du monde ; des climats du polaire au tropical ; une énergie renouvelable adaptée à chaque pays."
