<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg">
<rect x="20" y="10" width="340" height="450" rx="10" fill="#ffffff" stroke="#888780" stroke-width="1"/>
<g class="node c-amber"><rect x="35" y="25" width="310" height="40" rx="6" stroke-width="0.5"/>
<text class="t" x="50" y="45" dominant-baseline="central">Dear Tom,</text>
<text class="ts" x="200" y="45" dominant-baseline="central">(Cher Tom,)</text></g>
<g class="node c-blue"><rect x="35" y="78" width="310" height="90" rx="6" stroke-width="0.5"/>
<text class="t" x="50" y="96" dominant-baseline="central">Thanks for your email! I'm writing</text>
<text class="t" x="50" y="114" dominant-baseline="central">to tell you about my holidays.</text>
<text class="ts" x="50" y="136" dominant-baseline="central">(Merci pour ton e-mail ! Je t'écris</text>
<text class="ts" x="50" y="152" dominant-baseline="central">pour te parler de mes vacances.)</text></g>
<g class="node c-blue"><rect x="35" y="181" width="310" height="90" rx="6" stroke-width="0.5"/>
<text class="t" x="50" y="199" dominant-baseline="central">First, we went to Scotland. Then,</text>
<text class="t" x="50" y="217" dominant-baseline="central">we visited a famous castle.</text>
<text class="ts" x="50" y="239" dominant-baseline="central">(D'abord, nous sommes allés en Écosse.</text>
<text class="ts" x="50" y="255" dominant-baseline="central">Puis nous avons visité un château célèbre.)</text></g>
<g class="node c-blue"><rect x="35" y="284" width="310" height="90" rx="6" stroke-width="0.5"/>
<text class="t" x="50" y="302" dominant-baseline="central">However, it rained a lot! In short,</text>
<text class="t" x="50" y="320" dominant-baseline="central">it was a great trip. Write soon!</text>
<text class="ts" x="50" y="342" dominant-baseline="central">(Cependant, il a beaucoup plu ! Bref,</text>
<text class="ts" x="50" y="358" dominant-baseline="central">c'était super. Écris-moi vite !)</text></g>
<g class="node c-amber"><rect x="35" y="387" width="310" height="60" rx="6" stroke-width="0.5"/>
<text class="t" x="50" y="406" dominant-baseline="central">Best wishes,</text>
<text class="ts" x="200" y="406" dominant-baseline="central">(Amitiés,)</text>
<text class="t" x="50" y="428" dominant-baseline="central">Léa</text></g>

<line x1="348" y1="45" x2="378" y2="45" class="leader" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<text class="th" x="384" y="38" dominant-baseline="central">Formule d'appel</text>
<text class="ts" x="384" y="56" dominant-baseline="central">Dear... (Cher..., Chère...)</text>
<line x1="348" y1="123" x2="378" y2="123" class="leader" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<text class="th" x="384" y="114" dominant-baseline="central">Paragraphe 1</text>
<text class="ts" x="384" y="132" dominant-baseline="central">remercier, dire pourquoi on écrit</text>
<line x1="348" y1="226" x2="378" y2="226" class="leader" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<text class="th" x="384" y="217" dominant-baseline="central">Paragraphe 2</text>
<text class="ts" x="384" y="235" dominant-baseline="central">développer : first, then, moreover</text>
<line x1="348" y1="329" x2="378" y2="329" class="leader" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<text class="th" x="384" y="320" dominant-baseline="central">Paragraphe 3</text>
<text class="ts" x="384" y="338" dominant-baseline="central">nuancer, conclure : however, in short</text>
<line x1="348" y1="417" x2="378" y2="417" class="leader" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<text class="th" x="384" y="408" dominant-baseline="central">Formule finale + prénom</text>
<text class="ts" x="384" y="426" dominant-baseline="central">Best wishes, Love (Amitiés, Bises)</text>
<text class="ts" x="384" y="452" dominant-baseline="central">Orange = formules ; bleu = paragraphes</text>
</svg>
