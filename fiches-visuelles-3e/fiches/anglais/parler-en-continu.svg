<line x1="497" y1="40" x2="511" y2="40" class="arr" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#fl)"/>

<g class="node c-teal"><rect x="20" y="85" width="145" height="195" rx="8" stroke-width="0.5"/>
<text class="t" x="92" y="108" text-anchor="middle" dominant-baseline="central">Today I'm going</text>
<text class="t" x="92" y="126" text-anchor="middle" dominant-baseline="central">to talk about...</text>
<text class="ts" x="92" y="146" text-anchor="middle" dominant-baseline="central">(Aujourd'hui, je vais</text>
<text class="ts" x="92" y="162" text-anchor="middle" dominant-baseline="central">parler de...)</text>
<text class="t" x="92" y="196" text-anchor="middle" dominant-baseline="central">My topic is...</text>
<text class="ts" x="92" y="216" text-anchor="middle" dominant-baseline="central">(Mon sujet est...)</text></g>
<g class="node c-teal"><rect x="185" y="85" width="145" height="195" rx="8" stroke-width="0.5"/>
<text class="t" x="257" y="108" text-anchor="middle" dominant-baseline="central">First, ...</text>
<text class="ts" x="257" y="128" text-anchor="middle" dominant-baseline="central">(D'abord, ...)</text>
<text class="t" x="257" y="176" text-anchor="middle" dominant-baseline="central">To begin with, ...</text>
<text class="ts" x="257" y="196" text-anchor="middle" dominant-baseline="central">(Pour commencer, ...)</text></g>
<g class="node c-teal"><rect x="350" y="85" width="145" height="195" rx="8" stroke-width="0.5"/>
<text class="t" x="422" y="108" text-anchor="middle" dominant-baseline="central">Then, ...</text>
<text class="ts" x="422" y="128" text-anchor="middle" dominant-baseline="central">(Ensuite, ...)</text>
<text class="t" x="422" y="162" text-anchor="middle" dominant-baseline="central">After that, ...</text>
<text class="ts" x="422" y="182" text-anchor="middle" dominant-baseline="central">(Après cela, ...)</text>
<text class="t" x="422" y="216" text-anchor="middle" dominant-baseline="central">Moreover, ...</text>
<text class="ts" x="422" y="236" text-anchor="middle" dominant-baseline="central">(De plus, ...)</text></g>
<g class="node c-teal"><rect x="515" y="85" width="145" height="195" rx="8" stroke-width="0.5"/>
<text class="t" x="587" y="108" text-anchor="middle" dominant-baseline="central">Finally, ...</text>
<text class="ts" x="587" y="128" text-anchor="middle" dominant-baseline="central">(Enfin, ...)</text>
<text class="t" x="587" y="162" text-anchor="middle" dominant-baseline="central">In conclusion, ...</text>
<text class="ts" x="587" y="182" text-anchor="middle" dominant-baseline="central">(Pour conclure, ...)</text>
<text class="t" x="587" y="216" text-anchor="middle" dominant-baseline="central">Thank you</text>
<text class="t" x="587" y="232" text-anchor="middle" dominant-baseline="central">for listening.</text>
<text class="ts" x="587" y="251" text-anchor="middle" dominant-baseline="central">(Merci de</text>
<text class="ts" x="587" y="265" text-anchor="middle" dominant-baseline="central">votre attention.)</text></g>

<g class="c-gray"><rect x="20" y="294" width="640" height="36" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="312" text-anchor="middle" dominant-baseline="central">Violet = les parties du plan ; vert = les connecteurs. Sur ta fiche : des mots-clés, pas un texte.</text></g>
