<text class="th" x="422" y="32" text-anchor="middle" dominant-baseline="central">Point 2 (et 3)</text>
<text class="ts" x="422" y="50" text-anchor="middle" dominant-baseline="central">idées suivantes</text></g>
<g class="node c-purple"><rect x="515" y="15" width="145" height="50" rx="8" stroke-width="0.5"/>
