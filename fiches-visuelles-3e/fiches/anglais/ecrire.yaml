  - id: schema
    type: schema
    titre: "La structure d'un e-mail ou d'une lettre amicale"
    svg: "ecrire.svg"
    jules: "Dans une lettre formelle (UK), on écrit « Dear Sir or Madam, » puis « Yours faithfully, » ; si l'on connaît le nom (« Dear Mr Smith, »), on finit par « Yours sincerely, »."

  - id: schema-relecture
    type: schema
    titre: "La relecture : cinq erreurs à traquer"
    svg: "ecrire-relecture.svg"
    jules: "Relis une fois rien que pour les verbes : chaque fois que le sujet est he, she, it ou un nom au singulier, vérifie le **-s du présent simple**."

  - id: methode
    type: methode
    etapes:
      - "Faire un **brouillon** rapide : noter les idées en mots-clés, puis les ranger dans un plan (début, développement, fin)."
      - "Rédiger en **paragraphes**, un par idée, reliés par des connecteurs : first (d'abord), moreover (de plus), however (cependant), so (donc), in conclusion (pour conclure)."
      - "Respecter la forme demandée : formule d'appel et formule finale pour une lettre ou un e-mail, titre pour un article."
      - "Relire pour vérifier les accords (-s à la 3e personne du singulier, pluriels), les temps (prétérit pour raconter) et les majuscules."
      - "Remplacer les mots répétés par des synonymes ou des pronoms pour **varier le vocabulaire**."
    jules: "Réutilise les tournures vues en classe : un texte simple et juste vaut mieux qu'une phrase compliquée traduite du français mot à mot."

  - id: piege
    type: piege
    mauvaise_idee: "Écrire « My sister like animals and she have two cats. » sans se relire."
    pourquoi_faux: "Au **présent simple**, le verbe prend un -s quand le sujet est à la 3e personne du singulier (he, she, it, my sister) ; « have » devient « has »."
    bonne_idee: "« My sister likes animals and she has two cats. » (Ma sœur aime les animaux et elle a deux chats.) Relire chaque verbe en regardant son **sujet**."
    jules: "Moyen mnémotechnique : « He, She, It, le S est là. » Au pluriel (they, my sisters), pas de -s au verbe : they like."

  - id: exemple
    type: exemple
    situation: "Écrire un court e-mail à son correspondant anglais, Tom, pour lui raconter son week-end."
    calcul: "« Dear Tom, (Cher Tom,) Last weekend, I went to the beach with my family. (Le week-end dernier, je suis allée à la plage avec ma famille.) First, we swam, then we had a picnic. (D'abord, nous avons nagé, puis nous avons pique-niqué.) However, it rained in the afternoon! (Cependant, il a plu l'après-midi !) Best wishes, Léa (Amitiés, Léa) »"
    conclusion: "Le texte respecte la **forme de l'e-mail** (formule d'appel, formule finale), raconte au **prétérit** (went, swam, had, rained) et s'organise avec des connecteurs (first, then, however)."
    jules: "Swam et had sont des prétérits irréguliers (swim, have) : vérifie-les dans ta liste de verbes irréguliers pendant la relecture."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Garde une liste de tes erreurs habituelles : c'est ta **grille de relecture** personnelle, à passer sur chaque texte avant de le rendre."
