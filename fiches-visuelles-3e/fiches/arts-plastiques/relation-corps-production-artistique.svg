<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Du geste du corps à la captation</text>

<g class="node c-coral">
<rect x="30" y="55" width="190" height="140" rx="10"/>
<text class="th" x="125" y="83" text-anchor="middle">Corps</text>
<text class="ts" x="125" y="110" text-anchor="middle">outil de production</text>
<text class="ts" x="125" y="133" text-anchor="middle">geste large, appuyé</text>
<text class="ts" x="125" y="156" text-anchor="middle">pieds, mains, dos</text>
</g>

<path d="M225,125 L250,125" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche)"/>

<g class="node c-amber">
<rect x="255" y="55" width="190" height="140" rx="10"/>
<text class="th" x="350" y="83" text-anchor="middle">Trace</text>
<text class="ts" x="350" y="110" text-anchor="middle">empreintes, peinture</text>
<text class="ts" x="350" y="133" text-anchor="middle">visible sur la toile</text>
<text class="ts" x="350" y="156" text-anchor="middle">rend le geste lisible</text>
</g>

<path d="M450,125 L475,125" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche)"/>

<g class="node c-teal">
<rect x="480" y="55" width="170" height="140" rx="10"/>
<text class="th" x="565" y="83" text-anchor="middle">Captation</text>
<text class="ts" x="565" y="110" text-anchor="middle">photo, vidéo</text>
<text class="ts" x="565" y="133" text-anchor="middle">conserve l'œuvre</text>
<text class="ts" x="565" y="156" text-anchor="middle">éphémère → durable</text>
</g>

<g class="c-gray">
<rect x="40" y="225" width="600" height="100" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="255" text-anchor="middle" dominant-baseline="central">Performance : le corps devient l'outil ET le sujet de l'œuvre</text>
<text class="ts" x="340" y="280" text-anchor="middle" dominant-baseline="central">Sans captation, une œuvre éphémère disparaît sans laisser de trace</text>
<text class="ts" x="340" y="303" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de principe</text>
</g>
</svg>
