relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: corps, titre: "Corps de l'artiste", sous_titre: "outil et parfois sujet", principal: true}
      - {id: geste, titre: "Geste", sous_titre: "large, rapide, appuyé"}
      - {id: trace, titre: "Trace", sous_titre: "peinture, empreintes"}
      - {id: performance, titre: "Performance", sous_titre: "l'action = l'œuvre"}
      - {id: captation, titre: "Captation", sous_titre: "photo, vidéo"}
    liens:
      - {de: corps, vers: geste}
      - {de: geste, vers: trace}
      - {de: corps, vers: performance}
      - {de: performance, vers: captation}
    jules: "Dans la **performance**, le corps de l'artiste devient à la fois l'outil et le sujet de l'œuvre."

  - id: schema
    type: schema
    titre: "Du geste du corps à la trace, puis à la captation"
    svg: "relation-corps-production-artistique.svg"
    jules: "Une œuvre **éphémère** (performance) disparaît si elle n'est pas captée : la photo ou la vidéo devient alors la trace qui la conserve."

  - id: methode
    type: methode
    etapes:
      - "Décider si le corps intervient seulement dans le geste (peindre) ou devient lui-même le sujet de l'œuvre (performance)."
      - "Choisir une captation (photo, vidéo) si l'œuvre est éphémère et doit être conservée."
      - "Observer les traces laissées par le geste comme des éléments à part entière de l'œuvre."
      - "Vérifier que l'implication du corps sert une intention, pas seulement l'effet spectaculaire."
    jules: "Une trace de pas ou de main n'est pas un accident : elle rend visible le **déplacement** du corps dans le temps et l'espace."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre performance artistique et simple mise en scène sans intention."
    pourquoi_faux: "Une **performance** porte un sens précis, réfléchi par l'artiste : sans intention, ce n'est qu'un spectacle sans portée artistique."
    bonne_idee: "Toujours chercher l'intention derrière l'implication du corps, pas seulement l'effet visuel produit."
    jules: "Autre piège fréquent : négliger de **capter** une œuvre éphémère, qui disparaît alors sans laisser de trace."

  - id: exemple
    type: exemple
    situation: "Un artiste marche pieds nus dans de la peinture puis sur une grande toile posée au sol, laissant des empreintes de pas."
    calcul: "Le corps entier (et pas seulement la main) devient l'instrument de production ; les traces de pas rendent visible le déplacement du corps."
    conclusion: "Le résultat visible sur la toile est la **trace** d'un geste du corps entier, pas seulement d'une main tenant un pinceau."
    jules: "Ce type d'œuvre se lit autant par son **résultat** (la toile) que par le geste qui l'a produite."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "performance, trace, captation", outil: "lexique"}
    jules: "Entraîne-toi : réalise une trace avec une partie du corps autre que la main (pied, coude) trempée dans une peinture lavable, sur un grand papier."
