<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Du numérique outil au numérique matériau</text>

<g class="node c-blue">
<rect x="40" y="55" width="280" height="130" rx="10"/>
<text class="th" x="180" y="83" text-anchor="middle">Simple outil</text>
<text class="ts" x="180" y="110" text-anchor="middle">tablette pour dessiner</text>
<text class="ts" x="180" y="133" text-anchor="middle">remplace le pinceau</text>
<text class="ts" x="180" y="156" text-anchor="middle">l'artiste trace lui-même</text>
</g>

<g class="node c-purple">
<rect x="360" y="55" width="280" height="130" rx="10"/>
<text class="th" x="500" y="83" text-anchor="middle">Véritable matériau</text>
<text class="ts" x="500" y="110" text-anchor="middle">algorithme, capteur</text>
<text class="ts" x="500" y="133" text-anchor="middle">génère la forme</text>
<text class="ts" x="500" y="156" text-anchor="middle">résultat imprévu</text>
</g>

<path d="M320,120 L360,120" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche)"/>

<g class="node c-amber">
<rect x="180" y="215" width="320" height="60" rx="10"/>
<text class="th" x="340" y="240" text-anchor="middle">Coût énergétique</text>
<text class="ts" x="340" y="260" text-anchor="middle">calcul, stockage, impression 3D</text>
</g>

<line x1="180" y1="185" x2="280" y2="215" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="500" y1="185" x2="400" y2="215" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche)"/>

<g class="c-gray">
<rect x="40" y="305" width="600" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="330" text-anchor="middle" dominant-baseline="central">Dialogue entre pratiques traditionnelles et pratiques numériques</text>
<text class="ts" x="340" y="352" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de principe</text>
</g>
</svg>
