notion: experience-sensible-espace-oeuvre
titre: "L'espace de l'œuvre : perçu, ressenti, représenté"
matiere: arts-plastiques
niveau: 3e
auteurs: ["hermes-ap2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-ap2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Installation »", url: "https://fr.vikidia.org/w/index.php?title=Installation&oldid=2570407", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: espace, titre: "Espace de l'œuvre", sous_titre: "trois façons de l'aborder", principal: true}
      - {id: percu, titre: "Espace perçu", sous_titre: "réel, où l'on se déplace"}
      - {id: ressenti, titre: "Espace ressenti", sous_titre: "oppression, calme, ouverture"}
      - {id: represente, titre: "Espace représenté", sous_titre: "suggéré par une image"}
      - {id: sens, titre: "Sens mobilisés", sous_titre: "vue, ouïe, toucher"}
    liens:
      - {de: espace, vers: percu}
      - {de: espace, vers: ressenti}
      - {de: espace, vers: represente}
      - {de: percu, vers: sens}
    jules: "L'espace **représenté** dans une image en deux dimensions est suggéré ; l'espace **perçu** d'une installation est réellement traversé par le corps."

  - id: schema
    type: schema
    titre: "Une installation traversée : vue, ouïe et déplacement"
    svg: "experience-sensible-espace-oeuvre.svg"
    jules: "Certaines œuvres font de l'**espace** et du **temps** eux-mêmes des matériaux : on ne les regarde pas seulement, on les traverse."

  - id: graphe-point-de-vue
    type: graphe
    gabarit: point-de-vue
    curseurs:
      - {id: curseur-hauteur, nom: hauteur, min: -2, max: 2, pas: 1, depart: 0}
      - {id: curseur-taille, nom: taille, min: 0.5, max: 10, pas: 0.5, depart: 3}
      - {id: curseur-distance, nom: distance, min: 5, max: 5, pas: 1, depart: 5}
    lectures:
      - {si: "hauteur == 0", texte: "De face : **frontalité**, l'œuvre se regarde comme un tableau."}
      - {si: "hauteur != 0", texte: "Le point de vue change : le spectateur doit **bouger** pour découvrir l'œuvre."}
      - {si: "taille >= 3", texte: "Plus grande que le corps : on entre **dans** l'œuvre, l'espace devient une expérience."}
    jules: "Regarde la vue de côté : l'œil rouge, c'est toi. En changeant de place, tu ne vois plus la même œuvre, c'est pour cela qu'on en fait le tour."

  - id: methode
    type: methode
    etapes:
      - "Distinguer l'espace réel (où l'on se trouve physiquement) de l'espace suggéré par une image."
      - "Repérer si une œuvre demande un déplacement du spectateur pour être perçue entièrement."
      - "Identifier les sens sollicités au-delà de la vue (toucher, ouïe) si l'œuvre le permet."
      - "Comparer son propre ressenti face à une œuvre à celui d'un camarade, pour voir la part de subjectivité."
    jules: "Le point de vue du **spectateur** (où il se place, comment il se déplace) fait autant partie de l'œuvre que celui de l'auteur."

  - id: piege
    type: piege
    mauvaise_idee: "Juger une installation seulement à partir d'une photo, sans tenir compte du déplacement physique qu'elle demande."
    pourquoi_faux: "Une photo ne montre qu'un seul point de vue fixe : elle ne peut pas rendre le **déplacement**, l'échelle réelle ni les sons éventuels."
    bonne_idee: "Toujours chercher ce que l'expérience réelle (échelle, déplacement, autres sens) apporterait de plus qu'une simple photo."
    jules: "Autre piège : réduire l'expérience d'une œuvre à la seule **vue**, en oubliant les autres sens."

  - id: exemple
    type: exemple
    situation: "Une installation remplit une pièce sombre avec des jeux de lumière changeante et un fond sonore discret."
    calcul: "Le spectateur ne perçoit pas l'œuvre d'un seul point fixe : il doit s'y déplacer, et son expérience mobilise la vue et l'ouïe en même temps."
    conclusion: "Le **ressenti** (calme, inquiétude…) fait partie de l'œuvre autant que sa description technique."
    jules: "Le ressenti face à une œuvre n'est pas **fixe** : il peut varier d'une personne à l'autre, selon l'endroit où l'on se trouve."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "espace perçu, installation", outil: "lexique"}
    jules: "Entraîne-toi : installe un petit objet (lampe, tissu) dans une pièce et observe comment ton ressenti change en te déplaçant autour de lui."
