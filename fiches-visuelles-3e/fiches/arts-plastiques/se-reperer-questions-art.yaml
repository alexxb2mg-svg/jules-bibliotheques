      - {de: reperer, vers: carac}
      - {de: carac, vers: interpret}
      - {de: reperer, vers: debat}
    jules: "Une œuvre se comprend mieux quand on sait d'où elle vient et à quelles questions artistiques elle répond."

  - id: schema
    type: schema
    titre: "Observer une œuvre : de l'indice à l'interprétation"
    svg: "se-reperer-questions-art.svg"
    jules: "Distinguer ce qu'on observe (les touches de couleur) de ce qu'on suppose (l'époque, le mouvement) évite les erreurs de datation."

  - id: methode
    type: methode
    etapes:
      - "Observer d'abord les caractéristiques visibles : matériau, technique, format, couleurs."
      - "Chercher des indices de date ou de lieu (vêtements, objets, style architectural, signature)."
      - "Relier ces indices à un mouvement ou une période déjà rencontrés en cours."
      - "Formuler une interprétation prudente, en distinguant ce qu'on observe de ce qu'on suppose."
    jules: "L'analyse part toujours d'un élément observable : une interprétation sans appui visible reste une simple supposition."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre le sujet représenté (ce que montre l'œuvre) et le mouvement artistique (comment elle le montre)."
    pourquoi_faux: "Deux œuvres qui montrent le même sujet (un paysage) peuvent appartenir à des mouvements très différents selon la **technique** employée."
    bonne_idee: "Regarder la technique (touches, matière, composition) autant que le sujet pour identifier un mouvement."
    jules: "Dater une œuvre uniquement à partir de son sujet, sans regarder la technique, mène souvent à une erreur de période."

  - id: exemple
    type: exemple
    situation: "Une peinture montre des touches de couleur juxtaposées, non mélangées, représentant un paysage en plein air, avec des ombres colorées."
    calcul: "Indices observés : touches visibles non mélangées, peinture réalisée en extérieur, ombres colorées plutôt que grises."
    conclusion: "Ces caractéristiques sont typiques de l'**impressionnisme**, mouvement français de la deuxième moitié du XIXe siècle."
    jules: "Ce sont les mêmes trois indices techniques qui permettent de reconnaître ce mouvement, quel que soit le sujet représenté."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "trois indices pour deviner une période", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "« Je pense que… parce que je vois… » est une bonne structure pour proposer une interprétation appuyée sur un élément précis."
