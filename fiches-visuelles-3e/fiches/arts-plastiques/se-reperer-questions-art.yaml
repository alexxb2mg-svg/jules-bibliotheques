    noeuds:
      - {id: reperer, titre: "Se repérer dans l'art", sous_titre: "domaines, époques, patrimoine", principal: true}
      - {id: carac, titre: "Caractéristiques", sous_titre: "plastiques et culturelles"}
      - {id: interpret, titre: "Interpréter", sous_titre: "auteur et spectateur"}
