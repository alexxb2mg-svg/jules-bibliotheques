generation: {par: "hermes-ap1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Composition picturale »", url: "https://fr.wikipedia.org/w/index.php?title=Composition_picturale&oldid=237458929", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: image, titre: "Statut d'une image", sous_titre: "plastique, iconique, symbolique", principal: true}
      - {id: intention, titre: "Intention", sous_titre: "informer, vendre, questionner"}
      - {id: statut, titre: "Communication ou art", sous_titre: "deux intentions différentes"}
      - {id: reproduction, titre: "Œuvre vs image de l'œuvre", sous_titre: "photo ≠ original"}
    liens:
      - {de: image, vers: intention}
      - {de: intention, vers: statut}
      - {de: image, vers: reproduction}
    jules: "Une image a des propriétés plastiques (comment elle est faite), iconiques (ce qu'elle montre) et symboliques (ce qu'elle évoque au-delà)."

  - id: schema
    type: schema
    titre: "Même sujet, deux intentions différentes"
    svg: "creation-materialite-signification-images.svg"
    jules: "L'image de l'œuvre (sa photo dans un livre) ne montre ni la taille réelle, ni la matière, ni parfois les vraies couleurs."

  - id: methode
    type: methode
    etapes:
      - "Se demander quelle intention semble guider l'image : informer, vendre, questionner, émouvoir ?"
      - "Repérer les propriétés plastiques (couleurs, cadrage, composition) qui servent cette intention."
      - "Se méfier d'une image de l'œuvre vue en reproduction : chercher ses dimensions et sa matière réelles."
      - "Comparer une image artistique et une image de communication sur un même thème pour voir la différence d'intention."
    jules: "Une image de communication visuelle (publicité, signalétique) cherche un message clair et efficace ; une œuvre artistique peut questionner ou troubler."

  - id: piege
    type: piege
    mauvaise_idee: "Juger la taille ou les couleurs d'une œuvre uniquement à partir d'une photo dans un livre."
    pourquoi_faux: "L'image de l'œuvre ne montre ni les dimensions réelles, ni la matière, ni parfois les vraies couleurs de l'original."
    bonne_idee: "Chercher les dimensions réelles et la matière de l'œuvre avant de la juger à partir d'une reproduction."
    jules: "Croire qu'une image publicitaire est automatiquement une œuvre d'art parce qu'elle est bien faite est une autre erreur fréquente."

  - id: exemple
    type: exemple
    situation: "Comparer une affiche publicitaire pour une boisson et un tableau qui représente aussi une table avec des bouteilles (nature morte)."
    calcul: "L'affiche a une intention de communication visuelle : vendre, avec un message clair. La nature morte a une intention artistique : interroger la lumière, la matière, la composition."
    conclusion: "Le même sujet (des bouteilles) sert deux **intentions** très différentes."
    jules: "Ce n'est pas le sujet représenté qui détermine si une image est artistique ou publicitaire, mais l'intention derrière elle."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "comparer pub et œuvre sur un même sujet", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Les dimensions réelles d'une œuvre célèbre sont souvent indiquées sous la reproduction, dans un livre ou un musée en ligne."
