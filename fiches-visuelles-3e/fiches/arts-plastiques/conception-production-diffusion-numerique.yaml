notion: conception-production-diffusion-numerique
titre: "Conception, production et diffusion à l'ère du numérique"
matiere: arts-plastiques
niveau: 3e
auteurs: ["hermes-ap1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-ap1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Arts plastiques »", url: "https://fr.vikidia.org/w/index.php?title=Arts_plastiques&oldid=2072075", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: numerique, titre: "Numérique et création", sous_titre: "créer, montrer, partager", principal: true}
      - {id: creer, titre: "Créer", sous_titre: "tablette, retouche, montage"}
      - {id: melange, titre: "Mélanger", sous_titre: "traditionnel et numérique"}
      - {id: diffuser, titre: "Diffuser", sous_titre: "réseaux, site, exposition en ligne"}
    liens:
      - {de: numerique, vers: creer}
      - {de: creer, vers: melange}
      - {de: numerique, vers: diffuser}
    jules: "La diffusion numérique change la façon dont une œuvre est reçue : elle est vue par beaucoup de monde, mais souvent en basse qualité sur un petit écran."

  - id: schema
    type: schema
    titre: "Du papier au numérique, jusqu'à la diffusion"
    svg: "conception-production-diffusion-numerique.svg"
    jules: "Le passage du papier au numérique (scan, photo) ne doit pas dénaturer l'**intention** artistique de départ."

  - id: methode
    type: methode
    etapes:
      - "Choisir l'outil numérique en fonction de l'effet recherché, pas seulement par facilité."
      - "Si l'œuvre mélange traditionnel et numérique, vérifier que le passage entre les deux ne dénature pas l'intention."
      - "Avant de diffuser une œuvre en ligne, vérifier qu'elle reste lisible en petit format et sur écran."
      - "Respecter les droits d'auteur des images ou sons utilisés dans une création numérique."
    jules: "Un même projet peut mêler des outils traditionnels (peinture, dessin) et des outils numériques (scanner, logiciel, impression)."

  - id: piege
    type: piege
    mauvaise_idee: "Utiliser un filtre ou un effet numérique sans lien avec l'intention artistique."
    pourquoi_faux: "Un effet ajouté sans réflexion peut contredire ou affaiblir ce que l'œuvre cherchait à exprimer au départ."
    bonne_idee: "Choisir chaque effet numérique en se demandant s'il sert vraiment l'intention de départ."
    jules: "Croire qu'une œuvre numérique demande moins de réflexion qu'une œuvre traditionnelle est une autre erreur fréquente."

  - id: exemple
    type: exemple
    situation: "Un élève dessine sur papier, puis scanne son dessin pour ajouter des couleurs numériques avant de le publier sur le site de la classe."
    calcul: "Le scan doit conserver la qualité du trait ; l'ajout de couleur numérique doit servir l'intention de départ."
    conclusion: "Avant publication, il faut vérifier que l'image reste claire une fois réduite pour l'affichage sur le site."
    jules: "Une image très détaillée peut devenir illisible une fois réduite à la taille d'une vignette sur un écran de téléphone."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "modifier un seul réglage et comparer", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Ne change qu'un seul réglage à la fois (contraste, couleur, recadrage) pour bien voir son effet sur l'image."
