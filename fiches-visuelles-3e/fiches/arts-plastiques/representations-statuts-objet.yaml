relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: objet, titre: "Un même objet", sous_titre: "plusieurs statuts possibles", principal: true}
      - {id: quotidien, titre: "Objet non artistique", sous_titre: "vie de tous les jours"}
      - {id: materiel, titre: "Objet matériel", sous_titre: "une fois transformé"}
      - {id: art, titre: "Objet d'art", sous_titre: "exposé et reconnu"}
      - {id: etude, titre: "Objet d'étude", sous_titre: "analysé en classe, en musée"}
    liens:
      - {de: objet, vers: quotidien}
      - {de: objet, vers: materiel}
      - {de: objet, vers: art}
      - {de: objet, vers: etude}
    jules: "Le statut d'un objet ne dépend pas que de sa fabrication : le **contexte** dans lequel il est montré compte tout autant."

  - id: schema
    type: schema
    titre: "Une même chaise, deux contextes, deux statuts"
    svg: "representations-statuts-objet.svg"
    jules: "La chaise en elle-même n'a pas changé : c'est le **lieu** et l'intention de présentation qui font basculer son statut."

  - id: methode
    type: methode
    etapes:
      - "Identifier le contexte de présentation d'un objet avant de juger son statut."
      - "Se demander qui a choisi de le montrer, et pourquoi (usage, mémoire, esthétique, art)."
      - "Comparer le même type d'objet dans deux contextes différents (musée d'histoire, musée d'art)."
      - "Distinguer l'objet matériel (sa matière, sa forme) de son statut (comment il est reçu)."
    jules: "Deux objets physiquement identiques peuvent avoir des statuts très différents selon leur **lieu** de présentation."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que le statut d'objet d'art dépend uniquement de sa beauté."
    pourquoi_faux: "Le statut vient du **contexte** et du regard porté sur l'objet, pas seulement de son apparence esthétique."
    bonne_idee: "Toujours regarder qui présente l'objet, où, et avec quelle intention avant de juger son statut."
    jules: "Autre piège : ne pas distinguer un objet exposé pour sa valeur **historique** d'un objet exposé pour sa valeur artistique."

  - id: exemple
    type: exemple
    situation: "Une vieille chaise en bois est présentée dans un musée d'histoire locale, puis une chaise semblable est exposée dans une galerie d'art contemporain avec un cartel signé par un artiste."
    calcul: "Dans le musée d'histoire, la chaise a un statut d'objet d'étude ou de témoignage d'une époque. Dans la galerie, la même forme d'objet prend un statut d'œuvre d'art."
    conclusion: "Le **contexte** change complètement la réception d'un objet, même si sa forme reste identique."
    jules: "Cherche toujours le cartel ou l'étiquette : c'est souvent lui qui révèle le **statut** attribué à l'objet."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "statut, objet d'étude, cartel", outil: "lexique"}
    jules: "Entraîne-toi : imagine trois contextes différents (musée d'histoire, galerie d'art, vide-grenier) pour un même objet et décris comment son statut changerait."
