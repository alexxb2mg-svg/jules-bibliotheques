<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Le public change de rôle</text>

<g class="node c-blue">
<rect x="40" y="55" width="260" height="120" rx="10"/>
<text class="th" x="170" y="83" text-anchor="middle">Œuvre traditionnelle</text>
<text class="ts" x="170" y="110" text-anchor="middle">un artiste unique</text>
<text class="ts" x="170" y="133" text-anchor="middle">public = récepteur</text>
<text class="ts" x="170" y="156" text-anchor="middle">regarde l'œuvre finie</text>
</g>

<path d="M310,115 L370,115" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche)"/>

<g class="node c-purple">
<rect x="380" y="55" width="260" height="120" rx="10"/>
<text class="th" x="510" y="83" text-anchor="middle">Œuvre numérique collective</text>
<text class="ts" x="510" y="110" text-anchor="middle">règles fixées au départ</text>
<text class="ts" x="510" y="133" text-anchor="middle">public = participant</text>
<text class="ts" x="510" y="156" text-anchor="middle">contribue à la construire</text>
</g>

<g class="c-gray">
<rect x="40" y="205" width="600" height="140" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="235" text-anchor="middle" dominant-baseline="central">Qui est l'auteur quand un programme ou le public participe ?</text>
<text class="ts" x="340" y="262" text-anchor="middle" dominant-baseline="central">L'auteur devient celui qui fixe les règles du dispositif</text>
<text class="ts" x="340" y="287" text-anchor="middle" dominant-baseline="central">Métissage avec les sciences : biologie, robotique, données</text>
<text class="ts" x="340" y="312" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de principe</text>
</g>
</svg>
