<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="flecheq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Du papier au numérique, jusqu'à la diffusion</text>

<g class="node c-blue"><rect x="20" y="60" width="180" height="90" rx="8"/></g>
<text class="t" x="110" y="88" text-anchor="middle">Dessin papier</text>
<text class="ts" x="110" y="108" text-anchor="middle">outil traditionnel</text>
<text class="ts" x="110" y="124" text-anchor="middle">crayon, peinture</text>

<line x1="200" y1="105" x2="245" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#flecheq)"/>

<g class="node c-teal"><rect x="250" y="60" width="180" height="90" rx="8"/></g>
<text class="t" x="340" y="88" text-anchor="middle">Scan ou photo</text>
<text class="ts" x="340" y="108" text-anchor="middle">passage numérique</text>
<text class="ts" x="340" y="124" text-anchor="middle">garder l'intention</text>

<line x1="430" y1="105" x2="475" y2="105" stroke="#374151" stroke-width="2.5" marker-end="url(#flecheq)"/>

<g class="node c-purple"><rect x="480" y="60" width="180" height="90" rx="8"/></g>
<text class="t" x="570" y="88" text-anchor="middle">Diffusion</text>
<text class="ts" x="570" y="108" text-anchor="middle">réseau, site</text>
<text class="ts" x="570" y="124" text-anchor="middle">vérifier lisibilité</text>

<g class="c-gray"><rect x="20" y="180" width="640" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="205" text-anchor="middle" dominant-baseline="central">Vue par beaucoup de monde, mais souvent en basse qualité sur petit écran.</text>
<text class="ts" x="340" y="225" text-anchor="middle" dominant-baseline="central">Choisir l'outil numérique pour l'effet recherché, pas pour la facilité.</text></g>

<g class="c-red"><rect x="20" y="255" width="640" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="278" text-anchor="middle" dominant-baseline="central">Piège fréquent : ajouter un filtre sans lien avec l'intention de départ.</text>
<text class="ts" x="340" y="298" text-anchor="middle" dominant-baseline="central">Chaque effet doit servir l'intention, pas juste « faire joli ».</text></g>
</svg>
