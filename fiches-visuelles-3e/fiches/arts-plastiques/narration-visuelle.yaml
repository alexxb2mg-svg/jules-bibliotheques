notion: narration-visuelle
titre: "La narration visuelle"
matiere: arts-plastiques
niveau: 3e
auteurs: ["hermes-ap1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-ap1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Bande dessinée »", url: "https://fr.vikidia.org/w/index.php?title=Bande_dessin%C3%A9e&oldid=2581894", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
lexique:
  - {terme: "ellipse", definition: "moment de l'histoire volontairement non montré, que le spectateur reconstitue lui-même"}
  - {terme: "dispositif séquentiel", definition: "suite d'images organisées pour raconter une histoire ou un déroulement dans le temps"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: narration, titre: "Narration visuelle", sous_titre: "raconter en images", principal: true}
      - {id: sequentiel, titre: "Dispositif séquentiel", sous_titre: "plusieurs images à la suite"}
      - {id: ellipse, titre: "Ellipse", sous_titre: "un moment sauté volontairement"}
      - {id: unique, titre: "Image unique", sous_titre: "suggérer le mouvement"}
    liens:
      - {de: narration, vers: sequentiel}
      - {de: sequentiel, vers: ellipse}
      - {de: narration, vers: unique}
    jules: "Le montage et le découpage choisissent ce qu'on montre et dans quel ordre : changer l'ordre des images change le sens de l'histoire."

  - id: schema
    type: schema
    titre: "Raconter une histoire en trois images avec une ellipse"
    svg: "narration-visuelle.svg"
    jules: "L'ellipse laisse le spectateur reconstituer lui-même le temps écoulé entre deux images : c'est un choix, pas un oubli."

  - id: graphe-images
    type: graphe
    gabarit: decomposition-mouvement
    curseurs:
      - {id: curseur-images, nom: images, min: 3, max: 24, pas: 1, depart: 6}
      - {id: curseur-vitesse, nom: vitesse, min: 0.25, max: 4, pas: 0.25, depart: 1}
      - {id: curseur-ellipse, nom: ellipse, min: 0, max: 6, pas: 1, depart: 0}
    lectures:
      - {si: "images <= 6", texte: "Peu d'images : le mouvement est **saccadé**, chaque image compte comme une case de BD."}
      - {si: "vitesse < 1", texte: "**Ralenti** : la durée de l'action est étirée à l'écran, on insiste sur le moment."}
      - {si: "vitesse > 1", texte: "**Accéléré** : la durée est compressée, l'action paraît pressée ou comique."}
      - {si: "ellipse > 0", texte: "Des images manquent : c'est une **ellipse**, le spectateur imagine ce qui s'est passé."}
    jules: "Compare les deux barres du bas : la grise est la durée vraie de l'action, la bleue sa durée à l'écran. Le ralenti l'allonge, l'accéléré et l'ellipse la raccourcissent."

  - id: methode
    type: methode
    etapes:
      - "Décider ce que l'histoire doit montrer et ce qu'elle peut laisser deviner (ellipse)."
      - "Choisir le nombre d'images nécessaires : trop d'images ralentissent le rythme, trop peu le rendent confus."
      - "Pour une image unique, chercher un moyen plastique de suggérer le mouvement (flou, lignes de vitesse)."
      - "Vérifier que l'enchaînement des images reste compréhensible sans texte explicatif."
    jules: "Une image unique peut suggérer un mouvement ou une durée sans être répétée, grâce à un flou de vitesse ou une trajectoire dessinée."

  - id: piege
    type: piege
    mauvaise_idee: "Vouloir tout montrer dans une histoire en images, sans rien laisser deviner."
    pourquoi_faux: "Cela alourdit le récit visuel : le spectateur n'a plus rien à reconstituer, l'histoire devient longue et redondante."
    bonne_idee: "Sauter volontairement un moment (ellipse) pour alléger le récit et impliquer le regard du spectateur."
    jules: "Confondre montrer un mouvement et montrer plusieurs instants identiques est une autre erreur fréquente."

  - id: exemple
    type: exemple
    situation: "Raconter en trois images seulement l'histoire « quelqu'un plante une graine, puis récolte un fruit », sans montrer la croissance."
    calcul: "Image 1 : la main plante la graine. Image 2 : un arbre déjà grand (ellipse entre les deux). Image 3 : la récolte du fruit."
    conclusion: "Le saut entre l'image 1 et l'image 2 est une **ellipse** : le spectateur comprend le temps écoulé sans qu'on le lui montre."
    jules: "Trois images suffisent à raconter toute une saison, à condition de choisir le bon moment à sauter."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "histoire en 4 cases avec une ellipse", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Pense au flou, aux lignes de vitesse ou à une position déséquilibrée du corps pour suggérer un mouvement rapide en une seule image."
