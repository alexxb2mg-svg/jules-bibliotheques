<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Trois dispositifs en volume (3D)</text>

<g class="node c-blue"><rect x="30" y="60" width="190" height="110" rx="8"/></g>
<text class="th" x="125" y="90" text-anchor="middle">Structure</text>
<text class="ts" x="125" y="115" text-anchor="middle">l'armature</text>
<text class="ts" x="125" y="133" text-anchor="middle">est visible</text>
<text class="ts" x="125" y="151" text-anchor="middle">ex. : squelette d'une forme</text>

<g class="node c-teal"><rect x="245" y="60" width="190" height="110" rx="8"/></g>
<text class="th" x="340" y="90" text-anchor="middle">Construction</text>
<text class="ts" x="340" y="115" text-anchor="middle">assemblage</text>
<text class="ts" x="340" y="133" text-anchor="middle">de plusieurs éléments</text>
<text class="ts" x="340" y="151" text-anchor="middle">ex. : cabane empilée</text>

<g class="node c-purple"><rect x="460" y="60" width="190" height="110" rx="8"/></g>
<text class="th" x="555" y="90" text-anchor="middle">Installation</text>
<text class="ts" x="555" y="115" text-anchor="middle">pensée pour un lieu</text>
<text class="ts" x="555" y="133" text-anchor="middle">le spectateur se déplace</text>
<text class="ts" x="555" y="151" text-anchor="middle">autour d'elle</text>

<g class="c-gray"><rect x="30" y="195" width="620" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="220" text-anchor="middle" dominant-baseline="central">Une installation transforme la perception du lieu qui l'accueille.</text>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">Espace littéral (support réel) et espace suggéré (profondeur illusoire) en 2D.</text></g>

<g class="c-red"><rect x="30" y="270" width="620" height="55" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="292" text-anchor="middle" dominant-baseline="central">Piège fréquent : confondre construction et installation liée à un lieu.</text>
<text class="ts" x="340" y="310" text-anchor="middle" dominant-baseline="central">L'installation inclut souvent le déplacement du spectateur.</text></g>
</svg>
