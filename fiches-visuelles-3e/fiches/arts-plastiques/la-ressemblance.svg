<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Ressemblance et vraisemblance : deux qualités différentes</text>

<g class="node c-blue"><rect x="40" y="55" width="270" height="110" rx="8"/></g>
<text class="th" x="175" y="80" text-anchor="middle">Ressemblant</text>
<text class="ts" x="175" y="102" text-anchor="middle">copie fidèle du modèle</text>
<text class="ts" x="175" y="120" text-anchor="middle">(couleurs, proportions)</text>
<text class="ts" x="175" y="138" text-anchor="middle">ex. : portrait académique</text>

<g class="node c-teal"><rect x="370" y="55" width="270" height="110" rx="8"/></g>
<text class="th" x="505" y="80" text-anchor="middle">Vraisemblable</text>
<text class="ts" x="505" y="102" text-anchor="middle">crédible, cohérent</text>
<text class="ts" x="505" y="120" text-anchor="middle">sans copier le réel</text>
<text class="ts" x="505" y="138" text-anchor="middle">ex. : scène imaginaire logique</text>

<g class="node c-purple"><rect x="205" y="200" width="270" height="90" rx="8"/></g>
<text class="th" x="340" y="225" text-anchor="middle">Trompe-l'œil</text>
<text class="ts" x="340" y="247" text-anchor="middle">ressemblance poussée à l'extrême</text>
<text class="ts" x="340" y="265" text-anchor="middle">perspective + ombres = illusion</text>

<line x1="175" y1="165" x2="300" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="505" y1="165" x2="380" y2="200" stroke="#9ca3af" stroke-width="1.5"/>

<g class="c-gray"><rect x="20" y="305" width="640" height="45" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="328" text-anchor="middle" dominant-baseline="central">L'écart au réel n'est pas un défaut : il peut porter le sens de l'œuvre.</text></g>
</svg>
