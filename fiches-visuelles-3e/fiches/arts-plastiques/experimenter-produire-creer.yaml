  - id: schema
    type: schema
    titre: "Du brouillon à l'œuvre choisie"
    svg: "experimenter-produire-creer.svg"
    jules: "L'essai qui surprend (ici l'essai 2) n'est pas mis à la poubelle : c'est souvent lui qui sert le mieux l'**intention** finale."

  - id: methode
    type: methode
    etapes:
      - "Lire la consigne et repérer ce qu'elle impose vraiment, et ce qu'elle laisse libre."
      - "Faire plusieurs essais rapides, en petit format et avec des matériaux simples, avant la version finale."
      - "Noter ou garder ce qui surprend, même si ce n'était pas prévu au départ."
      - "Comparer ses essais à des œuvres d'artistes qui posent une question proche."
      - "Choisir la piste qui répond le mieux à l'**intention**, et l'assumer."
    jules: "On ne cherche pas « la » bonne réponse en arts plastiques : plusieurs pistes très différentes peuvent toutes être justes."

  - id: piege
    type: piege
    mauvaise_idee: "Vouloir réussir du premier coup et jeter directement les essais « ratés » sans les regarder."
    pourquoi_faux: "Un essai raté révèle souvent un effet inattendu qui peut devenir la meilleure piste : le jeter, c'est perdre cette information."
    bonne_idee: "Garder tous les essais, même ratés, et se demander ce que chacun apporte avant de choisir la piste finale."
    jules: "Un artiste célèbre a dit qu'il n'y a pas d'erreur, seulement des « heureux accidents » à savoir reconnaître."

  - id: exemple
    type: exemple
    situation: "Consigne : « Représenter la vitesse sans dessiner de véhicule. »"
    calcul: "Pistes essayées : lignes floues au fusain frotté, papier déchiré en diagonale, photo bougée volontairement, mots découpés collés en oblique."
    conclusion: "Aucune piste n'est fausse : chacune traduit la **vitesse** par un moyen plastique différent, sans montrer d'objet qui va vite."
    jules: "Quatre moyens plastiques totalement différents (dessin, collage, photo, texte) répondent tous à la même intention."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "trois essais rapides à partir d'un mot", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Change de matériau à chaque essai : c'est ce changement qui fait apparaître des effets que tu n'aurais pas trouvés autrement."
