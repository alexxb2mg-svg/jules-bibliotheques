<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Présenter une production en 3 phrases</text>

<g class="node c-blue"><rect x="20" y="55" width="190" height="90" rx="8"/></g>
<text class="t" x="115" y="80" text-anchor="middle">1. Décrire</text>
<text class="ts" x="115" y="100" text-anchor="middle">fusain, noir et blanc,</text>
<text class="ts" x="115" y="116" text-anchor="middle">traits appuyés</text>

<g class="node c-teal"><rect x="245" y="55" width="190" height="90" rx="8"/></g>
<text class="t" x="340" y="80" text-anchor="middle">2. Justifier</text>
<text class="ts" x="340" y="100" text-anchor="middle">« parce que je voulais</text>
<text class="ts" x="340" y="116" text-anchor="middle">un contraste violent »</text>

<g class="node c-purple"><rect x="470" y="55" width="190" height="90" rx="8"/></g>
<text class="t" x="565" y="80" text-anchor="middle">3. Relier</text>
<text class="ts" x="565" y="100" text-anchor="middle">« comme certaines</text>
<text class="ts" x="565" y="116" text-anchor="middle">gravures anciennes »</text>

<line x1="210" y1="100" x2="245" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#fleche3)"/>
<line x1="435" y1="100" x2="470" y2="100" stroke="#374151" stroke-width="2.5" marker-end="url(#fleche3)"/>

<g class="c-gray"><rect x="20" y="170" width="640" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="195" text-anchor="middle" dominant-baseline="central">Ne jamais mélanger les trois rôles : décrire n'est pas juger.</text>
<text class="ts" x="340" y="215" text-anchor="middle" dominant-baseline="central">Écouter une remarque jusqu'au bout avant d'y répondre.</text></g>

<g class="c-red"><rect x="20" y="245" width="640" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="270" text-anchor="middle" dominant-baseline="central">Piège fréquent : dire « c'est joli » ou « c'est comme ça »</text>
<text class="ts" x="340" y="290" text-anchor="middle" dominant-baseline="central">sans expliquer ce qui produit cette impression dans l'image.</text></g>
</svg>
