relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: metissage, titre: "Métissages arts-numérique", sous_titre: "de nouvelles pratiques", principal: true}
      - {id: auteur, titre: "Question de l'auteur", sous_titre: "qui a créé l'œuvre ?"}
      - {id: public, titre: "Nouveau rôle du public", sous_titre: "récepteur → participant"}
      - {id: sciences, titre: "Croisement sciences", sous_titre: "biologie, robotique, données"}
    liens:
      - {de: metissage, vers: auteur}
      - {de: metissage, vers: public}
      - {de: metissage, vers: sciences}
    jules: "Quand un programme génère une image, la question se pose : qui en est réellement l'**auteur** ?"

  - id: schema
    type: schema
    titre: "Le public change de rôle : de spectateur à participant"
    svg: "metissages-arts-plastiques-numerique.svg"
    jules: "Une œuvre collective en ligne n'a plus un **auteur unique** : c'est un processus guidé par des règles fixées au départ par le créateur du dispositif."

  - id: methode
    type: methode
    etapes:
      - "Repérer, dans une œuvre numérique, qui a fait quoi : programmation, choix esthétiques, participation du public."
      - "Distinguer une œuvre où le numérique est un outil de fabrication d'une œuvre où le public participe activement."
      - "Chercher les liens entre l'œuvre et une discipline scientifique ou technique (biologie, informatique, physique)."
      - "Interroger la question de l'auteur quand plusieurs personnes ou un programme interviennent dans la création."
    jules: "Distingue bien : le numérique **outil** de fabrication n'est pas la même chose qu'une œuvre où le **public participe**."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'une œuvre faite avec un programme n'a pas d'auteur du tout."
    pourquoi_faux: "L'auteur n'est pas absent : c'est celui qui a fixé les **règles** du dispositif, même si le résultat final lui échappe en partie."
    bonne_idee: "Chercher qui a créé les règles ou le programme, même quand le résultat final n'est pas entièrement prévisible."
    jules: "Autre piège : négliger le rôle du **public** dans une œuvre participative ou collective."

  - id: exemple
    type: exemple
    situation: "Une œuvre en ligne évolue en fonction des contributions successives de nombreux internautes anonymes, sans qu'aucun d'eux ne la termine seul."
    calcul: "L'auteur n'est plus une personne unique : c'est un processus collectif, guidé par les règles fixées au départ par le créateur du dispositif."
    conclusion: "Ce type d'œuvre définit un statut nouveau : celui d'une œuvre **partagée**, sans auteur unique au sens traditionnel."
    jules: "Le rôle du créateur devient celui de fixer des **règles de départ**, plutôt que de réaliser l'œuvre finale lui-même."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "art numérique, œuvre collective", outil: "lexique"}
    jules: "Entraîne-toi : cherche un exemple d'œuvre ou de projet artistique qui utilise une science ou une technologie et explique ce que ce croisement apporte."
