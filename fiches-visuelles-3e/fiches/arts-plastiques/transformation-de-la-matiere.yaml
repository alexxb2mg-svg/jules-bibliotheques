notion: transformation-de-la-matiere
titre: "La matière, l'outil et le geste : ce qui transforme l'œuvre"
matiere: arts-plastiques
niveau: 3e
auteurs: ["hermes-ap2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-ap2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Sculpture »", url: "https://fr.vikidia.org/w/index.php?title=Sculpture&oldid=2584156", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: triade, titre: "Matière + outil + geste", sous_titre: "liés entre eux", principal: true}
      - {id: matiere, titre: "Matière", sous_titre: "peinture, terre, bois…"}
      - {id: outil, titre: "Outil", sous_titre: "pinceau, doigt, couteau…"}
      - {id: geste, titre: "Geste", sous_titre: "rapide, lent, appuyé"}
      - {id: sens, titre: "Réalité concrète", sous_titre: "porte du sens"}
    liens:
      - {de: triade, vers: matiere}
      - {de: triade, vers: outil}
      - {de: triade, vers: geste}
      - {de: matiere, vers: sens}
    jules: "Changer un seul des trois éléments (matière, outil, geste) change forcément le résultat obtenu avec les deux autres : ils sont **liés**."

  - id: schema
    type: schema
    titre: "Un même visage, deux outils, deux effets"
    svg: "transformation-de-la-matiere.svg"
    jules: "Le pinceau fin donne des détails précis et une surface lisse ; le couteau laisse des **empâtements** en relief, une matière plus rugueuse."

  - id: methode
    type: methode
    etapes:
      - "Choisir l'outil et le geste en fonction de l'effet recherché (précision, énergie, douceur…)."
      - "Observer les traces laissées par un outil avant de continuer le travail."
      - "Comparer plusieurs essais avec des outils différents sur le même sujet."
      - "Décrire ce que la matière elle-même apporte à l'œuvre, pas seulement le sujet représenté."
    jules: "Une trace d'outil n'est jamais un accident à corriger : observe-la, elle peut **orienter** la suite de ton travail."

  - id: piege
    type: piege
    mauvaise_idee: "Vouloir cacher toutes les traces de l'outil ou du geste, en pensant que c'est plus « propre »."
    pourquoi_faux: "La réalité concrète de l'œuvre (épaisseur de peinture, texture, traces d'outil) porte elle-même du **sens** ou de l'expressivité : la gommer, c'est perdre une partie du message."
    bonne_idee: "Assumer et regarder les traces comme un élément du résultat, pas comme un défaut à effacer."
    jules: "Décrire une production seulement par son sujet, sans parler de sa **matière**, c'est ne dire que la moitié de ce qu'elle raconte."

  - id: exemple
    type: exemple
    situation: "Peindre un même visage une fois au pinceau fin, une fois au couteau à peindre."
    calcul: "Pinceau fin : détails précis, surface lisse. Couteau : empâtements en relief, matière rugueuse, rendu plus expressif."
    conclusion: "Le visage représenté est **identique**, mais l'effet produit sur le spectateur est totalement différent selon la matière et le geste employés."
    jules: "Même sujet, même forme, mais deux œuvres qui ne racontent pas la même chose : voilà ce que change la **matérialité**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "matérialité, empâtement, geste", outil: "lexique"}
    jules: "Entraîne-toi : dessine la même petite forme avec trois outils différents (pinceau, doigt, fourchette) et compare les effets."
