<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Même sujet, deux intentions différentes</text>

<g class="node c-amber"><rect x="30" y="55" width="290" height="110" rx="8"/></g>
<text class="th" x="175" y="80" text-anchor="middle">Affiche publicitaire</text>
<text class="ts" x="175" y="105" text-anchor="middle">bouteilles sur une table</text>
<text class="ts" x="175" y="123" text-anchor="middle">intention : vendre</text>
<text class="ts" x="175" y="141" text-anchor="middle">message clair et efficace</text>

<g class="node c-teal"><rect x="360" y="55" width="290" height="110" rx="8"/></g>
<text class="th" x="505" y="80" text-anchor="middle">Nature morte</text>
<text class="ts" x="505" y="105" text-anchor="middle">bouteilles sur une table</text>
<text class="ts" x="505" y="123" text-anchor="middle">intention : questionner</text>
<text class="ts" x="505" y="141" text-anchor="middle">lumière, matière, composition</text>

<g class="c-gray"><rect x="30" y="185" width="620" height="55" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="207" text-anchor="middle" dominant-baseline="central">Même sujet représenté, intentions opposées : vendre ou interroger.</text>
<text class="ts" x="340" y="225" text-anchor="middle" dominant-baseline="central">C'est l'intention qui distingue image de communication et œuvre.</text></g>

<g class="c-red"><rect x="30" y="255" width="620" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="280" text-anchor="middle" dominant-baseline="central">Piège fréquent : juger une œuvre uniquement sur une photo de livre,</text>
<text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">sans connaître ses vraies dimensions ni sa matière réelle.</text></g>
</svg>
