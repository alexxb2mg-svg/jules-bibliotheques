<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Une même chaise, deux contextes</text>

<g class="node c-amber">
<rect x="40" y="55" width="280" height="150" rx="10"/>
<text class="th" x="180" y="83" text-anchor="middle">Musée d'histoire</text>
<text class="ts" x="180" y="110" text-anchor="middle">vitrine, cartel explicatif</text>
<text class="ts" x="180" y="133" text-anchor="middle">témoignage d'une époque</text>
<text class="ts" x="180" y="156" text-anchor="middle">statut : objet d'étude</text>
</g>

<g class="node c-teal">
<rect x="360" y="55" width="280" height="150" rx="10"/>
<text class="th" x="500" y="83" text-anchor="middle">Galerie d'art contemporain</text>
<text class="ts" x="500" y="110" text-anchor="middle">socle, cartel signé artiste</text>
<text class="ts" x="500" y="133" text-anchor="middle">regard esthétique</text>
<text class="ts" x="500" y="156" text-anchor="middle">statut : objet d'art</text>
</g>

<text class="ts" x="340" y="230" text-anchor="middle">même forme d'objet physique</text>

<g class="c-gray">
<rect x="40" y="255" width="600" height="100" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="285" text-anchor="middle" dominant-baseline="central">Le contexte de présentation change le statut de l'objet</text>
<text class="ts" x="340" y="310" text-anchor="middle" dominant-baseline="central">Objet matériel ≠ statut reçu par le spectateur</text>
<text class="ts" x="340" y="333" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de principe</text>
</g>
</svg>
