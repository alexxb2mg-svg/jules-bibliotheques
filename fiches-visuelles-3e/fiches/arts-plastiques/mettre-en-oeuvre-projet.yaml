notion: mettre-en-oeuvre-projet
titre: "Mettre en œuvre un projet artistique"
matiere: arts-plastiques
niveau: 3e
auteurs: ["hermes-ap1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-ap1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Arts plastiques »", url: "https://fr.vikidia.org/w/index.php?title=Arts_plastiques&oldid=2072075", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: projet, titre: "Projet artistique", sous_titre: "début, étapes, fin", principal: true}
      - {id: etapes, titre: "Étapes datées", sous_titre: "recherche → réalisation → finitions"}
      - {id: anticiper, titre: "Anticiper", sous_titre: "matériel, temps, technique"}
      - {id: confronter, titre: "Confronter", sous_titre: "intention ↔ réalisation"}
    liens:
      - {de: projet, vers: etapes}
      - {de: projet, vers: anticiper}
      - {de: etapes, vers: confronter}
    jules: "Un projet vivant s'adapte et se réoriente en cours de route sans perdre sa **dimension artistique**."

  - id: schema
    type: schema
    titre: "Calendrier d'un projet en volume (14 jours)"
    svg: "mettre-en-oeuvre-projet.svg"
    jules: "Le temps de **finition et de présentation** (support, éclairage) est une étape à part entière, pas un simple détail final."

  - id: methode
    type: methode
    etapes:
      - "Découper le projet en étapes datées : recherche, essais, réalisation, finitions."
      - "Lister le matériel et le temps nécessaires à chaque étape avant de commencer."
      - "Vérifier régulièrement où on en est par rapport au calendrier prévu."
      - "En cas de blocage, revenir à l'**intention** de départ : l'adapter ou changer de moyen technique."
      - "Prévoir un temps de finition et de présentation, pas seulement de fabrication."
    jules: "L'autonomie ne veut pas dire l'isolement : demander un avis ou ajuster son calendrier fait partie de la conduite de projet."

  - id: piege
    type: piege
    mauvaise_idee: "Se lancer directement dans la réalisation finale sans étape d'essai."
    pourquoi_faux: "Sans essai préalable, les problèmes techniques (collage, assemblage, séchage) apparaissent trop tard pour être corrigés."
    bonne_idee: "Faire d'abord un essai rapide pour tester la technique, puis passer à la réalisation finale une fois rassuré."
    jules: "Sous-estimer le temps de séchage ou de collage est l'erreur la plus fréquente : elle fait perdre des jours entiers."

  - id: exemple
    type: exemple
    situation: "Projet : réaliser une petite installation en volume à partir d'objets récupérés, à présenter dans deux semaines."
    calcul: "Jours 1-3 : collecte et essais d'assemblage. Jours 4-8 : assemblage final fixé solidement. Jours 9-11 : présentation (support, éclairage). Jours 12-14 : préparer la prise de parole."
    conclusion: "Chaque étape a une durée et un objectif clair : le projet arrive à son terme sans improvisation de dernière minute."
    jules: "Compter les jours à l'envers depuis la date de rendu aide à voir si le calendrier est réaliste."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "écrire un calendrier en 3-4 étapes", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Prévois toujours une solution de repli concrète, pas juste « je verrai » si le matériau prévu manque."
