<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Trois façons d'aborder l'espace d'une œuvre</text>

<g class="node c-purple">
<rect x="30" y="55" width="200" height="130" rx="10"/>
<text class="th" x="130" y="83" text-anchor="middle">Espace perçu</text>
<text class="ts" x="130" y="110" text-anchor="middle">réel, on s'y déplace</text>
<text class="ts" x="130" y="133" text-anchor="middle">installation traversée</text>
<text class="ts" x="130" y="156" text-anchor="middle">vue + ouïe + toucher</text>
</g>

<g class="node c-coral">
<rect x="240" y="55" width="200" height="130" rx="10"/>
<text class="th" x="340" y="83" text-anchor="middle">Espace ressenti</text>
<text class="ts" x="340" y="110" text-anchor="middle">oppression, calme</text>
<text class="ts" x="340" y="133" text-anchor="middle">subjectif</text>
<text class="ts" x="340" y="156" text-anchor="middle">varie selon la personne</text>
</g>

<g class="node c-teal">
<rect x="450" y="55" width="200" height="130" rx="10"/>
<text class="th" x="550" y="83" text-anchor="middle">Espace représenté</text>
<text class="ts" x="550" y="110" text-anchor="middle">suggéré par une image</text>
<text class="ts" x="550" y="133" text-anchor="middle">deux dimensions</text>
<text class="ts" x="550" y="156" text-anchor="middle">vue seulement</text>
</g>

<g class="c-gray">
<rect x="40" y="215" width="600" height="130" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="245" text-anchor="middle" dominant-baseline="central">Le point de vue du spectateur fait partie de l'œuvre</text>
<text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">Certaines œuvres font de l'espace et du temps des matériaux</text>
<text class="ts" x="340" y="295" text-anchor="middle" dominant-baseline="central">Une photo ne montre qu'un seul point de vue fixe</text>
<text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de principe</text>
</g>
</svg>
