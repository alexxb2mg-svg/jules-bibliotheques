notion: autonomie-de-loeuvre
titre: "L'autonomie de l'œuvre d'art"
matiere: arts-plastiques
niveau: 3e
auteurs: ["hermes-ap1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-ap1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Art abstrait »", url: "https://fr.vikidia.org/w/index.php?title=Art_abstrait&oldid=2261134", licence: CC-BY-SA-3.0}
  - {titre: "Wikipédia, « Art abstrait »", url: "https://fr.wikipedia.org/w/index.php?title=Art_abstrait&oldid=239711738", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
lexique:
  - {terme: "figuratif", definition: "qui représente des formes reconnaissables du monde réel"}
  - {terme: "abstrait", definition: "qui ne représente pas le monde visible, organisé par les formes et les couleurs elles-mêmes"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: autonomie, titre: "Autonomie de l'œuvre", sous_titre: "ne renvoie qu'à elle-même", principal: true}
      - {id: abstrait, titre: "Art abstrait", sous_titre: "formes, couleurs, sans imiter"}
      - {id: figuratif, titre: "Figuratif", sous_titre: "représente le monde visible"}
      - {id: abyme, titre: "Mise en abyme", sous_titre: "l'œuvre se représente elle-même"}
    liens:
      - {de: autonomie, vers: abstrait}
      - {de: abstrait, vers: figuratif}
      - {de: autonomie, vers: abyme}
    jules: "L'art abstrait est apparu au XXe siècle ; des artistes comme Vassily Kandinsky ou Piet Mondrian ont développé ce langage à partir de couleurs, de lignes et de formes géométriques."

  - id: schema
    type: schema
    titre: "De l'œuvre figurative à l'œuvre abstraite"
    svg: "autonomie-de-loeuvre.svg"
    jules: "Une œuvre devient « autonome » quand elle ne renvoie plus à autre chose qu'elle-même : elle est sa propre référence."

  - id: methode
    type: methode
    etapes:
      - "Vérifier d'abord si l'œuvre montre quelque chose de reconnaissable (figuratif) ou non (abstrait)."
      - "Chercher ce qui organise l'œuvre à la place d'un sujet : couleurs, lignes, rythme, matière."
      - "Pour une mise en abyme, repérer l'élément qui renvoie à l'œuvre elle-même."
      - "Éviter de chercher « ce que ça représente » dans une œuvre abstraite : chercher plutôt ce qu'elle fait ressentir."
    jules: "La mise en abyme est un procédé où une œuvre inclut ses propres constituants (un tableau dans le tableau, un livre qui parle d'un livre)."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'une œuvre abstraite est « n'importe quoi » ou faite au hasard."
    pourquoi_faux: "Une composition abstraite est organisée avec autant de réflexion qu'une œuvre figurative, mais autour des couleurs et des lignes elles-mêmes."
    bonne_idee: "Chercher ce qui organise l'œuvre (équilibre des couleurs, rythme des lignes) plutôt qu'un sujet caché."
    jules: "Confondre abstraction et simple simplification d'une forme reconnaissable est une autre erreur fréquente."

  - id: exemple
    type: exemple
    situation: "Une toile ne montre que des rectangles de couleurs primaires séparés par des lignes noires épaisses."
    calcul: "Aucun objet n'est reconnaissable : l'œuvre est **abstraite**."
    conclusion: "Elle organise le regard par l'équilibre des couleurs et des lignes, dans la lignée du travail de Piet Mondrian sur la composition géométrique."
    jules: "Ce sont les couleurs et les lignes elles-mêmes qui deviennent le sujet de l'œuvre, sans rien d'autre à reconnaître."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "composition abstraite en trois couleurs", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Une photo qui montre l'appareil photo qui la prend est un bon exemple simple de mise en abyme."
