notion: presence-materielle-oeuvre-espace
titre: "La présentation de l'œuvre : échelle, lieu et in situ"
matiere: arts-plastiques
niveau: 3e
auteurs: ["hermes-ap2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-ap2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Land art »", url: "https://fr.vikidia.org/w/index.php?title=Land_art&oldid=2273383", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Installation »", url: "https://fr.vikidia.org/w/index.php?title=Installation&oldid=2570407", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
abreviations: {"in situ": "œuvre conçue spécifiquement pour un lieu précis, indissociable de celui-ci"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: presentation, titre: "Présentation de l'œuvre", sous_titre: "fait partie de l'œuvre", principal: true}
      - {id: echelle, titre: "Échelle", sous_titre: "minuscule ou monumentale"}
      - {id: lieu, titre: "Lieu", sous_titre: "musée, rue, nature"}
      - {id: insitu, titre: "In situ", sous_titre: "pensée pour ce lieu"}
      - {id: ephemere, titre: "Dimension éphémère", sous_titre: "durée limitée"}
    liens:
      - {de: presentation, vers: echelle}
      - {de: presentation, vers: lieu}
      - {de: lieu, vers: insitu}
      - {de: insitu, vers: ephemere}
    jules: "Une œuvre **in situ** ne pourrait pas garder le même sens si on la déplaçait ailleurs : elle est pensée pour ce lieu précis."

  - id: schema
    type: schema
    titre: "Même sculpture, deux lieux, deux effets"
    svg: "presence-materielle-oeuvre-espace.svg"
    jules: "Le **rapport d'échelle** entre l'œuvre et le spectateur (s'approcher, être dominé) change profondément l'expérience."

  - id: graphe-echelle
    type: graphe
    gabarit: point-de-vue
    curseurs:
      - {id: curseur-taille, nom: taille, min: 0.5, max: 20, pas: 0.5, depart: 1.5}
      - {id: curseur-hauteur, nom: hauteur, min: -2, max: 2, pas: 1, depart: 0}
      - {id: curseur-distance, nom: distance, min: 5, max: 5, pas: 1, depart: 5}
    lectures:
      - {si: "taille <= 1", texte: "Plus petite que le corps : présentation **intime**, sur socle ou en vitrine."}
      - {si: "taille >= 1.5 && taille <= 2", texte: "À la taille du corps : l'œuvre est à **hauteur d'homme**, face à face avec le spectateur."}
      - {si: "taille >= 5", texte: "**Monumentale** : l'œuvre domine le spectateur, souvent dans l'**espace public**."}
      - {si: "hauteur < 0", texte: "Vue d'en bas : le **rapport d'échelle** renforce l'impression de puissance."}
    jules: "Le personnage mesure 1,5 m : c'est lui qui donne l'**échelle**. La même sculpture n'a pas le même effet sur une table ou plus haute qu'un immeuble."

  - id: methode
    type: methode
    etapes:
      - "Déterminer l'échelle de l'œuvre par rapport au corps du spectateur, et l'effet recherché."
      - "Choisir le lieu de présentation en fonction de ce qu'il apporte à l'œuvre (musée, rue, nature)."
      - "Pour une œuvre in situ, vérifier qu'elle dialogue vraiment avec les caractéristiques du lieu."
      - "Anticiper la durée de vie de l'œuvre si elle est installée en extérieur ou dans l'espace public."
    jules: "Une œuvre installée dehors sans lien particulier avec le lieu n'est pas forcément une œuvre **in situ**."

  - id: piege
    type: piege
    mauvaise_idee: "Penser que le lieu d'exposition n'a pas d'importance pour la perception de l'œuvre."
    bonne_idee: "Toujours vérifier ce qu'apporte le lieu choisi (taille, matière, lumière) à la compréhension de l'œuvre."
    pourquoi_faux: "Une même sculpture ne produit pas le même effet posée sur un socle dans un musée ou installée au sol dans une **rue**."
    jules: "Autre piège : confondre une œuvre simplement installée dehors et une véritable œuvre **in situ** pensée pour ce lieu."

  - id: exemple
    type: exemple
    situation: "Un artiste enveloppe un pont existant avec un tissu, pour une durée limitée."
    calcul: "L'œuvre est pensée pour ce pont précis (in situ) : son échelle monumentale et son caractère éphémère font partie intégrante du projet."
    conclusion: "Cette œuvre ne pourrait pas être reproduite à l'**identique** ailleurs : elle est indissociable de son lieu."
    jules: "L'espace public pose des questions particulières d'accès, de **durée** et de dialogue avec l'architecture environnante."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "in situ, échelle, espace public", outil: "lexique"}
    jules: "Entraîne-toi : choisis un lieu de ta maison ou de ton quartier et imagine une petite œuvre pensée spécifiquement pour ce lieu, qui ne fonctionnerait pas ailleurs."
