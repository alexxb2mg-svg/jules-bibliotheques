<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Figuratif, abstrait, mise en abyme</text>

<g class="node c-blue"><rect x="30" y="55" width="290" height="110" rx="8"/></g>
<text class="th" x="175" y="80" text-anchor="middle">Figuratif</text>
<text class="ts" x="175" y="105" text-anchor="middle">forme reconnaissable</text>
<text class="ts" x="175" y="123" text-anchor="middle">renvoie au monde visible</text>
<text class="ts" x="175" y="141" text-anchor="middle">ex. : portrait, paysage</text>

<g class="node c-teal"><rect x="360" y="55" width="290" height="110" rx="8"/></g>
<text class="th" x="505" y="80" text-anchor="middle">Abstrait</text>
<text class="ts" x="505" y="105" text-anchor="middle">rien de reconnaissable</text>
<text class="ts" x="505" y="123" text-anchor="middle">organisé par couleurs/lignes</text>
<text class="ts" x="505" y="141" text-anchor="middle">ex. : Kandinsky, Mondrian</text>

<g class="node c-purple"><rect x="195" y="200" width="290" height="90" rx="8"/></g>
<text class="th" x="340" y="225" text-anchor="middle">Mise en abyme</text>
<text class="ts" x="340" y="247" text-anchor="middle">l'œuvre inclut sa propre image</text>
<text class="ts" x="340" y="265" text-anchor="middle">ex. : un tableau dans le tableau</text>

<line x1="175" y1="165" x2="290" y2="200" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="505" y1="165" x2="390" y2="200" stroke="#9ca3af" stroke-width="1.5"/>

<g class="c-gray"><rect x="20" y="305" width="640" height="30" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="323" text-anchor="middle" dominant-baseline="central">L'œuvre autonome ne renvoie qu'à elle-même, pas au monde visible.</text></g>
</svg>
