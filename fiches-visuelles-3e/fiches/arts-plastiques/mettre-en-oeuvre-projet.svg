<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Calendrier : installation en volume (14 jours)</text>

<g class="node c-blue"><rect x="20" y="55" width="150" height="80" rx="8"/></g>
<text class="t" x="95" y="80" text-anchor="middle">Jours 1-3</text>
<text class="ts" x="95" y="100" text-anchor="middle">collecte</text>
<text class="ts" x="95" y="118" text-anchor="middle">essais d'assemblage</text>

<g class="node c-teal"><rect x="185" y="55" width="150" height="80" rx="8"/></g>
<text class="t" x="260" y="80" text-anchor="middle">Jours 4-8</text>
<text class="ts" x="260" y="100" text-anchor="middle">assemblage final</text>
<text class="ts" x="260" y="118" text-anchor="middle">fixation solide</text>

<g class="node c-amber"><rect x="350" y="55" width="150" height="80" rx="8"/></g>
<text class="t" x="425" y="80" text-anchor="middle">Jours 9-11</text>
<text class="ts" x="425" y="100" text-anchor="middle">présentation</text>
<text class="ts" x="425" y="118" text-anchor="middle">support, éclairage</text>

<g class="node c-purple"><rect x="515" y="55" width="150" height="80" rx="8"/></g>
<text class="t" x="590" y="80" text-anchor="middle">Jours 12-14</text>
<text class="ts" x="590" y="100" text-anchor="middle">prise de parole</text>
<text class="ts" x="590" y="118" text-anchor="middle">démarche expliquée</text>

<line x1="170" y1="95" x2="185" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#fleche2)"/>
<line x1="335" y1="95" x2="350" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#fleche2)"/>
<line x1="500" y1="95" x2="515" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#fleche2)"/>

<line x1="95" y1="135" x2="95" y2="190" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="260" y1="135" x2="260" y2="190" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="425" y1="135" x2="425" y2="190" stroke="#9ca3af" stroke-width="1.5"/>
<line x1="590" y1="135" x2="590" y2="190" stroke="#9ca3af" stroke-width="1.5"/>

<g class="c-gray"><rect x="20" y="195" width="645" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="342" y="220" text-anchor="middle" dominant-baseline="central">Confronter intention et réalisation à chaque étape : adapter si besoin.</text>
<text class="ts" x="342" y="240" text-anchor="middle" dominant-baseline="central">Calendrier indicatif : pas à l'échelle réelle du temps.</text></g>

<g class="c-red"><rect x="20" y="270" width="645" height="55" rx="8" stroke-width="0.5"/>
<text class="t" x="342" y="292" text-anchor="middle" dominant-baseline="central">Piège fréquent : se lancer dans la réalisation finale sans étape d'essai.</text>
<text class="ts" x="342" y="310" text-anchor="middle" dominant-baseline="central">Toujours tester la technique (collage, séchage) avant la version finale.</text></g>
</svg>
