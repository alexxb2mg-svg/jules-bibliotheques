relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: numerique, titre: "Numérique en art", sous_titre: "outil ou matériau", principal: true}
      - {id: outil, titre: "Simple outil", sous_titre: "remplace un pinceau"}
      - {id: materiau, titre: "Véritable matériau", sous_titre: "algorithme, capteur"}
      - {id: dialogue, titre: "Dialogue", sous_titre: "pratiques traditionnelles/numériques"}
      - {id: cout, titre: "Coût énergétique", sous_titre: "regard critique nécessaire"}
    liens:
      - {de: numerique, vers: outil}
      - {de: numerique, vers: materiau}
      - {de: materiau, vers: dialogue}
      - {de: numerique, vers: cout}
    jules: "Un logiciel qui remplace juste un pinceau n'est qu'un **outil** ; un algorithme qui génère lui-même des formes devient un **matériau** de l'œuvre."

  - id: schema
    type: schema
    titre: "Le numérique : de l'outil au matériau artistique"
    svg: "numerique-processus-materiau.svg"
    jules: "Le **processus** (l'algorithme) peut devenir le matériau de l'œuvre, produisant des résultats que l'artiste n'a pas dessinés trait par trait."

  - id: methode
    type: methode
    etapes:
      - "Distinguer un usage du numérique comme simple outil (remplacer un pinceau) d'un usage comme véritable matériau (générer une forme imprévisible)."
      - "Choisir un procédé numérique en fonction de ce qu'il permet de faire que la main seule ne permet pas."
      - "Interroger le coût énergétique du procédé choisi si le projet le mobilise fortement."
      - "Mettre en dialogue le résultat numérique avec une pratique traditionnelle si le projet le permet."
    jules: "Pose-toi toujours la question : qu'est-ce que cet outil numérique m'apporte de **plus** qu'un geste manuel ?"

  - id: piege
    type: piege
    mauvaise_idee: "Croire que le numérique est un matériau « sans coût », sans impact énergétique."
    pourquoi_faux: "Créer, stocker et imprimer des images numériques, faire de l'impression 3D ou du calcul consomme réellement de l'**énergie** : c'est une vraie question artistique et écologique."
    bonne_idee: "Toujours réfléchir au coût énergétique d'un procédé numérique utilisé dans un projet artistique."
    jules: "Autre piège : utiliser un logiciel juste pour aller **plus vite**, sans explorer ce qu'il permet vraiment de plus."

  - id: exemple
    type: exemple
    situation: "Un artiste programme un petit algorithme qui dessine des motifs différents à chaque exécution, à partir de règles simples qu'il a fixées."
    calcul: "Le numérique n'est pas ici un simple outil de dessin : c'est le processus (l'algorithme) qui devient le matériau de l'œuvre."
    conclusion: "L'artiste ne dessine plus trait par trait : il fixe des **règles**, et le programme produit des résultats qu'il n'a pas prévus lui-même."
    jules: "L'art génératif repose sur ce principe : fixer des **règles**, pas dessiner directement le résultat final."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "art numérique, algorithme, in situ", outil: "lexique"}
    jules: "Entraîne-toi : sur une application de dessin, essaie un outil de symétrie automatique ou de génération de motifs et observe ce qu'il produit que ta main seule ne ferait pas."
