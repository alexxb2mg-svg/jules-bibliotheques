<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Même bleu, deux qualités de matière</text>

<g class="node c-blue">
<rect x="40" y="50" width="280" height="150" rx="10"/>
<text class="th" x="180" y="78" text-anchor="middle">Aquarelle fine</text>
<text class="ts" x="180" y="105" text-anchor="middle">bleu transparent</text>
<text class="ts" x="180" y="130" text-anchor="middle">couche très fine</text>
<text class="ts" x="180" y="155" text-anchor="middle">laisse voir le papier</text>
<text class="ts" x="180" y="180" text-anchor="middle">effet léger, calme</text>
</g>

<g class="node c-teal">
<rect x="360" y="50" width="280" height="150" rx="10"/>
<text class="th" x="500" y="78" text-anchor="middle">Peinture épaisse</text>
<text class="ts" x="500" y="105" text-anchor="middle">bleu opaque et brillant</text>
<text class="ts" x="500" y="130" text-anchor="middle">empâtement en relief</text>
<text class="ts" x="500" y="155" text-anchor="middle">cache le support</text>
<text class="ts" x="500" y="180" text-anchor="middle">effet fort, présent</text>
</g>

<text class="ts" x="340" y="115" text-anchor="middle">même teinte de bleu</text>

<g class="c-gray">
<rect x="40" y="220" width="600" height="90" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="248" text-anchor="middle" dominant-baseline="central">Décrire une couleur : teinte + épaisseur + brillance + transparence</text>
<text class="ts" x="340" y="273" text-anchor="middle" dominant-baseline="central">La quantité de matière change la présence de la couleur</text>
<text class="ts" x="340" y="296" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de principe</text>
</g>
</svg>
