notion: objet-comme-materiau
titre: "L'objet comme matériau : détournement et ready-made"
matiere: arts-plastiques
niveau: 3e
auteurs: ["hermes-ap2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-ap2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Ready-made »", url: "https://fr.vikidia.org/w/index.php?title=Ready-made&oldid=2582131", licence: CC-BY-SA-3.0}
  - {titre: "Wikipédia, « Art conceptuel »", url: "https://fr.wikipedia.org/w/index.php?title=Art_conceptuel&oldid=239237289", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: objet, titre: "Objet du quotidien", sous_titre: "détourné par l'artiste", principal: true}
      - {id: fonction, titre: "Fonction habituelle", sous_titre: "avant le détournement"}
      - {id: readymade, titre: "Ready-made", sous_titre: "objet industriel présenté tel quel"}
      - {id: decontexte, titre: "Décontextualisation", sous_titre: "sortir de son usage"}
      - {id: recontexte, titre: "Recontextualisation", sous_titre: "placer dans un cadre artistique"}
    liens:
      - {de: objet, vers: fonction}
      - {de: objet, vers: readymade}
      - {de: readymade, vers: decontexte}
      - {de: decontexte, vers: recontexte}
    jules: "Le **ready-made** ne transforme pas la matière de l'objet : c'est son déplacement vers un cadre artistique qui en fait une œuvre."

  - id: schema
    type: schema
    titre: "Un urinoir devient « Fontaine » : le geste de Duchamp"
    svg: "objet-comme-materiau.svg"
    jules: "Marcel Duchamp n'a rien fabriqué : il a choisi, signé et titré un objet industriel, geste qui a interrogé la définition même de l'**art**."

  - id: methode
    type: methode
    etapes:
      - "Choisir un objet et repérer sa fonction habituelle avant de le détourner."
      - "Décider ce qui change quand on le sort de son contexte normal (lieu, usage, association)."
      - "Présenter l'objet de façon à souligner ce nouveau statut (socle, cadre, mise en lumière)."
      - "Vérifier que le détournement porte une intention, pas seulement un déplacement sans idée."
    jules: "Un objet détourné sans intention reste un simple déplacement : c'est l'**idée** derrière le geste qui fait l'œuvre."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'exposer n'importe quel objet suffit à en faire une œuvre, sans intention."
    pourquoi_faux: "Le ready-made de Duchamp fonctionne parce qu'il porte un geste réfléchi (choix, signature, titre) : sans cette **intention**, ce n'est qu'un objet déplacé."
    bonne_idee: "Toujours expliquer l'intention qui motive le détournement, pas seulement montrer l'objet."
    jules: "Autre piège fréquent : confondre détournement d'objet artistique et simple **bricolage** ou réparation."

  - id: exemple
    type: exemple
    situation: "Marcel Duchamp présente un urinoir industriel, signé et titré « Fontaine », dans une exposition d'art en 1917."
    calcul: "L'objet n'est pas transformé matériellement : c'est son déplacement du magasin vers l'exposition, et le geste de le signer et de le titrer, qui en font une œuvre d'art."
    conclusion: "Ce geste interroge la définition même de l'**art** : faut-il fabriquer une œuvre, ou suffit-il de la désigner comme telle ?"
    jules: "Le **ready-made** a ouvert la voie à l'art conceptuel, où l'idée compte parfois plus que la fabrication."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "ready-made, décontextualisation", outil: "lexique"}
    jules: "Entraîne-toi : choisis un objet chez toi et imagine comment le présenter (socle, lieu, association) pour qu'il soit perçu autrement que pour son usage."
