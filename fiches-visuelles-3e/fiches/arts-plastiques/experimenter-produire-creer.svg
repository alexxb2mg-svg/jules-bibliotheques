<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Consigne : « représenter la vitesse »</text>

<g class="node c-blue"><rect x="30" y="55" width="140" height="70" rx="8"/></g>
<text class="t" x="100" y="82" text-anchor="middle">Essai 1</text>
<text class="ts" x="100" y="102" text-anchor="middle">fusain frotté</text>

<g class="node c-teal"><rect x="190" y="55" width="140" height="70" rx="8"/></g>
<text class="t" x="260" y="82" text-anchor="middle">Essai 2</text>
<text class="ts" x="260" y="102" text-anchor="middle">papier déchiré</text>

<g class="node c-purple"><rect x="350" y="55" width="140" height="70" rx="8"/></g>
<text class="t" x="420" y="82" text-anchor="middle">Essai 3</text>
<text class="ts" x="420" y="102" text-anchor="middle">photo bougée</text>

<g class="node c-amber"><rect x="510" y="55" width="140" height="70" rx="8"/></g>
<text class="t" x="580" y="82" text-anchor="middle">Essai 4</text>
<text class="ts" x="580" y="102" text-anchor="middle">mots découpés</text>

<line x1="100" y1="125" x2="240" y2="200" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#fleche)"/>
<line x1="260" y1="125" x2="270" y2="200" stroke="#374151" stroke-width="2.5" marker-end="url(#fleche)"/>
<line x1="420" y1="125" x2="300" y2="200" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#fleche)"/>
<line x1="580" y1="125" x2="330" y2="200" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#fleche)"/>

<g class="node c-teal"><rect x="190" y="205" width="160" height="70" rx="10" stroke-width="3"/></g>
<text class="t" x="270" y="232" text-anchor="middle">Piste choisie</text>
<text class="ts" x="270" y="252" text-anchor="middle">l'inattendu qui sert l'intention</text>

<g class="c-gray"><rect x="30" y="300" width="620" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="325" text-anchor="middle" dominant-baseline="central">Aucun essai n'est « faux » : chacun explore un moyen plastique différent.</text>
<text class="ts" x="340" y="345" text-anchor="middle" dominant-baseline="central">Schéma de synthèse, pas une reproduction d'œuvre réelle.</text></g>
</svg>
