<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="flechen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Trois images, une ellipse</text>

<g class="node c-blue"><rect x="30" y="60" width="170" height="100" rx="8"/></g>
<text class="t" x="115" y="90" text-anchor="middle">Image 1</text>
<text class="ts" x="115" y="112" text-anchor="middle">la main plante</text>
<text class="ts" x="115" y="128" text-anchor="middle">la graine</text>

<line x1="200" y1="110" x2="245" y2="110" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#flechen)"/>
<text class="ts" x="222" y="95" text-anchor="middle">ellipse</text>

<g class="node c-teal"><rect x="250" y="60" width="170" height="100" rx="8"/></g>
<text class="t" x="335" y="90" text-anchor="middle">Image 2</text>
<text class="ts" x="335" y="112" text-anchor="middle">un arbre</text>
<text class="ts" x="335" y="128" text-anchor="middle">déjà grand</text>

<line x1="420" y1="110" x2="465" y2="110" stroke="#374151" stroke-width="2.5" marker-end="url(#flechen)"/>

<g class="node c-purple"><rect x="470" y="60" width="180" height="100" rx="8"/></g>
<text class="t" x="560" y="90" text-anchor="middle">Image 3</text>
<text class="ts" x="560" y="112" text-anchor="middle">la récolte</text>
<text class="ts" x="560" y="128" text-anchor="middle">du fruit</text>

<g class="c-gray"><rect x="30" y="195" width="620" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="220" text-anchor="middle" dominant-baseline="central">L'ellipse (croissance) est sautée : le spectateur la reconstitue.</text>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">L'ordre des images change le sens du récit.</text></g>
</svg>
