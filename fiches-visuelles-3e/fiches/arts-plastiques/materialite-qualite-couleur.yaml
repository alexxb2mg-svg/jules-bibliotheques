relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: couleur, titre: "Couleur = matière", sous_titre: "pas juste une teinte", principal: true}
      - {id: teinte, titre: "Teinte", sous_titre: "bleu, rouge, jaune…"}
      - {id: epaisseur, titre: "Épaisseur", sous_titre: "fine ou en couche épaisse"}
      - {id: brillance, titre: "Brillance", sous_titre: "mate ou brillante"}
      - {id: support, titre: "Support", sous_titre: "papier, toile, mur…"}
    liens:
      - {de: couleur, vers: teinte}
      - {de: couleur, vers: epaisseur}
      - {de: couleur, vers: brillance}
      - {de: couleur, vers: support}
    jules: "Une couleur n'est pas qu'une teinte à nommer : c'est aussi une **matière** posée sur un support, avec une épaisseur et un aspect."

  - id: schema
    type: schema
    titre: "Même bleu, deux qualités de matière très différentes"
    svg: "materialite-qualite-couleur.svg"
    jules: "Le même bleu peut être une fine tache d'aquarelle transparente ou un empâtement épais et brillant : ce n'est plus la **même couleur ressentie**."

  - id: methode
    type: methode
    etapes:
      - "Ne pas se limiter au nom de la couleur (bleu, rouge…) : préciser son aspect (mat, brillant, transparent)."
      - "Observer l'épaisseur de la matière colorée : fine tache ou empâtement en relief."
      - "Tenir compte du support : la même couleur change d'aspect sur du papier, du bois ou une toile."
      - "Décrire l'effet que produit cette qualité de couleur sur le spectateur (calme, énergie, mystère)."
    jules: "Le vocabulaire précis (mat, brillant, transparent, opaque) t'aide à décrire une couleur bien mieux que juste son **nom**."

  - id: piege
    type: piege
    mauvaise_idee: "Décrire une œuvre en se contentant de nommer les couleurs utilisées (« il y a du bleu et du rouge »)."
    pourquoi_faux: "Cela ignore la **matérialité** de la couleur : son épaisseur, sa brillance, sa transparence, qui changent totalement la perception de l'œuvre."
    bonne_idee: "Toujours ajouter un adjectif sur la qualité de la matière colorée (bleu mat, rouge en empâtement épais…)."
    jules: "Deux œuvres avec exactement les mêmes couleurs peuvent produire des effets opposés si la **matière** de la couleur diffère."

  - id: exemple
    type: exemple
    situation: "Un même bleu appliqué en aquarelle fine puis en peinture épaisse au couteau."
    calcul: "Aquarelle fine : bleu transparent, laisse voir le papier, effet léger. Peinture épaisse : bleu opaque et brillant, en relief, effet fort et présent."
    conclusion: "La **quantité de matière** et sa brillance changent la présence de la couleur, même si la teinte reste identique."
    jules: "Retiens ces quatre mots pour décrire une couleur : **teinte**, épaisseur, brillance, transparence."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "matérialité, empâtement, opaque", outil: "lexique"}
    jules: "Entraîne-toi : peins la même couleur en couche fine, puis en couche épaisse, et compare les deux résultats."
