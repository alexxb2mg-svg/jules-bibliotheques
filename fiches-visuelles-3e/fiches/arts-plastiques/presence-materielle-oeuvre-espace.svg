<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Même sculpture, deux lieux, deux effets</text>

<g class="node c-blue">
<rect x="40" y="55" width="280" height="140" rx="10"/>
<text class="th" x="180" y="83" text-anchor="middle">Musée</text>
<text class="ts" x="180" y="110" text-anchor="middle">posée sur un socle</text>
<text class="ts" x="180" y="133" text-anchor="middle">distance imposée</text>
<text class="ts" x="180" y="156" text-anchor="middle">échelle protégée, isolée</text>
</g>

<g class="node c-teal">
<rect x="360" y="55" width="280" height="140" rx="10"/>
<text class="th" x="500" y="83" text-anchor="middle">Rue, espace public</text>
<text class="ts" x="500" y="110" text-anchor="middle">installée au sol</text>
<text class="ts" x="500" y="133" text-anchor="middle">accès libre, tout proche</text>
<text class="ts" x="500" y="156" text-anchor="middle">dialogue avec l'architecture</text>
</g>

<text class="ts" x="340" y="225" text-anchor="middle">même œuvre, rapport d'échelle différent</text>

<g class="c-gray">
<rect x="40" y="250" width="600" height="100" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="280" text-anchor="middle" dominant-baseline="central">In situ : une œuvre pensée spécifiquement pour un lieu précis</text>
<text class="ts" x="340" y="305" text-anchor="middle" dominant-baseline="central">Le lieu et l'échelle font partie du sens de l'œuvre</text>
<text class="ts" x="340" y="328" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de principe</text>
</g>
</svg>
