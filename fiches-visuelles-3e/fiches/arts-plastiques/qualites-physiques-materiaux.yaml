      - {de: qualites, vers: transparence}
      - {de: qualites, vers: solidite}
      - {de: texture, vers: choix}
    jules: "Un même matériau peut avoir plusieurs qualités physiques en même temps : le verre est **transparent** et **rigide**, mais aussi **fragile**."

  - id: schema
    type: schema
    titre: "Quatre qualités physiques à observer avant de choisir un matériau"
    svg: "qualites-physiques-materiaux.svg"
    jules: "Avant de choisir un matériau, pose-toi la question : quelles qualités physiques vais-je **exploiter** pour mon projet ?"

  - id: methode
    type: methode
    etapes:
      - "Observer un matériau avec les yeux ET les mains : texture, poids ressenti, réaction à la lumière."
      - "Nommer précisément la qualité observée (rugueux, translucide, souple…) plutôt que rester vague."
      - "Relier cette qualité physique à un effet artistique possible (fragilité qui inquiète, transparence qui laisse deviner)."
      - "Comparer deux matériaux différents sur la même qualité pour mieux la comprendre."
    jules: "Décrire un matériau seulement par sa couleur, c'est oublier la moitié de ses qualités : pense aussi au **toucher** et au **poids**."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que seule l'apparence visuelle (couleur, forme) compte dans le choix d'un matériau."
    pourquoi_faux: "Les qualités physiques d'un matériau (texture, poids, transparence, solidité) influencent tout autant la perception de l'œuvre que sa couleur ou sa forme."
    bonne_idee: "Décrire un matériau avec au moins deux qualités physiques différentes, pas seulement sa couleur."
    jules: "Un objet en papier froissé et un objet en métal lisse peuvent avoir la **même forme** mais raconter des choses très différentes."

  - id: exemple
    type: exemple
    situation: "Pourquoi un artiste choisit-il parfois un matériau fragile comme le verre ou le papier pour son œuvre ?"
    calcul: "Le verre est transparent et fragile : il peut évoquer la vulnérabilité. Le papier froissé montre des plis et une légèreté qui évoquent le temps qui passe."
    conclusion: "La **fragilité** ou la **légèreté** d'un matériau peut porter un sens fort, indépendamment de la forme représentée."
    jules: "Certains artistes choisissent volontairement un matériau qui se dégrade avec le temps, pour que l'œuvre elle-même **évolue**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "texture, translucide, fragilité", outil: "lexique"}
    jules: "Entraîne-toi : touche les yeux fermés trois objets différents (bois, tissu, plastique) et décris leurs qualités physiques."
