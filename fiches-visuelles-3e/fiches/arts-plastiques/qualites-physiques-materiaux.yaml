blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: qualites, titre: "Qualités physiques", sous_titre: "d'un matériau", principal: true}
      - {id: texture, titre: "Texture", sous_titre: "lisse, rugueux, doux"}
      - {id: poids, titre: "Poids", sous_titre: "lourd, léger"}
      - {id: transparence, titre: "Transparence", sous_titre: "opaque, translucide"}
      - {id: solidite, titre: "Solidité", sous_titre: "rigide, souple, fragile"}
