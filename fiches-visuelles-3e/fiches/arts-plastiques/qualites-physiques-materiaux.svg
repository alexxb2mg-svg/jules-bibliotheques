<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Quatre qualités physiques d'un matériau</text>

<g class="node c-blue">
<rect x="40" y="55" width="280" height="110" rx="10"/>
<text class="th" x="180" y="83" text-anchor="middle">Texture</text>
<text class="ts" x="180" y="110" text-anchor="middle">lisse, rugueux, doux</text>
<text class="ts" x="180" y="135" text-anchor="middle">se sent au toucher</text>
</g>

<g class="node c-teal">
<rect x="360" y="55" width="280" height="110" rx="10"/>
<text class="th" x="500" y="83" text-anchor="middle">Poids</text>
<text class="ts" x="500" y="110" text-anchor="middle">lourd, léger</text>
<text class="ts" x="500" y="135" text-anchor="middle">se ressent en le portant</text>
</g>

<g class="node c-purple">
<rect x="40" y="185" width="280" height="110" rx="10"/>
<text class="th" x="180" y="213" text-anchor="middle">Transparence</text>
<text class="ts" x="180" y="240" text-anchor="middle">opaque, translucide</text>
<text class="ts" x="180" y="265" text-anchor="middle">laisse voir ou pas la lumière</text>
</g>

<g class="node c-amber">
<rect x="360" y="185" width="280" height="110" rx="10"/>
<text class="th" x="500" y="213" text-anchor="middle">Solidité</text>
<text class="ts" x="500" y="240" text-anchor="middle">rigide, souple, fragile</text>
<text class="ts" x="500" y="265" text-anchor="middle">résiste ou se déforme</text>
</g>

<g class="c-gray">
<rect x="40" y="315" width="600" height="65" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="340" text-anchor="middle" dominant-baseline="central">Ces qualités guident le choix d'un matériau pour une œuvre</text>
<text class="ts" x="340" y="362" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de synthèse</text>
</g>
</svg>
