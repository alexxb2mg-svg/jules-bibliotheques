<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Un urinoir devient « Fontaine »</text>

<g class="node c-gray">
<rect x="40" y="55" width="220" height="130" rx="10"/>
<text class="th" x="150" y="83" text-anchor="middle">Avant</text>
<text class="ts" x="150" y="110" text-anchor="middle">objet industriel</text>
<text class="ts" x="150" y="133" text-anchor="middle">dans un magasin</text>
<text class="ts" x="150" y="156" text-anchor="middle">fonction : usage quotidien</text>
</g>

<path d="M275,120 L400,120" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche)"/>
<text class="ts" x="337" y="108" text-anchor="middle">choisi, signé, titré</text>

<g class="node c-purple">
<rect x="410" y="55" width="230" height="130" rx="10"/>
<text class="th" x="525" y="83" text-anchor="middle">Après</text>
<text class="ts" x="525" y="110" text-anchor="middle">même objet, non transformé</text>
<text class="ts" x="525" y="133" text-anchor="middle">présenté en exposition</text>
<text class="ts" x="525" y="156" text-anchor="middle">statut : œuvre d'art</text>
</g>

<g class="c-gray">
<rect x="40" y="215" width="600" height="130" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="245" text-anchor="middle" dominant-baseline="central">Décontextualisation : sortir l'objet de son usage habituel</text>
<text class="t" x="340" y="272" text-anchor="middle" dominant-baseline="central">Recontextualisation : le placer dans un cadre artistique</text>
<text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">Le geste de l'artiste (choix, signature, titre) fait l'œuvre</text>
<text class="ts" x="340" y="323" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de principe</text>
</g>
</svg>
