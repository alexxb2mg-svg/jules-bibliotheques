generation: {par: "hermes-ap1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Arts plastiques »", url: "https://fr.vikidia.org/w/index.php?title=Arts_plastiques&oldid=2072075", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: parler, titre: "Parler de sa pratique", sous_titre: "avec un vocabulaire précis", principal: true}
      - {id: decrire, titre: "Décrire", sous_titre: "matière, couleur, forme"}
      - {id: justifier, titre: "Justifier", sous_titre: "l'intention derrière un choix"}
      - {id: ecouter, titre: "Écouter", sous_titre: "accepter un avis différent"}
    liens:
      - {de: parler, vers: decrire}
      - {de: decrire, vers: justifier}
      - {de: parler, vers: ecouter}
    jules: "On distingue une critique du travail d'une critique de la personne : la première fait progresser, la seconde blesse sans aider."

  - id: schema
    type: schema
    titre: "Trois phrases pour présenter une production"
    svg: "sexprimer-analyser-sa-pratique.svg"
    jules: "Décrire, justifier, relier : chaque phrase a un rôle précis, il ne faut pas les mélanger."

  - id: methode
    type: methode
    etapes:
      - "Décrire d'abord ce qui est visible (matériaux, couleurs, formes, taille) avant de donner un avis."
      - "Relier cette description à une intention : « j'ai choisi… parce que… »."
      - "Citer, si possible, une œuvre ou un artiste qui a un lien avec ce choix."
      - "Écouter une remarque jusqu'au bout avant d'y répondre."
      - "Distinguer une critique du travail d'une critique de la personne."
    jules: "La phrase de description ne doit contenir aucun jugement du type « c'est joli » : ce n'est pas de la description."

  - id: piege
    type: piege
    mauvaise_idee: "Répondre « c'est comme ça » sans justifier un choix plastique."
    pourquoi_faux: "Cette réponse ne dit rien de l'**intention** : elle empêche de comprendre pourquoi le choix a été fait et de progresser."
    bonne_idee: "Expliquer le choix par une intention, même simple : « j'ai mis du rouge parce que je voulais un effet de tension »."
    jules: "Décrire une émotion vague comme « c'est joli » sans dire ce qui la produit dans l'image est le même piège."

  - id: exemple
    type: exemple
    situation: "Présenter en une phrase une production faite en noir et blanc avec du fusain très appuyé."
    calcul: "« J'ai utilisé seulement du fusain, appuyé fort pour obtenir des noirs profonds, parce que je voulais que le contraste soit violent, comme dans certaines gravures anciennes. »"
    conclusion: "Cette phrase décrit le moyen, explique l'intention, et relie le travail à une référence : les trois rôles sont réunis."
    jules: "Une seule phrase bien construite vaut mieux que dix mots vagues comme « sombre » ou « intense »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "écrire décrire, justifier, relier", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Reformuler l'avis d'un camarade avec tes propres mots permet de vérifier que tu l'as bien compris, sans être forcément d'accord."
