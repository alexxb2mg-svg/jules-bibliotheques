generation: {par: "hermes-ap1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Composition picturale »", url: "https://fr.wikipedia.org/w/index.php?title=Composition_picturale&oldid=237458929", licence: CC-BY-SA-4.0}
  - {titre: "Wikipédia, « Installation (art) »", url: "https://fr.wikipedia.org/w/index.php?title=Installation_%28art%29&oldid=238029954", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
lexique:
  - {terme: "installation", definition: "œuvre en volume conçue pour un lieu précis, qui modifie la perception de cet espace"}
  - {terme: "composition picturale", definition: "organisation réfléchie des formes à l'intérieur des limites d'une image, en vue d'un effet"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: dispositif, titre: "Dispositif de représentation", sous_titre: "2D et 3D", principal: true}
      - {id: littoral, titre: "Espace 2D", sous_titre: "littéral et suggéré"}
      - {id: volume, titre: "Espace 3D", sous_titre: "structure, construction, installation"}
      - {id: composition, titre: "Composition", sous_titre: "organisation avec une intention"}
    liens:
      - {de: dispositif, vers: littoral}
      - {de: dispositif, vers: volume}
      - {de: littoral, vers: composition}
    jules: "L'espace suggéré est une illusion de profondeur créée sur une surface plane par la perspective, la taille et les superpositions."

  - id: schema
    type: schema
    titre: "Trois façons d'occuper l'espace en volume"
    svg: "dispositif-de-representation.svg"
    jules: "Une **installation** ne se regarde pas seulement : elle se traverse, car elle transforme la perception du lieu qui l'accueille."

  - id: graphe-perspective
    type: graphe
    gabarit: perspective-point-de-fuite
    curseurs:
      - {id: curseur-horizon, nom: horizon, min: 10, max: 90, pas: 10, depart: 50}
      - {id: curseur-fuite, nom: fuite, min: -5, max: 5, pas: 1, depart: 0}
    lectures:
      - {si: "horizon <= 30", texte: "Horizon **bas** : le regard est près du sol, les objets paraissent hauts et on voit le dessous du cube suspendu."}
      - {si: "horizon >= 70", texte: "Horizon **haut** : on voit le dessus des objets, comme en vue plongeante."}
      - {si: "fuite == 0", texte: "Point de fuite au centre : composition **symétrique**, le regard file droit vers le fond."}
      - {si: "fuite != 0", texte: "Point de fuite décalé : l'**espace suggéré** se tourne, la composition devient plus dynamique."}
    jules: "Toutes les lignes qui s'enfoncent dans la profondeur (les **fuyantes**) se rejoignent au point de fuite, toujours posé sur la ligne d'horizon, à la hauteur des yeux de celui qui regarde."

  - id: methode
    type: methode
    etapes:
      - "Repérer d'abord les limites du support : format, orientation, taille."
      - "Placer les éléments principaux en pensant à l'équilibre ou au déséquilibre recherché."
      - "Pour un volume, décider s'il s'agit d'une structure, d'une construction ou d'une installation liée à un lieu."
      - "Vérifier que la composition sert bien l'intention (calme, tension, mouvement…)."
    jules: "L'espace « littéral » est la surface réelle du support ; l'espace « suggéré » est la profondeur que l'image donne l'illusion de contenir."

  - id: piege
    type: piege
    mauvaise_idee: "Placer les éléments d'une composition au hasard, sans penser à l'équilibre général."
    pourquoi_faux: "Les bords de la feuille ou du support font partie de la composition : un placement au hasard produit un effet non maîtrisé."
    bonne_idee: "Décider consciemment d'un équilibre ou d'un déséquilibre, en fonction de l'effet recherché."
    jules: "Confondre une simple construction en volume et une véritable **installation** pensée pour un lieu est une autre erreur fréquente."

  - id: exemple
    type: exemple
    situation: "Une photo place un personnage tout en haut à gauche d'un grand ciel vide."
    calcul: "Le vide occupe la majorité du cadre : cette composition est volontairement déséquilibrée."
    conclusion: "Cette composition donne une impression de petitesse ou de solitude du personnage, un effet qu'un cadrage centré ne donnerait pas."
    jules: "Le même personnage placé au centre du cadre produirait une impression de stabilité totalement différente."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "deux compositions avec les mêmes formes", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Une structure met en avant son armature visible ; une construction assemble des éléments visibles entre eux."
