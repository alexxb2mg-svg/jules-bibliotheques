<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">De l'indice observé à l'interprétation</text>

<g class="node c-blue"><rect x="20" y="55" width="180" height="95" rx="8"/></g>
<text class="t" x="110" y="80" text-anchor="middle">Indices observés</text>
<text class="ts" x="110" y="100" text-anchor="middle">touches de couleur</text>
<text class="ts" x="110" y="116" text-anchor="middle">non mélangées</text>
<text class="ts" x="110" y="132" text-anchor="middle">ombres colorées</text>

<line x1="200" y1="102" x2="240" y2="102" stroke="#374151" stroke-width="2.5" marker-end="url(#fleche4)"/>

<g class="node c-teal"><rect x="245" y="55" width="180" height="95" rx="8"/></g>
<text class="t" x="335" y="80" text-anchor="middle">Mouvement</text>
<text class="ts" x="335" y="100" text-anchor="middle">impressionnisme</text>
<text class="ts" x="335" y="116" text-anchor="middle">France, XIXe siècle</text>

<line x1="425" y1="102" x2="465" y2="102" stroke="#374151" stroke-width="2.5" marker-end="url(#fleche4)"/>

<g class="node c-purple"><rect x="470" y="55" width="190" height="95" rx="8"/></g>
<text class="t" x="565" y="80" text-anchor="middle">Interprétation</text>
<text class="ts" x="565" y="100" text-anchor="middle">peinture réalisée</text>
<text class="ts" x="565" y="116" text-anchor="middle">en plein air</text>

<g class="c-gray"><rect x="20" y="175" width="640" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="200" text-anchor="middle" dominant-baseline="central">La technique compte autant que le sujet représenté.</text>
<text class="ts" x="340" y="220" text-anchor="middle" dominant-baseline="central">Interprétation toujours appuyée sur un élément visible.</text></g>

<g class="c-red"><rect x="20" y="250" width="640" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="275" text-anchor="middle" dominant-baseline="central">Piège fréquent : confondre le sujet (paysage) et le mouvement</text>
<text class="ts" x="340" y="295" text-anchor="middle" dominant-baseline="central">artistique (comment la technique le montre).</text></g>
</svg>
