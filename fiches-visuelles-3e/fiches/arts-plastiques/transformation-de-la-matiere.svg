<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>

<text class="th" x="340" y="26" text-anchor="middle">Même visage, deux outils, deux effets</text>

<g class="node c-blue">
<rect x="40" y="50" width="280" height="150" rx="10"/>
<text class="th" x="180" y="78" text-anchor="middle">Pinceau fin</text>
<text class="ts" x="180" y="105" text-anchor="middle">geste précis, lent</text>
<text class="ts" x="180" y="130" text-anchor="middle">surface lisse</text>
<text class="ts" x="180" y="155" text-anchor="middle">détails nets</text>
<text class="ts" x="180" y="180" text-anchor="middle">rendu doux</text>
</g>

<g class="node c-coral">
<rect x="360" y="50" width="280" height="150" rx="10"/>
<text class="th" x="500" y="78" text-anchor="middle">Couteau à peindre</text>
<text class="ts" x="500" y="105" text-anchor="middle">geste rapide, appuyé</text>
<text class="ts" x="500" y="130" text-anchor="middle">matière en relief</text>
<text class="ts" x="500" y="155" text-anchor="middle">empâtements, rugosité</text>
<text class="ts" x="500" y="180" text-anchor="middle">rendu expressif</text>
</g>

<text class="ts" x="340" y="115" text-anchor="middle">même sujet</text>

<g class="node c-purple">
<rect x="220" y="220" width="240" height="60" rx="10"/>
<text class="th" x="340" y="245" text-anchor="middle">Matière + outil + geste</text>
<text class="ts" x="340" y="265" text-anchor="middle">= trois choix qui changent tout</text>
</g>

<line x1="180" y1="200" x2="290" y2="220" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="500" y1="200" x2="390" y2="220" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche)"/>

<g class="c-gray">
<rect x="40" y="310" width="600" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="335" text-anchor="middle" dominant-baseline="central">La matière et le geste portent du sens, pas seulement le sujet représenté</text>
<text class="ts" x="340" y="358" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de principe</text>
</g>
</svg>
