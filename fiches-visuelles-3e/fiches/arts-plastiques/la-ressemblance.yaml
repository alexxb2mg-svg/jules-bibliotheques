notion: la-ressemblance
titre: "La ressemblance et la vraisemblance"
matiere: arts-plastiques
niveau: 3e
auteurs: ["hermes-ap1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-ap1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Trompe-l'œil »", url: "https://fr.vikidia.org/w/index.php?title=Trompe-l%27%C5%93il&oldid=1977820", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Portrait »", url: "https://fr.vikidia.org/w/index.php?title=Portrait&oldid=2588251", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
lexique:
  - {terme: "trompe-l'œil", definition: "technique qui pousse la ressemblance jusqu'à faire croire qu'une image plane est un objet réel en volume"}
  - {terme: "vraisemblance", definition: "qualité d'une image cohérente et crédible, même si elle ne reproduit pas exactement un modèle réel"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: ressemblance, titre: "Ressemblance", sous_titre: "copier fidèlement le modèle", principal: true}
      - {id: vraisemblance, titre: "Vraisemblance", sous_titre: "rester crédible sans copier"}
      - {id: ecart, titre: "Écart au réel", sous_titre: "déformation, exagération"}
      - {id: trompeloeil, titre: "Trompe-l'œil", sous_titre: "ressemblance poussée à l'extrême"}
    liens:
      - {de: ressemblance, vers: vraisemblance}
      - {de: vraisemblance, vers: ecart}
      - {de: ressemblance, vers: trompeloeil}
    jules: "L'écart avec le réel n'est pas un défaut : c'est souvent ce choix qui porte le **sens** ou l'expressivité d'une œuvre."

  - id: schema
    type: schema
    titre: "Ressemblant, vraisemblable, ou les deux ?"
    svg: "la-ressemblance.svg"
    jules: "Un portrait peut être vraisemblable (proportions justes) sans être ressemblant en couleur : l'écart sert alors une émotion."

  - id: graphe-ecart
    type: graphe
    gabarit: figuratif-abstrait
    curseurs:
      - {id: curseur-ecart, nom: ecart, min: 0, max: 3, pas: 1, depart: 0}
    lectures:
      - {si: "ecart == 0", texte: "**Ressemblance** forte : on reconnaît le modèle, proportions et ombres comme sur une photo."}
      - {si: "ecart == 1", texte: "Écart par **accentuation** : un trait exagéré, comme dans la caricature, exprime quelque chose."}
      - {si: "ecart == 2", texte: "L'image reste **vraisemblable** sans ressembler : les proportions tiennent, les couleurs sont inventées."}
      - {si: "ecart == 3", texte: "L'**écart** est maximal : l'image vaut pour ses formes et ses couleurs, plus pour le modèle."}
    jules: "Pousse le curseur pas à pas : le visage ne devient pas « raté », chaque étape est un **choix** de l'artiste qui change ce que l'image exprime."

  - id: methode
    type: methode
    etapes:
      - "Se demander d'abord si l'image cherche à copier fidèlement un modèle (ressemblance)."
      - "Chercher ensuite si elle reste crédible même sans copier exactement (vraisemblance)."
      - "Identifier ce que l'écart au réel (déformation, couleur irréelle, proportions changées) apporte au sens."
      - "Ne pas juger une œuvre « ratée » parce qu'elle ne ressemble pas : se demander ce qu'elle cherche à faire."
    jules: "Une scène imaginaire bien construite peut être **vraisemblable** sans être ressemblante à quoi que ce soit de réel."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'une bonne œuvre doit toujours ressembler au réel."
    pourquoi_faux: "Confondre absence de ressemblance et absence de sens fait passer à côté de nombreuses œuvres qui choisissent volontairement l'écart."
    bonne_idee: "Se demander ce que l'écart au réel apporte (émotion, étrangeté, humour) plutôt que de chercher une copie fidèle."
    jules: "Le **trompe-l'œil** n'est pas de la triche : c'est une technique exigeante qui pousse la ressemblance jusqu'à créer un doute."

  - id: exemple
    type: exemple
    situation: "Un peintre représente un visage avec des couleurs vives non naturelles (front bleu, joue orange), en gardant des proportions justes."
    calcul: "Le portrait n'est pas ressemblant dans ses couleurs, mais il reste vraisemblable comme visage (proportions, expression)."
    conclusion: "L'écart de couleur sert probablement à exprimer une émotion plutôt qu'à copier la réalité."
    jules: "Les proportions justes suffisent à rendre un visage crédible, même avec des couleurs totalement irréelles."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "dessiner un objet ressemblant puis vraisemblable", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Le deuxième dessin doit rester reconnaissable même en changeant une caractéristique : c'est exactement ça, la vraisemblance."
