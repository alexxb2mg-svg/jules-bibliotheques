<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<title>Un réseau local en étoile relié à Internet</title>
<desc>Trois ordinateurs ou périphériques et une station météo sont reliés par câble à un commutateur, lui-même relié à la box qui joue le rôle de routeur. Un smartphone est relié à la box en Wi-Fi. La box relie le réseau local à Internet, où se trouve un serveur web. Chaque appareil du réseau local a une adresse IP qui commence par 172.16.1.</desc>
<rect x="12" y="36" width="516" height="340" rx="10" fill="none" stroke="#88877f" stroke-width="1" stroke-dasharray="6 4"/>
<text class="th" x="24" y="58">Réseau local : les adresses commencent par 172.16.1</text>
<line x1="160" y1="105" x2="190" y2="196" stroke="#185FA5" stroke-width="2"/>
<line x1="160" y1="205" x2="190" y2="205" stroke="#185FA5" stroke-width="2"/>
<line x1="160" y1="305" x2="190" y2="214" stroke="#185FA5" stroke-width="2"/>
<line x1="255" y1="230" x2="255" y2="300" stroke="#185FA5" stroke-width="2"/>
<line x1="320" y1="205" x2="370" y2="205" stroke="#185FA5" stroke-width="2"/>
<line x1="440" y1="230" x2="440" y2="300" stroke="#185FA5" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="510" y1="205" x2="552" y2="205" stroke="#185FA5" stroke-width="2"/>
<line x1="615" y1="245" x2="615" y2="300" stroke="#185FA5" stroke-width="2"/>
<g class="node c-blue"><rect x="30" y="80" width="130" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="97" text-anchor="middle" dominant-baseline="central">Ordinateur 1</text>
<text class="ts" x="95" y="116" text-anchor="middle" dominant-baseline="central">172.16.1.10</text></g>
<g class="node c-blue"><rect x="30" y="180" width="130" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="197" text-anchor="middle" dominant-baseline="central">Ordinateur 2</text>
<text class="ts" x="95" y="216" text-anchor="middle" dominant-baseline="central">172.16.1.11</text></g>
<g class="node c-blue"><rect x="30" y="280" width="130" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="297" text-anchor="middle" dominant-baseline="central">Imprimante</text>
<text class="ts" x="95" y="316" text-anchor="middle" dominant-baseline="central">172.16.1.20</text></g>
<g class="node c-blue"><rect x="185" y="300" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="255" y="317" text-anchor="middle" dominant-baseline="central">Station météo</text>
<text class="ts" x="255" y="338" text-anchor="middle" dominant-baseline="central">172.16.1.50 (fixe)</text></g>
<g class="node c-purple"><rect x="190" y="180" width="130" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="255" y="197" text-anchor="middle" dominant-baseline="central">Commutateur</text>
<text class="ts" x="255" y="216" text-anchor="middle" dominant-baseline="central">(switch)</text></g>
<g class="node c-purple"><rect x="370" y="180" width="140" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="440" y="197" text-anchor="middle" dominant-baseline="central">Box = routeur</text>
<text class="ts" x="440" y="216" text-anchor="middle" dominant-baseline="central">172.16.1.1</text></g>
<g class="node c-blue"><rect x="370" y="300" width="140" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="440" y="317" text-anchor="middle" dominant-baseline="central">Smartphone</text>
<text class="ts" x="440" y="336" text-anchor="middle" dominant-baseline="central">172.16.1.22</text></g>
<text class="ts" x="448" y="270">Wi-Fi</text>
<g class="c-gray"><ellipse cx="612" cy="205" rx="60" ry="40" stroke-width="0.8"/>
<text class="th" x="612" y="205" text-anchor="middle" dominant-baseline="central">Internet</text></g>
<g class="c-gray"><rect x="560" y="300" width="110" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="615" y="317" text-anchor="middle" dominant-baseline="central">Serveur web</text>
<text class="ts" x="615" y="338" text-anchor="middle" dominant-baseline="central">IP publique</text></g>
<text class="ts" x="612" y="120" text-anchor="middle">réseau mondial :</text>
<text class="ts" x="612" y="136" text-anchor="middle">des millions de</text>
<text class="ts" x="612" y="152" text-anchor="middle">réseaux reliés</text>
<line x1="20" y1="400" x2="60" y2="400" stroke="#185FA5" stroke-width="2"/>
<text class="ts" x="68" y="404">câble (filaire)</text>
<line x1="170" y1="400" x2="210" y2="400" stroke="#185FA5" stroke-width="2" stroke-dasharray="5 4"/>
<text class="ts" x="218" y="404">sans fil</text>
<text class="ts" x="300" y="404">Topologie en étoile : tout passe par le commutateur.</text>
<text class="ts" x="20" y="424">Bleu : terminaux et liaisons ; violet : équipements qui aiguillent les données.</text>
</svg>
