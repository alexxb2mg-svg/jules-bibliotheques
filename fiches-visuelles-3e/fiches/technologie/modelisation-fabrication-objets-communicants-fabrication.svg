<svg width="100%" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Du modèle 3D à la pièce : choisir le moyen de production">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-purple"><rect x="170" y="14" width="340" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="32" text-anchor="middle" dominant-baseline="central">Modèle numérique 3D (CAO)</text>
<text class="ts" x="340" y="51" text-anchor="middle" dominant-baseline="central">Quelle forme, quel matériau, quelle précision ?</text></g>
<path d="M340 64 V82 M120 82 H560" fill="none" stroke="#5f5e5a" stroke-width="1.5"/>
<line x1="120" y1="82" x2="120" y2="126" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="82" x2="340" y2="126" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="82" x2="560" y2="126" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="128" y="104" text-anchor="start" dominant-baseline="central">forme plane</text>
<text class="ts" x="348" y="104" text-anchor="start" dominant-baseline="central">volume complexe</text>
<text class="ts" x="568" y="104" text-anchor="start" dominant-baseline="central">bloc, précision</text>

<g class="c-teal"><rect x="20" y="128" width="200" height="118" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="148" text-anchor="middle" dominant-baseline="central">Découpe laser</text>
<text class="ts" x="120" y="174" text-anchor="middle" dominant-baseline="central">découpe ou grave une plaque</text>
<text class="ts" x="120" y="194" text-anchor="middle" dominant-baseline="central">bois, carton, acrylique</text>
<text class="ts" x="120" y="222" text-anchor="middle" dominant-baseline="central">enlève de la matière</text></g>
<g class="c-teal"><rect x="240" y="128" width="200" height="118" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">Impression 3D</text>
<text class="ts" x="340" y="174" text-anchor="middle" dominant-baseline="central">dépose du plastique (PLA)</text>
<text class="ts" x="340" y="194" text-anchor="middle" dominant-baseline="central">couche par couche</text>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">ajoute de la matière</text></g>
<g class="c-teal"><rect x="460" y="128" width="200" height="118" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="148" text-anchor="middle" dominant-baseline="central">Centre d'usinage</text>
<text class="ts" x="560" y="174" text-anchor="middle" dominant-baseline="central">une fraise creuse un bloc</text>
<text class="ts" x="560" y="194" text-anchor="middle" dominant-baseline="central">métal, bois, plastique</text>
<text class="ts" x="560" y="222" text-anchor="middle" dominant-baseline="central">enlève de la matière</text></g>

<line x1="120" y1="246" x2="120" y2="276" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="246" x2="340" y2="276" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="246" x2="560" y2="276" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="20" y="278" width="640" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="297" text-anchor="middle" dominant-baseline="central">Contrôler la pièce</text>
<text class="ts" x="340" y="317" text-anchor="middle" dominant-baseline="central">mesurer au pied à coulisse et comparer aux cotes du modèle 3D</text></g>
</svg>
