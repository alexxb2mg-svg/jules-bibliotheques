<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="node c-blue"><rect x="20" y="16" width="420" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="230" y="34" text-anchor="middle" dominant-baseline="central">1. Choisir la grandeur et son unité</text>
<text class="ts" x="230" y="54" text-anchor="middle" dominant-baseline="central">vitesse en m/s, autonomie en km, débit d'air...</text></g>
<g class="node c-blue"><rect x="20" y="88" width="420" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="230" y="106" text-anchor="middle" dominant-baseline="central">2. Choisir l'instrument</text>
<text class="ts" x="230" y="126" text-anchor="middle" dominant-baseline="central">chronomètre, multimètre, dynamomètre, mètre ruban</text></g>
<g class="node c-amber"><rect x="20" y="160" width="420" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="230" y="178" text-anchor="middle" dominant-baseline="central">3. Fixer les conditions</text>
<text class="ts" x="230" y="198" text-anchor="middle" dominant-baseline="central">identiques pour tous les essais : seul l'objet change</text></g>
<g class="node c-blue"><rect x="20" y="232" width="420" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="230" y="250" text-anchor="middle" dominant-baseline="central">4. Mesurer plusieurs fois</text>
<text class="ts" x="230" y="270" text-anchor="middle" dominant-baseline="central">au moins 3 essais, noter chaque valeur</text></g>
<g class="node c-blue"><rect x="20" y="304" width="420" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="230" y="322" text-anchor="middle" dominant-baseline="central">5. Calculer la moyenne et conclure</text>
<text class="ts" x="230" y="342" text-anchor="middle" dominant-baseline="central">somme des valeurs ÷ nombre de valeurs, avec l'unité</text></g>

<line x1="230" y1="70" x2="230" y2="84" class="arr" marker-end="url(#fl)"/>
<line x1="230" y1="142" x2="230" y2="156" class="arr" marker-end="url(#fl)"/>
<line x1="230" y1="214" x2="230" y2="228" class="arr" marker-end="url(#fl)"/>
<line x1="230" y1="286" x2="230" y2="300" class="arr" marker-end="url(#fl)"/>

<g class="c-gray"><rect x="470" y="16" width="190" height="340" rx="10" stroke-width="0.5"/>
<text class="th" x="565" y="40" text-anchor="middle" dominant-baseline="central">Critères de</text>
<text class="th" x="565" y="58" text-anchor="middle" dominant-baseline="central">performance</text>
<text class="t" x="565" y="96" text-anchor="middle" dominant-baseline="central">vitesse</text>
<text class="ts" x="565" y="114" text-anchor="middle" dominant-baseline="central">m/s ou km/h</text>
<text class="t" x="565" y="148" text-anchor="middle" dominant-baseline="central">autonomie</text>
<text class="ts" x="565" y="166" text-anchor="middle" dominant-baseline="central">km ou h</text>
<text class="t" x="565" y="200" text-anchor="middle" dominant-baseline="central">force exercée</text>
<text class="ts" x="565" y="218" text-anchor="middle" dominant-baseline="central">N</text>
<text class="t" x="565" y="252" text-anchor="middle" dominant-baseline="central">puissance</text>
<text class="ts" x="565" y="270" text-anchor="middle" dominant-baseline="central">W</text>
<text class="t" x="565" y="304" text-anchor="middle" dominant-baseline="central">masse</text>
<text class="ts" x="565" y="322" text-anchor="middle" dominant-baseline="central">kg ou g</text></g>
</svg>
