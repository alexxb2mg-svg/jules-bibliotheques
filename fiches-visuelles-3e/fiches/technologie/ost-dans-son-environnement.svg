<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<g fill="none" stroke="#88877f" stroke-width="1.5">
<line x1="200" y1="284" x2="285" y2="232"/>
<line x1="480" y1="284" x2="395" y2="232"/>
</g>
<path d="M 115 96 C 200 200 480 200 565 96" fill="none" stroke="#185FA5" stroke-width="2" stroke-dasharray="6 4"/>

<g class="node c-gray"><ellipse cx="340" cy="200" rx="100" ry="42" stroke-width="0.5"/>
<text class="th" x="340" y="192" text-anchor="middle" dominant-baseline="central">Manette de jeu</text>
<text class="ts" x="340" y="212" text-anchor="middle" dominant-baseline="central">l'OST étudié</text></g>

<g class="node c-blue"><rect x="20" y="30" width="190" height="66" rx="10" stroke-width="0.5"/>
<text class="th" x="115" y="50" text-anchor="middle" dominant-baseline="central">Utilisateur</text>
<text class="ts" x="115" y="70" text-anchor="middle" dominant-baseline="central">enfant ou adulte,</text>
<text class="ts" x="115" y="86" text-anchor="middle" dominant-baseline="central">petite ou grande main</text></g>

<g class="node c-teal"><rect x="470" y="30" width="190" height="66" rx="10" stroke-width="0.5"/>
<text class="th" x="565" y="50" text-anchor="middle" dominant-baseline="central">Autres objets</text>
<text class="ts" x="565" y="70" text-anchor="middle" dominant-baseline="central">console (sans fil ou câble),</text>
<text class="ts" x="565" y="86" text-anchor="middle" dominant-baseline="central">chargeur</text></g>

<g class="node c-teal"><rect x="20" y="284" width="190" height="66" rx="10" stroke-width="0.5"/>
<text class="th" x="115" y="304" text-anchor="middle" dominant-baseline="central">Milieu</text>
<text class="ts" x="115" y="324" text-anchor="middle" dominant-baseline="central">chutes, sueur des mains,</text>
<text class="ts" x="115" y="340" text-anchor="middle" dominant-baseline="central">poussière, chaleur</text></g>

<g class="node c-teal"><rect x="470" y="284" width="190" height="66" rx="10" stroke-width="0.5"/>
<text class="th" x="565" y="304" text-anchor="middle" dominant-baseline="central">Données</text>
<text class="ts" x="565" y="324" text-anchor="middle" dominant-baseline="central">boutons appuyés, vibrations,</text>
<text class="ts" x="565" y="340" text-anchor="middle" dominant-baseline="central">niveau de batterie</text></g>

<text class="ts" x="340" y="46" text-anchor="middle" fill="#185FA5">fonction d'usage (en tirets) :</text>
<text class="ts" x="340" y="64" text-anchor="middle" fill="#185FA5">permettre à l'utilisateur</text>
<text class="ts" x="340" y="82" text-anchor="middle" fill="#185FA5">de commander la console</text>
<text class="ts" x="235" y="262" text-anchor="end">résister aux chocs</text>
<text class="ts" x="445" y="262">échanger des informations</text>

<g class="node c-coral"><rect x="20" y="368" width="640" height="58" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="388" text-anchor="middle" dominant-baseline="central">Contraintes : ergonomie, sécurité, normes, coût, masse</text>
<text class="ts" x="340" y="408" text-anchor="middle" dominant-baseline="central">boutons atteignables sans effort · manette légère pour jouer longtemps · piles bien protégées</text></g>
</svg>
