<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projet en groupe : les étapes du projet et les trois piliers du développement durable">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-green"><text class="th" x="340" y="18" text-anchor="middle" dominant-baseline="central">Les trois piliers du développement durable</text></g>
<g class="c-green"><rect x="20" y="36" width="188" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="114" y="56" text-anchor="middle" dominant-baseline="central">Environnemental</text>
<text class="ts" x="114" y="76" text-anchor="middle" dominant-baseline="central">préserver les ressources,</text>
<text class="ts" x="114" y="92" text-anchor="middle" dominant-baseline="central">limiter déchets et pollution</text></g>
<g class="c-green"><rect x="246" y="36" width="188" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="56" text-anchor="middle" dominant-baseline="central">Économique</text>
<text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">coût raisonnable,</text>
<text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">objet qui dure longtemps</text></g>
<g class="c-green"><rect x="472" y="36" width="188" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="566" y="56" text-anchor="middle" dominant-baseline="central">Social</text>
<text class="ts" x="566" y="76" text-anchor="middle" dominant-baseline="central">sécurité, santé,</text>
<text class="ts" x="566" y="92" text-anchor="middle" dominant-baseline="central">utile et accessible à tous</text></g>

<g class="c-green"><text class="ts" x="340" y="134" text-anchor="middle" dominant-baseline="central">pris en compte aux étapes 1, 3 et 5 du projet</text></g>
<path d="M78 146 V194" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 146 V194" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M602 146 V194" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="78" y1="146" x2="602" y2="146" stroke="#3B6D11" stroke-width="1.5"/>

<g class="c-blue"><rect x="20" y="198" width="116" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="78" y="218" text-anchor="middle" dominant-baseline="central">1. Besoin</text>
<text class="ts" x="78" y="238" text-anchor="middle" dominant-baseline="central">exigences et</text>
<text class="ts" x="78" y="254" text-anchor="middle" dominant-baseline="central">critères durables</text></g>
<line x1="137" y1="236" x2="149" y2="236" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="151" y="198" width="116" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="209" y="218" text-anchor="middle" dominant-baseline="central">2. Organisation</text>
<text class="ts" x="209" y="238" text-anchor="middle" dominant-baseline="central">tâches, rôles,</text>
<text class="ts" x="209" y="254" text-anchor="middle" dominant-baseline="central">planning, jalons</text></g>
<line x1="268" y1="236" x2="280" y2="236" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="282" y="198" width="116" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="218" text-anchor="middle" dominant-baseline="central">3. Conception</text>
<text class="ts" x="340" y="238" text-anchor="middle" dominant-baseline="central">choix justifiés</text>
<text class="ts" x="340" y="254" text-anchor="middle" dominant-baseline="central">par un pilier</text></g>
<line x1="399" y1="236" x2="411" y2="236" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="413" y="198" width="116" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="471" y="218" text-anchor="middle" dominant-baseline="central">4. Réalisation</text>
<text class="ts" x="471" y="238" text-anchor="middle" dominant-baseline="central">fabriquer le</text>
<text class="ts" x="471" y="254" text-anchor="middle" dominant-baseline="central">prototype, tester</text></g>
<line x1="530" y1="236" x2="542" y2="236" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="544" y="198" width="116" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="602" y="218" text-anchor="middle" dominant-baseline="central">5. Évaluation</text>
<text class="ts" x="602" y="238" text-anchor="middle" dominant-baseline="central">fonctions et</text>
<text class="ts" x="602" y="254" text-anchor="middle" dominant-baseline="central">critères durables</text></g>
<g class="c-blue"><text class="ts" x="340" y="294" text-anchor="middle" dominant-baseline="central">Gestion de projet en groupe : des revues de projet aux jalons pour suivre l'avancement.</text></g>

<g class="c-gray"><rect x="20" y="318" width="640" height="92" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">Choisir une thématique : les 17 objectifs de développement durable (ONU, 2015)</text>
<text class="ts" x="340" y="358" text-anchor="middle" dominant-baseline="central">par exemple : n° 6 eau propre, n° 7 énergie propre,</text>
<text class="ts" x="340" y="376" text-anchor="middle" dominant-baseline="central">n° 12 consommation et production responsables,</text>
<text class="ts" x="340" y="394" text-anchor="middle" dominant-baseline="central">n° 13 lutte contre les changements climatiques</text></g>
</svg>
