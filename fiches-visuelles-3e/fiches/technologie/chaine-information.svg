<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<title>Chaîne d'information d'une veilleuse automatique</title>
<desc>La lumière ambiante est acquise par un capteur de luminosité, traitée par le microcontrôleur, puis communiquée par un voyant. Le microcontrôleur envoie un ordre à la chaîne d'énergie qui allume la LED. En bas, la grandeur analogique devient un nombre entier entre 0 et 1023.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="24" text-anchor="middle">Chaîne d'information d'une veilleuse automatique</text>
<g class="c-gray"><rect x="16" y="56" width="110" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="71" y="76" text-anchor="middle" dominant-baseline="central">lumière</text>
<text class="t" x="71" y="96" text-anchor="middle" dominant-baseline="central">ambiante</text></g>
<g class="node c-blue"><rect x="160" y="44" width="140" height="84" rx="8" stroke-width="0.5"/>
<text class="th" x="230" y="66" text-anchor="middle" dominant-baseline="central">ACQUÉRIR</text>
<text class="ts" x="230" y="90" text-anchor="middle" dominant-baseline="central">capteur de</text>
<text class="ts" x="230" y="106" text-anchor="middle" dominant-baseline="central">luminosité</text></g>
<g class="node c-blue"><rect x="340" y="44" width="140" height="84" rx="8" stroke-width="0.5"/>
<text class="th" x="410" y="66" text-anchor="middle" dominant-baseline="central">TRAITER</text>
<text class="ts" x="410" y="90" text-anchor="middle" dominant-baseline="central">microcontrôleur</text>
<text class="ts" x="410" y="106" text-anchor="middle" dominant-baseline="central">(carte Arduino)</text></g>
<g class="node c-blue"><rect x="520" y="44" width="144" height="84" rx="8" stroke-width="0.5"/>
<text class="th" x="592" y="66" text-anchor="middle" dominant-baseline="central">COMMUNIQUER</text>
<text class="ts" x="592" y="90" text-anchor="middle" dominant-baseline="central">voyant « marche »</text>
<text class="ts" x="592" y="106" text-anchor="middle" dominant-baseline="central">(IHM)</text></g>
<line x1="126" y1="86" x2="158" y2="86" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="86" x2="338" y2="86" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="86" x2="518" y2="86" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="ts" x="320" y="148" text-anchor="middle">donnée</text>
<text class="ts" x="500" y="148" text-anchor="middle">message</text></g>
<g class="c-gray"><rect x="160" y="190" width="140" height="50" rx="8" stroke-width="0.5"/>
<text class="t" x="230" y="207" text-anchor="middle" dominant-baseline="central">bouton marche</text>
<text class="ts" x="230" y="226" text-anchor="middle" dominant-baseline="central">(IHM : l'utilisateur)</text></g>
<line x1="230" y1="190" x2="230" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="128" x2="410" y2="188" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="ts" x="420" y="166">ordre « allumer »</text></g>
<g class="node c-coral"><rect x="340" y="190" width="324" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="502" y="207" text-anchor="middle" dominant-baseline="central">Chaîne d'énergie : distribuer → convertir</text>
<text class="ts" x="502" y="226" text-anchor="middle" dominant-baseline="central">la LED transforme l'énergie électrique en lumière</text></g>
<line x1="16" y1="266" x2="664" y2="266" class="leader"/>
<text class="th" x="340" y="290" text-anchor="middle">D'une grandeur analogique à une donnée exploitable</text>
<g class="c-gray"><rect x="16" y="306" width="190" height="62" rx="8" stroke-width="0.5"/>
<text class="t" x="111" y="326" text-anchor="middle" dominant-baseline="central">luminosité</text>
<text class="ts" x="111" y="348" text-anchor="middle" dominant-baseline="central">varie en continu</text></g>
<g class="c-blue"><rect x="245" y="306" width="190" height="62" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="326" text-anchor="middle" dominant-baseline="central">tension électrique</text>
<text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">entre 0 V et 5 V</text></g>
<g class="c-blue"><rect x="474" y="306" width="190" height="62" rx="8" stroke-width="0.5"/>
<text class="t" x="569" y="326" text-anchor="middle" dominant-baseline="central">nombre entier</text>
<text class="ts" x="569" y="348" text-anchor="middle" dominant-baseline="central">de 0 à 1023 (sur 10 bits)</text></g>
<line x1="206" y1="337" x2="243" y2="337" class="arr" marker-end="url(#arrow)"/>
<line x1="435" y1="337" x2="472" y2="337" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="225" y="392" text-anchor="middle">capteur</text>
<text class="ts" x="454" y="392" text-anchor="middle">microcontrôleur</text>
<text class="ts" x="340" y="412" text-anchor="middle">Exemple d'une carte Arduino Uno ; bleu : information, corail : énergie.</text>
</svg>
