<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un script par blocs et les données qu'il utilise et produit">
<text class="th" x="20" y="22" text-anchor="start" dominant-baseline="central">Le script (blocs)</text>
<g class="c-amber"><rect x="20" y="40" width="260" height="32" rx="8" stroke-width="0.5"/>
<text class="t" x="150" y="56" text-anchor="middle" dominant-baseline="central">quand le drapeau est cliqué</text></g>
<g class="c-blue"><rect x="20" y="80" width="260" height="32" rx="8" stroke-width="0.5"/>
<text class="t" x="150" y="96" text-anchor="middle" dominant-baseline="central">mettre score à 0</text></g>

<rect x="20" y="120" width="370" height="232" rx="10" fill="#FFFBF2" stroke="#854F0B" stroke-width="1.5"/>
<text class="th" x="34" y="138" text-anchor="start" dominant-baseline="central" fill="#633806">répéter indéfiniment</text>

<rect x="36" y="152" width="340" height="84" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="t" x="50" y="170" text-anchor="start" dominant-baseline="central" fill="#633806">si  touche le bonus ?  alors</text>
<g class="c-blue"><rect x="56" y="188" width="240" height="32" rx="8" stroke-width="0.5"/>
<text class="t" x="176" y="204" text-anchor="middle" dominant-baseline="central">ajouter 1 à score</text></g>

<rect x="36" y="248" width="340" height="88" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="t" x="50" y="266" text-anchor="start" dominant-baseline="central" fill="#633806">si  score &gt; 10  alors</text>
<g class="c-teal"><rect x="56" y="286" width="240" height="32" rx="8" stroke-width="0.5"/>
<text class="t" x="176" y="302" text-anchor="middle" dominant-baseline="central">dire « Bravo ! »</text></g>

<text class="th" x="430" y="22" text-anchor="start" dominant-baseline="central">Les données</text>
<g class="c-amber"><rect x="430" y="40" width="230" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="59" text-anchor="middle" dominant-baseline="central">Événement</text>
<text class="ts" x="545" y="78" text-anchor="middle" dominant-baseline="central">le clic sur le drapeau lance tout</text></g>
<g class="c-blue"><rect x="430" y="108" width="230" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="127" text-anchor="middle" dominant-baseline="central">Entrée lue</text>
<text class="ts" x="545" y="146" text-anchor="middle" dominant-baseline="central">« touche le bonus ? » : un booléen</text></g>
<g class="c-blue"><rect x="430" y="176" width="230" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="195" text-anchor="middle" dominant-baseline="central">Variable mémorisée</text>
<text class="ts" x="545" y="214" text-anchor="middle" dominant-baseline="central">score : un nombre, 0 au départ</text></g>
<g class="c-teal"><rect x="430" y="244" width="230" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="263" text-anchor="middle" dominant-baseline="central">Sortie produite</text>
<text class="ts" x="545" y="282" text-anchor="middle" dominant-baseline="central">le message « Bravo ! » : un mot</text></g>
<line x1="282" y1="56" x2="428" y2="68" class="leader"/>
<line x1="236" y1="170" x2="428" y2="136" class="leader"/>
<line x1="298" y1="204" x2="428" y2="204" class="leader"/>
<line x1="298" y1="302" x2="428" y2="272" class="leader"/>

<g class="c-gray"><rect x="20" y="368" width="640" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="388" text-anchor="middle" dominant-baseline="central">Orange : événement et contrôle (boucle, condition) · Bleu : données · Vert : sortie produite</text></g>
</svg>
