<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les modes de sollicitation d'une pièce et les indices énergétique et de réparabilité">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="95" y="24" text-anchor="middle" dominant-baseline="central">Traction</text>
<rect x="55" y="82" width="80" height="16" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<line x1="55" y1="90" x2="25" y2="90" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="135" y1="90" x2="165" y2="90" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="95" y="140" text-anchor="middle" dominant-baseline="central">on étire la pièce</text>
<text class="ts" x="95" y="158" text-anchor="middle" dominant-baseline="central">ex. : câble, corde</text>

<text class="th" x="258" y="24" text-anchor="middle" dominant-baseline="central">Compression</text>
<rect x="218" y="82" width="80" height="16" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<line x1="188" y1="90" x2="216" y2="90" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="328" y1="90" x2="300" y2="90" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="258" y="140" text-anchor="middle" dominant-baseline="central">on écrase la pièce</text>
<text class="ts" x="258" y="158" text-anchor="middle" dominant-baseline="central">ex. : pied de table</text>

<text class="th" x="421" y="24" text-anchor="middle" dominant-baseline="central">Flexion</text>
<path d="M366 84 Q421 104 476 84 L476 96 Q421 116 366 96 Z" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="366,96 358,112 374,112" fill="#d3d1c7" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="476,96 468,112 484,112" fill="#d3d1c7" stroke="#5F5E5A" stroke-width="1"/>
<line x1="421" y1="50" x2="421" y2="90" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="421" y="140" text-anchor="middle" dominant-baseline="central">la pièce se courbe</text>
<text class="ts" x="421" y="158" text-anchor="middle" dominant-baseline="central">ex. : étagère, plongeoir</text>

<text class="th" x="584" y="24" text-anchor="middle" dominant-baseline="central">Torsion</text>
<rect x="544" y="82" width="80" height="16" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<path d="M538 70 A12 22 0 0 0 538 110" fill="none" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M630 110 A12 22 0 0 0 630 70" fill="none" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="584" y="140" text-anchor="middle" dominant-baseline="central">on tord la pièce</text>
<text class="ts" x="584" y="158" text-anchor="middle" dominant-baseline="central">ex. : tournevis, clé</text>

<line x1="176" y1="40" x2="176" y2="170" stroke="#d3d1c7" stroke-width="1"/>
<line x1="339" y1="40" x2="339" y2="170" stroke="#d3d1c7" stroke-width="1"/>
<line x1="502" y1="40" x2="502" y2="170" stroke="#d3d1c7" stroke-width="1"/>
<text class="ts" x="340" y="190" text-anchor="middle" dominant-baseline="central">Flèches : les efforts (forces) subis par la pièce. Pas à l'échelle.</text>

<g class="c-blue"><rect x="20" y="214" width="310" height="126" rx="8" stroke-width="0.5"/>
<text class="th" x="175" y="236" text-anchor="middle" dominant-baseline="central">Indice énergétique</text>
<text class="ts" x="175" y="258" text-anchor="middle" dominant-baseline="central">étiquette énergie : classes de A à G</text>
<text class="ts" x="175" y="278" text-anchor="middle" dominant-baseline="central">A = l'appareil le plus économe</text>
<text class="ts" x="175" y="298" text-anchor="middle" dominant-baseline="central">G = le plus gourmand en énergie</text>
<text class="ts" x="175" y="318" text-anchor="middle" dominant-baseline="central">avec la consommation annuelle en kWh</text></g>
<g class="c-blue"><rect x="350" y="214" width="310" height="126" rx="8" stroke-width="0.5"/>
<text class="th" x="505" y="236" text-anchor="middle" dominant-baseline="central">Indice de réparabilité</text>
<text class="ts" x="505" y="258" text-anchor="middle" dominant-baseline="central">une note sur 10</text>
<text class="ts" x="505" y="278" text-anchor="middle" dominant-baseline="central">plus elle est haute, plus l'objet</text>
<text class="ts" x="505" y="298" text-anchor="middle" dominant-baseline="central">est facile à réparer : démontage,</text>
<text class="ts" x="505" y="318" text-anchor="middle" dominant-baseline="central">pièces détachées, documentation</text></g>
</svg>
