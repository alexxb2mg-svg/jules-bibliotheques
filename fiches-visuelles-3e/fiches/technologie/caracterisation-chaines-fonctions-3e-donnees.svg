<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg">
<title>Le parcours d'une donnée, de la mesure à Internet</title>
<desc>Une station météo connectée numérise la température, la stocke en mémoire, la met en forme puis la transmet sur Internet en paquets jusqu'à un serveur et un smartphone.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="22" text-anchor="middle">Station météo connectée : le parcours d'une mesure</text>
<g class="node c-blue"><rect x="10" y="44" width="148" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="84" y="64" text-anchor="middle" dominant-baseline="central">1. Numériser</text>
<text class="ts" x="84" y="88" text-anchor="middle" dominant-baseline="central">capteur : 21 °C</text>
<text class="ts" x="84" y="106" text-anchor="middle" dominant-baseline="central">→ nombre en bits</text></g>
<g class="node c-blue"><rect x="182" y="44" width="148" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="256" y="64" text-anchor="middle" dominant-baseline="central">2. Stocker</text>
<text class="ts" x="256" y="88" text-anchor="middle" dominant-baseline="central">en mémoire,</text>
<text class="ts" x="256" y="106" text-anchor="middle" dominant-baseline="central">en octets</text></g>
<g class="node c-blue"><rect x="354" y="44" width="148" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="428" y="64" text-anchor="middle" dominant-baseline="central">3. Mettre en forme</text>
<text class="ts" x="428" y="88" text-anchor="middle" dominant-baseline="central">tableau horodaté,</text>
<text class="ts" x="428" y="106" text-anchor="middle" dominant-baseline="central">graphique</text></g>
<g class="node c-blue"><rect x="526" y="44" width="144" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="598" y="64" text-anchor="middle" dominant-baseline="central">4. Transmettre</text>
<text class="ts" x="598" y="88" text-anchor="middle" dominant-baseline="central">en paquets,</text>
<text class="ts" x="598" y="106" text-anchor="middle" dominant-baseline="central">par Internet</text></g>
<line x1="158" y1="84" x2="180" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="330" y1="84" x2="352" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="502" y1="84" x2="524" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="598" y1="124" x2="598" y2="162" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="470" y="164" width="200" height="50" rx="8" stroke-width="0.5"/>
<text class="t" x="570" y="181" text-anchor="middle" dominant-baseline="central">serveur → smartphone</text>
<text class="ts" x="570" y="200" text-anchor="middle" dominant-baseline="central">la mesure s'affiche à distance</text></g>
<g class="c-gray"><rect x="10" y="164" width="440" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="230" y="184" text-anchor="middle" dominant-baseline="central">Des données de toutes natures</text>
<text class="ts" x="230" y="208" text-anchor="middle" dominant-baseline="central">texte, nombre, son, image, mesure d'un capteur :</text>
<text class="ts" x="230" y="226" text-anchor="middle" dominant-baseline="central">toutes sont codées en bits (0 et 1) pour être</text>
<text class="ts" x="230" y="244" text-anchor="middle" dominant-baseline="central">stockées, traitées et transmises.</text></g>
</svg>
