<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Algorigramme : le robot avance jusqu'à l'obstacle">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="180" y="16" width="120" height="36" rx="18" stroke-width="0.8"/>
<text class="th" x="240" y="34" text-anchor="middle" dominant-baseline="central">Début</text></g>
<line x1="240" y1="52" x2="240" y2="76" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="140" y="78" width="200" height="40" rx="4" stroke-width="0.8"/>
<text class="t" x="240" y="98" text-anchor="middle" dominant-baseline="central">démarrer les moteurs</text></g>
<line x1="240" y1="118" x2="240" y2="146" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="140" y="148" width="200" height="40" rx="4" stroke-width="0.8"/>
<text class="t" x="240" y="168" text-anchor="middle" dominant-baseline="central">mesurer la distance</text></g>
<line x1="240" y1="188" x2="240" y2="218" class="arr" marker-end="url(#arrow)"/>
<polygon points="240,220 360,272 240,324 120,272" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text class="th" x="240" y="264" text-anchor="middle" dominant-baseline="central" fill="#633806">distance</text>
<text class="th" x="240" y="283" text-anchor="middle" dominant-baseline="central" fill="#633806">&lt; 10 cm ?</text>

<path d="M120 272 H60 V168 H138" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="th" x="90" y="258" text-anchor="middle" dominant-baseline="central" fill="#633806">non</text>
<text class="ts" x="52" y="215" text-anchor="end" dominant-baseline="central">boucle</text>

<line x1="240" y1="324" x2="240" y2="356" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="252" y="340" text-anchor="start" dominant-baseline="central" fill="#633806">oui</text>
<g class="c-blue"><rect x="140" y="358" width="200" height="40" rx="4" stroke-width="0.8"/>
<text class="t" x="240" y="378" text-anchor="middle" dominant-baseline="central">arrêter les moteurs</text></g>
<line x1="240" y1="398" x2="240" y2="418" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="180" y="420" width="120" height="36" rx="18" stroke-width="0.8"/>
<text class="th" x="240" y="438" text-anchor="middle" dominant-baseline="central">Fin</text></g>

<text class="th" x="420" y="34" text-anchor="start" dominant-baseline="central">Les symboles</text>
<g class="c-gray"><rect x="420" y="60" width="70" height="30" rx="15" stroke-width="0.8"/></g>
<text class="t" x="505" y="75" text-anchor="start" dominant-baseline="central">début ou fin</text>
<g class="c-blue"><rect x="420" y="110" width="70" height="30" rx="4" stroke-width="0.8"/></g>
<text class="t" x="505" y="125" text-anchor="start" dominant-baseline="central">action (instruction)</text>
<polygon points="455,158 490,178 455,198 420,178" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text class="t" x="505" y="178" text-anchor="start" dominant-baseline="central">test : oui ou non</text>
<line x1="420" y1="228" x2="488" y2="228" class="arr" marker-end="url(#arrow)"/>
<text class="t" x="505" y="228" text-anchor="start" dominant-baseline="central">ordre de lecture</text>

<g class="c-amber"><rect x="410" y="270" width="250" height="110" rx="8" stroke-width="0.5"/>
<text class="th" x="535" y="292" text-anchor="middle" dominant-baseline="central">Condition d'arrêt</text>
<text class="ts" x="535" y="316" text-anchor="middle" dominant-baseline="central">Tant que la réponse est « non »,</text>
<text class="ts" x="535" y="334" text-anchor="middle" dominant-baseline="central">le robot avance et mesure encore.</text>
<text class="ts" x="535" y="352" text-anchor="middle" dominant-baseline="central">Elle finit par être « oui » :</text>
<text class="ts" x="535" y="368" text-anchor="middle" dominant-baseline="central">l'algorithme se termine.</text></g>
</svg>
