blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: ost, titre: "Un OST évolue", sous_titre: "pour mieux répondre à un besoin", principal: true}
      - {id: besoin, titre: "Besoin et contraintes", sous_titre: "coût, environnement, lois, usagers"}
      - {id: inno, titre: "Invention puis innovation", sous_titre: "d'usage ou de rupture"}
      - {id: lignee, titre: "Lignée d'objets", sous_titre: "même besoin, générations successives"}
      - {id: ia, titre: "Intelligence artificielle", sous_titre: "apprend sur des données, peut avoir des biais"}
    liens:
      - {de: besoin, vers: ost, libelle: "motive"}
      - {de: ost, vers: inno}
      - {de: inno, vers: lignee, libelle: "forme"}
      - {de: ost, vers: ia}
    jules: "Une évolution technique se justifie toujours par un **besoin** nouveau ou mieux satisfait, ou par une **contrainte** mieux gérée : jamais par la technique pour la technique."

  - id: schema-lignee
    type: schema
    titre: "La lignée du téléphone : une même fonction, des principes techniques qui changent"
    svg: "evolution-des-ost.svg"
    jules: "La **fonction technique** reste la même (transmettre la voix à distance) ; c'est le **principe technique** qui change : le fil, puis les ondes radio. Dates arrondies, pour situer les générations."

  - id: schema-ia
    type: schema
    titre: "Comment une IA apprend, et d'où vient un biais"
    svg: "evolution-des-ost-ia.svg"
    jules: "Une IA ne **comprend** pas comme toi : elle calcule la réponse la plus probable à partir de ses données. Elle peut donc **halluciner**, c'est-à-dire inventer une réponse fausse avec assurance."

  - id: methode
    type: methode
    etapes:
      - "Situer l'OST dans sa **lignée** : chercher ses ancêtres directs et noter ce que chaque génération garde et ce qu'elle change."
      - "Pour chaque évolution, nommer le **besoin** mieux satisfait ou la **contrainte** mieux gérée (sécurité, coût, confort, environnement)."
      - "Dire s'il s'agit d'une **invention** (première solution technique) ou d'une **innovation** (solution améliorée et diffusée à grande échelle)."
      - "Classer l'innovation : **d'usage** si elle change la façon d'utiliser l'objet, **de rupture** si elle change radicalement le principe technique."
      - "Pour une IA : nommer la tâche, les **données d'entraînement**, un avantage et un risque (biais, erreur, dépendance)."
    jules: "Pour comparer deux principes techniques, garde la même fonction : « transmettre la voix » par un fil ou par des ondes radio, ce sont deux **principes** pour une seule **fonction**."

  - id: piege
    type: piege
    mauvaise_idee: "Une **invention** et une **innovation**, c'est la même chose : une nouvelle idée technique."
    pourquoi_faux: "L'invention est la **première réalisation** d'une solution nouvelle. Elle ne devient une innovation que si elle est améliorée, produite et **diffusée à grande échelle**."
    bonne_idee: "Invention = la solution existe pour la première fois. Innovation = elle réussit et se répand auprès des utilisateurs. Toute invention ne devient pas une innovation."
    jules: "Une invention peut rester un prototype si elle coûte trop cher, si les gens ne l'adoptent pas ou si la loi l'interdit : ce sont les **contraintes sociétales**."

  - id: exemple-velo
    type: exemple
    situation: "Le vélo est passé du grand-bi (roue avant immense, pédales fixées sur cette roue) au vélo à pédalier et chaîne, puis au **vélo à assistance électrique**."
    calcul: "Grand-bi vers vélo à chaîne : roues de taille raisonnable, donc plus sûr ; la chaîne fait tourner la roue plus vite que le pédalier. Vélo à chaîne vers assistance électrique : un moteur et une batterie réduisent l'effort."
    conclusion: "Chaque génération garde la fonction (se déplacer en pédalant) et répond mieux à un besoin : **sécurité**, puis **moins d'effort** pour de plus longues distances et les côtes."
    jules: "La chaîne est une innovation qui change le principe de transmission ; l'assistance électrique ajoute une **chaîne d'énergie** (batterie, moteur) sans supprimer le pédalage."

  - id: exemple-ia
    type: exemple
    situation: "Un assistant vocal de smartphone utilise une IA pour comprendre des phrases prononcées. Innovation ou invention ? Un avantage, un risque ?"
    calcul: "Il combine des techniques déjà connues (microphone, traitement du son, réseau de neurones) pour un nouvel usage, diffusé à très grande échelle."
    conclusion: "C'est une **innovation**. Avantage : accès mains libres à des services (itinéraire, recherche). Risque : il comprend moins bien un accent peu présent dans ses données (**biais**) ou répond faux avec assurance."
    jules: "Le bon réflexe face à une réponse d'IA : la **vérifier** avec une autre source, surtout pour une date, un chiffre ou un conseil de santé."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi sur une autre lignée : lampe à incandescence, puis lampe fluocompacte, puis **LED** ; même fonction (éclairer), consommation d'énergie de plus en plus faible."
