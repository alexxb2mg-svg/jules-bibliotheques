<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arbre de choix : matériau, source d'énergie, assemblage">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="20" y="14" width="640" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="36" text-anchor="middle" dominant-baseline="central">Objet à concevoir : partir des contraintes du cahier des charges</text></g>
<line x1="120" y1="58" x2="120" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="58" x2="340" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="58" x2="560" y2="84" class="arr" marker-end="url(#arrow)"/>

<g class="c-green"><rect x="20" y="86" width="200" height="36" rx="8" stroke-width="1"/>
<text class="th" x="120" y="104" text-anchor="middle" dominant-baseline="central">Matériau</text></g>
<g class="c-coral"><rect x="240" y="86" width="200" height="36" rx="8" stroke-width="1"/>
<text class="th" x="340" y="104" text-anchor="middle" dominant-baseline="central">Source d'énergie</text></g>
<g class="c-blue"><rect x="460" y="86" width="200" height="36" rx="8" stroke-width="1"/>
<text class="th" x="560" y="104" text-anchor="middle" dominant-baseline="central">Assemblage</text></g>

<g class="c-green"><rect x="20" y="140" width="200" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="158" text-anchor="middle" dominant-baseline="central">Critères</text>
<text class="ts" x="120" y="178" text-anchor="middle" dominant-baseline="central">résistance, masse,</text>
<text class="ts" x="120" y="194" text-anchor="middle" dominant-baseline="central">coût, environnement</text></g>
<line x1="120" y1="206" x2="120" y2="224" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="20" y="226" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="244" text-anchor="middle" dominant-baseline="central">Familles</text>
<text class="ts" x="120" y="264" text-anchor="middle" dominant-baseline="central">métaux, plastiques,</text>
<text class="ts" x="120" y="280" text-anchor="middle" dominant-baseline="central">bois, composites…</text></g>
<g class="c-green"><text class="ts" x="120" y="316" text-anchor="middle" dominant-baseline="central">recyclable ou recyclé :</text>
<text class="ts" x="120" y="332" text-anchor="middle" dominant-baseline="central">moins d'impact</text></g>

<polygon points="340,140 420,172 340,204 260,172" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="t" x="340" y="172" text-anchor="middle" dominant-baseline="central">objet mobile ?</text>
<line x1="290" y1="192" x2="288" y2="224" class="arr" marker-end="url(#arrow)"/>
<line x1="390" y1="192" x2="392" y2="224" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="282" y="208" text-anchor="end" dominant-baseline="central">oui</text>
<text class="ts" x="398" y="208" text-anchor="start" dominant-baseline="central">non</text>
<g class="c-coral"><rect x="240" y="226" width="95" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="287" y="244" text-anchor="middle" dominant-baseline="central">embarquée</text>
<text class="ts" x="287" y="264" text-anchor="middle" dominant-baseline="central">pile ou</text>
<text class="ts" x="287" y="280" text-anchor="middle" dominant-baseline="central">batterie</text></g>
<g class="c-coral"><rect x="345" y="226" width="95" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="392" y="244" text-anchor="middle" dominant-baseline="central">secteur</text>
<text class="ts" x="392" y="264" text-anchor="middle" dominant-baseline="central">prise</text>
<text class="ts" x="392" y="280" text-anchor="middle" dominant-baseline="central">230 V</text></g>
<g class="c-coral"><text class="ts" x="340" y="316" text-anchor="middle" dominant-baseline="central">loin d'une prise, longtemps :</text>
<text class="ts" x="340" y="332" text-anchor="middle" dominant-baseline="central">panneau solaire + batterie</text></g>

<polygon points="560,140 640,172 560,204 480,172" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="t" x="560" y="172" text-anchor="middle" dominant-baseline="central">réparable ?</text>
<line x1="510" y1="192" x2="505" y2="224" class="arr" marker-end="url(#arrow)"/>
<line x1="610" y1="192" x2="609" y2="224" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="502" y="208" text-anchor="end" dominant-baseline="central">oui</text>
<text class="ts" x="618" y="208" text-anchor="start" dominant-baseline="central">non</text>
<g class="c-blue"><rect x="460" y="226" width="90" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="505" y="244" text-anchor="middle" dominant-baseline="central">démontable</text>
<text class="ts" x="505" y="264" text-anchor="middle" dominant-baseline="central">vis, écrou,</text>
<text class="ts" x="505" y="280" text-anchor="middle" dominant-baseline="central">clips</text></g>
<g class="c-blue"><rect x="558" y="226" width="102" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="609" y="244" text-anchor="middle" dominant-baseline="central">indémontable</text>
<text class="ts" x="609" y="264" text-anchor="middle" dominant-baseline="central">colle, soudure,</text>
<text class="ts" x="609" y="280" text-anchor="middle" dominant-baseline="central">rivet</text></g>
<g class="c-blue"><text class="ts" x="560" y="316" text-anchor="middle" dominant-baseline="central">démontable : on répare,</text>
<text class="ts" x="560" y="332" text-anchor="middle" dominant-baseline="central">on trie en fin de vie</text></g>

<g class="c-gray"><rect x="20" y="352" width="640" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="371" text-anchor="middle" dominant-baseline="central">Les trois choix se vérifient ensemble</text>
<text class="ts" x="340" y="390" text-anchor="middle" dominant-baseline="central">Exemple : un robot mobile en matériau lourd use plus vite sa batterie ; mieux vaut un matériau léger.</text></g>
</svg>
