<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le même algorithme, en blocs puis en texte">
<text class="th" x="20" y="22" text-anchor="start" dominant-baseline="central">Programmation par blocs</text>
<text class="th" x="370" y="22" text-anchor="start" dominant-baseline="central">Programmation textuelle (Python)</text>

<g class="c-amber"><rect x="20" y="42" width="290" height="34" rx="8" stroke-width="0.5"/>
<text class="t" x="165" y="59" text-anchor="middle" dominant-baseline="central">quand le drapeau est cliqué</text></g>
<g class="c-blue"><rect x="20" y="84" width="290" height="34" rx="8" stroke-width="0.5"/>
<text class="t" x="165" y="101" text-anchor="middle" dominant-baseline="central">démarrer les moteurs</text></g>
<rect x="20" y="126" width="290" height="86" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="t" x="34" y="144" text-anchor="start" dominant-baseline="central">répéter jusqu'à  distance &lt; 10</text>
<g class="c-blue"><rect x="44" y="162" width="220" height="34" rx="8" stroke-width="0.5"/>
<text class="t" x="154" y="179" text-anchor="middle" dominant-baseline="central">avancer</text></g>
<g class="c-blue"><rect x="20" y="220" width="290" height="34" rx="8" stroke-width="0.5"/>
<text class="t" x="165" y="237" text-anchor="middle" dominant-baseline="central">arrêter les moteurs</text></g>

<g class="c-gray"><rect x="370" y="42" width="290" height="212" rx="8" stroke-width="0.5"/></g>
<text class="t code" x="386" y="101" text-anchor="start" dominant-baseline="central">demarrer_moteurs()</text>
<text class="t code" x="386" y="144" text-anchor="start" dominant-baseline="central">while distance() &gt;= 10:</text>
<text class="t code" x="418" y="179" text-anchor="start" dominant-baseline="central">avancer()</text>
<text class="t code" x="386" y="237" text-anchor="start" dominant-baseline="central">arreter_moteurs()</text>
<text class="ts code" x="386" y="62" text-anchor="start" dominant-baseline="central"># programme lancé au démarrage</text>

<line x1="312" y1="101" x2="380" y2="101" class="leader"/>
<line x1="312" y1="144" x2="380" y2="144" class="leader"/>
<line x1="266" y1="179" x2="412" y2="179" class="leader"/>
<line x1="312" y1="237" x2="380" y2="237" class="leader"/>

<g class="c-amber"><rect x="20" y="270" width="640" height="40" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="290" text-anchor="middle" dominant-baseline="central">« répéter jusqu'à distance &lt; 10 » = « tant que distance ≥ 10 » : la condition s'inverse</text></g>
</svg>
