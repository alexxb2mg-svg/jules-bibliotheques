<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="70" width="600" height="40" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="110" y1="60" x2="110" y2="120" stroke="#3B6D11" stroke-width="3"/>
<line x1="570" y1="60" x2="570" y2="120" stroke="#3B6D11" stroke-width="3"/>
<text class="ts" x="110" y="50" text-anchor="middle">départ</text>
<text class="ts" x="570" y="50" text-anchor="middle">arrivée</text>
<rect x="56" y="80" width="46" height="22" rx="6" fill="#378ADD" stroke="#185FA5" stroke-width="1"/>
<circle cx="66" cy="104" r="5" fill="#444441"/>
<circle cx="92" cy="104" r="5" fill="#444441"/>
<line x1="112" y1="140" x2="568" y2="140" class="arr" marker-start="url(#fl)" marker-end="url(#fl)"/>
<text class="th" x="340" y="130" text-anchor="middle">d = 10 m (mètre ruban)</text>
<text class="ts" x="640" y="160" text-anchor="end">Pas à l'échelle</text>

<g class="node c-amber"><rect x="20" y="176" width="300" height="104" rx="10" stroke-width="0.5"/>
<text class="th" x="170" y="196" text-anchor="middle" dominant-baseline="central">Conditions fixées</text>
<text class="ts" x="170" y="218" text-anchor="middle" dominant-baseline="central">même piste plane et même sol</text>
<text class="ts" x="170" y="236" text-anchor="middle" dominant-baseline="central">batterie chargée avant chaque essai</text>
<text class="ts" x="170" y="254" text-anchor="middle" dominant-baseline="central">départ lancé, même opérateur</text></g>

<g class="node c-blue"><rect x="360" y="176" width="300" height="104" rx="10" stroke-width="0.5"/>
<text class="th" x="510" y="196" text-anchor="middle" dominant-baseline="central">Mesures au chronomètre</text>
<text class="t" x="510" y="220" text-anchor="middle" dominant-baseline="central">essai 1 : 2,4 s</text>
<text class="t" x="510" y="240" text-anchor="middle" dominant-baseline="central">essai 2 : 2,6 s</text>
<text class="t" x="510" y="260" text-anchor="middle" dominant-baseline="central">essai 3 : 2,5 s</text></g>

<g class="node c-blue"><rect x="20" y="300" width="640" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="320" text-anchor="middle" dominant-baseline="central">Durée moyenne : (2,4 + 2,6 + 2,5) ÷ 3 = 7,5 ÷ 3 = 2,5 s</text>
<text class="ts" x="340" y="340" text-anchor="middle" dominant-baseline="central">la moyenne limite l'effet d'une erreur de mesure</text></g>

<g class="c-gray"><rect x="20" y="370" width="640" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="390" text-anchor="middle" dominant-baseline="central">Vitesse : v = d ÷ t = 10 ÷ 2,5 = 4 m/s</text>
<text class="ts" x="340" y="410" text-anchor="middle" dominant-baseline="central">résultat avec son unité, dans les conditions indiquées</text></g>
</svg>
