<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
<title>Familles de matériaux et procédés de mise en forme</title>
<desc>En haut, les quatre familles de matériaux avec des exemples. Au milieu, quatre procédés de mise en forme et la forme qu'ils donnent. En bas, le comportement d'un matériau quand la contrainte augmente : élastique, plastique, rupture.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="22" text-anchor="middle">Le matériau : de quoi la pièce est faite</text>
<g class="node c-blue"><rect x="20" y="36" width="150" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="56" text-anchor="middle" dominant-baseline="central">Métalliques</text>
<text class="ts" x="95" y="80" text-anchor="middle" dominant-baseline="central">acier, aluminium</text></g>
<g class="node c-blue"><rect x="180" y="36" width="150" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="255" y="56" text-anchor="middle" dominant-baseline="central">Organiques</text>
<text class="ts" x="255" y="80" text-anchor="middle" dominant-baseline="central">bois, plastiques, cuir</text></g>
<g class="node c-blue"><rect x="340" y="36" width="150" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="415" y="56" text-anchor="middle" dominant-baseline="central">Minéraux</text>
<text class="ts" x="415" y="80" text-anchor="middle" dominant-baseline="central">verre, céramique, pierre</text></g>
<g class="node c-blue"><rect x="500" y="36" width="160" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="56" text-anchor="middle" dominant-baseline="central">Composites</text>
<text class="ts" x="580" y="80" text-anchor="middle" dominant-baseline="central">béton armé, fibre carbone</text></g>
<text class="th" x="340" y="130" text-anchor="middle">Le procédé : comment on lui donne sa forme</text>
<g class="node c-amber"><rect x="20" y="144" width="150" height="104" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="164" text-anchor="middle" dominant-baseline="central">Enlever</text>
<text class="ts" x="95" y="186" text-anchor="middle" dominant-baseline="central">découpe, perçage,</text>
<text class="ts" x="95" y="202" text-anchor="middle" dominant-baseline="central">usinage CNC</text>
<text class="ts" x="95" y="226" text-anchor="middle" dominant-baseline="central">bloc → pièce</text></g>
<g class="node c-amber"><rect x="180" y="144" width="150" height="104" rx="8" stroke-width="0.5"/>
<text class="th" x="255" y="164" text-anchor="middle" dominant-baseline="central">Ajouter</text>
<text class="ts" x="255" y="186" text-anchor="middle" dominant-baseline="central">impression 3D</text>
<text class="ts" x="255" y="202" text-anchor="middle" dominant-baseline="central">couche par couche</text>
<text class="ts" x="255" y="226" text-anchor="middle" dominant-baseline="central">pièce unique, complexe</text></g>
<g class="node c-amber"><rect x="340" y="144" width="150" height="104" rx="8" stroke-width="0.5"/>
<text class="th" x="415" y="164" text-anchor="middle" dominant-baseline="central">Déformer</text>
<text class="ts" x="415" y="186" text-anchor="middle" dominant-baseline="central">pliage, emboutissage,</text>
<text class="ts" x="415" y="202" text-anchor="middle" dominant-baseline="central">thermoformage</text>
<text class="ts" x="415" y="226" text-anchor="middle" dominant-baseline="central">tôle → forme pliée</text></g>
<g class="node c-amber"><rect x="500" y="144" width="160" height="104" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="164" text-anchor="middle" dominant-baseline="central">Mouler</text>
<text class="ts" x="580" y="186" text-anchor="middle" dominant-baseline="central">injection plastique,</text>
<text class="ts" x="580" y="202" text-anchor="middle" dominant-baseline="central">fonderie</text>
<text class="ts" x="580" y="226" text-anchor="middle" dominant-baseline="central">grande série</text></g>
<text class="ts" x="340" y="272" text-anchor="middle">On choisit selon : la forme voulue, le nombre de pièces, le matériau, l'environnement.</text>
<line x1="20" y1="290" x2="660" y2="290" class="leader"/>
<text class="th" x="340" y="314" text-anchor="middle">Quand on force de plus en plus sur une pièce</text>
<line x1="40" y1="340" x2="640" y2="340" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="640" y="330" text-anchor="end">contrainte qui augmente</text>
<g class="c-gray"><rect x="40" y="354" width="190" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="376" text-anchor="middle" dominant-baseline="central">Élastique</text>
<text class="ts" x="135" y="398" text-anchor="middle" dominant-baseline="central">reprend sa forme</text>
<text class="ts" x="135" y="414" text-anchor="middle" dominant-baseline="central">quand on lâche</text></g>
<g class="c-gray"><rect x="245" y="354" width="190" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="376" text-anchor="middle" dominant-baseline="central">Plastique</text>
<text class="ts" x="340" y="398" text-anchor="middle" dominant-baseline="central">reste déformée</text>
<text class="ts" x="340" y="414" text-anchor="middle" dominant-baseline="central">(définitif)</text></g>
<g class="c-gray"><rect x="450" y="354" width="190" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="376" text-anchor="middle" dominant-baseline="central">Rupture</text>
<text class="ts" x="545" y="398" text-anchor="middle" dominant-baseline="central">la pièce casse</text>
<text class="ts" x="545" y="414" text-anchor="middle" dominant-baseline="central">(un verre casse sans plier)</text></g>
</svg>
