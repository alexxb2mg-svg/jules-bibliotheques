<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<title>Le chemin d'une information dans Internet</title>
<desc>Un ordinateur envoie des paquets vers un serveur. Les paquets passent de routeur en routeur : R1, R2, R4, puis le serveur. Un autre chemin passe par R3. Sous le schéma, la table de routage de R1 indique vers quel routeur envoyer chaque paquet.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="24" text-anchor="middle">Un paquet traverse Internet de routeur en routeur</text>
<line x1="198.4" y1="212.6" x2="319.6" y2="287.4" stroke="#B4B2A9" stroke-width="2"/>
<line x1="360.2" y1="287" x2="475.8" y2="213" stroke="#B4B2A9" stroke-width="2"/>
<line x1="340" y1="124" x2="340" y2="276" stroke="#B4B2A9" stroke-width="2"/>
<line x1="120" y1="200" x2="152" y2="200" stroke="#185FA5" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="198.4" y1="187.4" x2="317" y2="114" stroke="#185FA5" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="360.2" y1="113" x2="473.5" y2="185.5" stroke="#185FA5" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="520" y1="200" x2="560" y2="200" stroke="#185FA5" stroke-width="3" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="16" y="170" width="104" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="68" y="190" text-anchor="middle" dominant-baseline="central">Ordinateur</text>
<text class="ts" x="68" y="212" text-anchor="middle" dominant-baseline="central">expéditeur</text></g>
<g class="node c-purple"><circle cx="178" cy="200" r="24" stroke-width="0.8"/>
<text class="th" x="178" y="200" text-anchor="middle" dominant-baseline="central">R1</text></g>
<g class="node c-purple"><circle cx="340" cy="100" r="24" stroke-width="0.8"/>
<text class="th" x="340" y="100" text-anchor="middle" dominant-baseline="central">R2</text></g>
<g class="node c-purple"><circle cx="340" cy="300" r="24" stroke-width="0.8"/>
<text class="th" x="340" y="300" text-anchor="middle" dominant-baseline="central">R3</text></g>
<g class="node c-purple"><circle cx="496" cy="200" r="24" stroke-width="0.8"/>
<text class="th" x="496" y="200" text-anchor="middle" dominant-baseline="central">R4</text></g>
<g class="node c-blue"><rect x="562" y="170" width="104" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="614" y="190" text-anchor="middle" dominant-baseline="central">Serveur</text>
<text class="ts" x="614" y="212" text-anchor="middle" dominant-baseline="central">destinataire</text></g>
<g class="c-blue"><text class="ts" x="230" y="120" text-anchor="middle">chemin choisi</text></g>
<text class="ts" x="340" y="345" text-anchor="middle">autre chemin possible (panne, encombrement)</text>
<text class="ts" x="340" y="60" text-anchor="middle">Chaque routeur lit l'adresse IP de destination</text>
<g class="c-gray"><rect x="16" y="362" width="330" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="181" y="378" text-anchor="middle" dominant-baseline="central">Table de routage de R1</text>
<text class="ts" x="181" y="398" text-anchor="middle" dominant-baseline="central">réseau du serveur → R2 ; sinon → R3</text></g>
<g class="c-gray"><rect x="360" y="362" width="306" height="50" rx="8" stroke-width="0.5"/>
<text class="ts" x="513" y="378" text-anchor="middle" dominant-baseline="central">Le fichier est découpé en paquets,</text>
<text class="ts" x="513" y="396" text-anchor="middle" dominant-baseline="central">remis dans l'ordre à l'arrivée.</text></g>
</svg>
