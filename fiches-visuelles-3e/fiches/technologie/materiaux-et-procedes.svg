<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<title>Les étapes du cycle de vie d'un objet technique</title>
<desc>Six étapes reliées par des flèches de transport : extraction, traitement, fabrication, assemblage, utilisation, fin de vie. Une flèche de recyclage ramène la matière de la fin de vie vers le traitement. En bas, les impacts environnementaux.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="24" text-anchor="middle">Cycle de vie d'un objet technique</text>
<g class="node c-green"><rect x="30" y="44" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="115" y="66" text-anchor="middle" dominant-baseline="central">1. Extraction</text>
<text class="ts" x="115" y="90" text-anchor="middle" dominant-baseline="central">minerai, pétrole, bois</text></g>
<g class="node c-green"><rect x="255" y="44" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="66" text-anchor="middle" dominant-baseline="central">2. Traitement</text>
<text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">matière → acier, plastique</text></g>
<g class="node c-green"><rect x="480" y="44" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="66" text-anchor="middle" dominant-baseline="central">3. Fabrication</text>
<text class="ts" x="565" y="90" text-anchor="middle" dominant-baseline="central">mise en forme des pièces</text></g>
<g class="node c-green"><rect x="480" y="214" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="236" text-anchor="middle" dominant-baseline="central">4. Assemblage</text>
<text class="ts" x="565" y="260" text-anchor="middle" dominant-baseline="central">vis, colle, soudure</text></g>
<g class="node c-green"><rect x="255" y="214" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="236" text-anchor="middle" dominant-baseline="central">5. Utilisation</text>
<text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central">énergie, entretien</text></g>
<g class="node c-green"><rect x="30" y="214" width="170" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="115" y="236" text-anchor="middle" dominant-baseline="central">6. Fin de vie</text>
<text class="ts" x="115" y="260" text-anchor="middle" dominant-baseline="central">tri, recyclage, déchet</text></g>
<line x1="200" y1="79" x2="253" y2="79" class="arr" marker-end="url(#arrow)"/>
<line x1="425" y1="79" x2="478" y2="79" class="arr" marker-end="url(#arrow)"/>
<line x1="565" y1="114" x2="565" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="249" x2="427" y2="249" class="arr" marker-end="url(#arrow)"/>
<line x1="255" y1="249" x2="202" y2="249" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="575" y="168">transport</text>
<text class="ts" x="226" y="134" text-anchor="middle">transport</text>
<text class="ts" x="452" y="134" text-anchor="middle">transport</text>
<text class="ts" x="452" y="304" text-anchor="middle">transport</text>
<text class="ts" x="226" y="304" text-anchor="middle">transport</text>
<path d="M115,212 V164 H340 V116" fill="none" stroke="#3B6D11" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<g class="c-green"><text class="t" x="190" y="156" text-anchor="middle">recyclage</text></g>
<g class="c-coral"><rect x="30" y="326" width="620" height="78" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="346" text-anchor="middle" dominant-baseline="central">À chaque étape : énergie consommée, pollution, déchets</text>
<text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">Pour réduire l'impact : matériau recyclable ou recyclé, moins de transport,</text>
<text class="ts" x="340" y="386" text-anchor="middle" dominant-baseline="central">objet solide et réparable (il dure plus longtemps).</text></g>
</svg>
