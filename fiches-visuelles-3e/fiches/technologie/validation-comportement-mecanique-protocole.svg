<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Protocole d'essai de flexion d'une règle et courbe flèche en fonction de la masse">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="170" y="20" text-anchor="middle" dominant-baseline="central">Protocole : essai de flexion</text>
<rect x="20" y="150" width="120" height="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="116" y="164" width="12" height="100" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="60" y="182" text-anchor="middle" dominant-baseline="central">table</text>
<rect x="40" y="142" width="230" height="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<rect x="62" y="128" width="26" height="44" rx="3" fill="none" stroke="#444441" stroke-width="2"/>
<text class="ts" x="75" y="116" text-anchor="middle" dominant-baseline="central">serre-joint</text>
<path d="M140 146 Q220 150 266 180" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="ts" x="200" y="128" text-anchor="middle" dominant-baseline="central">règle au repos</text>
<line x1="266" y1="180" x2="266" y2="196" stroke="#993C1D" stroke-width="1.5"/>
<rect x="248" y="196" width="36" height="30" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="th" x="266" y="211" text-anchor="middle" dominant-baseline="central" fill="#712B13">m</text>
<text class="ts" x="200" y="196" text-anchor="middle" dominant-baseline="central">règle pliée</text>
<line x1="300" y1="130" x2="300" y2="250" stroke="#185FA5" stroke-width="1.5"/>
<line x1="296" y1="146" x2="304" y2="146" stroke="#185FA5" stroke-width="1.5"/>
<line x1="296" y1="162" x2="304" y2="162" stroke="#185FA5" stroke-width="1"/>
<line x1="296" y1="178" x2="304" y2="178" stroke="#185FA5" stroke-width="1.5"/>
<line x1="296" y1="194" x2="304" y2="194" stroke="#185FA5" stroke-width="1"/>
<line x1="286" y1="148" x2="286" y2="176" stroke="#185FA5" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="th" x="310" y="162" text-anchor="start" dominant-baseline="central" fill="#0C447C">f</text>
<text class="ts" x="170" y="290" text-anchor="middle" dominant-baseline="central">1. accrocher des masses de plus en plus lourdes</text>
<text class="ts" x="170" y="308" text-anchor="middle" dominant-baseline="central">2. mesurer la flèche f à chaque fois</text>
<text class="ts" x="170" y="326" text-anchor="middle" dominant-baseline="central">3. retirer la masse : la règle revient-elle à 0 ?</text>
<text class="ts" x="170" y="346" text-anchor="middle" dominant-baseline="central">Pas à l'échelle.</text>

<line x1="345" y1="16" x2="345" y2="344" stroke="#d3d1c7" stroke-width="1"/>

<text class="th" x="515" y="20" text-anchor="middle" dominant-baseline="central">Ce qu'on observe</text>
<line x1="400" y1="280" x2="650" y2="280" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="280" x2="400" y2="50" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="408" y="54" text-anchor="start" dominant-baseline="central">flèche f</text>
<text class="ts" x="650" y="340" text-anchor="end" dominant-baseline="central">masse m accrochée</text>
<line x1="500" y1="60" x2="500" y2="280" class="leader"/>
<line x1="590" y1="60" x2="590" y2="280" class="leader"/>
<line x1="400" y1="280" x2="500" y2="200" stroke="#185FA5" stroke-width="2.5"/>
<path d="M500 200 Q540 168 590 100" fill="none" stroke="#185FA5" stroke-width="2.5"/>
<line x1="582" y1="92" x2="598" y2="108" stroke="#993C1D" stroke-width="2.5"/>
<line x1="598" y1="92" x2="582" y2="108" stroke="#993C1D" stroke-width="2.5"/>
<g class="c-blue"><text class="th" x="450" y="298" text-anchor="middle" dominant-baseline="central">élastique</text>
<text class="ts" x="450" y="316" text-anchor="middle" dominant-baseline="central">réversible</text>
<text class="th" x="545" y="298" text-anchor="middle" dominant-baseline="central">plastique</text>
<text class="ts" x="545" y="316" text-anchor="middle" dominant-baseline="central">irréversible</text></g>
<g class="c-coral"><text class="th" x="625" y="298" text-anchor="middle" dominant-baseline="central">rupture</text>
<text class="ts" x="625" y="316" text-anchor="middle" dominant-baseline="central">elle casse</text></g>
<text class="ts" x="455" y="150" text-anchor="middle" dominant-baseline="central">droite : f double</text>
<text class="ts" x="455" y="166" text-anchor="middle" dominant-baseline="central">quand m double</text>
</svg>
