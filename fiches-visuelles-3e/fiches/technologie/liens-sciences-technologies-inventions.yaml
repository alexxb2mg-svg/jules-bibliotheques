      - {de: besoin, vers: invention, libelle: "motive"}
      - {de: liens, vers: decouverte}
    jules: "Les sciences cherchent à **comprendre** le monde ; la technologie cherche à **agir** sur lui pour répondre à un besoin. L'une nourrit l'autre, dans les deux sens."

  - id: schema-boucle
    type: schema
    titre: "Des sciences aux objets, et des objets aux sciences"
    svg: "liens-sciences-technologies-inventions.svg"
    jules: "La flèche du retour est aussi importante que l'aller : sans le **microscope**, pas de découverte des cellules ; sans le télescope, pas de découverte des lunes de Jupiter."

  - id: schema-frise
    type: schema
    titre: "De la découverte d'Ørsted au moteur électrique d'aujourd'hui"
    svg: "liens-sciences-technologies-inventions-frise.svg"
    jules: "Il s'écoule environ **50 ans** entre la découverte de 1820 et des moteurs vraiment utilisables dans l'industrie : une invention ne suit pas toujours immédiatement la découverte."

  - id: methode
    type: methode
    etapes:
      - "Repérer la **découverte scientifique** à l'origine de l'objet : quel phénomène naturel est exploité ?"
      - "Identifier le **besoin** auquel répond l'invention : pourquoi a-t-elle été développée, pour qui ?"
      - "Situer l'invention dans le temps par rapport à la découverte : immédiate ou **beaucoup plus tardive** ?"
      - "Dire comment elle est devenue une **innovation** (diffusion, nouveaux usages), puis décrire son **cycle de vie** (fabrication, usage, fin de vie)."
    jules: "Une frise chronologique est l'outil idéal : place la découverte, l'invention, la diffusion, et mesure les écarts en années."

  - id: piege
    type: piege
    mauvaise_idee: "Une **invention** suit toujours immédiatement la découverte scientifique qui l'a rendue possible."
    pourquoi_faux: "Il faut souvent des **décennies** : trouver des matériaux, réduire le coût, répondre à un besoin réel. Le moteur électrique s'est répandu près d'un demi-siècle après la découverte de 1820."
    bonne_idee: "Découverte (**comprendre** un phénomène) et invention (**créer** une solution) sont deux étapes distinctes, parfois séparées par une longue durée."
    jules: "Une découverte peut aussi naître **par hasard** d'un usage technique : c'est en travaillant sur des radars qu'on a compris que les micro-ondes chauffent les aliments."

  - id: exemple-moteur
    type: exemple
    situation: "En 1820, Hans Christian Ørsted découvre qu'un **courant électrique** fait dévier l'aiguille d'une boussole. Quel lien avec le moteur électrique ?"
    calcul: "Découverte : un courant crée un effet magnétique, donc peut produire une force. Invention : des machines utilisent ce principe pour transformer l'énergie électrique en mouvement de rotation (machine de Gramme, vers 1870)."
    conclusion: "Le **moteur électrique** exploite la découverte d'Ørsted. Il répond au besoin de faire tourner des mécanismes sans force humaine ni machine à vapeur : ventilateurs, trains, perceuses."
    jules: "Dans une **chaîne d'énergie**, le moteur est le convertisseur : il reçoit de l'énergie électrique et fournit de l'énergie mécanique."

  - id: exemple-microondes
    type: exemple
    situation: "En 1945, un ingénieur qui travaille sur un radar remarque qu'une barre chocolatée a fondu dans sa poche. Il en tire le four à micro-ondes. Quel besoin est satisfait ?"
    conclusion: "Le besoin de **réchauffer ou cuire rapidement** des aliments, sans flamme ni four traditionnel plus lent. Ici, c'est une technique (le radar) qui a mené à une nouvelle application."
    jules: "Le four à micro-ondes est devenu une **innovation** quand il est devenu assez petit et assez bon marché pour entrer dans les cuisines, bien après 1945."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi avec la **LED** : quel phénomène (des matériaux qui émettent de la lumière quand un courant les traverse), quel besoin (éclairer en consommant peu), quelle fin de vie ?"
