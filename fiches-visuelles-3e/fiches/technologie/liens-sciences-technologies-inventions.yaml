blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: liens, titre: "Sciences et techniques", sous_titre: "avancent ensemble", principal: true}
      - {id: decouverte, titre: "Découverte scientifique", sous_titre: "comprendre un phénomène naturel"}
      - {id: invention, titre: "Invention technique", sous_titre: "une solution concrète qui l'utilise"}
      - {id: innovation, titre: "Innovation", sous_titre: "diffusion, nouveaux usages"}
      - {id: besoin, titre: "Besoins et cycle de vie", sous_titre: "pourquoi, pour qui, jusqu'à quand"}
    liens:
