<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="146" y="18" text-anchor="middle" dominant-baseline="central">Risque</text>
<text class="th" x="495" y="18" text-anchor="middle" dominant-baseline="central">Règle de protection</text>

<g class="node c-coral"><rect x="16" y="36" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="146" y="53" text-anchor="middle" dominant-baseline="central">Mot de passe deviné</text>
<text class="ts" x="146" y="71" text-anchor="middle" dominant-baseline="central">trop court, ou le même partout</text></g>
<g class="node c-green"><rect x="326" y="36" width="338" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="53" text-anchor="middle" dominant-baseline="central">Mot de passe long et unique</text>
<text class="ts" x="495" y="71" text-anchor="middle" dominant-baseline="central">un par site, jamais communiqué</text></g>

<g class="node c-coral"><rect x="16" y="96" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="146" y="113" text-anchor="middle" dominant-baseline="central">Logiciel pas à jour</text>
<text class="ts" x="146" y="131" text-anchor="middle" dominant-baseline="central">une faille connue des pirates</text></g>
<g class="node c-green"><rect x="326" y="96" width="338" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="113" text-anchor="middle" dominant-baseline="central">Mises à jour régulières</text>
<text class="ts" x="495" y="131" text-anchor="middle" dominant-baseline="central">système et applications</text></g>

<g class="node c-coral"><rect x="16" y="156" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="146" y="173" text-anchor="middle" dominant-baseline="central">Lien piégé, faux site</text>
<text class="ts" x="146" y="191" text-anchor="middle" dominant-baseline="central">hameçonnage</text></g>
<g class="node c-green"><rect x="326" y="156" width="338" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="173" text-anchor="middle" dominant-baseline="central">Ne pas cliquer, vérifier l'adresse</text>
<text class="ts" x="495" y="191" text-anchor="middle" dominant-baseline="central">nom exact du site, https</text></g>

<g class="node c-coral"><rect x="16" y="216" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="146" y="233" text-anchor="middle" dominant-baseline="central">Mot de passe volé</text>
<text class="ts" x="146" y="251" text-anchor="middle" dominant-baseline="central">quelqu'un tente de se connecter</text></g>
<g class="node c-green"><rect x="326" y="216" width="338" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="233" text-anchor="middle" dominant-baseline="central">Double authentification</text>
<text class="ts" x="495" y="251" text-anchor="middle" dominant-baseline="central">mot de passe + code reçu sur le téléphone</text></g>

<g class="node c-coral"><rect x="16" y="276" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="146" y="293" text-anchor="middle" dominant-baseline="central">Traces numériques</text>
<text class="ts" x="146" y="311" text-anchor="middle" dominant-baseline="central">publications, cookies, adresse IP</text></g>
<g class="node c-green"><rect x="326" y="276" width="338" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="293" text-anchor="middle" dominant-baseline="central">Limiter ce que l'on publie</text>
<text class="ts" x="495" y="311" text-anchor="middle" dominant-baseline="central">régler la confidentialité, refuser les cookies inutiles</text></g>

<line x1="280" y1="61" x2="320" y2="61" class="arr" marker-end="url(#fl)"/>
<line x1="280" y1="121" x2="320" y2="121" class="arr" marker-end="url(#fl)"/>
<line x1="280" y1="181" x2="320" y2="181" class="arr" marker-end="url(#fl)"/>
<line x1="280" y1="241" x2="320" y2="241" class="arr" marker-end="url(#fl)"/>
<line x1="280" y1="301" x2="320" y2="301" class="arr" marker-end="url(#fl)"/>

<g class="c-gray"><rect x="16" y="344" width="648" height="80" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="364" text-anchor="middle" dominant-baseline="central">Cyberviolence : insultes, harcèlement, usurpation d'identité, photos sans accord</text>
<text class="t" x="340" y="386" text-anchor="middle" dominant-baseline="central">ne pas répondre · garder une preuve · en parler à un adulte · signaler</text>
<text class="ts" x="340" y="406" text-anchor="middle" dominant-baseline="central">Partager un contenu blessant, c'est aussi y participer : chacun est responsable.</text></g>
</svg>
