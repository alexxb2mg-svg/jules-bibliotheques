<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="20" text-anchor="middle" dominant-baseline="central">Parcours d'utilisation d'une manette sans fil</text>

<g class="node c-blue"><rect x="16" y="44" width="140" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="86" y="64" text-anchor="middle" dominant-baseline="central">1. Allumer</text>
<text class="ts" x="86" y="84" text-anchor="middle" dominant-baseline="central">bouton central</text></g>
<g class="node c-blue"><rect x="186" y="44" width="140" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="256" y="64" text-anchor="middle" dominant-baseline="central">2. Connecter</text>
<text class="ts" x="256" y="84" text-anchor="middle" dominant-baseline="central">à la console</text></g>
<g class="node c-blue"><rect x="356" y="44" width="140" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="426" y="64" text-anchor="middle" dominant-baseline="central">3. Jouer</text>
<text class="ts" x="426" y="84" text-anchor="middle" dominant-baseline="central">1 à 2 heures</text></g>
<g class="node c-blue"><rect x="526" y="44" width="138" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="595" y="64" text-anchor="middle" dominant-baseline="central">4. Recharger</text>
<text class="ts" x="595" y="84" text-anchor="middle" dominant-baseline="central">câble fourni</text></g>
<line x1="158" y1="72" x2="182" y2="72" class="arr" marker-end="url(#fl)"/>
<line x1="328" y1="72" x2="352" y2="72" class="arr" marker-end="url(#fl)"/>
<line x1="498" y1="72" x2="522" y2="72" class="arr" marker-end="url(#fl)"/>

<text class="ts" x="16" y="126">Ressenti de l'utilisateur :</text>
<line x1="16" y1="186" x2="664" y2="186" stroke="#88877f" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="664" y="178" text-anchor="end">content</text>
<text class="ts" x="664" y="200" text-anchor="end">gêné</text>

<polyline points="86,160 256,222 426,150 595,210" fill="none" stroke="#5f5e5a" stroke-width="2"/>
<circle cx="86" cy="160" r="6" fill="#3B6D11"/>
<circle cx="256" cy="222" r="6" fill="#993C1D"/>
<circle cx="426" cy="150" r="6" fill="#3B6D11"/>
<circle cx="595" cy="210" r="6" fill="#993C1D"/>

<g class="node c-green"><rect x="16" y="244" width="140" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="86" y="260" text-anchor="middle" dominant-baseline="central">facile, bouton</text>
<text class="ts" x="86" y="276" text-anchor="middle" dominant-baseline="central">bien visible</text></g>
<g class="node c-coral"><rect x="186" y="244" width="140" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="256" y="260" text-anchor="middle" dominant-baseline="central">attente, message</text>
<text class="ts" x="256" y="276" text-anchor="middle" dominant-baseline="central">peu clair</text></g>
<g class="node c-green"><rect x="356" y="244" width="140" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="426" y="260" text-anchor="middle" dominant-baseline="central">bien en main,</text>
<text class="ts" x="426" y="276" text-anchor="middle" dominant-baseline="central">pas de crampe</text></g>
<g class="node c-coral"><rect x="526" y="244" width="138" height="46" rx="8" stroke-width="0.5"/>
<text class="ts" x="595" y="260" text-anchor="middle" dominant-baseline="central">câble trop court,</text>
<text class="ts" x="595" y="276" text-anchor="middle" dominant-baseline="central">jeu interrompu</text></g>

<g class="c-gray"><rect x="16" y="306" width="648" height="58" rx="10" stroke-width="0.5"/>
<text class="t" x="340" y="326" text-anchor="middle" dominant-baseline="central">Étape 3 : ergonomie (confort de la main) · étapes 1 à 4 : expérience utilisateur</text>
<text class="ts" x="340" y="346" text-anchor="middle" dominant-baseline="central">Les points « gêné » montrent ce que les concepteurs doivent améliorer.</text></g>
</svg>
