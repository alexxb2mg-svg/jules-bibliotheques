<svg width="100%" viewBox="0 0 680 476" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="node c-gray"><rect x="60" y="10" width="120" height="30" rx="15" stroke-width="0.5"/>
<text class="th" x="120" y="25" text-anchor="middle" dominant-baseline="central">Début</text></g>
<g class="node c-gray"><rect x="10" y="56" width="220" height="36" rx="6" stroke-width="0.5"/>
<text class="t" x="120" y="74" text-anchor="middle" dominant-baseline="central">Symptôme : pas de lumière</text></g>

<polygon points="120,110 220,150 120,190 20,150" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="t" x="120" y="142" text-anchor="middle" dominant-baseline="central">Lampe branchée,</text>
<text class="t" x="120" y="160" text-anchor="middle" dominant-baseline="central">prise qui marche ?</text>

<polygon points="120,214 220,254 120,294 20,254" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="t" x="120" y="246" text-anchor="middle" dominant-baseline="central">Ampoule</text>
<text class="t" x="120" y="264" text-anchor="middle" dominant-baseline="central">en bon état ?</text>

<polygon points="120,318 220,358 120,398 20,358" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="t" x="120" y="350" text-anchor="middle" dominant-baseline="central">Interrupteur</text>
<text class="t" x="120" y="368" text-anchor="middle" dominant-baseline="central">en bon état ?</text>

<g class="node c-coral"><rect x="20" y="424" width="200" height="44" rx="6" stroke-width="0.5"/>
<text class="t" x="120" y="438" text-anchor="middle" dominant-baseline="central">Câble ou douille abîmé :</text>
<text class="ts" x="120" y="456" text-anchor="middle" dominant-baseline="central">réparation plus poussée</text></g>

<line x1="120" y1="42" x2="120" y2="52" class="arr" marker-end="url(#fl)"/>
<line x1="120" y1="94" x2="120" y2="106" class="arr" marker-end="url(#fl)"/>
<line x1="120" y1="192" x2="120" y2="210" class="arr" marker-end="url(#fl)"/>
