<line x1="120" y1="400" x2="120" y2="420" class="arr" marker-end="url(#fl)"/>
<text class="ts" x="128" y="204">oui</text>
<text class="ts" x="128" y="308">oui</text>
<text class="ts" x="128" y="413">oui</text>

<line x1="222" y1="150" x2="266" y2="150" class="arr" marker-end="url(#fl)"/>
<line x1="222" y1="254" x2="266" y2="254" class="arr" marker-end="url(#fl)"/>
<line x1="222" y1="358" x2="266" y2="358" class="arr" marker-end="url(#fl)"/>
<text class="ts" x="232" y="142">non</text>
<text class="ts" x="232" y="246">non</text>
<text class="ts" x="232" y="350">non</text>

<g class="node c-green"><rect x="270" y="128" width="220" height="44" rx="6" stroke-width="0.5"/>
<text class="t" x="380" y="150" text-anchor="middle" dominant-baseline="central">Brancher, changer de prise</text></g>
<g class="node c-green"><rect x="270" y="232" width="220" height="44" rx="6" stroke-width="0.5"/>
<text class="t" x="380" y="254" text-anchor="middle" dominant-baseline="central">Remplacer l'ampoule</text></g>
<g class="node c-green"><rect x="270" y="336" width="220" height="44" rx="6" stroke-width="0.5"/>
<text class="t" x="380" y="358" text-anchor="middle" dominant-baseline="central">Changer l'interrupteur</text></g>

<line x1="492" y1="150" x2="516" y2="150" class="arr" marker-end="url(#fl)"/>
<line x1="492" y1="254" x2="516" y2="254" class="arr" marker-end="url(#fl)"/>
<line x1="492" y1="358" x2="516" y2="358" class="arr" marker-end="url(#fl)"/>
<path d="M 222 446 L 590 446 L 590 406" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#fl)"/>

<g class="node c-gray"><rect x="520" y="110" width="140" height="292" rx="10" stroke-width="0.5"/>
<text class="th" x="590" y="140" text-anchor="middle" dominant-baseline="central">Tester :</text>
<text class="t" x="590" y="162" text-anchor="middle" dominant-baseline="central">la lampe</text>
<text class="t" x="590" y="180" text-anchor="middle" dominant-baseline="central">s'allume ?</text>
<text class="th" x="590" y="226" text-anchor="middle" dominant-baseline="central">Fin :</text>
<text class="t" x="590" y="248" text-anchor="middle" dominant-baseline="central">objet réparé</text>
<text class="ts" x="590" y="312" text-anchor="middle" dominant-baseline="central">Sécurité :</text>
<text class="ts" x="590" y="330" text-anchor="middle" dominant-baseline="central">débrancher</text>
<text class="ts" x="590" y="348" text-anchor="middle" dominant-baseline="central">avant d'ouvrir</text>
<text class="ts" x="590" y="366" text-anchor="middle" dominant-baseline="central">l'objet</text></g>

<text class="ts" x="280" y="40">bleu : test (hypothèse)</text>
<text class="ts" x="280" y="58">vert : action de réparation</text>
<text class="ts" x="280" y="76">de la cause la plus simple</text>
<text class="ts" x="280" y="94">à la plus compliquée</text>
</svg>
