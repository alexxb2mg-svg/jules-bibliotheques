<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fabriquer une pièce sur mesure : de la mesure à l'impression 3D">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="205" y="22" text-anchor="middle" dominant-baseline="central">Les étapes, dans l'ordre</text>

<g class="c-gray"><rect x="60" y="40" width="290" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="58" text-anchor="middle" dominant-baseline="central">1. Mesurer la pièce cassée</text>
<text class="ts" x="205" y="76" text-anchor="middle" dominant-baseline="central">pied à coulisse : longueurs, diamètres, épaisseurs</text></g>
<line x1="205" y1="90" x2="205" y2="106" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="60" y="108" width="290" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="126" text-anchor="middle" dominant-baseline="central">2. Modéliser en 3D</text>
<text class="ts" x="205" y="144" text-anchor="middle" dominant-baseline="central">logiciel de CAO, avec les cotes relevées</text></g>
<line x1="205" y1="158" x2="205" y2="174" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="60" y="176" width="290" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="194" text-anchor="middle" dominant-baseline="central">3. Préparer l'impression</text>
<text class="ts" x="205" y="212" text-anchor="middle" dominant-baseline="central">matériau, épaisseur des couches, remplissage</text></g>
<line x1="205" y1="226" x2="205" y2="242" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="60" y="244" width="290" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="262" text-anchor="middle" dominant-baseline="central">4. Imprimer la pièce</text>
<text class="ts" x="205" y="280" text-anchor="middle" dominant-baseline="central">la matière est déposée couche par couche</text></g>
<line x1="205" y1="294" x2="205" y2="310" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="60" y="312" width="290" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="330" text-anchor="middle" dominant-baseline="central">5. Essayer la pièce sur l'objet</text>
<text class="ts" x="205" y="348" text-anchor="middle" dominant-baseline="central">si elle s'ajuste mal : corriger le modèle</text></g>
<path d="M60 337 L36 337 L36 133 L56 133" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<text class="th" x="525" y="22" text-anchor="middle" dominant-baseline="central">Impression 3D par dépôt de fil</text>
<path d="M540 70 C540 50 560 42 600 42" fill="none" stroke="#993C1D" stroke-width="2"/>
<text class="ts" x="606" y="42" text-anchor="start" dominant-baseline="central">fil</text>
<rect x="515" y="70" width="50" height="26" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="528,96 552,96 540,120" fill="#993C1D" stroke="#712B13" stroke-width="1"/>
<line x1="556" y1="106" x2="592" y2="106" class="leader"/>
<text class="ts" x="596" y="106" text-anchor="start" dominant-baseline="central">buse chauffée</text>
<rect x="465" y="188" width="120" height="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="465" y="176" width="120" height="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="465" y="164" width="120" height="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="465" y="152" width="120" height="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="465" y="140" width="120" height="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<rect x="465" y="128" width="75" height="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<line x1="590" y1="158" x2="604" y2="158" class="leader"/>
<text class="ts" x="608" y="150" text-anchor="start" dominant-baseline="central">couches</text>
<text class="ts" x="608" y="166" text-anchor="start" dominant-baseline="central">empilées</text>
<rect x="420" y="200" width="210" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="415" y="206" text-anchor="end" dominant-baseline="central">plateau</text>
<text class="ts" x="525" y="230" text-anchor="middle" dominant-baseline="central">Pas à l'échelle.</text>

<g class="c-coral"><rect x="380" y="250" width="280" height="112" rx="8" stroke-width="0.5"/>
<text class="th" x="520" y="270" text-anchor="middle" dominant-baseline="central">Trois façons d'obtenir une pièce</text>
<text class="ts" x="396" y="296" text-anchor="start" dominant-baseline="central">ajouter : impression 3D (fabrication additive)</text>
<text class="ts" x="396" y="318" text-anchor="start" dominant-baseline="central">enlever : usinage, découpe (soustractive)</text>
<text class="ts" x="396" y="340" text-anchor="start" dominant-baseline="central">mettre en forme : moulage, pliage</text></g>

<rect x="60" y="388" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="80" y="395" text-anchor="start" dominant-baseline="central">objet réel</text>
<rect x="190" y="388" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="ts" x="210" y="395" text-anchor="start" dominant-baseline="central">travail numérique</text>
<rect x="350" y="388" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="ts" x="370" y="395" text-anchor="start" dominant-baseline="central">fabrication (matière)</text>
</svg>
