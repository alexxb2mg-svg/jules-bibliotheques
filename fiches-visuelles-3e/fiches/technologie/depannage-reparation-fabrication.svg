<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="node c-gray"><rect x="16" y="14" width="196" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="114" y="34" text-anchor="middle" dominant-baseline="central">Pièce modélisée (CAO)</text></g>
<g class="node c-gray"><rect x="242" y="14" width="196" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="34" text-anchor="middle" dominant-baseline="central">Fichier machine (FAO)</text></g>
<g class="node c-gray"><rect x="468" y="14" width="196" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="566" y="34" text-anchor="middle" dominant-baseline="central">Machine de production</text></g>
<line x1="214" y1="34" x2="238" y2="34" class="arr" marker-end="url(#fl)"/>
<line x1="440" y1="34" x2="464" y2="34" class="arr" marker-end="url(#fl)"/>

<g class="node c-teal"><rect x="16" y="76" width="208" height="200" rx="10" stroke-width="0.5"/>
<text class="th" x="120" y="98" text-anchor="middle" dominant-baseline="central">Impression 3D</text>
<text class="ts" x="120" y="122" text-anchor="middle" dominant-baseline="central">AJOUTE de la matière,</text>
<text class="ts" x="120" y="140" text-anchor="middle" dominant-baseline="central">couche par couche</text>
<text class="ts" x="120" y="170" text-anchor="middle" dominant-baseline="central">fil de plastique (PLA)</text>
<text class="ts" x="120" y="200" text-anchor="middle" dominant-baseline="central">pour : clip, support,</text>
<text class="ts" x="120" y="218" text-anchor="middle" dominant-baseline="central">forme en volume</text>
<text class="ts" x="120" y="248" text-anchor="middle" dominant-baseline="central">lent, pièce moins solide</text></g>

<g class="node c-coral"><rect x="236" y="76" width="208" height="200" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="98" text-anchor="middle" dominant-baseline="central">Découpe laser</text>
<text class="ts" x="340" y="122" text-anchor="middle" dominant-baseline="central">ENLÈVE de la matière :</text>
<text class="ts" x="340" y="140" text-anchor="middle" dominant-baseline="central">découpe ou grave</text>
<text class="ts" x="340" y="170" text-anchor="middle" dominant-baseline="central">plaque de bois, carton,</text>
<text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">acrylique</text>
<text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">pour : pièce plate,</text>
<text class="ts" x="340" y="236" text-anchor="middle" dominant-baseline="central">rapide et précise</text></g>

<g class="node c-coral"><rect x="456" y="76" width="208" height="200" rx="10" stroke-width="0.5"/>
<text class="th" x="560" y="98" text-anchor="middle" dominant-baseline="central">Centre d'usinage</text>
<text class="ts" x="560" y="122" text-anchor="middle" dominant-baseline="central">ENLÈVE de la matière :</text>
<text class="ts" x="560" y="140" text-anchor="middle" dominant-baseline="central">un outil qui tourne fait</text>
<text class="ts" x="560" y="158" text-anchor="middle" dominant-baseline="central">des copeaux</text>
<text class="ts" x="560" y="188" text-anchor="middle" dominant-baseline="central">bloc de métal, de bois</text>
<text class="ts" x="560" y="206" text-anchor="middle" dominant-baseline="central">ou de plastique</text>
<text class="ts" x="560" y="236" text-anchor="middle" dominant-baseline="central">pour : pièce solide</text></g>

<g class="c-gray"><rect x="16" y="292" width="648" height="142" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="314" text-anchor="middle" dominant-baseline="central">Sécurité dans l'atelier de fabrication</text>
<text class="t" x="340" y="342" text-anchor="middle" dominant-baseline="central">lunettes de protection · cheveux attachés · pas d'écharpe ni de manches larges</text>
<text class="t" x="340" y="366" text-anchor="middle" dominant-baseline="central">capot ou carter fermé pendant le travail · ne jamais laisser une machine seule</text>
<text class="t" x="340" y="390" text-anchor="middle" dominant-baseline="central">laser : jamais de PVC (fumées toxiques) · 3D : buse très chaude, ne pas toucher</text>
<text class="ts" x="340" y="416" text-anchor="middle" dominant-baseline="central">Toujours demander l'accord du professeur avant de lancer une machine.</text></g>
</svg>
