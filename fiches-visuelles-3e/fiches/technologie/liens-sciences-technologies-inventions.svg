<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="node c-gray"><rect x="220" y="16" width="240" height="52" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">Besoin humain</text>
<text class="ts" x="340" y="54" text-anchor="middle" dominant-baseline="central">se déplacer, soigner, éclairer…</text></g>

<g class="node c-purple"><rect x="20" y="120" width="190" height="84" rx="10" stroke-width="0.5"/>
<text class="th" x="115" y="142" text-anchor="middle" dominant-baseline="central">Découverte</text>
<text class="th" x="115" y="160" text-anchor="middle" dominant-baseline="central">scientifique</text>
<text class="ts" x="115" y="184" text-anchor="middle" dominant-baseline="central">comprendre un phénomène</text></g>

<g class="node c-blue"><rect x="245" y="120" width="190" height="84" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="142" text-anchor="middle" dominant-baseline="central">Invention</text>
<text class="th" x="340" y="160" text-anchor="middle" dominant-baseline="central">technique</text>
<text class="ts" x="340" y="184" text-anchor="middle" dominant-baseline="central">créer une solution</text></g>

<g class="node c-blue"><rect x="470" y="120" width="190" height="84" rx="10" stroke-width="0.5"/>
<text class="th" x="565" y="142" text-anchor="middle" dominant-baseline="central">Innovation</text>
<text class="ts" x="565" y="166" text-anchor="middle" dominant-baseline="central">l'objet se diffuse,</text>
<text class="ts" x="565" y="184" text-anchor="middle" dominant-baseline="central">nouveaux usages</text></g>

<line x1="340" y1="70" x2="340" y2="116" class="arr" marker-end="url(#fl)"/>
<text class="ts" x="350" y="96">motive</text>
<line x1="212" y1="150" x2="241" y2="150" class="arr" marker-end="url(#fl)"/>
<line x1="437" y1="162" x2="466" y2="162" class="arr" marker-end="url(#fl)"/>

<path d="M 340 206 C 340 260 115 260 115 208" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fl)"/>
<text class="ts" x="228" y="268" text-anchor="middle">nouvel instrument → nouvelle découverte</text>

<g class="c-gray"><rect x="20" y="290" width="640" height="54" rx="10" stroke-width="0.5"/>
<text class="t" x="340" y="308" text-anchor="middle" dominant-baseline="central">Aller : Ørsted (1820), le courant crée un effet magnétique → moteur électrique</text>
<text class="t" x="340" y="328" text-anchor="middle" dominant-baseline="central">Retour : le microscope (XVIIe siècle) → découverte des cellules</text></g>

<g class="node c-gray"><rect x="20" y="356" width="640" height="50" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="372" text-anchor="middle" dominant-baseline="central">Cycle de vie de l'objet</text>
<text class="ts" x="340" y="390" text-anchor="middle" dominant-baseline="central">matières → fabrication → usage → fin de vie : il est remplacé, réparé ou recyclé</text></g>
</svg>
