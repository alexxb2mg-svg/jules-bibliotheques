<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="node c-green"><rect x="20" y="30" width="170" height="60" rx="10" stroke-width="0.5"/>
<text class="th" x="105" y="50" text-anchor="middle" dominant-baseline="central">1. Extraction</text>
<text class="ts" x="105" y="72" text-anchor="middle" dominant-baseline="central">matières premières</text></g>
<g class="node c-green"><rect x="255" y="30" width="170" height="60" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">2. Fabrication</text>
<text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central">usine, assemblage</text></g>
<g class="node c-green"><rect x="490" y="30" width="170" height="60" rx="10" stroke-width="0.5"/>
<text class="th" x="575" y="50" text-anchor="middle" dominant-baseline="central">3. Transport</text>
<text class="ts" x="575" y="72" text-anchor="middle" dominant-baseline="central">bateau, camion</text></g>
<g class="node c-green"><rect x="490" y="160" width="170" height="60" rx="10" stroke-width="0.5"/>
<text class="th" x="575" y="180" text-anchor="middle" dominant-baseline="central">4. Utilisation</text>
<text class="ts" x="575" y="202" text-anchor="middle" dominant-baseline="central">énergie consommée</text></g>
<g class="node c-green"><rect x="255" y="160" width="170" height="60" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="180" text-anchor="middle" dominant-baseline="central">5. Fin de vie</text>
<text class="ts" x="340" y="202" text-anchor="middle" dominant-baseline="central">trois possibilités</text></g>

<line x1="192" y1="60" x2="251" y2="60" class="arr" marker-end="url(#fl)"/>
<line x1="427" y1="60" x2="486" y2="60" class="arr" marker-end="url(#fl)"/>
<line x1="575" y1="92" x2="575" y2="156" class="arr" marker-end="url(#fl)"/>
<line x1="488" y1="190" x2="429" y2="190" class="arr" marker-end="url(#fl)"/>

<g class="node c-teal"><rect x="20" y="290" width="170" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="105" y="309" text-anchor="middle" dominant-baseline="central">Recycler</text>
<text class="ts" x="105" y="329" text-anchor="middle" dominant-baseline="central">nouvelle matière</text></g>
<g class="node c-coral"><rect x="255" y="290" width="170" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="309" text-anchor="middle" dominant-baseline="central">Jeter</text>
<text class="ts" x="340" y="329" text-anchor="middle" dominant-baseline="central">déchet enfoui ou brûlé</text></g>
<g class="node c-teal"><rect x="490" y="290" width="170" height="56" rx="10" stroke-width="0.5"/>
<text class="th" x="575" y="309" text-anchor="middle" dominant-baseline="central">Réparer</text>
<text class="ts" x="575" y="329" text-anchor="middle" dominant-baseline="central">il sert plus longtemps</text></g>

<line x1="300" y1="222" x2="160" y2="286" class="arr" marker-end="url(#fl)"/>
<line x1="340" y1="222" x2="340" y2="286" class="arr" marker-end="url(#fl)"/>
<line x1="380" y1="222" x2="520" y2="286" class="arr" marker-end="url(#fl)"/>
<path d="M 60 288 L 60 96" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#fl)"/>
<path d="M 640 288 L 640 224" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#fl)"/>
<text class="ts" x="70" y="160">retour vers</text>
<text class="ts" x="70" y="176">les matières</text>
<text class="ts" x="630" y="262" text-anchor="end">retour à l'usage</text>

<g class="c-gray"><rect x="20" y="364" width="640" height="62" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="384" text-anchor="middle" dominant-baseline="central">À chaque étape : énergie, matières, gaz à effet de serre, déchets</text>
<text class="ts" x="340" y="406" text-anchor="middle" dominant-baseline="central">Impacts sur l'air, l'eau, le sol et la santé. Le bilan carbone additionne toutes les étapes.</text></g>
</svg>
