notion: projet-groupe-developpement-durable-3e
titre: "Mener un projet en groupe autour du développement durable"
matiere: technologie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
generation: {par: "projet-jules", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Développement durable »", url: "https://fr.vikidia.org/w/index.php?title=D%C3%A9veloppement_durable&oldid=2556115", licence: CC-BY-SA-3.0}
  - {titre: "Wikipédia, « Gestion de projet »", url: "https://fr.wikipedia.org/w/index.php?title=Gestion_de_projet&oldid=238705832", licence: CC-BY-SA-4.0}
  - {titre: "Annexe — Programme de technologie du cycle 4", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20de%20technologie%20du%20cycle%204-368016.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  ODD: "objectifs de développement durable"
  ONU: "Organisation des Nations unies"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: projet, titre: "Projet en groupe", sous_titre: "une thématique de développement durable", principal: true}
      - {id: cdc, titre: "Cahier des charges", sous_titre: "fonctions et critères durables"}
      - {id: gestion, titre: "Gestion de projet", sous_titre: "tâches, rôles, planning, jalons"}
      - {id: choix, titre: "Choix justifiés", sous_titre: "chacun relié à un pilier"}
      - {id: eval, titre: "Évaluation finale", sous_titre: "fonctions et critères durables"}
    liens:
      - {de: projet, vers: cdc}
      - {de: projet, vers: gestion}
      - {de: cdc, vers: choix}
      - {de: choix, vers: eval}
    jules: "Ce projet de fin de cycle réunit tout ce que tu as appris : gestion de projet, choix des matériaux et de l'énergie, prototypage. La différence : chaque décision se justifie aussi par le **développement durable**."

  - id: schema
    type: schema
    titre: "Les étapes du projet et les trois piliers du développement durable"
    svg: "projet-groupe-developpement-durable-3e.svg"
    jules: "Les trois piliers entrent dans le projet **dès l'étape 1**, dans le cahier des charges, puis servent à justifier les choix et à évaluer le résultat. Les ODD, fixés par l'ONU, aident à choisir la **thématique** du projet."

  - id: methode
    type: methode
    etapes:
      - "Choisir une thématique (par exemple un ODD) et écrire le cahier des charges avec des **critères durables** chiffrés, en plus des fonctions attendues."
      - "Lister les tâches et les répartir dans le groupe selon les compétences et le temps de chacun ; fixer des **jalons**."
      - "Justifier chaque choix technique (matériau, énergie, assemblage, procédé) par au moins un **pilier** du développement durable."
      - "Réaliser et tester le prototype, en faisant le point à chaque revue de projet."
      - "Évaluer le résultat sur les **fonctions** attendues et sur les critères durables fixés au départ, puis présenter le projet."
    jules: "Un bon critère durable se vérifie, comme une fonction : « au moins 50 % de matériaux récupérés » se contrôle, « être écologique » ne se contrôle **pas**."

  - id: piege
    type: piege
    mauvaise_idee: "Concevoir l'objet d'abord, puis ajouter à la fin une phrase sur le développement durable pour la présentation."
    pourquoi_faux: "Une fois l'objet fabriqué, ses matériaux, son énergie et son assemblage sont déjà fixés : il est **trop tard** pour les choisir de façon durable."
    bonne_idee: "Inscrire les critères durables **dans le cahier des charges** dès le début, et relier ensuite chaque choix technique à un pilier précis."
    jules: "Autre erreur fréquente : écrire « c'est écologique » sans dire pourquoi. Nomme le **pilier** et le fait : « bois de récupération, donc moins de ressources extraites : pilier environnemental »."

  - id: exemple
    type: exemple
    situation: "Un groupe de quatre conçoit un arrosage automatique pour le potager du collège (thématique : ODD n° 6, eau propre)."
    calcul: "Critères : environnemental, arroser seulement si la terre est sèche ; économique, budget limité et matériel récupéré ; social, sans danger et simple à régler. Rôles : un chef de projet, un modélisateur, un fabricant, un programmeur."
    conclusion: "Le cahier des charges contient un critère pour **chaque pilier**, et chaque élève a un rôle qui correspond à une tâche du planning."
    jules: "Le **chef de projet** ne fait pas tout : il suit le planning, anime les revues de projet et prévient le groupe quand une tâche prend du retard."

  - id: exemple-evaluation
    type: exemple
    situation: "Évaluation finale : sur une semaine, le potager recevait 12 L d'eau par jour à l'arrosoir ; avec le système, il en reçoit 8 L, et les plantes poussent bien."
    calcul: "Économie d'eau : 12 − 8 = 4 L par jour, soit 4 ÷ 12 ≈ 0,33, environ 33 %."
    conclusion: "La **fonction** est remplie (les plantes sont arrosées) et le **critère environnemental** aussi : un tiers d'eau en moins."
    jules: "Évaluer, c'est mesurer puis comparer aux critères du départ. Sans mesure « avant », impossible de prouver une **économie**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Les trois piliers à citer : **environnemental**, **économique**, **social**. Un projet durable doit tenir les trois en même temps."
