blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: tenue, titre: "Tenue mécanique", sous_titre: "résister aux efforts sans casser", principal: true}
      - {id: sollicit, titre: "Sollicitations", sous_titre: "traction, compression, flexion, torsion"}
      - {id: deform, titre: "Déformations", sous_titre: "élastique, plastique, rupture"}
      - {id: valider, titre: "Valider", sous_titre: "simulation ou protocole d'essai"}
      - {id: indices, titre: "Indices", sous_titre: "énergétique, réparabilité"}
    liens:
