<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="22" text-anchor="middle" dominant-baseline="central">Fonction conservée : transmettre la voix à distance</text>

<g class="node c-blue"><rect x="20" y="48" width="180" height="84" rx="10" stroke-width="0.5"/>
<text class="th" x="110" y="70" text-anchor="middle" dominant-baseline="central">Téléphone fixe</text>
<text class="ts" x="110" y="92" text-anchor="middle" dominant-baseline="central">fin du XIXe siècle</text>
<text class="ts" x="110" y="112" text-anchor="middle" dominant-baseline="central">la voix passe par un fil</text></g>

<g class="node c-blue"><rect x="250" y="48" width="180" height="84" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central">Téléphone mobile</text>
<text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">années 1980-1990</text>
<text class="ts" x="340" y="112" text-anchor="middle" dominant-baseline="central">ondes radio, sans fil</text></g>

<g class="node c-blue"><rect x="480" y="48" width="180" height="84" rx="10" stroke-width="0.5"/>
<text class="th" x="570" y="70" text-anchor="middle" dominant-baseline="central">Smartphone</text>
<text class="ts" x="570" y="92" text-anchor="middle" dominant-baseline="central">années 2000</text>
<text class="ts" x="570" y="112" text-anchor="middle" dominant-baseline="central">écran tactile, Internet</text></g>

<line x1="204" y1="90" x2="244" y2="90" class="arr" marker-end="url(#fl)"/>
<line x1="434" y1="90" x2="474" y2="90" class="arr" marker-end="url(#fl)"/>

<line x1="225" y1="96" x2="225" y2="160" class="leader"/>
<line x1="455" y1="96" x2="455" y2="160" class="leader"/>

<g class="node c-coral"><rect x="110" y="160" width="230" height="74" rx="10" stroke-width="0.5"/>
<text class="th" x="225" y="182" text-anchor="middle" dominant-baseline="central">Innovation de rupture</text>
<text class="ts" x="225" y="204" text-anchor="middle" dominant-baseline="central">le principe technique change :</text>
<text class="ts" x="225" y="220" text-anchor="middle" dominant-baseline="central">le fil est remplacé par la radio</text></g>

<g class="node c-teal"><rect x="350" y="160" width="230" height="74" rx="10" stroke-width="0.5"/>
<text class="th" x="465" y="182" text-anchor="middle" dominant-baseline="central">Innovation d'usage</text>
<text class="ts" x="465" y="204" text-anchor="middle" dominant-baseline="central">on s'en sert autrement :</text>
<text class="ts" x="465" y="220" text-anchor="middle" dominant-baseline="central">photos, messages, applications</text></g>

<g class="c-gray"><rect x="20" y="258" width="640" height="68" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="280" text-anchor="middle" dominant-baseline="central">Chaque génération garde la fonction d'origine…</text>
<text class="t" x="340" y="304" text-anchor="middle" dominant-baseline="central">… et en ajoute : se déplacer en appelant, puis photographier, naviguer.</text></g>

<g class="c-gray"><rect x="20" y="340" width="640" height="64" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="360" text-anchor="middle" dominant-baseline="central">Contraintes sociétales à respecter à chaque étape</text>
<text class="t" x="340" y="384" text-anchor="middle" dominant-baseline="central">coût acceptable · environnement · acceptation par les usagers · lois</text></g>
</svg>
