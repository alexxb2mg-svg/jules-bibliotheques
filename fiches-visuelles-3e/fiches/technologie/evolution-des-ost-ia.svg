<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="node c-blue"><rect x="16" y="20" width="146" height="82" rx="10" stroke-width="0.5"/>
<text class="th" x="89" y="42" text-anchor="middle" dominant-baseline="central">Données</text>
<text class="ts" x="89" y="64" text-anchor="middle" dominant-baseline="central">des milliers</text>
<text class="ts" x="89" y="82" text-anchor="middle" dominant-baseline="central">d'exemples</text></g>

<g class="node c-purple"><rect x="186" y="20" width="146" height="82" rx="10" stroke-width="0.5"/>
<text class="th" x="259" y="42" text-anchor="middle" dominant-baseline="central">Apprentissage</text>
<text class="ts" x="259" y="64" text-anchor="middle" dominant-baseline="central">le programme règle</text>
<text class="ts" x="259" y="82" text-anchor="middle" dominant-baseline="central">son modèle</text></g>

<g class="node c-purple"><rect x="356" y="20" width="146" height="82" rx="10" stroke-width="0.5"/>
<text class="th" x="429" y="42" text-anchor="middle" dominant-baseline="central">IA entraînée</text>
<text class="ts" x="429" y="64" text-anchor="middle" dominant-baseline="central">reçoit une</text>
<text class="ts" x="429" y="82" text-anchor="middle" dominant-baseline="central">nouvelle question</text></g>

<g class="node c-blue"><rect x="526" y="20" width="138" height="82" rx="10" stroke-width="0.5"/>
<text class="th" x="595" y="42" text-anchor="middle" dominant-baseline="central">Réponse</text>
<text class="ts" x="595" y="64" text-anchor="middle" dominant-baseline="central">la plus probable,</text>
<text class="ts" x="595" y="82" text-anchor="middle" dominant-baseline="central">à vérifier</text></g>

<line x1="164" y1="61" x2="182" y2="61" class="arr" marker-end="url(#fl)"/>
<line x1="334" y1="61" x2="352" y2="61" class="arr" marker-end="url(#fl)"/>
<line x1="504" y1="61" x2="522" y2="61" class="arr" marker-end="url(#fl)"/>

<text class="th" x="340" y="134" text-anchor="middle" dominant-baseline="central">Trois grands types d'apprentissage</text>

<g class="node c-purple"><rect x="16" y="152" width="206" height="92" rx="10" stroke-width="0.5"/>
<text class="th" x="119" y="174" text-anchor="middle" dominant-baseline="central">Supervisé</text>
<text class="ts" x="119" y="196" text-anchor="middle" dominant-baseline="central">exemples étiquetés :</text>
<text class="ts" x="119" y="214" text-anchor="middle" dominant-baseline="central">« chat », « chien »…</text>
<text class="ts" x="119" y="232" text-anchor="middle" dominant-baseline="central">ex. : trier des photos</text></g>

<g class="node c-purple"><rect x="237" y="152" width="206" height="92" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">Non supervisé</text>
<text class="ts" x="340" y="196" text-anchor="middle" dominant-baseline="central">sans étiquette : l'IA</text>
<text class="ts" x="340" y="214" text-anchor="middle" dominant-baseline="central">regroupe ce qui se ressemble</text>
<text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central">ex. : profils de clients</text></g>

<g class="node c-purple"><rect x="458" y="152" width="206" height="92" rx="10" stroke-width="0.5"/>
<text class="th" x="561" y="174" text-anchor="middle" dominant-baseline="central">Par renforcement</text>
<text class="ts" x="561" y="196" text-anchor="middle" dominant-baseline="central">essais et erreurs,</text>
<text class="ts" x="561" y="214" text-anchor="middle" dominant-baseline="central">bons choix récompensés</text>
<text class="ts" x="561" y="232" text-anchor="middle" dominant-baseline="central">ex. : jeu, robot qui marche</text></g>

<g class="node c-coral"><rect x="16" y="266" width="648" height="78" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="288" text-anchor="middle" dominant-baseline="central">Biais : des données mal choisies donnent des erreurs systématiques</text>
<text class="ts" x="340" y="310" text-anchor="middle" dominant-baseline="central">Ex. : entraînée avec peu de voix ayant un accent, l'IA comprend moins bien ces personnes.</text>
<text class="ts" x="340" y="328" text-anchor="middle" dominant-baseline="central">Elle reproduit les erreurs et les inégalités déjà présentes dans ses données.</text></g>

<g class="c-gray"><rect x="16" y="358" width="648" height="66" rx="10" stroke-width="0.5"/>
<text class="th" x="340" y="380" text-anchor="middle" dominant-baseline="central">Une IA n'a pas de conscience : elle peut se tromper</text>
<text class="ts" x="340" y="402" text-anchor="middle" dominant-baseline="central">Réflexe : vérifier sa réponse avec d'autres sources avant de s'y fier.</text></g>
</svg>
