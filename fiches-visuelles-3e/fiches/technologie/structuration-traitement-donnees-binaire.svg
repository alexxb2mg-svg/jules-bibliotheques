<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<title>Coder des données avec des bits</title>
<desc>Deux octets de 8 bits avec le poids de chaque bit : la lettre A codée 65, soit 64 + 1, et le nombre 13, soit 8 + 4 + 1. En bas : bit, booléen, octet et ASCII étendu.</desc>
<text class="th" x="340" y="24" text-anchor="middle">Tout est codé avec des bits (0 ou 1)</text>
<text class="ts" x="160" y="58" text-anchor="end">poids</text>
<text class="ts" x="195" y="58" text-anchor="middle">128</text>
<text class="ts" x="250" y="58" text-anchor="middle">64</text>
<text class="ts" x="305" y="58" text-anchor="middle">32</text>
<text class="ts" x="360" y="58" text-anchor="middle">16</text>
<text class="ts" x="415" y="58" text-anchor="middle">8</text>
<text class="ts" x="470" y="58" text-anchor="middle">4</text>
<text class="ts" x="525" y="58" text-anchor="middle">2</text>
<text class="ts" x="580" y="58" text-anchor="middle">1</text>
<text class="th" x="160" y="90" text-anchor="end" dominant-baseline="central">lettre « A »</text>
<g class="c-gray"><rect x="170" y="70" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="195" y="90" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-blue"><rect x="225" y="70" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="250" y="90" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="c-gray"><rect x="280" y="70" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="305" y="90" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-gray"><rect x="335" y="70" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="360" y="90" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-gray"><rect x="390" y="70" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="415" y="90" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-gray"><rect x="445" y="70" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="470" y="90" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-gray"><rect x="500" y="70" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="525" y="90" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-blue"><rect x="555" y="70" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="580" y="90" text-anchor="middle" dominant-baseline="central">1</text></g>
<text class="t" x="387" y="132" text-anchor="middle">64 + 1 = 65 : le code ASCII de la lettre A</text>
<text class="th" x="160" y="180" text-anchor="end" dominant-baseline="central">nombre 13</text>
<g class="c-gray"><rect x="170" y="160" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="195" y="180" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-gray"><rect x="225" y="160" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="250" y="180" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-gray"><rect x="280" y="160" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="305" y="180" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-gray"><rect x="335" y="160" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="360" y="180" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-blue"><rect x="390" y="160" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="415" y="180" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="c-blue"><rect x="445" y="160" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="470" y="180" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="c-gray"><rect x="500" y="160" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="525" y="180" text-anchor="middle" dominant-baseline="central">0</text></g>
<g class="c-blue"><rect x="555" y="160" width="50" height="40" rx="4" stroke-width="0.8"/>
<text class="th" x="580" y="180" text-anchor="middle" dominant-baseline="central">1</text></g>
<text class="t" x="387" y="222" text-anchor="middle">8 + 4 + 1 = 13</text>
<g class="node c-teal"><rect x="20" y="262" width="152" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="96" y="284" text-anchor="middle" dominant-baseline="central">Bit</text>
<text class="t" x="96" y="310" text-anchor="middle" dominant-baseline="central">0 ou 1</text>
<text class="ts" x="96" y="334" text-anchor="middle" dominant-baseline="central">la plus petite donnée</text></g>
<g class="node c-teal"><rect x="182" y="262" width="152" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="258" y="284" text-anchor="middle" dominant-baseline="central">Booléen</text>
<text class="t" x="258" y="310" text-anchor="middle" dominant-baseline="central">VRAI (1) ou FAUX (0)</text>
<text class="ts" x="258" y="334" text-anchor="middle" dominant-baseline="central">1 bit suffit</text></g>
<g class="node c-teal"><rect x="344" y="262" width="152" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="420" y="284" text-anchor="middle" dominant-baseline="central">Octet</text>
<text class="t" x="420" y="310" text-anchor="middle" dominant-baseline="central">8 bits</text>
<text class="ts" x="420" y="334" text-anchor="middle" dominant-baseline="central">2⁸ = 256 valeurs : 0 à 255</text></g>
<g class="node c-teal"><rect x="506" y="262" width="152" height="96" rx="8" stroke-width="0.5"/>
<text class="th" x="582" y="284" text-anchor="middle" dominant-baseline="central">ASCII étendu</text>
<text class="t" x="582" y="310" text-anchor="middle" dominant-baseline="central">1 caractère = 1 octet</text>
<text class="ts" x="582" y="334" text-anchor="middle" dominant-baseline="central">256 caractères possibles</text></g>
</svg>
