<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mécanismes : transmettre ou transformer un mouvement">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-teal"><text class="th" x="170" y="24" text-anchor="middle" dominant-baseline="central">Transmettre un mouvement</text>
<text class="ts" x="170" y="44" text-anchor="middle" dominant-baseline="central">rotation → rotation</text></g>
<g class="c-amber"><text class="th" x="510" y="24" text-anchor="middle" dominant-baseline="central">Transformer un mouvement</text>
<text class="ts" x="510" y="44" text-anchor="middle" dominant-baseline="central">rotation → translation</text></g>
<line x1="340" y1="16" x2="340" y2="290" stroke="#d3d1c7" stroke-width="1"/>

<g class="c-teal"><circle cx="130" cy="150" r="44" stroke-width="1.5"/>
<circle cx="204" cy="150" r="30" stroke-width="1.5"/></g>
<circle cx="130" cy="150" r="3" fill="#0F6E56"/>
<circle cx="204" cy="150" r="3" fill="#0F6E56"/>
<path d="M100 98 A60 60 0 0 1 160 98" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M228 116 A42 42 0 0 0 180 116" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="130" y="208" text-anchor="middle" dominant-baseline="central">grande roue</text>
<text class="ts" x="220" y="194" text-anchor="start" dominant-baseline="central">petite roue</text>

<g class="c-amber"><circle cx="500" cy="128" r="34" stroke-width="1.5"/></g>
<circle cx="500" cy="128" r="3" fill="#854F0B"/>
<path d="M470 84 A52 52 0 0 1 530 84" fill="none" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="400,170 405,162 410,170 415,162 420,170 425,162 430,170 435,162 440,170 445,162 450,170 455,162 460,170 465,162 470,170 475,162 480,170 485,162 490,170 495,162 500,170 505,162 510,170 515,162 520,170 525,162 530,170 535,162 540,170 545,162 550,170 555,162 560,170 565,162 570,170 575,162 580,170 585,162 590,170 595,162 600,170" fill="none" stroke="#854F0B" stroke-width="1.5"/>
<rect x="400" y="170" width="200" height="18" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<line x1="560" y1="204" x2="440" y2="204" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="545" y="128" text-anchor="start" dominant-baseline="central">pignon</text>
<text class="ts" x="610" y="179" text-anchor="start" dominant-baseline="central">crémaillère</text>

<g class="c-teal"><text class="th" x="170" y="236" text-anchor="middle" dominant-baseline="central">Engrenage</text>
<text class="ts" x="170" y="256" text-anchor="middle" dominant-baseline="central">sens de rotation inversé ; la petite roue tourne plus vite</text>
<text class="ts" x="170" y="276" text-anchor="middle" dominant-baseline="central">aussi : poulies et courroie, pignons et chaîne</text></g>
<g class="c-amber"><text class="th" x="510" y="236" text-anchor="middle" dominant-baseline="central">Pignon et crémaillère</text>
<text class="ts" x="510" y="256" text-anchor="middle" dominant-baseline="central">le pignon tourne, la crémaillère avance en ligne droite</text>
<text class="ts" x="510" y="276" text-anchor="middle" dominant-baseline="central">aussi : bielle et manivelle, came, vis et écrou</text></g>

<g class="c-gray"><rect x="20" y="304" width="640" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="323" text-anchor="middle" dominant-baseline="central">Sécurité en atelier de fabrication</text>
<text class="ts" x="340" y="343" text-anchor="middle" dominant-baseline="central">lunettes de protection, cheveux attachés, pas d'écharpe ; une machine seulement avec l'accord du professeur</text></g>
</svg>
