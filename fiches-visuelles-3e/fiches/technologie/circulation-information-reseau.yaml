generation: {par: "projet-jules", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Réseau informatique »", url: "https://fr.wikipedia.org/w/index.php?title=R%C3%A9seau_informatique&oldid=238275738", licence: CC-BY-SA-4.0}
  - {titre: "Wikipédia, « Adresse IP »", url: "https://fr.wikipedia.org/w/index.php?title=Adresse_IP&oldid=239491530", licence: CC-BY-SA-4.0}
  - {titre: "Wikipédia, « Routeur »", url: "https://fr.wikipedia.org/w/index.php?title=Routeur&oldid=239607839", licence: CC-BY-SA-4.0}
