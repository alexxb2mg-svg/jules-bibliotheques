notion: choix-ost-developpement-durable
titre: "Choisir un OST durable : cycle de vie, trois piliers, indice de réparabilité"
matiere: technologie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
generation: {par: "projet-jules", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Développement durable »", url: "https://fr.vikidia.org/w/index.php?title=D%C3%A9veloppement_durable&oldid=2556115", licence: CC-BY-SA-3.0}
  - {titre: "Wikipédia, « Indice de réparabilité »", url: "https://fr.wikipedia.org/w/index.php?title=Indice_de_r%C3%A9parabilit%C3%A9&oldid=235153255", licence: CC-BY-SA-4.0}
  - {titre: "Annexe — Programme de technologie du cycle 4", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20de%20technologie%20du%20cycle%204-368016.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: choix, titre: "Choisir un OST durable", sous_titre: "comparer plusieurs objets pour un même besoin", principal: true}
      - {id: cycle, titre: "Cycle de vie", sous_titre: "de l'extraction à la fin de vie"}
      - {id: piliers, titre: "Trois piliers", sous_titre: "économique, social, environnemental"}
      - {id: indices, titre: "Indices affichés", sous_titre: "réparabilité sur 10, étiquette énergie"}
      - {id: criteres, titre: "Critères de choix", sous_titre: "qualité, efficacité énergétique, recyclabilité"}
    liens:
      - {de: choix, vers: cycle}
      - {de: choix, vers: piliers}
      - {de: choix, vers: indices}
      - {de: choix, vers: criteres}
    jules: "Le **développement durable** répond aux besoins du présent sans empêcher les générations futures de répondre aux leurs (définition de 1987). « Durable » ne veut donc pas dire seulement « écologique »."

  - id: schema-cycle
    type: schema
    titre: "Le cycle de vie d'un objet technique et ses impacts"
    svg: "choix-ost-developpement-durable.svg"
    jules: "Chaque étape consomme de l'énergie et des matières et rejette des gaz à effet de serre : le **bilan carbone** les additionne toutes, transport et **fin de vie** compris."

  - id: schema-indice
    type: schema
    titre: "L'indice de réparabilité : 5 critères notés sur 2 points"
    svg: "choix-ost-developpement-durable-indice.svg"
    jules: "Cet indice est **calculé par le fabricant** lui-même, pas par un organisme indépendant. Depuis 2025, pour les téléviseurs et les lave-linge, il est remplacé par un **indice de durabilité**, qui tient aussi compte de la fiabilité."

  - id: graphe
    type: graphe
    gabarit: bilan-cycle-de-vie
    curseurs:
      - {id: curseur-duree, nom: duree, min: 1, max: 10, pas: 1, depart: 3}
      - {id: curseur-conso, nom: conso, min: 1, max: 5, pas: 1, depart: 2}
      - {id: curseur-repare, nom: repare, min: 0, max: 1, pas: 1, depart: 0}
    lectures:
      - {si: "duree <= 3 && repare == 0", texte: "Objet remplacé au bout de 3 ans ou moins : sa **fabrication** est à refaire souvent, la barre bleue s'allonge."}
      - {si: "duree >= 6", texte: "Garder l'objet longtemps **divise** l'impact de sa fabrication par le nombre d'années d'usage."}
      - {si: "conso >= 4 && duree >= 3", texte: "Objet gourmand en énergie : c'est l'**utilisation** qui pèse le plus, l'étiquette énergie compte."}
      - {si: "repare == 1", texte: "**Réparer** plutôt que racheter évite une nouvelle fabrication : c'est ce que mesure l'indice de réparabilité."}
    jules: "Chaque barre est l'impact d'une étape du cycle de vie **ramené à une année** d'usage (modèle simplifié). Bouge la durée ou répare l'objet : regarde la barre fabrication fondre."

  - id: methode
    type: methode
    etapes:
      - "Lister les objets qui répondent au **même besoin**, puis repérer pour chacun ses matériaux, sa source d'énergie et sa durée de vie."
      - "Parcourir chaque étape du **cycle de vie** : extraction, fabrication, transport, utilisation, fin de vie (réparer, recycler ou jeter)."
      - "Lire les indices : **indice de réparabilité** sur 10, et étiquette énergie, de A (le plus économe) à G."
      - "Relier chaque argument à un **pilier** : économique (coût), social (accessible à tous, conditions de travail), environnemental (ressources, pollution)."
      - "Conclure par le choix qui **équilibre** le mieux les trois piliers, et le justifier."
    jules: "Les impacts environnementaux se rangent en quatre familles faciles à retenir : l'**air**, l'**eau**, le **sol** et la **santé**."

  - id: piege
    type: piege
    mauvaise_idee: "Pour juger l'impact d'un objet, il suffit de regarder sa **consommation** quand on l'utilise."
    pourquoi_faux: "L'utilisation n'est qu'**une étape** : l'extraction des matières, la fabrication, le transport et la fin de vie ont aussi des impacts, parfois plus grands que l'usage."
    bonne_idee: "On examine **tout le cycle de vie**. Pour un smartphone, l'essentiel des gaz à effet de serre est émis avant même qu'on l'allume : le garder plus longtemps compte beaucoup."
    jules: "Ne confonds pas **recyclage** (transformer un déchet en nouvelle matière) et **réparation** (remettre en état l'objet lui-même, qui continue de servir)."

  - id: exemple-choix
    type: exemple
    situation: "Deux smartphones ont les mêmes fonctions. A : indice de réparabilité 8 sur 10, batterie amovible. B : indice 3 sur 10, batterie collée. Lequel choisir ?"
    calcul: "8 > 3 et batterie remplaçable facilement : A pourra être réparé plus souvent et gardé plus longtemps."
    conclusion: "Le smartphone **A** : moins de déchets et de matières neuves (pilier **environnemental**), pas besoin de racheter un téléphone entier (pilier **économique**)."
    jules: "Une batterie s'use au fil des recharges : si on peut la changer, le téléphone vit plusieurs années de plus."

  - id: exemple-calcul
    type: exemple
    situation: "Un smartphone obtient : documentation 2, démontage 1,5, disponibilité des pièces 2, prix des pièces 1, critère spécifique 1,5. Quel est son indice ?"
    calcul: "2 + 1,5 + 2 + 1 + 1,5 = 8"
    conclusion: "Son **indice de réparabilité** vaut **8 sur 10** : il est plutôt facile à réparer ; le point faible est le prix des pièces."
    jules: "Chaque critère compte pour **2 points** au plus, soit le même poids : 5 × 2 = 10. Un critère faible montre ce que le fabricant peut améliorer."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi sur une paire de baskets : matières (coton, caoutchouc), fabrication, transport, utilisation, puis **fin de vie**. Pour chaque étape, cite un impact."
