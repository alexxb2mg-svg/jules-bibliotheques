<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Démarche de prototypage : concevoir, fabriquer, tester, comparer aux exigences, modifier">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="20" y="24" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="43" text-anchor="middle" dominant-baseline="central">Cahier des charges</text>
<text class="ts" x="140" y="61" text-anchor="middle" dominant-baseline="central">les exigences chiffrées à respecter</text></g>
<line x1="95" y1="80" x2="95" y2="126" class="arr" marker-end="url(#arrow)"/>

<g class="c-green"><rect x="500" y="24" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="43" text-anchor="middle" dominant-baseline="central">Solution validée</text>
<text class="ts" x="580" y="61" text-anchor="middle" dominant-baseline="central">on peut la produire</text></g>

<g class="c-blue"><rect x="20" y="130" width="150" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="150" text-anchor="middle" dominant-baseline="central">Concevoir</text>
<text class="ts" x="95" y="170" text-anchor="middle" dominant-baseline="central">croquis, schéma, CAO</text></g>
<line x1="172" y1="160" x2="196" y2="160" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="200" y="130" width="150" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="275" y="150" text-anchor="middle" dominant-baseline="central">Fabriquer</text>
<text class="ts" x="275" y="170" text-anchor="middle" dominant-baseline="central">le prototype</text></g>
<line x1="352" y1="160" x2="376" y2="160" class="arr" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="380" y="130" width="120" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="440" y="150" text-anchor="middle" dominant-baseline="central">Tester</text>
<text class="ts" x="440" y="170" text-anchor="middle" dominant-baseline="central">comme en usage réel</text></g>
<line x1="502" y1="160" x2="516" y2="160" class="arr" marker-end="url(#arrow)"/>

<polygon points="590,116 660,160 590,204 520,160" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="t" x="590" y="152" text-anchor="middle" dominant-baseline="central">exigences</text>
<text class="t" x="590" y="170" text-anchor="middle" dominant-baseline="central">respectées ?</text>

<line x1="590" y1="116" x2="590" y2="84" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="600" y="100" text-anchor="start" dominant-baseline="central">oui</text>
<path d="M590 204 V250 H95 V194" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="600" y="226" text-anchor="start" dominant-baseline="central">non</text>
<text class="ts" x="340" y="266" text-anchor="middle" dominant-baseline="central">on modifie la conception et on fabrique une nouvelle version (démarche itérative)</text>

<g class="c-blue"><rect x="20" y="290" width="310" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="175" y="309" text-anchor="middle" dominant-baseline="central">Prototype numérique</text>
<text class="ts" x="175" y="327" text-anchor="middle" dominant-baseline="central">modèle 3D simulé sur ordinateur, sans matière</text></g>
<g class="c-coral"><rect x="350" y="290" width="310" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="505" y="309" text-anchor="middle" dominant-baseline="central">Prototype physique</text>
<text class="ts" x="505" y="327" text-anchor="middle" dominant-baseline="central">objet réel, en un ou quelques exemplaires</text></g>
</svg>
