<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<title>Les deux chaînes d'un portail automatique</title>
<desc>En haut, la chaîne d'information : un récepteur acquiert le signal de la télécommande, la carte électronique vérifie le code, puis communique l'ordre. Cet ordre commande le relais de la chaîne d'énergie, en bas : alimentation secteur, relais, moteur électrique, bras articulé, portail qui s'ouvre.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="20" text-anchor="middle">Les deux chaînes d'un portail automatique</text>
<g class="c-blue"><text class="th" x="130" y="46">Chaîne d'information</text></g>
<g class="c-gray"><rect x="10" y="62" width="96" height="56" rx="8" stroke-width="0.5"/>
<text class="ts" x="58" y="81" text-anchor="middle" dominant-baseline="central">signal de la</text>
<text class="ts" x="58" y="99" text-anchor="middle" dominant-baseline="central">télécommande</text></g>
<g class="node c-blue"><rect x="130" y="56" width="150" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="76" text-anchor="middle" dominant-baseline="central">ACQUÉRIR</text>
<text class="ts" x="205" y="100" text-anchor="middle" dominant-baseline="central">récepteur radio</text></g>
<g class="node c-blue"><rect x="310" y="56" width="150" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="385" y="76" text-anchor="middle" dominant-baseline="central">TRAITER</text>
<text class="ts" x="385" y="100" text-anchor="middle" dominant-baseline="central">carte électronique</text></g>
<g class="node c-blue"><rect x="490" y="56" width="176" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="578" y="76" text-anchor="middle" dominant-baseline="central">COMMUNIQUER</text>
<text class="ts" x="578" y="96" text-anchor="middle" dominant-baseline="central">ordre au relais,</text>
<text class="ts" x="578" y="112" text-anchor="middle" dominant-baseline="central">feu clignotant</text></g>
<line x1="106" y1="90" x2="128" y2="90" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="90" x2="308" y2="90" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="90" x2="488" y2="90" class="arr" marker-end="url(#arrow)"/>
<path d="M578,124 V168 H250 V226" fill="none" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="t" x="414" y="160" text-anchor="middle">ordre « ouvrir »</text></g>
<g class="c-coral"><text class="th" x="20" y="212">Chaîne d'énergie</text></g>
<g class="node c-coral"><rect x="20" y="228" width="140" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="90" y="248" text-anchor="middle" dominant-baseline="central">ALIMENTER</text>
<text class="ts" x="90" y="272" text-anchor="middle" dominant-baseline="central">secteur 230 V</text></g>
<g class="node c-coral"><rect x="180" y="228" width="140" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="250" y="248" text-anchor="middle" dominant-baseline="central">DISTRIBUER</text>
<text class="ts" x="250" y="272" text-anchor="middle" dominant-baseline="central">relais</text></g>
<g class="node c-coral"><rect x="350" y="228" width="140" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="420" y="248" text-anchor="middle" dominant-baseline="central">CONVERTIR</text>
<text class="ts" x="420" y="272" text-anchor="middle" dominant-baseline="central">moteur électrique</text></g>
<g class="node c-coral"><rect x="520" y="228" width="146" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="593" y="248" text-anchor="middle" dominant-baseline="central">TRANSMETTRE</text>
<text class="ts" x="593" y="272" text-anchor="middle" dominant-baseline="central">bras articulé</text></g>
<line x1="160" y1="262" x2="178" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="262" x2="348" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="490" y1="262" x2="518" y2="262" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="170" y="316" text-anchor="middle">électrique</text>
<text class="ts" x="335" y="316" text-anchor="middle">électrique</text>
<text class="ts" x="505" y="316" text-anchor="middle">mécanique</text></g>
<line x1="593" y1="296" x2="593" y2="338" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="520" y="340" width="146" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="593" y="360" text-anchor="middle" dominant-baseline="central">le portail s'ouvre</text></g>
<text class="ts" x="20" y="352">L'information commande, l'énergie agit :</text>
<text class="ts" x="20" y="370">l'ordre arrive sur la fonction distribuer (le relais).</text>
<text class="ts" x="20" y="390">Bleu : information ; corail : énergie.</text>
</svg>
