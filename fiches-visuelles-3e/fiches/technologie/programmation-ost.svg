<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le cycle sans fin d'un microcontrôleur : lire, décider, agir">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="105" y="22" text-anchor="middle" dominant-baseline="central">Entrées : capteurs</text>
<g class="c-blue"><rect x="20" y="50" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="105" y="70" text-anchor="middle" dominant-baseline="central">bouton-poussoir</text></g>
<g class="c-blue"><rect x="20" y="120" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="105" y="140" text-anchor="middle" dominant-baseline="central">capteur de lumière</text></g>
<g class="c-blue"><rect x="20" y="190" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="105" y="210" text-anchor="middle" dominant-baseline="central">capteur de température</text></g>

<g class="c-blue"><rect x="245" y="40" width="190" height="200" rx="10" stroke-width="0.8"/>
<text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">Microcontrôleur</text>
<text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">(carte Arduino)</text>
<text class="t" x="262" y="112" text-anchor="start" dominant-baseline="central">1. lire les entrées</text>
<text class="t" x="262" y="140" text-anchor="start" dominant-baseline="central">2. décider (si … alors)</text>
<text class="t" x="262" y="168" text-anchor="start" dominant-baseline="central">3. commander</text>
<text class="t" x="276" y="186" text-anchor="start" dominant-baseline="central">les sorties</text>
<text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">↻ puis recommencer</text></g>

<line x1="190" y1="70" x2="243" y2="100" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="140" x2="243" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="190" y1="210" x2="243" y2="180" class="arr" marker-end="url(#arrow)"/>
<line x1="437" y1="120" x2="508" y2="70" class="arr" marker-end="url(#arrow)"/>
<line x1="437" y1="140" x2="508" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="437" y1="160" x2="508" y2="210" class="arr" marker-end="url(#arrow)"/>

<text class="th" x="585" y="22" text-anchor="middle" dominant-baseline="central">Sorties : actionneurs</text>
<g class="c-coral"><rect x="510" y="50" width="150" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="585" y="70" text-anchor="middle" dominant-baseline="central">LED</text></g>
<g class="c-coral"><rect x="510" y="120" width="150" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="585" y="140" text-anchor="middle" dominant-baseline="central">moteur</text></g>
<g class="c-coral"><rect x="510" y="190" width="150" height="40" rx="8" stroke-width="0.5"/>
<text class="t" x="585" y="210" text-anchor="middle" dominant-baseline="central">buzzer</text></g>

<g class="c-blue"><text class="ts" x="105" y="258" text-anchor="middle" dominant-baseline="central">acquérir</text>
<text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">traiter</text></g>
<g class="c-coral"><text class="ts" x="585" y="258" text-anchor="middle" dominant-baseline="central">convertir l'énergie</text></g>
<line x1="20" y1="274" x2="435" y2="274" stroke="#185FA5" stroke-width="2"/>
<text class="ts" x="228" y="290" text-anchor="middle" dominant-baseline="central">chaîne d'information</text>
<line x1="510" y1="274" x2="660" y2="274" stroke="#993C1D" stroke-width="2"/>
<text class="ts" x="585" y="290" text-anchor="middle" dominant-baseline="central">chaîne d'énergie</text>

<g class="c-gray"><rect x="20" y="314" width="640" height="72" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="336" text-anchor="middle" dominant-baseline="central">répéter indéfiniment : si luminosité &lt; 40 % alors allumer la LED sinon l'éteindre</text>
<text class="ts" x="340" y="362" text-anchor="middle" dominant-baseline="central">Le programme lit une entrée (capteur de lumière) et commande une sortie (LED).</text></g>
</svg>
