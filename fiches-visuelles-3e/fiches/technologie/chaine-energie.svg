<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<title>Chaîne d'énergie d'une perceuse à batterie et engrenage réducteur</title>
<desc>En haut, quatre blocs fléchés : alimenter (batterie), distribuer (gâchette), convertir (moteur électrique), transmettre (engrenages), puis le foret qui tourne. En bas, une petite roue menante de 20 dents entraîne une grande roue menée de 60 dents qui tourne 3 fois moins vite et en sens inverse.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340" y="24" text-anchor="middle">Chaîne d'énergie d'une perceuse à batterie</text>
<g class="node c-coral"><rect x="20" y="44" width="120" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="80" y="66" text-anchor="middle" dominant-baseline="central">ALIMENTER</text>
<text class="ts" x="80" y="88" text-anchor="middle" dominant-baseline="central">batterie</text>
<text class="ts" x="80" y="104" text-anchor="middle" dominant-baseline="central">(stocke l'énergie)</text></g>
<g class="node c-coral"><rect x="180" y="44" width="120" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="240" y="66" text-anchor="middle" dominant-baseline="central">DISTRIBUER</text>
<text class="ts" x="240" y="88" text-anchor="middle" dominant-baseline="central">gâchette</text>
<text class="ts" x="240" y="104" text-anchor="middle" dominant-baseline="central">(interrupteur)</text></g>
<g class="node c-coral"><rect x="340" y="44" width="120" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="400" y="66" text-anchor="middle" dominant-baseline="central">CONVERTIR</text>
<text class="ts" x="400" y="88" text-anchor="middle" dominant-baseline="central">moteur</text>
<text class="ts" x="400" y="104" text-anchor="middle" dominant-baseline="central">électrique</text></g>
<g class="node c-coral"><rect x="500" y="44" width="120" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="66" text-anchor="middle" dominant-baseline="central">TRANSMETTRE</text>
<text class="ts" x="560" y="88" text-anchor="middle" dominant-baseline="central">engrenages</text>
<text class="ts" x="560" y="104" text-anchor="middle" dominant-baseline="central">(réducteur)</text></g>
<line x1="140" y1="81" x2="178" y2="81" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="81" x2="338" y2="81" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="81" x2="498" y2="81" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="160" y="138" text-anchor="middle">électrique</text>
<text class="ts" x="320" y="138" text-anchor="middle">électrique</text>
<text class="ts" x="480" y="138" text-anchor="middle">mécanique</text></g>
<text class="ts" x="160" y="154" text-anchor="middle">(disponible)</text>
<text class="ts" x="320" y="154" text-anchor="middle">(autorisée)</text>
<text class="ts" x="480" y="154" text-anchor="middle">(rotation rapide)</text>
<line x1="560" y1="118" x2="560" y2="176" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="570" y="150">rotation lente</text></g>
<g class="c-gray"><rect x="470" y="178" width="190" height="36" rx="8" stroke-width="0.5"/>
<text class="t" x="565" y="196" text-anchor="middle" dominant-baseline="central">le foret tourne et perce</text></g>
<line x1="20" y1="196" x2="440" y2="196" class="leader"/>
<text class="th" x="20" y="224">Transmettre avec un engrenage</text>
<circle cx="140" cy="320" r="30" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="8" stroke-dasharray="4.71 4.71"/>
<circle cx="140" cy="320" r="4" fill="#5F5E5A"/>
<circle cx="260" cy="320" r="90" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="8" stroke-dasharray="4.71 4.71"/>
<circle cx="260" cy="320" r="5" fill="#5F5E5A"/>
<path d="M98,320 A42,42 0 0,1 140,278" fill="none" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M362,320 A102,102 0 0,0 260,218" fill="none" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="262">roue menante</text>
<text class="ts" x="30" y="278">20 dents</text>
<line x1="80" y1="284" x2="112" y2="300" class="leader"/>
<text class="ts" x="260" y="432" text-anchor="middle">roue menée : 60 dents</text>
<text class="th" x="390" y="252">Petite roue menante, grande menée</text>
<text class="ts" x="390" y="276">menante : Z1 = 20 dents, N1 = 600 tr/min</text>
<text class="ts" x="390" y="296">menée : Z2 = 60 dents</text>
<text class="ts" x="390" y="316">N2 = 600 × 20 ÷ 60 = 200 tr/min</text>
<g class="c-coral"><text class="t" x="390" y="346">3 fois moins vite, mais plus de force</text>
<text class="t" x="390" y="370">2 roues : sens de rotation inversé</text></g>
<text class="ts" x="390" y="400">En corail : formes d'énergie et mouvements.</text>
<text class="ts" x="390" y="416">Dents simplifiées, vue de face.</text>
</svg>
