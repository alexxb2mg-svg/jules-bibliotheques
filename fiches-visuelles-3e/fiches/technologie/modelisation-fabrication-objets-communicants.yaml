    type: carte
    noeuds:
      - {id: objet, titre: "Objet communicant", sous_titre: "échange des données par un réseau", principal: true}
      - {id: modeliser, titre: "Modéliser", sous_titre: "chaînes, modèle 3D (CAO), programme"}
      - {id: fabriquer, titre: "Fabriquer", sous_titre: "découpe laser, impression 3D, usinage"}
