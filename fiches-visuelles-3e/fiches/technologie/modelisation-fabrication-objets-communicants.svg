<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un thermomètre connecté : ses chaînes et son chemin sur le réseau">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="20" y="20" text-anchor="start" dominant-baseline="central">Chaîne d'information (dans l'objet)</text>
<g class="c-blue"><rect x="20" y="36" width="180" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="55" text-anchor="middle" dominant-baseline="central">Acquérir</text>
<text class="ts" x="110" y="75" text-anchor="middle" dominant-baseline="central">capteur de température</text></g>
<g class="c-blue"><rect x="240" y="36" width="180" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="330" y="55" text-anchor="middle" dominant-baseline="central">Traiter</text>
<text class="ts" x="330" y="75" text-anchor="middle" dominant-baseline="central">microcontrôleur (carte)</text></g>
<g class="c-blue"><rect x="460" y="36" width="200" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="55" text-anchor="middle" dominant-baseline="central">Communiquer</text>
<text class="ts" x="560" y="75" text-anchor="middle" dominant-baseline="central">module Wi-Fi ou Bluetooth</text></g>
<line x1="200" y1="65" x2="238" y2="65" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="65" x2="458" y2="65" class="arr" marker-end="url(#arrow)"/>

<line x1="560" y1="94" x2="560" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="570" y="122" text-anchor="start" dominant-baseline="central">ondes radio</text>

<text class="th" x="20" y="136" text-anchor="start" dominant-baseline="central">Réseau</text>
<g class="c-teal"><rect x="460" y="152" width="200" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="171" text-anchor="middle" dominant-baseline="central">Box (routeur)</text>
<text class="ts" x="560" y="191" text-anchor="middle" dominant-baseline="central">relie la maison à Internet</text></g>
<g class="c-teal"><rect x="240" y="152" width="180" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="330" y="171" text-anchor="middle" dominant-baseline="central">Serveur</text>
<text class="ts" x="330" y="191" text-anchor="middle" dominant-baseline="central">stocke les mesures</text></g>
<g class="c-teal"><rect x="20" y="152" width="180" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="171" text-anchor="middle" dominant-baseline="central">Smartphone (IHM)</text>
<text class="ts" x="110" y="191" text-anchor="middle" dominant-baseline="central">l'appli affiche 19 °C</text></g>
<line x1="460" y1="181" x2="422" y2="181" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="181" x2="202" y2="181" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="441" y="222" text-anchor="middle" dominant-baseline="central">Internet</text>

<text class="th" x="20" y="252" text-anchor="start" dominant-baseline="central">Chaîne d'énergie</text>
<g class="c-coral"><rect x="20" y="268" width="180" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="287" text-anchor="middle" dominant-baseline="central">Alimenter</text>
<text class="ts" x="110" y="307" text-anchor="middle" dominant-baseline="central">piles ou secteur</text></g>
<g class="c-coral"><rect x="240" y="268" width="180" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="330" y="287" text-anchor="middle" dominant-baseline="central">Distribuer</text>
<text class="ts" x="330" y="307" text-anchor="middle" dominant-baseline="central">interrupteur marche-arrêt</text></g>
<line x1="200" y1="297" x2="238" y2="297" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="297" x2="458" y2="297" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="464" y="289" text-anchor="start" dominant-baseline="central">énergie électrique pour</text>
<text class="ts" x="464" y="307" text-anchor="start" dominant-baseline="central">le capteur, la carte, le module</text></g>

<g class="c-gray"><rect x="20" y="350" width="640" height="76" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="372" text-anchor="middle" dominant-baseline="central">IHM (interface humain-machine) : ce que l'on voit ou touche, écran, boutons, application.</text>
<text class="ts" x="340" y="392" text-anchor="middle" dominant-baseline="central">Un switch, lui, relierait plusieurs appareils du même réseau local.</text>
<text class="ts" x="340" y="412" text-anchor="middle" dominant-baseline="central">Bleu : information dans l'objet · Vert : réseau · Corail : énergie</text></g>
</svg>
