<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagramme de Gantt simplifié d'un projet de 5 séances, jalons et écoconception">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="20" text-anchor="middle" dominant-baseline="central">Planning d'un projet en 5 séances (diagramme de Gantt)</text>

<line x1="200" y1="58" x2="200" y2="306" stroke="#d3d1c7" stroke-width="1"/>
<line x1="292" y1="58" x2="292" y2="306" stroke="#d3d1c7" stroke-width="1"/>
<line x1="384" y1="58" x2="384" y2="306" stroke="#d3d1c7" stroke-width="1"/>
<line x1="476" y1="58" x2="476" y2="306" stroke="#d3d1c7" stroke-width="1"/>
<line x1="568" y1="58" x2="568" y2="306" stroke="#d3d1c7" stroke-width="1"/>
<line x1="660" y1="58" x2="660" y2="306" stroke="#d3d1c7" stroke-width="1"/>
<text class="ts" x="246" y="46" text-anchor="middle" dominant-baseline="central">séance 1</text>
<text class="ts" x="338" y="46" text-anchor="middle" dominant-baseline="central">séance 2</text>
<text class="ts" x="430" y="46" text-anchor="middle" dominant-baseline="central">séance 3</text>
<text class="ts" x="522" y="46" text-anchor="middle" dominant-baseline="central">séance 4</text>
<text class="ts" x="614" y="46" text-anchor="middle" dominant-baseline="central">séance 5</text>

<text class="t" x="20" y="78" text-anchor="start" dominant-baseline="central">Cahier des charges</text>
<text class="t" x="20" y="114" text-anchor="start" dominant-baseline="central">Chercher des solutions</text>
<text class="t" x="20" y="150" text-anchor="start" dominant-baseline="central">Modéliser en CAO</text>
<text class="t" x="20" y="186" text-anchor="start" dominant-baseline="central">Fabriquer, assembler</text>
<text class="t" x="20" y="222" text-anchor="start" dominant-baseline="central">Programmer</text>
<text class="t" x="20" y="258" text-anchor="start" dominant-baseline="central">Tester, présenter</text>

<g class="c-blue"><rect x="208" y="66" width="76" height="24" rx="4" stroke-width="1"/></g>
<g class="c-blue"><rect x="300" y="102" width="76" height="24" rx="4" stroke-width="1"/></g>
<g class="c-blue"><rect x="392" y="138" width="76" height="24" rx="4" stroke-width="1"/></g>
<g class="c-blue"><rect x="484" y="174" width="76" height="24" rx="4" stroke-width="1"/></g>
<g class="c-blue"><rect x="392" y="210" width="168" height="24" rx="4" stroke-width="1"/></g>
<g class="c-blue"><rect x="576" y="246" width="76" height="24" rx="4" stroke-width="1"/></g>

<path d="M284 78 H306 V100" class="arr" marker-end="url(#arrow)"/>
<path d="M376 114 H398 V136" class="arr" marker-end="url(#arrow)"/>
<path d="M376 114 H384 V222 H390" class="arr" marker-end="url(#arrow)"/>
<path d="M468 150 H490 V172" class="arr" marker-end="url(#arrow)"/>
<path d="M560 186 H582 V244" class="arr" marker-end="url(#arrow)"/>
<path d="M560 222 H582" class="arr"/>

<text class="t" x="20" y="294" text-anchor="start" dominant-baseline="central">Jalons (revues)</text>
<polygon points="292,284 302,294 292,304 282,294" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<polygon points="476,284 486,294 476,304 466,294" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<polygon points="660,284 670,294 660,304 650,294" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<g class="c-coral">
<text class="ts" x="292" y="320" text-anchor="middle" dominant-baseline="central">revue 1 : besoin validé</text>
<text class="ts" x="476" y="320" text-anchor="middle" dominant-baseline="central">revue 2 : avant fabrication</text>
<text class="ts" x="660" y="320" text-anchor="end" dominant-baseline="central">fin : bilan</text>
</g>

<g class="c-green"><rect x="20" y="344" width="640" height="84" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="364" text-anchor="middle" dominant-baseline="central">Écoconception : réduire l'impact à chaque étape du cycle de vie</text></g>
<g class="c-green"><rect x="36" y="384" width="100" height="30" rx="6" stroke-width="1"/>
<text class="ts" x="86" y="399" text-anchor="middle" dominant-baseline="central">matières</text></g>
<g class="c-green"><rect x="163" y="384" width="100" height="30" rx="6" stroke-width="1"/>
<text class="ts" x="213" y="399" text-anchor="middle" dominant-baseline="central">fabrication</text></g>
<g class="c-green"><rect x="290" y="384" width="100" height="30" rx="6" stroke-width="1"/>
<text class="ts" x="340" y="399" text-anchor="middle" dominant-baseline="central">transport</text></g>
<g class="c-green"><rect x="417" y="384" width="100" height="30" rx="6" stroke-width="1"/>
<text class="ts" x="467" y="399" text-anchor="middle" dominant-baseline="central">utilisation</text></g>
<g class="c-green"><rect x="544" y="384" width="100" height="30" rx="6" stroke-width="1"/>
<text class="ts" x="594" y="399" text-anchor="middle" dominant-baseline="central">fin de vie</text></g>
<line x1="137" y1="399" x2="161" y2="399" class="arr" marker-end="url(#arrow)"/>
<line x1="264" y1="399" x2="288" y2="399" class="arr" marker-end="url(#arrow)"/>
<line x1="391" y1="399" x2="415" y2="399" class="arr" marker-end="url(#arrow)"/>
<line x1="518" y1="399" x2="542" y2="399" class="arr" marker-end="url(#arrow)"/>

<rect x="20" y="446" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="ts" x="40" y="453" text-anchor="start" dominant-baseline="central">tâche (flèche : dépendance)</text>
<polygon points="247,446 254,453 247,460 240,453" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="ts" x="262" y="453" text-anchor="start" dominant-baseline="central">jalon, revue de projet</text>
<rect x="440" y="446" width="14" height="14" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text class="ts" x="460" y="453" text-anchor="start" dominant-baseline="central">écoconception</text>
