  - {titre: "Vikidia, « Moteur électrique »", url: "https://fr.vikidia.org/w/index.php?title=Moteur_%C3%A9lectrique&oldid=2338927", licence: CC-BY-SA-3.0}
  - {titre: "Wikipédia, « Chaîne énergétique »", url: "https://fr.wikipedia.org/w/index.php?title=Cha%C3%AEne_%C3%A9nerg%C3%A9tique&oldid=233093357", licence: CC-BY-SA-4.0}
