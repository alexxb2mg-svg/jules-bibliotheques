<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La démarche de validation, sur l'exemple d'un robot suiveur de ligne">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-blue"><rect x="20" y="14" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="33" text-anchor="middle" dominant-baseline="central">1. Cahier des charges</text>
<text class="ts" x="150" y="52" text-anchor="middle" dominant-baseline="central">exigence : vitesse ≥ 0,3 m/s</text></g>
<line x1="150" y1="70" x2="150" y2="88" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="20" y="90" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="109" text-anchor="middle" dominant-baseline="central">2. Protocole de test</text>
<text class="ts" x="150" y="128" text-anchor="middle" dominant-baseline="central">2 m de ligne, chronomètre, 3 essais</text></g>
<line x1="150" y1="146" x2="150" y2="164" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="20" y="166" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="185" text-anchor="middle" dominant-baseline="central">3. Mesure</text>
<text class="ts" x="150" y="204" text-anchor="middle" dominant-baseline="central">vitesse moyenne : 0,25 m/s</text></g>
<line x1="150" y1="222" x2="150" y2="240" class="arr" marker-end="url(#arrow)"/>
<polygon points="150,242 280,290 150,338 20,290" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="th" x="150" y="282" text-anchor="middle" dominant-baseline="central" fill="#0C447C">4. Exigence</text>
<text class="th" x="150" y="300" text-anchor="middle" dominant-baseline="central" fill="#0C447C">respectée ?</text>

<line x1="150" y1="338" x2="150" y2="366" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="162" y="352" text-anchor="start" dominant-baseline="central">oui</text>
<g class="c-teal"><rect x="40" y="368" width="220" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="385" text-anchor="middle" dominant-baseline="central">Validé</text>
<text class="ts" x="150" y="404" text-anchor="middle" dominant-baseline="central">la performance est conforme</text></g>

<line x1="280" y1="290" x2="358" y2="290" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="318" y="278" text-anchor="middle" dominant-baseline="central">non</text>
<g class="c-coral"><rect x="360" y="256" width="300" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="274" text-anchor="middle" dominant-baseline="central">5. Analyser l'écart</text>
<text class="ts" x="510" y="294" text-anchor="middle" dominant-baseline="central">0,25 − 0,3 = −0,05 m/s : pas assez rapide</text>
<text class="ts" x="510" y="311" text-anchor="middle" dominant-baseline="central">cause : moteur, frottements, batterie ?</text></g>
<line x1="510" y1="256" x2="510" y2="224" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="360" y="166" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="185" text-anchor="middle" dominant-baseline="central">6. Améliorer</text>
<text class="ts" x="510" y="204" text-anchor="middle" dominant-baseline="central">corriger une cause à la fois</text></g>
<line x1="360" y1="194" x2="282" y2="194" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="321" y="182" text-anchor="middle" dominant-baseline="central">retester</text>

<g class="c-gray"><rect x="360" y="14" width="300" height="132" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="34" text-anchor="middle" dominant-baseline="central">Forme d'une exigence</text>
<text class="ts" x="378" y="60" text-anchor="start" dominant-baseline="central">au moins : vitesse ≥ 0,3 m/s</text>
<text class="ts" x="378" y="82" text-anchor="start" dominant-baseline="central">au plus : bruit ≤ 60 dB</text>
<text class="ts" x="378" y="104" text-anchor="start" dominant-baseline="central">entre : 2 kg ≤ masse ≤ 2,5 kg</text>
<text class="ts" x="378" y="128" text-anchor="start" dominant-baseline="central">Bleu : démarche · Vert : validé · Corail : écart</text></g>
</svg>
