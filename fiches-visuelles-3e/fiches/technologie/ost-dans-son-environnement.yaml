      - {de: ost, vers: ergonomie}
      - {de: ergonomie, vers: ux, libelle: "fait partie de"}
      - {de: cdc, vers: ost, libelle: "encadre"}
    jules: "Chaque **interacteur** oublié peut devenir une panne ou un accident : une manette pensée sans la sueur des mains glisse, un boîtier pensé sans la pluie rouille."

  - id: schema-interacteurs
    type: schema
    titre: "Les interacteurs d'une manette de jeu"
    svg: "ost-dans-son-environnement.svg"
    jules: "Pour ne rien oublier, pose trois questions : **qui** l'utilise ? avec **quels objets** communique-t-il ? dans **quel milieu** fonctionne-t-il (chaud, humide, secoué) ?"

  - id: schema-parcours
    type: schema
    titre: "Représenter l'expérience utilisateur : le parcours d'utilisation"
    svg: "ost-dans-son-environnement-parcours.svg"
    jules: "Ce schéma des étapes d'utilisation est un **mode de représentation** comme un croquis, un graphique ou un algorithme : il montre où l'utilisateur est content et où il est gêné."

  - id: methode
    type: methode
    etapes:
      - "Lister les **interacteurs** : les utilisateurs (âge, taille, force), les autres objets, les données échangées, le milieu (température, humidité, poussière, chocs)."
      - "Analyser l'**ergonomie** : prise en main, lisibilité des commandes, effort ou posture imposés, sécurité."
      - "Décrire l'**expérience utilisateur** : suivre les étapes d'utilisation et noter ce qui est facile, agréable, ou au contraire frustrant."
      - "Relire le **cahier des charges** : séparer les fonctions attendues (ce que l'objet doit faire) des contraintes (limites à respecter : coût, masse, normes)."
    jules: "Les **normes** et les **labels** sont aussi des contraintes : un jouet vendu en Europe doit respecter des règles de sécurité, par exemple l'absence de petites pièces détachables pour les tout-petits."

  - id: piege
    type: piege
    mauvaise_idee: "**Ergonomie** et **expérience utilisateur**, c'est la même chose."
    pourquoi_faux: "L'ergonomie porte surtout sur le **confort physique**, la sécurité et l'efficacité de l'usage. L'expérience utilisateur est plus large : c'est le **ressenti global** (plaisir, facilité, frustration)."
    bonne_idee: "L'ergonomie est une partie de l'expérience utilisateur. Une manette peut être bien en main (bonne ergonomie) mais longue à connecter (expérience décevante)."
    jules: "Autre oubli fréquent : ne citer que l'utilisateur comme interacteur. Les autres objets et le **milieu** comptent autant."

  - id: exemple-velo
    type: exemple
    situation: "Un vélo à assistance électrique est conçu pour la ville. Citer trois interacteurs extérieurs et une contrainte d'ergonomie."
    calcul: "Utilisateur : cycliste de taille et de force variables. Milieu : chaussée (pavés, pluie, nuit). Autre objet : application de smartphone qui affiche l'autonomie de la batterie."
    conclusion: "Trois interacteurs de **types différents** (usager, milieu, objet). Contrainte d'**ergonomie** : selle et guidon réglables en hauteur pour s'adapter à chaque cycliste."
    jules: "Varier les types d'interacteurs, c'est ce qui rapporte des points : un usager, un objet, des données et le milieu valent mieux que quatre sortes d'usagers."

  - id: exemple-cdc
    type: exemple
    situation: "Dans le cahier des charges d'une lampe : « éclairer une pièce » et « coût de fabrication ≤ 15 euros ». Fonction ou contrainte ?"
    conclusion: "« Éclairer une pièce » est une **fonction** attendue (ce que l'objet doit faire). « Coût ≤ 15 euros » est une **contrainte** économique (une limite à respecter)."
    jules: "Le cahier des charges décrit le **besoin** et les contraintes, pas la solution : il ne dit pas quelle ampoule choisir, c'est le travail des concepteurs."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi sur un objet de ta chambre : liste ses interacteurs (toi, une prise, le Wi-Fi, la chaleur du soleil) et une **contrainte** qu'ils imposent."
