    type: exemple
    situation: "Donner un exemple d'influence géopolitique et un exemple d'influence culturelle de la France dans le monde."
    calcul: "Géopolitique : la France est **membre permanent** du Conseil de sécurité de l'ONU, avec un droit de veto. Culturelle : elle est au cœur de la francophonie, incarnée par l'OIF, créée en **1970** et qui réunit 90 États et gouvernements."
    conclusion: "L'influence de la France s'exerce sur plusieurs plans à la fois, hérités en partie de son histoire."
    jules: "Ajoute toujours une troisième dimension (économique : G7, UE) si le sujet demande un développement complet."

