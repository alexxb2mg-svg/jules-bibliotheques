  - id: piege
    type: piege
    mauvaise_idee: "Confondre francophonie (la pratique de la langue française) et OIF (l'organisation qui l'incarne officiellement), ou réduire l'influence française au seul plan culturel."
    pourquoi_faux: "La **francophonie** désigne les populations qui utilisent le français ; l'**OIF** est l'organisation créée en 1970 qui la structure. L'influence géopolitique (ONU) et économique (G7, UE) compte tout autant."
    bonne_idee: "Toujours illustrer au moins deux dimensions différentes (géopolitique, culturelle, économique) avec un exemple précis pour chacune."
    jules: "Ce piège fait perdre des points dans un développement construit qui ne traite qu'un seul aspect de l'influence française."

