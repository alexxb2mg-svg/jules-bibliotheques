notion: territoire-union-europeenne
titre: "Le territoire de l'Union européenne : caractéristiques et place de la France"
matiere: geographie
niveau: 3e
auteurs: ["hermes-geo2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-geo2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Union européenne »", url: "https://fr.vikidia.org/w/index.php?title=Union_europ%C3%A9enne&oldid=2556631", licence: CC-BY-SA-3.0}
  - {titre: "Wikipédia, « États membres de l'Union européenne »", url: "https://fr.wikipedia.org/w/index.php?title=%C3%89tats_membres_de_l%27Union_europ%C3%A9enne&oldid=239310027", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
abreviations: {UE: "Union européenne"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: ue, titre: "Union européenne", sous_titre: "27 États membres depuis le Brexit", principal: true}
      - {id: france, titre: "La France", sous_titre: "position centrale, plusieurs voisins"}
      - {id: schengen, titre: "Espace Schengen", sous_titre: "libre circulation des personnes"}
      - {id: transfrontalier, titre: "Régions transfrontalières", sous_titre: "ex. Rhin supérieur"}
    liens:
      - {de: ue, vers: france}
      - {de: ue, vers: schengen}
      - {de: france, vers: transfrontalier}
    jules: "**UE**, espace Schengen et zone euro sont trois ensembles différents : ils ne regroupent pas exactement les mêmes pays."

  - id: schema
    type: schema
    titre: "La France dans le territoire de l'Union européenne"
    svg: "territoire-union-europeenne.svg"
    jules: "Les **régions ultrapériphériques** (comme La Réunion) sont des territoires ultramarins français qui font partie intégrante de l'UE malgré leur éloignement."

  - id: graphe
    type: graphe
    gabarit: carte-tuiles-europe
    curseurs:
      - {id: curseur-couche, nom: couche, min: 1, max: 3, pas: 1, depart: 1}
      - {id: curseur-annee, nom: annee, min: 1957, max: 2026, pas: 1, depart: 2026}
    lectures:
      - {si: "couche == 1 && annee >= 2020", texte: "Aujourd'hui l'UE compte **27 pays** ; la France y est un **carrefour** entre l'Europe du Nord et la Méditerranée, ouvert sur l'Atlantique."}
      - {si: "couche == 2 && annee >= 1999", texte: "La **zone euro** ne regroupe pas tous les pays de l'UE : la Suède, la Pologne ou le Danemark gardent leur monnaie."}
      - {si: "couche == 3 && annee >= 1995", texte: "Dans l'**espace Schengen**, on passe les frontières sans contrôle ; la Suisse et la Norvège en font partie sans être dans l'UE."}
      - {si: "couche == 1 && annee < 1973", texte: "Au départ, l'Europe des **6** : la France fait partie des pays fondateurs."}
    jules: "Change de couche sans changer d'année : UE, euro et Schengen ne rassemblent pas les mêmes pays. Regarde où se trouve la France, encadrée en rouge."

  - id: methode
    type: methode
    etapes:
      - "Retenir le nombre d'États membres de l'UE (**27**) et un ordre de grandeur de sa population (plus de 440 millions)."
      - "Situer la France dans l'espace européen : ses voisins terrestres, sa position centrale."
      - "Donner un exemple précis de région transfrontalière (Rhin supérieur, Lille et la Belgique...)."
      - "Distinguer Union européenne, espace Schengen et zone euro : trois ensembles qui ne regroupent pas les mêmes pays."
    jules: "La superficie de l'UE (environ 4,2 millions de km²) est utile pour comparer avec la taille de la France."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre Union européenne, espace Schengen et zone euro, ou croire que le Royaume-Uni est encore membre de l'UE."
    pourquoi_faux: "Ce sont trois ensembles distincts qui ne réunissent pas les mêmes pays ; certains pays hors UE sont dans l'espace Schengen, certains membres de l'UE n'y sont pas. Le Royaume-Uni a quitté l'UE en 2020 (**Brexit**), après 47 ans de membership."
    bonne_idee: "Toujours préciser lequel des trois ensembles (UE, Schengen, zone euro) est concerné dans la réponse."
    jules: "Le Brexit a réduit l'UE de 28 à **27** membres : c'est le chiffre à retenir aujourd'hui."

  - id: exemple
    type: exemple
    situation: "Donner le nombre d'États membres de l'Union européenne depuis 2020 et expliquer pourquoi ce nombre a changé."
    calcul: "L'Union européenne compte **27 États membres** depuis 2020, après le départ du Royaume-Uni (le Brexit), qui était membre depuis 1973."
    conclusion: "Le nombre de membres de l'UE évolue selon les adhésions et les départs des États."
    jules: "Précise toujours la date du Brexit (2020) dans une réponse sur ce sujet."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🗺️", titre: "Carte des 27 États membres", description: "repérer les voisins de la France", outil: "lecon"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon"}
    jules: "Un exemple de coopération transfrontalière (Rhin supérieur, France-Allemagne-Suisse) vaut mieux qu'une généralité sur « l'Europe unie »."
