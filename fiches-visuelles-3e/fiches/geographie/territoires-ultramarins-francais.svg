<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="24" text-anchor="middle">Les territoires ultramarins français dans le monde</text>

<rect x="20" y="46" width="200" height="260" rx="10" class="c-blue" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text class="th" x="120" y="68" text-anchor="middle">Amérique et Antilles</text>
<rect x="35" y="82" width="170" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text class="t" x="120" y="98" text-anchor="middle" dominant-baseline="central">Guadeloupe (DROM)</text>
<rect x="35" y="126" width="170" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text class="t" x="120" y="142" text-anchor="middle" dominant-baseline="central">Martinique (DROM)</text>
<rect x="35" y="170" width="170" height="32" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
<text class="t" x="120" y="186" text-anchor="middle" dominant-baseline="central">Guyane (DROM)</text>
<text class="ts" x="120" y="222" text-anchor="middle">continental, pas une île</text>
<text class="ts" x="120" y="242" text-anchor="middle">forêt amazonienne</text>

<rect x="240" y="46" width="200" height="260" rx="10" class="c-teal" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text class="th" x="340" y="68" text-anchor="middle">Océan Indien</text>
<rect x="255" y="82" width="170" height="32" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text class="t" x="340" y="98" text-anchor="middle" dominant-baseline="central">La Réunion (DROM)</text>
<rect x="255" y="126" width="170" height="32" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
<text class="t" x="340" y="142" text-anchor="middle" dominant-baseline="central">Mayotte (DROM)</text>
<text class="ts" x="340" y="180" text-anchor="middle">îles, risque cyclonique</text>
<text class="ts" x="340" y="200" text-anchor="middle">et volcanique</text>

<rect x="460" y="46" width="200" height="260" rx="10" class="c-coral" fill="#ffe4e0" stroke="#dd6b55" stroke-width="1.5"/>
<text class="th" x="560" y="68" text-anchor="middle">Océanie</text>
<rect x="475" y="82" width="170" height="32" rx="6" fill="#ffffff" stroke="#dd6b55" stroke-width="1"/>
<text class="t" x="560" y="98" text-anchor="middle" dominant-baseline="central">Nouvelle-Calédonie (COM)</text>
<rect x="475" y="126" width="170" height="32" rx="6" fill="#ffffff" stroke="#dd6b55" stroke-width="1"/>
<text class="t" x="560" y="142" text-anchor="middle" dominant-baseline="central">Polynésie française (COM)</text>
<text class="ts" x="560" y="180" text-anchor="middle">collectivités d'outre-mer</text>
<text class="ts" x="560" y="200" text-anchor="middle">autonomie plus large</text>

<rect x="20" y="320" width="640" height="90" rx="10" class="c-amber" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text class="t" x="340" y="352" text-anchor="middle" dominant-baseline="central">Environ 18 % du territoire terrestre français, mais environ 4 % de sa population</text>
<text class="ts" x="340" y="380" text-anchor="middle" dominant-baseline="central">Défis communs : éloignement de la métropole, coûts de transport, risques naturels</text>

<text class="ts" x="660" y="440" text-anchor="end">Pas à l'échelle</text>
</svg>
