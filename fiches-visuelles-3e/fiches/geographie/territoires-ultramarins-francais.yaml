    pourquoi_faux: "Les **DROM** (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte) suivent les lois françaises comme un département métropolitain ; les **collectivités d'outre-mer** ont des statuts d'autonomie variés. La Guyane est continentale, pas insulaire."
