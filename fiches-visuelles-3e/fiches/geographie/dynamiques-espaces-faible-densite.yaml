notion: dynamiques-espaces-faible-densite
titre: "Les dynamiques des espaces de faible densité"
matiere: geographie
niveau: 3e
auteurs: ["hermes-geo1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-geo1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Montagne »", url: "https://fr.vikidia.org/w/index.php?title=Montagne&oldid=2563354", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Tourisme »", url: "https://fr.vikidia.org/w/index.php?title=Tourisme&oldid=2488818", licence: CC-BY-SA-3.0}
  - {titre: "data.gouv.fr, « Densité de population » (Insee, recensement 2022 : 120,1 hab./km² en France métropolitaine)", url: "https://www.data.gouv.fr/datasets/densite-de-population-1", licence: etalab-2.0}
  - {titre: "Insee Flash Île-de-France n° 95, « Ville de Paris : un portrait de ses habitants » (19 900 hab./km²)", url: "https://www.insee.fr/fr/statistiques/8274695", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: fd, titre: "Espace de faible densité", sous_titre: "diversité de dynamiques", principal: true}
      - {id: rural, titre: "Espace rural", sous_titre: "agriculture, néoruraux"}
      - {id: montagne, titre: "Montagne", sous_titre: "élevage, tourisme, énergie"}
      - {id: vide, titre: "Diagonale du vide", sous_titre: "Nord-Est → Sud-Ouest"}
    liens:
      - {de: fd, vers: rural}
      - {de: fd, vers: montagne}
      - {de: rural, vers: vide}
    jules: "Ne dis jamais que les espaces de faible densité sont « tous pareils » : certains se dépeuplent, d'autres attirent de nouveaux habitants."

  - id: schema
    type: schema
    titre: "Deux visages des espaces de faible densité"
    svg: "dynamiques-espaces-faible-densite.svg"
    jules: "Une vallée alpine peut cumuler plusieurs activités : élevage l'été, ski l'hiver, randonnée, et électricité produite par les torrents."

  - id: graphe-densite
    type: graphe
    gabarit: carre-densite
    curseurs:
      - {id: curseur-densite, nom: densite, min: 5, max: 500, pas: 5, depart: 20}
    lectures:
      - {si: "densite < 30", texte: "**Faible densité** : moins de 30 habitants par km², comme dans beaucoup d'espaces ruraux et de montagne."}
      - {si: "densite >= 30 && densite < 200", texte: "Densité moyenne : la France métropolitaine compte environ **120 habitants par km²**."}
      - {si: "densite >= 200", texte: "**Forte densité** : on se rapproche de la ville ; à Paris, il y a environ 20 000 habitants par km²."}
    jules: "La densité, c'est le nombre d'habitants divisé par la surface. Peu d'habitants ne veut pas dire espace vide : agriculture, tourisme et nouveaux habitants font vivre ces espaces."

  - id: methode
    type: methode
    etapes:
      - "Éviter l'idée reçue que les espaces de faible densité sont tous « à l'abandon » : chercher des exemples de dynamisme."
      - "Distinguer espace rural (agriculture) et espace de montagne (agriculture + tourisme), tout en notant leur point commun : la faible densité."
      - "Citer un exemple précis de ressource ou d'atout (agritourisme, station de ski, énergie hydroélectrique)."
      - "Relier ces dynamiques à la proximité ou à l'éloignement des grandes aires urbaines."
    jules: "Un espace rural proche d'une aire urbaine attire des **néoruraux** ; un espace rural isolé, dans la diagonale du vide, se dépeuple souvent."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que tous les espaces ruraux se ressemblent et déclinent de la même façon."
    pourquoi_faux: "Un espace rural proche d'une ville peut au contraire **gagner** des habitants (néoruraux, résidences secondaires), pendant qu'un espace isolé se dépeuple."
    bonne_idee: "Toujours préciser si l'espace rural étudié est proche ou éloigné d'une aire urbaine avant de parler de croissance ou de déprise."
    jules: "Autre piège : oublier les atouts touristiques et énergétiques de la montagne en la réduisant à l'agriculture seule."

  - id: exemple
    type: exemple
    situation: "Un espace de montagne peut-il avoir plusieurs activités productives à la fois ?"
    calcul: "Une vallée alpine combine l'élevage en été sur les alpages, le ski l'hiver, la randonnée l'été, et l'électricité produite par les torrents."
    conclusion: "Oui : la montagne cumule souvent **agriculture**, **tourisme** et énergie, ce qui la rend plus dynamique qu'on ne le croit."
    jules: "La « diagonale du vide » traverse la France du Nord-Est au Sud-Ouest : elle regroupe les espaces ruraux les plus dépeuplés."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "néorural, diagonale du vide", outil: "lexique"}
    jules: "Les habitants des villes qui s'installent à la campagne cherchent souvent un cadre de vie différent et des logements moins chers, parfois en travaillant à distance."
