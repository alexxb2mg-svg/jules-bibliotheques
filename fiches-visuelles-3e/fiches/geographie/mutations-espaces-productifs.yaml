notion: mutations-espaces-productifs
titre: "Les mutations des espaces productifs français"
matiere: geographie
niveau: 3e
auteurs: ["hermes-geo1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-geo1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Agriculture »", url: "https://fr.vikidia.org/w/index.php?title=Agriculture&oldid=2331506", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Tourisme »", url: "https://fr.vikidia.org/w/index.php?title=Tourisme&oldid=2488818", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
abreviations: {PAC: "politique agricole commune, l'aide financière de l'Union européenne aux agriculteurs"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: espace, titre: "Espace productif", sous_titre: "produire des richesses", principal: true}
      - {id: agricole, titre: "Agricole", sous_titre: "1er de l'UE, PAC"}
      - {id: industriel, titre: "Industriel", sous_titre: "délocalisations"}
      - {id: touristique, titre: "Touristique", sous_titre: "1er pays visité"}
      - {id: mondial, titre: "Mondialisation", sous_titre: "redessine ces espaces"}
    liens:
      - {de: espace, vers: agricole}
      - {de: espace, vers: industriel}
      - {de: espace, vers: touristique}
      - {de: industriel, vers: mondial}
    jules: "Un espace productif n'est pas forcément industriel : l'agriculture et le tourisme en sont aussi, et créent des richesses à leur façon."

  - id: schema
    type: schema
    titre: "Trois types d'espaces productifs, redessinés par la mondialisation"
    svg: "mutations-espaces-productifs.svg"
    jules: "L'agriculture emploie très peu de monde (environ **1,5 %** de la population active) mais reste la première d'Europe : elle s'est modernisée et concentrée sur de grandes exploitations."

  - id: graphe
    type: graphe
    gabarit: courbe-evolution
    curseurs:
      - {id: curseur-jeu, nom: jeu, min: 6, max: 6, pas: 1, depart: 6}
      - {id: curseur-annee, nom: annee, min: 1950, max: 2020, pas: 5, depart: 1950}
    lectures:
      - {si: "annee < 1975", texte: "Le pays s'**industrialise** : les usines recrutent, et beaucoup d'agriculteurs quittent la terre (exode rural)."}
      - {si: "annee >= 1975 && annee < 2000", texte: "**Désindustrialisation** : des usines ferment dans les vieilles régions industrielles (mines, sidérurgie du Nord et de l'Est)."}
      - {si: "annee >= 2000", texte: "Aujourd'hui, environ **3 emplois sur 4** sont dans les services : bureaux, commerce, santé, tourisme, souvent dans les métropoles."}
    jules: "Avance l'année : la courbe verte de l'agriculture s'effondre, l'orange de l'industrie monte puis baisse, la bleue des services s'envole."

  - id: methode
    type: methode
    etapes:
      - "Distinguer les trois types d'espaces productifs : industriels, agricoles, touristiques (ou d'affaires)."
      - "Pour chaque type, retenir un ou deux chiffres ou faits précis (rang mondial ou européen, part de la population active)."
      - "Montrer le lien entre mutations des espaces productifs, urbanisation et mondialisation."
      - "Éviter les généralités : toujours illustrer avec un exemple français concret."
    jules: "Trois mots-clés à associer à chaque type : agricole → **PAC**, industriel → délocalisation, touristique → emplois saisonniers."

  - id: piege
    type: piege
    mauvaise_idee: "Réduire les espaces productifs à l'industrie seule, en oubliant l'agriculture et le tourisme."
    pourquoi_faux: "Le programme distingue trois dominantes (industrielle, agricole, touristique ou d'affaires) : oublier les deux autres, c'est perdre la moitié de la réponse."
    bonne_idee: "Toujours citer les trois types avant de développer, puis choisir un exemple précis pour chacun."
    jules: "Autre piège fréquent : croire que l'agriculture emploie beaucoup de monde aujourd'hui, alors qu'elle n'emploie qu'environ **1,5 %** des actifs."

  - id: exemple
    type: exemple
    situation: "Pourquoi peut-on dire que l'agriculture française est un espace productif important malgré peu d'emplois ?"
    calcul: "La France assure environ 18 % de la production agricole et agroalimentaire de l'Union européenne, avec environ 1,5 % seulement de sa population active dans ce secteur."
    conclusion: "L'agriculture française s'est **modernisée** et concentrée sur de grandes exploitations performantes : peu d'emplois, mais une production considérable."
    jules: "La France est le pays le plus visité au monde, avec plus de **100 millions** d'arrivées touristiques internationales par an."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "espace productif, PAC, délocalisation", outil: "lexique"}
    jules: "La **mondialisation** pousse certaines usines à délocaliser, mais la France garde des activités industrielles innovantes à forte valeur ajoutée."
