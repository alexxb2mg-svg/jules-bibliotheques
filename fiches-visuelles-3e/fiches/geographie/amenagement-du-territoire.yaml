    bonne_idee: "Toujours citer les trois niveaux d'acteurs et préciser lequel finance l'exemple choisi."
    jules: "Autre piège fréquent : oublier de donner un exemple concret d'outil (une ligne à grande vitesse, une aide européenne) pour illustrer la réponse."

