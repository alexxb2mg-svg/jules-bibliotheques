<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Trois espaces productifs français</text>

<g class="node c-green">
<rect x="30" y="55" width="190" height="120" rx="10"/>
<text class="th" x="125" y="80" text-anchor="middle">Agricole</text>
<text class="ts" x="125" y="105" text-anchor="middle">1er de l'UE</text>
<text class="ts" x="125" y="125" text-anchor="middle">~18 % production UE</text>
<text class="ts" x="125" y="145" text-anchor="middle">~1,5 % population active</text>
<text class="ts" x="125" y="163" text-anchor="middle">soutenu par la PAC</text>
</g>

<g class="node c-coral">
<rect x="245" y="55" width="190" height="120" rx="10"/>
<text class="th" x="340" y="80" text-anchor="middle">Industriel</text>
<text class="ts" x="340" y="105" text-anchor="middle">délocalisations</text>
<text class="ts" x="340" y="125" text-anchor="middle">concurrence mondiale</text>
<text class="ts" x="340" y="145" text-anchor="middle">pôles de compétitivité</text>
<text class="ts" x="340" y="163" text-anchor="middle">secteurs innovants</text>
</g>

<g class="node c-teal">
<rect x="460" y="55" width="190" height="120" rx="10"/>
<text class="th" x="555" y="80" text-anchor="middle">Touristique</text>
<text class="ts" x="555" y="105" text-anchor="middle">1er pays visité au monde</text>
<text class="ts" x="555" y="125" text-anchor="middle">plus de 100 millions</text>
<text class="ts" x="555" y="145" text-anchor="middle">d'arrivées par an</text>
<text class="ts" x="555" y="163" text-anchor="middle">emplois saisonniers</text>
</g>

<line x1="125" y1="175" x2="300" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche2)"/>
<line x1="340" y1="175" x2="340" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche2)"/>
<line x1="555" y1="175" x2="380" y2="250" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche2)"/>

<g class="node c-purple">
<rect x="220" y="255" width="240" height="70" rx="10"/>
<text class="th" x="340" y="280" text-anchor="middle">Urbanisation + mondialisation</text>
<text class="ts" x="340" y="303" text-anchor="middle">redessinent ces espaces</text>
</g>

<g class="c-gray">
<rect x="40" y="360" width="600" height="46" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="378" text-anchor="middle" dominant-baseline="central">Un espace productif = un territoire organisé pour produire des richesses</text>
<text class="ts" x="340" y="396" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de synthèse</text>
</g>
</svg>
