<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Deux visages des espaces de faible densité</text>

<g class="node c-red">
<rect x="30" y="55" width="290" height="150" rx="10"/>
<text class="th" x="175" y="80" text-anchor="middle">Espace rural isolé</text>
<text class="ts" x="175" y="105" text-anchor="middle">« diagonale du vide »</text>
<text class="ts" x="175" y="125" text-anchor="middle">Nord-Est → Sud-Ouest</text>
<text class="ts" x="175" y="148" text-anchor="middle">dépeuplement</text>
<text class="ts" x="175" y="168" text-anchor="middle">peu d'emplois sur place</text>
<text class="ts" x="175" y="188" text-anchor="middle">éloigné des grandes villes</text>
</g>

<g class="node c-green">
<rect x="360" y="55" width="290" height="150" rx="10"/>
<text class="th" x="505" y="80" text-anchor="middle">Espace rural proche d'une ville</text>
<text class="ts" x="505" y="105" text-anchor="middle">arrivée de néoruraux</text>
<text class="ts" x="505" y="125" text-anchor="middle">résidences secondaires</text>
<text class="ts" x="505" y="148" text-anchor="middle">croissance de population</text>
<text class="ts" x="505" y="168" text-anchor="middle">cadre de vie recherché</text>
<text class="ts" x="505" y="188" text-anchor="middle">parfois travail à distance</text>
</g>

<text class="th" x="340" y="240" text-anchor="middle">La montagne : plusieurs ressources à la fois</text>
<g class="node c-teal">
<rect x="60" y="260" width="170" height="60" rx="8"/>
<text class="t" x="145" y="284" text-anchor="middle" dominant-baseline="central">Élevage l'été</text>
<text class="ts" x="145" y="303" text-anchor="middle" dominant-baseline="central">alpages</text>
</g>
<g class="node c-blue">
<rect x="255" y="260" width="170" height="60" rx="8"/>
<text class="t" x="340" y="284" text-anchor="middle" dominant-baseline="central">Ski l'hiver</text>
<text class="ts" x="340" y="303" text-anchor="middle" dominant-baseline="central">stations de montagne</text>
</g>
<g class="node c-amber">
<rect x="450" y="260" width="170" height="60" rx="8"/>
<text class="t" x="535" y="284" text-anchor="middle" dominant-baseline="central">Électricité</text>
<text class="ts" x="535" y="303" text-anchor="middle" dominant-baseline="central">énergie des torrents</text>
</g>

<g class="c-gray">
<rect x="40" y="350" width="600" height="46" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="368" text-anchor="middle" dominant-baseline="central">Les espaces de faible densité ne sont pas tous en déclin</text>
<text class="ts" x="340" y="386" text-anchor="middle" dominant-baseline="central">Pas à l'échelle — schéma de synthèse</text>
</g>
</svg>
