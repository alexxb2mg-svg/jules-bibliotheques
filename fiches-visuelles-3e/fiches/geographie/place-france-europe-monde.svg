<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="24" text-anchor="middle">Les trois dimensions de l'influence française dans le monde</text>

<g class="c-blue"><circle cx="340" cy="120" r="62" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="th" x="340" y="112" text-anchor="middle">Influence</text>
<text class="th" x="340" y="132" text-anchor="middle">française</text>

<g class="c-coral"><rect x="40" y="230" width="180" height="130" rx="10" fill="#ffe4e0" stroke="#dd6b55" stroke-width="1.5"/></g>
<text class="th" x="130" y="252" text-anchor="middle">Géopolitique</text>
<text class="t" x="130" y="278" text-anchor="middle" dominant-baseline="central">membre permanent</text>
<text class="t" x="130" y="298" text-anchor="middle" dominant-baseline="central">Conseil de sécurité</text>
<text class="t" x="130" y="318" text-anchor="middle" dominant-baseline="central">de l'ONU</text>
<text class="ts" x="130" y="342" text-anchor="middle">droit de veto</text>

<g class="c-teal"><rect x="250" y="230" width="180" height="130" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="th" x="340" y="252" text-anchor="middle">Culturelle</text>
<text class="t" x="340" y="278" text-anchor="middle" dominant-baseline="central">francophonie</text>
<text class="t" x="340" y="298" text-anchor="middle" dominant-baseline="central">OIF créée en 1970</text>
<text class="t" x="340" y="318" text-anchor="middle" dominant-baseline="central">90 États et</text>
<text class="ts" x="340" y="338" text-anchor="middle">gouvernements</text>

<g class="c-amber"><rect x="460" y="230" width="180" height="130" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="th" x="550" y="252" text-anchor="middle">Économique</text>
<text class="t" x="550" y="278" text-anchor="middle" dominant-baseline="central">membre du G7</text>
<text class="t" x="550" y="298" text-anchor="middle" dominant-baseline="central">membre fondateur</text>
<text class="t" x="550" y="318" text-anchor="middle" dominant-baseline="central">et moteur de l'UE</text>

<line x1="300" y1="175" x2="150" y2="228" class="leader" stroke="#4b5563" stroke-width="1.5"/>
<line x1="340" y1="182" x2="340" y2="228" class="leader" stroke="#4b5563" stroke-width="1.5"/>
<line x1="380" y1="175" x2="530" y2="228" class="leader" stroke="#4b5563" stroke-width="1.5"/>

<g class="c-gray"><rect x="40" y="380" width="600" height="30" rx="6" stroke-width="0.5"/></g>
<text class="ts" x="340" y="397" text-anchor="middle" dominant-baseline="central">Une influence héritée en partie de l'ancien empire colonial et du rôle fondateur dans l'UE</text>
</svg>
