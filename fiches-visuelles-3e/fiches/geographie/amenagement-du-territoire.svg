<text class="th" x="340" y="80" text-anchor="middle">Collectivités</text>
<text class="ts" x="340" y="103" text-anchor="middle">régions, départements,</text>
<text class="ts" x="340" y="121" text-anchor="middle">communes (décentralisation)</text>
</g>

<g class="node c-teal">
