<text class="th" x="560" y="80" text-anchor="middle">Union européenne</text>
<text class="ts" x="560" y="103" text-anchor="middle">politique régionale</text>
<text class="ts" x="560" y="121" text-anchor="middle">fonds européens</text>
</g>

<line x1="120" y1="145" x2="280" y2="230" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche3)"/>
<line x1="340" y1="145" x2="340" y2="230" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche3)"/>
<line x1="560" y1="145" x2="400" y2="230" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche3)"/>

