<text class="ts" x="340" y="283" text-anchor="middle">ligne à grande vitesse (TGV)</text>
<text class="ts" x="340" y="300" text-anchor="middle">aides aux entreprises, services publics</text>
</g>

<line x1="340" y1="325" x2="340" y2="360" stroke="#6b7280" stroke-width="2" marker-end="url(#fleche3)"/>

