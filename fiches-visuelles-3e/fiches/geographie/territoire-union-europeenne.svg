<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
</marker>
</defs>
<text class="th" x="340" y="24" text-anchor="middle">La France dans le territoire de l'Union européenne (27 États, 2026)</text>

<g class="c-blue"><rect x="40" y="50" width="280" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="th" x="180" y="72" text-anchor="middle">Union européenne</text>
<text class="t" x="180" y="98" text-anchor="middle" dominant-baseline="central">27 États membres</text>
<text class="t" x="180" y="122" text-anchor="middle" dominant-baseline="central">environ 4,2 millions de km²</text>
<text class="t" x="180" y="146" text-anchor="middle" dominant-baseline="central">plus de 443 millions d'habitants</text>

<g class="c-coral"><rect x="360" y="50" width="280" height="120" rx="10" fill="#ffe4e0" stroke="#dd6b55" stroke-width="1.5"/></g>
<text class="th" x="500" y="72" text-anchor="middle">France : position centrale</text>
<text class="t" x="500" y="98" text-anchor="middle" dominant-baseline="central">frontières avec plusieurs voisins</text>
<text class="t" x="500" y="122" text-anchor="middle" dominant-baseline="central">grand pays par la superficie</text>
<text class="t" x="500" y="146" text-anchor="middle" dominant-baseline="central">et la population</text>

<line x1="320" y1="110" x2="358" y2="110" class="arr" stroke="#4b5563" stroke-width="2" marker-end="url(#fleche)"/>

<g class="c-teal"><rect x="40" y="200" width="280" height="110" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="th" x="180" y="222" text-anchor="middle">Espace Schengen</text>
<text class="t" x="180" y="250" text-anchor="middle" dominant-baseline="central">libre circulation des personnes</text>
<text class="t" x="180" y="274" text-anchor="middle" dominant-baseline="central">pas exactement les mêmes pays</text>
<text class="t" x="180" y="294" text-anchor="middle" dominant-baseline="central">que l'UE</text>

<g class="c-amber"><rect x="360" y="200" width="280" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="th" x="500" y="222" text-anchor="middle">Région transfrontalière</text>
<text class="t" x="500" y="250" text-anchor="middle" dominant-baseline="central">ex. Rhin supérieur :</text>
<text class="t" x="500" y="274" text-anchor="middle" dominant-baseline="central">France, Allemagne, Suisse</text>

<line x1="180" y1="170" x2="180" y2="198" class="arr" stroke="#4b5563" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="500" y1="170" x2="500" y2="198" class="arr" stroke="#4b5563" stroke-width="2" marker-end="url(#fleche)"/>

<g class="c-purple"><rect x="40" y="335" width="600" height="80" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="340" y="362" text-anchor="middle" dominant-baseline="central">Certains territoires ultramarins français (« régions ultrapériphériques »)</text>
<text class="t" x="340" y="386" text-anchor="middle" dominant-baseline="central">font aussi partie intégrante de l'Union européenne, malgré leur éloignement.</text>
</svg>
