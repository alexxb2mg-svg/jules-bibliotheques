notion: ecrit-reflexif
titre: "L'écrit réflexif et la prise de notes"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_3"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Prise de notes »"
    url: "https://fr.wikipedia.org/w/index.php?title=Prise_de_notes&oldid=239721500"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_3", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: reflexif, titre: "Écrit réflexif", sous_titre: "expliquer, justifier", principal: true}
      - {id: notes, titre: "Prise de notes", sous_titre: "résumé personnel"}
      - {id: longueur, titre: "2000 à 3000 signes", sous_titre: "demi-page à une page"}
    liens:
      - {de: reflexif, vers: notes, libelle: "s'appuie sur"}
      - {de: reflexif, vers: longueur, libelle: "vise en général"}
    jules: "L'écrit réflexif dit pourquoi on pense ce qu'on écrit, pas seulement ce qu'on écrit."

  - id: methode
    type: methode
    etapes:
      - "Avant d'écrire : lister au brouillon les idées principales à expliquer."
      - "Pour la prise de notes : pas de phrases complètes, des abréviations et symboles."
      - "Expliquer pourquoi on pense ce qu'on écrit, pas seulement ce qu'on pense."
      - "Relire : chaque idée est-elle justifiée par une explication ou un exemple ?"
      - "Vérifier la longueur demandée (2 000 à 3 000 signes)."
    jules: "L'étape 3 est la plus oubliée : un résultat seul, sans « parce que », n'est pas un écrit réflexif."

  - id: piege
    type: piege
    mauvaise_idee: "Donner une réponse sans expliquer le raisonnement qui y mène."
    pourquoi_faux: "Un **écrit réflexif** sert à mettre en mots la pensée elle-même, pas seulement le résultat."
    bonne_idee: "Toujours ajouter le pourquoi : « j'ai choisi cette méthode parce que… »."
    jules: "Confondre écrit réflexif et simple résumé de cours est l'erreur la plus fréquente."

  - id: exemple
    type: exemple
    situation: "Après avoir résolu un problème de mathématiques, on demande d'expliquer sa démarche."
    conclusion: "Il faut expliquer les étapes du raisonnement et pourquoi telle méthode a été choisie, pas seulement donner le résultat."
    jules: "La pensée elle-même est mise en mots : c'est ce qui distingue l'écrit réflexif d'une simple réponse."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Techniques de prise de notes", description: "abréviations, symboles, phrases courtes"}
      - {icone: "📝", titre: "Structurer un écrit réflexif", description: "idée, explication, exemple"}
    jules: "Entraîne-toi à prendre des notes courtes sur un texte lu, puis à les développer en écrit réflexif."

  - id: schema
    type: schema
    titre: "De l'idée à l'écrit réflexif"
    svg: "ecrit-reflexif.svg"
    jules: "Chaque idée passe par une explication avant de devenir un écrit réflexif complet."
