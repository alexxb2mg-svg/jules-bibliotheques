notion: corpus-se-raconter
titre: "Corpus : le récit de soi et l'autoportrait"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_1"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Wikipédia, « Autobiographie »", url: "https://fr.wikipedia.org/w/index.php?title=Autobiographie&oldid=236979671", licence: CC-BY-SA-4.0}
  - {titre: "Wikisource, « Les Confessions (Rousseau)/Préface »", url: "https://fr.wikisource.org/w/index.php?title=Les_Confessions_%28Rousseau%29/Pr%C3%A9face&oldid=12247741", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
abreviations:
  ex: "exemple, un cas concret cité pour illustrer une idée"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: corpus, titre: "Corpus : se raconter", sous_titre: "textes et œuvres variés", principal: true}
      - {id: integrale, titre: "Lecture intégrale", sous_titre: "une œuvre entière"}
      - {id: groupement, titre: "Groupement", sous_titre: "extraits sur un thème"}
      - {id: arts, titre: "Autres arts", sous_titre: "peinture, photo, film"}
    liens:
      - {de: corpus, vers: integrale, libelle: "un seul livre"}
      - {de: corpus, vers: groupement, libelle: "plusieurs textes"}
      - {de: corpus, vers: arts, libelle: "en dehors du texte"}
    jules: "Un même corpus peut mêler un livre entier, des extraits variés et des images : ce qui compte, c'est le geste commun de se raconter."

  - id: methode
    type: methode
    etapes:
      - "Pour une lecture intégrale : noter titre, auteur, époque et sujet principal avant de commencer."
      - "Pour un groupement : repérer le point commun, le thème qui réunit les textes."
      - "Identifier, pour chaque extrait, la forme précise (lettre, page de journal, chapitre de mémoires...)."
      - "Comparer les textes entre eux : que racontent-ils différemment sur le fait de se raconter ?"
      - "Relier, si possible, un texte à une œuvre picturale sur le même principe (l'autoportrait)."
    jules: "L'étape 4 est celle qu'on oublie le plus souvent : un corpus n'a de sens que si l'on compare, pas si l'on étudie chaque texte tout seul."

  - id: piege
    type: piege
    mauvaise_idee: "Résumer un extrait sans dire à quel genre il appartient."
    pourquoi_faux: "Sans le genre (lettre, journal, mémoires...), on ne peut pas comprendre pourquoi le texte est écrit ainsi, ni ce qu'il promet au lecteur."
    bonne_idee: "Toujours commencer par nommer la forme précise du texte avant d'en analyser le contenu."
    jules: "Le genre donne le contrat de lecture : un journal ne promet pas la même chose que des mémoires."

  - id: exemple
    type: exemple
    situation: "Un groupement réunit un extrait des Confessions de Rousseau, une page de journal intime imaginaire et un autoportrait peint de Van Gogh."
    calcul: "Les trois documents partagent le même geste : une personne cherche à se représenter elle-même, par l'écrit (récit, journal) ou par l'image (peinture)."
    conclusion: "Comparer les formes montre que **se raconter** n'est pas réservé au texte."
    jules: "C'est l'intérêt d'un groupement : rapprocher des formes très différentes autour d'une seule question."

  - id: piege2
    type: piege
    mauvaise_idee: "Confondre lecture cursive et lecture intégrale étudiée en classe."
    pourquoi_faux: "La lecture cursive se fait seul, en autonomie, sans étude approfondie en classe ; la lecture intégrale est analysée collectivement, texte en main."
    bonne_idee: "Vérifier si l'œuvre a été travaillée en classe (analyse, extraits commentés) ou lue seul comme complément."
    jules: "Les deux comptent pour ta culture littéraire, mais seule l'intégrale se prépare comme un objet d'étude au brevet."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Fiche de lecture type", description: "titre, auteur, époque, sujet, passage marquant"}
    jules: "Prépare une fiche de 5 lignes pour chaque œuvre lue : elle te servira le jour de l'oral ou de l'écrit."

  - id: schema
    type: schema
    titre: "Construire un corpus sur le récit de soi"
    svg: "corpus-se-raconter.svg"
    jules: "Le corpus mélange les formes (texte, image) mais garde toujours le même fil : une personne qui se raconte ou se représente."
