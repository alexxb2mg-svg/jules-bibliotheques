<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="200" y="30" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Une phrase simple</text>
<text class="ts" x="340" y="67" text-anchor="middle" dominant-baseline="central">1 verbe conjugué</text></g>
<line x1="260" y1="86" x2="130" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="340" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="86" x2="560" y2="130" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="30" y="140" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="159" text-anchor="middle" dominant-baseline="central">Sujet</text>
<text class="ts" x="130" y="177" text-anchor="middle" dominant-baseline="central">qui fait l'action</text></g>
<g class="node c-teal"><rect x="240" y="140" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="159" text-anchor="middle" dominant-baseline="central">Prédicat</text>
<text class="ts" x="340" y="177" text-anchor="middle" dominant-baseline="central">verbe + compléments</text></g>
<g class="node c-amber"><rect x="460" y="140" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="159" text-anchor="middle" dominant-baseline="central">Compl. circonstanciel</text>
<text class="ts" x="560" y="177" text-anchor="middle" dominant-baseline="central">mobile, supprimable</text></g>
<line x1="130" y1="196" x2="100" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="196" x2="245" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="196" x2="435" y2="240" class="arr" marker-end="url(#arrow)"/>
<g class="node c-pink"><rect x="20" y="250" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="269" text-anchor="middle" dominant-baseline="central">Expansions du nom</text>
<text class="ts" x="100" y="287" text-anchor="middle" dominant-baseline="central">épithète, C. du nom</text></g>
<g class="node c-purple"><rect x="195" y="250" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="270" y="269" text-anchor="middle" dominant-baseline="central">COD</text>
<text class="ts" x="270" y="287" text-anchor="middle" dominant-baseline="central">qui/quoi, sans prép.</text></g>
<g class="node c-green"><rect x="370" y="250" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="445" y="269" text-anchor="middle" dominant-baseline="central">COI</text>
<text class="ts" x="445" y="287" text-anchor="middle" dominant-baseline="central">à qui/quoi, avec prép.</text></g>
<g class="c-gray"><rect x="40" y="330" width="600" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="352" text-anchor="middle" dominant-baseline="central">Toujours : le verbe conjugué se cherche en premier.</text></g>
