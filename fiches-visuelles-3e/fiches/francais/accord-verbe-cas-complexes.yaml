relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_6", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: sujet, titre: "Sujet complexe", sous_titre: "trouver le noyau", principal: true}
      - {id: quantite, titre: "Adverbe de quantité", sous_titre: "beaucoup de, la plupart"}
      - {id: collectif, titre: "Nom collectif", sous_titre: "une foule de, un groupe"}
      - {id: distributif, titre: "Pronom distributif", sous_titre: "chacun, aucun, personne"}
    liens:
      - {de: sujet, vers: quantite, libelle: "quantité + nom"}
      - {de: sujet, vers: collectif, libelle: "collectif + de"}
      - {de: sujet, vers: distributif, libelle: "seul"}
    jules: "Le sujet réel n'est pas toujours le mot **le plus proche** du verbe : il faut identifier le vrai noyau du groupe sujet."

  - id: schema-cas
    type: schema
    titre: "Trois cas complexes d'accord du verbe"
    svg: "accord-verbe-cas-complexes.svg"
    jules: "Chaque type de sujet a sa propre règle : mémorise-les plutôt que de deviner à l'oreille."

  - id: methode
    type: methode
    etapes:
      - "Repérer le noyau du groupe sujet, pas seulement le mot le plus proche du verbe."
      - "Sujet éloigné : chercher le vrai sujet en ignorant le **complément intercalé**."
      - "Nom collectif + complément pluriel : décider si on insiste sur l'ensemble (singulier) ou sur chaque élément (pluriel)."
      - "Pronoms distributifs (chacun, aucun, nul, personne) : toujours le **singulier**."
      - "Sujets reliés par « et » : pluriel ; par « ou », « ni » : le sens décide."
    jules: "« La plupart de » impose presque toujours le **pluriel** : c'est une exception à retenir par cœur."

  - id: piege
    type: piege
    mauvaise_idee: "Accorder avec le complément le plus proche du verbe au lieu du vrai sujet."
    pourquoi_faux: "Un complément intercalé (« des invités » dans « la liste des invités ») n'est pas le sujet : il ne commande jamais l'accord."
    bonne_idee: "Repérer le noyau du groupe sujet en ignorant les compléments placés entre lui et le verbe."
    jules: "« La liste des invités est envoyée » : le sujet est « la liste » (singulier), pas « des invités »."

  - id: exemple
    type: exemple
    situation: "Accorder : « Chacun des candidats (avoir) préparé son dossier. »"
    calcul: "« chacun » est un pronom distributif : il impose toujours le singulier, même si les candidats sont nombreux."
    conclusion: "On écrit : « Chacun des candidats **a** préparé son dossier. »"
    jules: "Ne te laisse pas influencer par le sens collectif : **chacun** reste toujours singulier."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi surtout sur les noms collectifs : c'est le seul cas où **les deux accords** sont possibles selon le sens."
