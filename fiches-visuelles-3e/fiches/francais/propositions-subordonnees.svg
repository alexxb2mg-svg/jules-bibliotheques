<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="60" y="20" width="560" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Le livre que j'ai emprunté...</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">antécédent + relative</text></g>
<line x1="200" y1="76" x2="150" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="76" x2="530" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="20" y="120" width="260" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="140" text-anchor="middle" dominant-baseline="central">Antécédent : livre</text>
<text class="ts" x="150" y="160" text-anchor="middle" dominant-baseline="central">nom repris par « que »</text></g>
<g class="node c-coral"><rect x="400" y="120" width="260" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="140" text-anchor="middle" dominant-baseline="central">Que : COD</text>
<text class="ts" x="530" y="160" text-anchor="middle" dominant-baseline="central">dans « ai emprunté »</text></g>
<line x1="150" y1="180" x2="290" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="530" y1="180" x2="390" y2="230" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="140" y="230" width="400" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="250" text-anchor="middle" dominant-baseline="central">Relative = complément</text>
<text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">de l'antécédent « livre »</text></g>
</svg>
