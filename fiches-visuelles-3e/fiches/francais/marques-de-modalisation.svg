<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrowmd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-purple"><rect x="220" y="20" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Attitude du locuteur</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">certitude, jugement</text></g>
<line x1="280" y1="76" x2="140" y2="120" class="arr" marker-end="url(#arrowmd)"/>
<line x1="340" y1="76" x2="340" y2="120" class="arr" marker-end="url(#arrowmd)"/>
<line x1="400" y1="76" x2="540" y2="120" class="arr" marker-end="url(#arrowmd)"/>
<g class="node c-blue"><rect x="20" y="130" width="220" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="150" text-anchor="middle" dominant-baseline="central">Adverbes</text>
<text class="ts" x="130" y="170" text-anchor="middle" dominant-baseline="central">peut-être, sans doute</text>
<text class="ts" x="130" y="188" text-anchor="middle" dominant-baseline="central">certainement</text></g>
<g class="node c-teal"><rect x="230" y="130" width="220" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">Verbes modaux</text>
<text class="ts" x="340" y="170" text-anchor="middle" dominant-baseline="central">devoir, sembler</text>
<text class="ts" x="340" y="188" text-anchor="middle" dominant-baseline="central">+ conditionnel</text></g>
<g class="node c-coral"><rect x="440" y="130" width="220" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="550" y="150" text-anchor="middle" dominant-baseline="central">Vocabulaire jugé</text>
<text class="ts" x="550" y="170" text-anchor="middle" dominant-baseline="central">magnifique,</text>
<text class="ts" x="550" y="188" text-anchor="middle" dominant-baseline="central">médiocre</text></g>
<g class="c-gray"><rect x="20" y="220" width="640" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="242" text-anchor="middle" dominant-baseline="central">Plus les marques s'accumulent, plus le texte</text>
<text class="t" x="340" y="262" text-anchor="middle" dominant-baseline="central">est engagé (le contraire du texte neutre)</text></g>
</svg>
