<text class="ts" x="340" y="67" text-anchor="middle" dominant-baseline="central">cherche à faire adhérer</text></g>
<line x1="280" y1="86" x2="160" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="86" x2="520" y2="140" class="arr" marker-end="url(#arrow)"/>
