<g class="node c-blue"><rect x="380" y="140" width="280" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="520" y="162" text-anchor="middle" dominant-baseline="central">Convaincre</text>
<text class="ts" x="520" y="182" text-anchor="middle" dominant-baseline="central">s'adresse à la raison</text></g>
<line x1="160" y1="204" x2="160" y2="250" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="204" x2="520" y2="250" class="arr" marker-end="url(#arrow)"/>
