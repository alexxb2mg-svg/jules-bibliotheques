notion: planification-et-revision
titre: "Planifier et réviser un écrit"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_3"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Plan (rédaction) »"
    url: "https://fr.wikipedia.org/w/index.php?title=Plan_%28r%C3%A9daction%29&oldid=237794096"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Brouillon »"
    url: "https://fr.wikipedia.org/w/index.php?title=Brouillon&oldid=239168784"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_3", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: idees, titre: "Chercher des idées", sous_titre: "liste, carte mentale", principal: true}
      - {id: plan, titre: "Plan", sous_titre: "ordre logique"}
      - {id: brouillon, titre: "Brouillon", sous_titre: "première version"}
      - {id: revision, titre: "Révision", sous_titre: "relire, améliorer"}
    liens:
      - {de: idees, vers: plan, libelle: "organisées en"}
      - {de: plan, vers: brouillon, libelle: "puis rédigées en"}
      - {de: brouillon, vers: revision, libelle: "puis"}
    jules: "Le brouillon n'est pas un texte raté : c'est une étape normale, faite pour être corrigée."

  - id: methode
    type: methode
    etapes:
      - "Chercher des idées avant d'écrire (liste, carte mentale)."
      - "Organiser ces idées dans un ordre logique pour construire un **plan**."
      - "Rédiger un **brouillon** sans chercher la perfection dès la première version."
      - "Relire pour vérifier la cohérence : les idées s'enchaînent-elles clairement ?"
      - "Réviser la langue (orthographe, grammaire) dans un second temps, séparément du fond."
    jules: "Séparer fond et forme évite de corriger l'orthographe d'une idée qu'on va finalement supprimer."

  - id: piege
    type: piege
    mauvaise_idee: "Commencer à rédiger directement sans avoir cherché ni organisé ses idées."
    pourquoi_faux: "Sans **plan**, le texte part dans plusieurs directions et perd sa cohérence."
    bonne_idee: "Toujours passer par une liste d'idées puis un plan avant la rédaction complète."
    jules: "Un plan en trois parties, même court, structure tout le texte qui suivra."

  - id: exemple
    type: exemple
    situation: "Avant d'écrire une rédaction sur un souvenir marquant, que faire en premier ?"
    conclusion: "Chercher plusieurs souvenirs au brouillon, en choisir un, noter les moments clés dans l'ordre, puis bâtir un plan (début, évènement, fin)."
    jules: "Le choix du souvenir se fait au brouillon, avant même de penser aux phrases."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🗂️", titre: "Outils de révision", description: "relecture à voix haute, dictionnaire, camarade"}
      - {icone: "📋", titre: "Construire un plan", description: "trois parties, ordre logique"}
    jules: "Fais relire ton brouillon par un camarade avant la révision finale : un autre regard repère ce qu'on ne voit plus."

  - id: schema
    type: schema
    titre: "Les quatre étapes de l'écrit"
    svg: "planification-et-revision.svg"
    jules: "Chaque étape prépare la suivante : sauter le plan ou la révision se voit toujours dans le texte final."
