blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: phrase-complexe, titre: "Phrase complexe", sous_titre: "plusieurs verbes conjugués", principal: true}
      - {id: juxtaposition, titre: "Juxtaposition", sous_titre: "virgule ou point-virgule"}
      - {id: coordination, titre: "Coordination", sous_titre: "mais, ou, et, donc, or, ni, car"}
      - {id: subordination, titre: "Subordination", sous_titre: "dépend d'une principale"}
    liens:
      - {de: phrase-complexe, vers: juxtaposition, libelle: "ponctuation seule"}
      - {de: phrase-complexe, vers: coordination, libelle: "avec conjonction"}
      - {de: phrase-complexe, vers: subordination, libelle: "n'existe pas seule"}
    jules: "Dans la **juxtaposition** et la **coordination**, chaque proposition garde son sens seule ; la **subordonnée** ne peut pas exister sans sa principale."

  - id: schema
    type: schema
    titre: "Les types de subordonnées"
    svg: "constituants-phrase-complexe.svg"
    jules: "Chaque subordonnée se reconnaît au mot qui l'introduit : **que** pour la conjonctive, un **pronom relatif** pour la relative."

  - id: methode
    type: methode
    etapes:
      - "Compter les verbes conjugués : un seul, c'est une phrase simple ; plusieurs, une phrase complexe."
      - "Repérer entre chaque proposition : ponctuation seule (juxtaposition), conjonction de coordination, ou mot subordonnant."
      - "Pour une subordination, identifier la principale (qui reste si on enlève la subordonnée) et la subordonnée (qui ne peut pas être seule)."
      - "Nommer le type de subordonnée d'après le mot qui l'introduit : que → conjonctive ; pronom relatif → relative ; si/quand/où après un verbe de question → interrogative indirecte."
      - "Donner la fonction de la subordonnée dans la principale (sujet, COD, complément circonstanciel...)."
    jules: "Un participe ou un infinitif n'est **jamais** un verbe conjugué : il ne compte pas dans le total."

  - id: piege
    type: piege
    mauvaise_idee: "Mettre un point d'interrogation après une **interrogative indirecte**."
    pourquoi_faux: "L'interrogative indirecte rapporte une question sans la poser directement : elle suit un verbe comme demander ou se demander, et la phrase reste déclarative."
    bonne_idee: "« Il demande si tu viens. » se termine par un point, jamais par un point d'interrogation."
    jules: "Autre piège : confondre **juxtaposition** (pas de mot de liaison) et **coordination** (une conjonction relie les deux propositions)."

  - id: exemple
    type: exemple
    situation: "Analyser les liens : « Il pleuvait, le match fut annulé car le terrain était impraticable. »"
    conclusion: "« Il pleuvait » et « le match fut annulé » sont **juxtaposées** (virgule seule). « le match fut annulé » et « le terrain était impraticable » sont **coordonnées** par « car ». Phrase complexe : 3 verbes conjugués."
    jules: "Une même phrase complexe peut donc combiner juxtaposition **et** coordination, sans aucune subordination."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à repérer les **relatives sans antécédent** : c'est le cas le plus oublié."
