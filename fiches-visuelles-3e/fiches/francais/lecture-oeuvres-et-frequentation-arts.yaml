notion: lecture-oeuvres-et-frequentation-arts
titre: "Lire des œuvres, fréquenter les arts"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_3"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Littérature »"
    url: "https://fr.wikipedia.org/w/index.php?title=Litt%C3%A9rature&oldid=238561188"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Genre littéraire »"
    url: "https://fr.wikipedia.org/w/index.php?title=Genre_litt%C3%A9raire&oldid=238084925"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_3", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: integrale, titre: "Lecture intégrale", sous_titre: "œuvre entière, en classe", principal: true}
      - {id: cursive, titre: "Lecture cursive", sous_titre: "seul, en autonomie"}
      - {id: groupements, titre: "Groupement de textes", sous_titre: "extraits, un même thème"}
      - {id: arts, titre: "Production artistique", sous_titre: "tableau, film, sculpture"}
    liens:
      - {de: integrale, vers: cursive, libelle: "toutes deux au programme"}
      - {de: integrale, vers: groupements, libelle: "aussi au programme"}
      - {de: integrale, vers: arts, libelle: "même époque, même thème"}
    jules: "Les trois lectures sont complémentaires : intégrale, cursive et groupements de textes se comptent chacune au moins trois fois dans l'année."

  - id: methode
    type: methode
    etapes:
      - "Noter, pour chaque œuvre lue, le titre, l'auteur, l'**époque** et le genre."
      - "Distinguer les lectures faites en classe (**intégrale**) et celles faites seul (**cursive**)."
      - "Chercher, pour une lecture intégrale, une **œuvre d'art** de la même époque ou sur le même thème."
      - "Résumer en quelques phrases ce que la lecture apprend et fait ressentir."
      - "Relier les œuvres lues au programme d'histoire de l'année quand c'est pertinent."
    jules: "Une fiche de lecture complète (titre, auteur, époque, genre) sert toute l'année, pas seulement pour le contrôle."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre lecture intégrale et lecture cursive, ou lire une œuvre sans noter son époque."
    pourquoi_faux: "L'intégrale est étudiée en détail avec le professeur ; la cursive est choisie et lue seul, en autonomie."
    bonne_idee: "Se demander qui a choisi le livre et comment il est étudié : cela dit tout de suite de quel type de lecture il s'agit."
    jules: "Retiens l'astuce : si le professeur l'étudie en classe, phrase par phrase, c'est une **lecture intégrale**."

  - id: exemple
    type: exemple
    situation: "Après avoir lu en lecture intégrale un roman sur la Première Guerre mondiale, quelle œuvre d'art lui associer ?"
    conclusion: "Une peinture ou une photographie des tranchées de la même époque : la comparaison éclaire le contexte historique du roman."
    jules: "Le lien ne doit pas être vague : même **époque** ou même **thème** précis, sinon il n'apporte rien."

  - id: renfort
    type: renfort
    liens:
      - {icone: "📚", titre: "Fiche de lecture type", description: "titre, auteur, époque, genre, œuvre d'art associée"}
      - {icone: "🖼️", titre: "Musée en ligne", description: "chercher une œuvre d'art de la même époque"}
    jules: "Prépare ta fiche de lecture au fil de l'année : elle te fera gagner du temps avant le brevet."

  - id: schema
    type: schema
    titre: "Trois lectures, un lien vers l'art"
    svg: "lecture-oeuvres-et-frequentation-arts.svg"
    jules: "L'intégrale et la cursive comptent chacune pour trois œuvres au moins ; le lien vers l'art se cherche surtout sur l'intégrale."
