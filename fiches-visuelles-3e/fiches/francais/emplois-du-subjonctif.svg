<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Le fait est-il certain ?</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">pose-toi la question</text></g>
<line x1="290" y1="76" x2="180" y2="120" class="arr" marker-end="url(#arrow)"/>
<line x1="390" y1="76" x2="500" y2="120" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="105" text-anchor="middle">oui</text>
<text class="ts" x="480" y="105" text-anchor="middle">non</text>
<g class="node c-teal"><rect x="30" y="130" width="300" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="149" text-anchor="middle" dominant-baseline="central">Indicatif</text>
<text class="ts" x="180" y="167" text-anchor="middle" dominant-baseline="central">penser que, dire que</text>
<text class="ts" x="180" y="185" text-anchor="middle" dominant-baseline="central">après que</text></g>
<g class="node c-coral"><rect x="350" y="130" width="300" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="149" text-anchor="middle" dominant-baseline="central">Subjonctif</text>
<text class="ts" x="500" y="167" text-anchor="middle" dominant-baseline="central">souhait, doute, ordre</text>
<text class="ts" x="500" y="185" text-anchor="middle" dominant-baseline="central">bien que, pour que</text></g>
<g class="c-gray"><rect x="30" y="220" width="620" height="100" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="245" text-anchor="middle" dominant-baseline="central">Je pense qu'elle a raison.</text>
<text class="ts" x="340" y="263" text-anchor="middle" dominant-baseline="central">(indicatif, fait certain)</text>
<text class="t" x="340" y="288" text-anchor="middle" dominant-baseline="central">Bien qu'il pleuve, je sors.</text>
<text class="ts" x="340" y="306" text-anchor="middle" dominant-baseline="central">(subjonctif, concession)</text>
</g>
</svg>
