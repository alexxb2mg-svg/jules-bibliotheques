<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Une proposition</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">principale</text></g>
<line x1="340" y1="76" x2="340" y2="110" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="122" text-anchor="middle">peut dépendre d'une subordonnée</text>
<g class="node c-blue"><rect x="20" y="150" width="200" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="169" text-anchor="middle" dominant-baseline="central">Conjonctive</text>
<text class="ts" x="120" y="187" text-anchor="middle" dominant-baseline="central">introduite par que</text></g>
<g class="node c-teal"><rect x="240" y="150" width="200" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="169" text-anchor="middle" dominant-baseline="central">Interr. indirecte</text>
<text class="ts" x="340" y="187" text-anchor="middle" dominant-baseline="central">si, quand, où...</text></g>
<g class="node c-purple"><rect x="460" y="150" width="200" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="169" text-anchor="middle" dominant-baseline="central">Relative</text>
<text class="ts" x="560" y="187" text-anchor="middle" dominant-baseline="central">pronom relatif</text></g>
<g class="node c-green"><rect x="130" y="230" width="200" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="230" y="249" text-anchor="middle" dominant-baseline="central">Infinitive</text>
<text class="ts" x="230" y="267" text-anchor="middle" dominant-baseline="central">verbe à l'infinitif</text></g>
<g class="node c-amber"><rect x="350" y="230" width="200" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="450" y="249" text-anchor="middle" dominant-baseline="central">Participiale</text>
<text class="ts" x="450" y="267" text-anchor="middle" dominant-baseline="central">verbe au participe</text></g>
<g class="c-gray"><rect x="90" y="320" width="500" height="56" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="340" text-anchor="middle" dominant-baseline="central">Le mot qui introduit</text>
<text class="t" x="340" y="360" text-anchor="middle" dominant-baseline="central">donne le type de subordonnée.</text></g>
</svg>
