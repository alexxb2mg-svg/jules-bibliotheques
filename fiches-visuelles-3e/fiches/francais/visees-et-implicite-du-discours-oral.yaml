blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: discours, titre: "Discours oral", sous_titre: "exposé, débat", principal: true}
      - {id: visee, titre: "Visée", sous_titre: "informer, convaincre…"}
      - {id: hierarchie, titre: "Hiérarchie", sous_titre: "idée puis détails"}
      - {id: implicite, titre: "Implicite", sous_titre: "ton, gestes, contexte"}
    liens:
      - {de: discours, vers: visee, libelle: "poursuit une"}
      - {de: discours, vers: hierarchie, libelle: "organise ses idées"}
      - {de: discours, vers: implicite, libelle: "suggère parfois"}
    jules: "La **visée** d'un discours n'est pas toujours dite : elle se déduit du ton et du contexte."

  - id: methode
    type: methode
    etapes:
      - "Identifier la **visée** principale du discours : informer, convaincre, persuader, divertir."
      - "Distinguer l'information essentielle des détails secondaires."
      - "Repérer les indices de l'**implicite** : ton de la voix, gestes, silences."
      - "Reformuler ce que le discours suggère sans le dire directement."
      - "Vérifier son interprétation en la confrontant au contexte général."
    jules: "L'étape 5 évite de sur-interpréter : un implicite doit toujours se justifier par un indice précis."

  - id: piege
    type: piege
    mauvaise_idee: "Ne retenir que le sens littéral d'un discours sans chercher son implicite."
    pourquoi_faux: "Le sens littéral peut être contredit par le ton : une phrase ironique dit l'inverse de ce qu'elle semble dire."
    bonne_idee: "Toujours croiser les mots avec le ton, les gestes et le contexte avant de conclure sur le sens réel."
    jules: "Une phrase dite sur un ton ironique s'entend « à l'envers » : c'est le **présupposé** du contexte qui révèle le vrai sens."

  - id: exemple
    type: exemple
    situation: "Un camarade dit, d'un ton ironique, en regardant une salle en désordre : « Bravo, quel rangement impeccable ! »"
    calcul: "Le ton ironique inverse le sens littéral des mots employés."
    conclusion: "Il veut en réalité dire que la salle est mal rangée : c'est l'**implicite** de sa phrase."
    jules: "Sans le ton, la phrase semblerait un compliment : c'est bien l'indice oral qui change tout."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🎙️", titre: "Écoute active", description: "repérer ton et gestes"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "visées du discours"}
    jules: "Entraîne-toi en écoutant une intervention réelle : note sa visée et un élément implicite justifié."

  - id: schema
    type: schema
    titre: "Du dit au non-dit"
    svg: "visees-et-implicite-du-discours-oral.svg"
    jules: "Les mots portent le sens littéral, le ton et le contexte portent souvent le vrai message."
