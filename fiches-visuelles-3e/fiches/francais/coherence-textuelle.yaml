  - titre: "Wikipédia, « Cohérence (linguistique) »"
    url: "https://fr.wikipedia.org/w/index.php?title=Coh%C3%A9rence_%28linguistique%29&oldid=236673647"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_8", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: coherence, titre: "Texte cohérent", sous_titre: "un ensemble relié", principal: true}
      - {id: reprises, titre: "Reprises", sous_titre: "nominales, pronominales"}
      - {id: connecteurs, titre: "Connecteurs", sous_titre: "temps, logique"}
      - {id: temps, titre: "Système des temps", sous_titre: "stable"}
    liens:
      - {de: coherence, vers: reprises, libelle: "évite la répétition"}
      - {de: coherence, vers: connecteurs, libelle: "relie les idées"}
      - {de: coherence, vers: temps, libelle: "pas de saut"}
    jules: "Une reprise ambiguë peut faire perdre le fil : vérifie toujours à qui renvoie chaque pronom."

  - id: schema
    type: schema
    titre: "Ce qui relie les phrases"
    svg: "coherence-textuelle.svg"
    jules: "Un **connecteur** mal choisi (donc pour une opposition) rend le texte incohérent même si chaque phrase est correcte."

  - id: methode
    type: methode
    etapes:
      - "Repérer les reprises d'un même personnage ou d'une même idée d'une phrase à l'autre."
      - "Souligner les connecteurs et préciser leur valeur : temps, cause, conséquence, opposition."
      - "Vérifier que le système des temps reste cohérent, sans saut injustifié de temps."
      - "Observer l'organisation visuelle du texte (paragraphes, titres) pour en dégager le plan."
      - "Pour écrire un texte cohérent : varier les reprises, choisir des connecteurs précis, garder un temps stable."
    jules: "Cette méthode marche aussi bien pour analyser un texte que pour corriger sa propre rédaction."

  - id: piege
    type: piege
    mauvaise_idee: "Employer un connecteur logique inadapté, par exemple « donc » pour introduire une opposition."
    pourquoi_faux: "Chaque connecteur porte une valeur précise (cause, conséquence, opposition) : un connecteur mal choisi brouille la relation logique entre les idées."
    bonne_idee: "Identifier d'abord la relation entre les deux idées (cause ? opposition ?) avant de choisir le connecteur qui la marque exactement."
    jules: "« Pourtant » marque une opposition, « donc » une conséquence : ils ne sont jamais interchangeables."

  - id: exemple
    type: exemple
    situation: "Identifier les procédés de cohérence : « Léa adorait la mer. Cependant, cette élève n'avait jamais appris à nager. Elle décida donc de prendre des cours. »"
    calcul: "Reprises : « cette élève » (nominale de Léa), « Elle » (pronominale). Connecteurs : « Cependant » (opposition), « donc » (conséquence)."
    conclusion: "Le système des temps reste **cohérent** à l'imparfait puis au passé simple."
    jules: "Trois procédés différents dans trois phrases : reprises, connecteurs, temps stable."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à varier les reprises dans tes propres textes : c'est ce qui les rend fluides."
