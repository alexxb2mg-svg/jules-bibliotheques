relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_7", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: subjonctif, titre: "Subjonctif", sous_titre: "fait envisagé, non certain", principal: true}
      - {id: verbes, titre: "Verbes déclencheurs", sous_titre: "souhait, doute, sentiment"}
      - {id: conjonctions, titre: "Conjonctions", sous_titre: "bien que, pour que..."}
      - {id: indicatif, titre: "Indicatif", sous_titre: "fait certain (penser que)"}
    liens:
      - {de: subjonctif, vers: verbes, libelle: "après un verbe"}
      - {de: subjonctif, vers: conjonctions, libelle: "après une conjonction"}
      - {de: subjonctif, vers: indicatif, libelle: "s'oppose à"}
    jules: "Le subjonctif marque un fait envisagé (souhaité, redouté, ordonné), jamais une certitude."

  - id: methode
    type: methode
    etapes:
      - "Repérer le verbe ou la conjonction qui introduit la subordonnée."
      - "Se demander si le fait est présenté comme **certain** (indicatif) ou seulement **envisagé** (subjonctif)."
      - "Mémoriser les listes : souhait, ordre, doute, sentiment, et les conjonctions de but, concession, condition, crainte."
      - "Vérifier la terminaison du subjonctif présent (-e, -es, -e, -ions, -iez, -ent)."
    jules: "« bien que » et « pour que » imposent toujours le subjonctif : aucune exception."

  - id: piege
    type: piege
    mauvaise_idee: "Employer l'indicatif après « bien que » ou le subjonctif après « penser que » affirmatif."
    pourquoi_faux: "« bien que » exprime la concession (fait envisagé) : subjonctif obligatoire. « penser que » affirmatif présente un fait comme **certain** : indicatif obligatoire."
    bonne_idee: "Identifier d'abord la catégorie du déclencheur (souhait/doute/conjonction ou opinion affirmative) avant de choisir le mode."
    jules: "Attention : « après que » veut l'indicatif (fait réalisé), alors que « avant que » veut le subjonctif."

  - id: exemple
    type: exemple
    situation: "« Je doute qu'il (venir) à la réunion. »"
    calcul: "douter que exprime une incertitude, donc **subjonctif présent** : « Je doute qu'il vienne à la réunion. »"
    conclusion: "vienne est bien au subjonctif présent."
    jules: "« Je doute » est un déclencheur classique de doute : réflexe direct vers le subjonctif."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "choisir indicatif ou subjonctif", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "listes de déclencheurs"}
    jules: "Relis les listes de déclencheurs régulièrement : elles ne se devinent pas, elles se mémorisent."

  - id: schema
    type: schema
    titre: "Subjonctif ou indicatif ?"
    svg: "emplois-du-subjonctif.svg"
    jules: "Un fait certain (indicatif) ou seulement envisagé (subjonctif) : la question à te poser à chaque fois."
