<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="30" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Une société décrite</text>
<text class="ts" x="340" y="67" text-anchor="middle" dominant-baseline="central">semble parfaite ?</text></g>
<line x1="300" y1="86" x2="170" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="86" x2="510" y2="140" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="150" y="115" text-anchor="middle">liberté gardée</text>
<text class="ts" x="530" y="115" text-anchor="middle">liberté perdue</text>
<g class="node c-teal"><rect x="20" y="140" width="300" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="162" text-anchor="middle" dominant-baseline="central">Utopie</text>
<text class="ts" x="170" y="182" text-anchor="middle" dominant-baseline="central">société idéale, libre</text></g>
<g class="node c-red"><rect x="360" y="140" width="300" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="162" text-anchor="middle" dominant-baseline="central">Dystopie</text>
<text class="ts" x="510" y="182" text-anchor="middle" dominant-baseline="central">confort, mais oppression</text></g>
<line x1="170" y1="204" x2="170" y2="250" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="204" x2="510" y2="250" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="20" y="250" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="269" text-anchor="middle" dominant-baseline="central">Modèle à imiter</text>
<text class="ts" x="170" y="287" text-anchor="middle" dominant-baseline="central">critique le réel par contraste</text></g>
<g class="node c-coral"><rect x="360" y="250" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="269" text-anchor="middle" dominant-baseline="central">Avertissement</text>
<text class="ts" x="510" y="287" text-anchor="middle" dominant-baseline="central">met en garde le lecteur</text></g>
<g class="node c-gray"><rect x="40" y="320" width="600" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="342" text-anchor="middle" dominant-baseline="central">Le critère décisif : les habitants sont-ils libres de choisir ?</text></g>
</svg>
