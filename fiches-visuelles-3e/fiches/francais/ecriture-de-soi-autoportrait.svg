<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="20" width="300" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="45" text-anchor="middle" dominant-baseline="central">Un texte parle de la vie</text>
<text class="ts" x="340" y="62" text-anchor="middle" dominant-baseline="central">de son propre auteur</text></g>
<line x1="260" y1="70" x2="150" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="70" x2="530" y2="110" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="180" y="90" text-anchor="middle">écrit au jour le jour</text>
<text class="ts" x="500" y="90" text-anchor="middle">écrit après coup</text>
<g class="node c-purple"><rect x="40" y="120" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="139" text-anchor="middle" dominant-baseline="central">Journal intime</text>
<text class="ts" x="150" y="157" text-anchor="middle" dominant-baseline="central">dates, présent, sans recul</text></g>
<g class="node c-teal"><rect x="420" y="120" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="139" text-anchor="middle" dominant-baseline="central">Mémoires</text>
<text class="ts" x="530" y="157" text-anchor="middle" dominant-baseline="central">évènements publics, recul</text></g>
<line x1="340" y1="70" x2="340" y2="200" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="230" y="210" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="229" text-anchor="middle" dominant-baseline="central">Autobiographie</text>
<text class="ts" x="340" y="247" text-anchor="middle" dominant-baseline="central">auteur = narrateur = personnage</text></g>
<line x1="340" y1="266" x2="340" y2="300" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="230" y="310" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="329" text-anchor="middle" dominant-baseline="central">Correspondance</text>
<text class="ts" x="340" y="347" text-anchor="middle" dominant-baseline="central">lettres à un destinataire</text></g>
</svg>
