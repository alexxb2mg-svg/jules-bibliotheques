notion: progres-scientifique-et-litterature
titre: "Progrès scientifique et science-fiction"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_2"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Science-fiction »"
    url: "https://fr.wikipedia.org/w/index.php?title=Science-fiction&oldid=239632088"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Utopie »"
    url: "https://fr.wikipedia.org/w/index.php?title=Utopie&oldid=239717810"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Dystopie »"
    url: "https://fr.wikipedia.org/w/index.php?title=Dystopie&oldid=235942052"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
abreviations:
  SF: "science-fiction"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: sf, titre: "Science-fiction", sous_titre: "progrès réel ou imaginé", principal: true}
      - {id: savant, titre: "Figure du savant", sous_titre: "génie ou danger"}
      - {id: utopie, titre: "Utopie", sous_titre: "société idéale"}
      - {id: dystopie, titre: "Dystopie", sous_titre: "société oppressive"}
    liens:
      - {de: sf, vers: savant, libelle: "personnage clé"}
      - {de: sf, vers: utopie, libelle: "société rêvée"}
      - {de: utopie, vers: dystopie, libelle: "peut mal tourner"}
    jules: "Une **dystopie** est souvent une **utopie** qui a mal tourné : perfection en apparence, oppression en réalité."

  - id: schema
    type: schema
    titre: "Utopie ou dystopie ?"
    svg: "progres-scientifique-et-litterature.svg"
    jules: "Le critère décisif est toujours la **liberté** des habitants, pas le confort apparent."

  - id: methode
    type: methode
    etapes:
      - "Identifier les éléments scientifiques ou techniques (réels ou imaginés) qui font avancer l'histoire."
      - "Repérer si la société décrite est présentée comme meilleure (utopie) ou pire (dystopie) que la nôtre."
      - "Analyser la figure du savant ou de l'inventeur : est-il présenté positivement ou négativement ?"
      - "Chercher ce que le texte critique ou questionne dans notre société actuelle, en le projetant dans le futur."
      - "Distinguer l'aspect divertissant (l'aventure) de l'aspect réflexif (les questions posées) du texte."
    jules: "La SF parle rarement seulement du futur : elle parle surtout, indirectement, du présent."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre utopie (société idéale) et dystopie (société oppressive)."
    pourquoi_faux: "Une société peut sembler parfaite (plus de pauvreté, plus de conflits) tout en étant une dystopie si elle prive ses habitants de liberté."
    bonne_idee: "Toujours vérifier si les habitants gardent leur **liberté** de choix : c'est le critère qui tranche entre utopie et dystopie."
    jules: "La confusion entre utopie et dystopie est l'erreur la plus fréquente sur cette notion."

  - id: exemple
    type: exemple
    situation: "Un roman imagine une société parfaitement organisée, où plus personne ne connaît la pauvreté, mais où chaque citoyen est surveillé en permanence et n'a plus le droit de choisir son métier."
    conclusion: "C'est une **dystopie** : malgré l'apparence de perfection, la perte de liberté individuelle en fait une société oppressive, donnée comme un avertissement."
    jules: "Repère toujours les deux indices contraires : le confort affiché et la liberté perdue."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Révise le vocabulaire : anticipation, utopie, dystopie ne désignent pas la même chose."
