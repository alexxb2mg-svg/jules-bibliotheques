notion: corpus-agir-dans-la-cite
titre: "Le corpus : la littérature face à l'histoire"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_2"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Littérature engagée »"
    url: "https://fr.wikipedia.org/w/index.php?title=Litt%C3%A9rature_engag%C3%A9e&oldid=239676414"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: corpus, titre: "Corpus histoire-français", sous_titre: "œuvre + programme d'histoire", principal: true}
      - {id: oeuvre, titre: "Œuvre lue", sous_titre: "roman, récit, théâtre"}
      - {id: images, titre: "Peinture, film", sous_titre: "regards complémentaires"}
      - {id: croisement, titre: "Croisement des regards", sous_titre: "historien + écrivain"}
    liens:
      - {de: corpus, vers: oeuvre, libelle: "lecture principale"}
      - {de: corpus, vers: images, libelle: "peut compléter"}
      - {de: oeuvre, vers: croisement, libelle: "confronte les points de vue"}
    jules: "L'historien établit les faits, l'écrivain fait ressentir une **expérience humaine** : ce sont deux regards, pas un seul."

  - id: schema
    type: schema
    titre: "Deux regards sur un même évènement"
    svg: "corpus-agir-dans-la-cite.svg"
    jules: "Toujours relier ce qu'on lit en français aux repères vus en histoire sur la même période."

  - id: methode
    type: methode
    etapes:
      - "Relier la période historique étudiée en histoire (guerres mondiales, totalitarismes) à l'œuvre lue en français."
      - "Repérer dans le texte les éléments qui renvoient à des faits historiques précis."
      - "Distinguer le point de vue du narrateur ou des personnages de celui, plus général, de l'historien."
      - "Analyser comment une image (peinture, photographie, extrait de film) complète la lecture du texte."
      - "Formuler ce que l'œuvre apporte de plus qu'un simple exposé historique."
    jules: "La dernière étape est la plus attendue à l'examen : dire ce que la fiction apporte en plus des faits."

  - id: piege
    type: piege
    mauvaise_idee: "Étudier l'œuvre littéraire sans mobiliser ses connaissances d'histoire sur la période."
    pourquoi_faux: "Le sens de l'œuvre dépend souvent d'un contexte précis (une bataille, une occupation, un régime) qu'il faut connaître pour la comprendre."
    bonne_idee: "Relier systématiquement un passage de l'œuvre à un repère du cours d'histoire sur la même période."
    jules: "Sans le repère historique, on comprend l'histoire racontée mais pas toujours ce qu'elle dénonce."

  - id: exemple
    type: exemple
    situation: "Une classe lit un récit sur la Seconde Guerre mondiale en parallèle du cours d'histoire sur les régimes totalitaires en Europe."
    conclusion: "Le cours d'histoire donne les faits, les dates et les causes ; la littérature fait ressentir, à travers un personnage, ce que ces évènements ont pu signifier concrètement, ce qui enrichit la compréhension historique."
    jules: "Cette complémentarité (faits et ressenti) est exactement ce qu'on appelle « agir dans la cité »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Prépare une œuvre précise que tu peux citer avec son titre, son auteur et l'évènement historique qu'elle évoque."
