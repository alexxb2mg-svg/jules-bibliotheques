notion: enrichissement-lexique-par-lecture
titre: "Enrichir son lexique"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_7"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Wikipédia, « Champ lexical »", url: "https://fr.wikipedia.org/w/index.php?title=Champ_lexical&oldid=230757724", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_7", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: lexique, titre: "Enrichir le lexique", sous_titre: "lecture, dictionnaire, usage", principal: true}
      - {id: champlexical, titre: "Champ lexical", sous_titre: "mots différents, même thème"}
      - {id: champsemantique, titre: "Champ sémantique", sous_titre: "même mot, sens différents"}
      - {id: intensite, titre: "Degré d'intensité", sous_titre: "classer des mots proches"}
    liens:
      - {de: lexique, vers: champlexical, libelle: "regrouper par thème"}
      - {de: lexique, vers: champsemantique, libelle: "distinguer des sens"}
      - {de: champlexical, vers: intensite, libelle: "classer les mots"}
    jules: "Ne confonds pas champ lexical (mots différents) et champ sémantique (sens différents d'un même mot)."

  - id: graphe
    type: graphe
    gabarit: echelle-intensite
    curseurs:
      - {id: curseur-serie, nom: serie, min: 3, max: 5, pas: 1, depart: 3}
      - {id: curseur-degre, nom: degre, min: 0, max: 4, pas: 1, depart: 2}
    lectures:
      - {si: "degre <= 1", texte: "Intensité **faible** : un mot atténué, qui nuance (inquiétude, agacé, satisfait)."}
      - {si: "degre == 2", texte: "Intensité **moyenne** : le mot courant, le plus neutre (peur, fâché, heureux)."}
      - {si: "degre >= 3", texte: "Intensité **forte** : un mot fort, presque une hyperbole (terreur, enragé, euphorique)."}
    jules: "Quand tu lis, repère les mots forts que l'auteur choisit : ils te disent ce que ressent le personnage. Change serie pour passer de la peur à la colère, puis à la joie."

  - id: methode
    type: methode
    etapes:
      - "En lisant, repérer les mots inconnus et chercher leur sens exact dans un dictionnaire."
      - "Relier un mot nouveau à un champ lexical connu pour mieux le mémoriser."
      - "Classer une série de mots proches par intensité croissante ou par degré de généralité."
      - "Réutiliser le mot appris dans une phrase personnelle, à l'écrit ou à l'oral."
    jules: "Un mot appris sans réemploi s'oublie vite : force-toi à l'utiliser dans les jours qui suivent."

  - id: piege
    type: piege
    mauvaise_idee: "Se contenter d'un synonyme approximatif sans vérifier la nuance de sens."
    pourquoi_faux: "« content », « satisfait » et « ravi » ne sont pas équivalents : ils marquent des **degrés d'intensité** différents."
    bonne_idee: "Vérifier chaque synonyme dans le dictionnaire et le classer par intensité avant de l'employer."
    jules: "En rédaction, un mot mal dosé en intensité peut fausser tout le ton du texte."

  - id: exemple
    type: exemple
    situation: "Classer par intensité croissante : content, ravi, satisfait."
    calcul: "satisfait exprime une approbation mesurée, content une joie simple, ravi une joie très intense."
    conclusion: "satisfait < content < ravi."
    jules: "Range toujours ces trois mots dans ta tête sur une échelle, du plus faible au plus fort."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "champ lexical de la tristesse", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "mots classés par intensité"}
    jules: "Note les mots nouveaux rencontrés en lecture dans un carnet de vocabulaire personnel."

  - id: schema
    type: schema
    titre: "Champ lexical vs sémantique"
    svg: "enrichissement-lexique-par-lecture.svg"
    jules: "Champ lexical : plusieurs mots, un thème. Champ sémantique : un mot, plusieurs sens."
