notion: analyse-du-sens-des-mots
titre: "Analyser le sens des mots"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_7"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Wikipédia, « Polysémie »", url: "https://fr.wikipedia.org/w/index.php?title=Polys%C3%A9mie&oldid=236228721", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_7", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: sens, titre: "Sens d'un mot", sous_titre: "varie selon le contexte", principal: true}
      - {id: polysemie, titre: "Polysémie", sous_titre: "plusieurs sens liés"}
      - {id: figee, titre: "Expression figée", sous_titre: "sens global, pas littéral"}
      - {id: construction, titre: "Construction du verbe", sous_titre: "change le sens"}
    liens:
      - {de: sens, vers: polysemie, libelle: "un mot, plusieurs sens"}
      - {de: sens, vers: figee, libelle: "un groupe figé"}
      - {de: sens, vers: construction, libelle: "un verbe qui varie"}
    jules: "Ne confonds pas polysémie (un mot, plusieurs sens liés) et homonymie (deux mots sans lien, même son)."

  - id: graphe
    type: graphe
    gabarit: echelle-intensite
    curseurs:
      - {id: curseur-serie, nom: serie, min: 4, max: 4, pas: 1, depart: 4}
      - {id: curseur-degre, nom: degre, min: 0, max: 4, pas: 1, depart: 1}
    lectures:
      - {si: "degre <= 1", texte: "Nuance **légère** : agacé, irrité. Le mot reste modéré."}
      - {si: "degre >= 3", texte: "Nuance **forte** : remplacer un mot faible par celui-ci change le ton du texte."}
      - {si: "degre == 4", texte: "Sommet de l'échelle : enragé frôle l'**exagération**, à garder pour un effet voulu."}
    jules: "Ces cinq mots sont des **synonymes** : ils parlent tous de la colère. Mais ils n'ont pas la même force, et c'est le contexte qui te dit lequel choisir."

  - id: methode
    type: methode
    etapes:
      - "Repérer le contexte (mots autour) pour choisir le bon sens d'un mot polysémique."
      - "Vérifier dans le dictionnaire si une expression a un sens figuré global différent du sens littéral."
      - "Observer la construction du verbe (avec quel type de complément) pour déterminer son sens précis."
      - "Chercher l'origine d'un mot pour comprendre comment son sens a pu évoluer."
    jules: "Une expression figée se traduit d'un bloc : jamais mot à mot."

  - id: piege
    type: piege
    mauvaise_idee: "Prendre au sens propre une expression figée comme « il pleut des cordes »."
    pourquoi_faux: "Une **expression figée** a un sens global qui ne se déduit pas de l'addition des sens de chaque mot."
    bonne_idee: "Vérifier dans le dictionnaire le sens figuré global de toute expression qui semble étrange au sens littéral."
    jules: "« il pleut des cordes » ne parle pas de vraies cordes : ça veut dire qu'il pleut très fort."

  - id: exemple
    type: exemple
    situation: "Comparer « rendre un livre » et « rendre quelqu'un heureux »."
    calcul: "« rendre un livre » (COD seul) signifie restituer. « rendre quelqu'un heureux » (COD + attribut du COD) signifie faire devenir."
    conclusion: "La construction différente du verbe change son sens."
    jules: "Regarde toujours ce qui suit le verbe : un COD seul ou un COD + attribut ne donnent pas le même sens."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "expressions figées et polysémie", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "verbes à sens multiples"}
    jules: "Teste toujours le sens littéral d'abord : s'il ne colle pas, cherche le sens figuré."

  - id: schema
    type: schema
    titre: "Polysémie: mot « pied »"
    svg: "analyse-du-sens-des-mots.svg"
    jules: "Les sens d'un mot polysémique restent liés entre eux par une idée commune, ici la base d'un élément."
