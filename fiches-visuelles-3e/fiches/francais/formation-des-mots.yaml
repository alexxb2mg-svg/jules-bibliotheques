    type: carte
    noeuds:
      - {id: formation, titre: "Formation des mots", sous_titre: "créer un mot nouveau", principal: true}
      - {id: derivation, titre: "Dérivation", sous_titre: "préfixe et/ou suffixe"}
      - {id: composition, titre: "Composition", sous_titre: "mots autonomes assemblés"}
      - {id: etymologie, titre: "Étymologie", sous_titre: "origine latine ou grecque"}
