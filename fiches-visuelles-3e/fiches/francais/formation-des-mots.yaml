      - {de: formation, vers: etymologie, libelle: "éclaire l'origine"}
      - {de: formation, vers: neologie, libelle: "invente un mot"}
    jules: "La **dérivation** change souvent la catégorie grammaticale du mot de départ : un verbe peut devenir un nom."

  - id: schema
    type: schema
    titre: "La dérivation change de catégorie"
    svg: "formation-des-mots.svg"
    jules: "Le suffixe impose sa propre terminaison, parfois avec une modification du radical : **beau → beauté**, un seul t final."

  - id: methode
    type: methode
    etapes:
      - "Repérer le radical du mot et se demander de quel mot de base il pourrait dériver."
      - "Identifier s'il s'agit d'une dérivation (préfixe/suffixe ajoutés) ou d'une composition (mots autonomes assemblés)."
      - "Noter le changement éventuel de catégorie grammaticale entre le mot de base et le mot dérivé."
      - "Vérifier l'orthographe de la terminaison imposée par le suffixe, en surveillant les modifications du radical."
      - "Pour un mot d'origine étrangère ou ancienne, chercher son étymon pour comprendre sa formation."
    jules: "Une **locution** (« pomme de terre », « tout à coup ») est un groupe figé qui fonctionne comme un seul mot de sens."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre **dérivation** (ajout d'affixes) et **composition** (assemblage de mots autonomes)."
    pourquoi_faux: "Un préfixe ou un suffixe n'existe pas seul dans la langue, alors qu'un mot composé assemble deux mots qui existent chacun de façon autonome par ailleurs."
    bonne_idee: "« porte-monnaie » : porte et monnaie existent seuls → composition. « décoration » : dé- et -tion n'existent pas seuls → dérivation."
    jules: "Autre piège : oublier que la dérivation change souvent la **catégorie grammaticale** du mot (déménager → déménagement)."

  - id: exemple
    type: exemple
    situation: "Analyser la formation de « déménagement » à partir de « déménager »."
    conclusion: "**Dérivation suffixale** : on ajoute -ment au radical du verbe déménager. Le verbe devient un nom, ce qui change son emploi dans la phrase (sujet ou complément possible)."
    jules: "Même mécanisme pour beau → beauté (adjectif → nom) ou lent → lentement (adjectif → adverbe)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à trier des mots entre **dérivation** et **composition** : c'est la confusion la plus fréquente."
