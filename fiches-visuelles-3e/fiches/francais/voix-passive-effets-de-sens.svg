<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="De l'actif au passif : transformation et effets de sens">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-teal"><rect x="30" y="30" width="280" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="170.0" y="52" text-anchor="middle" dominant-baseline="central">Le chat mange la souris</text>
<text class="ts" x="170.0" y="71" text-anchor="middle" dominant-baseline="central">sujet+verbe+COD (actif)</text>
</g>
<line x1="310" y1="60" x2="380" y2="60" class="arr" marker-end="url(#arrow)"/>
<g class="node c-coral"><rect x="390" y="30" width="260" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="520.0" y="52" text-anchor="middle" dominant-baseline="central">La souris est mangée</text>
<text class="ts" x="520.0" y="71" text-anchor="middle" dominant-baseline="central">par le chat (passif)</text>
</g>
<line x1="160" y1="90" x2="160" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="90" x2="520" y2="140" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="30" y="140" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170.0" y="160" text-anchor="middle" dominant-baseline="central">COD devient sujet</text>
<text class="ts" x="170.0" y="178" text-anchor="middle" dominant-baseline="central">la souris (patient)</text>
</g>
<g class="node c-amber"><rect x="390" y="140" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="520.0" y="160" text-anchor="middle" dominant-baseline="central">sujet devient agent</text>
<text class="ts" x="520.0" y="178" text-anchor="middle" dominant-baseline="central">par le chat</text>
</g>
<g class="node c-gray"><rect x="60" y="230" width="560" height="130" rx="10" stroke-width="0.5"/>
<text class="th" x="80" y="252" text-anchor="start" dominant-baseline="central">Effets de sens du passif</text>
<text class="ts" x="80" y="282" text-anchor="start" dominant-baseline="central">met en valeur le patient</text>
<text class="ts" x="80" y="304" text-anchor="start" dominant-baseline="central">cache l'agent inconnu</text>
<text class="ts" x="80" y="326" text-anchor="start" dominant-baseline="central">ton objectif, admin.</text>
</g>
</svg>
