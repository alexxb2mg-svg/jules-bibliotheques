<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrowap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-blue"><rect x="20" y="20" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="42" text-anchor="middle" dominant-baseline="central">Forme active</text>
<text class="ts" x="120" y="62" text-anchor="middle" dominant-baseline="central">Le vent a cassé</text>
<text class="ts" x="120" y="78" text-anchor="middle" dominant-baseline="central">la branche.</text></g>
<g class="node c-teal"><rect x="240" y="20" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Forme passive</text>
<text class="ts" x="340" y="62" text-anchor="middle" dominant-baseline="central">La branche a été</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">cassée par le vent.</text></g>
<g class="node c-coral"><rect x="460" y="20" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="42" text-anchor="middle" dominant-baseline="central">Impersonnelle</text>
<text class="ts" x="560" y="62" text-anchor="middle" dominant-baseline="central">Il est arrivé</text>
<text class="ts" x="560" y="78" text-anchor="middle" dominant-baseline="central">un accident.</text></g>
<line x1="120" y1="90" x2="120" y2="130" class="arr" marker-end="url(#arrowap)"/>
<line x1="340" y1="90" x2="340" y2="130" class="arr" marker-end="url(#arrowap)"/>
<line x1="560" y1="90" x2="560" y2="130" class="arr" marker-end="url(#arrowap)"/>
<g class="node c-blue"><rect x="20" y="140" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="120" y="162" text-anchor="middle" dominant-baseline="central">le sujet agit</text>
<text class="t" x="120" y="182" text-anchor="middle" dominant-baseline="central">sur autre chose</text></g>
<g class="node c-teal"><rect x="240" y="140" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="162" text-anchor="middle" dominant-baseline="central">le sujet subit</text>
<text class="t" x="340" y="182" text-anchor="middle" dominant-baseline="central">l'action</text></g>
<g class="node c-coral"><rect x="460" y="140" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="560" y="162" text-anchor="middle" dominant-baseline="central">« il » ne renvoie</text>
<text class="t" x="560" y="182" text-anchor="middle" dominant-baseline="central">à rien de précis</text></g>
<g class="c-gray"><rect x="20" y="230" width="640" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="255" text-anchor="middle" dominant-baseline="central">Sujet réel après le verbe : « il manque</text>
<text class="t" x="340" y="278" text-anchor="middle" dominant-baseline="central">des chaises » (sujet réel : des chaises)</text></g>
</svg>
