<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrowpr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-blue"><rect x="20" y="20" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="42" text-anchor="middle" dominant-baseline="central">Discours direct</text>
<text class="ts" x="120" y="62" text-anchor="middle" dominant-baseline="central">« Je pars demain »,</text>
<text class="ts" x="120" y="78" text-anchor="middle" dominant-baseline="central">dit-elle.</text></g>
<g class="node c-teal"><rect x="240" y="20" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="42" text-anchor="middle" dominant-baseline="central">Discours indirect</text>
<text class="ts" x="340" y="62" text-anchor="middle" dominant-baseline="central">Elle dit qu'elle</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">partait le lendemain.</text></g>
<g class="node c-coral"><rect x="460" y="20" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="42" text-anchor="middle" dominant-baseline="central">Indirect libre</text>
<text class="ts" x="560" y="62" text-anchor="middle" dominant-baseline="central">Elle partirait !</text>
<text class="ts" x="560" y="78" text-anchor="middle" dominant-baseline="central">Enfin, se dit-elle.</text></g>
<line x1="120" y1="90" x2="120" y2="130" class="arr" marker-end="url(#arrowpr)"/>
<line x1="340" y1="90" x2="340" y2="130" class="arr" marker-end="url(#arrowpr)"/>
<line x1="560" y1="90" x2="560" y2="130" class="arr" marker-end="url(#arrowpr)"/>
<g class="node c-blue"><rect x="20" y="140" width="200" height="90" rx="8" stroke-width="0.5"/>
<text class="t" x="120" y="160" text-anchor="middle" dominant-baseline="central">Guillemets</text>
<text class="t" x="120" y="180" text-anchor="middle" dominant-baseline="central">verbe introducteur</text>
<text class="t" x="120" y="200" text-anchor="middle" dominant-baseline="central">ponctuation exacte</text></g>
<g class="node c-teal"><rect x="240" y="140" width="200" height="90" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="160" text-anchor="middle" dominant-baseline="central">Pas de guillemets</text>
<text class="t" x="340" y="180" text-anchor="middle" dominant-baseline="central">subordonnée (que)</text>
<text class="t" x="340" y="200" text-anchor="middle" dominant-baseline="central">pronoms et temps</text></g>
<g class="node c-coral"><rect x="460" y="140" width="200" height="90" rx="8" stroke-width="0.5"/>
<text class="t" x="560" y="160" text-anchor="middle" dominant-baseline="central">Pas de guillemets</text>
<text class="t" x="560" y="180" text-anchor="middle" dominant-baseline="central">ni verbe introducteur</text>
<text class="t" x="560" y="200" text-anchor="middle" dominant-baseline="central">ton du personnage</text></g>
<g class="c-gray"><rect x="20" y="250" width="640" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="272" text-anchor="middle" dominant-baseline="central">Indirect libre = pronoms et temps de l'indirect</text>
<text class="t" x="340" y="292" text-anchor="middle" dominant-baseline="central">+ rythme et vocabulaire du discours direct</text></g>
</svg>
