<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="COD avant ou apres : accorder le participe passe">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="node c-gray"><rect x="190" y="30" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="50" text-anchor="middle" dominant-baseline="central">avoir + participe passé</text>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">temps composé du verbe</text></g>
<line x1="340" y1="86" x2="340" y2="130" class="arr" marker-end="url(#arrow)"/>

<g class="node c-gray"><rect x="210" y="130" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="150" text-anchor="middle" dominant-baseline="central">Chercher le COD du verbe</text>
<text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">qui ? quoi + verbe ?</text></g>
<line x1="280" y1="186" x2="160" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="186" x2="520" y2="230" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal"><rect x="30" y="230" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="250" text-anchor="middle" dominant-baseline="central">COD placé avant</text>
<text class="ts" x="160" y="268" text-anchor="middle" dominant-baseline="central">le, la, les, que...</text></g>
<g class="node c-coral"><rect x="390" y="230" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="520" y="250" text-anchor="middle" dominant-baseline="central">COD après ou absent</text>
<text class="ts" x="520" y="268" text-anchor="middle" dominant-baseline="central">pas de COD avant</text></g>
<line x1="160" y1="286" x2="160" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="286" x2="520" y2="330" class="arr" marker-end="url(#arrow)"/>

<g class="node c-green"><rect x="30" y="330" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="160" y="350" text-anchor="middle" dominant-baseline="central">Accord du participe</text>
<text class="ts" x="160" y="368" text-anchor="middle" dominant-baseline="central">genre + nombre du COD</text></g>
<g class="node c-red"><rect x="390" y="330" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="520" y="350" text-anchor="middle" dominant-baseline="central">Participe invariable</text>
<text class="ts" x="520" y="368" text-anchor="middle" dominant-baseline="central">aucune marque ajoutée</text></g>

<g class="node c-purple"><rect x="130" y="405" width="420" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="425" text-anchor="middle" dominant-baseline="central">les pommes qu'il a</text>
<text class="ts" x="340" y="443" text-anchor="middle" dominant-baseline="central">mangées (accord: pommes)</text></g>
</svg>
