notion: visee-satirique
titre: "Les visées et modalités de la satire"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_1"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Wikipédia, « Satire »", url: "https://fr.wikipedia.org/w/index.php?title=Satire&oldid=238020050", licence: CC-BY-SA-4.0}
  - {titre: "Wikipédia, « Caricature »", url: "https://fr.wikipedia.org/w/index.php?title=Caricature&oldid=239186401", licence: CC-BY-SA-4.0}
  - {titre: "Wikisource, « Fables de La Fontaine (éd. 1874)/Le Loup et l'Agneau »", url: "https://fr.wikisource.org/w/index.php?title=Fables_de_La_Fontaine_%28%C3%A9d._1874%29/Le_Loup_et_l%E2%80%99Agneau&oldid=13176461", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: satire, titre: "Satire", sous_titre: "critiquer par le rire", principal: true}
      - {id: exageration, titre: "Exagération", sous_titre: "grossir un trait"}
      - {id: diminution, titre: "Diminution", sous_titre: "rapetisser, rabaisser"}
      - {id: parodie, titre: "Parodie", sous_titre: "imiter un style"}
      - {id: ironie, titre: "Ironie", sous_titre: "dire le contraire"}
    liens:
      - {de: satire, vers: exageration, libelle: "procédé"}
      - {de: satire, vers: diminution, libelle: "procédé"}
      - {de: satire, vers: parodie, libelle: "procédé"}
      - {de: satire, vers: ironie, libelle: "procédé"}
    jules: "Quatre outils différents, un seul but : faire comprendre une critique en passant par le rire ou le ridicule."

  - id: graphe-grossissement
    type: graphe
    gabarit: caricature-grossissement
    curseurs:
      - {id: curseur-grossissement, nom: grossissement, min: 1, max: 3, pas: 0.25, depart: 2}
      - {id: curseur-trait, nom: trait, min: 1, max: 3, pas: 1, depart: 1}
    lectures:
      - {si: "grossissement < 1.5", texte: "Le portrait reste **fidèle** : on décrit, ce n'est pas encore de la satire."}
      - {si: "grossissement >= 1.5 && grossissement <= 2.5", texte: "Le trait est **grossi** : c'est le procédé de l'**exagération**, on fait rire pour dénoncer."}
      - {si: "grossissement > 2.5", texte: "L'exagération est extrême : la caricature risque de devenir pur **rabaissement**. C'est là qu'on se pose la question des **limites** de la satire."}
    jules: "Le caricaturiste choisit **un** trait caractéristique et le grossit : on reconnaît encore la personne, mais on voit ce qu'il veut critiquer. Trait 1 = nez, 2 = oreilles, 3 = bouche : le procédé reste le même."

  - id: methode
    type: methode
    etapes:
      - "Identifier la cible réelle du texte ou de l'image (une personne, un groupe, une institution, un comportement)."
      - "Repérer les procédés utilisés : exagération, diminution, parodie, ironie."
      - "Distinguer ce qui est dit littéralement de ce que l'auteur veut vraiment faire comprendre."
      - "Comprendre le message critique caché derrière le rire."
      - "S'interroger sur les limites : la satire est-elle juste, excessive, dangereuse pour quelqu'un ?"
    jules: "L'étape 3 est décisive avec l'**ironie** : l'auteur dit souvent le contraire exact de ce qu'il pense."

  - id: piege
    type: piege
    mauvaise_idee: "Prendre au premier degré une phrase ironique."
    pourquoi_faux: "L'ironie fonctionne en disant le contraire de ce qu'on pense vraiment, pour mieux faire ressortir la critique."
    bonne_idee: "Chercher un décalage entre ce qui est dit et le contexte : si la situation contredit la phrase, c'est de l'ironie."
    jules: "Un signe fréquent : une exagération d'éloge (« quelle merveilleuse idée ! ») alors que la situation est clairement ratée."

  - id: exemple
    type: exemple
    situation: "Dans « Le Loup et l'Agneau » de La Fontaine, le loup accuse l'agneau de salir son eau alors que l'agneau boit en aval, plus bas que lui."
    calcul: "La Fontaine exagère l'absurdité des accusations du loup pour dénoncer, sous couvert d'animaux, l'injustice des puissants envers les faibles."
    conclusion: "« La raison du plus fort est toujours la meilleure » est une morale ironique qui critique un abus de pouvoir réel."
    jules: "Chez La Fontaine, un animal cache souvent un humain : le loup, c'est le puissant qui invente n'importe quel prétexte."

  - id: piege2
    type: piege
    mauvaise_idee: "Croire que la satire est toujours méchante."
    pourquoi_faux: "La satire vise à corriger un défaut par le rire ; elle peut être bienveillante et pas seulement destructrice."
    bonne_idee: "Se demander si le texte cherche à faire réfléchir ou simplement à blesser, avant de juger son intention."
    jules: "La **satire** a une visée morale : elle attaque des défauts (hypocrisie, vanité, injustice) plus que des individus au hasard."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "exagération, diminution, parodie, ironie"}
    jules: "Entraîne-toi à écrire une phrase ironique : dis le contraire exact de ce que tu penses, et vérifie que le contexte le fait comprendre."

  - id: schema
    type: schema
    titre: "Les procédés de la satire"
    svg: "visee-satirique.svg"
    jules: "Exagérer, diminuer, imiter ou dire le contraire : quatre chemins différents vers la même critique sociale."
