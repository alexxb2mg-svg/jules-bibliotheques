notion: ponctuation-syntaxique
titre: "Le rôle syntaxique de la ponctuation"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_5"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Ponctuation »"
    url: "https://fr.wikipedia.org/w/index.php?title=Ponctuation&oldid=237620250"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
blocs:
  - id: formule
    type: formule
    expression: "Le soir venu, il rentra chez lui : la nuit s'annonçait froide."
    termes:
      ",": {couleur: bleu, legende: "détache un complément circonstanciel déplacé en tête de phrase"}
      ":": {couleur: rouge, legende: "annonce une explication de ce qui précède"}
    jules: "Chaque signe a un rôle précis, jamais juste une pause à l'oral : c'est ce qu'on appelle son **rôle syntaxique**."

  - id: carte
    type: carte
    noeuds:
      - {id: ponctuation, titre: "Ponctuation", sous_titre: "rôle syntaxique", principal: true}
      - {id: virgule, titre: "Virgule", sous_titre: "sépare, détache"}
      - {id: deuxpoints, titre: "Deux-points", sous_titre: "annonce"}
      - {id: pointvirgule, titre: "Point-virgule", sous_titre: "relie sans subordonner"}
    liens:
      - {de: ponctuation, vers: virgule, libelle: "énumération, apposition"}
      - {de: ponctuation, vers: deuxpoints, libelle: "explication, citation"}
      - {de: ponctuation, vers: pointvirgule, libelle: "deux phrases liées"}
    jules: "Le point-virgule exige deux propositions déjà complètes de chaque côté : sinon, c'est une simple virgule."

  - id: schema
    type: schema
    titre: "Quel signe pour quel rôle ?"
    svg: "ponctuation-syntaxique.svg"
    jules: "Demande-toi toujours : ce signe sépare des éléments de même fonction, ou relie deux phrases entières ?"

  - id: methode
    type: methode
    etapes:
      - "Repérer le signe et se demander s'il sépare des éléments de même fonction ou relie deux phrases."
      - "Pour la virgule : vérifier énumération, apposition détachée, ou complément déplacé."
      - "Pour les deux-points : chercher ce qui suit, une explication, une énumération ou une citation."
      - "Pour le point-virgule : vérifier qu'il y a bien deux propositions autonomes de chaque côté."
      - "Ne jamais mettre une virgule entre le sujet et son verbe, sauf incise entre virgules."
    jules: "La dernière étape est un réflexe à prendre : une virgule entre sujet et verbe est presque toujours fautive."

  - id: piege
    type: piege
    mauvaise_idee: "Utiliser un point-virgule comme une simple virgule, sans deux propositions complètes."
    pourquoi_faux: "Le **point-virgule** relie deux propositions déjà autonomes : sans verbe conjugué de chaque côté, il n'a pas sa place."
    bonne_idee: "Vérifier que chaque partie séparée par le point-virgule a son propre sujet et son propre verbe conjugué."
    jules: "Si une des deux parties ne tient pas seule comme phrase, remplace le point-virgule par une virgule."

  - id: exemple
    type: exemple
    situation: "Ponctuer : « Pierre aime lire dessiner et jouer de la guitare »"
    calcul: "Trois éléments énumérés : lire, dessiner, jouer de la guitare, reliés par « et » pour les deux derniers."
    conclusion: "« Pierre aime lire, **dessiner** et jouer de la guitare. » : virgules entre les éléments, pas avant « et »."
    jules: "Pas de virgule avant le « et » qui relie déjà les deux derniers éléments d'une énumération simple."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "virgule, deux-points, point-virgule"}
    jules: "Repère ces trois signes dans un texte que tu lis : identifie à chaque fois leur rôle syntaxique exact."
