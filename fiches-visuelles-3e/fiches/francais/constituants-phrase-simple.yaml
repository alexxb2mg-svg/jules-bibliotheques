blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: phrase-simple, titre: "Phrase simple", sous_titre: "un seul verbe conjugué", principal: true}
      - {id: sujet, titre: "Sujet", sous_titre: "qui fait ou dont on parle"}
      - {id: predicat, titre: "Prédicat", sous_titre: "verbe + compléments"}
      - {id: circonstanciel, titre: "Complément circ.", sous_titre: "mobile, supprimable"}
      - {id: expansions, titre: "Expansions du nom", sous_titre: "épithète, C. du nom"}
    liens:
      - {de: phrase-simple, vers: sujet, libelle: "fait l'action"}
      - {de: phrase-simple, vers: predicat, libelle: "ce qu'on en dit"}
      - {de: phrase-simple, vers: circonstanciel, libelle: "où, quand, comment"}
      - {de: phrase-simple, vers: expansions, libelle: "enrichit un nom"}
    jules: "Le **sujet** peut être éloigné du verbe (inversion, mot intercalé), mais c'est toujours lui qui commande l'accord."

  - id: schema
    type: schema
    titre: "Les constituants d'une phrase"
    svg: "constituants-phrase-simple.svg"
    jules: "Le **COD** répond à qui/quoi sans préposition, le **COI** à qui/quoi avec préposition : les deux complètent le verbe."

  - id: methode
    type: methode
    etapes:
      - "Trouver le verbe conjugué, puis poser « qui est-ce qui ou qu'est-ce qui fait le verbe ? » pour le sujet."
      - "Repérer le COD (qui/quoi, sans préposition) et le COI (à qui/à quoi, avec préposition)."
      - "Identifier les compléments circonstanciels : supprimables et déplaçables, ils répondent à où, quand, comment, pourquoi."
      - "Analyser les expansions du nom : épithète collée au nom, complément du nom introduit par une préposition, apposition détachée par une virgule."
      - "Croiser le type de phrase (déclaratif, interrogatif, impératif) et sa forme (négative, passive, impersonnelle) : les deux peuvent se combiner."
    jules: "L'étape 1 est la clé de tout : sans verbe conjugué repéré, impossible de trouver le sujet."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre le **COD** avec l'**attribut du sujet**."
    pourquoi_faux: "L'attribut du sujet suit un verbe d'état (être, sembler, paraître...) : il caractérise le sujet, il ne répond pas à la question qui/quoi du COD."
    bonne_idee: "Vérifier le verbe : un verbe d'état donne un attribut du sujet, un verbe d'action peut donner un COD."
    jules: "Autre confusion fréquente : le **type** de phrase (déclaratif, interrogatif...) n'est pas sa **forme** (négative, passive...)."

  - id: exemple
    type: exemple
    situation: "Analyser : « Dans le jardin, mon voisin, un homme très patient, cultive de belles roses rouges chaque été. »"
    conclusion: "Sujet : **mon voisin**. Apposition : un homme très patient. Verbe : cultive. **COD** : de belles roses rouges (épithètes belles, rouges). Compléments circonstanciels : dans le jardin (lieu), chaque été (temps)."
    jules: "L'apposition (« un homme très patient ») est détachée par des virgules : elle se rapporte au sujet sans mot de liaison."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi surtout à repérer le sujet quand il est **éloigné** du verbe : c'est le cas le plus piégeur."
