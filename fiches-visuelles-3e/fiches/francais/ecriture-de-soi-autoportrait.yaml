notion: ecriture-de-soi-autoportrait
titre: "L'écriture de soi et l'autoportrait"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_1"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Wikipédia, « Autobiographie »", url: "https://fr.wikipedia.org/w/index.php?title=Autobiographie&oldid=236979671", licence: CC-BY-SA-4.0}
  - {titre: "Wikipédia, « Autoportrait »", url: "https://fr.wikipedia.org/w/index.php?title=Autoportrait&oldid=238503251", licence: CC-BY-SA-4.0}
  - {titre: "Wikisource, « Les Confessions (Rousseau)/Livre I »", url: "https://fr.wikisource.org/w/index.php?title=Les_Confessions_%28Rousseau%29/Livre_I&oldid=12221798", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
abreviations:
  je: "le pronom qui désigne l'auteur-narrateur dans un texte autobiographique"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: soi, titre: "Écriture de soi", sous_titre: "l'auteur parle de sa vie", principal: true}
      - {id: autobio, titre: "Autobiographie", sous_titre: "récit rétrospectif en prose"}
      - {id: journal, titre: "Journal intime", sous_titre: "au jour le jour"}
      - {id: memoires, titre: "Mémoires", sous_titre: "évènements publics vécus"}
      - {id: correspondance, titre: "Correspondance", sous_titre: "des lettres"}
    liens:
      - {de: soi, vers: autobio, libelle: "récit de toute une vie"}
      - {de: soi, vers: journal, libelle: "sans recul"}
      - {de: soi, vers: memoires, libelle: "avec du recul"}
      - {de: soi, vers: correspondance, libelle: "à un destinataire"}
    jules: "Quatre formes, un même geste : parler de sa propre vie. Ce qui change, c'est le moment où l'on écrit et ce qu'on choisit de raconter."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-souvenir, nom: souvenir, min: 0, max: 70, pas: 1, depart: 10}
      - {id: curseur-auteur, nom: auteur, min: 10, max: 80, pas: 1, depart: 50}
      - {id: curseur-debut, nom: début, min: 0, max: 0, pas: 1, depart: 0}
      - {id: curseur-fin, nom: fin, min: 80, max: 80, pas: 1, depart: 80}
    lectures:
      - {si: "souvenir < 12", texte: "Il raconte son **enfance** avec ses yeux d'adulte : le « je » qui écrit n'est plus l'enfant qui a vécu."}
      - {si: "auteur >= 40", texte: "Beaucoup de **recul** : mémoires, autobiographie. La mémoire peut déformer les souvenirs."}
      - {si: "auteur <= 20", texte: "Écrire très jeune, presque **sans recul** : on se rapproche du **journal intime**, écrit au jour le jour."}
    jules: "Bouge les deux repères : la bande orange, c'est le **recul** entre le moment vécu et le moment où l'on écrit."

  - id: methode
    type: methode
    etapes:
      - "Vérifier qui parle : l'auteur, le narrateur et le personnage sont-ils la même personne (autobiographie) ?"
      - "Identifier le genre précis : dates et présent (journal), évènements publics (mémoires), destinataire nommé (lettre)."
      - "Chercher les marques de la première personne et les commentaires du narrateur sur son passé."
      - "Se demander pourquoi l'auteur écrit sur lui-même à ce moment de sa vie."
      - "Comparer ce que le texte montre et ce qu'il choisit de taire ou d'atténuer."
    jules: "L'étape 5 est la plus fine : un texte sur soi n'est jamais un simple miroir, c'est toujours un choix de mise en scène."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre autobiographie et roman autobiographique."
    pourquoi_faux: "Dans l'autobiographie, l'auteur, le narrateur et le personnage sont la même personne réelle ; le roman autobiographique s'inspire de la vie de l'auteur mais reste fictif."
    bonne_idee: "Vérifier le pacte : l'auteur promet-il explicitement de dire la vérité sur lui-même, ou invente-t-il un personnage inspiré de lui ?"
    jules: "Le **pacte autobiographique** est cet engagement à dire vrai : sans lui, on est déjà du côté de la fiction."

  - id: exemple
    type: exemple
    situation: "Dans Les Confessions, Rousseau écrit : « Je forme une entreprise qui n'eut jamais d'exemple […] Je veux montrer à mes semblables un homme dans toute la vérité de la nature, et cet homme, ce sera moi. »"
    calcul: "Rousseau annonce un projet inédit : se montrer tel qu'il est, sans se flatter ni se noircir."
    conclusion: "« Ce sera moi » établit le **pacte autobiographique** : auteur, narrateur et personnage ne font qu'un."
    jules: "Le mot « entreprise » montre l'ambition du geste : personne avant Rousseau n'avait osé ce niveau de sincérité."

  - id: piege2
    type: piege
    mauvaise_idee: "Croire qu'un texte autobiographique est forcément entièrement exact."
    pourquoi_faux: "La mémoire déforme les souvenirs et l'écriture met en forme le vécu : le pacte est un engagement, pas une garantie parfaite de vérité."
    bonne_idee: "Chercher, dans le texte, les traces de cette mise en forme : ordre choisi, mots choisis, ce qui est passé sous silence."
    jules: "Un autoportrait pictural fait pareil : l'artiste choisit son angle, sa lumière, ce qu'il montre de lui."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "autobiographie, journal, mémoires, correspondance"}
    jules: "Entraîne-toi à reconnaître le genre à partir d'un simple extrait : dates ? destinataire ? recul dans le temps ?"

  - id: schema
    type: schema
    titre: "Quel genre d'écriture de soi ?"
    svg: "ecriture-de-soi-autoportrait.svg"
    jules: "Le repère clé est le moment de l'écriture : pendant les évènements (journal) ou longtemps après (mémoires, autobiographie)."
