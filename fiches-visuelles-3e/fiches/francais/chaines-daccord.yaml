notion: chaines-daccord
titre: "Les chaînes d'accord dans le groupe nominal"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_9"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Accord (grammaire) »"
