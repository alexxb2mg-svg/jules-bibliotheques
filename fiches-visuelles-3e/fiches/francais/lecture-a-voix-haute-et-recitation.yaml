notion: lecture-a-voix-haute-et-recitation
titre: "Lire à voix haute et réciter"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_5"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Lecture à voix haute »"
    url: "https://fr.wikipedia.org/w/index.php?title=Lecture_%C3%A0_voix_haute&oldid=239332925"
    licence: CC-BY-SA-4.0
  - titre: "Wikisource, « Poèmes saturniens (1866)/Chanson d'automne »"
    url: "https://fr.wikisource.org/w/index.php?title=Po%C3%A8mes_saturniens_%281866%29/Chanson_d%E2%80%99automne&oldid=13177234"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: recitation, titre: "Réciter un texte", sous_titre: "à voix haute", principal: true}
      - {id: comprehension, titre: "Comprendre le texte", sous_titre: "sens, ponctuation"}
      - id: ressources
        titre: "Ressources du corps"
        sous_titre: "voix, souffle, regard"
      - {id: numerique, titre: "Outils numériques", sous_titre: "s'enregistrer"}
    liens:
      - {de: recitation, vers: comprehension, libelle: "avant de réciter"}
      - {de: recitation, vers: ressources, libelle: "pour être vivante"}
      - {de: recitation, vers: numerique, libelle: "pour s'entraîner"}
    jules: "On **comprend** le texte avant de le dire : sans ça, la voix reste plate même bien entraînée."

  - id: schema
    type: schema
    titre: "Les ressources pour réciter"
    svg: "lecture-a-voix-haute-et-recitation.svg"
    jules: "Ces quatre ressources se travaillent ensemble : une voix juste sans regard reste froide pour le public."

  - id: methode
    type: methode
    etapes:
      - "Comprendre le texte en profondeur avant de le lire ou de le réciter : sens, ponctuation, rythme."
      - "S'entraîner à voix haute plusieurs fois avant la présentation finale."
      - "Marquer les pauses aux ponctuations pour respirer et laisser le sens s'installer."
      - "Varier le **volume** et l'**intonation** selon le sens et les émotions du texte."
      - "Regarder le public régulièrement plutôt que de fixer ses notes ou le sol."
    jules: "L'étape des pauses est celle qu'on saute le plus souvent : sans elle, tout devient une bouillie de mots."

  - id: piege
    type: piege
    mauvaise_idee: "Garder un ton monotone du début à la fin, sans jamais varier l'intonation."
    pourquoi_faux: "Un ton plat ne transmet ni le **sens** ni les émotions du texte : l'auditoire décroche vite."
    bonne_idee: "Faire varier le volume, le débit et l'intonation selon ce que dit le texte à ce moment précis."
    jules: "Relis à l'oral en exagérant d'abord les variations : tu ajusteras ensuite, mais tu sauras qu'elles existent."

  - id: exemple
    type: exemple
    situation: "Pour réciter « Chanson d'automne » de Verlaine, poème mélancolique et musical, quelles ressources utiliser ?"
    calcul: "Un débit assez lent, une voix posée, des pauses marquées à la fin de chaque vers court."
    conclusion: "Une intonation légèrement descendante restitue la **mélancolie** du texte, en plus des pauses."
    jules: "Le rythme du poème (vers courts) guide directement le placement des pauses : c'est un indice à lire."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🎙️", titre: "S'enregistrer", description: "écouter et se corriger"}
    jules: "T'enregistrer est le meilleur moyen de t'entendre comme le public t'entend, pas comme tu t'imagines."
