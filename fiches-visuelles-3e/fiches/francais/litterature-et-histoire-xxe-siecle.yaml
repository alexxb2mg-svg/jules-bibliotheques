notion: litterature-et-histoire-xxe-siecle
titre: "Littérature et histoire du XXe siècle"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_2"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Littérature engagée »"
    url: "https://fr.wikipedia.org/w/index.php?title=Litt%C3%A9rature_engag%C3%A9e&oldid=239676414"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Genre littéraire »"
    url: "https://fr.wikipedia.org/w/index.php?title=Genre_litt%C3%A9raire&oldid=238084925"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
abreviations:
  URSS: "Union des républiques socialistes soviétiques"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: histoire, titre: "Bouleversement historique", sous_titre: "guerres, totalitarismes", principal: true}
      - {id: temoignage, titre: "Témoignage", sous_titre: "faits vécus, rapportés"}
      - {id: engagement, titre: "Littérature engagée", sous_titre: "défendre une cause"}
      - {id: resistance, titre: "Résistance", sous_titre: "s'opposer par l'écrit"}
    liens:
      - {de: histoire, vers: temoignage, libelle: "point de départ"}
      - {de: histoire, vers: engagement, libelle: "réaction de l'auteur"}
      - {de: engagement, vers: resistance, libelle: "forme extrême"}
    jules: "Le **témoignage** rapporte des faits vécus ; l'**engagement** va plus loin, l'auteur défend une cause."

  - id: schema
    type: schema
    titre: "Document historique ou œuvre littéraire ?"
    svg: "litterature-et-histoire-xxe-siecle.svg"
    jules: "La littérature ne se contente pas d'informer : elle construit un récit pour faire ressentir et réfléchir."

  - id: methode
    type: methode
    etapes:
      - "Situer le texte dans son contexte historique précis (quelle période, quel évènement)."
      - "Distinguer ce qui relève du témoignage (les faits vécus) et ce qui relève du travail littéraire."
      - "Repérer les marques de l'engagement de l'auteur (jugement, émotion, choix des mots)."
      - "S'interroger sur ce que le texte cherche à provoquer chez le lecteur : comprendre, s'indigner, ne pas oublier."
      - "Ne jamais confondre un récit à la première personne et une preuve historique absolue."
    jules: "Un texte littéraire **interprète** l'histoire : il ne remplace jamais un document d'historien."

  - id: piege
    type: piege
    mauvaise_idee: "Traiter un texte littéraire sur la guerre comme un simple document d'histoire, sans étudier son écriture."
    pourquoi_faux: "Le travail sur la langue, le récit et les images vise à faire ressentir une expérience, pas seulement à informer."
    bonne_idee: "Analyser aussi la **construction** du texte : point de vue, rythme, choix des mots, avant de conclure sur l'histoire."
    jules: "Au brevet, on attend une analyse du texte, pas un simple résumé des faits historiques."

  - id: exemple
    type: exemple
    situation: "Un roman raconte la Seconde Guerre mondiale à travers le regard d'un seul personnage, avec des détails sensoriels et un rythme haletant dans les scènes de danger."
    conclusion: "Le roman choisit un point de vue, construit un personnage et travaille le style pour faire ressentir une expérience, là où un document historique établit d'abord des faits datés et vérifiés."
    jules: "C'est cette différence de projet (ressentir ou établir des faits) qu'il faut savoir expliquer."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Révise aussi le vocabulaire : engagement, témoignage, résistance ne veulent pas dire la même chose."
