blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: modalisation, titre: "La modalisation", sous_titre: "attitude du locuteur", principal: true}
      - {id: adverbes, titre: "Adverbes", sous_titre: "peut-être, certainement"}
      - {id: verbes, titre: "Verbes modaux", sous_titre: "devoir, sembler"}
      - {id: vocabulaire, titre: "Vocabulaire évaluatif", sous_titre: "adjectifs jugés"}
    liens:
      - {de: modalisation, vers: adverbes, libelle: "degré de certitude"}
      - {de: modalisation, vers: verbes, libelle: "opinion, doute"}
      - {de: modalisation, vers: vocabulaire, libelle: "jugement"}
    jules: "Un texte sans adverbe de jugement n'est pas forcément neutre : le vocabulaire seul peut déjà **modaliser**."

  - id: schema
    type: schema
    titre: "Les procédés de modalisation"
    svg: "marques-de-modalisation.svg"
    jules: "Le conditionnel marque une information **non confirmée** : très fréquent dans les articles de presse."

  - id: methode
    type: methode
    etapes:
      - "Repérer les adverbes et expressions qui indiquent un degré de certitude ou d'incertitude."
      - "Chercher les verbes modaux (devoir, pouvoir, sembler) et les verbes d'opinion."
      - "Observer si le conditionnel exprime une information non vérifiée."
      - "Relever le vocabulaire évaluatif : adjectifs et noms à connotation positive ou négative."
      - "Conclure sur l'engagement de l'énonciateur : texte plutôt objectif ou marqué par son point de vue."
    jules: "Cinq indices à croiser plutôt qu'un seul : plus ils s'accumulent, plus le texte est engagé."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'un texte sans adverbe de jugement est forcément neutre."
    pourquoi_faux: "Le vocabulaire évaluatif seul (adjectifs mélioratifs ou péjoratifs) peut moduler le propos, sans aucun adverbe de certitude."
    bonne_idee: "Toujours vérifier aussi les noms et adjectifs employés, pas seulement les adverbes et le conditionnel."
    jules: "« Un film magnifique » modalise autant qu'un « sans doute » : le jugement passe aussi par le choix des mots."

  - id: exemple
    type: exemple
    situation: "Relever les marques de modalisation : « Ce film est, sans doute, le meilleur de l'année ; il semble avoir bouleversé tous les critiques. »"
    calcul: "« sans doute » (adverbe de forte probabilité), « le meilleur » (superlatif mélioratif), « semble » (verbe modal d'impression)."
    conclusion: "Le locuteur exprime un **jugement engagé**, pas un simple constat."
    jules: "Trois marques différentes dans une seule phrase : c'est un texte fortement modalisé."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à repérer le conditionnel d'information non confirmée dans un article de presse."
