<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Un adjectif qualifie</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">plusieurs noms ?</text></g>
<line x1="280" y1="76" x2="170" y2="130" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="76" x2="510" y2="130" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="140" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="159" text-anchor="middle" dominant-baseline="central">Même genre</text>
<text class="ts" x="170" y="177" text-anchor="middle" dominant-baseline="central">féminin + féminin...</text></g>
<g class="node c-teal"><rect x="400" y="140" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="159" text-anchor="middle" dominant-baseline="central">Genres différents</text>
<text class="ts" x="510" y="177" text-anchor="middle" dominant-baseline="central">masculin + féminin</text></g>
<line x1="170" y1="196" x2="170" y2="240" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="196" x2="510" y2="240" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="60" y="250" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="269" text-anchor="middle" dominant-baseline="central">Accord à ce genre</text>
<text class="ts" x="170" y="287" text-anchor="middle" dominant-baseline="central">pluriel simple</text></g>
<g class="node c-purple"><rect x="400" y="250" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="269" text-anchor="middle" dominant-baseline="central">Masculin pluriel</text>
<text class="ts" x="510" y="287" text-anchor="middle" dominant-baseline="central">règle du masculin</text></g>
<g class="c-amber"><rect x="90" y="330" width="500" height="56" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="350" text-anchor="middle" dominant-baseline="central">chaque, tout (déterminant) : restent</text>
<text class="t" x="340" y="370" text-anchor="middle" dominant-baseline="central">singuliers devant un nom singulier.</text></g>
</svg>
