notion: corpus-visions-poetiques
titre: "Le corpus de poèmes : visions du monde"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_2"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Poésie »"
    url: "https://fr.wikipedia.org/w/index.php?title=Po%C3%A9sie&oldid=238949190"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: corpus, titre: "Corpus poétique", sous_titre: "romantisme à nos jours", principal: true}
      - {id: theme, titre: "Thème commun", sous_titre: "nature, temps, solitude..."}
      - {id: forme, titre: "Forme du poème", sous_titre: "rimes, strophes, rythme"}
      - {id: vision, titre: "Vision du monde", sous_titre: "propre à chaque poète"}
    liens:
      - {de: corpus, vers: theme, libelle: "point de départ"}
      - {de: corpus, vers: forme, libelle: "outil de comparaison"}
      - {de: theme, vers: vision, libelle: "révèle des écarts"}
    jules: "On compare toujours à partir d'un même **thème** : c'est ce qui permet de voir ce qui appartient à chaque poète."

  - id: schema
    type: schema
    titre: "Un même thème, plusieurs visions"
    svg: "corpus-visions-poetiques.svg"
    jules: "Le thème est le point commun ; la forme et l'émotion de chaque poète font la différence."

  - id: methode
    type: methode
    etapes:
      - "Repérer le thème commun aux poèmes du corpus (par exemple la nature ou le temps qui passe)."
      - "Identifier, pour chaque poème, l'émotion dominante et le regard porté sur ce thème."
      - "Comparer la forme des poèmes (rimes, strophes, rythme) pour voir ce qui les distingue."
      - "Relever le vocabulaire et les images propres à chaque poète."
      - "Conclure : un même thème peut inspirer des visions très différentes selon le poète et l'époque."
    jules: "L'étape 5 est le but final : sans conclusion comparative, l'étude reste incomplète."

  - id: piege
    type: piege
    mauvaise_idee: "Étudier chaque poème séparément, sans jamais les comparer entre eux."
    pourquoi_faux: "Un corpus existe justement pour être comparé : isoler les poèmes fait perdre le sens de l'exercice."
    bonne_idee: "Comparer systématiquement le **thème**, la **forme** et l'émotion de chaque poème du corpus."
    jules: "Une bonne copie nomme toujours au moins deux poèmes dans la même phrase de comparaison."

  - id: exemple
    type: exemple
    situation: "Dans « L'Albatros » de Baudelaire, l'oiseau majestueux dans le ciel devient « gauche et veule » une fois capturé sur le pont du navire, moqué par les marins."
    conclusion: "Baudelaire compare le poète à l'albatros : magnifique dans son élément, il devient ridicule une fois confronté au monde ordinaire. C'est une **vision mélancolique** du poète."
    jules: "Ce poème sert souvent d'exemple pour le thème de la place du poète dans la société."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à comparer deux poèmes sur un thème proche : c'est l'exercice le plus fréquent."
