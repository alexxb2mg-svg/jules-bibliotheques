notion: corpus-denoncer
titre: "Corpus : satire et dénonciation sociale"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_1"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Wikipédia, « Satire »", url: "https://fr.wikipedia.org/w/index.php?title=Satire&oldid=238020050", licence: CC-BY-SA-4.0}
  - {titre: "Wikisource, « J'accuse…! »", url: "https://fr.wikisource.org/w/index.php?title=J%E2%80%99accuse%E2%80%A6%21&oldid=13208359", licence: CC-BY-SA-4.0}
  - {titre: "Wikisource, « Fables de La Fontaine (éd. 1874)/Le Loup et l'Agneau »", url: "https://fr.wikisource.org/w/index.php?title=Fables_de_La_Fontaine_%28%C3%A9d._1874%29/Le_Loup_et_l%E2%80%99Agneau&oldid=13176461", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
abreviations:
  bd: "bande dessinée, un récit en images et en bulles"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: corpus, titre: "Corpus : dénoncer", sous_titre: "Antiquité à nos jours", principal: true}
      - {id: fable, titre: "Fable, conte", sous_titre: "récit inventé, critique"}
      - {id: pamphlet, titre: "Pamphlet", sous_titre: "texte court et violent"}
      - {id: image, titre: "Dessin, affiche, BD", sous_titre: "critique en image"}
    liens:
      - {de: corpus, vers: fable, libelle: "fiction critique"}
      - {de: corpus, vers: pamphlet, libelle: "attaque directe"}
      - {de: corpus, vers: image, libelle: "support visuel"}
    jules: "Le support change (mots ou images), mais l'objectif reste le même : dénoncer une injustice ou un défaut de la société."

  - id: methode
    type: methode
    etapes:
      - "Repérer, pour chaque document, la forme précise (fable, pamphlet, dessin de presse, extrait de conte...)."
      - "Identifier ce qui est dénoncé (l'injustice, la guerre, la vanité, un abus de pouvoir)."
      - "Comparer les procédés selon le support (les mots dans un texte, le trait et la légende dans un dessin)."
      - "Relier chaque document à son contexte historique si possible."
      - "Formuler en une phrase le message que l'auteur veut faire passer derrière la moquerie."
    jules: "L'étape 3 distingue bien les supports : un dessin de presse joue sur l'image et une légende courte, un texte joue sur les mots."

  - id: piege
    type: piege
    mauvaise_idee: "Décrire un dessin de presse sans expliquer ce qu'il dénonce réellement."
    pourquoi_faux: "Décrire le trait ou la scène ne suffit pas : une image satirique porte toujours un message caché derrière ce qu'elle montre."
    bonne_idee: "Toujours relier la description de l'image à la critique précise qu'elle formule."
    jules: "Un dessin sans message identifié n'est pas encore analysé, seulement décrit."

  - id: exemple
    type: exemple
    situation: "Dans « J'accuse…! », publié par Émile Zola dans L'Aurore en 1898, Zola écrit : « J'accuse les bureaux de la guerre d'avoir mené dans la presse […] une campagne abominable, pour égarer l'opinion et couvrir leur faute. »"
    calcul: "Ce texte ne fait pas rire, mais il appartient à la même famille de textes qui dénoncent une injustice."
    conclusion: "C'est un **pamphlet** direct et solennel, sans détour comique, contre l'injustice faite à Alfred Dreyfus."
    jules: "Tout ce qui dénonce n'est pas forcément drôle : le pamphlet attaque frontalement, sans passer par le rire."

  - id: piege2
    type: piege
    mauvaise_idee: "Oublier que le conte philosophique mélange fiction et critique sérieuse."
    pourquoi_faux: "Un conte comme Candide de Voltaire raconte des aventures inventées, mais sous une apparence légère se cache une critique réelle des institutions de son époque."
    bonne_idee: "Chercher, derrière chaque évènement du récit inventé, l'idée ou l'institution que l'auteur vise vraiment."
    jules: "Voltaire fait voyager son héros pour multiplier les occasions de critiquer des idées de son temps."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "fable, pamphlet, conte philosophique, dessin de presse"}
    jules: "Entraîne-toi à comparer un texte et une image du corpus sur le même défaut dénoncé."

  - id: schema
    type: schema
    titre: "Un corpus, plusieurs supports pour dénoncer"
    svg: "corpus-denoncer.svg"
    jules: "Fable, pamphlet ou dessin de presse : chaque support a ses propres outils pour faire passer une même critique sociale."
