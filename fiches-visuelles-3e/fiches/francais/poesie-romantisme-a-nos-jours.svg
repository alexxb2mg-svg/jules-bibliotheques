<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-purple"><rect x="20" y="120" width="180" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="140" text-anchor="middle" dominant-baseline="central">Romantisme</text>
<text class="ts" x="110" y="158" text-anchor="middle" dominant-baseline="central">Hugo, Lamartine</text>
<text class="ts" x="110" y="172" text-anchor="middle" dominant-baseline="central">XIXe siècle</text></g>
<line x1="200" y1="150" x2="250" y2="150" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="260" y="120" width="180" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="350" y="140" text-anchor="middle" dominant-baseline="central">Symbolisme</text>
<text class="ts" x="350" y="158" text-anchor="middle" dominant-baseline="central">Baudelaire, Verlaine</text>
<text class="ts" x="350" y="172" text-anchor="middle" dominant-baseline="central">fin XIXe</text></g>
<line x1="440" y1="150" x2="490" y2="150" class="arr" marker-end="url(#arrow)"/>
<g class="node c-amber"><rect x="500" y="120" width="160" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="140" text-anchor="middle" dominant-baseline="central">Surréalisme</text>
<text class="ts" x="580" y="158" text-anchor="middle" dominant-baseline="central">XXe siècle</text>
<text class="ts" x="580" y="172" text-anchor="middle" dominant-baseline="central">à nos jours</text></g>
<g class="node c-gray"><rect x="140" y="20" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Intensifier la présence au monde</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">le rapport à la nature, aux sentiments</text></g>
<line x1="340" y1="76" x2="340" y2="115" class="arr" marker-end="url(#arrow)"/>
<g class="node c-gray"><rect x="40" y="220" width="600" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="242" text-anchor="middle" dominant-baseline="central">Toujours : la forme (rythme, sonorités) porte le sens autant que les mots.</text></g>
</svg>
