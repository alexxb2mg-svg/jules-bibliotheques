relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_6", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: formule
    type: formule
    expression: "eût, fût → auxiliaire au subjonctif imparfait + participe passé"
    termes:
      "eût, fût": {couleur: violet, legende: "verbe **être** ou **avoir** conjugué au subjonctif imparfait, 3e personne (fût, eût)"}
    jules: "« qu'il eût fini » : avoir au **subjonctif imparfait** (eût) + participe passé (fini) = **subjonctif plus-que-parfait**."

  - id: carte
    type: carte
    noeuds:
      - {id: imparfait, titre: "Subjonctif imparfait", sous_titre: "radical du passé simple", principal: true}
      - {id: circonflexe, titre: "Accent circonflexe", sous_titre: "obligatoire à la 3e sg"}
      - {id: pqp, titre: "Plus-que-parfait", sous_titre: "auxiliaire + participe passé"}
      - {id: usage, titre: "Usage littéraire", sous_titre: "remplacé à l'oral"}
    liens:
      - {de: imparfait, vers: circonflexe}
      - {de: imparfait, vers: pqp, libelle: "sert d'auxiliaire à"}
      - {de: pqp, vers: usage}
    jules: "Ces deux temps sont aujourd'hui réservés à la langue **littéraire ou soutenue** ; à l'oral, on emploie le subjonctif présent ou passé."

  - id: schema-formation
    type: schema
    titre: "Former le subjonctif imparfait et le PQP"
    svg: "subjonctif-imparfait-plus-que-parfait.svg"
    jules: "Toujours partir du **passé simple** à la 2e personne du singulier, puis retirer le -s pour obtenir le radical."

  - id: methode
    type: methode
    etapes:
      - "Trouver la 2ᵉ personne du singulier du passé simple du verbe (tu aimas, tu finis, tu eus, tu vins)."
      - "Retirer le **-s final** : c'est le radical du subjonctif imparfait."
      - "Ajouter la terminaison de la personne ; pour la 3ᵉ personne du singulier, ajouter l'**accent circonflexe**."
      - "Pour le plus-que-parfait : conjuguer être ou avoir au subjonctif imparfait, puis ajouter le participe passé."
      - "Repérer ces temps dans un texte littéraire ancien et les remplacer mentalement par le subjonctif présent/passé."
    jules: "Verbes irréguliers à connaître à la 3e sg : qu'il **fît** (faire), qu'il **vînt** (venir), qu'il **sût** (savoir)."

  - id: piege
    type: piege
    mauvaise_idee: "Oublier l'accent circonflexe à la 3ᵉ personne du singulier (qu'il aima au lieu de qu'il aimât)."
    pourquoi_faux: "Sans l'accent, la forme se confond avec le **passé simple de l'indicatif** (il chanta, qu'il chantât)."
    bonne_idee: "À la 3ᵉ personne du singulier, l'accent circonflexe est **obligatoire** sur la voyelle finale du subjonctif imparfait."
    jules: "« il chanta » (indicatif) et « qu'il chantât » (subjonctif) ne se distinguent que par l'accent circonflexe."

  - id: exemple
    type: exemple
    situation: "Mettre au subjonctif imparfait, 3ᵉ personne du singulier : « Il fallait qu'il (finir) son travail avant la nuit. »"
    calcul: "Radical de « tu finis » (passé simple) sans le -s, + accent circonflexe."
    conclusion: "« Il fallait qu'il **finît** son travail avant la nuit. »"
    jules: "Le radical du subjonctif imparfait vient toujours du **passé simple**, jamais du présent de l'indicatif."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi sur les verbes irréguliers du 3e groupe : ce sont eux qui posent le plus de difficultés."
