titre: "Actif, passif et impersonnel"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_8"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Verbe impersonnel »"
    url: "https://fr.wikipedia.org/w/index.php?title=Verbe_impersonnel&oldid=236015527"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Voix passive »"
    url: "https://fr.wikipedia.org/w/index.php?title=Voix_passive&oldid=230156410"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_8", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: formule
    type: formule
    expression: "sujet + verbe + COD  →  COD + être + participe + par + sujet"
    termes:
      COD: {couleur: bleu, legende: "le complément d'objet direct de la phrase active, il devient sujet du passif"}
      sujet: {couleur: rouge, legende: "celui qui agit à l'actif, il devient complément d'agent (après « par ») au passif"}
    jules: "Passer à la forme passive inverse la perspective : ce qui était **subi** devient sujet."

  - id: carte
    type: carte
    noeuds:
      - {id: formes, titre: "Trois formes", sous_titre: "de phrase verbale", principal: true}
      - {id: active, titre: "Forme active", sous_titre: "le sujet agit"}
      - {id: passive, titre: "Forme passive", sous_titre: "le sujet subit"}
      - {id: impersonnelle, titre: "Impersonnelle", sous_titre: "sujet apparent « il »"}
    liens:
      - {de: formes, vers: active, libelle: "agent en avant"}
      - {de: formes, vers: passive, libelle: "action subie"}
      - {de: formes, vers: impersonnelle, libelle: "pas d'agent"}
    jules: "Le « il » impersonnel ne représente rien de précis : le sujet réel se cache après le verbe."

  - id: schema
    type: schema
    titre: "Actif, passif, impersonnel"
    svg: "formes-actives-passives-impersonnelle.svg"
    jules: "« Il pleut » n'a pas de sujet réel caché : c'est un verbe **essentiellement** impersonnel, à ne pas confondre avec « il est arrivé »."

  - id: methode
    type: methode
    etapes:
      - "Repérer si le sujet grammatical accomplit l'action (active), la subit (passive), ou si c'est un « il » impersonnel sans référent précis."
      - "Pour l'impersonnelle : chercher le sujet réel après le verbe, souvent sans déterminant défini."
      - "Se demander pourquoi l'auteur choisit cette forme : insister sur l'agent, sur ce qui est subi, ou sur l'événement."
      - "Ne pas confondre un verbe essentiellement impersonnel (pleuvoir, neiger) avec un verbe employé de façon impersonnelle (il est arrivé, il existe)."
    jules: "La forme impersonnelle met l'accent sur l'événement lui-même, plus neutre que la forme personnelle équivalente."

  - id: piege
    type: piege
    mauvaise_idee: "Chercher un sujet réel caché pour un verbe essentiellement impersonnel comme « pleuvoir »."
    pourquoi_faux: "« Il pleut » n'a pas de sujet réel à retrouver : « il » n'y remplace rien, contrairement à « il est arrivé un accident »."
    bonne_idee: "Distinguer les verbes essentiellement impersonnels (toujours avec « il », pas de sujet réel) des verbes employés de façon impersonnelle."
    jules: "Un bon réflexe : essaie de mettre le verbe à la forme personnelle. Si c'est impossible, le verbe est essentiellement impersonnel."

  - id: exemple
    type: exemple
    situation: "Comparer les valeurs de sens de : « Un problème s'est posé. » et « Il s'est posé un problème. »"
    calcul: "La première (forme personnelle) présente « un problème » comme sujet actif de son apparition."
    conclusion: "La seconde (forme **impersonnelle**) insiste sur le fait même qu'un problème existe, de façon plus neutre et formelle."
    jules: "Même sens de base, effet différent : l'impersonnelle efface l'agent au profit de l'événement."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à transformer des phrases actives en passives : repère toujours d'abord le COD."
