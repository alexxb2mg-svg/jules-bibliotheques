<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-blue"><rect x="10" y="30" width="200" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="52" text-anchor="middle" dominant-baseline="central">Discours direct</text>
<text class="ts" x="110" y="72" text-anchor="middle" dominant-baseline="central">« Je viendrai. »</text>
<text class="ts" x="110" y="90" text-anchor="middle" dominant-baseline="central">guillemets, verbe</text></g>
<line x1="210" y1="70" x2="240" y2="70" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="240" y="30" width="200" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Discours indirect</text>
<text class="ts" x="340" y="72" text-anchor="middle" dominant-baseline="central">qu'elle viendrait</text>
<text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">verbe, sans guillemets</text></g>
<line x1="440" y1="70" x2="470" y2="70" class="arr" marker-end="url(#arrow)"/>
<g class="node c-coral"><rect x="470" y="30" width="200" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="52" text-anchor="middle" dominant-baseline="central">Indirect libre</text>
<text class="ts" x="570" y="72" text-anchor="middle" dominant-baseline="central">elle viendrait</text>
<text class="ts" x="570" y="90" text-anchor="middle" dominant-baseline="central">ni verbe, ni guillemets</text></g>
<g class="node c-gray"><rect x="40" y="170" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="189" text-anchor="middle" dominant-baseline="central">Moins de marques visibles</text>
<text class="ts" x="340" y="207" text-anchor="middle" dominant-baseline="central">plus il faut deviner le narrateur</text></g>
</svg>
