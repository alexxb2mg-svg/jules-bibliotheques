notion: attribut-du-cod
titre: "L'attribut du COD"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_5"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Attribut (grammaire) »"
    url: "https://fr.wikipedia.org/w/index.php?title=Attribut_%28grammaire%29&oldid=234393499"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
blocs:
  - id: formule
    type: formule
    expression: "On a élu Julie déléguée."
    termes:
      Julie: {couleur: bleu, legende: "le COD : on a élu qui ? Julie"}
      déléguée: {couleur: rouge, legende: "l'attribut du COD : Julie EST déléguée grâce à l'élection"}
    jules: "Le test : si on peut dire « Julie est déléguée », c'est un **attribut du COD**, pas un simple complément."

  - id: carte
    type: carte
    noeuds:
      - {id: attribut, titre: "Attribut du COD", sous_titre: "après un verbe de jugement", principal: true}
      - {id: verbes, titre: "Verbes attributifs", sous_titre: "nommer, élire, trouver"}
      - {id: epithete, titre: "Épithète du COD", sous_titre: "qualifie directement"}
      - {id: secondcod, titre: "Second COD", sous_titre: "deux compléments distincts"}
    liens:
      - {de: attribut, vers: verbes, libelle: "introduit par"}
      - {de: attribut, vers: epithete, libelle: "à ne pas confondre"}
      - {de: attribut, vers: secondcod, libelle: "à ne pas confondre"}
    jules: "Épithète et second COD n'acceptent pas le test du verbe **être** : c'est ce qui les distingue de l'attribut."

  - id: schema
    type: schema
    titre: "Le test de l'attribut du COD"
    svg: "attribut-du-cod.svg"
    jules: "Insérer « être » entre le COD et l'élément suivant : si la phrase reste correcte, c'est un attribut du COD."

  - id: methode
    type: methode
    etapes:
      - "Repérer le verbe et son COD (qui/qu'est-ce que + verbe ?)."
      - "Chercher un second élément qui donne une qualité, un nom ou un rôle à ce COD."
      - "Vérifier qu'on peut intercaler « être » entre le COD et cet élément (Julie est déléguée)."
      - "Vérifier que le verbe appartient bien à la liste des verbes attributifs (jugement, élection, dénomination)."
      - "Distinguer d'un second COD : deux compléments d'objet ne peuvent pas se remplacer par « être »."
    jules: "L'étape du test avec « être » règle presque tous les cas : fais-en un réflexe systématique."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre l'attribut du COD avec une épithète du COD dans « Il achète une voiture rouge »."
    pourquoi_faux: "Il n'y a pas de verbe de jugement : « rouge » qualifie directement « voiture », sans passer par un verbe attributif."
    bonne_idee: "Vérifier d'abord que le verbe est un verbe de jugement, d'élection ou de dénomination avant de chercher un attribut du COD."
    jules: "Sans un verbe comme nommer, élire ou trouver, il ne peut pas y avoir d'attribut du COD, seulement une épithète."

  - id: exemple
    type: exemple
    situation: "Les élèves jugent ce contrôle difficile."
    calcul: "COD : ce contrôle (les élèves jugent quoi ? ce contrôle). On teste : « ce contrôle est difficile » fonctionne."
    conclusion: "Attribut du COD : **difficile**, accordé au masculin singulier avec « contrôle »."
    jules: "L'accord de l'attribut suit toujours le COD, jamais le sujet : ici, contrôle, pas élèves."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "verbes attributifs du COD"}
    jules: "Mémorise la liste des verbes attributifs : nommer, élire, choisir, déclarer, rendre, trouver, juger, appeler."
