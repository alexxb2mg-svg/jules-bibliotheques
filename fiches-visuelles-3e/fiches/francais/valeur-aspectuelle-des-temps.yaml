notion: valeur-aspectuelle-des-temps
titre: "L'aspect des temps : accompli, borné"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_7"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Wikipédia, « Aspect grammatical »", url: "https://fr.wikipedia.org/w/index.php?title=Aspect_grammatical&oldid=204682291", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_7", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: aspect, titre: "Aspect du verbe", sous_titre: "comment l'action se déroule", principal: true}
      - {id: accompli, titre: "Accompli ou non", sous_titre: "temps composé ou simple"}
      - {id: borne, titre: "Borné ou non borné", sous_titre: "limites nettes ou pas"}
      - {id: plan, titre: "Premier plan, arrière-plan", sous_titre: "emploi dans un récit"}
    liens:
      - {de: aspect, vers: accompli, libelle: "premier axe"}
      - {de: aspect, vers: borne, libelle: "second axe"}
      - {de: borne, vers: plan, libelle: "explique l'emploi"}
    jules: "L'aspect n'est pas le temps : deux verbes au passé peuvent avoir un aspect différent, comme « il pleuvait » et « il tomba »."

  - id: methode
    type: methode
    etapes:
      - "Identifier le temps employé dans la phrase à analyser."
      - "Se demander si l'action est **accomplie** (terminée) ou **non accomplie** (en cours, globale)."
      - "Se demander si l'action a des limites temporelles nettes (**bornée**) ou dure sans limite précise (**non bornée**)."
      - "Dans un récit, distinguer les phrases de premier plan (événements) de celles d'arrière-plan (décor, situation)."
    jules: "Une habitude ou une description se met presque toujours à l'imparfait, aspect non borné."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que le passé composé et le passé simple ont exactement le même emploi."
    pourquoi_faux: "Le **passé composé** garde un lien avec le présent ; le **passé simple** coupe totalement l'action du présent, comme un fait clos du récit."
    bonne_idee: "Utiliser le passé composé pour un fait qui a des conséquences aujourd'hui, et le passé simple dans un récit écrit, pour les événements qui font avancer l'histoire."
    jules: "Ne pas justifier son choix par l'aspect est l'erreur la plus fréquente en analyse de texte : dis toujours pourquoi le temps convient."

  - id: exemple
    type: exemple
    situation: "« Il pleuvait depuis le matin. Soudain, la foudre tomba sur le vieux chêne. »"
    calcul: "« pleuvait » (imparfait) : aspect **non borné**, décrit une situation qui dure en arrière-plan. « tomba » (passé simple) : aspect **borné**, événement ponctuel au premier plan."
    conclusion: "L'imparfait installe le décor, le passé simple fait progresser le récit."
    jules: "Repère le verbe qui ferait un bon titre de chapitre : c'est presque toujours celui du premier plan."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "identifier premier plan et arrière-plan", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "imparfait vs passé simple"}
    jules: "Entraîne-toi sur des récits courts : repère d'abord les verbes, puis classe-les avant de justifier."

  - id: schema
    type: schema
    titre: "Premier plan, arrière-plan"
    svg: "valeur-aspectuelle-des-temps.svg"
    jules: "L'imparfait plante le décor (non borné), le passé simple fait avancer l'histoire (borné)."
