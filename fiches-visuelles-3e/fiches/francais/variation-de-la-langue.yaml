relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_8", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: variation, titre: "La langue varie", sous_titre: "selon 3 axes", principal: true}
      - {id: temps, titre: "Dans le temps", sous_titre: "sens, néologie"}
      - {id: lieu, titre: "Dans l'espace", sous_titre: "régionalismes"}
      - {id: contexte, titre: "Selon le contexte", sous_titre: "registres"}
    liens:
      - {de: variation, vers: temps, libelle: "sens qui change"}
      - {de: variation, vers: lieu, libelle: "mots régionaux"}
      - {de: variation, vers: contexte, libelle: "registres différents"}
    jules: "Un même mot peut être **correct** dans un registre et déplacé dans un autre : ce n'est pas une faute, c'est une variation."

  - id: schema
    type: schema
    titre: "Les trois axes de variation"
    svg: "variation-de-la-langue.svg"
    jules: "La **néologie** crée des mots nouveaux par dérivation, composition ou emprunt : trois façons différentes d'obtenir le même résultat."

  - id: methode
    type: methode
    etapes:
      - "Identifier si la variation observée est due à l'époque, au lieu ou au contexte de communication."
      - "Pour un mot nouveau : chercher s'il vient d'une dérivation, d'une composition ou d'un emprunt à une langue étrangère."
      - "Pour un mot ancien : comparer son sens d'origine et son sens actuel."
      - "Adapter son propre registre de langue à la situation de communication (destinataire, écrit ou oral)."
    jules: "Le brevet demande surtout de reconnaître le type de variation, pas de le juger : un régionalisme n'est pas une erreur."

  - id: piege
    type: piege
    mauvaise_idee: "Employer un registre familier dans un écrit formel comme une lettre ou une rédaction scolaire."
    pourquoi_faux: "Le registre doit s'adapter à la situation de communication : un écrit formel exige un registre soutenu ou courant, jamais familier."
    bonne_idee: "Repérer le destinataire et le type d'écrit avant de choisir son vocabulaire, puis éviter abréviations et tournures orales."
    jules: "Cette confusion coûte des points à l'écrit : « ça va être trop bien » n'a pas sa place dans une copie de brevet."

  - id: exemple
    type: exemple
    situation: "Le mot « ordinateur » a été créé en 1955 pour traduire l'anglais « computer ». De quel type de variation s'agit-il ?"
    calcul: "Le mot n'a pas été emprunté tel quel à l'anglais : il a été formé en français à partir du verbe latin « ordinare »."
    conclusion: "C'est un **néologisme** : une création lexicale liée à l'apparition d'une technologie nouvelle."
    jules: "Un emprunt garde la forme de la langue d'origine (« week-end ») ; un néologisme comme « ordinateur » est fabriqué avec des racines françaises."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à distinguer emprunt et néologisme : c'est la confusion la plus fréquente sur cette notion."
