notion: strategies-de-lecture
titre: "Stratégies de lecture, interprétation"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_3"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Lecture attentive »"
    url: "https://fr.wikipedia.org/w/index.php?title=Lecture_attentive&oldid=234757213"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Fiche de lecture »"
    url: "https://fr.wikipedia.org/w/index.php?title=Fiche_de_lecture&oldid=236874457"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_3", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
abreviations:
  inf.: "inférence"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: strategies, titre: "Stratégies actives", sous_titre: "relire, reformuler, deviner", principal: true}
      - {id: interpretation, titre: "Interprétation", sous_titre: "au-delà du sens littéral"}
      - {id: justification, titre: "Justification", sous_titre: "s'appuie sur le texte"}
      - {id: choix, titre: "Choisir un livre", sous_titre: "niveau, goûts, besoins"}
    liens:
      - {de: strategies, vers: interpretation, libelle: "permettent de"}
      - {de: interpretation, vers: justification, libelle: "toujours justifiée par"}
      - {de: strategies, vers: choix, libelle: "aussi pour"}
    jules: "Une interprétation sans passage cité du texte n'en est pas une : c'est juste une idée en l'air."

  - id: methode
    type: methode
    etapes:
      - "Avant de lire : observer le titre, la couverture, le résumé."
      - "Pendant la lecture : deviner un mot inconnu grâce au contexte."
      - "Reformuler avec ses mots ce qu'on vient de lire, paragraphe par paragraphe."
      - "Pour interpréter, toujours montrer la phrase précise qui justifie l'idée."
      - "Relire un passage difficile plusieurs fois plutôt que d'abandonner."
    jules: "Reformuler paragraphe par paragraphe repère tout de suite où la compréhension a décroché."

  - id: piege
    type: piege
    mauvaise_idee: "Donner une interprétation personnelle sans jamais citer le texte pour la justifier."
    pourquoi_faux: "Une **interprétation** doit rester vérifiable dans le texte : elle n'est pas libre."
    bonne_idee: "Toujours pouvoir montrer la phrase ou le mot précis du texte qui appuie l'idée avancée."
    jules: "Au brevet, une réponse juste mais sans citation perd des points : la preuve compte autant que l'idée."

  - id: exemple
    type: exemple
    situation: "Le texte dit : « Elle referma la porte sans un bruit et retint son souffle. »"
    calcul: "Le silence de la porte et le souffle retenu ne sont pas expliqués, mais suggèrent un état."
    conclusion: "On en déduit que le personnage a peur ou veut se cacher : c'est une **inférence**."
    jules: "Une inférence part toujours d'un détail précis du texte, jamais d'une supposition libre."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🔍", titre: "Repérer les indices", description: "gestes, objets, mots choisis par l'auteur"}
      - {icone: "📖", titre: "Choisir son livre", description: "couverture, résumé, premières pages"}
    jules: "Entraîne-toi à citer une phrase exacte avant de donner ton interprétation, à l'écrit comme à l'oral."

  - id: schema
    type: schema
    titre: "De la lecture à l'interprétation"
    svg: "strategies-de-lecture.svg"
    jules: "Chaque flèche part d'un texte lu vers une idée : l'interprétation ne saute jamais cette étape."
