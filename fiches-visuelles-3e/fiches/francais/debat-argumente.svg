<line x1="270" y1="86" x2="150" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="86" x2="340" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="410" y1="86" x2="530" y2="140" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="20" y="140" width="200" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="160" text-anchor="middle" dominant-baseline="central">Participants</text>
<text class="ts" x="120" y="178" text-anchor="middle" dominant-baseline="central">argumentent</text>
<text class="ts" x="120" y="196" text-anchor="middle" dominant-baseline="central">écoutent</text></g>
