<text class="ts" x="120.0" y="164" text-anchor="middle" dominant-baseline="central">beaucoup de, la plupart</text>
</g>
<g class="node c-coral"><rect x="240" y="120" width="200" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="143" text-anchor="middle" dominant-baseline="central">Collectif + pluriel</text>
<text class="ts" x="340.0" y="164" text-anchor="middle" dominant-baseline="central">une foule de spectateurs</text>
</g>
<g class="node c-purple"><rect x="460" y="120" width="200" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="560.0" y="143" text-anchor="middle" dominant-baseline="central">Distributif seul</text>
<text class="ts" x="560.0" y="164" text-anchor="middle" dominant-baseline="central">chacun, aucun, personne</text>
</g>
<line x1="120.0" y1="184" x2="120.0" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="340.0" y1="184" x2="340.0" y2="230" class="arr" marker-end="url(#arrow)"/>
<line x1="560.0" y1="184" x2="560.0" y2="230" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="20" y="230" width="200" height="60" rx="8" stroke-width="0.5"/>
