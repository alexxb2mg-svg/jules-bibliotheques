<text class="ts" x="340.0" y="271" text-anchor="middle" dominant-baseline="central">ensemble:sg, chacun:pl</text>
</g>
<g class="node c-red"><rect x="460" y="230" width="200" height="60" rx="8" stroke-width="0.5"/>
