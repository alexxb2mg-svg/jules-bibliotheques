<text class="ts" x="560.0" y="271" text-anchor="middle" dominant-baseline="central">toujours, même sens vaste</text>
</g>
<g class="node c-gray"><rect x="40" y="320" width="600" height="56" rx="8" stroke-width="0.5"/>
