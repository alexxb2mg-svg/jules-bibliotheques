generation: {par: "hermes-fv-francais_4", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: expose, titre: "Exposé", sous_titre: "présentation orale", principal: true}
      - {id: supports, titre: "Documents supports", sous_titre: "diaporama, notes"}
      - {id: compte-rendu, titre: "Compte rendu", sous_titre: "résume des faits"}
      - {id: avis, titre: "Avis argumenté", sous_titre: "vocabulaire précis"}
    liens:
      - {de: expose, vers: supports, libelle: "s'appuie sur"}
      - {de: expose, vers: compte-rendu, libelle: "peut inclure un"}
      - {de: expose, vers: avis, libelle: "se termine par un"}
    jules: "Les **documents supports** sont une aide-mémoire, jamais un texte à lire mot à mot."

  - id: methode
    type: methode
    etapes:
      - "Préparer un plan clair : introduction, développement en parties, conclusion."
      - "Utiliser les documents supports comme aide-mémoire, sans les lire mot à mot."
      - "Regarder son public, parler assez fort et pas trop vite."
      - "Appuyer chaque avis sur un exemple ou une raison précise, pas une simple impression."
      - "S'entraîner à répondre aux questions du public de façon posée et argumentée."
    jules: "L'étape 4 transforme une opinion vague en **avis argumenté** : toujours dire pourquoi."

  - id: piege
    type: piege
    mauvaise_idee: "Donner un avis vague (« c'était bien ») sans le justifier par des exemples précis."
    pourquoi_faux: "Un avis vague n'apporte aucune information sur ce qui a plu ou déplu, et ne convainc personne."
    bonne_idee: "Préciser pourquoi avec un vocabulaire riche : « captivant », « émouvant », en citant un exemple concret."
    jules: "Remplace toujours « bien » ou « nul » par un mot précis suivi d'une justification."

  - id: exemple
    type: exemple
    situation: "Pendant un exposé sur un livre lu, exprimer un avis personnel argumenté."
    calcul: "Plutôt que « j'ai bien aimé ce livre », préciser pourquoi avec un exemple."
    conclusion: "« J'ai apprécié ce livre parce que le personnage principal évolue de façon convaincante, notamment quand… »"
    jules: "Un avis argumenté nomme toujours un **exemple précis** tiré de l'œuvre, jamais une impression seule."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🎤", titre: "Entraînement oral", description: "oral du brevet"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "vocabulaire précis"}
    jules: "Prépare des réponses possibles aux questions attendues : c'est essentiel pour l'oral du brevet."

  - id: schema
    type: schema
    titre: "Construire son exposé"
    svg: "expose-et-avis-argumente.svg"
    jules: "Le plan structure l'exposé, l'avis argumenté le conclut avec un exemple précis."
