blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: poesie, titre: "Poésie", sous_titre: "forme intense de la langue", principal: true}
      - {id: romantisme, titre: "Romantisme", sous_titre: "XIXe siècle, sentiment"}
      - {id: symbolisme, titre: "Symbolisme", sous_titre: "Baudelaire, Verlaine"}
      - {id: surrealisme, titre: "Surréalisme", sous_titre: "XXe siècle"}
    liens:
      - {de: poesie, vers: romantisme, libelle: "point de départ"}
      - {de: romantisme, vers: symbolisme, libelle: "renouvellement"}
      - {de: symbolisme, vers: surrealisme, libelle: "renouvellement"}
    jules: "Le romantisme n'est pas toute la poésie : c'est un point de départ pour ce programme, suivi d'autres mouvements jusqu'à aujourd'hui."

  - id: methode
    type: methode
    etapes:
      - "Repérer la forme du poème (vers réguliers ou libres, strophes, rimes ou non)."
      - "Identifier le sentiment ou l'état d'âme exprimé (tristesse, nostalgie, émerveillement)."
      - "Observer comment la nature ou le paysage expriment ce sentiment."
      - "Relever les images et figures de style qui rendent la langue plus expressive."
      - "Lire le poème à voix haute pour percevoir son rythme et sa musicalité."
    jules: "L'étape 5 n'est pas un détail : la poésie se comprend aussi avec l'oreille, pas seulement avec les yeux."

  - id: piege
    type: piege
    mauvaise_idee: "Ne parler que du sens du poème sans étudier sa forme."
    pourquoi_faux: "En poésie, le choix des mots (sonorités) et leur agencement (rythme, rimes) comptent autant que ce qu'ils disent."
    bonne_idee: "Toujours associer une observation de forme (rythme, sonorités, figures) à chaque idée sur le sens."
    jules: "Une répétition, une rime ou un rythme lent ne sont jamais un hasard : ils renforcent toujours le sens du poème."

  - id: exemple
    type: exemple
    situation: "Dans « Demain, dès l'aube » de Victor Hugo : « Je marcherai les yeux fixés sur mes pensées, — Sans rien voir au dehors, sans entendre aucun bruit, — Seul, inconnu, le dos courbé, les mains croisées, — Triste, et le jour pour moi sera comme la nuit. »"
    calcul: "Le rythme lent, les répétitions de « sans » et l'accumulation d'adjectifs (« Seul, inconnu... Triste ») traduisent un état de tristesse profonde."
    conclusion: "Le poète romantique exprime une douleur intime à travers la marche solitaire, en accord avec le paysage traversé."
    jules: "Hugo écrit ce poème après la mort de sa fille Léopoldine : le décor extérieur devient le miroir de sa peine."

  - id: piege2
    type: piege
    mauvaise_idee: "Confondre systématiquement le narrateur ou le « je » du poème avec l'auteur réel."
    pourquoi_faux: "Le « je » poétique reflète souvent un vécu de l'auteur, mais reste une voix construite dans le texte, pas une transcription automatique et exacte."
    bonne_idee: "Vérifier, si possible, ce que l'on sait de la vie de l'auteur avant d'affirmer que le poème raconte exactement son vécu."
    jules: "Rester prudent ne veut pas dire tout nier : chez Hugo, on sait que ce poème est bien lié à un deuil réel."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "romantisme, symbolisme, surréalisme, lyrisme"}
    jules: "Essaie d'écrire quatre vers sur un sentiment lié à un élément naturel : c'est le meilleur moyen de comprendre le romantisme de l'intérieur."

  - id: schema
    type: schema
    titre: "La poésie, du romantisme à nos jours"
    svg: "poesie-romantisme-a-nos-jours.svg"
    jules: "Les mouvements poétiques changent, mais chacun cherche à intensifier notre présence au monde, souvent à travers la nature."
