<text class="ts" x="340.0" y="158" text-anchor="middle" dominant-baseline="central">= radical du subjonctif</text>
</g>
<line x1="340" y1="176" x2="340" y2="220" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="190" y="220" width="300" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="242" text-anchor="middle" dominant-baseline="central">qu'il aimât</text>
<text class="ts" x="340.0" y="261" text-anchor="middle" dominant-baseline="central">circonflexe (3e sg)</text>
</g>
<line x1="280" y1="280" x2="180" y2="305" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="280" x2="500" y2="305" class="arr" marker-end="url(#arrow)"/>
