<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Former le subjonctif imparfait et plus-que-parfait">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="20" width="300" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="40" text-anchor="middle" dominant-baseline="central">Passé simple, 2e pers.</text>
<text class="ts" x="340.0" y="58" text-anchor="middle" dominant-baseline="central">tu aimas, tu finis...</text>
</g>
<line x1="340" y1="76" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>
