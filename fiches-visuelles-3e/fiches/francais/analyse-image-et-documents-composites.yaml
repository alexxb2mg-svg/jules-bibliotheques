notion: analyse-image-et-documents-composites
titre: "Analyser une image, un document composite"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_3"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Plan (cinéma) »"
    url: "https://fr.wikipedia.org/w/index.php?title=Plan_%28cin%C3%A9ma%29&oldid=232168441"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Cadrage (photographie) »"
    url: "https://fr.wikipedia.org/w/index.php?title=Cadrage_%28photographie%29&oldid=238508538"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_3", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: image, titre: "Image fixe ou mobile", sous_titre: "photo, dessin, film", principal: true}
      - {id: cadrage, titre: "Cadrage", sous_titre: "limites de l'image"}
      - {id: plan, titre: "Plan", sous_titre: "échelle de prise de vue"}
      - {id: pointvue, titre: "Point de vue", sous_titre: "d'où on regarde"}
    liens:
      - {de: image, vers: cadrage, libelle: "se lit par le"}
      - {de: image, vers: plan, libelle: "et par le"}
      - {de: image, vers: pointvue, libelle: "et par le"}
    jules: "Cadrage, plan et point de vue sont trois questions différentes : ne les confonds pas dans une analyse."

  - id: graphe-cadrage
    type: graphe
    gabarit: point-de-vue
    curseurs:
      - {id: curseur-distance, nom: distance, min: 1, max: 5, pas: 1, depart: 5}
      - {id: curseur-hauteur, nom: hauteur, min: -2, max: 2, pas: 1, depart: 0}
    lectures:
      - {si: "distance == 5", texte: "**Plan d'ensemble** : on voit surtout le décor, le personnage est petit ; on situe l'action."}
      - {si: "distance == 1", texte: "**Gros plan** : le visage remplit l'image, on lit les émotions ; tout le reste passe **hors champ**."}
      - {si: "hauteur > 0", texte: "**Plongée** : vue d'en haut, le personnage paraît petit, faible ou écrasé."}
      - {si: "hauteur < 0", texte: "**Contre-plongée** : vue d'en bas, le personnage paraît grand, puissant ou menaçant."}
    jules: "Entre les deux, du plus large au plus serré : plan moyen (en pied), plan américain (à mi-cuisse), plan rapproché (à la poitrine). Pour analyser une image, demande-toi toujours où se trouve l'œil de celui qui l'a faite."

  - id: methode
    type: methode
    etapes:
      - "Identifier ce que montre l'image : personnages, décor, action."
      - "Analyser le **cadrage** : que voit-on, que devine-t-on hors champ ?"
      - "Préciser l'échelle du **plan** (gros plan, plan large) et son effet."
      - "Repérer le **point de vue** adopté : qui regarde, d'où."
      - "Relier texte et image dans un document composite : se complètent-ils ?"
    jules: "Le hors-champ n'est pas un oubli de l'image : c'est souvent un choix pour créer du suspense."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre plan (échelle de prise de vue) et cadrage (limites de l'image)."
    pourquoi_faux: "Le **plan** dit à quelle distance on regarde ; le **cadrage** dit ce qui entre dans l'image."
    bonne_idee: "Se demander séparément : « à quelle distance ? » (plan) et « qu'est-ce qui est coupé ? » (cadrage)."
    jules: "Deux questions, deux réponses : jamais un seul mot pour les deux notions."

  - id: exemple
    type: exemple
    situation: "Une affiche montre en gros plan le visage inquiet d'un enfant, sans montrer ce qu'il regarde."
    conclusion: "Le gros plan concentre l'attention sur l'émotion, et le **hors-champ** crée du suspense en laissant imaginer la menace."
    jules: "Ce qui n'est pas montré fait souvent plus travailler l'imagination que ce qui l'est."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🎬", titre: "Vocabulaire du plan", description: "gros plan, plan large, plan moyen"}
      - {icone: "🖼️", titre: "Analyser une affiche", description: "cadrage, plan, texte, implicite"}
    jules: "Entraîne-toi sur une publicité : cadrage, plan, point de vue, puis ce qu'elle laisse deviner."

  - id: schema
    type: schema
    titre: "Trois questions pour une image"
    svg: "analyse-image-et-documents-composites.svg"
    jules: "Ces trois questions se posent dans n'importe quel ordre, mais aucune ne doit être oubliée."
