blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: paroles, titre: "Rapporter des paroles", sous_titre: "trois façons", principal: true}
      - {id: direct, titre: "Discours direct", sous_titre: "guillemets"}
      - {id: indirect, titre: "Discours indirect", sous_titre: "subordonnée"}
      - {id: libre, titre: "Indirect libre", sous_titre: "sans marque"}
