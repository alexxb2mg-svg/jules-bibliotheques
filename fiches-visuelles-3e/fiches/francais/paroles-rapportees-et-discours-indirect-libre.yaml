      - {de: paroles, vers: direct, libelle: "parole exacte"}
      - {de: paroles, vers: indirect, libelle: "parole intégrée"}
      - {de: paroles, vers: libre, libelle: "voix mêlée"}
    jules: "Le discours indirect libre garde le **ton** du personnage sans guillemets ni verbe introducteur : c'est le plus dur à repérer."

  - id: schema
    type: schema
    titre: "Trois façons de rapporter"
    svg: "paroles-rapportees-et-discours-indirect-libre.svg"
    jules: "Repère d'abord les guillemets et le verbe introducteur : leur absence oriente vers l'indirect ou l'indirect libre."

  - id: methode
    type: methode
    etapes:
      - "Repérer les guillemets et le verbe introducteur pour identifier le discours direct."
      - "Pour passer au discours indirect : supprimer les guillemets, ajouter une conjonction, transformer pronoms, temps et indicateurs de temps ou lieu."
      - "Pour repérer un discours indirect libre : chercher des phrases sans guillemets ni verbe introducteur, mais avec des marques de l'oral insérées dans la narration."
      - "Se demander à qui appartient vraiment la pensée exprimée : au narrateur ou au personnage."
    jules: "Les pronoms et les temps changent toujours au discours indirect : « je pars » devient « il partait » après un verbe au passé."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre le discours indirect libre avec le simple discours indirect."
    pourquoi_faux: "Le discours indirect libre garde le ton et le vocabulaire du personnage, sans subordination ni verbe introducteur, contrairement à l'indirect classique."
    bonne_idee: "Vérifier l'absence de guillemets ET de verbe introducteur, avec des marques de l'oral (exclamations, questions) insérées dans le récit."
    jules: "Sans guillemets ni « que », mais avec les pronoms et temps de l'indirect : c'est la signature du discours indirect libre."

  - id: exemple
    type: exemple
    situation: "Transformer au discours indirect : Il déclara : « Je pars demain matin. »"
    calcul: "je → il ; pars (présent) → partait (imparfait, car la principale est au passé) ; demain → le lendemain."
    conclusion: "Il déclara qu'**il partait** le lendemain matin."
    jules: "Trois transformations à ne pas oublier : le pronom, le temps du verbe, et l'indicateur de temps."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à repérer le discours indirect libre dans un texte narratif : il n'a ni guillemets ni verbe introducteur."
