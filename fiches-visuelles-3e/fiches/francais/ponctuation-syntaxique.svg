<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="90" y="20" width="500" height="50" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="45" text-anchor="middle" dominant-baseline="central">Sépare-t-il, ou relie-t-il deux phrases ?</text></g>
<line x1="240" y1="70" x2="150" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="440" y1="70" x2="530" y2="110" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="20" y="110" width="260" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="150" y="130" text-anchor="middle" dominant-baseline="central">Sépare : virgule</text>
<text class="ts" x="150" y="150" text-anchor="middle" dominant-baseline="central">énumération, apposition</text>
<text class="ts" x="150" y="166" text-anchor="middle" dominant-baseline="central">complément déplacé</text></g>
<g class="node c-coral"><rect x="400" y="110" width="260" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="130" text-anchor="middle" dominant-baseline="central">Relie : deux-points</text>
<text class="ts" x="530" y="150" text-anchor="middle" dominant-baseline="central">ou point-virgule</text>
<text class="ts" x="530" y="166" text-anchor="middle" dominant-baseline="central">explication ou lien de sens</text></g>
<g class="node c-green"><rect x="140" y="220" width="400" height="50" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="245" text-anchor="middle" dominant-baseline="central">Jamais entre sujet et verbe</text>
</g>
</svg>
