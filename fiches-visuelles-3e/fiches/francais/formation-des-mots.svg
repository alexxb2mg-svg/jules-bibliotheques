<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="20" width="300" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Un mot de base</text>
<text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">verbe ou adjectif</text></g>
<line x1="280" y1="70" x2="170" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="70" x2="510" y2="110" class="arr" marker-end="url(#arrow)"/>
<g class="node c-blue"><rect x="60" y="110" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="129" text-anchor="middle" dominant-baseline="central">déménager</text>
<text class="ts" x="170" y="147" text-anchor="middle" dominant-baseline="central">verbe</text></g>
<g class="node c-purple"><rect x="400" y="110" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="129" text-anchor="middle" dominant-baseline="central">beau</text>
<text class="ts" x="510" y="147" text-anchor="middle" dominant-baseline="central">adjectif</text></g>
<line x1="170" y1="166" x2="170" y2="200" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="166" x2="510" y2="200" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="60" y="210" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="229" text-anchor="middle" dominant-baseline="central">déménagement</text>
<text class="ts" x="170" y="247" text-anchor="middle" dominant-baseline="central">nom (+ -ment)</text></g>
<g class="node c-green"><rect x="400" y="210" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="229" text-anchor="middle" dominant-baseline="central">beauté</text>
<text class="ts" x="510" y="247" text-anchor="middle" dominant-baseline="central">nom (+ -té)</text></g>
<g class="c-amber"><rect x="90" y="290" width="500" height="56" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="310" text-anchor="middle" dominant-baseline="central">Le suffixe change</text>
<text class="t" x="340" y="330" text-anchor="middle" dominant-baseline="central">souvent la catégorie du mot.</text></g>
</svg>
