notion: debat-argumente
titre: "Débattre, animer, arbitrer"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_4"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Débat »"
    url: "https://fr.wikipedia.org/w/index.php?title=D%C3%A9bat&oldid=237090905"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_4", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: debat, titre: "Débat", sous_titre: "avis divergents", principal: true}
      - {id: participer, titre: "Participer", sous_titre: "argumenter, écouter"}
      - {id: animer, titre: "Animer", sous_titre: "distribuer la parole"}
      - {id: arbitrer, titre: "Arbitrer", sous_titre: "veiller aux règles"}
    liens:
      - {de: debat, vers: participer, libelle: "chacun peut"}
      - {de: debat, vers: animer, libelle: "quelqu'un doit"}
      - {de: debat, vers: arbitrer, libelle: "sans prendre parti"}
    jules: "Animer et **arbitrer** demandent la même neutralité : on ne défend pas sa propre opinion."

  - id: methode
    type: methode
    etapes:
      - "Avant le débat, préparer au moins deux arguments solides pour défendre sa position."
      - "Écouter attentivement les arguments des autres avant de répondre."
      - "Reprendre précisément l'argument de l'autre avant de le discuter (« tu dis que… mais… »)."
      - "Utiliser des modalisateurs pour nuancer son propos plutôt qu'affirmer trop catégoriquement."
      - "Si on anime : distribuer la parole, reformuler, relancer sans imposer son avis."
    jules: "L'étape 3 est la clé d'un vrai **débat** : répondre à l'argument de l'autre, pas juste répéter le sien."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre débattre et se disputer."
    pourquoi_faux: "Le débat repose sur des arguments construits ; la dispute repose sur des attaques personnelles répétées."
    bonne_idee: "Toujours répondre à l'argument avancé, jamais à la personne qui le porte."
    jules: "Un bon réflexe : reformuler l'argument de l'autre avant d'y répondre, ça évite l'attaque personnelle."

  - id: exemple
    type: exemple
    situation: "Dans un débat sur les écrans au collège, un élève dit : « les écrans sont mauvais pour la concentration »."
    calcul: "On reprend son argument avant de le nuancer, sans l'attaquer."
    conclusion: "« Je comprends ton argument, mais les écrans peuvent aussi être utiles pour chercher des informations. »"
    jules: "Reprendre l'argument adverse (« je comprends ton argument, mais… ») montre qu'on l'a vraiment écouté."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🗣️", titre: "Débats en classe", description: "s'entraîner à l'oral"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "formules pour réagir"}
    jules: "Prépare deux arguments opposés sur un sujet simple : ça t'entraîne à voir les deux côtés d'un débat."

  - id: schema
    type: schema
    titre: "Les rôles dans un débat"
    svg: "debat-argumente.svg"
    jules: "Participer, c'est argumenter ; animer ou arbitrer, c'est rester neutre."
