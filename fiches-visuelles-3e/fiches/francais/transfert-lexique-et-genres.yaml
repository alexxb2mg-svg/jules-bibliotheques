notion: transfert-lexique-et-genres
titre: "Réutiliser lectures et genres"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_4"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Genre littéraire »"
    url: "https://fr.wikipedia.org/w/index.php?title=Genre_litt%C3%A9raire&oldid=238084925"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_4", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: lecture, titre: "Texte lu", sous_titre: "vocabulaire, tournures", principal: true}
      - {id: genre, titre: "Genre littéraire", sous_titre: "roman, théâtre, poésie"}
      - {id: outils, titre: "Outils d'analyse", sous_titre: "repérer les procédés"}
      - {id: critique, titre: "Distance critique", sous_titre: "relire son propre texte"}
    liens:
      - {de: lecture, vers: genre, libelle: "caractéristiques"}
      - {de: lecture, vers: outils, libelle: "pour repérer"}
      - {de: outils, vers: critique, libelle: "puis on relit"}
    jules: "Le **genre littéraire** oriente la forme, les **outils d'analyse** aident à repérer ce qui est réutilisable."

  - id: methode
    type: methode
    etapes:
      - "En lisant, noter un mot, une expression ou une tournure qui plaît particulièrement."
      - "Repérer les caractéristiques du genre du texte lu (dialogue, description, rimes…)."
      - "Réutiliser ce vocabulaire ou ces tournures dans sa propre production, sans copier le texte entier."
      - "Relire son texte avec **distance critique**, comme si on le découvrait pour la première fois."
      - "Vérifier que le genre choisi correspond bien à ce qu'on veut exprimer."
    jules: "L'étape 3 est la plus délicate : s'inspirer d'un procédé, jamais recopier les mots eux-mêmes."

  - id: piege
    type: piege
    mauvaise_idee: "Copier une tournure lue sans l'adapter à son propre texte."
    pourquoi_faux: "Une tournure copiée telle quelle ne s'accorde pas avec le reste du texte et ne prouve aucune maîtrise personnelle."
    bonne_idee: "Repérer le procédé (une comparaison, un rythme de phrase) et le réécrire avec ses propres mots et sa propre idée."
    jules: "Le jury ou le professeur reconnaît vite une phrase recopiée : c'est le **procédé** qu'il faut s'approprier, pas la phrase."

  - id: exemple
    type: exemple
    situation: "Un extrait de roman décrit une tempête avec des comparaisons saisissantes (le vent comme une bête furieuse)."
    calcul: "On repère le procédé : comparer un phénomène naturel à un être vivant pour le rendre plus impressionnant."
    conclusion: "On réutilise l'idée avec ses propres images : par exemple comparer la pluie à des flèches, sans reprendre les mots de l'auteur."
    jules: "S'inspirer d'un **procédé** plutôt que d'une phrase précise, c'est la clé pour ne jamais copier."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Fiches de lecture", description: "repérer un genre"}
    jules: "Entraîne-toi à relire un texte de ton cahier avec un regard neuf : c'est ça, la **distance critique**."

  - id: schema
    type: schema
    titre: "Du texte lu au texte écrit"
    svg: "transfert-lexique-et-genres.svg"
    jules: "On adapte ce qu'on a lu avec ses propres mots, puis on se relit comme un lecteur extérieur."
