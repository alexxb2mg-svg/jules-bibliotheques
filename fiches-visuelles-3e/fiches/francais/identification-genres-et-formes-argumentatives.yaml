notion: identification-genres-et-formes-argumentatives
titre: "Genres littéraires et formes argumentatives"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_2"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Genre littéraire »"
    url: "https://fr.wikipedia.org/w/index.php?title=Genre_litt%C3%A9raire&oldid=238084925"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Argumentation »"
    url: "https://fr.wikipedia.org/w/index.php?title=Argumentation&oldid=230491172"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
generation: {par: "hermes-fv-francais_2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: texte, titre: "Un texte à analyser", sous_titre: "genre + visée", principal: true}
      - {id: genre, titre: "Genre littéraire", sous_titre: "poème, roman, théâtre..."}
      - {id: persuader, titre: "Persuader", sous_titre: "émotions du lecteur"}
      - {id: convaincre, titre: "Convaincre", sous_titre: "raison du lecteur"}
    liens:
      - {de: texte, vers: genre, libelle: "quelle forme"}
      - {de: texte, vers: persuader, libelle: "toucher"}
      - {de: texte, vers: convaincre, libelle: "prouver"}
    jules: "Beaucoup de textes mêlent les deux : **persuader** par l'émotion et **convaincre** par des arguments."

  - id: schema
    type: schema
    titre: "Persuader ou convaincre ?"
    svg: "identification-genres-et-formes-argumentatives.svg"
    jules: "Repère les émotions (persuader) et les preuves ou faits (convaincre) dans le même texte."

  - id: methode
    type: methode
    etapes:
      - "Identifier le genre du texte (poème, extrait de roman, scène de théâtre, article...)."
      - "Repérer si l'auteur cherche à démontrer, persuader ou convaincre."
      - "Situer le texte dans son contexte historique (siècle, évènements liés)."
      - "Relever des exemples précis de choix de langue (mots, images, rythme) qui produisent un effet."
      - "Formuler un avis personnel sur l'œuvre, appuyé sur des éléments précis du texte."
    jules: "La dernière étape exige toujours une preuve tirée du texte : jamais un avis sans exemple."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre persuader (émotions) et convaincre (raison)."
    pourquoi_faux: "Un texte pathétique qui émeut ne prouve rien par la logique ; un texte argumenté qui prouve ne joue pas forcément sur l'émotion."
    bonne_idee: "Vérifier si le texte s'appuie sur des **preuves** et des faits (convaincre) ou sur le **ressenti** du lecteur (persuader)."
    jules: "Beaucoup de textes efficaces combinent les deux, comme le conte philosophique."

  - id: exemple
    type: exemple
    situation: "Un auteur du XVIIIe siècle écrit un conte plein d'aventures pour dénoncer, en réalité, l'intolérance religieuse de son époque."
    conclusion: "Il mêle les deux : les péripéties et le comique cherchent à toucher et à divertir (persuader), tandis que la satire des institutions repose sur une critique construite (convaincre)."
    jules: "C'est le principe même du conte philosophique, à connaître pour le brevet."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à justifier le genre, l'époque et la visée d'un texte à partir d'indices précis."
