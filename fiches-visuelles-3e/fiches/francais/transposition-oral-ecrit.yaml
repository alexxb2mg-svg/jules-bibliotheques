notion: transposition-oral-ecrit
titre: "Transposer l'oral et l'écrit"
matiere: francais
niveau: 3e
auteurs: ["hermes-fv-francais_5"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Wikipédia, « Discours indirect »"
    url: "https://fr.wikipedia.org/w/index.php?title=Discours_indirect&oldid=223364273"
    licence: CC-BY-SA-4.0
  - titre: "Wikipédia, « Discours indirect libre »"
    url: "https://fr.wikipedia.org/w/index.php?title=Discours_indirect_libre&oldid=238392526"
    licence: CC-BY-SA-4.0
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: paroles, titre: "Paroles rapportées", sous_titre: "3 façons de les dire", principal: true}
      - {id: direct, titre: "Discours direct", sous_titre: "guillemets, verbe"}
      - {id: indirect, titre: "Discours indirect", sous_titre: "intégré, sans guillemets"}
      - {id: libre, titre: "Indirect libre", sous_titre: "sans verbe ni guillemets"}
    liens:
      - {de: paroles, vers: direct, libelle: "telles quelles"}
      - {de: paroles, vers: indirect, libelle: "reformulées"}
      - {de: paroles, vers: libre, libelle: "fondues au récit"}
    jules: "Le **discours indirect libre** est le plus dur à repérer : rien ne l'annonce, il faut sentir le glissement."

  - id: schema
    type: schema
    titre: "Du direct vers l'indirect libre"
    svg: "transposition-oral-ecrit.svg"
    jules: "Plus on avance vers la droite, moins les marques du discours rapporté sont visibles dans la phrase."

  - id: methode
    type: methode
    etapes:
      - "Identifier si les paroles doivent rester au **discours direct** ou passer au discours indirect."
      - "Pour le discours indirect, adapter les temps verbaux, les pronoms et les indicateurs de temps et de lieu."
      - "Pour reconnaître un discours indirect libre, repérer l'absence de verbe introducteur et de guillemets."
      - "Dans un oral scolaire, éviter les tournures familières et préférer un niveau de langue soutenu."
      - "Vérifier la cohérence des temps et des personnes après une transposition."
    jules: "La concordance des temps est l'étape qui échoue le plus souvent : relis toujours la phrase transposée."

  - id: piege
    type: piege
    mauvaise_idee: "Garder les guillemets dans une phrase transposée au discours indirect."
    pourquoi_faux: "Le **discours indirect** intègre les paroles dans la phrase du narrateur : les guillemets n'ont plus lieu d'être."
    bonne_idee: "Supprimer les guillemets et le verbe introducteur reste seul, suivi d'une subordonnée sans marque typographique."
    jules: "Vois les guillemets comme la trace du discours direct : s'ils restent, la transposition n'est pas terminée."

  - id: exemple
    type: exemple
    situation: "Transposer au discours indirect : Marie a dit : « Je viendrai demain avec mon frère. »"
    calcul: "Le verbe passe du futur au conditionnel présent, « je » devient « elle », « demain » devient « le lendemain »."
    conclusion: "Marie a dit qu'elle **viendrait** le lendemain avec son frère."
    jules: "Trois changements en même temps : le temps du verbe, la personne, et l'indicateur de temps. N'en oublie aucun."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "direct, indirect, libre"}
    jules: "Entraîne-toi à repérer l'indirect libre dans un roman que tu lis : c'est là qu'il se cache le plus."
