blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: these, titre: "Thèse", sous_titre: "idée défendue", principal: true}
      - {id: argument, titre: "Arguments", sous_titre: "raisons qui soutiennent"}
      - {id: exemple, titre: "Exemples", sous_titre: "illustrent chaque argument"}
      - {id: connecteurs, titre: "Connecteurs", sous_titre: "donc, cependant…"}
    liens:
      - {de: these, vers: argument, libelle: "soutenue par"}
      - {de: argument, vers: exemple, libelle: "illustré par"}
      - {de: argument, vers: connecteurs, libelle: "reliés par"}
    jules: "Une **thèse** sans exemple précis ne convainc pas : chaque argument a besoin d'une illustration."

  - id: methode
    type: methode
    etapes:
      - "Formuler clairement la **thèse** défendue en une phrase."
      - "Trouver deux ou trois arguments distincts qui la soutiennent."
      - "Pour chaque argument, choisir un exemple précis qui l'illustre."
      - "Organiser les arguments dans un ordre logique (du plus faible au plus fort)."
      - "Utiliser des connecteurs logiques et des modalisateurs pour nuancer son propos."
    jules: "L'ordre logique (étape 4) donne de la force au texte : on termine sur l'argument le plus convaincant."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre persuader et convaincre."
    pourquoi_faux: "Persuader agit sur les émotions, convaincre s'appuie sur la raison et des preuves : ce ne sont pas les mêmes procédés."
    bonne_idee: "Distinguer les deux visées : un texte argumentatif peut combiner émotion et preuves, mais l'élève doit savoir les nommer."
    jules: "Au brevet, savoir distinguer **persuader** et **convaincre** est souvent demandé explicitement."

  - id: exemple
    type: exemple
    situation: "Défendre l'idée que la lecture est utile pour un collégien, en un paragraphe argumenté."
    calcul: "Idée : la lecture enrichit le vocabulaire. Explication : on rencontre des mots et situations nouvelles."
    conclusion: "Exemple : un élève qui lit régulièrement comprend plus facilement les textes étudiés en classe."
    jules: "Le triptyque idée-explication-exemple est le squelette de tout **paragraphe argumenté**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "connecteurs logiques"}
    jules: "Entraîne-toi à repérer les modalisateurs dans un texte : ils révèlent le degré de certitude de l'auteur."

  - id: schema
    type: schema
    titre: "Bâtir un paragraphe argumenté"
    svg: "structuration-du-texte-argumentatif.svg"
    jules: "Chaque paragraphe développe une seule idée, appuyée par une explication et un exemple."
