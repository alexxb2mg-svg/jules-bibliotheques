notion: guerre-froide-bipolarisation
titre: "La guerre froide : un monde bipolaire"
matiere: histoire
niveau: 3e
auteurs: ["hermes-hist2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-hist2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Guerre froide »", url: "https://fr.vikidia.org/w/index.php?title=Guerre_froide&oldid=2570032", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Décolonisation »", url: "https://fr.vikidia.org/w/index.php?title=D%C3%A9colonisation&oldid=1258479", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
abreviations: {URSS: "Union des républiques socialistes soviétiques", OTAN: "Organisation du traité de l'Atlantique Nord"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: gf, titre: "Guerre froide", sous_titre: "1947-1991", principal: true}
      - {id: ouest, titre: "Bloc de l'Ouest", sous_titre: "États-Unis, OTAN"}
      - {id: est, titre: "Bloc de l'Est", sous_titre: "URSS, pacte de Varsovie"}
      - {id: nonalignes, titre: "Non-alignés", sous_titre: "tiers monde, Bandung 1955"}
    liens:
      - {de: gf, vers: ouest}
      - {de: gf, vers: est}
      - {de: gf, vers: nonalignes}
    jules: "La guerre froide est dite « froide » car les deux superpuissances ne s'affrontent jamais **directement** par les armes."

  - id: schema
    type: schema
    titre: "Un monde coupé en deux blocs"
    svg: "guerre-froide-bipolarisation.svg"
    jules: "Le **rideau de fer** (1946) sépare l'Europe ; le **mur de Berlin** (1961) en devient le symbole le plus connu."

  - id: methode
    type: methode
    etapes:
      - "Retenir les dates encadrant la guerre froide : 1947 (début) et 1989-1991 (fin)."
      - "Nommer les deux camps et leurs modèles opposés : capitalisme (États-Unis) contre communisme (URSS)."
      - "Comprendre que c'est surtout une guerre d'opinion et d'idéologie, sans affrontement militaire direct."
      - "Relier la guerre froide aux indépendances : le tiers monde et les non-alignés contestent la logique des deux blocs."
    jules: "La **bipolarisation** désigne l'organisation du monde autour de deux pôles de puissance rivaux."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que la guerre froide est une guerre avec des combats directs entre États-Unis et URSS."
    pourquoi_faux: "C'est une guerre sans affrontement militaire direct entre les deux superpuissances : elle se joue par les idées, la propagande et des conflits locaux indirects."
    bonne_idee: "Dire que la guerre froide est une confrontation idéologique, culturelle et d'opinion, avec des crises où les deux camps s'opposent indirectement."
    jules: "Ne confonds pas l'**OTAN** (bloc occidental) et le pacte de Varsovie (bloc communiste) : ce sont les deux alliances militaires rivales."

  - id: exemple
    type: exemple
    situation: "Pourquoi dit-on que la guerre froide est une guerre « idéologique » ?"
    calcul: "L'affrontement entre les deux blocs se joue surtout par les idées, la propagande, la culture et l'opinion publique."
    conclusion: "Chaque camp cherche à montrer la supériorité de son modèle économique et politique, sans combat armé direct entre les deux superpuissances."
    jules: "Les **non-alignés** sont les pays qui refusent de choisir entre les deux blocs, réunis à la conférence de Bandung en 1955."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "dates et sigles clés"}
    jules: "Le **rideau de fer** est la frontière qui sépare l'Europe entre bloc occidental et bloc communiste pendant la guerre froide."
