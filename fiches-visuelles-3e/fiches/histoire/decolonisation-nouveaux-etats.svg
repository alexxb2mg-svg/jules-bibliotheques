<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">Deux voies vers l'indépendance</text>

<g class="node c-blue"><rect x="40" y="55" width="600" height="34" rx="8"/></g>
<text class="t" x="340" y="72" text-anchor="middle" dominant-baseline="central">Effondrement des empires coloniaux (1945-1975)</text>

<line x1="200" y1="89" x2="200" y2="115" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="480" y1="89" x2="480" y2="115" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-teal"><rect x="40" y="120" width="320" height="130" rx="10"/></g>
<text class="th" x="200" y="145" text-anchor="middle">Voie négociée</text>
<text class="t" x="200" y="175" text-anchor="middle">Inde et Pakistan, 1947</text>
<text class="ts" x="200" y="198" text-anchor="middle">Accord avec le Royaume-Uni</text>
<text class="ts" x="200" y="218" text-anchor="middle">Passage pacifique à l'indépendance</text>
<text class="ts" x="200" y="238" text-anchor="middle">Ex. : colonies françaises d'Afrique, 1960</text>

<g class="node c-coral"><rect x="360" y="120" width="280" height="130" rx="10"/></g>
<text class="th" x="500" y="145" text-anchor="middle">Voie violente</text>
<text class="t" x="500" y="175" text-anchor="middle">Guerre d'Algérie, 1954-1962</text>
<text class="ts" x="500" y="198" text-anchor="middle">France contre le FLN</text>
<text class="ts" x="500" y="218" text-anchor="middle">Indépendance en 1962</text>
<text class="ts" x="500" y="238" text-anchor="middle">après les accords d'Évian</text>

<g class="c-gray"><rect x="40" y="280" width="600" height="90" rx="8" stroke-width="0.5"/></g>
<text class="t" x="340" y="305" text-anchor="middle" dominant-baseline="central">Causes de la décolonisation</text>
<text class="ts" x="340" y="330" text-anchor="middle">Défaite rapide des puissances coloniales en 1940</text>
<text class="ts" x="340" y="350" text-anchor="middle">Charte de l'Atlantique (1941) et montée des nationalismes</text>
</svg>
