    jules: "La fin de la guerre froide (1989-1991) n'a pas mis fin aux **conflits** dans le monde, mais a changé leur organisation."

  - id: schema
    type: schema
    titre: "Un conflit local, une coopération mondiale"
    svg: "conflits-monde-contemporain.svg"
    jules: "Un conflit local peut avoir des **répercussions internationales** : sanctions économiques, alliances, échanges perturbés."

  - id: methode
    type: methode
    etapes:
      - "Choisir un exemple précis de conflit contemporain (la guerre en Ukraine depuis 2022) et connaître ses grandes dates."
      - "Distinguer les enjeux locaux d'un conflit (territoire, population) de ses répercussions internationales (sanctions, alliances)."
      - "Pour la coopération internationale, choisir l'accord de Paris (2015) et connaître son objectif chiffré."
      - "Identifier les différents acteurs de la coopération internationale : États, ONU, ONG."
    jules: "L'accord de Paris vise à limiter le réchauffement climatique **bien en dessous de 2°C** par rapport à l'époque préindustrielle."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que la fin de la guerre froide a mis fin à tous les conflits dans le monde."
    pourquoi_faux: "Le monde reste marqué par des rivalités et des conflits, avec des enjeux locaux qui peuvent avoir des répercussions internationales."
    bonne_idee: "Dire que la fin de la guerre froide a changé la nature des conflits, sans les faire disparaître, comme le montre la guerre en Ukraine depuis 2022."
    jules: "Ne réduis pas la coopération internationale aux seuls États : les **ONG** et l'**ONU** y participent aussi."

  - id: exemple
    type: exemple
    situation: "Donner la date et l'objectif principal de l'accord de Paris sur le climat."
    calcul: "Adopté le 12 décembre 2015 lors de la COP21."
    conclusion: "Il vise à limiter la hausse de la température moyenne mondiale bien en dessous de 2°C par rapport aux niveaux préindustriels, si possible à 1,5°C."
    jules: "La **COP** est une réunion internationale annuelle sur le climat organisée par l'ONU."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "dates et acteurs clés"}
    jules: "Les **sanctions économiques** sont des mesures prises par des États pour pénaliser un autre État sans recourir à la guerre."
