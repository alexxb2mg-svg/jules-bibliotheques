notion: decolonisation-nouveaux-etats
titre: "La décolonisation et la construction de nouveaux États"
matiere: histoire
niveau: 3e
auteurs: ["hermes-hist2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-hist2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Décolonisation »", url: "https://fr.vikidia.org/w/index.php?title=D%C3%A9colonisation&oldid=1258479", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
abreviations: {FLN: "Front de libération nationale, mouvement indépendantiste algérien"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: decolo, titre: "Décolonisation", sous_titre: "1945-1975", principal: true}
      - {id: causes, titre: "Causes", sous_titre: "défaite de 1940, nationalismes"}
      - {id: negociee, titre: "Voie négociée", sous_titre: "Inde-Pakistan 1947"}
      - {id: violente, titre: "Voie violente", sous_titre: "Algérie 1954-1962"}
    liens:
      - {de: decolo, vers: causes}
      - {de: decolo, vers: negociee}
      - {de: decolo, vers: violente}
    jules: "La décolonisation touche d'abord l'**Asie** (1945-1955), puis l'**Afrique** (1955-1975) : deux vagues successives, pas simultanées."

  - id: schema
    type: schema
    titre: "Deux voies vers l'indépendance"
    svg: "decolonisation-nouveaux-etats.svg"
    jules: "Retiens un exemple de chaque voie : l'**Inde** (négociée, 1947) et l'**Algérie** (violente, 1954-1962)."

  - id: frise
    type: schema
    titre: "Repères chronologiques"
    svg: "decolonisation-nouveaux-etats-frise.svg"
    jules: "La **guerre d'Indochine** (1946-1954) précède la **guerre d'Algérie** (1954-1962) : ne les confonds pas."

  - id: graphe
    type: graphe
    gabarit: courbe-evolution
    curseurs:
      - {id: curseur-jeu, nom: jeu, min: 2, max: 2, pas: 1, depart: 2}
      - {id: curseur-annee, nom: annee, min: 1945, max: 1975, pas: 1, depart: 1945}
    lectures:
      - {si: "annee < 1955", texte: "D'abord l'**Asie** : Inde et Pakistan (1947), Indonésie (1949) ; fin de la guerre d'Indochine en 1954."}
      - {si: "annee >= 1955 && annee < 1970", texte: "Le grand saut : 1960 est l'**année de l'Afrique** (17 pays indépendants) ; l'Algérie devient indépendante en 1962 après 8 ans de guerre."}
      - {si: "annee >= 1970", texte: "De 1945 à 1975, le nombre d'États membres de l'ONU a presque **triplé** : les empires coloniaux se sont effondrés."}
    jules: "Chaque point, c'est le nombre d'États à l'ONU cette année-là. Regarde la marche de 1960 : beaucoup de pays deviennent indépendants en même temps."

  - id: methode
    type: methode
    etapes:
      - "Situer la décolonisation dans le temps : Asie entre 1945 et 1955, Afrique entre 1955 et 1975."
      - "Choisir un exemple précis (l'Algérie ou l'Inde) et connaître ses dates et ses acteurs."
      - "Distinguer décolonisation négociée (accord) et décolonisation violente (guerre)."
      - "Relier la décolonisation à l'affaiblissement des puissances coloniales après 1940."
    jules: "La **Charte de l'Atlantique** (1941) promettait déjà aux peuples le droit de choisir leur gouvernement : un argument que les nationalistes utilisent après 1945."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que toutes les indépendances se font par la guerre."
    pourquoi_faux: "Beaucoup d'indépendances sont négociées pacifiquement, comme celles de l'Inde (1947) ou des colonies françaises d'Afrique subsaharienne (1960)."
    bonne_idee: "Distinguer bien les deux voies : négociée (Inde 1947) ou violente (Algérie 1954-1962), selon les cas."
    jules: "Ne confonds pas non plus la **guerre d'Indochine** (1946-1954) et la **guerre d'Algérie** (1954-1962) : deux conflits distincts."

  - id: exemple
    type: exemple
    situation: "Donner un exemple de décolonisation négociée et un exemple de décolonisation violente."
    calcul: "Négociée : indépendance de l'Inde et du Pakistan en 1947, obtenue par négociation avec le Royaume-Uni. Violente : guerre d'Algérie (1954-1962), opposant la France au FLN."
    conclusion: "L'Algérie devient indépendante en 1962, après les accords d'Évian, à l'issue d'une guerre marquée par des attentats et une répression dure."
    jules: "Le **FLN** est le mouvement indépendantiste algérien qui mène la guerre contre la France de 1954 à 1962."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "dates et acteurs clés"}
    jules: "L'**empire colonial** désigne l'ensemble des territoires colonisés et administrés par une puissance européenne, comme la France ou le Royaume-Uni."
