<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frise chronologique de la Seconde Guerre mondiale">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="30" y1="120" x2="650" y2="120" stroke="#5F5E5A" stroke-width="3" marker-end="url(#arrow)"/>

<g class="c-blue"><circle cx="110" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="110" y="60" text-anchor="middle" dominant-baseline="central">1er septembre 1939</text>
<text class="ts" x="110" y="78" text-anchor="middle" dominant-baseline="central">invasion de la Pologne</text></g>
<line x1="110" y1="88" x2="110" y2="111" class="leader"/>

<g class="c-coral"><circle cx="350" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="350" y="160" text-anchor="middle" dominant-baseline="central">1941-1945</text>
<text class="ts" x="350" y="178" text-anchor="middle" dominant-baseline="central">Shoah et génocide des Tziganes</text>
<text class="ts" x="350" y="194" text-anchor="middle" dominant-baseline="central">extermination de masse</text></g>
<line x1="350" y1="129" x2="350" y2="150" class="leader"/>

<g class="c-teal"><circle cx="620" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="600" y="60" text-anchor="middle" dominant-baseline="central">2 septembre 1945</text>
<text class="ts" x="600" y="78" text-anchor="middle" dominant-baseline="central">capitulation du Japon</text></g>
<line x1="620" y1="88" x2="620" y2="111" class="leader"/>

<g class="c-gray"><rect x="30" y="220" width="620" height="34" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">Frise simplifiée, pas à l'échelle.</text></g>
</svg>
