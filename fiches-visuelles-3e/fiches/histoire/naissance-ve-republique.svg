<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="fleche2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
  </marker>
</defs>

<text class="th" x="340" y="26" text-anchor="middle">De la IVe à la Ve République : un exécutif renforcé</text>

<text class="ts" x="150" y="55" text-anchor="middle">IVe République</text>
<g class="node c-gray"><rect x="40" y="65" width="220" height="55" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/></g>
<text class="t" x="150" y="86" text-anchor="middle" dominant-baseline="central">Parlement dominant</text>
<text class="ts" x="150" y="105" text-anchor="middle" dominant-baseline="central">gouvernements instables</text>

<text class="ts" x="150" y="150" text-anchor="middle">Guerre d'Algérie</text>
<g class="node c-coral"><rect x="40" y="160" width="220" height="55" rx="8" fill="#ffe4e0" stroke="#dc6b5a" stroke-width="1.5"/></g>
<text class="t" x="150" y="181" text-anchor="middle" dominant-baseline="central">Crise de mai 1958</text>
<text class="ts" x="150" y="200" text-anchor="middle" dominant-baseline="central">soulèvement à Alger</text>

<line x1="150" y1="120" x2="150" y2="158" class="leader" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="260" y1="187" x2="330" y2="187" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#fleche2)"/>

<g class="node c-amber"><rect x="335" y="160" width="230" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="t" x="450" y="181" text-anchor="middle" dominant-baseline="central">Retour de De Gaulle</text>
<text class="ts" x="450" y="200" text-anchor="middle" dominant-baseline="central">obtient les pleins pouvoirs</text>

<line x1="450" y1="215" x2="450" y2="253" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#fleche2)"/>

<g class="node c-purple"><rect x="335" y="258" width="230" height="55" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="450" y="276" text-anchor="middle" dominant-baseline="central">Nouvelle Constitution</text>
<text class="ts" x="450" y="295" text-anchor="middle" dominant-baseline="central">référendum, 28 sept. 1958</text>

<line x1="335" y1="285" x2="270" y2="285" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#fleche2)"/>

<g class="node c-teal"><rect x="40" y="258" width="220" height="55" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="t" x="150" y="276" text-anchor="middle" dominant-baseline="central">Ve République</text>
<text class="ts" x="150" y="295" text-anchor="middle" dominant-baseline="central">en vigueur depuis le 4 oct. 1958</text>

<line x1="150" y1="313" x2="150" y2="335" stroke="none"/>

<g class="node c-green"><rect x="180" y="345" width="320" height="45" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/></g>
<text class="t" x="340" y="363" text-anchor="middle" dominant-baseline="central">Exécutif renforcé : président + gouvernement</text>
<text class="ts" x="340" y="380" text-anchor="middle" dominant-baseline="central">élection du président au suffrage universel direct : 1962</text>

<line x1="150" y1="313" x2="250" y2="348" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#fleche2)"/>
</svg>
