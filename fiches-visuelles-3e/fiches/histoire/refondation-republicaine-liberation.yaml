blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: refondation, titre: "Refondation républicaine", sous_titre: "Libération, 1944", principal: true}
      - {id: vote-femmes, titre: "Droit de vote des femmes", sous_titre: "ordonnance du 21/04/1944"}
      - {id: cnr, titre: "Programme du CNR", sous_titre: "préparé dès 1943"}
      - {id: reformes, titre: "Sécu sociale, nationalisations", sous_titre: "1945-1946"}
      - {id: front-populaire, titre: "Front populaire (1936)", sous_titre: "congés payés"}
    liens:
      - {de: refondation, vers: vote-femmes, libelle: "intègre les femmes"}
      - {de: refondation, vers: cnr, libelle: "applique"}
      - {de: cnr, vers: reformes, libelle: "crée"}
      - {de: cnr, vers: front-populaire, libelle: "prolonge"}
    jules: "La refondation, c'est deux choses en même temps : rendre aux Français leurs droits politiques (le vote des femmes) et élargir la démocratie dans un sens social (le programme du CNR)."

  - id: schema
    type: schema
    titre: "De Vichy à la refondation républicaine (1940-1946)"
    svg: "refondation-republicaine-liberation.svg"
    jules: "Le programme du CNR n'invente pas tout : il **prolonge** celui du Front populaire de 1936, mais va plus loin, avec des réformes durables comme la **Sécurité sociale**."

  - id: methode
    type: methode
    etapes:
      - "Situer la Libération en 1944 : elle met fin au régime de Vichy et restaure la légalité républicaine."
      - "Donner la date précise du droit de vote des femmes : ordonnance du **21 avril 1944** ; premier vote en **1945**."
      - "Relier le programme du CNR (1943) au Front populaire (1936) : une continuité dans l'élargissement social de la démocratie."
      - "Citer au moins une réforme concrète du programme du CNR : Sécurité sociale, nationalisations."
    jules: "Attention à l'ordre : le droit est accordé en 1944, mais les femmes ne votent réellement qu'en **1945**, aux premières élections municipales et législatives."

  - id: piege
    type: piege
    mauvaise_idee: "Le droit de vote des femmes suit directement la Révolution française ou le suffrage universel masculin de 1848."
    pourquoi_faux: "Le suffrage universel **masculin** date de 1848 (rétabli en 1851). Les femmes attendent près d'un siècle de plus : le droit ne leur est accordé qu'en **1944**."
    bonne_idee: "Retenir deux dates : 1944, l'ordonnance qui accorde le droit ; 1945, le premier vote réel des femmes en France."
    jules: "Ce long écart montre que l'égalité politique entre hommes et femmes ne va pas de soi : elle est le résultat d'une mobilisation, notamment de féministes comme Louise Weiss."

  - id: exemple
    type: exemple
    situation: "En quelle année les femmes obtiennent-elles le droit de vote en France, et quand votent-elles pour la première fois ?"
    calcul: "L'ordonnance du **21 avril 1944** accorde le droit de vote et d'éligibilité aux femmes."
    conclusion: "Les femmes votent pour la première fois en France en **1945**, un an après l'obtention du droit."
    jules: "Un exercice classique du brevet : ne pas confondre la date du droit (1944) et celle du premier exercice de ce droit (1945)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🕰️", titre: "Frise chronologique", description: "1936, 1944, 1945", outil: "frise-chronologique"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Retiens trois dates dans l'ordre : **1936** (Front populaire), **1943** (programme du CNR), **1944-1945** (refondation, vote des femmes)."
