notion: transformations-societe-francaise
titre: "La société française se transforme (1950-1980)"
matiere: histoire
niveau: 3e
auteurs: ["hermes-hist3"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Vikidia, « Immigration »", url: "https://fr.vikidia.org/w/index.php?title=Immigration&oldid=2185441", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Chômage »", url: "https://fr.vikidia.org/w/index.php?title=Ch%C3%B4mage&oldid=2281796", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
generation: {par: "hermes-hist3", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
abreviations: {IVG: "interruption volontaire de grossesse"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: societe, titre: "Société française", sous_titre: "seconde moitié du XXe s.", principal: true}
      - {id: femmes, titre: "Place des femmes", sous_titre: "emploi, droits (1975)"}
      - {id: immigration, titre: "Immigration", sous_titre: "besoins de main-d'œuvre"}
      - {id: jeunesse, titre: "Jeunesse", sous_titre: "mai 1968"}
      - {id: chomage, titre: "Chômage", sous_titre: "depuis les années 1970"}
      - {id: vieillissement, titre: "Vieillissement", sous_titre: "espérance de vie"}
    liens:
      - {de: societe, vers: femmes, libelle: "évolution"}
      - {de: societe, vers: immigration, libelle: "développement"}
      - {de: societe, vers: jeunesse, libelle: "aspirations"}
      - {de: societe, vers: chomage, libelle: "montée"}
      - {de: societe, vers: vieillissement, libelle: "évolution"}
    jules: "Cinq transformations à connaître par cœur : place des **femmes**, **immigration**, **jeunesse**, **chômage**, vieillissement. Pour chacune, donne un repère précis à l'exercice."

  - id: schema
    type: schema
    titre: "Repères chronologiques des transformations (1936-1975)"
    svg: "transformations-societe-francaise.svg"
    jules: "Ne confonds pas les **Trente Glorieuses** (1945-1975, croissance et quasi plein emploi) avec la période qui suit, marquée par la montée du **chômage** à partir du milieu des années 1970."

  - id: graphe
    type: graphe
    gabarit: courbe-evolution
    curseurs:
      - {id: curseur-jeu, nom: jeu, min: 3, max: 5, pas: 1, depart: 3}
      - {id: curseur-annee, nom: annee, min: 1950, max: 1990, pas: 1, depart: 1970}
    lectures:
      - {si: "jeu == 3 && annee < 1975", texte: "Pendant les **Trente Glorieuses**, le chômage est très faible : environ 2 actifs sur 100."}
      - {si: "jeu == 3 && annee >= 1975", texte: "Après le choc pétrolier de 1973, le **chômage de masse** s'installe : environ 9 actifs sur 100 au milieu des années 1980."}
      - {si: "jeu == 4 && annee >= 1965", texte: "Les femmes travaillent de plus en plus ; la loi suit : travail sans l'accord du mari (1965), contraception (1967), **loi Veil** sur l'IVG (1975)."}
      - {si: "jeu == 5", texte: "La part des 65 ans ou plus augmente : la population **vieillit**, car on vit plus longtemps."}
    jules: "Choisis d'abord l'indicateur avec jeu (3 chômage, 4 femmes, 5 personnes âgées), puis avance l'année pour voir la société française changer."

  - id: methode
    type: methode
    etapes:
      - "Distinguer les grandes transformations à connaître : place des femmes, immigration, jeunesse, vieillissement, chômage."
      - "Pour chaque transformation, donner un repère chronologique ou un exemple concret (loi, événement)."
      - "Relier ces transformations à des évolutions législatives (par exemple les droits des femmes)."
      - "Montrer le lien entre ces évolutions sociales et le débat politique et citoyen en France."
    jules: "Un développement construit réussi choisit **deux transformations précises** plutôt que d'énumérer les cinq sans exemple : mieux vaut un exemple daté qu'une liste vague."

  - id: piege
    type: piege
    mauvaise_idee: "Réduire les transformations de la société française à un seul thème, par exemple seulement l'immigration."
    pourquoi_faux: "Le programme attend au moins **cinq transformations** distinctes : la place des femmes, l'immigration, la jeunesse, le vieillissement et le chômage. En oublier plusieurs, c'est répondre de façon incomplète."
    bonne_idee: "Toujours citer plusieurs transformations et donner, pour chacune, un repère précis (une loi, une date, un événement)."
    jules: "Autre confusion fréquente : croire que le chômage augmente pendant les Trente Glorieuses. C'est l'inverse : cette période (1945-1975) est celle du **plein emploi**."

  - id: exemple
    type: exemple
    situation: "Donne un exemple d'évolution législative liée à la place des femmes dans la société française après 1945."
    calcul: "La loi Veil légalise l'**IVG** (interruption volontaire de grossesse) en **1975**."
    conclusion: "Cette loi illustre l'évolution des droits des femmes après la Seconde Guerre mondiale, au-delà du seul droit de vote obtenu en 1944."
    jules: "Un bon exemple associe toujours une transformation sociale à une **date précise** et, si possible, à une loi : c'est ce qui fait la différence entre une réponse vague et une réponse solide."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🕰️", titre: "Frise chronologique", description: "1936, 1968, 1975", outil: "frise-chronologique"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Retiens un exemple précis par thème : femmes → loi Veil (**1975**) ; chômage → fin des Trente Glorieuses (milieu des **années 1970**) ; jeunesse → **mai 1968**."
