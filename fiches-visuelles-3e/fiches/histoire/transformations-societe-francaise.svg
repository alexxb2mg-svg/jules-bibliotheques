<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Repères chronologiques (1936-1975)</text>

<line x1="50" y1="60" x2="630" y2="60" stroke="#374151" stroke-width="2"/>
<circle cx="80" cy="60" r="5" fill="#6b7280"/>
<circle cx="220" cy="60" r="5" fill="#6b7280"/>
<circle cx="330" cy="60" r="5" fill="#6b7280"/>
<circle cx="470" cy="60" r="5" fill="#6b7280"/>
<circle cx="600" cy="60" r="5" fill="#6b7280"/>

<text class="ts" x="80" y="45" text-anchor="middle">1936</text>
<text class="ts" x="220" y="45" text-anchor="middle">1944</text>
<text class="ts" x="330" y="45" text-anchor="middle">1968</text>
<text class="ts" x="470" y="45" text-anchor="middle">1975</text>
<text class="ts" x="600" y="45" text-anchor="middle">1975+</text>

<line x1="80" y1="65" x2="80" y2="95" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>
<g class="node c-amber"><rect x="20" y="100" width="118" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="t" x="79" y="118" text-anchor="middle" dominant-baseline="central">Front populaire</text>
<text class="ts" x="79" y="136" text-anchor="middle" dominant-baseline="central">congés payés</text>

<line x1="220" y1="65" x2="220" y2="95" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>
<g class="node c-purple"><rect x="161" y="100" width="118" height="55" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="220" y="118" text-anchor="middle" dominant-baseline="central">Droit de vote</text>
<text class="ts" x="220" y="136" text-anchor="middle" dominant-baseline="central">des femmes</text>

<line x1="330" y1="65" x2="330" y2="95" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>
<g class="node c-blue"><rect x="271" y="100" width="118" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="t" x="330" y="118" text-anchor="middle" dominant-baseline="central">Mai 1968</text>
<text class="ts" x="330" y="136" text-anchor="middle" dominant-baseline="central">jeunesse</text>

<line x1="470" y1="65" x2="470" y2="95" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>
<g class="node c-pink"><rect x="411" y="100" width="118" height="55" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/></g>
<text class="t" x="470" y="118" text-anchor="middle" dominant-baseline="central">Loi Veil</text>
<text class="ts" x="470" y="136" text-anchor="middle" dominant-baseline="central">IVG légalisée</text>

<line x1="600" y1="65" x2="600" y2="95" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3"/>
<g class="node c-coral"><rect x="541" y="100" width="118" height="55" rx="8" fill="#ffe4e0" stroke="#dc6b5a" stroke-width="1.5"/></g>
<text class="t" x="600" y="118" text-anchor="middle" dominant-baseline="central">Fin des Trente</text>
<text class="ts" x="600" y="136" text-anchor="middle" dominant-baseline="central">Glorieuses, chômage</text>

<g class="c-gray"><rect x="30" y="185" width="620" height="55" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="0.5"/></g>
<text class="t" x="340" y="203" text-anchor="middle" dominant-baseline="central">Trente Glorieuses (1945-1975) : forte croissance, quasi plein emploi</text>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">immigration liée aux besoins de main-d'œuvre ; vieillissement progressif</text>

<g class="node c-teal"><rect x="120" y="260" width="440" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="t" x="340" y="283" text-anchor="middle" dominant-baseline="central">Après 1975 : montée du chômage,</text>
<text class="t" x="340" y="303" text-anchor="middle" dominant-baseline="central">nouveaux enjeux de citoyenneté</text>
<text class="ts" x="340" y="318" text-anchor="middle" dominant-baseline="central">échelle non respectée</text>
</svg>
