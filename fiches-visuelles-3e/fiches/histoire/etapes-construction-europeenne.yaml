notion: etapes-construction-europeenne
titre: "Les étapes de la construction européenne"
matiere: histoire
niveau: 3e
auteurs: ["hermes-hist2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-hist2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Union européenne »", url: "https://fr.vikidia.org/w/index.php?title=Union_europ%C3%A9enne&oldid=2556631", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
abreviations: {CECA: "Communauté européenne du charbon et de l'acier", CEE: "Communauté économique européenne", UE: "Union européenne"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: europe, titre: "Construction européenne", sous_titre: "depuis 1951", principal: true}
      - {id: ceca, titre: "CECA", sous_titre: "1951, charbon et acier"}
      - {id: cee, titre: "CEE", sous_titre: "1957, marché commun"}
      - {id: ue, titre: "UE", sous_titre: "1992, Maastricht"}
    liens:
      - {de: europe, vers: ceca}
      - {de: ceca, vers: cee}
      - {de: cee, vers: ue}
    jules: "Ne confonds pas **CEE** (1957) et **UE** (1992) : deux étapes successives, pas la même chose."

  - id: schema
    type: schema
    titre: "Trois étapes-clés de 1951 à 1992"
    svg: "etapes-construction-europeenne.svg"
    jules: "La construction européenne part d'une coopération **économique** (charbon, acier) avant de s'élargir à d'autres domaines."

  - id: methode
    type: methode
    etapes:
      - "Retenir trois dates-étapes : 1951 (CECA), 1957 (traités de Rome, CEE), 1992 (traité de Maastricht, UE)."
      - "Montrer que la construction européenne part d'une coopération économique avant de s'élargir à d'autres domaines."
      - "Relier la création de l'Europe à l'objectif de paix après la Seconde Guerre mondiale."
      - "Ne pas confondre CEE (1957) et Union européenne (1992), deux étapes successives."
    jules: "Depuis 2002, une monnaie unique, l'**euro**, circule dans une partie des États membres, pas dans tous."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que tous les pays de l'UE utilisent l'euro."
    pourquoi_faux: "Seule une partie des membres de l'Union européenne a adopté l'euro comme monnaie."
    bonne_idee: "Dire que l'euro circule depuis 2002 dans une partie seulement des États membres de l'UE."
    jules: "Le **Brexit** (2020) est une sortie de l'UE, pas une adhésion : le Royaume-Uni a quitté l'Union après un référendum organisé en 2016."

  - id: exemple
    type: exemple
    situation: "Citer les trois grandes étapes de la construction européenne avec leurs dates."
    calcul: "1951 : création de la CECA (charbon et acier, six pays fondateurs). 1957 : traités de Rome, création de la CEE (marché commun). 1992 : traité de Maastricht, création de l'Union européenne."
    conclusion: "L'Union s'est élargie progressivement, passant de 6 à 27 États membres après le retrait du Royaume-Uni en 2020."
    jules: "Mettre en commun le charbon et l'acier entre la **France** et l'**Allemagne** rendait une nouvelle guerre entre ces pays plus difficile."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "dates et sigles clés"}
    jules: "L'Union européenne a reçu le **prix Nobel de la paix** en 2012, pour ses soixante années de contribution à la paix et à la démocratie en Europe."
