<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
  </marker>
</defs>

<text class="th" x="340" y="26" text-anchor="middle">De Vichy à la refondation républicaine</text>

<g class="node c-gray"><rect x="30" y="55" width="180" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/></g>
<text class="t" x="120" y="75" text-anchor="middle" dominant-baseline="central">Régime de Vichy</text>
<text class="ts" x="120" y="95" text-anchor="middle" dominant-baseline="central">1940-1944</text>

<line x1="210" y1="80" x2="255" y2="80" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#fleche)"/>

<g class="node c-blue"><rect x="260" y="55" width="200" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="t" x="360" y="75" text-anchor="middle" dominant-baseline="central">Libération : refondation</text>
<text class="ts" x="360" y="95" text-anchor="middle" dominant-baseline="central">1944</text>

<line x1="465" y1="80" x2="510" y2="80" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#fleche)"/>

<g class="node c-teal"><rect x="515" y="55" width="140" height="50" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="t" x="585" y="75" text-anchor="middle" dominant-baseline="central">Ve République</text>
<text class="ts" x="585" y="95" text-anchor="middle" dominant-baseline="central">notion suivante</text>

<line x1="360" y1="105" x2="270" y2="165" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#fleche)"/>
<line x1="360" y1="105" x2="450" y2="165" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#fleche)"/>

<g class="node c-purple"><rect x="120" y="170" width="220" height="55" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="230" y="188" text-anchor="middle" dominant-baseline="central">Droit de vote des femmes</text>
<text class="ts" x="230" y="207" text-anchor="middle" dominant-baseline="central">ordonnance du 21 avril 1944</text>

<g class="node c-amber"><rect x="360" y="170" width="220" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="t" x="470" y="188" text-anchor="middle" dominant-baseline="central">Programme du CNR</text>
<text class="ts" x="470" y="207" text-anchor="middle" dominant-baseline="central">préparé dès 1943</text>

<line x1="230" y1="225" x2="230" y2="270" class="leader" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="470" y1="225" x2="470" y2="270" class="arr" stroke="#374151" stroke-width="2" marker-end="url(#fleche)"/>

<g class="node c-coral"><rect x="120" y="275" width="220" height="55" rx="8" fill="#ffe4e0" stroke="#dc6b5a" stroke-width="1.5"/></g>
<text class="t" x="230" y="293" text-anchor="middle" dominant-baseline="central">Premier vote des femmes</text>
<text class="ts" x="230" y="312" text-anchor="middle" dominant-baseline="central">1945</text>

<g class="node c-green"><rect x="360" y="275" width="220" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/></g>
<text class="t" x="470" y="293" text-anchor="middle" dominant-baseline="central">Sécu sociale, nationalisations</text>
<text class="ts" x="470" y="312" text-anchor="middle" dominant-baseline="central">1945-1946</text>

<line x1="580" y1="105" x2="580" y2="140" stroke="none"/>
<g class="c-gray"><rect x="30" y="345" width="620" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="0.5"/></g>
<text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">Le programme du CNR (1943) prolonge celui du Front populaire (1936).</text>
</svg>
