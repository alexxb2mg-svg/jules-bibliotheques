<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frise chronologique de la Première Guerre mondiale">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="30" y1="120" x2="650" y2="120" stroke="#5F5E5A" stroke-width="3" marker-end="url(#arrow)"/>

<g class="c-blue"><circle cx="60" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="60" y="60" text-anchor="middle" dominant-baseline="central">28 juillet 1914</text>
<text class="ts" x="60" y="78" text-anchor="middle" dominant-baseline="central">début de la guerre</text></g>
<line x1="60" y1="88" x2="60" y2="111" class="leader"/>

<g class="c-coral"><circle cx="230" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="230" y="160" text-anchor="middle" dominant-baseline="central">1915-1916</text>
<text class="ts" x="230" y="178" text-anchor="middle" dominant-baseline="central">génocide des Arméniens</text>
<text class="ts" x="230" y="194" text-anchor="middle" dominant-baseline="central">(gouvernement ottoman)</text></g>
<line x1="230" y1="129" x2="230" y2="150" class="leader"/>

<g class="c-purple"><circle cx="400" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="400" y="60" text-anchor="middle" dominant-baseline="central">1917</text>
<text class="ts" x="400" y="78" text-anchor="middle" dominant-baseline="central">révolution bolchevique</text>
<text class="ts" x="400" y="94" text-anchor="middle" dominant-baseline="central">chute du tsar Nicolas II</text></g>
<line x1="400" y1="104" x2="400" y2="111" class="leader"/>

<g class="c-teal"><circle cx="600" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="600" y="160" text-anchor="middle" dominant-baseline="central">11 novembre 1918</text>
<text class="ts" x="600" y="178" text-anchor="middle" dominant-baseline="central">armistice</text>
<text class="ts" x="600" y="194" text-anchor="middle" dominant-baseline="central">victoire de l'Entente</text></g>
<line x1="600" y1="129" x2="600" y2="150" class="leader"/>

<g class="c-gray"><rect x="30" y="220" width="620" height="34" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">Frise simplifiée, pas à l'échelle.</text></g>
</svg>
