licence: CC-BY-SA-4.0
generation: {par: "hermes-hist1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Première Guerre mondiale »", url: "https://fr.vikidia.org/w/index.php?title=Premi%C3%A8re_Guerre_mondiale&oldid=2569759", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Génocide arménien »", url: "https://fr.vikidia.org/w/index.php?title=G%C3%A9nocide_arm%C3%A9nien&oldid=2569180", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Révolution russe »", url: "https://fr.vikidia.org/w/index.php?title=R%C3%A9volution_russe&oldid=2396185", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
abreviations:
  "Entente": "la Triple-Entente : France, Royaume-Uni, Russie, rejointes par l'Italie puis les États-Unis"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: guerre, titre: "Guerre totale 1914-1918", sous_titre: "mobilise civils et militaires", principal: true}
      - {id: camps, titre: "Deux camps", sous_titre: "Triple-Entente contre Triple-Alliance"}
      - {id: arriere, titre: "L'arrière mobilisé", sous_titre: "usines, propagande, pénuries"}
      - {id: armenie, titre: "Génocide arménien", sous_titre: "1915-1916, Empire ottoman"}
      - {id: russie, titre: "Révolution bolchevique", sous_titre: "1917, chute du tsar"}
    liens:
      - {de: guerre, vers: camps, libelle: "oppose"}
      - {de: guerre, vers: arriere, libelle: "mobilise"}
      - {de: guerre, vers: armenie, libelle: "violence extrême"}
      - {de: guerre, vers: russie, libelle: "provoque"}
    jules: "Une **guerre totale** ne se joue pas qu'au front : elle mobilise aussi l'économie, la presse et la population civile, jusqu'aux violences de masse."

  - id: schema-frise
    type: schema
    titre: "Repères chronologiques de la Grande Guerre"
    svg: "guerre-totale-1914-1918.svg"
    jules: "Retiens surtout trois dates : **1914** (début), **1915-1916** (génocide arménien) et **1917** (révolution bolchevique), bien avant l'armistice de **1918**."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1914, max: 1924, pas: 1, depart: 1914}
      - {id: curseur-debut, nom: début, min: 1914, max: 1914, pas: 1, depart: 1914}
      - {id: curseur-fin, nom: fin, min: 1924, max: 1924, pas: 1, depart: 1924}
    lectures:
      - {si: "date <= 1916", texte: "**28 juillet 1914** : la guerre commence ; dès 1915, les soldats s'enterrent dans les **tranchées** ; 1915-1916 : génocide des Arméniens ; 1916 : Verdun."}
      - {si: "date == 1917", texte: "1917 : **révolutions russes** (février : chute du tsar ; octobre : Lénine prend le pouvoir)."}
      - {si: "date == 1918", texte: "**11 novembre 1918** : l'**armistice** arrête les combats."}
      - {si: "date >= 1919", texte: "En Russie, guerre civile jusqu'en 1921 ; l'**URSS** naît en 1922 ; après la mort de Lénine (1924), Staline s'impose."}
    jules: "Avance d'un an à la fois : la partie bleue de la frise, c'est le temps déjà passé. La guerre dure un peu plus de 4 ans, de 1914 à 1918."

  - id: methode
    type: methode
    etapes:
      - "Situer la guerre dans le temps : **1914-1918**, avec ses phases (guerre de mouvement puis guerre des tranchées)."
      - "Distinguer les deux camps : Triple-Entente contre Triple-Alliance (Empires centraux)."
      - "Montrer que civils ET militaires sont mobilisés pour expliquer « guerre totale »."
      - "Pour le génocide arménien, donner la date, l'auteur (le gouvernement ottoman) et le mot juste : **génocide**."
      - "Relier la sortie de guerre de la Russie à la **révolution bolchevique** de 1917."
    jules: "Le mot « génocide » désigne une destruction organisée d'un groupe entier : un simple « massacre » ne suffit pas à décrire les faits."

  - id: piege
    type: piege
    mauvaise_idee: "Dire que la guerre a commencé en 1918, en confondant avec la date de l'armistice."
    pourquoi_faux: "1918 est la date de la **fin** de la guerre (armistice du 11 novembre) : le conflit a commencé en **1914**."
    bonne_idee: "Retenir les deux bornes ensemble : la guerre dure du 28 juillet 1914 à l'armistice du 11 novembre 1918."
    jules: "Autre confusion fréquente : la révolution bolchevique de **1917** n'est pas la même chose que l'arrivée de Staline au pouvoir, dans les années 1920."

  - id: exemple
    type: exemple
    situation: "Expliquer en trois phrases pourquoi la Première Guerre mondiale est qualifiée de « guerre totale »."
    conclusion: "Elle mobilise les combattants dans les tranchées mais aussi les civils à l'arrière (usines, propagande) ; la violence touche aussi les populations civiles, comme le montre le **génocide des Arméniens** en 1915-1916."
    jules: "Un bon développement cite toujours un exemple militaire ET un exemple civil pour justifier le mot « totale »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entre **800 000 et 1,2 million** d'Arméniens meurent lors du génocide organisé par les Jeunes-Turcs entre 1915 et 1916."
