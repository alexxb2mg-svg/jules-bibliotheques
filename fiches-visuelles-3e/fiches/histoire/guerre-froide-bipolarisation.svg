<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrowgf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">Un monde coupé en deux blocs (1947-1991)</text>

<g class="node c-blue"><rect x="40" y="55" width="270" height="180" rx="10"/></g>
<text class="th" x="175" y="82" text-anchor="middle">Bloc de l'Ouest</text>
<text class="t" x="175" y="112" text-anchor="middle">États-Unis</text>
<text class="ts" x="175" y="135" text-anchor="middle">Capitalisme, démocratie libérale</text>
<text class="ts" x="175" y="158" text-anchor="middle">Alliance : OTAN</text>
<text class="ts" x="175" y="200" text-anchor="middle">Rideau de fer</text>
<text class="ts" x="175" y="218" text-anchor="middle">(1946)</text>

<g class="node c-coral"><rect x="370" y="55" width="270" height="180" rx="10"/></g>
<text class="th" x="505" y="82" text-anchor="middle">Bloc de l'Est</text>
<text class="t" x="505" y="112" text-anchor="middle">URSS</text>
<text class="ts" x="505" y="135" text-anchor="middle">Communisme</text>
<text class="ts" x="505" y="158" text-anchor="middle">Alliance : pacte de Varsovie</text>
<text class="ts" x="505" y="200" text-anchor="middle">Mur de Berlin</text>
<text class="ts" x="505" y="218" text-anchor="middle">(1961)</text>

<line x1="310" y1="145" x2="370" y2="145" stroke="#374151" stroke-width="2.5" stroke-dasharray="6,4"/>
<text class="ts" x="340" y="130" text-anchor="middle">confrontation</text>
<text class="ts" x="340" y="270" text-anchor="middle">idéologique, sans combat direct</text>

<g class="node c-amber"><rect x="190" y="290" width="300" height="80" rx="10"/></g>
<text class="th" x="340" y="315" text-anchor="middle">Non-alignés</text>
<text class="ts" x="340" y="340" text-anchor="middle">Tiers monde, conférence de Bandung (1955)</text>
<text class="ts" x="340" y="358" text-anchor="middle">refusent de choisir un camp</text>

<line x1="175" y1="235" x2="300" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowgf)"/>
<line x1="505" y1="235" x2="400" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowgf)"/>
</svg>
