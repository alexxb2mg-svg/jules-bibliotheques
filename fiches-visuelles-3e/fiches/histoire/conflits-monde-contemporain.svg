<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrowc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">Un conflit local, une coopération mondiale</text>

<g class="node c-coral"><rect x="40" y="55" width="280" height="160" rx="10"/></g>
<text class="th" x="180" y="82" text-anchor="middle">Conflit local</text>
<text class="t" x="180" y="112" text-anchor="middle">Guerre en Ukraine</text>
<text class="ts" x="180" y="135" text-anchor="middle">Invasion russe, février 2022</text>
<text class="ts" x="180" y="158" text-anchor="middle">Aide internationale à l'Ukraine</text>
<text class="ts" x="180" y="178" text-anchor="middle">Sanctions économiques contre la Russie</text>
<text class="ts" x="180" y="198" text-anchor="middle">Enjeu local devenu mondial</text>

<g class="node c-teal"><rect x="360" y="55" width="280" height="160" rx="10"/></g>
<text class="th" x="500" y="82" text-anchor="middle">Coopération mondiale</text>
<text class="t" x="500" y="112" text-anchor="middle">Accord de Paris, 2015</text>
<text class="ts" x="500" y="135" text-anchor="middle">Adopté lors de la COP21</text>
<text class="ts" x="500" y="158" text-anchor="middle">Objectif : moins de 2°C</text>
<text class="ts" x="500" y="178" text-anchor="middle">Acteurs : États, ONU, ONG</text>
<text class="ts" x="500" y="198" text-anchor="middle">Réponse à un défi mondial</text>

<g class="c-gray"><rect x="40" y="245" width="600" height="70" rx="8" stroke-width="0.5"/></g>
<text class="t" x="340" y="270" text-anchor="middle" dominant-baseline="central">Depuis 1989-1991 : plus de blocs rivaux, mais rivalités persistantes</text>
<text class="ts" x="340" y="292" text-anchor="middle">Enjeux locaux (territoire) aux répercussions internationales (sanctions, alliances)</text>
</svg>
