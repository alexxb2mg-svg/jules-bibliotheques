<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arroweu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">Trois étapes-clés de 1951 à 1992</text>

<line x1="60" y1="140" x2="620" y2="140" stroke="#374151" stroke-width="2" marker-end="url(#arroweu)"/>

<g class="node c-blue"><rect x="60" y="60" width="160" height="60" rx="8"/></g>
<text class="t" x="140" y="85" text-anchor="middle" dominant-baseline="central">CECA</text>
<text class="ts" x="140" y="105" text-anchor="middle" dominant-baseline="central">charbon et acier</text>
<line x1="140" y1="120" x2="140" y2="140" stroke="#374151" stroke-width="2"/>
<text class="ts" x="140" y="160" text-anchor="middle">1951</text>

<g class="node c-teal"><rect x="280" y="60" width="160" height="60" rx="8"/></g>
<text class="t" x="360" y="85" text-anchor="middle" dominant-baseline="central">CEE</text>
<text class="ts" x="360" y="105" text-anchor="middle" dominant-baseline="central">marché commun</text>
<line x1="360" y1="120" x2="360" y2="140" stroke="#374151" stroke-width="2"/>
<text class="ts" x="360" y="160" text-anchor="middle">1957</text>

<g class="node c-purple"><rect x="500" y="60" width="160" height="60" rx="8"/></g>
<text class="t" x="580" y="85" text-anchor="middle" dominant-baseline="central">UE</text>
<text class="ts" x="580" y="105" text-anchor="middle" dominant-baseline="central">traité de Maastricht</text>
<line x1="580" y1="120" x2="580" y2="140" stroke="#374151" stroke-width="2"/>
<text class="ts" x="580" y="160" text-anchor="middle">1992</text>

<text class="ts" x="340" y="200" text-anchor="middle">Élargissement progressif : de 6 à 27 États membres</text>
<text class="ts" x="340" y="220" text-anchor="middle">Euro (monnaie unique) en circulation depuis 2002</text>
</svg>
