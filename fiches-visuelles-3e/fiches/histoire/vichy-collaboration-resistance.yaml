      - {de: francelibre, vers: resistance, libelle: "encourage"}
      - {de: resistance, vers: cnr, libelle: "s'unit dans"}
    jules: "La **Résistance** combat sur deux fronts à la fois : l'occupant allemand et le régime de Vichy, qui collabore avec lui."

  - id: schema-frise
    type: schema
    titre: "De l'appel du 18 juin à la Résistance unifiée"
    svg: "vichy-collaboration-resistance.svg"
    jules: "L'appel du 18 juin est lancé **avant** l'armistice, signé quatre jours plus tard, le 22 juin 1940."

  - id: methode
    type: methode
    etapes:
      - "Distinguer trois réalités françaises entre 1940 et 1944 : le régime de Vichy, la Résistance intérieure et la France libre."
      - "Retenir les dates clés : appel du 18 juin, armistice du 22 juin 1940, régime de Vichy jusqu'en août 1944."
      - "Montrer que la Résistance agit à la fois contre l'occupant nazi et contre le régime de Vichy."
      - "Ne pas confondre « collaboration » (choix politique de Vichy) et simple « occupation » (fait militaire subi)."
    jules: "Le régime de Vichy prend des mesures antisémites dès **1940**, bien avant la Shoah étudiée dans la notion précédente."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre zone occupée et zone libre, en pensant que la « zone libre » échappe à toute autorité française."
    pourquoi_faux: "La « zone libre » reste sous l'autorité du régime de **Vichy**, pas sous occupation directe allemande, jusqu'en novembre 1942."
    bonne_idee: "Distinguer occupation militaire allemande (zone nord) et autorité du régime de Vichy (zone sud, jusqu'en 1942)."
    jules: "Autre piège : situer l'appel du 18 juin **après** l'armistice, alors qu'il est lancé la veille, en réaction au discours de Pétain."

  - id: exemple
    type: exemple
    situation: "Expliquer pourquoi la Résistance combat à la fois l'occupant allemand et le régime de Vichy."
    conclusion: "La Résistance refuse l'occupation du territoire par l'Allemagne nazie, mais aussi la soumission du régime de **Vichy**, qui collabore avec l'occupant et rejette les valeurs républicaines : résister, c'est lutter sur ces deux fronts à la fois."
    jules: "En 1943, **Jean Moulin** réunit les mouvements de résistance dans le CNR, qui reconnaît de Gaulle comme chef de la Résistance."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Le régime de Vichy dure du **10 juillet 1940** au 20 août 1944, avec pour devise « Travail, Famille, Patrie »."
