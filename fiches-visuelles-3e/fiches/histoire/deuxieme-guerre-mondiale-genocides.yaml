    type: carte
    noeuds:
      - {id: guerre, titre: "Seconde Guerre mondiale", sous_titre: "1939-1945, conflit planétaire", principal: true}
      - {id: camps, titre: "Deux camps", sous_titre: "Alliés contre Axe"}
