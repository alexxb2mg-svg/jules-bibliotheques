    jules: "Un **anéantissement** va au-delà des combats militaires : il vise à détruire des populations civiles entières, en tant que groupe."

  - id: schema-frise
    type: schema
    titre: "Repères chronologiques de la Seconde Guerre mondiale"
    svg: "deuxieme-guerre-mondiale-genocides.svg"
    jules: "Retiens les deux bornes du conflit, **1er septembre 1939** et **2 septembre 1945**, et la période 1941-1945 où se déroule l'extermination de masse."

  - id: methode
    type: methode
    etapes:
      - "Situer précisément les dates : 1er septembre 1939 au 2 septembre 1945."
      - "Distinguer les deux génocides du programme : celui des Juifs (la **Shoah**) et celui des Tziganes."
      - "Employer le mot « génocide » à bon escient : une extermination organisée d'un groupe en tant que tel."
      - "Relier ce génocide à l'idéologie raciste et antisémite du nazisme."
    jules: "Ne dis jamais « massacre » à la place de « génocide » quand il s'agit d'une extermination planifiée et systématique."

  - id: piege
    type: piege
    mauvaise_idee: "Employer « Shoah » et « génocide des Tziganes » comme deux mots synonymes."
    pourquoi_faux: "Ce sont **deux génocides distincts**, organisés par les nazis contre deux groupes différents, avec des noms propres à chacun."
    bonne_idee: "Nommer chaque génocide séparément : la Shoah pour les Juifs, le Samudaripen pour les Tziganes."
    jules: "Autre piège fréquent : confondre camp de concentration (travail forcé) et **camp d'extermination**, construit spécifiquement pour tuer en masse."

  - id: exemple
    type: exemple
    situation: "Expliquer en quoi la Seconde Guerre mondiale est un conflit d'anéantissement."
    conclusion: "Au-delà des batailles entre armées, les nazis mettent en œuvre une extermination planifiée de populations civiles jugées inférieures selon leur idéologie raciste : les **Juifs** (Shoah) et les **Tziganes** sont visés par des génocides, avec des camps construits pour tuer en masse."
    jules: "Environ **six millions** de Juifs d'Europe sont exterminés pendant la Shoah, par la faim, les fusillades de masse ou les chambres à gaz."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "D'autres groupes sont persécutés et assassinés par les nazis : opposants politiques, personnes handicapées, homosexuels."
