notion: totalitarismes-entre-deux-guerres
titre: "Crises et expériences totalitaires en Europe entre les deux guerres"
matiere: histoire
niveau: 3e
auteurs: ["hermes-hist1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-hist1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Krach de 1929 »", url: "https://fr.vikidia.org/w/index.php?title=Krach_de_1929&oldid=2351031", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Nazisme »", url: "https://fr.vikidia.org/w/index.php?title=Nazisme&oldid=2575168", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Front populaire »", url: "https://fr.vikidia.org/w/index.php?title=Front_populaire&oldid=2337126", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
abreviations:
  "SFIO": "Section française de l'Internationale ouvrière, le principal parti socialiste de l'époque"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: crise, titre: "Krach de 1929", sous_titre: "Grande Dépression mondiale", principal: true}
      - {id: allemagne, titre: "Allemagne nazie", sous_titre: "Hitler chancelier en 1933"}
      - {id: totalitaire, titre: "Régime totalitaire", sous_titre: "parti unique, propagande"}
      - {id: alliances, titre: "Alliances", sous_titre: "Italie fasciste, Japon"}
      - {id: france, titre: "Front populaire", sous_titre: "France, victoire en 1936"}
    liens:
      - {de: crise, vers: allemagne, libelle: "aggrave la crise"}
      - {de: allemagne, vers: totalitaire, libelle: "installe un"}
      - {de: allemagne, vers: alliances, libelle: "noue des"}
      - {de: crise, vers: france, libelle: "inquiète, unit"}
    jules: "La crise économique de **1929** ne suffit pas à expliquer le nazisme : elle s'ajoute aux difficultés déjà héritées de la défaite de 1918."

  - id: schema-frise
    type: schema
    titre: "De la crise de 1929 au Front populaire"
    svg: "totalitarismes-entre-deux-guerres.svg"
    jules: "Entre le krach de **1929** et les élections françaises de **1936**, sept ans séparent la crise économique de ses conséquences politiques en Europe."

  - id: graphe
    type: graphe
    gabarit: courbe-evolution
    curseurs:
      - {id: curseur-jeu, nom: jeu, min: 1, max: 1, pas: 1, depart: 1}
      - {id: curseur-annee, nom: annee, min: 1928, max: 1933, pas: 1, depart: 1929}
    lectures:
      - {si: "annee <= 1929", texte: "Avant la crise, le parti nazi est un **petit parti** : moins de 3 électeurs sur 100 en 1928."}
      - {si: "annee >= 1930 && annee <= 1932", texte: "La **Grande Dépression** frappe : le chômage explose et le vote nazi grimpe en même temps ; en juillet 1932, c'est le premier parti au Reichstag."}
      - {si: "annee >= 1933", texte: "30 janvier 1933 : Hitler devient chancelier et installe en quelques mois un **régime totalitaire**."}
    jules: "Avance l'année : la courbe orange des chômeurs et la courbe bleue du vote nazi montent ensemble. La crise a aidé les nazis à gagner des voix."

  - id: methode
    type: methode
    etapes:
      - "Distinguer la cause économique (krach de 1929) de sa conséquence politique en Allemagne (Hitler chancelier en 1933)."
      - "Retenir le mot juste pour le régime nazi : **totalitaire** (parti unique, propagande, répression)."
      - "Ne pas confondre nazisme (Allemagne, Hitler) et fascisme (Italie, Mussolini) : deux régimes proches mais distincts."
      - "Situer le Front populaire en 1936 et le relier au contexte de « montée des périls » en Europe."
    jules: "Une astuce pour ne pas confondre : le nazisme, c'est l'Allemagne d'Hitler ; le fascisme, c'est l'Italie de Mussolini."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'Hitler est élu président de l'Allemagne par les électeurs."
    pourquoi_faux: "Hitler est **nommé chancelier** en janvier 1933, un poste de chef du gouvernement, avant de concentrer tous les pouvoirs."
    bonne_idee: "Retenir la nuance : nommé chancelier en 1933, puis il installe un régime totalitaire qui supprime les libertés."
    jules: "Autre confusion fréquente : le krach de 1929 est un événement boursier, la **Grande Dépression** est la crise économique mondiale qui en découle."

  - id: exemple
    type: exemple
    situation: "Expliquer le lien entre la crise de 1929 et l'arrivée d'Hitler au pouvoir en Allemagne."
    conclusion: "Le krach de 1929 provoque une crise économique mondiale (chômage, faillites) qui s'ajoute aux difficultés de l'après-guerre en Allemagne ; Hitler et le parti nazi profitent de ce contexte pour arriver au pouvoir en **janvier 1933**."
    jules: "Ce raisonnement en deux temps (cause économique puis conséquence politique) est celui qu'attend un développement construit au brevet."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Le gouvernement de **Léon Blum**, issu du Front populaire, fait voter les congés payés et la semaine de 40 heures en 1936."
