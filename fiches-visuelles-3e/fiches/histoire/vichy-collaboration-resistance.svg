<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frise chronologique de Vichy à la Résistance unifiée">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="30" y1="120" x2="650" y2="120" stroke="#5F5E5A" stroke-width="3" marker-end="url(#arrow)"/>

<g class="c-teal"><circle cx="60" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="60" y="60" text-anchor="middle" dominant-baseline="central">18 juin 1940</text>
<text class="ts" x="60" y="78" text-anchor="middle" dominant-baseline="central">appel de de Gaulle</text>
<text class="ts" x="60" y="94" text-anchor="middle" dominant-baseline="central">France libre</text></g>
<line x1="60" y1="104" x2="60" y2="111" class="leader"/>

<g class="c-red"><circle cx="230" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="230" y="160" text-anchor="middle" dominant-baseline="central">22 juin 1940</text>
<text class="ts" x="230" y="178" text-anchor="middle" dominant-baseline="central">armistice, régime de Vichy</text></g>
<line x1="230" y1="129" x2="230" y2="150" class="leader"/>

<g class="c-purple"><circle cx="450" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="450" y="60" text-anchor="middle" dominant-baseline="central">1943</text>
<text class="ts" x="450" y="78" text-anchor="middle" dominant-baseline="central">Jean Moulin fonde le CNR</text>
<text class="ts" x="450" y="94" text-anchor="middle" dominant-baseline="central">Résistance unifiée</text></g>
<line x1="450" y1="104" x2="450" y2="111" class="leader"/>

<g class="c-amber"><circle cx="620" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="600" y="160" text-anchor="middle" dominant-baseline="central">20 août 1944</text>
<text class="ts" x="600" y="178" text-anchor="middle" dominant-baseline="central">fin du régime de Vichy</text></g>
<line x1="620" y1="129" x2="620" y2="150" class="leader"/>

<g class="c-gray"><rect x="30" y="220" width="620" height="34" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">Frise simplifiée, pas à l'échelle.</text></g>
</svg>
