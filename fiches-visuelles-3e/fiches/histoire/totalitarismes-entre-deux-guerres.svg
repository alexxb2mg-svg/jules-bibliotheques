<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frise chronologique de la crise de 1929 au Front populaire">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="30" y1="120" x2="650" y2="120" stroke="#5F5E5A" stroke-width="3" marker-end="url(#arrow)"/>

<g class="c-red"><circle cx="60" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="60" y="60" text-anchor="middle" dominant-baseline="central">24 octobre 1929</text>
<text class="ts" x="60" y="78" text-anchor="middle" dominant-baseline="central">krach de Wall Street</text></g>
<line x1="60" y1="88" x2="60" y2="111" class="leader"/>

<g class="c-amber"><circle cx="260" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="260" y="160" text-anchor="middle" dominant-baseline="central">années 1930</text>
<text class="ts" x="260" y="178" text-anchor="middle" dominant-baseline="central">Grande Dépression</text>
<text class="ts" x="260" y="194" text-anchor="middle" dominant-baseline="central">chômage massif</text></g>
<line x1="260" y1="129" x2="260" y2="150" class="leader"/>

<g class="c-purple"><circle cx="430" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="430" y="60" text-anchor="middle" dominant-baseline="central">janvier 1933</text>
<text class="ts" x="430" y="78" text-anchor="middle" dominant-baseline="central">Hitler chancelier</text>
<text class="ts" x="430" y="94" text-anchor="middle" dominant-baseline="central">régime nazi totalitaire</text></g>
<line x1="430" y1="104" x2="430" y2="111" class="leader"/>

<g class="c-teal"><circle cx="610" cy="120" r="7" stroke-width="1.5"/>
<text class="th" x="610" y="160" text-anchor="middle" dominant-baseline="central">mai 1936</text>
<text class="ts" x="610" y="178" text-anchor="middle" dominant-baseline="central">victoire du Front populaire</text>
<text class="ts" x="610" y="194" text-anchor="middle" dominant-baseline="central">gouvernement Léon Blum</text></g>
<line x1="610" y1="129" x2="610" y2="150" class="leader"/>

<g class="c-gray"><rect x="30" y="220" width="620" height="34" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">Frise simplifiée, pas à l'échelle.</text></g>
</svg>
