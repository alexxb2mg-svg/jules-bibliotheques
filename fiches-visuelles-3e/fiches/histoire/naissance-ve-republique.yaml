notion: naissance-ve-republique
titre: "1958 : la naissance de la Ve République"
matiere: histoire
niveau: 3e
auteurs: ["hermes-hist3"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Vikidia, « Cinquième République »", url: "https://fr.vikidia.org/w/index.php?title=Cinqui%C3%A8me_R%C3%A9publique&oldid=2454737", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Charles de Gaulle »", url: "https://fr.vikidia.org/w/index.php?title=Charles_de_Gaulle&oldid=2568232", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Constitution française de 1958 »", url: "https://fr.vikidia.org/w/index.php?title=Constitution_fran%C3%A7aise_de_1958&oldid=2431778", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
generation: {par: "hermes-hist3", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: crise, titre: "Crise de mai 1958", sous_titre: "guerre d'Algérie", principal: true}
      - {id: degaulle, titre: "Retour de De Gaulle", sous_titre: "pleins pouvoirs"}
      - {id: constitution, titre: "Nouvelle Constitution", sous_titre: "référendum du 28/09/1958"}
      - {id: ve-republique, titre: "Ve République", sous_titre: "depuis le 04/10/1958"}
      - {id: executif, titre: "Exécutif renforcé", sous_titre: "président et gouvernement"}
    liens:
      - {de: crise, vers: degaulle, libelle: "provoque"}
      - {de: degaulle, vers: constitution, libelle: "rédige"}
      - {de: constitution, vers: ve-republique, libelle: "fonde"}
      - {de: ve-republique, vers: executif, libelle: "renforce"}
    jules: "Retiens bien l'enchaînement : c'est la **crise algérienne** qui amène de Gaulle au pouvoir, et c'est lui qui fait rédiger la Constitution de la Ve République."

  - id: schema
    type: schema
    titre: "De la IVe à la Ve République : un exécutif renforcé"
    svg: "naissance-ve-republique.svg"
    jules: "Sous la IVe République, le **Parlement** dominait, ce qui rendait les gouvernements instables. La Ve République inverse ce rapport de force en donnant plus de pouvoir au président et au gouvernement."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1958, max: 2002, pas: 1, depart: 1958}
      - {id: curseur-debut, nom: début, min: 1958, max: 1958, pas: 1, depart: 1958}
      - {id: curseur-fin, nom: fin, min: 2002, max: 2002, pas: 1, depart: 2002}
    lectures:
      - {si: "date < 1962", texte: "**1958** : de Gaulle fonde la **Ve République** ; la Constitution renforce le pouvoir **exécutif**."}
      - {si: "date >= 1962 && date < 1981", texte: "Depuis **1962**, le président est élu au **suffrage universel direct** ; de Gaulle démissionne en 1969."}
      - {si: "date >= 1981 && date < 1986", texte: "**1981** : François Mitterrand est élu, c'est la première **alternance**."}
      - {si: "date >= 1986", texte: "Le président et la majorité de l'Assemblée sont parfois de camps opposés : c'est la **cohabitation** (1986-1988, 1993-1995, 1997-2002)."}
    jules: "La Ve République a 23 ans quand arrive la première alternance, en 1981. Retiens bien les deux mots : alternance et cohabitation."

  - id: methode
    type: methode
    etapes:
      - "Situer le contexte de crise : la **guerre d'Algérie** fragilise la IVe République, un soulèvement éclate à Alger en mai 1958."
      - "Retenir le retour au pouvoir de Charles de Gaulle, retiré de la politique depuis 1946, qui obtient les pleins pouvoirs."
      - "Donner les deux dates de la Constitution : adoptée par référendum le **28 septembre 1958**, en vigueur depuis le **4 octobre 1958**."
      - "Insister sur la caractéristique principale de la Ve République : un **exécutif renforcé** par rapport au Parlement."
      - "Ne pas confondre l'adoption de la Constitution (1958) et l'élection du président au suffrage universel direct (réforme de **1962**)."
    jules: "Le scrutin **majoritaire** aux élections législatives favorise en général une majorité stable à l'Assemblée nationale, ce qui soutient le gouvernement."

  - id: piege
    type: piege
    mauvaise_idee: "De Gaulle est élu président dès 1958 au suffrage universel direct."
    pourquoi_faux: "En 1958, le président n'est pas encore élu directement par les citoyens. Ce n'est qu'à partir de la réforme de **1962** que l'élection présidentielle se fait au suffrage universel direct."
    bonne_idee: "Distinguer 1958 (adoption de la Constitution, exécutif renforcé) et 1962 (élection du président au suffrage universel direct, qui renforce encore sa légitimité)."
    jules: "Ce piège revient souvent au brevet : une nouvelle Constitution ne change pas forcément tout d'un coup, certaines réformes viennent après, comme celle de 1962."

  - id: exemple
    type: exemple
    situation: "Explique en une phrase pourquoi 1958 marque une rupture dans l'histoire politique française."
    calcul: "Une nouvelle Constitution, approuvée par référendum le 28 septembre 1958 (plus de 80 % de « oui »), fonde la Ve République."
    conclusion: "Elle renforce durablement le **pouvoir exécutif** face au Parlement, mettant fin à l'instabilité gouvernementale de la IVe République."
    jules: "Charles de Gaulle devient ainsi le premier président de la Ve République, un régime toujours en vigueur aujourd'hui."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🕰️", titre: "Frise chronologique", description: "1958, 1962", outil: "frise-chronologique"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Trois dates à ne pas mélanger : **mai 1958** (crise, retour de De Gaulle), **28 septembre/4 octobre 1958** (Constitution, Ve République), **1962** (élection du président au suffrage universel direct)."
