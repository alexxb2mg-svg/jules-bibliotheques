notion: realiser-projets-musicaux
titre: "Réaliser un projet musical d'interprétation ou de création"
matiere: education-musicale
niveau: 3e
auteurs: ["hermes-em1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-em1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Voix »", url: "https://fr.vikidia.org/w/index.php?title=Voix&oldid=2441249", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: projet, titre: "Projet musical", sous_titre: "interprétation ou création", principal: true}
      - {id: individuel, titre: "Apprentissage individuel", sous_titre: "sa partie, avant le groupe"}
      - {id: collectif, titre: "Répétitions collectives", sous_titre: "écouter les autres, s'accorder"}
      - {id: restitution, titre: "Restitution", sous_titre: "moment devant un public"}
    liens:
      - {de: projet, vers: individuel}
      - {de: individuel, vers: collectif}
      - {de: collectif, vers: restitution}
    jules: "Un projet musical se construit par étapes : on ne passe au **collectif** qu'une fois sa propre partie apprise, sinon la répétition de groupe sert à peu de choses."

  - id: schema
    type: schema
    titre: "Les étapes d'un projet musical, de l'apprentissage à la restitution"
    svg: "realiser-projets-musicaux.svg"
    jules: "La **restitution** est un moment du projet à part entière, pas seulement son résultat : elle se prépare (entrées, silence avant de commencer)."

  - id: methode
    type: methode
    etapes:
      - "Apprendre sa partie individuellement (paroles, rythme, hauteur) avant les répétitions collectives."
      - "En répétition, écouter les autres voix ou instruments autant que la sienne."
      - "Repérer les passages difficiles (changement de tempo, entrée décalée) et les travailler à part."
      - "S'accorder collectivement sur l'expression recherchée (nuances, caractère)."
      - "Préparer la restitution finale comme un moment de communication avec le public."
    jules: "La **justesse individuelle** ne suffit pas : un projet réussit quand chacun s'accorde aussi avec le reste du groupe."

  - id: piege
    type: piege
    mauvaise_idee: "Se concentrer uniquement sur sa propre partie sans écouter le groupe."
    pourquoi_faux: "Un projet musical est collectif : chanter ou jouer juste seul ne suffit pas si on ne s'accorde pas avec les autres, en tempo et en nuances."
    bonne_idee: "Écouter les autres voix ou instruments en même temps que l'on joue ou chante la sienne, dès les premières répétitions collectives."
    jules: "Vouloir aller trop vite dans l'apprentissage collectif, avant de maîtriser sa partie, est un piège proche : chacun doit d'abord savoir sa partie seul."

  - id: exemple
    type: exemple
    situation: "La classe prépare un chant à deux voix pour une fête de fin d'année."
    calcul: "Chaque groupe de voix apprend sa mélodie séparément, puis les deux groupes répètent ensemble en s'écoutant pour accorder hauteur et tempo."
    conclusion: "Une **répétition générale** qui simule les conditions du concert termine la préparation, juste avant la restitution."
    jules: "Répéter dans les conditions réelles (debout, dans l'ordre du concert) évite les surprises le jour de la restitution."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "interprétation, création, restitution", outil: "lexique"}
    jules: "Les mots à savoir distinguer : **interprétation** (jouer une œuvre existante) et **création** (composer une œuvre nouvelle)."
