<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="flechemao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
  </marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">De l'enregistrement à la diffusion</text>

<g class="node c-blue"><rect x="20" y="60" width="140" height="50" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="90" y="80" text-anchor="middle" dominant-baseline="central">Enregistrement</text>
<text class="ts" x="90" y="98" text-anchor="middle" dominant-baseline="central">capter les sons</text></g>

<line x1="160" y1="85" x2="195" y2="85" stroke="#374151" stroke-width="1.5" marker-end="url(#flechemao)"/>

<g class="node c-teal"><rect x="195" y="60" width="150" height="50" rx="8" stroke="#0d9488" stroke-width="1.5"/>
<text class="ts" x="270" y="80" text-anchor="middle" dominant-baseline="central">Pistes multiples</text>
<text class="ts" x="270" y="98" text-anchor="middle" dominant-baseline="central">superposer, corriger</text></g>

<line x1="345" y1="85" x2="380" y2="85" stroke="#374151" stroke-width="1.5" marker-end="url(#flechemao)"/>

<g class="node c-amber"><rect x="380" y="60" width="140" height="50" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
<text class="ts" x="450" y="80" text-anchor="middle" dominant-baseline="central">Montage</text>
<text class="ts" x="450" y="98" text-anchor="middle" dominant-baseline="central">volume, ordre, effets</text></g>

<line x1="520" y1="85" x2="555" y2="85" stroke="#374151" stroke-width="1.5" marker-end="url(#flechemao)"/>

<g class="node c-coral"><rect x="555" y="60" width="105" height="50" rx="8" stroke="#c94b4b" stroke-width="1.5"/>
<text class="ts" x="607" y="80" text-anchor="middle" dominant-baseline="central">Diffusion</text>
<text class="ts" x="607" y="98" text-anchor="middle" dominant-baseline="central">partage en ligne</text></g>

<g class="c-gray"><rect x="40" y="150" width="600" height="100" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="180" text-anchor="middle" dominant-baseline="central">La MAO permet de créer des sons qui n'existent pas dans la nature</text>
<text class="ts" x="340" y="205" text-anchor="middle" dominant-baseline="central">et de partager un morceau instantanément en ligne</text>
<text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">Respecter les droits d'auteur des sons empruntés reste obligatoire</text></g>
</svg>
