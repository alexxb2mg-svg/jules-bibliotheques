<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les étapes d'un échange argumenté sur une musique">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central">Échanger sur une musique, dans l'ordre</text>

<g class="node c-blue"><rect x="20" y="60" width="150" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="95" y="86" text-anchor="middle" dominant-baseline="central">1. Écouter</text>
<text class="ts" x="95" y="106" text-anchor="middle" dominant-baseline="central">l'avis de l'autre</text>
<text class="ts" x="95" y="124" text-anchor="middle" dominant-baseline="central">en entier</text>

<line x1="170" y1="100" x2="200" y2="100" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal"><rect x="200" y="60" width="150" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="275" y="86" text-anchor="middle" dominant-baseline="central">2. Reformuler</text>
<text class="ts" x="275" y="106" text-anchor="middle" dominant-baseline="central">avec ses propres</text>
<text class="ts" x="275" y="124" text-anchor="middle" dominant-baseline="central">mots</text>

<line x1="350" y1="100" x2="380" y2="100" class="arr" marker-end="url(#arrow)"/>

<g class="node c-amber"><rect x="380" y="60" width="150" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="455" y="86" text-anchor="middle" dominant-baseline="central">3. Argumenter</text>
<text class="ts" x="455" y="106" text-anchor="middle" dominant-baseline="central">élément précis</text>
<text class="ts" x="455" y="124" text-anchor="middle" dominant-baseline="central">du morceau</text>

<line x1="530" y1="100" x2="560" y2="100" class="arr" marker-end="url(#arrow)"/>

<g class="node c-coral"><rect x="560" y="60" width="100" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="610" y="86" text-anchor="middle" dominant-baseline="central">4. Accepter</text>
<text class="ts" x="610" y="106" text-anchor="middle" dominant-baseline="central">un avis</text>
<text class="ts" x="610" y="124" text-anchor="middle" dominant-baseline="central">différent</text>

<g class="c-gray"><rect x="40" y="190" width="600" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="215" text-anchor="middle" dominant-baseline="central">Un débat musical n'a pas toujours pour but de convaincre.</text>
<text class="ts" x="340" y="238" text-anchor="middle" dominant-baseline="central">Plusieurs avis peuvent coexister, appuyés sur les mêmes observations.</text></g>
</svg>
