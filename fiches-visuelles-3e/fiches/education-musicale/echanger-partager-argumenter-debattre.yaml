  - {titre: "Wikipédia, « Genre musical »", url: "https://fr.wikipedia.org/w/index.php?title=Genre_musical&oldid=236954603", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: echange, titre: "Échanger sur une musique", sous_titre: "avis appuyé sur des éléments", principal: true}
      - {id: ecoute-avis, titre: "Écouter l'autre", sous_titre: "puis reformuler"}
      - {id: argument, titre: "Argumenter", sous_titre: "élément précis du morceau"}
      - {id: debat, titre: "Débat musical", sous_titre: "plusieurs avis peuvent coexister"}
    liens:
      - {de: echange, vers: ecoute-avis}
      - {de: ecoute-avis, vers: argument}
      - {de: argument, vers: debat}
    jules: "Un **débat musical** n'a pas toujours pour but de convaincre : il aide surtout à mieux comprendre pourquoi une musique plaît ou non."

  - id: schema
    type: schema
    titre: "Les étapes d'un échange argumenté sur une musique"
    svg: "echanger-partager-argumenter-debattre.svg"
    jules: "Reformuler l'avis de l'autre avant de répondre montre qu'on l'a vraiment écouté, et évite les malentendus."

  - id: methode
    type: methode
    etapes:
      - "Écouter l'avis de l'autre en entier avant de répondre."
      - "Reformuler cet avis avec ses propres mots pour vérifier qu'on l'a compris."
      - "Appuyer son propre avis sur un élément précis du morceau (pas seulement « j'aime »)."
      - "Accepter qu'un avis différent du sien puisse être aussi valable."
    jules: "Cette méthode prépare aussi à **présenter et justifier** ses propres choix, par exemple pourquoi on a choisi tel instrument."

  - id: piege
    type: piege
    mauvaise_idee: "Couper la parole pour donner son avis avant d'avoir écouté celui de l'autre."
    pourquoi_faux: "Sans avoir écouté l'autre avis en entier, on répond souvent à côté et l'échange n'avance pas."
    bonne_idee: "Laisser l'autre finir, reformuler son avis, puis répondre avec un élément précis et différent."
    jules: "Justifier un avis uniquement par « c'est nul » ou « c'est trop bien » est un piège proche : il faut un élément **précis** du morceau."

  - id: exemple
    type: exemple
    situation: "Deux élèves ne sont pas d'accord sur un morceau : l'un le trouve « ennuyeux », l'autre « apaisant »."
    calcul: "Un bon échange demande à chacun de préciser ce qui produit ce ressenti (un tempo très lent, peu de variations de nuances)."
    conclusion: "Les deux avis peuvent finalement s'appuyer sur les **mêmes observations musicales**, tout en aboutissant à des ressentis différents."
    jules: "Deux avis opposés ne sont pas forcément contradictoires sur le fond : ils décrivent parfois le même élément musical autrement."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "argument, créateur, interprète, auditeur", outil: "lexique"}
    jules: "Trois postures à distinguer : **créateur** (compose), **interprète** (joue) et **auditeur** (écoute) : chacune a un point de vue différent."
