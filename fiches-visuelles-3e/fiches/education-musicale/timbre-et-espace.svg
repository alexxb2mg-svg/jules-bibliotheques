<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
  </marker>
</defs>

<text class="th" x="170" y="26" text-anchor="middle">Même note, deux timbres</text>
<g class="node c-blue"><rect x="40" y="45" width="260" height="60" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="t" x="170" y="68" text-anchor="middle" dominant-baseline="central">Violon (frotté)</text>
<text class="ts" x="170" y="90" text-anchor="middle" dominant-baseline="central">son continu, riche en harmoniques</text></g>

<path d="M50,150 L60,130 L70,160 L80,120 L90,155 L100,135 L110,150 L120,130 L130,158 L140,125 L150,150 L160,140 L170,150 L180,132 L190,152 L200,145 L210,150 L220,138 L230,150 L240,145 L250,150" fill="none" stroke="#2563eb" stroke-width="2"/>

<g class="node c-teal"><rect x="40" y="185" width="260" height="60" rx="8" stroke="#0d9488" stroke-width="1.5"/>
<text class="t" x="170" y="208" text-anchor="middle" dominant-baseline="central">Guitare (pincée)</text>
<text class="ts" x="170" y="230" text-anchor="middle" dominant-baseline="central">son qui s'éteint progressivement</text></g>

<path d="M50,290 L60,260 L75,300 L90,270 L105,295 L120,280 L135,292 L150,286 L165,290 L180,288 L195,290 L210,289 L225,290 L240,290 L250,290" fill="none" stroke="#0d9488" stroke-width="2"/>

<text class="ts" x="170" y="330" text-anchor="middle">Même hauteur (même note), timbre différent</text>

<text class="th" x="510" y="26" text-anchor="middle">Espace sonore</text>
<g class="node c-purple"><circle cx="510" cy="110" r="30" stroke="#7c3aed" stroke-width="1.5"/>
<text class="ts" x="510" y="112" text-anchor="middle" dominant-baseline="central">auditeur</text></g>
<g class="node c-amber"><rect x="580" y="90" width="70" height="34" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
<text class="ts" x="615" y="107" text-anchor="middle" dominant-baseline="central">proche</text></g>
<g class="node c-coral"><rect x="580" y="150" width="70" height="34" rx="8" stroke="#c94b4b" stroke-width="1.5"/>
<text class="ts" x="615" y="167" text-anchor="middle" dominant-baseline="central">lointain</text></g>
<line x1="540" y1="105" x2="580" y2="105" class="arr" stroke="#374151" stroke-width="1.5" marker-end="url(#fleche)"/>
<line x1="530" y1="130" x2="580" y2="160" class="arr" stroke="#374151" stroke-width="1.5" marker-end="url(#fleche)"/>

<g class="c-gray"><rect x="380" y="220" width="270" height="90" rx="8" stroke-width="0.5"/>
<text class="t" x="515" y="245" text-anchor="middle" dominant-baseline="central">Un son sec (petite pièce)</text>
<text class="t" x="515" y="270" text-anchor="middle" dominant-baseline="central">ou résonnant (grande salle)</text>
<text class="ts" x="515" y="295" text-anchor="middle" dominant-baseline="central">selon l'espace autour de la source</text></g>
</svg>
