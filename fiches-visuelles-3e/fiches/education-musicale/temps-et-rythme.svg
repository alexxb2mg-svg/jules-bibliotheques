<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Pulsation, tempo et rythme</text>

<text class="ts" x="60" y="70" text-anchor="start">Pulsation régulière</text>
<circle cx="80" cy="100" r="10" fill="#2563eb"/>
<circle cx="160" cy="100" r="10" fill="#2563eb"/>
<circle cx="240" cy="100" r="10" fill="#2563eb"/>
<circle cx="320" cy="100" r="10" fill="#2563eb"/>
<circle cx="400" cy="100" r="10" fill="#2563eb"/>
<circle cx="480" cy="100" r="10" fill="#2563eb"/>
<circle cx="560" cy="100" r="10" fill="#2563eb"/>
<circle cx="640" cy="100" r="10" fill="#2563eb"/>
<text class="ts" x="60" y="130" text-anchor="start">battement régulier, sous-jacent</text>

<text class="ts" x="60" y="175" text-anchor="start">Tempo lent</text>
<circle cx="80" cy="200" r="8" fill="#0d9488"/>
<circle cx="230" cy="200" r="8" fill="#0d9488"/>
<circle cx="380" cy="200" r="8" fill="#0d9488"/>
<text class="ts" x="450" y="205" text-anchor="start">→ pulsations espacées</text>

<text class="ts" x="60" y="235" text-anchor="start">Tempo rapide</text>
<circle cx="80" cy="260" r="8" fill="#c94b4b"/>
<circle cx="120" cy="260" r="8" fill="#c94b4b"/>
<circle cx="160" cy="260" r="8" fill="#c94b4b"/>
<circle cx="200" cy="260" r="8" fill="#c94b4b"/>
<circle cx="240" cy="260" r="8" fill="#c94b4b"/>
<circle cx="280" cy="260" r="8" fill="#c94b4b"/>
<text class="ts" x="450" y="265" text-anchor="start">→ pulsations rapprochées</text>

<g class="c-gray"><rect x="40" y="290" width="600" height="34" rx="6" stroke-width="0.5"/>
<text class="ts" x="340" y="307" text-anchor="middle" dominant-baseline="central">Rythme = organisation des durées longues et courtes, indépendante du tempo</text></g>
</svg>
