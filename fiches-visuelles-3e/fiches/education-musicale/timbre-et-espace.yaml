blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: timbre, titre: "Timbre", sous_titre: "reconnaître une source", principal: true}
      - {id: production, titre: "Mode de production", sous_titre: "frottée, pincée, soufflée"}
      - {id: harmoniques, titre: "Harmoniques", sous_titre: "accompagnent la note"}
      - {id: espace, titre: "Espace sonore", sous_titre: "près, loin, résonance"}
    liens:
      - {de: timbre, vers: production}
      - {de: timbre, vers: harmoniques}
      - {de: timbre, vers: espace}
    jules: "Le **timbre** ne dépend pas de la hauteur : un piano et une flûte peuvent jouer exactement la même note et rester reconnaissables."

  - id: schema
    type: schema
    titre: "Même note, deux timbres ; un son proche ou lointain"
    svg: "timbre-et-espace.svg"
    jules: "Le violon (frotté) produit un son continu riche en harmoniques, la guitare (pincée) un son qui s'éteint vite : deux **timbres** différents pour la même hauteur."

  - id: methode
    type: methode
    etapes:
      - "Écouter une note jouée par deux instruments différents pour repérer ce qui change (le timbre) et ce qui reste identique (la hauteur)."
      - "Repérer si un son semble proche ou lointain, à gauche ou à droite dans un enregistrement."
      - "Associer un timbre à sa source de production (corde frottée, soufflée, voix…)."
      - "Décrire un timbre avec des mots précis (chaud, métallique, doux, rugueux) plutôt que vagues."
    jules: "Un même mot (« clair », « sourd ») peut décrire un timbre : plus tu utilises de mots précis, plus ta description est utile à un camarade qui n'a pas entendu le son."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'un instrument « qui chante plus aigu » a forcément un timbre différent."
    pourquoi_faux: "L'aigu et le grave décrivent la **hauteur**, pas le timbre : deux instruments peuvent jouer la même hauteur avec des timbres très différents, ou des hauteurs différentes avec des timbres proches."
    bonne_idee: "Comparer deux sons à hauteur identique (même note) pour juger uniquement de leur timbre, sans être trompé par la hauteur."
    jules: "Le piège classique en 3e : dire « il change de timbre » quand en fait seule la **hauteur** a changé."

  - id: exemple
    type: exemple
    situation: "Un violon et une guitare jouent tous les deux la même note."
    calcul: "Le violon est frotté avec un archet (son continu, riche en harmoniques) ; la guitare est pincée (son qui s'éteint progressivement) : deux modes de production différents."
    conclusion: "La hauteur perçue est identique, mais le **timbre** diffère à cause du mode de production de chaque instrument."
    jules: "Ferme les yeux en écoutant deux instruments jouer la même note : c'est le meilleur moyen de t'entraîner à isoler le timbre de la hauteur."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "timbre, harmonique, résonance", outil: "lexique"}
    jules: "Entraîne-toi en fermant les yeux pendant qu'on déplace une source sonore autour de toi : c'est l'**espace sonore** qui te guide, grâce à la différence perçue entre tes deux oreilles."
