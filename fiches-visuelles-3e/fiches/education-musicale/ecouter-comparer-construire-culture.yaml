generation: {par: "hermes-em1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Genre musical »", url: "https://fr.wikipedia.org/w/index.php?title=Genre_musical&oldid=236954603", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: ecoute, titre: "Écoute active", sous_titre: "repérer des éléments précis", principal: true}
      - {id: comparaison, titre: "Comparaison", sous_titre: "points communs, différences"}
      - {id: vocabulaire, titre: "Vocabulaire précis", sous_titre: "tempo, nuances, timbre"}
      - {id: culture, titre: "Culture musicale", sous_titre: "styles et époques variés"}
    liens:
      - {de: ecoute, vers: comparaison}
      - {de: comparaison, vers: vocabulaire}
      - {de: comparaison, vers: culture}
    jules: "Écouter activement, ce n'est pas juste dire si on aime : c'est repérer des éléments précis, comme le **tempo** ou le **timbre**."

  - id: schema
    type: schema
    titre: "Écouter deux fois pour comparer précisément"
    svg: "ecouter-comparer-construire-culture.svg"
    jules: "La première écoute est libre, sans a priori ; la seconde cherche des **éléments précis** à comparer entre les deux œuvres."

  - id: methode
    type: methode
    etapes:
      - "Écouter d'abord sans a priori, en notant ce qui attire l'attention (un instrument, un changement)."
      - "Réécouter en cherchant des éléments précis : tempo, nuances, timbre, structure."
      - "Comparer avec une autre œuvre déjà connue pour situer un style ou une époque."
      - "Utiliser un vocabulaire musical précis pour décrire ce qu'on entend plutôt qu'un simple jugement."
    jules: "Élargir sa **culture musicale**, c'est rencontrer progressivement des styles variés : baroque, classique, musiques actuelles, musiques du monde."

  - id: piege
    type: piege
    mauvaise_idee: "Se contenter de dire « j'aime » ou « j'aime pas » sans décrire ce qu'on entend."
    pourquoi_faux: "Un jugement seul n'apporte aucune information musicale : il ne dit rien du **tempo**, du **timbre** ni de la structure de l'œuvre."
    bonne_idee: "Décrire précisément ce qui produit le ressenti (un tempo lent, un instrument reconnaissable, une nuance forte)."
    jules: "Confondre le **style** d'une musique avec l'émotion qu'elle procure est une autre erreur fréquente : le style se décrit avec des critères musicaux."

  - id: exemple
    type: exemple
    situation: "Comparer un extrait de musique baroque joué au clavecin et un extrait de musique électronique."
    calcul: "Le premier utilise un instrument acoustique ancien, une polyphonie régulière et un tempo stable ; le second, des sons synthétiques et des boucles rythmiques répétées."
    conclusion: "Les deux peuvent partager une même **pulsation régulière** malgré des timbres très différents."
    jules: "Chercher un point commun entre deux musiques très différentes aide autant à comparer qu'à repérer leurs différences."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "tempo, timbre, nuance, style", outil: "lexique"}
    jules: "Note à chaque écoute au moins trois éléments précis (instrument, tempo, nuance) : c'est la base d'une comparaison solide."
