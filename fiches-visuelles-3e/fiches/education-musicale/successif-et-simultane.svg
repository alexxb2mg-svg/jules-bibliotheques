<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="150" y="26" text-anchor="middle">Successif</text>
<g class="node c-blue"><rect x="30" y="50" width="240" height="34" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="150" y="67" text-anchor="middle" dominant-baseline="central">une seule ligne mélodique</text></g>
<text class="ts" x="150" y="105" text-anchor="middle">une voix après l'autre, dans le temps</text>

<text class="th" x="510" y="26" text-anchor="middle">Simultané (canon)</text>
<g class="node c-teal"><rect x="330" y="45" width="360" height="30" rx="6" stroke="#0d9488" stroke-width="1.5"/>
<text class="ts" x="510" y="60" text-anchor="middle" dominant-baseline="central">Voix 1 : la mélodie</text></g>
<g class="node c-teal"><rect x="380" y="85" width="310" height="30" rx="6" stroke="#0d9488" stroke-width="1.5"/>
<text class="ts" x="535" y="100" text-anchor="middle" dominant-baseline="central">Voix 2 : la mélodie (décalée)</text></g>
<g class="node c-teal"><rect x="430" y="125" width="260" height="30" rx="6" stroke="#0d9488" stroke-width="1.5"/>
<text class="ts" x="560" y="140" text-anchor="middle" dominant-baseline="central">Voix 3 : la mélodie (décalée)</text></g>
<text class="ts" x="510" y="180" text-anchor="middle">3 voix, même mélodie, décalées dans le temps</text>

<g class="c-gray"><rect x="40" y="220" width="600" height="90" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="245" text-anchor="middle" dominant-baseline="central">Polyphonie = plusieurs mélodies indépendantes ensemble</text>
<text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">un simple accompagnement d'accords n'en est pas une</text>
<text class="ts" x="340" y="292" text-anchor="middle" dominant-baseline="central">le canon transforme le successif en simultané</text></g>
</svg>
