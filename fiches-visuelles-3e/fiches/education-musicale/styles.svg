<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="flechestyle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
  </marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Chronologie simplifiée des styles</text>

<line x1="40" y1="150" x2="650" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#flechestyle)"/>

<g class="node c-blue"><rect x="40" y="110" width="130" height="40" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="105" y="130" text-anchor="middle" dominant-baseline="central">Baroque</text></g>
<text class="ts" x="105" y="175" text-anchor="middle">XVIe – XVIIIe s.</text>
<text class="ts" x="105" y="192" text-anchor="middle">clavecin, polyphonie</text>

<g class="node c-teal"><rect x="200" y="110" width="130" height="40" rx="8" stroke="#0d9488" stroke-width="1.5"/>
<text class="ts" x="265" y="130" text-anchor="middle" dominant-baseline="central">Classique</text></g>
<text class="ts" x="265" y="175" text-anchor="middle">XVIIIe s.</text>

<g class="node c-coral"><rect x="360" y="110" width="130" height="40" rx="8" stroke="#c94b4b" stroke-width="1.5"/>
<text class="ts" x="425" y="130" text-anchor="middle" dominant-baseline="central">Romantique</text></g>
<text class="ts" x="425" y="175" text-anchor="middle">XIXe s.</text>
<text class="ts" x="425" y="192" text-anchor="middle">grand orchestre</text>

<g class="node c-amber"><rect x="520" y="110" width="130" height="40" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
<text class="ts" x="585" y="130" text-anchor="middle" dominant-baseline="central">Jazz, rock…</text>
</g>
<text class="ts" x="585" y="175" text-anchor="middle">XXe – XXIe s.</text>
<text class="ts" x="585" y="192" text-anchor="middle">sons électroniques</text>

<g class="c-gray"><rect x="40" y="220" width="610" height="55" rx="8" stroke-width="0.5"/>
<text class="ts" x="345" y="242" text-anchor="middle" dominant-baseline="central">Un style traverse plusieurs genres (sonate, opéra, messe en baroque)</text>
<text class="ts" x="345" y="262" text-anchor="middle" dominant-baseline="central">Style = époque d'écriture ; genre = catégorie (blues, rap...)</text></g>
</svg>
