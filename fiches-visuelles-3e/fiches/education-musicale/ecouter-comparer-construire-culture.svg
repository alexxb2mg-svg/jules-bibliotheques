<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deux écoutes successives pour comparer précisément deux œuvres">
<text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central">Écouter, puis réécouter pour comparer</text>

<g class="node c-blue"><rect x="40" y="60" width="270" height="90" rx="8" stroke-width="1.5"/></g>
<text class="th" x="175" y="84" text-anchor="middle" dominant-baseline="central">1ère écoute</text>
<text class="ts" x="175" y="108" text-anchor="middle" dominant-baseline="central">sans a priori</text>
<text class="ts" x="175" y="128" text-anchor="middle" dominant-baseline="central">noter ce qui attire l'attention</text>

<g class="node c-teal"><rect x="370" y="60" width="270" height="90" rx="8" stroke-width="1.5"/></g>
<text class="th" x="505" y="84" text-anchor="middle" dominant-baseline="central">2e écoute</text>
<text class="ts" x="505" y="108" text-anchor="middle" dominant-baseline="central">chercher des éléments précis</text>
<text class="ts" x="505" y="128" text-anchor="middle" dominant-baseline="central">tempo, timbre, nuances, structure</text>

<line x1="310" y1="105" x2="360" y2="105" class="arr" marker-end="url(#arrow2)"/>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-amber"><rect x="90" y="190" width="500" height="80" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="215" text-anchor="middle" dominant-baseline="central">Comparer avec une œuvre déjà connue</text>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">pour situer un style ou une époque, avec un vocabulaire précis</text></g>

<line x1="175" y1="150" x2="250" y2="188" class="arr" marker-end="url(#arrow2)"/>
<line x1="505" y1="150" x2="430" y2="188" class="arr" marker-end="url(#arrow2)"/>
</svg>
