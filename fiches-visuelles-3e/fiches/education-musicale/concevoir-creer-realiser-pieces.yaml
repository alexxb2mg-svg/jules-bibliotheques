notion: concevoir-creer-realiser-pieces
titre: "Concevoir, créer et réaliser une pièce musicale"
matiere: education-musicale
niveau: 3e
auteurs: ["hermes-em1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-em1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Musique assistée par ordinateur »", url: "https://fr.wikipedia.org/w/index.php?title=Musique_assist%C3%A9e_par_ordinateur&oldid=239631594", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: intention, titre: "Intention", sous_titre: "une ambiance, une histoire", principal: true}
      - {id: choix, titre: "Choix des sons", sous_titre: "instruments, voix, objets, numérique"}
      - {id: essais, titre: "Essais successifs", sous_titre: "tester, écouter, ajuster"}
      - {id: fixation, titre: "Fixation", sous_titre: "enregistrement ou notation"}
    liens:
      - {de: intention, vers: choix}
      - {de: choix, vers: essais}
      - {de: essais, vers: fixation}
    jules: "Concevoir une pièce, c'est passer d'une **intention** à une réalisation concrète, par des choix successifs de sons et de structure."

  - id: schema
    type: schema
    titre: "De l'intention à la pièce fixée, par essais successifs"
    svg: "concevoir-creer-realiser-pieces.svg"
    jules: "On teste une idée, on l'écoute, on la garde ou on la modifie : la pièce se construit par **essais successifs**, pas d'un seul coup."

  - id: methode
    type: methode
    etapes:
      - "Définir d'abord une intention claire (une ambiance, une histoire, une émotion)."
      - "Choisir les sons ou instruments qui peuvent servir cette intention."
      - "Construire la pièce par essais successifs, en réécoutant régulièrement."
      - "Fixer la version finale (enregistrement, notation simple) pour pouvoir la rejouer."
    jules: "La réalisation finale doit être **fixée** d'une manière ou d'une autre (partition simple, enregistrement, fichier numérique) pour être partagée."

  - id: piege
    type: piege
    mauvaise_idee: "Accumuler trop de sons différents sans intention claire."
    pourquoi_faux: "Sans **intention** de départ, les sons s'accumulent sans logique et la pièce devient confuse pour l'auditeur."
    bonne_idee: "Fixer d'abord l'intention (l'ambiance recherchée), puis choisir seulement les sons qui la servent."
    jules: "Ne jamais réécouter son travail en cours de création est un autre piège : c'est en réécoutant qu'on repère ce qui ne fonctionne pas."

  - id: exemple
    type: exemple
    situation: "Créer une courte bande sonore pour illustrer l'ambiance d'une forêt la nuit."
    calcul: "Choisir des sons évoquant ce thème (souffle imitant le vent, petites percussions pour des craquements, une voix chuchotée), les organiser dans une progression (calme puis un bruit soudain)."
    conclusion: "Enregistrer le résultat avec un téléphone **fixe** la pièce et permet de la réécouter ou de la partager."
    jules: "Une bande-son réussie se reconnaît si une personne qui l'écoute devine approximativement l'**ambiance** recherchée."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "intention, MAO, enregistrement", outil: "lexique"}
    jules: "Enregistre deux versions d'une même phrase musicale en changeant un seul paramètre (tempo ou instrument) pour bien isoler son effet."
