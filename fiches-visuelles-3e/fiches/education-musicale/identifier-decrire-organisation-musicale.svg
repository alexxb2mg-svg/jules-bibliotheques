<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repérer les parties qui se répètent et celles qui contrastent dans une chanson">
<text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central">Organisation d'une chanson : répétition et contraste</text>

<rect x="20" y="60" width="90" height="60" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text class="ts" x="65" y="90" text-anchor="middle" dominant-baseline="central">intro</text>

<rect x="120" y="60" width="90" height="60" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text class="ts" x="165" y="90" text-anchor="middle" dominant-baseline="central">couplet 1</text>

<rect x="220" y="60" width="90" height="60" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="ts" x="265" y="90" text-anchor="middle" dominant-baseline="central">refrain</text>

<rect x="320" y="60" width="90" height="60" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text class="ts" x="365" y="90" text-anchor="middle" dominant-baseline="central">couplet 2</text>

<rect x="420" y="60" width="90" height="60" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="ts" x="465" y="90" text-anchor="middle" dominant-baseline="central">refrain</text>

<rect x="520" y="60" width="90" height="60" rx="6" fill="#F3E9D2" stroke="#8A6D1F" stroke-width="1.5"/>
<text class="ts" x="565" y="90" text-anchor="middle" dominant-baseline="central">coda</text>

<rect x="20" y="150" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="ts" x="40" y="157" text-anchor="start" dominant-baseline="central">refrain (répétition, identique)</text>
<rect x="20" y="175" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text class="ts" x="40" y="182" text-anchor="start" dominant-baseline="central">couplet (contraste, paroles différentes)</text>

<g class="c-gray"><rect x="20" y="205" width="640" height="45" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="228" text-anchor="middle" dominant-baseline="central">Le refrain, identique, est l'élément stable ; les couplets apportent la variation.</text></g>
</svg>
