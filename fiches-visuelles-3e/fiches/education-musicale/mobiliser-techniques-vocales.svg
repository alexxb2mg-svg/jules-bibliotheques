<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Respirer par le ventre plutôt que forcer avec la gorge">
<text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central">Respiration : bon soutien contre gorge forcée</text>

<g class="node c-teal"><rect x="40" y="55" width="280" height="180" rx="10" stroke-width="1.5"/></g>
<text class="th" x="180" y="80" text-anchor="middle" dominant-baseline="central">Respiration par le ventre</text>
<circle cx="180" cy="150" r="45" fill="#CCFBF1" stroke="#0D9488" stroke-width="2"/>
<text class="ts" x="180" y="150" text-anchor="middle" dominant-baseline="central">ventre</text>
<text class="ts" x="180" y="168" text-anchor="middle" dominant-baseline="central">se gonfle</text>
<text class="t" x="180" y="205" text-anchor="middle" dominant-baseline="central">air géré, voix libre</text>

<g class="node c-coral"><rect x="360" y="55" width="280" height="180" rx="10" stroke-width="1.5"/></g>
<text class="th" x="500" y="80" text-anchor="middle" dominant-baseline="central">Forçage à la gorge</text>
<circle cx="500" cy="150" r="45" fill="#FAECE7" stroke="#993C1D" stroke-width="2"/>
<line x1="475" y1="125" x2="525" y2="175" stroke="#993C1D" stroke-width="3"/>
<line x1="525" y1="125" x2="475" y2="175" stroke="#993C1D" stroke-width="3"/>
<text class="t" x="500" y="205" text-anchor="middle" dominant-baseline="central">voix rauque, fatigue</text>

<text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central">Une main sur le ventre permet de vérifier qu'il se gonfle bien en inspirant.</text>
</svg>
