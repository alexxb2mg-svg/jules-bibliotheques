notion: identifier-decrire-organisation-musicale
titre: "Identifier et décrire une organisation musicale complexe"
matiere: education-musicale
niveau: 3e
auteurs: ["hermes-em1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-em1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Forme musicale »", url: "https://fr.wikipedia.org/w/index.php?title=Forme_musicale&oldid=238830203", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: organisation, titre: "Organisation musicale", sous_titre: "répétitions et contrastes", principal: true}
      - {id: repetition, titre: "Répétition", sous_titre: "un refrain, un motif"}
      - {id: contraste, titre: "Contraste", sous_titre: "un changement, une nouveauté"}
      - {id: vocabulaire, titre: "Vocabulaire de structure", sous_titre: "couplet, refrain, pont"}
    liens:
      - {de: organisation, vers: repetition}
      - {de: organisation, vers: contraste}
      - {de: organisation, vers: vocabulaire}
    jules: "Une œuvre s'organise dans le temps avec des éléments qui **reviennent à l'identique** et d'autres qui **varient ou contrastent**."

  - id: schema
    type: schema
    titre: "Repérer les parties qui se répètent et celles qui contrastent"
    svg: "identifier-decrire-organisation-musicale.svg"
    jules: "Le **refrain** revient à l'identique ; chaque **couplet** apporte une variation, souvent sur les paroles."

  - id: graphe
    type: graphe
    gabarit: forme-musicale
    curseurs:
      - {id: curseur-forme, nom: forme, min: 1, max: 4, pas: 1, depart: 4}
      - {id: curseur-lecture, nom: lecture, min: 0, max: 100, pas: 5, depart: 0}
    lectures:
      - {si: "forme == 2", texte: "Forme **ABA** : la partie A revient après une partie B contrastée."}
      - {si: "forme == 3", texte: "**Couplet-refrain** : le refrain revient identique, chaque couplet apporte des paroles nouvelles."}
      - {si: "forme == 4", texte: "**Rondeau** : le refrain A revient entre des couplets toujours nouveaux, B puis C."}
      - {si: "lecture >= 90 && forme >= 2", texte: "Fin du morceau : la dernière partie est une partie **déjà entendue**, qui revient."}
    jules: "Avance la tête de lecture comme pendant une écoute : quand une couleur déjà vue se rallume, c'est une **répétition** ; une couleur nouvelle, c'est un **contraste**."

  - id: methode
    type: methode
    etapes:
      - "Écouter l'œuvre en entier une première fois sans rien noter."
      - "Réécouter en repérant les moments qui se répètent à l'identique."
      - "Repérer ensuite les moments qui changent ou contrastent avec ce qui précède."
      - "Nommer les grandes parties repérées avec un vocabulaire adapté (introduction, couplet, refrain…)."
    jules: "Cette organisation s'appuie sur des **paramètres du son** (hauteur, durée, timbre, intensité) qui changent ensemble ou séparément."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre une simple répétition de mélodie et un vrai contraste structurel."
    pourquoi_faux: "Une mélodie qui revient à l'identique est une **répétition** ; un vrai contraste change plusieurs paramètres du son en même temps."
    bonne_idee: "Comparer précisément deux passages avant de conclure : mélodie, rythme et instrumentation sont-ils vraiment différents ?"
    jules: "Décrire l'organisation d'un morceau seulement à partir des paroles, sans écouter la musique, est un autre piège fréquent."

  - id: exemple
    type: exemple
    situation: "Une chanson commence par une courte introduction instrumentale, suivie d'un couplet, d'un refrain qui revient identique deux fois, puis d'un second couplet, et se termine par le refrain répété."
    calcul: "On peut décrire l'organisation ainsi : introduction – couplet 1 – refrain – couplet 2 – refrain (répété)."
    conclusion: "Le **refrain** identique aux deux passages est l'élément stable ; les couplets apportent la variation."
    jules: "Noter l'ordre des parties avec des lettres (A pour refrain, B pour couplet) aide à visualiser l'organisation d'un coup d'œil."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "introduction, couplet, refrain, coda", outil: "lexique"}
    jules: "Écoute une chanson que tu connais bien et note l'ordre de ses grandes parties avec des lettres : c'est un bon entraînement."
