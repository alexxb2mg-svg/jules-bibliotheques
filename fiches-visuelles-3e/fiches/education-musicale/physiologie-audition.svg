<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="flecheaudi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
  </marker>
</defs>
<text class="th" x="170" y="26" text-anchor="middle">Le trajet du son dans l'oreille</text>

<g class="node c-blue"><rect x="20" y="50" width="130" height="50" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="85" y="70" text-anchor="middle" dominant-baseline="central">Oreille externe</text>
<text class="ts" x="85" y="88" text-anchor="middle" dominant-baseline="central">capte le son</text></g>

<line x1="150" y1="75" x2="185" y2="75" stroke="#374151" stroke-width="1.5" marker-end="url(#flecheaudi)"/>

<g class="node c-teal"><rect x="185" y="50" width="130" height="50" rx="8" stroke="#0d9488" stroke-width="1.5"/>
<text class="ts" x="250" y="70" text-anchor="middle" dominant-baseline="central">Oreille moyenne</text>
<text class="ts" x="250" y="88" text-anchor="middle" dominant-baseline="central">transmet les vibrations</text></g>

<line x1="315" y1="75" x2="350" y2="75" stroke="#374151" stroke-width="1.5" marker-end="url(#flecheaudi)"/>

<g class="node c-coral"><rect x="350" y="50" width="150" height="50" rx="8" stroke="#c94b4b" stroke-width="1.5"/>
<text class="ts" x="425" y="70" text-anchor="middle" dominant-baseline="central">Oreille interne</text>
<text class="ts" x="425" y="88" text-anchor="middle" dominant-baseline="central">signaux nerveux, cerveau</text></g>

<g class="c-gray"><rect x="40" y="130" width="600" height="50" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="155" text-anchor="middle" dominant-baseline="central">Les cellules de l'oreille interne ne se régénèrent pas</text></g>

<text class="th" x="340" y="210" text-anchor="middle">Échelle de risque en décibels (dB)</text>
<g class="node c-blue"><rect x="60" y="230" width="140" height="40" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="130" y="250" text-anchor="middle" dominant-baseline="central">Conversation</text>
<text class="ts" x="130" y="267" text-anchor="middle" dominant-baseline="central">≈ 60 dB</text></g>

<g class="node c-amber"><rect x="270" y="230" width="140" height="40" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
<text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">Rue bruyante</text>
<text class="ts" x="340" y="267" text-anchor="middle" dominant-baseline="central">≈ 80 dB</text></g>

<g class="node c-coral"><rect x="480" y="230" width="140" height="40" rx="8" stroke="#c94b4b" stroke-width="1.5"/>
<text class="ts" x="550" y="250" text-anchor="middle" dominant-baseline="central">Concert</text>
<text class="ts" x="550" y="267" text-anchor="middle" dominant-baseline="central">&gt; 100 dB</text></g>

<text class="ts" x="340" y="300" text-anchor="middle">Plus le nombre de dB augmente, plus le danger pour l'audition augmente</text>
</svg>
