<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les étapes d'un projet musical, de l'apprentissage individuel à la restitution">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central">Un projet musical, étape par étape</text>

<g class="node c-blue"><rect x="20" y="70" width="140" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="90" y="96" text-anchor="middle" dominant-baseline="central">Apprentissage</text>
<text class="t" x="90" y="116" text-anchor="middle" dominant-baseline="central">individuel</text>
<text class="ts" x="90" y="134" text-anchor="middle" dominant-baseline="central">sa partie, seul</text>

<line x1="160" y1="105" x2="200" y2="105" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal"><rect x="200" y="70" width="140" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="270" y="96" text-anchor="middle" dominant-baseline="central">Répétitions</text>
<text class="t" x="270" y="116" text-anchor="middle" dominant-baseline="central">collectives</text>
<text class="ts" x="270" y="134" text-anchor="middle" dominant-baseline="central">écouter les autres</text>

<line x1="340" y1="105" x2="380" y2="105" class="arr" marker-end="url(#arrow)"/>

<g class="node c-amber"><rect x="380" y="70" width="140" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="450" y="96" text-anchor="middle" dominant-baseline="central">Ajustements</text>
<text class="ts" x="450" y="116" text-anchor="middle" dominant-baseline="central">tempo, nuances</text>
<text class="ts" x="450" y="134" text-anchor="middle" dominant-baseline="central">passages difficiles</text>

<line x1="520" y1="105" x2="560" y2="105" class="arr" marker-end="url(#arrow)"/>

<g class="node c-coral"><rect x="560" y="70" width="100" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="610" y="96" text-anchor="middle" dominant-baseline="central">Restitution</text>
<text class="ts" x="610" y="116" text-anchor="middle" dominant-baseline="central">devant un</text>
<text class="ts" x="610" y="134" text-anchor="middle" dominant-baseline="central">public</text>

<g class="c-gray"><rect x="20" y="190" width="640" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="215" text-anchor="middle" dominant-baseline="central">La restitution se prépare : entrées, silence avant de commencer.</text>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">C'est un moment du projet à part entière, pas seulement son résultat.</text></g>
</svg>
