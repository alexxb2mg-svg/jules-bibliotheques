sources:
  - {titre: "Vikidia, « Voix »", url: "https://fr.vikidia.org/w/index.php?title=Voix&oldid=2441249", licence: CC-BY-SA-3.0}
  - {titre: "Wikipédia, « Timbre (musique) »", url: "https://fr.wikipedia.org/w/index.php?title=Timbre_%28musique%29&oldid=230099700", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
abreviations: {tessiture: "étendue des notes qu'une voix peut chanter confortablement"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: technique, titre: "Technique vocale", sous_titre: "respiration, justesse, diction", principal: true}
      - {id: respiration, titre: "Respiration", sous_titre: "par le ventre, air géré"}
      - {id: justesse, titre: "Justesse", sous_titre: "hauteur, repère sonore"}
      - {id: tessiture, titre: "Tessiture", sous_titre: "limites naturelles de la voix"}
    liens:
      - {de: technique, vers: respiration}
      - {de: technique, vers: justesse}
      - {de: technique, vers: tessiture}
    jules: "Chaque voix a une **tessiture** propre : forcer en dehors de ses limites naturelles peut faire mal, mieux vaut la respecter."

  - id: schema
    type: schema
    titre: "Respirer par le ventre plutôt que forcer avec la gorge"
    svg: "mobiliser-techniques-vocales.svg"
    jules: "L'air part du **ventre**, pas de la gorge : forcer avec la gorge fatigue la voix et la rend rauque."

  - id: methode
    type: methode
    etapes:
      - "S'échauffer la voix quelques minutes avant de chanter (sons tenus, petits exercices)."
      - "Contrôler sa respiration : inspirer par le ventre, ne pas bloquer l'air dans la gorge."
      - "Écouter un repère sonore avant de chanter une note pour viser la bonne hauteur."
      - "Articuler clairement les paroles sans crier, en laissant la voix se projeter naturellement."
    jules: "La **diction** (articuler clairement) et la **projection** (faire porter sa voix sans crier) se travaillent, surtout à l'échauffement."

  - id: piege
    type: piege
    mauvaise_idee: "Forcer avec la gorge pour chanter fort au lieu de bien respirer."
    pourquoi_faux: "Forcer la gorge fatigue les cordes vocales et rend la voix rauque : le volume doit venir d'une bonne **respiration**, pas d'un effort de gorge."
    bonne_idee: "Chanter avec une respiration ample par le ventre, en laissant la voix se projeter sans la pousser artificiellement."
    jules: "Chanter sans s'échauffer la voix est un autre piège fréquent : quelques minutes d'échauffement préparent les cordes vocales."

  - id: exemple
    type: exemple
    situation: "Un élève chante trop fort et sa voix devient rauque après quelques minutes."
    calcul: "Le problème vient probablement d'un forçage de la gorge plutôt que d'un bon soutien par la respiration."
    conclusion: "Mieux vaut chanter avec une **respiration ample** par le ventre, et laisser la voix se projeter sans la pousser."
    jules: "Une main posée sur le ventre permet de sentir s'il se gonfle bien en inspirant : un bon moyen de vérifier sa respiration."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "tessiture, diction, projection", outil: "lexique"}
    jules: "Avant de chanter une chanson, fais 1 minute d'échauffement vocal en contrôlant ta **respiration** : la différence s'entend vite."
