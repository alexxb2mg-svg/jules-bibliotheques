notion: presenter-justifier-choix
titre: "Présenter et justifier des choix d'interprétation ou de création"
matiere: education-musicale
niveau: 3e
auteurs: ["hermes-em1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-em1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Genre musical »", url: "https://fr.wikipedia.org/w/index.php?title=Genre_musical&oldid=236954603", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: presentation, titre: "Présenter une création", sous_titre: "vocabulaire précis, intention", principal: true}
      - {id: reecoute, titre: "Réécoute préalable", sous_titre: "avant de présenter"}
      - {id: justification, titre: "Justification", sous_titre: "pourquoi ce choix sert l'intention"}
      - {id: questions, titre: "Questions du public", sous_titre: "être prêt à répondre"}
    liens:
      - {de: presentation, vers: reecoute}
      - {de: presentation, vers: justification}
      - {de: presentation, vers: questions}
    jules: "Il ne suffit pas de dire ce qu'on a fait : il faut **justifier** pourquoi ce choix sert l'intention recherchée."

  - id: schema
    type: schema
    titre: "Présenter une création : décrire, puis justifier"
    svg: "presenter-justifier-choix.svg"
    jules: "Une bonne présentation répond à trois questions : ce qui a été fait, comment, et surtout **pourquoi**."

  - id: methode
    type: methode
    etapes:
      - "Réécouter sa production avant de la présenter pour bien s'en souvenir."
      - "Préparer deux ou trois phrases : ce qui a été fait, comment, et pourquoi."
      - "Utiliser un vocabulaire musical précis (tempo, nuance, timbre) plutôt qu'un vocabulaire vague."
      - "Être prêt à répondre à une question sur un choix qui pourrait surprendre."
    jules: "Cette compétence est proche de celle mobilisée en arts plastiques ou en histoire des arts : **verbaliser une démarche** avec un vocabulaire adapté."

  - id: piege
    type: piege
    mauvaise_idee: "Décrire sa création sans jamais dire pourquoi tel choix a été fait."
    pourquoi_faux: "Décrire seulement ce qui a été fait n'explique pas l'**intention** : le public ne comprend pas le sens des choix."
    bonne_idee: "Toujours relier chaque choix technique à l'intention qu'il sert (par exemple un tempo lent pour évoquer le calme)."
    jules: "Utiliser uniquement des mots vagues (« c'est joli ») au lieu de termes précis est un autre piège fréquent."

  - id: exemple
    type: exemple
    situation: "Un élève présente une petite création avec un tempo très lent et des sons graves."
    calcul: "« J'ai choisi un tempo lent et des sons graves parce que je voulais évoquer la nuit et le calme »."
    conclusion: "Un **tempo rapide** aurait donné une impression d'agitation contraire à ce qui était recherché : la justification rend le choix compréhensible."
    jules: "Relier un choix technique à son contraire (que se serait-il passé avec un tempo rapide ?) rend la justification plus convaincante."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "intention, tempo, nuance, timbre", outil: "lexique"}
    jules: "Choisis une création que tu as faite et écris trois phrases : ce que tu as fait, comment, pourquoi. Utilise au moins deux termes musicaux précis."
