notion: apports-numerique-creation-diffusion
titre: "Apports du numérique à la création et à la diffusion musicales"
matiere: education-musicale
niveau: 3e
auteurs: ["hermes-em2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-em2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Musique assistée par ordinateur »", url: "https://fr.wikipedia.org/w/index.php?title=Musique_assist%C3%A9e_par_ordinateur&oldid=239631594", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
abreviations: {MAO: "musique assistée par ordinateur"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: mao, titre: "MAO", sous_titre: "musique assistée par ordinateur", principal: true}
      - {id: enregistrement, titre: "Enregistrement", sous_titre: "capter les sons"}
      - {id: pistes, titre: "Pistes multiples", sous_titre: "superposer, corriger"}
      - {id: diffusion, titre: "Diffusion en ligne", sous_titre: "partage instantané"}
    liens:
      - {de: mao, vers: enregistrement}
      - {de: mao, vers: pistes}
      - {de: mao, vers: diffusion}
    jules: "La **MAO** couvre toute la chaîne : composer, enregistrer, modifier des sons, jusqu'à la diffusion finale de l'œuvre."

  - id: schema
    type: schema
    titre: "De l'enregistrement à la diffusion en ligne"
    svg: "apports-numerique-creation-diffusion.svg"
    jules: "Superposer plusieurs **pistes** enregistrées séparément, puis les réécouter et les ajuster, est un montage impossible sans outil numérique."

  - id: graphe
    type: graphe
    gabarit: pistes-superposees
    curseurs:
      - {id: curseur-voix, nom: voix, min: 1, max: 4, pas: 1, depart: 3}
      - {id: curseur-lecture, nom: lecture, min: 0, max: 100, pas: 5, depart: 25}
    lectures:
      - {si: "voix == 1", texte: "Une seule piste : c'est le son **capté**, tel qu'il a été enregistré."}
      - {si: "voix >= 2", texte: "Les pistes s'empilent : le logiciel **organise les sons dans le temps**, c'est une séquence."}
      - {si: "voix >= 3", texte: "Chaque piste se règle à part (volume, effets) avant d'être mélangée aux autres : c'est le **mixage**."}
      - {si: "lecture >= 50", texte: "Les mêmes blocs reviennent : une **boucle** copiée-collée, ce que le numérique rend rapide."}
    jules: "Un logiciel de musique range le son en **pistes** : on capte, on manipule, on organise dans le temps, puis on diffuse."

  - id: methode
    type: methode
    etapes:
      - "Choisir un outil numérique adapté au projet (enregistreur simple, logiciel de composition)."
      - "Enregistrer ou créer les sons nécessaires, éventuellement sur plusieurs pistes séparées."
      - "Réécouter et ajuster (volume, ordre, effets) avant de considérer la pièce terminée."
      - "Vérifier les droits d'utilisation de tout son ou extrait emprunté avant de le partager."
    jules: "Le numérique permet aussi de créer des sons qui **n'existent pas dans la nature**, grâce à la synthèse sonore."

  - id: piege
    type: piege
    mauvaise_idee: "Partager en ligne un extrait musical emprunté sans vérifier s'il en a le droit."
    pourquoi_faux: "Un morceau protégé par le **droit d'auteur** ne peut pas être réutilisé librement sans autorisation ou licence adaptée, même dans une création personnelle."
    bonne_idee: "Vérifier systématiquement les droits d'un son emprunté avant de le partager, ou s'inspirer sans le copier directement."
    jules: "Sauvegarder son travail au fur et à mesure évite de perdre des heures de montage en cas de problème technique."

  - id: exemple
    type: exemple
    situation: "Un élève enregistre sa voix sur une piste, puis ajoute une deuxième piste avec un rythme créé sur une application."
    calcul: "L'enregistrement de la voix et la création du rythme sont faits séparément puis superposés grâce au logiciel."
    conclusion: "Ce montage à plusieurs **pistes** serait beaucoup plus difficile à réaliser sans outil numérique."
    jules: "Les applications d'enregistrement basiques permettent souvent de couper le début ou la fin d'un fichier."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "MAO, piste, synthèse sonore", outil: "lexique"}
    jules: "Enregistre un petit son avec ton téléphone, puis essaie de le réécouter en ajustant le volume ou en le recadrant."
