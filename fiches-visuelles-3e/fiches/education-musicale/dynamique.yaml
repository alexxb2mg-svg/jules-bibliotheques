blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: dynamique, titre: "Dynamique", sous_titre: "variations d'intensité", principal: true}
      - {id: nuances, titre: "Nuances", sous_titre: "piano, forte"}
      - {id: evolution, titre: "Crescendo, decrescendo", sous_titre: "évolution progressive"}
      - {id: decibel, titre: "Décibel", sous_titre: "mesure de l'intensité"}
    liens:
      - {de: dynamique, vers: nuances}
      - {de: dynamique, vers: evolution}
      - {de: dynamique, vers: decibel}
    jules: "La **dynamique** ne change pas la vitesse (le tempo), seulement l'intensité : un morceau peut ralentir sans devenir plus doux, ou l'inverse."

  - id: schema
    type: schema
    titre: "Une dynamique en arc : piano → crescendo → forte → decrescendo"
    svg: "dynamique.svg"
    jules: "Le **crescendo** est une montée progressive, pas un saut brutal : c'est cette progression qui crée la tension avant le passage forte."

  - id: methode
    type: methode
    etapes:
      - "Écouter un extrait en repérant les moments où le son devient plus fort ou plus doux."
      - "Distinguer un changement brusque d'intensité d'une évolution progressive (crescendo/decrescendo)."
      - "Relier la dynamique observée à l'effet ou à l'émotion qu'elle produit."
      - "Utiliser les termes précis (piano, forte, crescendo) plutôt que « fort » et « doux » seulement."
    jules: "Le **décibel** mesure l'intensité, mais son échelle n'est pas linéaire : une petite augmentation en dB peut correspondre à un son perçu beaucoup plus fort."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre un changement de tempo (plus vite) avec un changement de dynamique (plus fort)."
    pourquoi_faux: "Le tempo décrit la **vitesse** de la pulsation, la dynamique décrit l'**intensité** du son : les deux peuvent varier indépendamment l'une de l'autre."
    bonne_idee: "Se demander séparément « est-ce plus rapide ? » (tempo) et « est-ce plus fort ? » (dynamique) en écoutant un extrait."
    jules: "Un crescendo est souvent discret au début : sois attentif dès les premières mesures pour ne pas le manquer."

  - id: exemple
    type: exemple
    situation: "Une pièce commence très doucement (piano), puis grossit progressivement jusqu'à un passage très fort (forte) avant de revenir au calme."
    calcul: "On décrit cette évolution ainsi : piano – crescendo – forte – decrescendo – piano."
    conclusion: "Cette dynamique en arc crée un effet de **tension** qui monte puis retombe, sans que le tempo ait forcément changé."
    jules: "Les musiques de film utilisent souvent des crescendos pour créer du suspense avant un moment clé."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "piano, forte, crescendo, décibel", outil: "lexique"}
    jules: "Entraîne-toi à fredonner une même phrase trois fois : une fois doucement, une fois fort, une fois en **crescendo** progressif."
