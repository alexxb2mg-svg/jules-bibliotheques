notion: successif-et-simultane
titre: "Successif et simultané : polyphonie et canon"
matiere: education-musicale
niveau: 3e
auteurs: ["hermes-em2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-em2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Polyphonie »", url: "https://fr.wikipedia.org/w/index.php?title=Polyphonie&oldid=236946485", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: successif-simultane, titre: "Successif, simultané", sous_titre: "un son après l'autre, ou ensemble", principal: true}
      - {id: polyphonie, titre: "Polyphonie", sous_titre: "plusieurs mélodies ensemble"}
      - {id: canon, titre: "Canon", sous_titre: "même mélodie décalée"}
      - {id: accompagnement, titre: "Accompagnement", sous_titre: "mélodie + accords"}
    liens:
      - {de: successif-simultane, vers: polyphonie}
      - {de: polyphonie, vers: canon}
      - {de: successif-simultane, vers: accompagnement}
    jules: "Le **successif** (une ligne après l'autre) peut devenir **simultané** dès que plusieurs voix jouent en même temps, comme dans un canon."

  - id: schema
    type: schema
    titre: "Une mélodie successive, puis en canon (simultanée décalée)"
    svg: "successif-et-simultane.svg"
    jules: "Dans un **canon**, chaque voix chante la même mélodie, mais démarre après la précédente : le décalage crée la polyphonie."

  - id: graphe
    type: graphe
    gabarit: pistes-superposees
    curseurs:
      - {id: curseur-voix, nom: voix, min: 1, max: 4, pas: 1, depart: 2}
      - {id: curseur-lecture, nom: lecture, min: 0, max: 100, pas: 5, depart: 25}
      - {id: curseur-decalage, nom: decalage, min: 0, max: 4, pas: 1, depart: 0}
    lectures:
      - {si: "voix == 1", texte: "Une seule voix : les sons se **suivent**, c'est le **successif** (une monodie)."}
      - {si: "voix >= 2 && decalage == 0", texte: "Plusieurs pistes sonnent sous la barre au même moment : c'est le **simultané**, une **polyphonie**."}
      - {si: "voix >= 2 && decalage >= 1", texte: "Même mélodie, entrées décalées : c'est un **canon**, la même ligne devient simultanée avec elle-même."}
      - {si: "voix == 4 && decalage == 0", texte: "Quatre voix superposées : comme un chœur **soprano, alto, ténor, basse**."}
    jules: "Lis de gauche à droite pour le **successif** (ce qui vient après), de haut en bas pour le **simultané** (ce qui sonne ensemble sous la barre rouge)."

  - id: methode
    type: methode
    etapes:
      - "Écouter d'abord si un seul son ou plusieurs sons sont entendus en même temps."
      - "Si plusieurs sons sont simultanés, vérifier s'il s'agit de plusieurs mélodies indépendantes (polyphonie) ou d'un simple accompagnement."
      - "Repérer un canon en identifiant si la même mélodie est chantée en décalé par plusieurs voix."
      - "Comparer une écoute successive (une voix seule) et simultanée (plusieurs voix) du même thème."
    jules: "La **polyphonie** s'est développée en Europe à partir du haut Moyen Âge et a connu son plein essor jusqu'à la fin de la Renaissance."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que toute musique avec plusieurs instruments est automatiquement polyphonique."
    pourquoi_faux: "Un simple **accompagnement** d'accords, sans mélodie indépendante dans les voix secondaires, n'est pas une vraie polyphonie."
    bonne_idee: "Vérifier si chaque voix a sa propre ligne mélodique indépendante avant de parler de polyphonie."
    jules: "Repère bien le principe de décalage : c'est lui qui définit un canon, pas seulement le fait de chanter à plusieurs."

  - id: exemple
    type: exemple
    situation: "Trois groupes chantent la même comptine, mais chaque groupe démarre deux mesures après le précédent."
    calcul: "La mélodie, initialement successive (une seule ligne), devient simultanée dès que les trois groupes la chantent ensemble en décalé."
    conclusion: "C'est un **canon** : une polyphonie créée à partir d'une seule mélodie répétée en décalage."
    jules: "Choisis une comptine très connue de tous les chanteurs pour rendre le décalage plus facile à tenir."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "polyphonie, canon, successif, simultané", outil: "lexique"}
    jules: "Essaie de chanter en canon une comptine simple avec une autre personne : l'un commence, l'autre démarre deux mesures plus tard."
