blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: temps, titre: "Organisation du temps", sous_titre: "sons et silences", principal: true}
      - {id: pulsation, titre: "Pulsation", sous_titre: "battement régulier"}
      - {id: tempo, titre: "Tempo", sous_titre: "vitesse de la pulsation"}
      - {id: rythme, titre: "Rythme", sous_titre: "durées organisées"}
    liens:
      - {de: temps, vers: pulsation}
      - {de: pulsation, vers: tempo}
      - {de: temps, vers: rythme}
    jules: "La **pulsation** est le battement qu'on tape naturellement du pied ; le **tempo** dit si elle est rapide ou lente."

  - id: schema
    type: schema
    titre: "Pulsation régulière, tempo, et motif rythmique"
    svg: "temps-et-rythme.svg"
    jules: "Le **rythme** (durées longues et courtes) peut rester identique même si le **tempo** change : seule la vitesse globale varie."

  - id: methode
    type: methode
    etapes:
      - "Chercher d'abord la pulsation régulière en tapant du pied ou en comptant."
      - "Repérer ensuite le tempo : cette pulsation est-elle rapide ou lente ?"
      - "Observer comment les notes et les silences s'organisent par rapport à cette pulsation (rythme)."
      - "Comparer deux morceaux au tempo différent pour bien ressentir la distinction avec le rythme."
    jules: "Toutes les musiques n'ont pas une pulsation parfaitement régulière : certaines traditions utilisent des rythmes plus **libres**."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre le tempo (la vitesse) et le rythme (l'organisation des durées)."
    pourquoi_faux: "Le **tempo** dit si la pulsation est rapide ou lente, le **rythme** dit comment les notes longues et courtes s'enchaînent : ce sont deux notions indépendantes."
    bonne_idee: "Vérifier séparément la vitesse (tempo) et l'enchaînement des durées (rythme) avant de conclure."
    jules: "Un rythme complexe peut cacher la pulsation : commence par un morceau simple et marqué pour t'entraîner à la retrouver."

  - id: exemple
    type: exemple
    situation: "Deux versions d'une même chanson sont jouées, l'une lentement, l'autre très rapidement, mais avec exactement le même enchaînement de notes longues et courtes."
    calcul: "Le rythme (l'organisation des durées les unes par rapport aux autres) est identique dans les deux versions."
    conclusion: "Seul le **tempo** (la vitesse globale) change entre les deux versions ; le rythme reste le même."
    jules: "Vérifier qu'un rythme reste identique à deux tempos différents est un bon exercice pour bien séparer les deux notions."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "pulsation, tempo, rythme", outil: "lexique"}
    jules: "Entraîne-toi à frapper un petit motif rythmique de ton invention et à le répéter trois fois à un **tempo** stable."
