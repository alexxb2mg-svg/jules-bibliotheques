<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="170" y="26" text-anchor="middle">Forme strophique</text>
<g class="node c-blue"><rect x="30" y="50" width="90" height="40" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="75" y="70" text-anchor="middle" dominant-baseline="central">Couplet 1</text></g>
<g class="node c-blue"><rect x="140" y="50" width="90" height="40" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="185" y="70" text-anchor="middle" dominant-baseline="central">Couplet 2</text></g>
<g class="node c-blue"><rect x="250" y="50" width="90" height="40" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="295" y="70" text-anchor="middle" dominant-baseline="central">Couplet 3</text></g>
<text class="ts" x="170" y="115" text-anchor="middle">même musique, texte différent</text>

<text class="th" x="510" y="26" text-anchor="middle">Forme couplet-refrain</text>
<g class="node c-blue"><rect x="380" y="50" width="70" height="40" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="415" y="70" text-anchor="middle" dominant-baseline="central">Couplet 1</text></g>
<g class="node c-coral"><rect x="460" y="50" width="70" height="40" rx="8" stroke="#c94b4b" stroke-width="1.5"/>
<text class="ts" x="495" y="70" text-anchor="middle" dominant-baseline="central">Refrain</text></g>
<g class="node c-blue"><rect x="540" y="50" width="70" height="40" rx="8" stroke="#2563eb" stroke-width="1.5"/>
<text class="ts" x="575" y="70" text-anchor="middle" dominant-baseline="central">Couplet 2</text></g>
<g class="node c-coral"><rect x="620" y="50" width="50" height="40" rx="8" stroke="#c94b4b" stroke-width="1.5"/>
<text class="ts" x="645" y="70" text-anchor="middle" dominant-baseline="central">...</text></g>
<text class="ts" x="510" y="115" text-anchor="middle">le refrain (partie contrastante) revient</text>

<g class="c-gray"><rect x="40" y="160" width="600" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="185" text-anchor="middle" dominant-baseline="central">Genre ≠ forme :</text>
<text class="ts" x="340" y="210" text-anchor="middle" dominant-baseline="central">le genre catégorise (sonate, blues), la forme organise la pièce</text></g>

<g class="node c-amber"><rect x="220" y="255" width="240" height="55" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
<text class="t" x="340" y="277" text-anchor="middle" dominant-baseline="central">Une œuvre plus complexe :</text>
<text class="ts" x="340" y="297" text-anchor="middle" dominant-baseline="central">plusieurs mouvements (ex. symphonie)</text></g>
</svg>
