  - {titre: "Wikipédia, « Forme musicale »", url: "https://fr.wikipedia.org/w/index.php?title=Forme_musicale&oldid=238830203", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: forme, titre: "Forme musicale", sous_titre: "structure de l'œuvre", principal: true}
      - {id: strophique, titre: "Forme strophique", sous_titre: "même motif répété"}
      - {id: couplet-refrain, titre: "Couplet-refrain", sous_titre: "partie contrastante"}
      - {id: genre, titre: "Genre", sous_titre: "catégorie, différent de la forme"}
    liens:
      - {de: forme, vers: strophique}
      - {de: forme, vers: couplet-refrain}
      - {de: forme, vers: genre, libelle: "à ne pas confondre"}
    jules: "Ne confonds pas la **forme** (l'organisation interne d'une pièce) et le **genre** (sa catégorie, comme la sonate ou le blues)."

  - id: schema
    type: schema
    titre: "Forme strophique et forme couplet-refrain"
    svg: "forme.svg"
    jules: "Dans une **forme strophique**, seul le texte change à chaque couplet ; dans la forme couplet-refrain, une partie contrastante revient à l'identique."

  - id: graphe
    type: graphe
    gabarit: forme-musicale
    curseurs:
      - {id: curseur-forme, nom: forme, min: 1, max: 4, pas: 1, depart: 2}
      - {id: curseur-lecture, nom: lecture, min: 0, max: 100, pas: 5, depart: 0}
    lectures:
      - {si: "forme == 1", texte: "Forme **AB** : deux parties différentes, sans retour."}
      - {si: "forme == 2", texte: "Forme **ABA** : A revient identique après B, même couleur, même musique."}
      - {si: "forme == 3", texte: "**Couplet-refrain** : le refrain revient avec les mêmes paroles, les couplets changent."}
      - {si: "forme == 4", texte: "**Rondeau** : le refrain A revient entre des couplets différents, B puis C."}
    jules: "Même lettre, même couleur, même musique : la **forme** se lit dans ce qui revient. Le genre (sonate, blues…) ne se voit pas ici, c'est une autre question."

  - id: methode
    type: methode
    etapes:
      - "Écouter l'œuvre en repérant les grandes sections (changements de thème, de tempo, d'instrumentation)."
      - "Vérifier si un même motif ou thème revient à l'identique (forme strophique ou couplet-refrain)."
      - "Distinguer la forme (structure) du genre (catégorie), qui sont deux informations différentes."
      - "Nommer la forme repérée avec le vocabulaire adapté si elle correspond à une forme connue."
    jules: "Une **forme** peut s'analyser à plusieurs niveaux : l'œuvre entière, puis chaque mouvement, puis les phrases plus courtes à l'intérieur."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre le genre musical (par exemple « une sonate ») et la forme (l'organisation interne de la pièce)."
    pourquoi_faux: "Le **genre** catégorise un type de musique, la **forme** décrit l'organisation interne d'une pièce précise : un même genre peut contenir plusieurs formes."
    bonne_idee: "Demander séparément « quel genre ? » et « quelle forme (organisation) ? » pour ne pas mélanger les deux réponses."
    jules: "Une chanson n'est pas forcément en couplet-refrain : beaucoup d'œuvres suivent d'autres organisations."

  - id: exemple
    type: exemple
    situation: "Une chanson répète exactement la même mélodie pour chaque nouveau couplet, seules les paroles changent."
    calcul: "La structure musicale reste identique d'un couplet à l'autre, seul le texte varie."
    conclusion: "Il s'agit d'une **forme strophique**, différente d'une forme couplet-refrain où une partie contrastante revient entre les couplets."
    jules: "Compare toujours la musique du premier couplet à celle du deuxième pour vérifier s'ils sont identiques."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "forme strophique, couplet-refrain, genre", outil: "lexique"}
    jules: "Cherche un exemple de **genre** (le rap) et un exemple de **forme** (le couplet-refrain) pour bien fixer la différence."
