<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Présenter une création : décrire ce qui a été fait, puis justifier pourquoi">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central">Présenter une création : quoi, comment, pourquoi</text>

<g class="node c-blue"><rect x="30" y="55" width="180" height="80" rx="8" stroke-width="1.5"/></g>
<text class="th" x="120" y="80" text-anchor="middle" dominant-baseline="central">Quoi ?</text>
<text class="ts" x="120" y="105" text-anchor="middle" dominant-baseline="central">ce qui a été fait</text>

<line x1="210" y1="95" x2="245" y2="95" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal"><rect x="245" y="55" width="190" height="80" rx="8" stroke-width="1.5"/></g>
<text class="th" x="340" y="80" text-anchor="middle" dominant-baseline="central">Comment ?</text>
<text class="ts" x="340" y="105" text-anchor="middle" dominant-baseline="central">tempo, nuance, timbre</text>

<line x1="435" y1="95" x2="470" y2="95" class="arr" marker-end="url(#arrow)"/>

<g class="node c-coral"><rect x="470" y="55" width="180" height="80" rx="8" stroke-width="1.5"/></g>
<text class="th" x="560" y="80" text-anchor="middle" dominant-baseline="central">Pourquoi ?</text>
<text class="ts" x="560" y="105" text-anchor="middle" dominant-baseline="central">intention justifiée</text>

<g class="c-gray"><rect x="30" y="170" width="620" height="70" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="195" text-anchor="middle" dominant-baseline="central">« Tempo lent et sons graves parce que je voulais évoquer le calme. »</text>
<text class="ts" x="340" y="218" text-anchor="middle" dominant-baseline="central">Décrire seul ne suffit pas : il faut relier le choix à l'intention.</text></g>
</svg>
