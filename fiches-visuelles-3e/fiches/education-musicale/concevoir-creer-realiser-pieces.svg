<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="De l'intention à la pièce fixée, par essais successifs">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central">De l'intention à la pièce musicale fixée</text>

<g class="node c-purple"><rect x="20" y="55" width="140" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="90" y="80" text-anchor="middle" dominant-baseline="central">Intention</text>
<text class="ts" x="90" y="100" text-anchor="middle" dominant-baseline="central">ambiance, histoire</text>

<line x1="160" y1="90" x2="195" y2="90" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal"><rect x="195" y="55" width="140" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="265" y="80" text-anchor="middle" dominant-baseline="central">Choix des sons</text>
<text class="ts" x="265" y="100" text-anchor="middle" dominant-baseline="central">voix, objets, numérique</text>

<line x1="335" y1="90" x2="370" y2="90" class="arr" marker-end="url(#arrow)"/>

<g class="node c-amber"><rect x="370" y="55" width="140" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="440" y="80" text-anchor="middle" dominant-baseline="central">Essais successifs</text>
<text class="ts" x="440" y="100" text-anchor="middle" dominant-baseline="central">tester, écouter, ajuster</text>

<line x1="510" y1="90" x2="545" y2="90" class="arr" marker-end="url(#arrow)"/>

<g class="node c-coral"><rect x="545" y="55" width="115" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="602" y="80" text-anchor="middle" dominant-baseline="central">Fixation</text>
<text class="ts" x="602" y="100" text-anchor="middle" dominant-baseline="central">enregistrement</text>

<path d="M440 125 V150 H265 V125" class="arr" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="167" text-anchor="middle" dominant-baseline="central">on revient choisir d'autres sons si ça ne convient pas</text>

<g class="c-gray"><rect x="40" y="195" width="600" height="50" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="220" text-anchor="middle" dominant-baseline="central">La pièce doit être fixée (enregistrement, notation) pour être rejouée ou partagée.</text></g>
</svg>
