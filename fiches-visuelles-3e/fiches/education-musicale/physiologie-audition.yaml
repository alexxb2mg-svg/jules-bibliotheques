notion: physiologie-audition
titre: "Physiologie de l'audition et risques auditifs"
matiere: education-musicale
niveau: 3e
auteurs: ["hermes-em2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-em2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Audition humaine »", url: "https://fr.wikipedia.org/w/index.php?title=Audition_humaine&oldid=231234448", licence: CC-BY-SA-4.0}
  - {titre: "Wikipédia, « Décibel »", url: "https://fr.wikipedia.org/w/index.php?title=D%C3%A9cibel&oldid=237481128", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
abreviations: {dB: "décibel, unité de mesure de l'intensité sonore"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: audition, titre: "Audition", sous_titre: "entendre et interpréter", principal: true}
      - {id: oreille, titre: "Oreille externe/moyenne/interne", sous_titre: "transmettent le son"}
      - {id: risques, titre: "Risques", sous_titre: "surdité, acouphènes"}
      - {id: protection, titre: "Protection", sous_titre: "baisser le volume"}
    liens:
      - {de: audition, vers: oreille}
      - {de: audition, vers: risques}
      - {de: risques, vers: protection}
    jules: "Les cellules sensorielles de l'oreille interne ne se **régénèrent pas** : un dommage causé par un son trop fort peut être irréversible."

  - id: schema
    type: schema
    titre: "Le trajet du son dans l'oreille, et l'échelle des risques en décibels"
    svg: "physiologie-audition.svg"
    jules: "L'oreille interne transforme les vibrations en signaux nerveux : c'est elle qui est abîmée par une exposition trop forte ou trop longue."

  - id: graphe
    type: graphe
    gabarit: jauge-decibels
    curseurs:
      - {id: curseur-niveau, nom: niveau, min: 20, max: 130, pas: 5, depart: 60}
      - {id: curseur-duree, nom: duree, min: 0.5, max: 8, pas: 0.5, depart: 1}
    lectures:
      - {si: "niveau < 80", texte: "Moins de 80 dB : **pas de risque** pour l'oreille, même longtemps. Une conversation fait environ 60 dB."}
      - {si: "niveau >= 80 && niveau < 120", texte: "Zone de **danger** : plus c'est fort, moins on peut écouter longtemps. **+3 dB**, c'est deux fois plus d'énergie, donc deux fois moins de temps sans risque."}
      - {si: "niveau >= 120", texte: "**Seuil de douleur** : l'oreille peut être abîmée tout de suite, et pour toujours."}
      - {si: "niveau >= 85 && duree >= 4", texte: "Fort et long : la **dose** du jour dépasse la limite. Fais des **pauses** ou baisse le volume."}
    jules: "duree est le temps d'écoute en heures. Monte le niveau de 5 dB seulement : la dose du jour fait plus que tripler. Les décibels ne s'additionnent pas comme des centimètres."

  - id: methode
    type: methode
    etapes:
      - "Repérer les situations à risque pour l'audition : écouteurs à fort volume, concerts, outils bruyants."
      - "Comparer les niveaux sonores en décibels de différentes situations pour évaluer leur danger."
      - "Adopter des règles simples de protection (baisser le volume, limiter la durée d'écoute, faire des pauses)."
      - "Distinguer une gêne passagère (oreilles qui sifflent après un concert) d'un dommage potentiellement durable."
    jules: "La **psychoacoustique** étudie comment le cerveau perçoit les sons : deux personnes peuvent percevoir différemment un même son selon leur âge ou leur habitude d'écoute."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'une gêne auditive après une écoute forte disparaît toujours sans conséquence."
    pourquoi_faux: "Une gêne répétée use les cellules de l'**oreille interne**, qui ne se réparent pas : le risque s'accumule même si chaque gêne semble passagère."
    bonne_idee: "Considérer chaque exposition trop forte comme un risque, même sans gêne ressentie immédiatement après."
    jules: "Le danger ne vient pas que des concerts : l'usage prolongé des écouteurs au quotidien est tout aussi risqué."

  - id: exemple
    type: exemple
    situation: "Un élève écoute de la musique avec des écouteurs au volume maximum pendant plusieurs heures par jour."
    calcul: "Ce comportement expose l'**oreille interne** à un niveau sonore élevé de façon prolongée."
    conclusion: "Le risque de perte auditive ou d'**acouphènes** augmente ; il est conseillé de baisser le volume et de faire des pauses régulières."
    jules: "Une conversation normale se situe autour de 60 dB ; un concert peut dépasser 100 dB, un écart énorme sur l'échelle des décibels."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "décibel, acouphène, oreille interne", outil: "lexique"}
    jules: "Observe le volume auquel tu écoutes habituellement de la musique et essaie de le réduire d'un quart pendant une journée."
