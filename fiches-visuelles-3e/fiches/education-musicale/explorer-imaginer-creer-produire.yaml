notion: explorer-imaginer-creer-produire
titre: "Explorer, imaginer, créer et produire"
matiere: education-musicale
niveau: 3e
auteurs: ["hermes-em1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-em1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Improvisation musicale »", url: "https://fr.wikipedia.org/w/index.php?title=Improvisation_musicale&oldid=235150649", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: exploration, titre: "Exploration sonore", sous_titre: "voix, instruments, objets", principal: true}
      - {id: improvisation, titre: "Improvisation", sous_titre: "création spontanée, règles fixées"}
      - {id: organisation, titre: "Organisation dans le temps", sous_titre: "début, développement, fin"}
    liens:
      - {de: exploration, vers: improvisation}
      - {de: exploration, vers: organisation}
    jules: "L'**improvisation** n'est pas totalement libre : elle part toujours de règles simples fixées à l'avance (une gamme, un nombre de mesures)."

  - id: schema
    type: schema
    titre: "De l'exploration sonore à une petite pièce organisée"
    svg: "explorer-imaginer-creer-produire.svg"
    jules: "Une petite pièce se construit par étapes : choisir des sons, les **organiser** dans le temps, puis rejouer et ajuster."

  - id: methode
    type: methode
    etapes:
      - "Choisir un petit nombre de sons ou d'instruments avant de commencer à composer."
      - "Fixer une règle simple pour l'improvisation (une note de départ, un nombre de temps)."
      - "Organiser les sons choisis dans un ordre qui a un début, un milieu et une fin."
      - "Rejouer et ajuster la pièce plusieurs fois avant de la considérer terminée."
    jules: "Le geste de création s'appuie souvent sur l'**écoute d'œuvres existantes**, qui donnent des idées de structure ou de timbre à réinvestir."

  - id: piege
    type: piege
    mauvaise_idee: "Vouloir utiliser trop de sons différents dès le départ."
    pourquoi_faux: "Une pièce avec trop de sons différents devient confuse : l'auditeur ne repère plus d'organisation ni de fil conducteur."
    bonne_idee: "Choisir un petit nombre de sons, puis les organiser clairement (répétition, puis variation) plutôt que d'en accumuler."
    jules: "Improviser sans aucune règle rend aussi le résultat difficile à structurer : même une règle très simple aide à donner une forme."

  - id: exemple
    type: exemple
    situation: "Créer un rythme court avec trois objets sonores du quotidien (une boîte, un stylo qui tape, des mains)."
    calcul: "Choisir un ordre fixe pour les trois sons, le répéter deux fois à l'identique, puis varier la troisième fois."
    conclusion: "Cela donne déjà une petite forme avec **répétition** et **variation**, deux principes utilisés en composition."
    jules: "Répéter d'abord à l'identique avant de varier permet à l'auditeur de bien reconnaître le motif de départ."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "improvisation, composition, motif", outil: "lexique"}
    jules: "Entraîne-toi à improviser sur seulement 3 notes différentes : garder les mêmes sons du début à la fin donne déjà de la cohérence."
