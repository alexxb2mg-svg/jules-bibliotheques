<svg width="100%" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="De l'exploration sonore à une petite pièce organisée dans le temps">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central">Créer une petite pièce, par essais successifs</text>

<g class="node c-purple"><rect x="30" y="60" width="150" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="105" y="82" text-anchor="middle" dominant-baseline="central">Choisir peu</text>
<text class="ts" x="105" y="102" text-anchor="middle" dominant-baseline="central">de sons ou d'objets</text>

<line x1="180" y1="90" x2="215" y2="90" class="arr" marker-end="url(#arrow)"/>

<g class="node c-teal"><rect x="215" y="60" width="150" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="290" y="82" text-anchor="middle" dominant-baseline="central">Fixer une règle</text>
<text class="ts" x="290" y="102" text-anchor="middle" dominant-baseline="central">note, nombre de temps</text>

<line x1="365" y1="90" x2="400" y2="90" class="arr" marker-end="url(#arrow)"/>

<g class="node c-amber"><rect x="400" y="60" width="150" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="475" y="82" text-anchor="middle" dominant-baseline="central">Organiser</text>
<text class="ts" x="475" y="102" text-anchor="middle" dominant-baseline="central">début, milieu, fin</text>

<line x1="550" y1="90" x2="585" y2="90" class="arr" marker-end="url(#arrow)"/>

<g class="node c-coral"><rect x="585" y="60" width="65" height="60" rx="8" stroke-width="1.5"/></g>
<text class="ts" x="617" y="82" text-anchor="middle" dominant-baseline="central">Rejouer,</text>
<text class="ts" x="617" y="102" text-anchor="middle" dominant-baseline="central">ajuster</text>

<text class="th" x="340" y="165" text-anchor="middle" dominant-baseline="central">Exemple : motif rythmique de 3 sons</text>
<rect x="60" y="185" width="50" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text class="ts" x="85" y="211" text-anchor="middle" dominant-baseline="central">boîte</text>
<rect x="130" y="185" width="50" height="50" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text class="ts" x="155" y="211" text-anchor="middle" dominant-baseline="central">stylo</text>
<rect x="200" y="185" width="50" height="50" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="ts" x="225" y="211" text-anchor="middle" dominant-baseline="central">mains</text>
<text class="ts" x="290" y="211" text-anchor="middle" dominant-baseline="central">répété 2 fois,</text>

<rect x="380" y="185" width="50" height="50" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text class="ts" x="405" y="211" text-anchor="middle" dominant-baseline="central">boîte</text>
<rect x="450" y="185" width="50" height="50" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text class="ts" x="475" y="211" text-anchor="middle" dominant-baseline="central">stylo</text>
<rect x="520" y="185" width="50" height="50" rx="6" fill="#F3E9D2" stroke="#8A6D1F" stroke-width="1.5"/>
<text class="ts" x="545" y="211" text-anchor="middle" dominant-baseline="central">varié</text>
<text class="ts" x="612" y="211" text-anchor="middle" dominant-baseline="central">3e fois</text>
</svg>
