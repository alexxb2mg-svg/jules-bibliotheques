notion: styles
titre: "Les styles musicaux"
matiere: education-musicale
niveau: 3e
auteurs: ["hermes-em2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-em2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Wikipédia, « Genre musical »", url: "https://fr.wikipedia.org/w/index.php?title=Genre_musical&oldid=236954603", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: style, titre: "Style musical", sous_titre: "caractéristiques communes", principal: true}
      - {id: baroque, titre: "Baroque", sous_titre: "XVIe au XVIIIe siècle"}
      - {id: classique-romantique, titre: "Classique, romantique", sous_titre: "puis jazz, rock…"}
      - {id: genre, titre: "Genre", sous_titre: "catégorie, différent du style"}
    liens:
      - {de: style, vers: baroque}
      - {de: style, vers: classique-romantique}
      - {de: style, vers: genre, libelle: "à ne pas confondre"}
    jules: "Le **style** renseigne sur une manière commune d'écrire la musique à une époque donnée ; le **genre** catégorise plutôt une tradition (le blues, le rap)."

  - id: schema
    type: schema
    titre: "Chronologie simplifiée des styles musicaux"
    svg: "styles.svg"
    jules: "Un même **style** peut traverser plusieurs genres : la musique baroque comprend à la fois des sonates, des opéras et des messes."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1600, max: 1980, pas: 1, depart: 1725}
      - {id: curseur-debut, nom: début, min: 1600, max: 1600, pas: 1, depart: 1600}
      - {id: curseur-fin, nom: fin, min: 1980, max: 1980, pas: 1, depart: 1980}
    lectures:
      - {si: "date < 1750", texte: "**Baroque** (environ 1600-1750) : L'Orfeo de Monteverdi (1607), Les Quatre Saisons de Vivaldi (1725)."}
      - {si: "date >= 1750 && date < 1820", texte: "**Classique** (environ 1750-1820) : Mozart, Symphonie n° 40 (1788), La Flûte enchantée (1791)."}
      - {si: "date >= 1820 && date < 1900", texte: "**Romantique** (XIXe siècle) : Symphonie fantastique de Berlioz (1830), Chopin, Schubert."}
      - {si: "date >= 1900", texte: "**XXe siècle** : Le Sacre du printemps (1913), le **jazz** d'Armstrong (1928), le rock (années 1950), le rap (1979)."}
    jules: "Baroque, classique, romantique : trois styles qui se suivent sur la frise. Avant 1600, c'est le Moyen Âge et la Renaissance."

  - id: methode
    type: methode
    etapes:
      - "Repérer les instruments utilisés (acoustiques anciens, orchestre, voix, sons électroniques)."
      - "Observer la complexité de l'écriture (une seule mélodie, plusieurs voix superposées, accompagnement riche)."
      - "Chercher des indices de régularité ou d'irrégularité du rythme et du tempo."
      - "Relier ces observations à un style déjà rencontré en cours pour proposer une hypothèse."
    jules: "Ne date jamais un morceau uniquement d'après son ambiance générale : observe d'abord les **instruments** utilisés."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre le style (période d'écriture) et le genre (catégorie de musique)."
    pourquoi_faux: "Le **style** est lié à une époque ou une aire culturelle (instrumentation, harmonie), le **genre** catégorise une tradition (blues, rap), sans lien obligatoire à une seule époque."
    bonne_idee: "Chercher d'abord l'époque probable (style) grâce aux instruments, puis la catégorie (genre) séparément."
    jules: "Généraliser un style à partir d'un seul extrait entendu est risqué : vérifie toujours avec un deuxième exemple."

  - id: exemple
    type: exemple
    situation: "Un extrait utilise un clavecin, une écriture régulière et plusieurs voix mélodiques entrelacées."
    calcul: "Ces caractéristiques (instrument ancien, polyphonie régulière) évoquent le style **baroque** (fin du XVIe au milieu du XVIIIe siècle environ)."
    conclusion: "Le clavecin était très utilisé à cette période, et la **polyphonie** y était fréquente."
    jules: "La musique romantique utilise souvent un orchestre plus grand et des nuances plus marquées que la musique baroque."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "style, genre, baroque, romantique", outil: "lexique"}
    jules: "Choisis un morceau que tu écoutes souvent et situe-le dans un **style**, en citant deux caractéristiques qui justifient ton choix."
