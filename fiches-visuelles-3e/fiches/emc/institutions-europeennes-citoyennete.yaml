blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: citoyen, titre: "Citoyen européen", sous_titre: "peut saisir deux cours", principal: true}
      - {id: ue, titre: "Union européenne", sous_titre: "27 États membres"}
      - {id: cjue, titre: "CJUE", sous_titre: "Luxembourg"}
      - {id: conseil-europe, titre: "Conseil de l'Europe", sous_titre: "46 États membres"}
      - {id: cedh, titre: "CEDH", sous_titre: "Strasbourg"}
    liens:
      - {de: ue, vers: cjue, libelle: "a créé"}
      - {de: conseil-europe, vers: cedh, libelle: "a créé"}
      - {de: citoyen, vers: cjue, libelle: "recours possible"}
      - {de: citoyen, vers: cedh, libelle: "recours possible"}
    jules: "Deux mots proches, deux institutions différentes : **CJUE** pour le droit de l'UE, **CEDH** pour les droits de l'homme."

  - id: schema
    type: schema
    titre: "Deux organisations, deux cours"
    svg: "institutions-europeennes-citoyennete.svg"
    jules: "Ne confonds pas les initiales : la CJUE juge le droit de l'Union, la CEDH juge le respect des droits de l'homme."

  - id: methode
    type: methode
    etapes:
      - "Distinguer clairement Union européenne et Conseil de l'Europe : deux organisations différentes, pas les mêmes membres."
      - "Distinguer les deux juridictions européennes : CJUE (droit de l'UE, siège à Luxembourg) et CEDH (droits de l'homme, siège à Strasbourg)."
      - "Retenir qu'un citoyen peut saisir ces juridictions pour faire respecter ses droits."
      - "Ne pas confondre « Cour de justice de l'Union européenne » et « Cour européenne des droits de l'homme »."
    jules: "Astuce : CJUE = Union européenne (27), CEDH = Conseil de l'Europe (46, plus large)."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre la Cour de justice de l'Union européenne (CJUE) et la Cour européenne des droits de l'homme (CEDH)."
    pourquoi_faux: "Ce sont deux institutions différentes, créées par deux organisations distinctes : l'Union européenne pour la CJUE, le Conseil de l'Europe pour la CEDH."
    bonne_idee: "Relier chaque cour à son organisation : CJUE-Union européenne-Luxembourg, CEDH-Conseil de l'Europe-Strasbourg."
    jules: "Cette confusion est fréquente à cause des noms proches : pense toujours à l'organisation qui a créé la cour."

  - id: exemple
    type: exemple
    situation: "Quelle est la différence entre la CJUE et la CEDH ?"
    conclusion: "La CJUE, à Luxembourg, veille au respect du droit de l'Union européenne par ses 27 États membres. La CEDH, à Strasbourg, veille au respect de la Convention européenne des droits de l'homme dans 46 pays membres du Conseil de l'Europe, une organisation différente de l'UE."
    jules: "46 pays pour la CEDH, bien plus que les 27 de l'Union européenne : le Conseil de l'Europe est plus large."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "villes et rôles des deux cours", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "CJUE et CEDH, ne pas confondre"}
    jules: "Révise en associant chaque sigle à sa ville : CJUE-Luxembourg, CEDH-Strasbourg."
