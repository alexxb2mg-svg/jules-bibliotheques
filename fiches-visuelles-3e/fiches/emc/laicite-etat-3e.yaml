blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: laicite, titre: "Laïcité", sous_titre: "séparation religions-État", principal: true}
      - {id: loi-1905, titre: "Loi du 9 décembre 1905", sous_titre: "séparation des Églises et de l'État"}
      - {id: liberte-conscience, titre: "Liberté de conscience", sous_titre: "et liberté de culte"}
      - {id: debat-public, titre: "Débat public", sous_titre: "religions peuvent s'exprimer"}
    liens:
      - {de: laicite, vers: loi-1905, libelle: "fondée par"}
      - {de: laicite, vers: liberte-conscience, libelle: "garantit"}
      - {de: laicite, vers: debat-public, libelle: "n'exclut pas"}
    jules: "La laïcité **sépare** l'État des religions, elle ne les **interdit** pas : elle protège la liberté de croire ou de ne pas croire."

  - id: schema
    type: schema
    titre: "La loi de 1905 en deux articles"
    svg: "laicite-etat-3e.svg"
    jules: "Article 1 : on peut pratiquer sa religion. Article 2 : l'État n'en finance aucune. Les deux ensemble font l'**État laïque**."

  - id: methode
    type: methode
    etapes:
      - "Définir la laïcité par la séparation des religions et de l'État, pas par l'interdiction des religions."
      - "Citer la loi du 9 décembre 1905 comme fondement juridique de la laïcité en France."
      - "Distinguer les deux libertés garanties : liberté de conscience et liberté de culte."
      - "Montrer que la laïcité n'exclut pas les autorités religieuses du débat public, dans certaines limites."
    jules: "Retiens bien les deux libertés : croire ou ne pas croire (conscience), pratiquer sa religion (culte)."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que la laïcité interdit de pratiquer une religion."
    pourquoi_faux: "La laïcité protège au contraire la liberté de culte : chacun peut pratiquer sa religion librement, dans les limites de l'ordre public."
    bonne_idee: "Retenir que la laïcité sépare l'État des religions, sans jamais interdire d'y croire ou de les pratiquer."
    jules: "Laïcité n'est pas athéisme : la laïcité est un principe d'organisation de l'État, l'athéisme est une croyance personnelle."

  - id: exemple
    type: exemple
    situation: "Explique en une phrase pourquoi la laïcité protège à la fois les croyants et les non-croyants."
    conclusion: "La laïcité garantit à chacun la liberté de croire et de pratiquer sa religion (liberté de culte), mais aussi la liberté de ne pas croire, car l'État ne favorise ni n'impose aucune religion."
    jules: "C'est cette **neutralité** de l'État qui rend les deux libertés possibles en même temps."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "citer les articles de la loi de 1905", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "vocabulaire : laïcité, culte, conscience"}
    jules: "Sache citer l'article 2 de mémoire : « la République ne reconnaît, ne salarie ni ne subventionne aucun culte »."
