notion: democratie-deliberative-opinion-publique
titre: "Démocratie délibérative et opinion publique"
matiere: emc
niveau: 3e
auteurs: ["hermes-fv-emc_1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-fv-emc_1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Opinion publique »", url: "https://fr.vikidia.org/w/index.php?title=Opinion_publique&oldid=2464964", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Désinformation »", url: "https://fr.vikidia.org/w/index.php?title=D%C3%A9sinformation&oldid=2464955", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: opinion, titre: "Opinion publique", sous_titre: "opinion majoritaire du moment", principal: true}
      - {id: medias, titre: "Médias sociaux", sous_titre: "amplifient les idées"}
      - {id: sondages, titre: "Sondages", sous_titre: "mesurent l'opinion"}
      - {id: deliberation, titre: "Démocratie délibérative", sous_titre: "débat argumenté"}
    liens:
      - {de: opinion, vers: medias, libelle: "s'exprime par"}
      - {de: opinion, vers: sondages, libelle: "mesurée par"}
      - {de: opinion, vers: deliberation, libelle: "différente de"}
    jules: "L'opinion publique **n'est pas figée** : elle évolue, et un sondage n'en donne qu'une photo à un instant donné."

  - id: schema
    type: schema
    titre: "Avant de faire confiance à un sondage"
    svg: "democratie-deliberative-opinion-publique.svg"
    jules: "Quatre questions à te poser avant de croire un sondage : qui, combien, comment, quand."

  - id: graphe
    type: graphe
    gabarit: probabilites-frequences
    curseurs:
      - {id: curseur-n, nom: n, min: 10, max: 500, pas: 10, depart: 20}
    lectures:
      - {si: "n < 100", texte: "Avec si peu de personnes interrogées, le résultat **change beaucoup** d'un sondage à l'autre : on ne peut pas en tirer une conclusion sur toute la population."}
      - {si: "n >= 100 && n < 400", texte: "Plus on interroge de monde, plus le résultat se **stabilise** près de la vraie valeur ; il reste une marge d'erreur de quelques points."}
      - {si: "n >= 400", texte: "Un vrai sondage interroge souvent environ **1 000 personnes** choisies pour ressembler à la population (méthode des quotas) : sinon, même nombreuses, elles ne représentent qu'elles-mêmes."}
    jules: "Imagine une question où la moitié de la population répond « oui » (ligne verte) : la courbe bleue est le résultat du sondage selon le nombre de personnes interrogées."

  - id: methode
    type: methode
    etapes:
      - "Définir l'opinion publique comme l'opinion majoritaire d'une population à un instant donné, non figée."
      - "Expliquer le rôle des médias, dont les médias sociaux, dans la formation de l'opinion publique."
      - "Garder un regard critique sur un sondage : qui l'a commandé, comment la question est posée, quel est l'échantillon interrogé."
      - "Distinguer démocratie délibérative (débat argumenté) et simple addition de sondages d'opinion."
    jules: "Un bon réflexe d'esprit critique : jamais confiance aveugle en un seul sondage."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'un sondage reflète toujours exactement l'opinion de toute la population."
    pourquoi_faux: "Un sondage dépend de la taille et de la représentativité de l'échantillon interrogé, de la formulation des questions et du moment où il est réalisé."
    bonne_idee: "Toujours vérifier la méthode d'un sondage (échantillon, questions, date) avant de lui accorder de la valeur."
    jules: "Deux sondages sur le même sujet peuvent donner des résultats différents selon leur méthode : ce n'est pas une science exacte."

  - id: exemple
    type: exemple
    situation: "Pourquoi faut-il garder un regard critique face à un sondage d'opinion publié dans les médias ?"
    conclusion: "Parce qu'un sondage dépend de la taille et de la représentativité de l'échantillon interrogé, de la façon dont les questions sont formulées, et du moment où il est réalisé."
    jules: "Retiens ces trois critères pour tout sondage : échantillon, formulation, date."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "analyser un sondage", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "vocabulaire : opinion, sondage, délibération"}
    jules: "Entraîne-toi à repérer, dans un article, qui a commandé un sondage et sur quel échantillon."
