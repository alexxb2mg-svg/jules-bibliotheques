blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: constitution, titre: "Constitution de 1958", sous_titre: "texte juridique suprême", principal: true}
      - {id: separation-pouvoirs, titre: "Séparation des pouvoirs", sous_titre: "exécutif, législatif, judiciaire"}
      - {id: qpc, titre: "QPC", sous_titre: "contrôle une loi en vigueur"}
      - {id: revisions, titre: "Révisions depuis 1958", sous_titre: "1962, 1999, 2000, 2008..."}
    liens:
      - {de: constitution, vers: separation-pouvoirs, libelle: "organise"}
      - {de: constitution, vers: qpc, libelle: "contrôlée par"}
      - {de: constitution, vers: revisions, libelle: "évolue par"}
    jules: "La Constitution ne fixe pas que les pouvoirs : elle peut aussi être **contrôlée** (QPC) et **révisée**."

  - id: schema
    type: schema
    titre: "Comment fonctionne une QPC ?"
    svg: "constitution-ve-republique.svg"
    jules: "La QPC agit après coup, sur une loi déjà appliquée : c'est un contrôle **a posteriori**, jamais avant sa promulgation."

  - id: methode
    type: methode
    etapes:
      - "Retenir la date d'adoption de la Constitution (28 septembre 1958) et le principe de « loi des lois »."
      - "Citer les trois textes à valeur constitutionnelle liés : DDHC de 1789, préambule de 1946, Charte de l'environnement (2004)."
      - "Expliquer le fonctionnement de la QPC : elle contrôle une loi déjà en vigueur, au cours d'un procès."
      - "Situer une ou deux révisions importantes (1962, 2008) avec leur apport."
    jules: "L'étape 3 est la plus testée : une **QPC** agit toujours après coup, jamais avant l'application de la loi."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre la QPC avec un contrôle qui interviendrait avant la promulgation d'une loi."
    pourquoi_faux: "La QPC est un contrôle a posteriori : elle ne s'exerce que sur une loi déjà en vigueur, au cours d'un procès réel."
    bonne_idee: "Retenir que la QPC part toujours d'un procès en cours, où une loi déjà appliquée est contestée devant le Conseil constitutionnel."
    jules: "Cette confusion entre contrôle avant et après promulgation revient souvent au brevet : la QPC, c'est toujours **après**."

  - id: exemple
    type: exemple
    situation: "Explique ce qu'est une question prioritaire de constitutionnalité (QPC) et à quoi elle sert."
    conclusion: "La QPC, créée par la révision de 2008, permet à un citoyen, au cours d'un procès, de faire vérifier par le Conseil constitutionnel qu'une loi déjà appliquée respecte ses droits et libertés."
    jules: "Elle garantit ainsi le respect de la Constitution et l'**indépendance** de la justice face au pouvoir politique."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "citer les textes à valeur constitutionnelle", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "dates des révisions"}
    jules: "Revois surtout les dates des révisions : 1962, 1999, 2000, 2003, 2004, 2008."
