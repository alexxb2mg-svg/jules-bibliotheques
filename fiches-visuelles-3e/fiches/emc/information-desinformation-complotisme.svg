<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="16" width="300" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="41" text-anchor="middle" dominant-baseline="central">Une affirmation</text></g>
<line x1="260" y1="66" x2="170" y2="112" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="66" x2="340" y2="112" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="66" x2="510" y2="112" class="arr" marker-end="url(#arrow)"/>
<g class="node c-coral"><rect x="40" y="112" width="230" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="155" y="134" text-anchor="middle" dominant-baseline="central">Croyance</text>
<text class="ts" x="155" y="152" text-anchor="middle" dominant-baseline="central">non vérifiable,</text>
<text class="ts" x="155" y="167" text-anchor="middle" dominant-baseline="central">fondée sur la foi</text></g>
<g class="node c-amber"><rect x="225" y="112" width="230" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="134" text-anchor="middle" dominant-baseline="central">Opinion</text>
<text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">point de vue</text>
<text class="ts" x="340" y="167" text-anchor="middle" dominant-baseline="central">personnel, discutable</text></g>
<g class="node c-green"><rect x="410" y="112" width="230" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="525" y="134" text-anchor="middle" dominant-baseline="central">Savoir</text>
<text class="ts" x="525" y="152" text-anchor="middle" dominant-baseline="central">connaissance</text>
<text class="ts" x="525" y="167" text-anchor="middle" dominant-baseline="central">vérifiée, démontrée</text></g>
<g class="c-gray"><rect x="40" y="210" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="232" text-anchor="middle" dominant-baseline="central">Dans un débat argumenté, seul le savoir</text>
<text class="t" x="340" y="250" text-anchor="middle" dominant-baseline="central">peut être démontré comme vrai ou faux.</text></g>
</svg>
