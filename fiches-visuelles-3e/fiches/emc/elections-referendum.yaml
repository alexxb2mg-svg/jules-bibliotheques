blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: vote, titre: "Vote non obligatoire", sous_titre: "mais engagement civique", principal: true}
      - {id: election, titre: "Élection", sous_titre: "choisir des représentants"}
      - {id: referendum, titre: "Référendum", sous_titre: "répondre oui ou non"}
      - {id: campagne, titre: "Campagne électorale", sous_titre: "débat avant le vote"}
    liens:
      - {de: vote, vers: election, libelle: "par"}
      - {de: vote, vers: referendum, libelle: "ou par"}
      - {de: vote, vers: campagne, libelle: "précédé d'une"}
    jules: "Vote pas obligatoire ne veut pas dire sans importance : l'**abstention** influe sur la légitimité du résultat."

  - id: schema
    type: schema
    titre: "Élection ou référendum ?"
    svg: "elections-referendum.svg"
    jules: "L'élection choisit une personne, le référendum tranche une **question** : ce ne sont pas les mêmes réponses attendues."

  - id: methode
    type: methode
    etapes:
      - "Distinguer élection (choisir des représentants) et référendum (répondre directement à une question)."
      - "Connaître au moins quatre types d'élections françaises et leur objet."
      - "Retenir que le vote n'est pas obligatoire en France, contrairement à d'autres pays."
      - "Relier la campagne électorale à l'idée de débat démocratique nécessaire avant un vote."
    jules: "Cite toujours au moins quatre types d'élections : présidentielle, législatives, municipales, européennes."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que le vote est obligatoire en France."
    pourquoi_faux: "Le vote n'est pas obligatoire en France, contrairement à certains autres pays."
    bonne_idee: "Retenir que voter reste un engagement civique important même sans obligation légale."
    jules: "Beaucoup d'élèves confondent devoir civique et obligation légale : en France, c'est un choix libre."

  - id: exemple
    type: exemple
    situation: "Donne un exemple de référendum en France et explique ce qui le distingue d'une élection."
    conclusion: "Le référendum du 28 septembre 1958, qui a permis d'adopter la Constitution de la Ve République : contrairement à une élection, les citoyens ne choisissent pas un représentant mais répondent directement par oui ou non à une question précise."
    jules: "Retiens cette date, 1958, elle relie référendum et Constitution."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "types d'élections françaises", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "suffrage direct ou indirect"}
    jules: "Révise la différence suffrage direct (législatives) et indirect (sénatoriales)."
