notion: lanceurs-alerte
titre: "Les lanceurs d'alerte"
matiere: emc
niveau: 3e
auteurs: ["hermes-fv-emc_2"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-fv-emc_2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Lanceur d'alerte »", url: "https://fr.vikidia.org/w/index.php?title=Lanceur_d%27alerte&oldid=2364203", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: lanceur, titre: "Lanceur d'alerte", sous_titre: "bonne foi, intérêt général", principal: true}
      - {id: delateur, titre: "Délateur", sous_titre: "intérêt personnel"}
      - {id: loi-2022, titre: "Loi du 21/03/2022", sous_titre: "protège l'identité"}
      - {id: metoo, titre: "#MeToo", sous_titre: "exemple de mobilisation"}
    liens:
      - {de: lanceur, vers: delateur, libelle: "s'oppose à"}
      - {de: lanceur, vers: loi-2022, libelle: "protégé par"}
      - {de: lanceur, vers: metoo, libelle: "illustré par"}
    jules: "Ce qui distingue le lanceur d'alerte du délateur, c'est son **intention** : protéger l'intérêt général, pas se venger."

  - id: schema
    type: schema
    titre: "Lanceur d'alerte ou délateur ?"
    svg: "lanceurs-alerte.svg"
    jules: "Regarde toujours l'**intention** : intérêt général d'un côté, intérêt personnel de l'autre."

  - id: methode
    type: methode
    etapes:
      - "Définir le lanceur d'alerte par la bonne foi et l'absence d'intérêt personnel, à l'opposer du délateur."
      - "Citer la loi du 21 mars 2022 comme protection juridique du lanceur d'alerte en France."
      - "Illustrer avec un exemple précis de mobilisation (#MeToo, affaire financière)."
      - "Relier le rôle du lanceur d'alerte à la liberté d'expression et au fonctionnement démocratique."
    jules: "Un bon exemple précis (comme #MeToo) vaut mieux qu'une définition seule au brevet."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre lanceur d'alerte et délateur."
    pourquoi_faux: "L'intention (intérêt général contre intérêt personnel) fait toute la différence entre les deux."
    bonne_idee: "Vérifier systématiquement si la personne agit de bonne foi, sans intérêt personnel, pour protéger l'intérêt général."
    jules: "Sans cette nuance d'intention, on ne peut pas distinguer les deux notions."

  - id: exemple
    type: exemple
    situation: "Quelle protection la loi du 21 mars 2022 apporte-t-elle aux lanceurs d'alerte ?"
    conclusion: "Elle protège en particulier l'identité du lanceur d'alerte, qui ne peut être divulguée qu'avec son consentement, sauf communication à l'autorité judiciaire dans les cas prévus par la loi."
    jules: "Sans cette protection de l'**identité**, beaucoup de lanceurs d'alerte n'oseraient pas parler."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "distinguer lanceur d'alerte et délateur", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "dates et exemples clés"}
    jules: "Retiens un exemple hors #MeToo (affaire financière ou sanitaire) pour varier tes réponses."
