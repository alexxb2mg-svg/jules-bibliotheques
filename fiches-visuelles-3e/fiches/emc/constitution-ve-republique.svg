<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="180" y="20" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="39" text-anchor="middle" dominant-baseline="central">Un citoyen, au procès</text>
<text class="ts" x="340" y="57" text-anchor="middle" dominant-baseline="central">conteste une loi déjà appliquée</text></g>
<line x1="340" y1="76" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple"><rect x="140" y="108" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="127" text-anchor="middle" dominant-baseline="central">Cour de cassation ou Conseil d'État</text>
<text class="ts" x="340" y="145" text-anchor="middle" dominant-baseline="central">transmet la question</text></g>
<line x1="340" y1="164" x2="340" y2="196" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal"><rect x="140" y="196" width="400" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="215" text-anchor="middle" dominant-baseline="central">Le Conseil constitutionnel tranche</text>
<text class="ts" x="340" y="233" text-anchor="middle" dominant-baseline="central">conformité à la Constitution</text></g>
<line x1="300" y1="252" x2="170" y2="296" class="arr" marker-end="url(#arrow)"/>
<line x1="380" y1="252" x2="510" y2="296" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="205" y="272" text-anchor="middle">conforme</text>
<text class="ts" x="475" y="272" text-anchor="middle">non conforme</text>
<g class="node c-green"><rect x="40" y="296" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="315" text-anchor="middle" dominant-baseline="central">Loi conforme</text>
<text class="ts" x="170" y="333" text-anchor="middle" dominant-baseline="central">elle reste appliquée</text></g>
<g class="node c-red"><rect x="380" y="296" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="315" text-anchor="middle" dominant-baseline="central">Loi abrogée</text>
<text class="ts" x="510" y="333" text-anchor="middle" dominant-baseline="central">elle cesse de s'appliquer</text></g>
<g class="c-gray"><rect x="40" y="376" width="600" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="398" text-anchor="middle" dominant-baseline="central">La QPC : un contrôle a posteriori, sur une loi déjà en vigueur.</text></g>
</svg>
