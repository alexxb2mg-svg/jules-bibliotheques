<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-gray"><rect x="190" y="16" width="300" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="41" text-anchor="middle" dominant-baseline="central">Une personne parle</text></g>
<line x1="280" y1="66" x2="180" y2="112" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="66" x2="500" y2="112" class="arr" marker-end="url(#arrow)"/>
<g class="node c-green"><rect x="40" y="112" width="280" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="134" text-anchor="middle" dominant-baseline="central">Lanceur d'alerte</text>
<text class="ts" x="180" y="152" text-anchor="middle" dominant-baseline="central">bonne foi, intérêt</text>
<text class="ts" x="180" y="167" text-anchor="middle" dominant-baseline="central">général</text></g>
<g class="node c-red"><rect x="360" y="112" width="280" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="134" text-anchor="middle" dominant-baseline="central">Délateur</text>
<text class="ts" x="500" y="152" text-anchor="middle" dominant-baseline="central">intérêt personnel</text>
<text class="ts" x="500" y="167" text-anchor="middle" dominant-baseline="central">ou malveillance</text></g>
<g class="c-gray"><rect x="40" y="210" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="232" text-anchor="middle" dominant-baseline="central">La loi du 21 mars 2022 protège</text>
<text class="t" x="340" y="250" text-anchor="middle" dominant-baseline="central">l'identité du lanceur d'alerte.</text></g>
</svg>
