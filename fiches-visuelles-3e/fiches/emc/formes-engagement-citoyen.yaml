    titre: "Les grandes formes d'engagement"
    svg: "formes-engagement-citoyen.svg"
    jules: "Le **SNU**, créé en 2019 et non obligatoire, n'est pas le service militaire, supprimé en 1996."

  - id: methode
    type: methode
    etapes:
      - "Distinguer les grandes formes d'engagement : politique, syndical, associatif/humanitaire, scolaire, et service dans une institution publique."
      - "Donner un exemple concret pour au moins deux formes d'engagement différentes."
      - "Relier la liberté de manifester à la liberté d'expression, tout en signalant qu'elle peut être encadrée."
      - "Connaître le SNU comme dispositif récent de découverte de l'engagement, sans le confondre avec le service militaire obligatoire."
    jules: "Toujours donner un exemple précis à côté de chaque forme d'engagement citée."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre le SNU (non obligatoire, créé en 2019) et l'ancien service militaire obligatoire, supprimé en France en 1996."
    pourquoi_faux: "Le SNU est un dispositif d'éducation à la citoyenneté récent et non obligatoire, sans lien juridique avec l'ancien service militaire."
    bonne_idee: "Associer le SNU à 2019 et à la découverte de l'engagement, jamais à une obligation militaire."
    jules: "Deux dates à ne pas mélanger : 1996 (fin du service militaire) et 2019 (création du SNU)."

  - id: exemple
    type: exemple
    situation: "Donne trois exemples différents de formes d'engagement citoyen."
    conclusion: "L'engagement associatif (être bénévole dans une association humanitaire), l'engagement syndical (adhérer à un syndicat pour défendre les droits des salariés), et la démocratie scolaire (être élu délégué de classe pour représenter ses camarades)."
    jules: "Varie toujours tes exemples entre engagement individuel et engagement collectif."

  - id: renfort
    type: renfort
    liens:
