    jules: "La désinformation est **volontaire**, contrairement à une simple erreur : c'est ce qui la distingue de la mésinformation."

  - id: schema
    type: schema
    titre: "Croyance, opinion ou savoir ?"
    svg: "information-desinformation-complotisme.svg"
    jules: "Seul le **savoir** est vérifié et démontrable : une croyance ou une opinion ne suffisent pas dans un débat argumenté."

  - id: methode
    type: methode
    etapes:
      - "Définir la désinformation par son caractère volontaire et intentionnel, contrairement à une simple erreur."
      - "Citer la loi du 22 décembre 2018 comme réponse législative française à la désinformation électorale."
      - "Distinguer croyance, opinion et savoir : trois façons différentes d'affirmer quelque chose."
      - "Adopter une méthode de vérification avant de partager une information (source, date, recoupement)."
    jules: "Avant de partager une info, vérifie toujours sa **source** et sa **date** de publication."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre désinformation (volontaire) et mésinformation ou simple erreur (involontaire)."
    pourquoi_faux: "La désinformation est une intention de tromper, alors qu'une simple erreur ou une information mal vérifiée n'a pas ce but."
    bonne_idee: "Toujours se demander si une fausse information a été créée pour tromper délibérément, ou si c'est une erreur non intentionnelle."
    jules: "Cette nuance d'intention change tout : elle détermine si l'on parle de désinformation ou de simple erreur."

  - id: exemple
    type: exemple
    situation: "Que permet la loi du 22 décembre 2018 relative à la lutte contre la manipulation de l'information ?"
    conclusion: "Elle permet, notamment en période électorale, de saisir un juge en urgence pour faire cesser la diffusion de fausses informations créées et diffusées de façon délibérée et massive dans le but de fausser le résultat d'une élection."
    jules: "Cette loi vise surtout les périodes électorales, moments sensibles pour la **démocratie**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "distinguer croyance, opinion, savoir", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "réflexes de vérification d'une info"}
    jules: "Entraîne-toi à repérer, dans un texte, s'il s'agit d'une croyance, d'une opinion ou d'un savoir."
