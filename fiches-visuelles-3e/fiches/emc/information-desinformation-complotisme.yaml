    noeuds:
      - {id: desinformation, titre: "Désinformation", sous_titre: "fausses infos volontaires", principal: true}
      - {id: loi-2018, titre: "Loi du 22/12/2018", sous_titre: "lutte manipulation info"}
      - {id: complotisme, titre: "Complotisme", sous_titre: "croyance en complots cachés"}
