<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="flechepc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">De l'image fixe à l'image animée</text>

<g class="c-blue"><rect x="40" y="55" width="270" height="90" rx="8" stroke-width="1.5"/></g>
<text class="t" x="175" y="80" text-anchor="middle" dominant-baseline="central">Photographie</text>
<text class="ts" x="175" y="100" text-anchor="middle" dominant-baseline="central">cadrage, lumière,</text>
<text class="ts" x="175" y="118" text-anchor="middle" dominant-baseline="central">image fixe unique</text>

<path d="M310,100 L370,100" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechepc)"/>

<g class="c-teal"><rect x="370" y="55" width="270" height="90" rx="8" stroke-width="1.5"/></g>
<text class="t" x="505" y="80" text-anchor="middle" dominant-baseline="central">Cinéma</text>
<text class="ts" x="505" y="100" text-anchor="middle" dominant-baseline="central">cadrage, lumière,</text>
<text class="ts" x="505" y="118" text-anchor="middle" dominant-baseline="central">+ montage des plans</text>

<g class="c-amber"><rect x="60" y="180" width="180" height="55" rx="8" stroke-width="1.5"/></g>
<text class="t" x="150" y="200" text-anchor="middle" dominant-baseline="central">Cadrage</text>
<text class="ts" x="150" y="220" text-anchor="middle" dominant-baseline="central">choisir ce qu'on montre</text>

<g class="c-purple"><rect x="250" y="180" width="180" height="55" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="200" text-anchor="middle" dominant-baseline="central">Lumière</text>
<text class="ts" x="340" y="220" text-anchor="middle" dominant-baseline="central">éclairage, contraste</text>

<g class="c-coral"><rect x="440" y="180" width="180" height="55" rx="8" stroke-width="1.5" fill="#ffe4de" stroke="#f4675a"/></g>
<text class="t" x="530" y="200" text-anchor="middle" dominant-baseline="central">Montage</text>
<text class="ts" x="530" y="220" text-anchor="middle" dominant-baseline="central">assembler les plans</text>

<g class="c-gray"><rect x="40" y="260" width="600" height="40" rx="8" stroke-width="1"/></g>
<text class="t" x="340" y="285" text-anchor="middle" dominant-baseline="central">Trois outils au service du sens et de l'émotion</text>
</svg>
