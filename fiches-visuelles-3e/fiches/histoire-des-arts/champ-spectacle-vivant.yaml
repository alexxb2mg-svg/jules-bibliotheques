blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: champ, titre: "Spectacle vivant", sous_titre: "une œuvre jouée devant un public", principal: true}
      - {id: theatre, titre: "Théâtre", sous_titre: "texte, jeu, mise en scène"}
      - {id: danse, titre: "Danse", sous_titre: "corps, mouvement, chorégraphie"}
      - {id: opera, titre: "Opéra", sous_titre: "chant, musique, décor"}
    liens:
      - {de: champ, vers: theatre, libelle: "discipline"}
      - {de: champ, vers: danse, libelle: "discipline"}
      - {de: champ, vers: opera, libelle: "discipline"}
    jules: "Une **mise en scène** interprète un texte : deux mises en scène d'une même pièce peuvent être très différentes."

  - id: schema
    type: schema
    titre: "Le spectacle vivant : trois disciplines, un point commun"
    svg: "champ-spectacle-vivant.svg"
    jules: "Le point commun des trois disciplines est de se jouer devant un public présent, en direct, sans enregistrement."

  - id: methode
    type: methode
    etapes:
      - "Identifier la discipline : théâtre, danse ou opéra."
      - "Repérer les éléments propres à la mise en scène : décor, lumière, costumes."
      - "Pour l'opéra, distinguer le texte chanté (livret) de la musique qui l'accompagne."
      - "Se rappeler que chaque représentation est unique, contrairement à un film."
    jules: "Le **livret** d'un opéra est le texte chanté ; il est écrit par un librettiste, souvent différent du compositeur."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'un enregistrement vidéo d'une pièce de théâtre équivaut au spectacle vivant lui-même."
    pourquoi_faux: "Le spectacle vivant se définit par la présence simultanée des artistes et du public au même moment : un enregistrement n'en garde qu'une trace, jamais l'expérience en direct."
    bonne_idee: "Toujours préciser que chaque représentation de spectacle vivant est unique et ne se reproduit jamais exactement à l'identique."
    jules: "Danse, théâtre et opéra partagent cette unicité : c'est ce qui distingue le spectacle vivant du cinéma."

  - id: exemple
    type: exemple
    situation: "Une œuvre associe des chanteurs, un orchestre, des décors peints et des costumes, sur un texte entièrement chanté."
    conclusion: "Il s'agit d'un opéra, qui réunit musique, chant et mise en scène dans une seule œuvre de spectacle vivant."
    jules: "Le chant intégral du texte est le signe distinctif de l'**opéra**, à la différence d'une comédie musicale où l'on parle aussi."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "mise en scène, livret, chorégraphie", outil: "lexique"}
    jules: "Observe une captation vidéo d'un spectacle et note ce qui, à ton avis, se perd par rapport à une représentation en direct."
