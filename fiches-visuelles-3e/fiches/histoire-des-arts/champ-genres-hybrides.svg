<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="flechegh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">Genres hybrides : sortir du cadre</text>

<g class="c-purple"><rect x="220" y="50" width="240" height="55" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="70" text-anchor="middle" dominant-baseline="central">Genres hybrides</text>
<text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">mélangent plusieurs arts</text>

<g class="c-teal"><rect x="40" y="160" width="180" height="90" rx="8" stroke-width="1.5"/></g>
<text class="t" x="130" y="185" text-anchor="middle" dominant-baseline="central">Installation</text>
<text class="ts" x="130" y="205" text-anchor="middle" dominant-baseline="central">occupe un espace</text>
<text class="ts" x="130" y="222" text-anchor="middle" dominant-baseline="central">entier</text>

<g class="c-coral"><rect x="250" y="160" width="180" height="90" rx="8" fill="#ffe4de" stroke="#f4675a" stroke-width="1.5"/></g>
<text class="t" x="340" y="185" text-anchor="middle" dominant-baseline="central">Performance</text>
<text class="ts" x="340" y="205" text-anchor="middle" dominant-baseline="central">action en direct,</text>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">éphémère</text>

<g class="c-blue"><rect x="460" y="160" width="180" height="90" rx="8" stroke-width="1.5"/></g>
<text class="t" x="550" y="185" text-anchor="middle" dominant-baseline="central">Art numérique</text>
<text class="ts" x="550" y="205" text-anchor="middle" dominant-baseline="central">écrans, sons,</text>
<text class="ts" x="550" y="222" text-anchor="middle" dominant-baseline="central">interactivité</text>

<path d="M290,105 L150,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechegh)"/>
<path d="M340,105 L340,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechegh)"/>
<path d="M390,105 L520,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechegh)"/>

<g class="c-gray"><rect x="40" y="270" width="600" height="35" rx="8" stroke-width="1"/></g>
<text class="t" x="340" y="292" text-anchor="middle" dominant-baseline="central">Point commun : dépasser les frontières entre disciplines classiques</text>
