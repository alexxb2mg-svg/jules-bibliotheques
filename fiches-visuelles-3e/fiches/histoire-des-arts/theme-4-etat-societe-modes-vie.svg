<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">La hiérarchie des genres (XIIIe-XVIIIe s.)</text>

<g class="c-purple"><rect x="190" y="55" width="300" height="55" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="78" text-anchor="middle" dominant-baseline="central">1. Peinture d'histoire</text>
<text class="ts" x="340" y="98" text-anchor="middle" dominant-baseline="central">religion, mythologie, histoire</text>

<g class="c-blue"><rect x="210" y="125" width="260" height="50" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="146" text-anchor="middle" dominant-baseline="central">2. Portrait</text>
<text class="ts" x="340" y="163" text-anchor="middle" dominant-baseline="central">une personne identifiée</text>

<g class="c-teal"><rect x="230" y="190" width="220" height="50" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="211" text-anchor="middle" dominant-baseline="central">3. Paysage</text>
<text class="ts" x="340" y="228" text-anchor="middle" dominant-baseline="central">nature, bestiaires</text>

<g class="c-amber"><rect x="250" y="255" width="180" height="50" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="276" text-anchor="middle" dominant-baseline="central">4. Nature morte</text>
<text class="ts" x="340" y="293" text-anchor="middle" dominant-baseline="central">objets, fleurs, fruits</text>

<path d="M340,110 L340,124" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche4)"/>
<path d="M340,175 L340,189" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche4)"/>
<path d="M340,240 L340,254" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche4)"/>

<text class="ts" x="90" y="80" text-anchor="middle">genre</text>
<text class="ts" x="90" y="95" text-anchor="middle">« noble »</text>
<text class="ts" x="90" y="280" text-anchor="middle">genre</text>
<text class="ts" x="90" y="295" text-anchor="middle">« mineur »</text>
<path d="M90,110 L90,255" stroke="#9ca3af" stroke-width="2"/>
<path d="M85,110 L95,110" stroke="#9ca3af" stroke-width="2"/>
<path d="M85,255 L95,255" stroke="#9ca3af" stroke-width="2"/>

<g class="c-gray"><rect x="40" y="330" width="600" height="55" rx="8" stroke-width="0.5"/></g>
<text class="t" x="340" y="352" text-anchor="middle" dominant-baseline="central">La danse suit aussi une échelle sociale : populaire, de cour, puis stylisée.</text>
<text class="ts" x="340" y="372" text-anchor="middle" dominant-baseline="central">Schéma de synthèse, pas à l'échelle.</text>
