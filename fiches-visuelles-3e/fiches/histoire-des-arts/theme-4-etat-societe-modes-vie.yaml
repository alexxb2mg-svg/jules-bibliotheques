notion: theme-4-etat-societe-modes-vie
titre: "État, société et modes de vie (XIIIe-XVIIIe s.)"
matiere: histoire-des-arts
niveau: 3e
auteurs: ["hermes-hda2"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Vikidia, « Nature morte »", url: "https://fr.vikidia.org/w/index.php?title=Nature_morte&oldid=2096553", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Danse »", url: "https://fr.vikidia.org/w/index.php?title=Danse&oldid=2563087", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
generation: {par: "hermes-hda2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: hierarchie, titre: "Hiérarchie des genres", sous_titre: "peinture, portrait, paysage...", principal: true}
      - {id: habitat, titre: "Habitat et mobilier", sous_titre: "décor, modes de vie"}
      - {id: nature, titre: "Rapport à la nature", sous_titre: "paysage, bestiaires"}
      - {id: danse, titre: "Danse", sous_titre: "populaire, de cour, stylisée"}
    liens:
      - {de: hierarchie, vers: habitat, libelle: "même société"}
      - {de: hierarchie, vers: nature, libelle: "nouveau genre"}
      - {de: habitat, vers: danse, libelle: "usages sociaux"}
    jules: "La **hiérarchie des genres** classe les sujets, pas la qualité technique : un petit tableau de nature morte peut être très habile mais reste en bas du classement officiel."

  - id: schema
    type: schema
    titre: "La hiérarchie officielle des genres picturaux"
    svg: "theme-4-etat-societe-modes-vie.svg"
    jules: "Plus on monte dans la pyramide, plus le sujet est jugé **noble** : l'histoire (religion, mythologie) domine, la nature morte est en bas."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1550, max: 1750, pas: 1, depart: 1682}
      - {id: curseur-debut, nom: début, min: 1550, max: 1550, pas: 1, depart: 1550}
      - {id: curseur-fin, nom: fin, min: 1750, max: 1750, pas: 1, depart: 1750}
    lectures:
      - {si: "date < 1600", texte: "XVIe siècle : Bruegel peint Les Chasseurs dans la neige (1565), un **paysage** d'hiver."}
      - {si: "date >= 1600 && date < 1678", texte: "**1648** : création de l'Académie royale de peinture ; La Laitière de Vermeer (vers 1658) ; Le Bourgeois gentilhomme (1670)."}
      - {si: "date >= 1678 && date < 1720", texte: "**Versailles** : galerie des Glaces (1678-1684), la cour s'installe en 1682 ; Rigaud peint Louis XIV en costume de sacre (1701)."}
      - {si: "date >= 1720", texte: "XVIIIe siècle : Chardin peint La Raie (1728), une **nature morte**."}
    jules: "Au centre de la frise, Versailles : l'art sert à montrer la puissance du roi. Autour, la vie de tous les jours entre aussi dans les tableaux."

  - id: methode
    type: methode
    etapes:
      - "Identifier le genre pictural de l'œuvre : histoire, portrait, paysage ou nature morte."
      - "Situer ce genre dans la hiérarchie ancienne (histoire en haut, nature morte en bas)."
      - "Observer les objets ou le décor représentés pour situer un mode de vie social."
      - "Distinguer une danse populaire d'une danse de cour à partir de son contexte."
    jules: "Une **scène de genre** montre la vie quotidienne : elle n'est pas une peinture d'histoire, même si des personnages y figurent."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que tous les genres picturaux avaient le même prestige à cette époque."
    pourquoi_faux: "La hiérarchie officielle plaçait la peinture d'histoire tout en haut et la nature morte tout en bas ; cette hiérarchie n'existe plus de la même façon aujourd'hui."
    bonne_idee: "Toujours préciser le rang du genre observé quand on décrit une œuvre de cette période."
    jules: "Ce classement ancien surprend souvent : aujourd'hui, un portrait ou une nature morte peuvent être aussi admirés qu'une grande peinture d'histoire."

  - id: exemple
    type: exemple
    situation: "Une grande peinture représente un épisode mythologique avec de nombreux personnages en mouvement, exposée dans un salon officiel."
    conclusion: "Il s'agit d'une peinture d'histoire, le genre le plus noble de la hiérarchie officielle, réservé aux grands formats et aux sujets religieux, mythologiques ou historiques."
    jules: "Le grand format et le sujet mythologique sont deux indices qui confirment le rang le plus élevé de la **hiérarchie**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "les 4 genres et leur rang"}
    jules: "Entraîne-toi à reconnaître les quatre genres sur des œuvres différentes : c'est ce classement qui revient le plus souvent en contrôle."
