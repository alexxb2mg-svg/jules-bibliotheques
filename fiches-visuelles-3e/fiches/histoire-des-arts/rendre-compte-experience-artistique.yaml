matiere: histoire-des-arts
niveau: 3e
auteurs: ["hermes-hda1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-hda1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Musique »", url: "https://fr.vikidia.org/w/index.php?title=Musique&oldid=2487852", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: experience, titre: "Expérience artistique", sous_titre: "vécue personnellement", principal: true}
      - {id: spectateur, titre: "Spectateur", sous_titre: "concert, exposition, spectacle"}
      - {id: pratiquant, titre: "Pratiquant", sous_titre: "théâtre, musique, arts plastiques"}
      - {id: contexte, titre: "Contexte", sous_titre: "quoi, où, quand"}
      - {id: apport, titre: "Apport personnel", sous_titre: "argumenté, précis"}
    liens:
      - {de: experience, vers: spectateur}
      - {de: experience, vers: pratiquant}
      - {de: spectateur, vers: contexte}
      - {de: pratiquant, vers: apport}
    jules: "Cette compétence est particulièrement mobilisée à l'oral de soutenance du **brevet**."

  - id: schema
    type: schema
    titre: "Raconter une expérience artistique vécue"
    svg: "rendre-compte-experience-artistique.svg"
    jules: "Le point de vue d'un pratiquant (jouer, danser, peindre) diffère de celui d'un spectateur : les deux sont valorisés."

  - id: methode
    type: methode
    etapes:
      - "Préciser le contexte de l'expérience (quoi, où, quand, en tant que spectateur ou pratiquant)."
      - "Décrire un moment précis plutôt qu'un résumé général de l'expérience."
      - "Expliquer ce que cette expérience a apporté personnellement, avec un argument concret."
      - "Relier si possible cette expérience à des notions vues en classe (technique, mouvement artistique…)."
    jules: "Un compte rendu qui mêle faits et ressenti argumenté vaut mieux qu'un simple jugement comme « c'était bien »."

  - id: piege
    type: piege
    mauvaise_idee: "Rester trop vague sur le ressenti, en disant seulement « c'était cool » sans l'expliquer."
    pourquoi_faux: "Un ressenti non expliqué n'apporte aucune information : il faut dire précisément ce qui a produit cette impression."
    bonne_idee: "Développer le ressenti avec un argument concret lié à un moment précis vécu."
    jules: "Oublier de préciser le **contexte** (où, quand) prive le compte rendu d'informations utiles pour le situer."

  - id: exemple
    type: exemple
    situation: "Un élève a appris à jouer d'un instrument et raconte cette expérience."
    calcul: "Contexte : deux ans de guitare. Moment précis : réussir un morceau entier sans erreur, après des dizaines de répétitions."
    conclusion: "« Ce moment m'a appris la **patience**, car j'avais dû répéter le même passage des dizaines de fois avant d'y arriver. »"
    jules: "L'exemple réunit contexte, moment précis et apport personnel argumenté : c'est la structure attendue."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "spectateur, pratiquant, ressenti", outil: "lexique"}
    jules: "Entraîne-toi : raconte en 3 phrases une expérience artistique personnelle, en expliquant ce qu'elle t'a apporté."
