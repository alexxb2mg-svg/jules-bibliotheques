  - id: schema
    type: schema
    titre: "L'art antique et ses fonctions dans la société"
    svg: "theme-1-arts-societe-antique.svg"
    jules: "L'architecture antique (colonnes, frontons) devient une référence reprise par de nombreux styles plus tardifs."

  - id: methode
    type: methode
    etapes:
      - "Repérer si une œuvre antique suit des conventions de représentation (taille selon l'importance, absence de perspective)."
      - "Identifier la fonction du bâtiment ou de l'œuvre dans la société antique (religieuse, civique, funéraire)."
      - "Relier un mythe illustré à ses valeurs ou son message pour la société qui l'a produit."
      - "Comparer un élément architectural antique (colonne, arc) à sa réutilisation dans un style plus récent."
    jules: "Un mythe illustré transmet souvent des valeurs ou légitime un pouvoir, bien au-delà d'une simple histoire."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que l'art égyptien ou grec cherchait le même réalisme que l'art plus tardif."
    pourquoi_faux: "L'art égyptien suit des conventions strictes (taille selon l'importance sociale, pas de perspective), différentes de la recherche de réalisme."
    bonne_idee: "Repérer les conventions propres à chaque civilisation avant de juger de son degré de réalisme."
    jules: "Confondre architecture **grecque** et architecture **romaine** est une autre erreur fréquente : elles ont des caractéristiques différentes."

  - id: exemple
    type: exemple
    situation: "Une fresque d'un tombeau égyptien représente un pharaon bien plus grand que les autres personnages autour de lui."
    calcul: "Convention observée : taille selon l'importance sociale, pas de perspective réelle dans l'espace."
    conclusion: "Cette différence de taille n'est pas une erreur de proportion : elle indique l'**importance sociale** du pharaon."
    jules: "Sans connaître cette convention, on pourrait croire à une erreur de dessin — c'est l'inverse."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "fronton, colonne, convention", outil: "lexique"}
    jules: "Entraîne-toi : présente une œuvre antique en expliquant sa fonction dans la société de l'époque."
