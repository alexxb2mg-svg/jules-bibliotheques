    jules: "L'**iconoclasme** est le refus de certaines traditions de représenter des figures : un vrai débat autour de la Méditerranée."

  - id: schema
    type: schema
    titre: "Style roman contre style gothique"
    svg: "theme-2-formes-circulations-medievales.svg"
    jules: "L'architecture **gothique**, avec arcs brisés et arcs-boutants, permet des édifices plus hauts et plus lumineux que le style **roman**."

  - id: methode
    type: methode
    etapes:
      - "Distinguer le style roman (arcs en plein cintre, bâtiments plus massifs) du style gothique (arcs brisés, arcs-boutants)."
      - "Repérer, dans un manuscrit, la répartition entre texte copié et enluminure peinte."
      - "Identifier la fonction d'un bâtiment médiéval (religieuse, militaire, civile) à partir de ses formes."
      - "Relier une œuvre médiévale à un contexte de circulation ou d'échange culturel si des indices l'indiquent."
    jules: "Le **manuscrit** médiéval associe un texte copié à la main et une **enluminure**, une illustration peinte sur parchemin."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre le style roman et le style gothique, ou croire que le manuscrit médiéval était imprimé."
    pourquoi_faux: "Le style gothique se distingue par ses arcs brisés et sa hauteur ; le manuscrit médiéval est copié et peint à la main, pas imprimé."
    bonne_idee: "Vérifier la forme des arcs (arrondis ou pointus) et se rappeler que l'imprimerie n'existe pas encore à cette période."
    jules: "Réduire le Moyen Âge à une période uniforme masque des évolutions bien distinctes sur plusieurs siècles."

  - id: exemple
    type: exemple
    situation: "Une cathédrale montre de grandes fenêtres, des arcs pointus et des contreforts extérieurs qui soutiennent les murs."
    calcul: "Éléments observés : arcs brisés, arcs-boutants, grandes ouvertures — caractéristiques du style gothique."
    conclusion: "Ce style, développé en France à partir du XIIe siècle, a permis de construire des édifices religieux plus **hauts** et mieux éclairés que le style roman."
    jules: "Les arcs-boutants extérieurs soutiennent les murs, ce qui libère de la place pour de grandes fenêtres."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "enluminure, arc-boutant, iconoclasme", outil: "lexique"}
    jules: "Entraîne-toi : présente une enluminure en expliquant qui la réalisait et pourquoi."
