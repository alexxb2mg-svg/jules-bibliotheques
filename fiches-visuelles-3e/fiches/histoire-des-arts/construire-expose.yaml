notion: construire-expose
titre: "Construire un exposé autour d'une problématique"
matiere: histoire-des-arts
niveau: 3e
auteurs: ["hermes-hda1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-hda1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Impressionnisme »", url: "https://fr.vikidia.org/w/index.php?title=Impressionnisme&oldid=2561020", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: expose, titre: "Exposé", sous_titre: "quelques minutes", principal: true}
      - {id: problematique, titre: "Problématique", sous_titre: "question précise"}
      - {id: oeuvres, titre: "2-3 œuvres choisies", sous_titre: "utiles à la question"}
      - {id: plan, titre: "Plan organisé", sous_titre: "fait avancer la réponse"}
      - {id: conclusion, titre: "Conclusion", sous_titre: "répond à la question"}
    liens:
      - {de: expose, vers: problematique}
      - {de: problematique, vers: oeuvres}
      - {de: oeuvres, vers: plan}
      - {de: plan, vers: conclusion}
    jules: "Sans problématique commune, un exposé n'est qu'une accumulation d'informations, pas une démonstration."

  - id: schema
    type: schema
    titre: "Le plan d'un exposé, de la question à la réponse"
    svg: "construire-expose.svg"
    jules: "Chaque partie du développement doit apporter un élément de réponse différent à la **problématique**."

  - id: methode
    type: methode
    etapes:
      - "Formuler une question précise (problématique) que l'exposé va traiter."
      - "Choisir deux ou trois œuvres directement utiles pour répondre à cette question."
      - "Organiser le développement en parties qui font avancer la réponse à la problématique."
      - "Conclure en répondant explicitement à la question posée en introduction."
    jules: "Mieux vaut bien développer deux ou trois œuvres en lien avec la question que survoler dix œuvres sans les relier."

  - id: piege
    type: piege
    mauvaise_idee: "Présenter plusieurs œuvres sans problématique commune qui les relie, comme une simple liste."
    pourquoi_faux: "Sans question directrice, le développement ne progresse pas et la conclusion n'a rien à quoi répondre."
    bonne_idee: "Choisir une problématique précise dès le départ, puis sélectionner uniquement les œuvres qui y répondent."
    jules: "Vouloir parler de trop d'œuvres fait rester **superficiel** sur chacune : mieux vaut en approfondir peu."

  - id: exemple
    type: exemple
    situation: "Problématique : « Comment les peintres impressionnistes ont-ils changé la façon de représenter la lumière ? »"
    calcul: "Plan en 3 parties : 1) la peinture académique avant, 2) les innovations techniques d'un peintre impressionniste, 3) l'effet obtenu sur la perception de la lumière."
    conclusion: "La conclusion répond directement à la question posée : les touches visibles et la peinture en extérieur ont transformé la représentation de la lumière."
    jules: "Chaque partie du plan correspond à une étape de la réponse : avant, comment, avec quel effet."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "problématique, plan, développement", outil: "lexique"}
    jules: "Entraîne-toi : choisis deux œuvres étudiées et formule une problématique qui permettrait de les comparer."
