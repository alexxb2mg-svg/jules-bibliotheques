blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: champ, titre: "Beaux-arts", sous_titre: "arts visuels traditionnels", principal: true}
      - {id: peinture, titre: "Peinture", sous_titre: "surface, couleur, ligne"}
      - {id: sculpture, titre: "Sculpture", sous_titre: "volume, ronde-bosse, relief"}
      - {id: architecture, titre: "Architecture", sous_titre: "espace, construction"}
    liens:
      - {de: champ, vers: peinture, libelle: "discipline"}
      - {de: champ, vers: sculpture, libelle: "discipline"}
      - {de: champ, vers: architecture, libelle: "discipline"}
    jules: "Une **ronde-bosse** se regarde de tous les côtés, alors qu'un **relief** reste attaché à un fond."

  - id: schema
    type: schema
    titre: "Le champ des beaux-arts et ses disciplines"
    svg: "champ-beaux-arts.svg"
    jules: "Chaque discipline a son propre vocabulaire technique : ligne et couleur pour la peinture, volume pour la sculpture, espace pour l'architecture."

  - id: methode
    type: methode
    etapes:
      - "Identifier la discipline de l'œuvre : peinture, sculpture ou architecture."
      - "Pour une sculpture, préciser s'il s'agit d'une ronde-bosse ou d'un relief."
      - "Pour une peinture, observer la technique (huile, fresque, aquarelle) et le support."
      - "Pour une architecture, repérer la fonction du bâtiment et son organisation de l'espace."
    jules: "Le mot **fresque** désigne une peinture réalisée directement sur un mur, souvent sur un enduit encore frais."

  - id: piege
    type: piege
    mauvaise_idee: "Décrire une sculpture en relief comme si elle était une ronde-bosse détachée du fond."
    pourquoi_faux: "Le relief reste toujours attaché à un fond ou à un mur, alors que la ronde-bosse est une figure autonome visible sous tous les angles."
    bonne_idee: "Vérifier si l'œuvre peut être vue de tous les côtés (ronde-bosse) ou seulement de face (relief)."
    jules: "Le bas-relief est peu saillant, le haut-relief se détache beaucoup plus du fond : deux nuances du même procédé."

  - id: exemple
    type: exemple
    situation: "Une figure humaine en pierre, entièrement dégagée de tout support, peut être observée en tournant complètement autour d'elle."
    conclusion: "Il s'agit d'une sculpture en ronde-bosse, une des deux grandes catégories de la sculpture avec le relief."
    jules: "La possibilité de tourner autour de l'œuvre est le critère décisif pour reconnaître une **ronde-bosse**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "ronde-bosse, relief, fresque", outil: "lexique"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "les 3 disciplines"}
    jules: "Cherche une œuvre de chaque discipline (peinture, sculpture, architecture) et note en une phrase sa technique."
