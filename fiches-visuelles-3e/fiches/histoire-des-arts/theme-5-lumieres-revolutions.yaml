sources:
  - {titre: "Vikidia, « Romantisme »", url: "https://fr.vikidia.org/w/index.php?title=Romantisme&oldid=2558563", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
generation: {par: "hermes-hda2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: public, titre: "Publics et critique", sous_titre: "expositions, salons", principal: true}
      - {id: politique, titre: "Art et politique", sous_titre: "soutenir ou critiquer"}
      - {id: romantisme, titre: "Romantisme", sous_titre: "sensation, émotion forte"}
      - {id: tendance, titre: "Progrès et passé", sous_titre: "deux tendances en même temps"}
    liens:
      - {de: public, vers: politique, libelle: "œuvres jugées"}
      - {de: politique, vers: romantisme, libelle: "émotion engagée"}
      - {de: public, vers: tendance, libelle: "nouveaux regards"}
    jules: "Le **romantisme** ne veut pas dire amoureux : c'est un mouvement qui préfère l'émotion forte à la raison et à l'équilibre classique."

  - id: schema
    type: schema
    titre: "Une période à double tendance : progrès et retour au passé"
    svg: "theme-5-lumieres-revolutions.svg"
    jules: "Les deux flèches se lisent en même temps : une même époque peut croire au **progrès** et regarder vers l'Antiquité."

  - id: methode
    type: methode
    etapes:
      - "Repérer si l'œuvre exprime une émotion forte et personnelle : indice de romantisme."
      - "Distinguer une critique du pouvoir en place d'une célébration de ce pouvoir."
      - "Chercher des indices de retour au passé, style antique ou médiéval."
      - "Relier l'œuvre à l'émergence d'un public plus large (expositions, salons)."
    jules: "Une œuvre romantique aime les scènes de nature dramatique ou les sentiments intenses, parfois sombres."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre le romantisme, mouvement artistique, avec le sens courant du mot romantique, amoureux."
    pourquoi_faux: "Le romantisme est un courant né en Allemagne et en Angleterre à la fin du XVIIIe siècle qui exprime des émotions fortes, pas seulement des sentiments amoureux."
    bonne_idee: "Vérifier si l'œuvre exprime une émotion intense (peur, colère, mélancolie) plutôt qu'une simple scène d'amour."
    jules: "Une tempête déchaînée ou un naufrage dramatique sont des sujets romantiques typiques, bien loin d'une simple histoire d'amour."

  - id: exemple
    type: exemple
    situation: "Une peinture représente une figure allégorique menant un groupe de personnes lors d'un soulèvement populaire, avec des couleurs contrastées et un mouvement dramatique."
    conclusion: "Cette œuvre illustre l'art comme expression de la pensée politique, propre à cette période de révolutions, avec un traitement dramatique typique du romantisme."
    jules: "Le mouvement des corps et le contraste des couleurs sont des indices de mise en scène **romantique** au service d'une idée politique."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "romantisme vs classicisme"}
    jules: "Cherche une œuvre romantique et note en une phrase l'émotion qu'elle transmet : c'est le meilleur réflexe pour cette notion."
