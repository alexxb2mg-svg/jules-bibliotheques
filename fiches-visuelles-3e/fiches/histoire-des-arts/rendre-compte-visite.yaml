notion: rendre-compte-visite
titre: "Rendre compte d'une visite ou d'une rencontre avec le patrimoine"
matiere: histoire-des-arts
niveau: 3e
auteurs: ["hermes-hda1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-hda1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Musée »", url: "https://fr.vikidia.org/w/index.php?title=Mus%C3%A9e&oldid=2553277", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: compterendu, titre: "Rendre compte d'une visite", sous_titre: "musée, métier du patrimoine", principal: true}
      - {id: contexte, titre: "Contexte", sous_titre: "lieu, date, sujet"}
      - {id: moment, titre: "Moment marquant", sous_titre: "1 ou 2, développés"}
      - {id: faits, titre: "Faits observés", sous_titre: "ce qui a été vu ou dit"}
      - {id: ressenti, titre: "Ressenti personnel", sous_titre: "bien distingué des faits"}
    liens:
      - {de: compterendu, vers: contexte}
      - {de: compterendu, vers: moment}
      - {de: moment, vers: faits}
      - {de: moment, vers: ressenti}
    jules: "Un métier du patrimoine (restaurateur, conservateur, médiateur) révèle des aspects invisibles en regardant seulement l'œuvre."

  - id: schema
    type: schema
    titre: "Construire un compte rendu de visite"
    svg: "rendre-compte-visite.svg"
    jules: "Il ne s'agit pas de tout raconter, mais de choisir un moment précis et de bien le développer."

  - id: methode
    type: methode
    etapes:
      - "Noter le contexte de la visite (lieu, date, sujet) dès que possible après ou pendant la sortie."
      - "Choisir un ou deux moments marquants à développer plutôt que tout raconter en détail."
      - "Distinguer clairement les faits observés du ressenti personnel."
      - "Si un professionnel a été rencontré, retenir ce que son métier apporte à la conservation ou à la diffusion de l'art."
    jules: "Le compte rendu peut mêler faits et ressenti, à condition de toujours bien **distinguer** les deux."

  - id: piege
    type: piege
    mauvaise_idee: "Faire un résumé chronologique complet de toute la visite, sans rien approfondir."
    pourquoi_faux: "Un compte rendu qui liste tout sans développer perd l'essentiel : ce qui a réellement marqué et pourquoi."
    bonne_idee: "Sélectionner un ou deux moments précis (une œuvre, une explication) et les développer avec précision."
    jules: "Ne mentionner que son ressenti sans aucun fait, ou oublier le **contexte** (lieu, date), sont les mêmes types d'erreur."

  - id: exemple
    type: exemple
    situation: "Une classe visite un musée et rencontre une restauratrice qui explique comment elle nettoie une peinture ancienne sans l'abîmer."
    calcul: "Moment choisi : l'explication de la restauratrice. Fait retenu : la technique de nettoyage et les précautions prises."
    conclusion: "Le compte rendu développe ce moment précis et ce qu'il révèle des **métiers cachés** derrière la conservation, plutôt que de lister toutes les salles."
    jules: "Un seul moment bien raconté vaut mieux qu'une liste de toutes les salles visitées."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "conservateur, restaurateur, médiateur", outil: "lexique"}
    jules: "Entraîne-toi : présente en 3 phrases une visite (contexte, moment marquant, ce que tu en retiens)."
