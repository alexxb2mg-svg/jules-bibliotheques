<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="flechead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">Beauté et fonction : les arts décoratifs</text>

<g class="c-purple"><rect x="220" y="50" width="240" height="55" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="70" text-anchor="middle" dominant-baseline="central">Arts décoratifs</text>
<text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">beau et utile à la fois</text>

<g class="c-blue"><rect x="40" y="160" width="180" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="130" y="185" text-anchor="middle" dominant-baseline="central">Mobilier</text>
<text class="ts" x="130" y="205" text-anchor="middle" dominant-baseline="central">meubles,</text>
<text class="ts" x="130" y="222" text-anchor="middle" dominant-baseline="central">sièges</text>

<g class="c-teal"><rect x="250" y="160" width="180" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="185" text-anchor="middle" dominant-baseline="central">Design</text>
<text class="ts" x="340" y="205" text-anchor="middle" dominant-baseline="central">objets,</text>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">production en série</text>

<g class="c-amber"><rect x="460" y="160" width="180" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="550" y="185" text-anchor="middle" dominant-baseline="central">Arts du métal</text>
<text class="ts" x="550" y="205" text-anchor="middle" dominant-baseline="central">bijoux,</text>
<text class="ts" x="550" y="222" text-anchor="middle" dominant-baseline="central">orfèvrerie</text>

<path d="M290,105 L150,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechead)"/>
<path d="M340,105 L340,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechead)"/>
<path d="M390,105 L520,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechead)"/>

<g class="c-gray"><rect x="40" y="265" width="600" height="40" rx="8" stroke-width="1"/></g>
<text class="t" x="340" y="290" text-anchor="middle" dominant-baseline="central">Toujours deux critères : la beauté ET l'usage quotidien</text>
</svg>
