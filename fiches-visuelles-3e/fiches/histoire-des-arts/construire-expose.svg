<line x1="340" y1="215" x2="340" y2="230" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-coral"><rect x="200" y="235" width="280" height="55" rx="10" fill="#ffe4e0" stroke="#c94b4b" stroke-width="1.5"/></g>
