<text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central">2e œuvre</text>

<g class="node c-purple"><rect x="470" y="135" width="170" height="60" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
