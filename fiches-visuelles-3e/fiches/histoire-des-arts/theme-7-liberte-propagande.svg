<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">Du figuratif à l'abstraction (1910-1945)</text>

<line x1="60" y1="120" x2="620" y2="120" stroke="#9ca3af" stroke-width="2" class="arr" marker-end="url(#fleche7)"/>

<g class="c-blue"><rect x="30" y="150" width="180" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="120" y="175" text-anchor="middle" dominant-baseline="central">Figuratif</text>
<text class="ts" x="120" y="195" text-anchor="middle" dominant-baseline="central">représente le réel</text>
<line x1="120" y1="150" x2="120" y2="120" stroke="#9ca3af" stroke-width="2"/>
<circle cx="120" cy="120" r="4" fill="#2563eb"/>

<g class="c-teal"><rect x="250" y="150" width="180" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="175" text-anchor="middle" dominant-baseline="central">Stylisé</text>
<text class="ts" x="340" y="195" text-anchor="middle" dominant-baseline="central">simplifie le réel</text>
<line x1="340" y1="150" x2="340" y2="120" stroke="#9ca3af" stroke-width="2"/>
<circle cx="340" cy="120" r="4" fill="#0d9488"/>

<g class="c-purple"><rect x="470" y="150" width="180" height="70" rx="8" stroke-width="1.5"/></g>
<text class="t" x="560" y="175" text-anchor="middle" dominant-baseline="central">Abstrait</text>
<text class="ts" x="560" y="195" text-anchor="middle" dominant-baseline="central">formes et couleurs seules</text>
<line x1="560" y1="150" x2="560" y2="120" stroke="#9ca3af" stroke-width="2"/>
<circle cx="560" cy="120" r="4" fill="#7c3aed"/>

<polygon points="540,240 620,240 580,300" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
<rect x="500" y="245" width="30" height="30" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
<circle cx="480" cy="290" r="15" fill="none" stroke="#0d9488" stroke-width="2.5"/>
<text class="ts" x="560" y="320" text-anchor="middle">exemple : formes géométriques pures</text>

<g class="c-gray"><rect x="40" y="335" width="600" height="20" rx="6" stroke-width="0.5"/></g>
<text class="ts" x="340" y="345" text-anchor="middle" dominant-baseline="central">Schéma de synthèse, pas à l'échelle.</text>
</svg>
