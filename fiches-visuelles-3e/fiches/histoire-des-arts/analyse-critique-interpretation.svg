<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">De la description à l'interprétation</text>

<g class="node c-blue"><rect x="20" y="60" width="150" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="t" x="95" y="87" text-anchor="middle" dominant-baseline="central">Description</text>
<text class="ts" x="95" y="109" text-anchor="middle" dominant-baseline="central">faits observés</text>

<line x1="172" y1="95" x2="205" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-teal"><rect x="207" y="60" width="150" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="t" x="282" y="87" text-anchor="middle" dominant-baseline="central">Analyse</text>
<text class="ts" x="282" y="109" text-anchor="middle" dominant-baseline="central">comment ça agit</text>

<line x1="359" y1="95" x2="392" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-purple"><rect x="394" y="60" width="150" height="70" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="469" y="87" text-anchor="middle" dominant-baseline="central">Interprétation</text>
<text class="ts" x="469" y="109" text-anchor="middle" dominant-baseline="central">un sens possible</text>

<line x1="546" y1="95" x2="579" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-amber"><rect x="581" y="60" width="80" height="70" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="t" x="621" y="87" text-anchor="middle" dominant-baseline="central">Contexte</text>
<text class="ts" x="621" y="109" text-anchor="middle" dominant-baseline="central">époque</text>

<g class="c-coral"><rect x="60" y="165" width="560" height="100" rx="8" fill="#ffe4e0" stroke="#c94b4b" stroke-width="1.5"/></g>
<text class="th" x="340" y="188" text-anchor="middle">Formule prudente</text>
<text class="t" x="340" y="216" text-anchor="middle" dominant-baseline="central">« On peut penser que… » « Cela pourrait évoquer… »</text>
<text class="ts" x="340" y="244" text-anchor="middle" dominant-baseline="central">Toujours appuyée sur un élément concret de l'œuvre</text>

<text class="ts" x="340" y="295" text-anchor="middle">Pas à l'échelle. Plusieurs interprétations peuvent coexister.</text>
</svg>
