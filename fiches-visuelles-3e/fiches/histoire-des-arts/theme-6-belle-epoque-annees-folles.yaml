notion: theme-6-belle-epoque-annees-folles
titre: "De la Belle Époque aux années folles : l'ère des avant-gardes (1870-1930)"
matiere: histoire-des-arts
niveau: 3e
auteurs: ["hermes-hda2"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Vikidia, « Impressionnisme »", url: "https://fr.vikidia.org/w/index.php?title=Impressionnisme&oldid=2561020", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Cinéma »", url: "https://fr.vikidia.org/w/index.php?title=Cin%C3%A9ma&oldid=2554372", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
generation: {par: "hermes-hda2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: photo, titre: "Photo et cinéma", sous_titre: "nouveau rapport au réel", principal: true}
      - {id: primitivisme, titre: "Primitivismes", sous_titre: "influences d'autres cultures"}
      - {id: spectacles, titre: "Nouveaux spectacles", sous_titre: "jazz, cirque, music-hall"}
      - {id: avantgarde, titre: "Avant-gardes", sous_titre: "rompre avec l'académisme"}
    liens:
      - {de: photo, vers: avantgarde, libelle: "pousse à chercher"}
      - {de: primitivisme, vers: avantgarde, libelle: "nourrit"}
      - {de: spectacles, vers: avantgarde, libelle: "métropoles"}
    jules: "La photographie ne remplace pas la peinture : elle la pousse vers d'autres recherches, comme la lumière chez les **impressionnistes**."

  - id: schema
    type: schema
    titre: "La photographie change la peinture"
    svg: "theme-6-belle-epoque-annees-folles.svg"
    jules: "La machine fixe le réel avec exactitude ; le peintre cherche alors autre chose, comme l'**impression** fugitive de la lumière."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1870, max: 1930, pas: 1, depart: 1895}
      - {id: curseur-debut, nom: début, min: 1870, max: 1870, pas: 1, depart: 1870}
      - {id: curseur-fin, nom: fin, min: 1930, max: 1930, pas: 1, depart: 1930}
    lectures:
      - {si: "date < 1890", texte: "**Impressionnisme** : Monet peint Impression, soleil levant (1872), exposé en 1874."}
      - {si: "date >= 1890 && date < 1914", texte: "**Belle Époque** : cinéma des frères Lumière (28 décembre 1895), Art nouveau, Les Demoiselles d'Avignon de Picasso (1907)."}
      - {si: "date >= 1914 && date < 1919", texte: "Pendant la Première Guerre mondiale naît **Dada** (1916) ; Duchamp propose Fontaine (1917)."}
      - {si: "date >= 1919", texte: "**Années folles** (années 1920) : le jazz ; Breton publie le Manifeste du **surréalisme** (1924)."}
    jules: "1914 coupe la frise en deux : la Belle Époque avant, les années folles après la guerre."

  - id: methode
    type: methode
    etapes:
      - "Relier l'apparition de la photographie ou du cinéma à un changement dans la peinture."
      - "Repérer des influences venues d'autres cultures dans une œuvre : primitivisme."
      - "Distinguer un spectacle populaire nouveau (jazz, cirque, music-hall) d'une forme plus ancienne."
      - "Identifier ce qui, dans une œuvre, rompt avec les traditions académiques."
    jules: "Le jazz naît d'un mélange de traditions musicales aux États-Unis : c'est déjà un métissage culturel."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que la photographie a immédiatement remplacé la peinture."
    pourquoi_faux: "La photographie a plutôt fait évoluer les recherches de la peinture, par exemple vers la lumière et l'impression plutôt que l'exactitude."
    bonne_idee: "Chercher ce que la peinture peut faire que la photo ne fait pas encore : la couleur, l'impression, l'émotion."
    jules: "Belle Époque et années folles ne désignent pas la même ambiance, même si elles appartiennent à la même période large."

  - id: exemple
    type: exemple
    situation: "Un peintre de cette période s'inspire de masques ou de sculptures venues d'autres continents pour simplifier les formes de ses figures."
    conclusion: "Cette démarche relève du primitivisme, la recherche de racines artistiques nouvelles hors de la tradition académique occidentale."
    jules: "Le **primitivisme** est une des tendances des avant-gardes : il ouvre l'art européen à d'autres cultures."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "Belle Époque vs années folles"}
    jules: "Cherche un exemple de spectacle populaire de cette période et explique en une phrase ce qui le rendait nouveau."
