<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">1750-1850 : deux tendances en même temps</text>

<g class="c-blue"><rect x="50" y="60" width="250" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="175" y="83" text-anchor="middle" dominant-baseline="central">Foi dans le progrès</text>
<text class="ts" x="175" y="103" text-anchor="middle" dominant-baseline="central">sciences, industrie, société</text>

<g class="c-amber"><rect x="380" y="60" width="250" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="505" y="83" text-anchor="middle" dominant-baseline="central">Recours au passé</text>
<text class="ts" x="505" y="103" text-anchor="middle" dominant-baseline="central">Antiquité, Moyen Âge</text>

<path d="M300,90 L380,90" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,4"/>
<text class="ts" x="340" y="80" text-anchor="middle">même époque</text>

<g class="c-purple"><rect x="90" y="160" width="220" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="200" y="183" text-anchor="middle" dominant-baseline="central">Nouveaux publics</text>
<text class="ts" x="200" y="203" text-anchor="middle" dominant-baseline="central">expositions, critique d'art</text>

<g class="c-coral"><rect x="370" y="160" width="220" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="480" y="183" text-anchor="middle" dominant-baseline="central">Art politique</text>
<text class="ts" x="480" y="203" text-anchor="middle" dominant-baseline="central">soutenir ou critiquer</text>

<path d="M200,120 L200,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche5)"/>
<path d="M480,120 L480,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche5)"/>

<g class="c-teal"><rect x="190" y="255" width="300" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="278" text-anchor="middle" dominant-baseline="central">Romantisme</text>
<text class="ts" x="340" y="298" text-anchor="middle" dominant-baseline="central">émotion forte, sensibilité</text>

<path d="M200,220 L300,254" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche5)"/>
<path d="M480,220 L380,254" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche5)"/>

<g class="c-gray"><rect x="40" y="335" width="600" height="35" rx="8" stroke-width="0.5"/></g>
<text class="ts" x="340" y="353" text-anchor="middle" dominant-baseline="central">Schéma de synthèse, pas à l'échelle.</text>
