<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Construire un compte rendu de visite</text>

<g class="node c-amber"><rect x="30" y="55" width="180" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="t" x="120" y="78" text-anchor="middle" dominant-baseline="central">Contexte</text>
<text class="ts" x="120" y="98" text-anchor="middle" dominant-baseline="central">lieu, date, sujet</text>

<line x1="212" y1="85" x2="248" y2="85" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-blue"><rect x="250" y="55" width="180" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="t" x="340" y="78" text-anchor="middle" dominant-baseline="central">Moment marquant</text>
<text class="ts" x="340" y="98" text-anchor="middle" dominant-baseline="central">1 ou 2, bien développés</text>

<line x1="432" y1="85" x2="468" y2="85" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-purple"><rect x="470" y="55" width="180" height="60" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="560" y="78" text-anchor="middle" dominant-baseline="central">Métier du patrimoine</text>
<text class="ts" x="560" y="98" text-anchor="middle" dominant-baseline="central">si rencontré</text>

<line x1="340" y1="115" x2="340" y2="145" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>

<g class="c-teal"><rect x="90" y="150" width="220" height="90" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="th" x="200" y="173" text-anchor="middle">Faits observés</text>
<text class="ts" x="200" y="200" text-anchor="middle" dominant-baseline="central">ce qui a été vu ou dit</text>

<g class="c-coral"><rect x="370" y="150" width="220" height="90" rx="8" fill="#ffe4e0" stroke="#c94b4b" stroke-width="1.5"/></g>
<text class="th" x="480" y="173" text-anchor="middle">Ressenti personnel</text>
<text class="ts" x="480" y="200" text-anchor="middle" dominant-baseline="central">bien distingué des faits</text>

<text class="ts" x="340" y="270" text-anchor="middle">Pas à l'échelle. Ne pas tout raconter : choisir et développer.</text>
</svg>
