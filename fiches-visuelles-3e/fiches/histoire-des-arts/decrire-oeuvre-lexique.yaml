relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: decrire, titre: "Décrire une œuvre", sous_titre: "identité + observation", principal: true}
      - {id: identite, titre: "Identité", sous_titre: "titre, auteur, date, technique"}
      - {id: observation, titre: "Observation objective", sous_titre: "sujet, composition, couleurs"}
      - {id: lexique, titre: "Lexique précis", sous_titre: "peinture, sculpture, façade…"}
      - {id: epoque, titre: "Situer l'époque", sous_titre: "à partir des indices"}
    liens:
      - {de: decrire, vers: identite}
      - {de: decrire, vers: observation}
      - {de: observation, vers: lexique}
      - {de: observation, vers: epoque}
    jules: "Décrire, ce n'est pas interpréter : on dit d'abord ce qu'on voit objectivement, avant de proposer un sens."

  - id: schema
    type: schema
    titre: "Décrire, étape par étape"
    svg: "decrire-oeuvre-lexique.svg"
    jules: "L'ordre compte : on identifie et on observe **avant** d'interpréter, qui est une autre compétence."

  - id: methode
    type: methode
    etapes:
      - "Identifier l'œuvre : titre, auteur, date, technique ou matériau si l'information est disponible."
      - "Décrire ce qui est objectivement visible ou audible : sujet, composition, couleurs, matières, sons."
      - "Utiliser un vocabulaire précis adapté au domaine artistique (peinture, sculpture, architecture, musique)."
      - "Chercher des indices (style, technique, objets représentés) pour situer l'œuvre dans une époque."
    jules: "Le bon mot évite les confusions : une **façade** n'est pas un **plan**, une **mélodie** n'est pas un **rythme**."

  - id: piege
    type: piege
    mauvaise_idee: "Mélanger description et interprétation dès la première phrase, en disant tout de suite ce que l'œuvre « veut dire »."
    pourquoi_faux: "On ne peut juger d'un sens possible qu'après avoir observé les faits : la **description** vient toujours avant l'**interprétation**."
    bonne_idee: "Commencer par des faits objectifs (sujet, technique, couleurs) et garder l'interprétation pour une étape distincte."
    jules: "Utiliser un terme vague comme « un truc » au lieu du mot précis du domaine artistique est le même genre d'erreur."

  - id: exemple
    type: exemple
    situation: "Décrire en une phrase une œuvre montrant un champ de fleurs jaunes peint avec des touches de couleur épaisses et visibles."
    calcul: "Identification du type : peinture à l'huile. Technique observée : empâtement (peinture épaisse en relief). Couleurs : vives, juxtaposées sans mélange complet."
    conclusion: "Il s'agit d'une peinture à l'huile représentant un paysage de champ, avec une technique d'**empâtement** et des couleurs vives juxtaposées."
    jules: "Le mot **empâtement** décrit précisément ce que montre la matière : une peinture épaisse qui fait relief sur la toile."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "empâtement, composition, technique", outil: "lexique"}
    jules: "Entraîne-toi à l'oral : choisis une œuvre étudiée et décris-la en 3 phrases maximum, sans donner ton avis."
