<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="flechesv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">Le spectacle vivant : trois disciplines</text>

<g class="c-purple"><rect x="220" y="50" width="240" height="55" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="70" text-anchor="middle" dominant-baseline="central">Spectacle vivant</text>
<text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">joué devant un public, en direct</text>

<g class="c-blue"><rect x="40" y="160" width="180" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="130" y="185" text-anchor="middle" dominant-baseline="central">Théâtre</text>
<text class="ts" x="130" y="205" text-anchor="middle" dominant-baseline="central">texte, jeu,</text>
<text class="ts" x="130" y="222" text-anchor="middle" dominant-baseline="central">mise en scène</text>

<g class="c-pink"><rect x="250" y="160" width="180" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="185" text-anchor="middle" dominant-baseline="central">Danse</text>
<text class="ts" x="340" y="205" text-anchor="middle" dominant-baseline="central">corps, mouvement,</text>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">chorégraphie</text>

<g class="c-amber"><rect x="460" y="160" width="180" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="550" y="185" text-anchor="middle" dominant-baseline="central">Opéra</text>
<text class="ts" x="550" y="205" text-anchor="middle" dominant-baseline="central">chant, musique,</text>
<text class="ts" x="550" y="222" text-anchor="middle" dominant-baseline="central">livret</text>

<path d="M290,105 L150,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechesv)"/>
<path d="M340,105 L340,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechesv)"/>
<path d="M390,105 L520,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechesv)"/>

<g class="c-gray"><rect x="40" y="265" width="600" height="40" rx="8" stroke-width="1"/></g>
<text class="t" x="340" y="290" text-anchor="middle" dominant-baseline="central">Point commun : une représentation unique, jamais identique à une autre</text>
</svg>
