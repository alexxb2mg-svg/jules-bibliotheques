notion: nommer-oeuvres-majeures
titre: "Nommer des œuvres majeures et leurs éléments constitutifs"
matiere: histoire-des-arts
niveau: 3e
auteurs: ["hermes-hda1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-hda1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Impressionnisme »", url: "https://fr.vikidia.org/w/index.php?title=Impressionnisme&oldid=2561020", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Art abstrait »", url: "https://fr.vikidia.org/w/index.php?title=Art_abstrait&oldid=2261134", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: oeuvre, titre: "Œuvre majeure", sous_titre: "rattachée à une époque", principal: true}
      - {id: materiau, titre: "Matériau", sous_titre: "ou technique"}
      - {id: forme, titre: "Forme", sous_titre: "composition, dimensions"}
      - {id: sens, titre: "Sens", sous_titre: "intention supposée"}
      - {id: fonction, titre: "Fonction", sous_titre: "religieuse, décorative…"}
    liens:
      - {de: oeuvre, vers: materiau}
      - {de: oeuvre, vers: forme}
      - {de: oeuvre, vers: sens}
      - {de: oeuvre, vers: fonction}
    jules: "Ce n'est pas retenir une liste de titres qui compte, mais comprendre pourquoi chaque œuvre représente son époque."

  - id: schema
    type: schema
    titre: "Les 4 éléments constitutifs d'une œuvre"
    svg: "nommer-oeuvres-majeures.svg"
    jules: "Matériau, forme, sens et fonction se retiennent ensemble : ils expliquent pourquoi l'œuvre est représentative."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: -200, max: 2000, pas: 10, depart: 1500}
      - {id: curseur-debut, nom: début, min: -200, max: -200, pas: 1, depart: -200}
      - {id: curseur-fin, nom: fin, min: 2000, max: 2000, pas: 1, depart: 2000}
    lectures:
      - {si: "date < 0", texte: "**Antiquité**, avant J.-C. : la **Vénus de Milo**, statue grecque en marbre (vers le IIe siècle av. J.-C.)."}
      - {si: "date >= 1000 && date < 1200", texte: "**Moyen Âge**, fin du XIe siècle : la **Tapisserie de Bayeux** raconte la conquête de l'Angleterre (1066)."}
      - {si: "date >= 1500 && date < 1600", texte: "**Renaissance**, début du XVIe siècle : **La Joconde**, de Léonard de Vinci."}
      - {si: "date >= 1800", texte: "**XIXe et XXe siècles** : Le Radeau de la Méduse (1818-1819), Impression, soleil levant (1872), Guernica (1937), Marilyn Diptych (1962)."}
    jules: "Une œuvre, une époque : place le repère sur chaque œuvre de la fiche, puis dis son titre, son auteur et son siècle."

  - id: methode
    type: methode
    etapes:
      - "Pour chaque œuvre étudiée, retenir : titre, auteur, date approximative, technique."
      - "Identifier sa fonction d'origine (religieuse, décorative, commémorative, critique…)."
      - "Relier l'œuvre à un mouvement ou une période déjà connus."
      - "Pouvoir expliquer en une phrase pourquoi cette œuvre est représentative de son époque."
    jules: "Pour une œuvre protégée par le droit d'auteur, on peut citer titre et auteur et expliquer sa démarche, sans reproduire l'image."

  - id: piege
    type: piege
    mauvaise_idee: "Mémoriser un titre sans savoir le rattacher à une époque ou un mouvement artistique."
    pourquoi_faux: "Un titre isolé n'apporte rien : c'est le lien avec l'époque et la démarche de l'artiste qui donne du sens à la mémorisation."
    bonne_idee: "Toujours associer le titre à son époque, son aire de production et sa fonction d'origine."
    jules: "Confondre la fonction d'**origine** d'une œuvre (religieuse, par exemple) avec son usage actuel (exposée en musée) est une erreur fréquente."

  - id: exemple
    type: exemple
    situation: "Retenir une œuvre représentative de l'impressionnisme."
    calcul: "Titre : Impression, soleil levant. Auteur : Claude Monet. Date : 1872. Technique : peinture à l'huile."
    conclusion: "Cette œuvre a donné son nom au mouvement **impressionniste** : un port dans la brume, des touches rapides et visibles, une **impression** fugitive plutôt qu'un rendu académique."
    jules: "Le titre de l'œuvre a directement donné son nom au mouvement artistique tout entier."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "mécénat, mouvement, fonction", outil: "lexique"}
    jules: "Entraîne-toi : présente en 3 phrases une œuvre majeure (identité, époque, fonction d'origine)."
