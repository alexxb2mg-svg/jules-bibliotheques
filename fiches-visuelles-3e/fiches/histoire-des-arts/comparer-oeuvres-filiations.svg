<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Filiation ou parenté ?</text>

<g class="c-blue"><rect x="30" y="55" width="280" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="th" x="170" y="82" text-anchor="middle">Filiation</text>
<circle cx="90" cy="130" r="22" class="c-gray" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text class="ts" x="90" y="130" text-anchor="middle" dominant-baseline="central">œuvre A</text>
<text class="ts" x="90" y="158" text-anchor="middle">époque 1</text>
<circle cx="250" cy="130" r="22" class="c-gray" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text class="ts" x="250" y="130" text-anchor="middle" dominant-baseline="central">œuvre B</text>
<text class="ts" x="250" y="158" text-anchor="middle">époque 2</text>
<line x1="112" y1="130" x2="228" y2="130" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
<text class="ts" x="170" y="200" text-anchor="middle" dominant-baseline="central">époques différentes</text>
<text class="ts" x="170" y="222" text-anchor="middle" dominant-baseline="central">B s'inspire de A</text>

<g class="c-coral"><rect x="370" y="55" width="280" height="200" rx="10" fill="#ffe4e0" stroke="#c94b4b" stroke-width="1.5"/></g>
<text class="th" x="510" y="82" text-anchor="middle">Parenté</text>
<circle cx="430" cy="130" r="22" class="c-gray" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text class="ts" x="430" y="130" text-anchor="middle" dominant-baseline="central">œuvre C</text>
<text class="ts" x="430" y="158" text-anchor="middle">même époque</text>
<circle cx="590" cy="130" r="22" class="c-gray" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text class="ts" x="590" y="130" text-anchor="middle" dominant-baseline="central">œuvre D</text>
<text class="ts" x="590" y="158" text-anchor="middle">même époque</text>
<line x1="452" y1="130" x2="568" y2="130" stroke="#c94b4b" stroke-width="2"/>
<text class="ts" x="510" y="200" text-anchor="middle" dominant-baseline="central">nature différente</text>
<text class="ts" x="510" y="222" text-anchor="middle" dominant-baseline="central">esprit commun</text>

<text class="ts" x="340" y="280" text-anchor="middle">Pas à l'échelle. Toujours un critère précis (sujet, technique, composition).</text>
</svg>
