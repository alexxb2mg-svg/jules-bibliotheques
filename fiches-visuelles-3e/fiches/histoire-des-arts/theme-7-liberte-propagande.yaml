  - {titre: "Wikipédia, « Art abstrait »", url: "https://fr.wikipedia.org/w/index.php?title=Art_abstrait&oldid=239711738", licence: CC-BY-SA-4.0}
relecture: {statut: a_relire}
generation: {par: "hermes-hda2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: abstraction, titre: "Naissance de l'abstraction", sous_titre: "formes et couleurs libres", principal: true}
      - {id: pouvoir, titre: "Art et pouvoir", sous_titre: "propagande ou contestation"}
      - {id: femmes, titre: "Femmes artistes", sous_titre: "émancipation progressive"}
      - {id: electricite, titre: "Fée électricité", sous_titre: "modernité, progrès"}
    liens:
      - {de: abstraction, vers: femmes, libelle: "nouvelles voies"}
      - {de: pouvoir, vers: abstraction, libelle: "même période"}
      - {de: electricite, vers: abstraction, libelle: "sujet moderne"}
    jules: "L'**art abstrait** ne représente plus le monde visible : il s'organise par lui-même, uniquement avec des formes et des couleurs."

  - id: schema
    type: schema
    titre: "Du figuratif à l'abstraction"
    svg: "theme-7-liberte-propagande.svg"
    jules: "Entre les deux extrêmes, une œuvre peut être **stylisée** : elle simplifie le réel sans encore l'abandonner complètement."

  - id: methode
    type: methode
    etapes:
      - "Distinguer une œuvre figurative, qui représente encore le monde, d'une œuvre pleinement abstraite."
      - "Repérer si une œuvre semble servir un pouvoir (propagande) ou le contester (art engagé)."
      - "Chercher des exemples de femmes artistes reconnues durant cette période."
      - "Identifier une œuvre qui prend l'électricité ou la modernité technique comme sujet."
    jules: "L'abstraction n'apparaît pas d'un coup : elle vient de recherches antérieures sur la couleur et la forme."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre propagande, mise au service d'un pouvoir, et art simplement politique ou engagé."
    pourquoi_faux: "La propagande glorifie directement un pouvoir en place, alors qu'une œuvre engagée peut au contraire le critiquer ou le dénoncer librement."
    bonne_idee: "Se demander qui commande l'œuvre et dans quel but : glorifier un régime, ou exprimer une opinion libre."
    jules: "Une même technique (une affiche, une fresque) peut servir la propagande ou la contestation : c'est l'intention qui change tout."

  - id: exemple
    type: exemple
    situation: "Une composition ne montre que des formes géométriques colorées, sans aucun objet reconnaissable, réalisée au début du XXe siècle."
    conclusion: "Cette œuvre illustre la naissance de l'art abstrait : l'autonomie des formes et des couleurs par rapport à toute obligation de représenter le monde visible."
    jules: "Vassily Kandinsky est un artiste souvent associé à cette démarche d'**abstraction** naissante."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "propagande vs art engagé"}
    jules: "Cherche le nom d'une femme artiste reconnue durant cette période et résume sa démarche en une phrase."
