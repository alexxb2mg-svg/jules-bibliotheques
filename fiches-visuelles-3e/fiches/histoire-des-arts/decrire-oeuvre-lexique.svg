<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Décrire une œuvre, étape par étape</text>

<g class="node c-blue"><rect x="30" y="55" width="180" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="t" x="120" y="82" text-anchor="middle" dominant-baseline="central">1. Identifier</text>
<text class="ts" x="120" y="104" text-anchor="middle" dominant-baseline="central">titre, auteur, date, technique</text>

<line x1="212" y1="90" x2="248" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-teal"><rect x="250" y="55" width="180" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="t" x="340" y="82" text-anchor="middle" dominant-baseline="central">2. Décrire</text>
<text class="ts" x="340" y="104" text-anchor="middle" dominant-baseline="central">sujet, composition, couleurs</text>

<line x1="432" y1="90" x2="468" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

<g class="node c-purple"><rect x="470" y="55" width="180" height="70" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="560" y="82" text-anchor="middle" dominant-baseline="central">3. Situer l'époque</text>
<text class="ts" x="560" y="104" text-anchor="middle" dominant-baseline="central">à partir des indices</text>

<line x1="120" y1="125" x2="120" y2="160" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="560" y1="125" x2="560" y2="160" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>

<g class="c-coral"><rect x="40" y="165" width="600" height="90" rx="8" fill="#ffe4e0" stroke="#c94b4b" stroke-width="1.5"/></g>
<text class="t" x="340" y="192" text-anchor="middle" dominant-baseline="central">Lexique précis : peinture, sculpture, portrait, paysage,</text>
<text class="t" x="340" y="216" text-anchor="middle" dominant-baseline="central">façade, plan, mélodie, rythme…</text>
<text class="ts" x="340" y="242" text-anchor="middle" dominant-baseline="central" fill="#c94b4b">Interdit ici : interpréter (donner un sens) — c'est une autre étape</text>

<text class="ts" x="340" y="295" text-anchor="middle">Pas à l'échelle. Description objective avant interprétation.</text>
</svg>
