<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="flechebx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">Le champ des beaux-arts</text>

<g class="c-purple"><rect x="245" y="50" width="190" height="55" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="78" text-anchor="middle" dominant-baseline="central">Beaux-arts</text>

<g class="c-blue"><rect x="40" y="160" width="180" height="90" rx="8" stroke-width="1.5"/></g>
<text class="t" x="130" y="185" text-anchor="middle" dominant-baseline="central">Peinture</text>
<text class="ts" x="130" y="205" text-anchor="middle" dominant-baseline="central">surface, couleur,</text>
<text class="ts" x="130" y="222" text-anchor="middle" dominant-baseline="central">ligne, fresque</text>

<g class="c-teal"><rect x="250" y="160" width="180" height="90" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="185" text-anchor="middle" dominant-baseline="central">Sculpture</text>
<text class="ts" x="340" y="205" text-anchor="middle" dominant-baseline="central">volume, ronde-bosse,</text>
<text class="ts" x="340" y="222" text-anchor="middle" dominant-baseline="central">relief</text>

<g class="c-amber"><rect x="460" y="160" width="180" height="90" rx="8" stroke-width="1.5"/></g>
<text class="t" x="550" y="185" text-anchor="middle" dominant-baseline="central">Architecture</text>
<text class="ts" x="550" y="205" text-anchor="middle" dominant-baseline="central">espace,</text>
<text class="ts" x="550" y="222" text-anchor="middle" dominant-baseline="central">construction</text>

<path d="M300,105 L150,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechebx)"/>
<path d="M340,105 L340,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechebx)"/>
<path d="M380,105 L520,159" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#flechebx)"/>

<circle cx="130" cy="300" r="20" fill="none" stroke="#2563eb" stroke-width="2"/>
<text class="ts" x="130" y="333" text-anchor="middle">ronde-bosse : vue à 360°</text>

<rect x="310" y="285" width="60" height="30" fill="#d1e3ff" stroke="#2563eb" stroke-width="2"/>
<rect x="325" y="278" width="30" height="15" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
<text class="ts" x="340" y="333" text-anchor="middle">relief : attaché au fond</text>

<polygon points="550,280 590,280 590,315 510,315 510,300" fill="none" stroke="#b45309" stroke-width="2"/>
<text class="ts" x="550" y="333" text-anchor="middle">architecture : l'espace bâti</text>
</svg>
