    jules: "L'artiste n'est plus un artisan anonyme : il devient reconnu individuellement pour son talent grâce au **mécénat**."

  - id: schema
    type: schema
    titre: "Œuvre unique ou œuvre reproductible ?"
    svg: "theme-3-sacre-artiste.svg"
    jules: "La **gravure** permet pour la première fois de reproduire une image en plusieurs exemplaires identiques."

  - id: methode
    type: methode
    etapes:
      - "Repérer si une œuvre a été commandée par un mécène et en quoi ce soutien a influencé sa réalisation."
      - "Situer géographiquement une œuvre de la Renaissance (Italie, Flandres, France) pour comprendre les circulations artistiques."
      - "Distinguer une œuvre unique (peinture, sculpture) d'une œuvre reproductible (gravure imprimée)."
      - "Relier le développement de l'imprimerie à un changement dans la diffusion des images ou des idées."
    jules: "Ce mouvement naît dans les **cités-États italiennes** puis se diffuse en Europe par les échanges entre régions."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que tous les artistes de cette période étaient déjà célèbres et indépendants."
    pourquoi_faux: "Beaucoup d'artistes dépendaient encore fortement du soutien d'un mécène, sans lequel ils ne pouvaient réaliser leurs œuvres."
    bonne_idee: "Toujours chercher le rôle du mécène dans la commande et la réalisation d'une œuvre de cette période."
    jules: "Limiter la Renaissance à l'**Italie** seule fait oublier les échanges essentiels avec les Flandres et la France."

  - id: exemple
    type: exemple
    situation: "Un riche mécène italien finance un peintre pour décorer une chapelle familiale."
    calcul: "Financement : le mécène. Attentes en retour : sujet religieux, mise en valeur de la famille du mécène."
    conclusion: "Ce fonctionnement, typique de la **Renaissance italienne**, permet à l'artiste de réaliser une œuvre ambitieuse en répondant aux attentes du commanditaire."
    jules: "Le mécénat est un échange : financement contre une œuvre qui répond aux attentes du commanditaire."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "mécène, gravure, cité-État", outil: "lexique"}
    jules: "Entraîne-toi : explique en 2 phrases ce qu'est le mécénat et pourquoi il a joué un rôle important à la Renaissance."
