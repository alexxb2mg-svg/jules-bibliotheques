<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="fleche6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="28" text-anchor="middle">1870-1930 : la photographie change la peinture</text>

<g class="c-blue"><rect x="40" y="60" width="280" height="90" rx="8" stroke-width="1.5"/></g>
<text class="t" x="180" y="88" text-anchor="middle" dominant-baseline="central">Photographie</text>
<text class="ts" x="180" y="108" text-anchor="middle" dominant-baseline="central">image fidèle du réel</text>
<text class="ts" x="180" y="128" text-anchor="middle" dominant-baseline="central">fixée par une machine</text>

<path d="M320,105 L370,105" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche6)"/>

<g class="c-coral"><rect x="370" y="60" width="270" height="90" rx="8" stroke-width="1.5" fill="#ffe4de" stroke="#f4675a"/></g>
<text class="t" x="505" y="88" text-anchor="middle" dominant-baseline="central">Peinture impressionniste</text>
<text class="ts" x="505" y="108" text-anchor="middle" dominant-baseline="central">cherche la lumière,</text>
<text class="ts" x="505" y="128" text-anchor="middle" dominant-baseline="central">l'impression fugitive</text>

<g class="c-purple"><rect x="70" y="200" width="230" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="185" y="223" text-anchor="middle" dominant-baseline="central">Primitivismes</text>
<text class="ts" x="185" y="243" text-anchor="middle" dominant-baseline="central">influences d'autres cultures</text>

<g class="c-amber"><rect x="380" y="200" width="230" height="60" rx="8" stroke-width="1.5"/></g>
<text class="t" x="495" y="223" text-anchor="middle" dominant-baseline="central">Métropoles</text>
<text class="ts" x="495" y="243" text-anchor="middle" dominant-baseline="central">jazz, cirque, music-hall</text>

<path d="M185,150 L185,199" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche6)"/>
<path d="M495,150 L495,199" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche6)"/>

<g class="c-teal"><rect x="190" y="285" width="300" height="55" rx="8" stroke-width="1.5"/></g>
<text class="t" x="340" y="313" text-anchor="middle" dominant-baseline="central">Avant-gardes : rompre avec l'académisme</text>

<path d="M185,260 L300,290" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche6)"/>
<path d="M495,260 L390,290" stroke="#374151" stroke-width="2" class="arr" marker-end="url(#fleche6)"/>

<g class="c-gray"><rect x="40" y="350" width="600" height="25" rx="6" stroke-width="0.5"/></g>
<text class="ts" x="340" y="363" text-anchor="middle" dominant-baseline="central">Schéma de synthèse, pas à l'échelle.</text>
</svg>
