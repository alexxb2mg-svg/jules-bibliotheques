<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Style roman contre style gothique</text>

<g class="c-blue"><rect x="30" y="55" width="290" height="170" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="th" x="175" y="80" text-anchor="middle">Roman</text>
<path d="M100,190 L100,140 A40,40 0 0 1 180,140 L180,190 Z" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<text class="ts" x="175" y="140" text-anchor="middle" dominant-baseline="central">arc en plein cintre</text>
<text class="ts" x="175" y="210" text-anchor="middle" dominant-baseline="central">bâtiment massif, moins de lumière</text>

<g class="c-coral"><rect x="360" y="55" width="290" height="170" rx="10" fill="#ffe4e0" stroke="#c94b4b" stroke-width="1.5"/></g>
<text class="th" x="505" y="80" text-anchor="middle">Gothique</text>
<path d="M430,190 L430,150 L505,105 L580,150 L580,190 Z" fill="none" stroke="#c94b4b" stroke-width="2.5"/>
<text class="ts" x="505" y="200" text-anchor="middle" dominant-baseline="central">arc brisé, arcs-boutants</text>
<text class="ts" x="505" y="215" text-anchor="middle" dominant-baseline="central">plus haut, plus lumineux</text>

<line x1="320" y1="140" x2="350" y2="140" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>

<g class="c-gray"><rect x="60" y="240" width="560" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/></g>
<text class="t" x="340" y="262" text-anchor="middle" dominant-baseline="central">Manuscrit médiéval : texte copié à la main + enluminure peinte</text>
</svg>
