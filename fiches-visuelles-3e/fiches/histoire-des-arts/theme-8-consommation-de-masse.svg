<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="28" text-anchor="middle">Depuis 1945 : quatre évolutions parallèles</text>

<g class="c-coral"><rect x="40" y="55" width="290" height="80" rx="8" fill="#ffe4de" stroke="#f4675a" stroke-width="1.5"/></g>
<text class="t" x="185" y="82" text-anchor="middle" dominant-baseline="central">Pop art</text>
<text class="ts" x="185" y="102" text-anchor="middle" dominant-baseline="central">objets de consommation,</text>
<text class="ts" x="185" y="118" text-anchor="middle" dominant-baseline="central">critique et fascination</text>

<g class="c-blue"><rect x="350" y="55" width="290" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="495" y="82" text-anchor="middle" dominant-baseline="central">Architecture et design</text>
<text class="ts" x="495" y="102" text-anchor="middle" dominant-baseline="central">nouvelles technologies,</text>
<text class="ts" x="495" y="118" text-anchor="middle" dominant-baseline="central">nouveaux modes de vie</text>

<g class="c-green"><rect x="40" y="160" width="290" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="185" y="187" text-anchor="middle" dominant-baseline="central">Énergie et climat</text>
<text class="ts" x="185" y="207" text-anchor="middle" dominant-baseline="central">développement durable,</text>
<text class="ts" x="185" y="223" text-anchor="middle" dominant-baseline="central">sujet artistique récent</text>

<g class="c-purple"><rect x="350" y="160" width="290" height="80" rx="8" stroke-width="1.5"/></g>
<text class="t" x="495" y="187" text-anchor="middle" dominant-baseline="central">Métissages</text>
<text class="ts" x="495" y="207" text-anchor="middle" dominant-baseline="central">échanges entre cultures,</text>
<text class="ts" x="495" y="223" text-anchor="middle" dominant-baseline="central">globalisation</text>

<g class="c-gray"><rect x="40" y="260" width="600" height="60" rx="8" stroke-width="1"/></g>
<text class="t" x="340" y="283" text-anchor="middle" dominant-baseline="central">Ces quatre évolutions se déroulent souvent en même temps</text>
<text class="ts" x="340" y="303" text-anchor="middle" dominant-baseline="central">depuis 1945 jusqu'à aujourd'hui</text>

<g class="c-amber"><rect x="40" y="335" width="600" height="30" rx="8" stroke-width="0.5"/></g>
<text class="ts" x="340" y="352" text-anchor="middle" dominant-baseline="central">Schéma de synthèse, pas à l'échelle.</text>
</svg>
