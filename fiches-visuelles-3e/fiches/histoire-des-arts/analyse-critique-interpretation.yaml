    liens:
      - {de: analyser, vers: analyse}
      - {de: analyser, vers: interpretation}
      - {de: interpretation, vers: contexte}
      - {de: interpretation, vers: prudence}
    jules: "Plusieurs interprétations peuvent coexister pour une même œuvre : c'est normal, pas un signe d'erreur."

  - id: schema
    type: schema
    titre: "De la description à l'interprétation"
    svg: "analyse-critique-interpretation.svg"
    jules: "Chaque étape s'appuie sur la précédente : sans description précise, l'interprétation devient une simple impression."

  - id: methode
    type: methode
    etapes:
      - "Partir d'une description précise avant de chercher un sens."
      - "Relier les choix plastiques ou musicaux observés (couleur, composition, technique) à un effet ressenti."
      - "Utiliser le contexte historique connu (époque, commande, événement) pour éclairer une interprétation."
      - "Formuler l'interprétation avec prudence (« on peut penser que », « cela pourrait évoquer »)."
    jules: "L'**analyse critique** peut aussi questionner la réception de l'œuvre : scandale à sa création, succès aujourd'hui."

  - id: piege
    type: piege
    mauvaise_idee: "Affirmer une interprétation comme une vérité unique et certaine, sans nuance."
    pourquoi_faux: "Interpréter sans s'appuyer sur un élément concret observé dans l'œuvre revient à inventer un sens, pas à l'analyser."
    bonne_idee: "Utiliser des formules prudentes et toujours citer l'élément précis de l'œuvre qui justifie l'interprétation."
    jules: "Ignorer le **contexte historique** de création prive souvent l'interprétation d'un éclairage essentiel."

  - id: exemple
    type: exemple
    situation: "Une peinture représentant une scène de bataille utilise des couleurs sombres et des corps désarticulés au sol."
    calcul: "Élément observé : couleurs sombres, corps désarticulés. Contexte : autres peintures historiques de la même époque plus héroïques."
    conclusion: "On peut interpréter ces choix comme une volonté de montrer l'**horreur** de la guerre plutôt que de la glorifier."
    jules: "L'interprétation reste appuyée sur un fait visible (les couleurs, les corps), pas sur une simple impression."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "analyse, interprétation, réception", outil: "lexique"}
    jules: "Entraîne-toi : pour une œuvre déjà décrite, propose une interprétation en citant l'élément précis qui la justifie."
