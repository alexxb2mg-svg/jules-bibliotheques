blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: analyser, titre: "Analyser et interpréter", sous_titre: "après la description", principal: true}
      - {id: analyse, titre: "Analyse", sous_titre: "comment l'œuvre fonctionne"}
      - {id: interpretation, titre: "Interprétation", sous_titre: "un sens possible"}
      - {id: contexte, titre: "Contexte", sous_titre: "époque, commande, artiste"}
