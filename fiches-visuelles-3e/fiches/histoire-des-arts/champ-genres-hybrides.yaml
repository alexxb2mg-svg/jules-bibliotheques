relecture: {statut: a_relire}
generation: {par: "hermes-hda2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: champ, titre: "Genres hybrides", sous_titre: "mélangent plusieurs arts", principal: true}
      - {id: installation, titre: "Installation", sous_titre: "occupe un espace entier"}
      - {id: performance, titre: "Performance", sous_titre: "action, corps, temps"}
      - {id: numerique, titre: "Art numérique", sous_titre: "images, sons, interactivité"}
    liens:
      - {de: champ, vers: installation, libelle: "exemple"}
      - {de: champ, vers: performance, libelle: "exemple"}
      - {de: champ, vers: numerique, libelle: "exemple"}
    jules: "Une **installation** transforme un espace entier en œuvre : le visiteur marche à l'intérieur, il ne regarde plus seulement un objet posé au mur."

  - id: schema
    type: schema
    titre: "Genres hybrides : au croisement de plusieurs disciplines"
    svg: "champ-genres-hybrides.svg"
    jules: "Ces trois exemples se rejoignent tous au même endroit : ils dépassent les frontières classiques entre peinture, sculpture et spectacle."

  - id: methode
    type: methode
    etapes:
      - "Repérer si l'œuvre occupe un espace entier plutôt qu'un seul support : indice d'installation."
      - "Vérifier si l'œuvre repose sur une action réalisée en direct par un artiste : indice de performance."
      - "Chercher la présence d'écrans, de sons programmés ou d'interactivité : indice d'art numérique."
      - "Identifier au moins deux disciplines classiques mélangées dans la même œuvre."
    jules: "Une **performance** n'existe que pendant le temps de l'action : elle ne laisse parfois qu'une trace photographique ou vidéo."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'une installation est simplement une grande sculpture posée dans une salle."
    pourquoi_faux: "Une installation organise tout un espace, parfois avec du son, de la lumière ou plusieurs éléments dispersés, pour que le visiteur en fasse l'expérience en s'y déplaçant."
    bonne_idee: "Vérifier si l'œuvre demande au visiteur de se déplacer à l'intérieur ou autour d'un dispositif complet, pas seulement de regarder un objet unique."
    jules: "Les genres hybrides existent surtout depuis le milieu du XXe siècle, quand les artistes ont cherché à sortir du cadre du tableau et du socle."

  - id: exemple
    type: exemple
    situation: "Un artiste occupe entièrement une grande salle avec des objets suspendus, une lumière colorée et une bande sonore diffusée en continu."
    conclusion: "Cette œuvre est une installation : elle transforme l'espace entier en expérience artistique que le visiteur traverse physiquement."
    jules: "Le déplacement du visiteur dans l'espace est le signe le plus sûr d'une **installation**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "installation, performance, ready-made", outil: "lexique"}
    jules: "Imagine une performance artistique simple et note en une phrase ce qui la rend éphémère, impossible à répéter à l'identique."
