notion: theme-8-consommation-de-masse
titre: "Les arts à l'ère de la consommation de masse (depuis 1945)"
matiere: histoire-des-arts
niveau: 3e
auteurs: ["hermes-hda2"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Vikidia, « Pop art »", url: "https://fr.vikidia.org/w/index.php?title=Pop_art&oldid=2360735", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Design »", url: "https://fr.vikidia.org/w/index.php?title=Design&oldid=2339048", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
generation: {par: "hermes-hda2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: popart, titre: "Pop art", sous_titre: "société de consommation", principal: true}
      - {id: design, titre: "Architecture et design", sous_titre: "nouvelles technologies"}
      - {id: ecologie, titre: "Énergie et climat", sous_titre: "sujet artistique récent"}
      - {id: metissage, titre: "Métissages", sous_titre: "globalisation, échanges"}
    liens:
      - {de: popart, vers: design, libelle: "même époque"}
      - {de: design, vers: ecologie, libelle: "évolution récente"}
      - {de: popart, vers: metissage, libelle: "monde ouvert"}
    jules: "Le **pop art** joue sur l'ambiguïté : il fascine autant qu'il critique les objets de la société de consommation."

  - id: schema
    type: schema
    titre: "Depuis 1945 : quatre grandes évolutions"
    svg: "theme-8-consommation-de-masse.svg"
    jules: "Ces quatre évolutions ne se suivent pas : elles se déroulent souvent **en même temps**, depuis 1945 jusqu'à aujourd'hui."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1945, max: 2015, pas: 1, depart: 1962}
      - {id: curseur-debut, nom: début, min: 1945, max: 1945, pas: 1, depart: 1945}
      - {id: curseur-fin, nom: fin, min: 2015, max: 2015, pas: 1, depart: 2015}
    lectures:
      - {si: "date < 1960", texte: "**Après-guerre** : Le Corbusier construit la Cité radieuse de Marseille (1947-1952)."}
      - {si: "date >= 1960 && date < 1970", texte: "**Pop art** : Warhol peint les Campbell's Soup Cans (1962), des boîtes de soupe comme dans un magasin."}
      - {si: "date >= 1970 && date < 1990", texte: "Le **hip-hop** naît à New York (années 1970) ; Centre Pompidou (1977) ; Christo et Jeanne-Claude emballent le Pont-Neuf (1985)."}
      - {si: "date >= 1990", texte: "Musée Guggenheim de Bilbao (1997) ; en 2015, Ice Watch d'Olafur Eliasson pendant la conférence sur le **climat** de Paris."}
    jules: "Une décennie, une œuvre : années 1950, 1960, 1970, 1990. Range-les sur la frise avant de les décrire."

  - id: methode
    type: methode
    etapes:
      - "Repérer si une œuvre s'inspire d'objets ou d'images de la société de consommation : indice de pop art."
      - "Identifier une préoccupation environnementale ou énergétique explicite dans une œuvre contemporaine."
      - "Chercher des indices de métissage entre plusieurs traditions culturelles."
      - "Distinguer une démarche figurative d'une démarche abstraite dans l'art contemporain."
    jules: "Le pop art est né en Grande-Bretagne avant de se développer aux États-Unis dans les années 1950-1960."

  - id: piege
    type: piege
    mauvaise_idee: "Croire que le pop art se contente de copier des objets de consommation sans aucune intention critique."
    pourquoi_faux: "Le pop art critique et magnifie à la fois les objets de la société de consommation : il joue sur l'ambiguïté entre fascination et critique."
    bonne_idee: "Chercher ce que l'œuvre dénonce ou questionne derrière l'image reproduite, en plus de la reproduire."
    jules: "L'art contemporain depuis 1945 est très diversifié : il ne se réduit pas à un seul courant comme le pop art."

  - id: exemple
    type: exemple
    situation: "Un artiste reproduit en grand format et en couleurs vives l'emballage d'un produit de consommation courante."
    conclusion: "Cette démarche est caractéristique du pop art : elle s'approprie une image de la culture de masse en jouant sur l'ambiguïté entre critique et fascination."
    jules: "Le grand format et les couleurs vives transforment un objet banal en **œuvre d'art** qui interroge la société."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "les 4 évolutions depuis 1945"}
    jules: "Cherche un exemple d'œuvre qui mélange des influences de plusieurs cultures et explique ce métissage en une phrase."
