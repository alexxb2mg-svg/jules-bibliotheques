<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
</marker>
</defs>
<text class="th" x="340" y="26" text-anchor="middle">Œuvre unique ou œuvre reproductible ?</text>

<g class="node c-amber"><rect x="240" y="45" width="200" height="55" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="t" x="340" y="68" text-anchor="middle" dominant-baseline="central">Mécénat</text>
<text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central">finance l'artiste</text>

<line x1="300" y1="100" x2="180" y2="130" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="100" x2="500" y2="130" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="40" y="135" width="280" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="th" x="180" y="158" text-anchor="middle">Peinture, sculpture</text>
<text class="ts" x="180" y="185" text-anchor="middle" dominant-baseline="central">œuvre unique</text>
<text class="ts" x="180" y="205" text-anchor="middle" dominant-baseline="central">un seul exemplaire</text>

<g class="c-teal"><rect x="360" y="135" width="280" height="90" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="th" x="500" y="158" text-anchor="middle">Gravure imprimée</text>
<text class="ts" x="500" y="185" text-anchor="middle" dominant-baseline="central">œuvre reproductible</text>
<text class="ts" x="500" y="205" text-anchor="middle" dominant-baseline="central">plusieurs exemplaires identiques</text>

<g class="c-gray"><rect x="60" y="240" width="560" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/></g>
<text class="t" x="340" y="262" text-anchor="middle" dominant-baseline="central">Circulations : Flandres, France, Italie — arts du spectacle et musique</text>
</svg>
