notion: champ-photo-cinema
titre: "Le champ de la photographie et du cinéma"
matiere: histoire-des-arts
niveau: 3e
auteurs: ["hermes-hda2"]
licence: CC-BY-SA-4.0
sources:
  - {titre: "Vikidia, « Cinéma »", url: "https://fr.vikidia.org/w/index.php?title=Cin%C3%A9ma&oldid=2554372", licence: CC-BY-SA-3.0}
  - {titre: "Vikidia, « Photographie »", url: "https://fr.vikidia.org/w/index.php?title=Photographie&oldid=2482071", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
generation: {par: "hermes-hda2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: champ, titre: "Photo et cinéma", sous_titre: "images fixes ou en mouvement", principal: true}
      - {id: cadrage, titre: "Cadrage", sous_titre: "ce que l'image montre"}
      - {id: lumiere, titre: "Lumière", sous_titre: "éclairage, contraste"}
      - {id: montage, titre: "Montage", sous_titre: "assembler des plans"}
    liens:
      - {de: champ, vers: cadrage, libelle: "choix technique"}
      - {de: champ, vers: lumiere, libelle: "choix technique"}
      - {de: champ, vers: montage, libelle: "propre au cinéma"}
    jules: "Le **cadrage** décide de ce qui entre ou reste hors de l'image : c'est déjà un choix artistique fort."

  - id: schema
    type: schema
    titre: "De l'image fixe à l'image animée"
    svg: "champ-photo-cinema.svg"
    jules: "Le cinéma ajoute au cadrage et à la lumière de la photo un troisième outil essentiel : le **montage**, qui assemble les plans."

  - id: graphe-cinema
    type: graphe
    gabarit: decomposition-mouvement
    curseurs:
      - {id: curseur-images, nom: images, min: 3, max: 24, pas: 1, depart: 8}
      - {id: curseur-vitesse, nom: vitesse, min: 0.25, max: 4, pas: 0.25, depart: 1}
    lectures:
      - {si: "images <= 6", texte: "Peu d'images : on voit une suite de **photographies**, comme les études du galop d'un cheval par Eadweard Muybridge (1878)."}
      - {si: "images >= 7 && images <= 15", texte: "Le mouvement apparaît mais saute encore : il faut assez d'images chaque seconde pour que l'œil ne voie plus les photos une par une."}
      - {si: "images >= 16", texte: "Assez d'images : l'œil voit un mouvement continu, c'est l'**illusion** du cinéma (24 images par seconde depuis le cinéma sonore)."}
      - {si: "vitesse < 1", texte: "**Ralenti** : le cinéma montre ce que l'œil ne peut pas voir en vrai."}
    jules: "Un film n'est qu'une suite de photographies fixes : c'est leur nombre et leur vitesse de défilement qui créent l'impression de mouvement."

  - id: methode
    type: methode
    etapes:
      - "Observer le cadrage : que montre l'image, que laisse-t-elle hors champ ?"
      - "Analyser la lumière : naturelle ou artificielle, douce ou contrastée."
      - "Pour un film, repérer les effets du montage : rythme, enchaînement des plans."
      - "Distinguer une photographie documentaire d'une photographie mise en scène."
    jules: "Le **plan** est l'unité de base du cinéma : une prise de vue continue, avant une coupure au montage."

  - id: piege
    type: piege
    mauvaise_idee: "Croire qu'une photographie montre toujours la réalité telle quelle, sans aucun choix de l'auteur."
    pourquoi_faux: "Le cadrage, la lumière et le moment choisi transforment déjà la réalité en une interprétation personnelle du photographe."
    bonne_idee: "Toujours chercher les choix faits par le photographe ou le réalisateur avant de parler de simple reproduction du réel."
    jules: "Même une photographie qui semble prise sur le vif résulte d'un choix de cadrage et d'un instant précis."

  - id: exemple
    type: exemple
    situation: "Un film enchaîne rapidement de courts plans montrant différents visages inquiets juste avant un événement dramatique."
    conclusion: "Ce choix de montage rapide crée un sentiment de tension chez le spectateur, en accélérant le rythme perçu de la scène."
    jules: "Le **montage** ne se contente pas d'assembler les plans : il construit aussi le rythme et l'émotion du récit."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "cadrage, plan, montage", outil: "lexique"}
    jules: "Observe un extrait de film et note en une phrase l'effet créé par le montage sur ton ressenti."
