notion: comparer-oeuvres-filiations
titre: "Comparer des œuvres : filiations et parentés"
matiere: histoire-des-arts
niveau: 3e
auteurs: ["hermes-hda1"]
licence: CC-BY-SA-4.0
generation: {par: "hermes-hda1", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
sources:
  - {titre: "Vikidia, « Nature morte »", url: "https://fr.vikidia.org/w/index.php?title=Nature_morte&oldid=2096553", licence: CC-BY-SA-3.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: comparer, titre: "Comparer deux œuvres", sous_titre: "sur des critères précis", principal: true}
      - {id: criteres, titre: "Critères", sous_titre: "sujet, technique, composition"}
      - {id: filiation, titre: "Filiation", sous_titre: "époques différentes"}
      - {id: parente, titre: "Parenté", sous_titre: "œuvres contemporaines"}
    liens:
      - {de: comparer, vers: criteres}
      - {de: criteres, vers: filiation}
      - {de: criteres, vers: parente}
    jules: "Une **filiation** relie des époques différentes ; une **parenté** relie des œuvres contemporaines l'une de l'autre."

  - id: schema
    type: schema
    titre: "Filiation ou parenté ?"
    svg: "comparer-oeuvres-filiations.svg"
    jules: "Le critère qui distingue les deux liens, c'est le temps : époques différentes pour la filiation, même période pour la parenté."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1500, max: 2000, pas: 1, depart: 1538}
      - {id: curseur-intervalle, nom: intervalle, min: 0, max: 450, pas: 1, depart: 325}
      - {id: curseur-debut, nom: début, min: 1500, max: 1500, pas: 1, depart: 1500}
      - {id: curseur-fin, nom: fin, min: 2000, max: 2000, pas: 1, depart: 2000}
    lectures:
      - {si: "intervalle <= 10", texte: "Œuvres presque **contemporaines** : on cherche une **parenté** (Les Demoiselles d'Avignon, 1907, et Le Sacre du printemps, 1913)."}
      - {si: "intervalle > 10 && intervalle < 100", texte: "Quelques dizaines d'années d'écart : on se demande ce que la seconde œuvre **reprend** de la première."}
      - {si: "intervalle >= 100 && intervalle < 200", texte: "Goya peint Tres de mayo en 1814 ; Picasso reprend sa composition en 1951 (Massacre en Corée) : une **filiation**."}
      - {si: "intervalle >= 200", texte: "Olympia de Manet (1863) reprend la pose de la Vénus d'Urbin de Titien (1538) : 325 ans d'écart, une **filiation**."}
    jules: "Le repère bleu est la première œuvre, le vert la seconde. Mets 1538 et 325 ans d'écart : tu tombes sur 1863, Olympia de Manet."

  - id: methode
    type: methode
    etapes:
      - "Choisir des critères de comparaison précis (sujet, technique, composition, fonction)."
      - "Chercher si une œuvre plus récente reprend ou s'inspire visiblement d'une œuvre plus ancienne (filiation)."
      - "Pour deux œuvres contemporaines l'une de l'autre, chercher un esprit ou une préoccupation commune (parenté)."
      - "Justifier la comparaison par un élément concret, pas une impression générale."
    jules: "Comparer, ce n'est jamais juger laquelle est « meilleure » : c'est chercher méthodiquement points communs et différences."

  - id: piege
    type: piege
    mauvaise_idee: "Confondre filiation (influence entre époques différentes) et parenté (lien entre œuvres contemporaines)."
    pourquoi_faux: "Les deux liens ne reposent pas sur la même logique : l'un suppose le temps qui passe, l'autre une même période."
    bonne_idee: "Vérifier d'abord si les deux œuvres sont de la même époque ou non, avant de nommer le type de lien."
    jules: "Affirmer une **influence** sans élément concret (motif repris, composition similaire) qui la justifie est une erreur fréquente."

  - id: exemple
    type: exemple
    situation: "Comparer une nature morte du XVIIe siècle et une nature morte du début du XXe siècle."
    calcul: "Critère choisi : le sujet. Point commun : des objets disposés sur une table, dans les deux œuvres."
    conclusion: "Les deux œuvres partagent un même sujet : c'est une **parenté** de thème. Si la seconde reprend précisément la composition de la première, on parle alors de **filiation**."
    jules: "Un même sujet ne suffit pas toujours à conclure à une filiation : il faut un lien direct et concret."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "filiation, parenté, composition", outil: "lexique"}
    jules: "Entraîne-toi : compare deux œuvres étudiées sur un seul critère, sans mélanger plusieurs critères à la fois."
