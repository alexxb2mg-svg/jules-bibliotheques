<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Les 4 éléments constitutifs d'une œuvre majeure</text>

<circle cx="340" cy="150" r="55" class="c-gray" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text class="t" x="340" y="145" text-anchor="middle" dominant-baseline="central">Œuvre</text>
<text class="ts" x="340" y="163" text-anchor="middle" dominant-baseline="central">majeure</text>

<g class="node c-blue"><rect x="70" y="55" width="140" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="t" x="140" y="78" text-anchor="middle" dominant-baseline="central">Matériau</text>
<text class="ts" x="140" y="96" text-anchor="middle" dominant-baseline="central">ou technique</text>
<line x1="180" y1="110" x2="300" y2="130" stroke="#374151" stroke-width="1.5"/>

<g class="node c-teal"><rect x="470" y="55" width="140" height="55" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="t" x="540" y="78" text-anchor="middle" dominant-baseline="central">Forme</text>
<text class="ts" x="540" y="96" text-anchor="middle" dominant-baseline="central">composition, dimensions</text>
<line x1="500" y1="110" x2="380" y2="130" stroke="#374151" stroke-width="1.5"/>

<g class="node c-purple"><rect x="70" y="190" width="140" height="55" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="140" y="213" text-anchor="middle" dominant-baseline="central">Sens</text>
<text class="ts" x="140" y="231" text-anchor="middle" dominant-baseline="central">intention supposée</text>
<line x1="180" y1="190" x2="300" y2="170" stroke="#374151" stroke-width="1.5"/>

<g class="node c-amber"><rect x="470" y="190" width="140" height="55" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="t" x="540" y="213" text-anchor="middle" dominant-baseline="central">Fonction</text>
<text class="ts" x="540" y="231" text-anchor="middle" dominant-baseline="central">religieuse, décorative…</text>
<line x1="500" y1="190" x2="380" y2="170" stroke="#374151" stroke-width="1.5"/>

<text class="ts" x="340" y="280" text-anchor="middle">Pas à l'échelle. Les 4 éléments s'associent à une époque et une aire géographique.</text>
</svg>
