<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">L'art antique et ses fonctions dans la société</text>

<circle cx="170" cy="140" r="45" class="c-gray" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text class="t" x="170" y="135" text-anchor="middle" dominant-baseline="central">Ville</text>
<text class="ts" x="170" y="153" text-anchor="middle" dominant-baseline="central">antique</text>

<g class="node c-blue"><rect x="30" y="200" width="140" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="t" x="100" y="220" text-anchor="middle" dominant-baseline="central">Architecture</text>
<text class="ts" x="100" y="238" text-anchor="middle" dominant-baseline="central">colonnes, frontons</text>
<line x1="130" y1="180" x2="130" y2="200" stroke="#374151" stroke-width="1.5"/>

<g class="node c-teal"><rect x="200" y="200" width="140" height="55" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="t" x="270" y="220" text-anchor="middle" dominant-baseline="central">Mythes</text>
<text class="ts" x="270" y="238" text-anchor="middle" dominant-baseline="central">valeurs, pouvoir</text>
<line x1="210" y1="180" x2="210" y2="200" stroke="#374151" stroke-width="1.5"/>

<circle cx="510" cy="140" r="45" class="c-gray" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text class="t" x="510" y="135" text-anchor="middle" dominant-baseline="central">Corps</text>
<text class="ts" x="510" y="153" text-anchor="middle" dominant-baseline="central">représenté</text>

<g class="node c-purple"><rect x="380" y="200" width="140" height="55" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="450" y="220" text-anchor="middle" dominant-baseline="central">Conventions</text>
<text class="ts" x="450" y="238" text-anchor="middle" dominant-baseline="central">taille = importance</text>
<line x1="450" y1="180" x2="480" y2="200" stroke="#374151" stroke-width="1.5"/>

<g class="node c-amber"><rect x="540" y="200" width="140" height="55" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="t" x="610" y="220" text-anchor="middle" dominant-baseline="central">Pas de perspective</text>
<text class="ts" x="610" y="238" text-anchor="middle" dominant-baseline="central">différent du réalisme</text>
<line x1="570" y1="180" x2="560" y2="200" stroke="#374151" stroke-width="1.5"/>

<line x1="215" y1="140" x2="465" y2="140" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
<text class="ts" x="340" y="130" text-anchor="middle" dominant-baseline="central">liées par la fonction sociale</text>
</svg>
