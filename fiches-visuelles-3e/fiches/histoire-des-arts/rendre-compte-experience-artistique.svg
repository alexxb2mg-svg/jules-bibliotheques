<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<text class="th" x="340" y="26" text-anchor="middle">Raconter une expérience artistique vécue</text>

<g class="node c-blue"><rect x="60" y="55" width="240" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/></g>
<text class="t" x="180" y="80" text-anchor="middle" dominant-baseline="central">Spectateur</text>
<text class="ts" x="180" y="100" text-anchor="middle" dominant-baseline="central">concert, exposition, spectacle</text>

<g class="node c-teal"><rect x="380" y="55" width="240" height="60" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/></g>
<text class="t" x="500" y="80" text-anchor="middle" dominant-baseline="central">Pratiquant</text>
<text class="ts" x="500" y="100" text-anchor="middle" dominant-baseline="central">théâtre, musique, arts plastiques</text>

<line x1="180" y1="115" x2="180" y2="145" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="500" y1="115" x2="500" y2="145" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>

<g class="c-amber"><rect x="60" y="150" width="240" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/></g>
<text class="t" x="180" y="175" text-anchor="middle" dominant-baseline="central">Contexte</text>
<text class="ts" x="180" y="195" text-anchor="middle" dominant-baseline="central">quoi, où, quand</text>

<g class="c-purple"><rect x="380" y="150" width="240" height="60" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/></g>
<text class="t" x="500" y="175" text-anchor="middle" dominant-baseline="central">Moment précis</text>
<text class="ts" x="500" y="195" text-anchor="middle" dominant-baseline="central">pas un résumé flou</text>

<line x1="180" y1="210" x2="340" y2="235" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="500" y1="210" x2="340" y2="235" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>

<g class="c-coral"><rect x="200" y="240" width="280" height="45" rx="8" fill="#ffe4e0" stroke="#c94b4b" stroke-width="1.5"/></g>
<text class="t" x="340" y="263" text-anchor="middle" dominant-baseline="central">Apport personnel argumenté</text>
</svg>
