generation: {par: "hermes-hda2", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: champ, titre: "Arts décoratifs", sous_titre: "beauté et usage quotidien", principal: true}
      - {id: mobilier, titre: "Mobilier", sous_titre: "meubles, sièges"}
      - {id: design, titre: "Design", sous_titre: "objets, industrie"}
      - {id: orfevrerie, titre: "Arts du métal", sous_titre: "bijoux, orfèvrerie"}
    liens:
      - {de: champ, vers: mobilier, libelle: "discipline"}
      - {de: champ, vers: design, libelle: "discipline moderne"}
      - {de: champ, vers: orfevrerie, libelle: "discipline"}
    jules: "Contrairement à un tableau, un objet d'art décoratif a d'abord une **fonction** : s'asseoir, éclairer, ranger."

  - id: schema
    type: schema
    titre: "Beauté et fonction : le double critère des arts décoratifs"
    svg: "champ-arts-decoratifs.svg"
    jules: "Un objet d'arts décoratifs réussi équilibre les deux exigences : il doit être à la fois beau et utile."

  - id: methode
    type: methode
    etapes:
      - "Identifier la fonction pratique de l'objet observé (s'asseoir, contenir, éclairer)."
      - "Repérer les choix esthétiques : matériaux, formes, décor, couleurs."
      - "Distinguer un objet artisanal unique d'un objet de design pensé pour être produit en série."
      - "Situer l'objet dans son époque grâce à son style (courbes, lignes géométriques, matériaux industriels)."
    jules: "Le **design** pense un objet pour qu'il puisse être fabriqué en plusieurs exemplaires identiques, à la différence d'une pièce unique d'artisanat."

  - id: piege
    type: piege
    mauvaise_idee: "Juger un objet d'arts décoratifs uniquement sur son apparence, sans considérer son usage."
    pourquoi_faux: "Les arts décoratifs se définissent justement par l'union de la beauté et de la fonction : ignorer l'usage revient à mal comprendre la discipline."
    bonne_idee: "Toujours se demander à quoi sert concrètement l'objet avant de commenter son style."
    jules: "Un siège très décoré mais inconfortable reste un objet d'arts décoratifs raté sur le plan fonctionnel."

  - id: exemple
    type: exemple
    situation: "Une chaise associe une structure en métal tubulaire, des lignes épurées et une assise pensée pour être produite en grande quantité."
    conclusion: "Cet objet relève du design : il associe une réflexion esthétique moderne à une pensée de fabrication industrielle en série."
    jules: "Les matériaux industriels et les lignes épurées sont des indices fréquents du **design** du XXe siècle."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "design, orfèvrerie, mobilier", outil: "lexique"}
    jules: "Observe un objet de ta maison et explique en une phrase comment il équilibre beauté et fonction."
